    <style>
        :root {
            --black: #0d0d0d;
            --charcoal: #1a1a1a;
            --surface: #141414;
            --surface2: #1e1e1e;
            --gold: #d4af37;
            --gold-light: #f4d03f;
            --gold-dark: #a67c00;
            --cream: #f5f0e1;
            --cream-dim: #b0a88a;
            --brass: #b5882a;
            --border: #2a2a2a;
            --border-light: #333;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Cormorant Garamond', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: var(--font-body);
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--cream);
            background: var(--black);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        header {
            text-align: center;
            padding: 2.5rem 0 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--cream);
            letter-spacing: 0.02em;
        }

        header h1 span {
            color: var(--gold);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--cream-dim);
            margin-top: 0.4rem;
            letter-spacing: 0.08em;
        }

        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--cream-dim);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.3rem 0.8rem;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--gold);
            border-color: var(--gold-dark);
        }

        /* Controls bar */
        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            padding: 0.45rem 0.75rem;
            background: var(--black);
            color: var(--cream);
            border: 1px solid var(--border);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--gold-dark);
        }

        .search-box::placeholder {
            color: #555;
        }

        .filter-btn {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 0.35rem 0.65rem;
            background: transparent;
            color: var(--cream-dim);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .filter-btn:hover {
            color: var(--cream);
            border-color: var(--border-light);
        }

        .filter-btn.active {
            color: var(--gold);
            border-color: var(--gold-dark);
            background: rgba(212, 175, 55, 0.08);
        }

        .count-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--cream-dim);
            margin-left: auto;
            white-space: nowrap;
        }

        /* Table */
        .table-wrap {
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--cream-dim);
            background: var(--surface);
            padding: 0.6rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
            transition: color 0.15s;
        }

        th:hover { color: var(--gold); }

        th.sorted { color: var(--gold); }

        th .arrow {
            font-size: 0.65rem;
            margin-left: 0.3rem;
            opacity: 0.4;
        }

        th.sorted .arrow { opacity: 1; }

        /* Column widths */
        th:nth-child(1), td:nth-child(1) { width: 40%; }
        th:nth-child(2), td:nth-child(2) { width: 18%; }
        th:nth-child(3), td:nth-child(3) { width: 14%; }
        th:nth-child(4), td:nth-child(4) { width: 28%; }

        td {
            padding: 0.45rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        tr { transition: background 0.1s; }

        tr:hover {
            background: var(--surface2);
        }

        td a {
            color: var(--cream);
            text-decoration: none;
            transition: color 0.15s;
        }

        td a:hover { color: var(--gold-light); }

        .section-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border: 1px solid var(--border);
            color: var(--cream-dim);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: inline-block;
        }

        .date-cell {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--cream-dim);
        }

        .path-cell {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: #555;
        }

        /* Section tag colors */
        .section-tag[data-s="styles"] { border-color: #8b5cf6; color: #a78bfa; }
        .section-tag[data-s="stories"] { border-color: #0891b2; color: #22d3ee; }
        .section-tag[data-s="techguides"] { border-color: #059669; color: #34d399; }
        .section-tag[data-s="games"] { border-color: #dc2626; color: #f87171; }
        .section-tag[data-s="tools"] { border-color: #d97706; color: #fbbf24; }
        .section-tag[data-s="architecture"] { border-color: #2563eb; color: #60a5fa; }
        .section-tag[data-s="music"] { border-color: #db2777; color: #f472b6; }
        .section-tag[data-s="news"] { border-color: #65a30d; color: #a3e635; }
        .section-tag[data-s="kids"] { border-color: #ea580c; color: #fb923c; }
        .section-tag[data-s="api-alley"] { border-color: #7c3aed; color: #a78bfa; }
        .section-tag[data-s="portfolio"] { border-color: var(--gold-dark); color: var(--gold); }
        .section-tag[data-s="dataviz"] { border-color: #0d9488; color: #5eead4; }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--cream-dim);
            font-style: italic;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 0 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #444;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        footer a { color: var(--gold-dark); text-decoration: none; }
        footer a:hover { color: var(--gold); }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .controls { flex-direction: column; }
            .search-box { min-width: 100%; }
            th:nth-child(4), td:nth-child(4) { display: none; }
            th:nth-child(1), td:nth-child(1) { width: 50%; }
            th:nth-child(2), td:nth-child(2) { width: 25%; }
            th:nth-child(3), td:nth-child(3) { width: 25%; }
            .back-link { position: static; display: inline-block; margin-bottom: 1rem; }
        }
    </style>

        // State
        let sortCol = 'd';
        let sortAsc = false; // newest first by default
        let filterSection = 'all';
        let searchQuery = '';

        function init() {
            buildFilterButtons();
            attachEvents();
            // Default: sort by date descending
            render();
            updateSortHeaders();
        }

        function buildFilterButtons() {
            const controls = document.getElementById('controls');
            const search = document.getElementById('search');
            const badge = document.getElementById('countBadge');

            // Count sections
            const counts = {};
            DATA.forEach(e => counts[e.s] = (counts[e.s] || 0) + 1);

            // Sort sections by count descending
            const sections = Object.entries(counts).sort((a, b) => b[1] - a[1]);

            sections.forEach(([s, count]) => {
                const meta = SECTION_META[s] || { icon: '📄', label: s };
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.section = s;
                btn.textContent = `${meta.label} (${count})`;
                controls.insertBefore(btn, badge);
            });
        }

        function attachEvents() {
            // Search
            document.getElementById('search').addEventListener('input', e => {
                searchQuery = e.target.value.toLowerCase();
                render();
            });

            // Filter buttons
            document.getElementById('controls').addEventListener('click', e => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterSection = btn.dataset.section;
                render();
            });

            // Sort headers
            document.querySelectorAll('th[data-col]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.dataset.col;
                    if (sortCol === col) {
                        sortAsc = !sortAsc;
                    } else {
                        sortCol = col;
                        sortAsc = col === 'd' ? false : true;
                    }
                    updateSortHeaders();
                    render();
                });
            });

            // Keyboard shortcut: / to focus search
            document.addEventListener('keydown', e => {
                if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
                    e.preventDefault();
                    document.getElementById('search').focus();
                }
            });
        }

        function updateSortHeaders() {
            document.querySelectorAll('th[data-col]').forEach(th => {
                const col = th.dataset.col;
                th.classList.toggle('sorted', col === sortCol);
                const arrow = th.querySelector('.arrow');
                if (col === sortCol) {
                    arrow.textContent = sortAsc ? '▲' : '▼';
                } else {
                    arrow.textContent = '▲';
                }
            });
        }

        function render() {
            let filtered = DATA;

            // Filter by section
            if (filterSection !== 'all') {
                filtered = filtered.filter(e => e.s === filterSection);
            }

            // Filter by search
            if (searchQuery) {
                filtered = filtered.filter(e =>
                    e.n.toLowerCase().includes(searchQuery) ||
                    e.p.toLowerCase().includes(searchQuery) ||
                    e.s.toLowerCase().includes(searchQuery)
                );
            }

            // Sort
            filtered.sort((a, b) => {
                let va = a[sortCol], vb = b[sortCol];
                if (typeof va === 'string') va = va.toLowerCase();
                if (typeof vb === 'string') vb = vb.toLowerCase();
                if (va < vb) return sortAsc ? -1 : 1;
                if (va > vb) return sortAsc ? 1 : -1;
                return 0;
            });

            // Render
            const tbody = document.getElementById('tbody');
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No pages match your search.</td></tr>';
            } else {
                // Use DocumentFragment for performance
                const frag = document.createDocumentFragment();
                filtered.forEach(e => {
                    const tr = document.createElement('tr');
                    const meta = SECTION_META[e.s] || { icon: '📄', label: e.s };
                    tr.innerHTML = `
                        <td><a href="${e.p}">${e.n}</a></td>
                        <td><span class="section-tag" data-s="${e.s}">${meta.label}</span></td>
                        <td class="date-cell">${e.d}</td>
                        <td class="path-cell">${e.p}</td>
                    `;
                    frag.appendChild(tr);
                });
                tbody.innerHTML = '';
                tbody.appendChild(frag);
            }

            document.getElementById('countBadge').textContent = `${filtered.length} / ${DATA.length}`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
