name: Update SEO files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - '.github/workflows/update-seo.yml'

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate sitemap and meta descriptions
        run: |
          node scripts/generate-sitemap.js
          node scripts/add-meta-descriptions.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && echo "No sitemap changes" || git commit -m "Update sitemap.xml [automated]"
          git add -A '*.html'
          git diff --cached --quiet && echo "No meta description changes" || git commit -m "Add meta descriptions to new pages [automated]"
          git push
