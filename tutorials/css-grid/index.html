<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Tutorial — Blueprint Theme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS GRID TUTORIAL — BLUEPRINT THEME
           Themed from styles/blueprint.html
           ============================================ */
        :root {
            /* Blueprint blues */
            --bp-deep: #0a1628;
            --bp-dark: #0d1f3c;
            --bp-base: #0f2847;
            --bp-mid: #143560;
            --bp-light: #1a4275;
            --bp-highlight: #1e528f;
            --bp-glow: #2568ab;
            /* Lines & text */
            --line-primary: #e8f0ff;
            --line-secondary: rgba(232, 240, 255, 0.6);
            --line-tertiary: rgba(232, 240, 255, 0.3);
            --line-faint: rgba(232, 240, 255, 0.12);
            --line-ghost: rgba(232, 240, 255, 0.06);
            /* Accents */
            --accent-cyan: #5bc0eb;
            --accent-yellow: #f4d35e;
            --accent-red: #ee6352;
            --accent-green: #59cd90;
            --accent-orange: #f9a03f;
            /* Typography */
            --font-technical: 'IBM Plex Mono', 'Consolas', monospace;
            --font-label: 'Share Tech Mono', 'Courier New', monospace;
            --font-code: 'Source Code Pro', 'Monaco', monospace;
            /* Spacing */
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-7: 32px;
            --space-8: 40px;
            /* Grid */
            --grid-size: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: var(--font-technical);
            font-size: 0.875rem;
            color: var(--line-primary);
            background: var(--bp-deep);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Blueprint grid background */
        .blueprint-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 23px, var(--line-faint) 23px, var(--line-faint) 24px),
                repeating-linear-gradient(90deg, transparent, transparent 23px, var(--line-faint) 23px, var(--line-faint) 24px);
            pointer-events: none;
        }

        /* Layout */
        .app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Top bar ─────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-6);
            background: var(--bp-dark);
            border-bottom: 1.5px solid var(--line-tertiary);
            flex-shrink: 0;
        }

        .back-link {
            font-family: var(--font-label);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--line-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-cyan); }
        .back-link::before { content: '\2190  '; }

        .tutorial-title {
            font-family: var(--font-label);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--line-primary);
        }
        .tutorial-title span {
            color: var(--accent-cyan);
        }

        /* ── Progress bar ────────────────────── */
        .progress-container {
            background: var(--bp-dark);
            border-bottom: 1px solid var(--line-faint);
            padding: var(--space-2) var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-4);
            flex-shrink: 0;
        }

        .progress-label {
            font-family: var(--font-label);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--line-secondary);
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--line-faint);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            border-radius: 2px;
            transition: width 0.4s ease;
            box-shadow: 0 0 6px rgba(91, 192, 235, 0.4);
        }

        .step-dots {
            display: flex;
            gap: 6px;
        }
        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid var(--line-tertiary);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
        }
        .step-dot.active {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 6px rgba(91, 192, 235, 0.5);
        }
        .step-dot.completed {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }
        .step-dot:hover {
            border-color: var(--accent-cyan);
        }

        /* ── Main content area ───────────────── */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        /* ── Explanation panel ────────────────── */
        .explanation {
            grid-column: 1 / -1;
            background: var(--bp-dark);
            border-bottom: 1px solid var(--line-tertiary);
            padding: var(--space-6);
            max-height: 200px;
            overflow-y: auto;
        }

        .step-badge {
            font-family: var(--font-label);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent-cyan);
            margin-bottom: var(--space-2);
        }

        .explanation h2 {
            font-family: var(--font-label);
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--line-primary);
            margin-bottom: var(--space-3);
        }

        .explanation p {
            font-family: var(--font-technical);
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--line-secondary);
            line-height: 1.7;
            max-width: 80ch;
        }

        .explanation code {
            background: rgba(91, 192, 235, 0.1);
            color: var(--accent-cyan);
            padding: 1px 6px;
            border-radius: 3px;
            font-family: var(--font-code);
            font-size: 0.8rem;
        }

        /* ── Code editor panel ───────────────── */
        .editor-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line-faint);
            background: var(--bp-deep);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-2) var(--space-4);
            background: var(--bp-dark);
            border-bottom: 1px solid var(--line-faint);
        }

        .panel-label {
            font-family: var(--font-label);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--line-secondary);
        }

        .btn-reset {
            font-family: var(--font-label);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-orange);
            background: none;
            border: 1px solid rgba(249, 160, 63, 0.3);
            padding: 3px 10px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
        }
        .btn-reset:hover {
            background: rgba(249, 160, 63, 0.1);
            border-color: var(--accent-orange);
        }

        .code-editor {
            flex: 1;
            width: 100%;
            background: var(--bp-deep);
            color: var(--accent-cyan);
            font-family: var(--font-code);
            font-size: 0.82rem;
            line-height: 1.7;
            border: none;
            padding: var(--space-4);
            resize: none;
            outline: none;
            tab-size: 2;
        }
        .code-editor::selection {
            background: rgba(91, 192, 235, 0.25);
        }

        /* ── Preview panel ───────────────────── */
        .preview-panel {
            display: flex;
            flex-direction: column;
            background: var(--bp-base);
        }

        .preview-area {
            flex: 1;
            padding: var(--space-6);
            overflow: auto;
            position: relative;
        }

        /* The live grid container where user CSS is applied */
        .grid-demo {
            width: 100%;
            min-height: 200px;
        }

        .grid-demo .item {
            background: rgba(91, 192, 235, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--line-primary);
            font-family: var(--font-label);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3);
            min-height: 48px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.2s;
        }
        .grid-demo .item:nth-child(2) {
            background: rgba(244, 211, 94, 0.12);
            border-color: var(--accent-yellow);
        }
        .grid-demo .item:nth-child(3) {
            background: rgba(89, 205, 144, 0.12);
            border-color: var(--accent-green);
        }
        .grid-demo .item:nth-child(4) {
            background: rgba(238, 99, 82, 0.12);
            border-color: var(--accent-red);
        }
        .grid-demo .item:nth-child(5) {
            background: rgba(249, 160, 63, 0.12);
            border-color: var(--accent-orange);
        }
        .grid-demo .item:nth-child(6) {
            background: rgba(91, 192, 235, 0.08);
            border-color: rgba(91, 192, 235, 0.6);
        }

        /* ── Bottom navigation ───────────────── */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) var(--space-6);
            background: var(--bp-dark);
            border-top: 1.5px solid var(--line-tertiary);
            flex-shrink: 0;
        }

        .btn {
            font-family: var(--font-label);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 8px 20px;
            border: 1px solid var(--line-tertiary);
            background: none;
            color: var(--line-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(91, 192, 235, 0.15);
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-primary {
            background: rgba(91, 192, 235, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .btn-primary:hover:not(:disabled) {
            background: rgba(91, 192, 235, 0.2);
        }

        .nav-step-info {
            font-family: var(--font-label);
            font-size: 0.65rem;
            color: var(--line-secondary);
            letter-spacing: 0.08em;
        }

        /* ── Responsive ──────────────────────── */
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            .editor-panel {
                border-right: none;
                border-bottom: 1px solid var(--line-faint);
                max-height: 250px;
            }
            .preview-panel {
                min-height: 250px;
            }
            .explanation {
                max-height: 160px;
            }
            .tutorial-title { display: none; }
            .step-dots { display: none; }
        }

        @media (max-width: 480px) {
            .top-bar { padding: var(--space-2) var(--space-3); }
            .nav-bar { padding: var(--space-2) var(--space-3); }
            .progress-container { padding: var(--space-2) var(--space-3); }
            .explanation { padding: var(--space-4); }
            .btn { padding: 6px 12px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="blueprint-bg"></div>

    <div class="app">
        <!-- Top bar -->
        <div class="top-bar">
            <a href="../index.html" class="back-link">Tutorials</a>
            <span class="tutorial-title">CSS Grid <span>// Blueprint</span></span>
            <span id="drawingNo" style="font-family: var(--font-label); font-size: 0.55rem; color: var(--line-tertiary); letter-spacing: 0.08em; text-transform: uppercase;">DWG. GRID-001</span>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <span class="progress-label">Progress</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 14.28%"></div>
            </div>
            <span class="progress-label" id="progressText">1 / 7</span>
            <div class="step-dots" id="stepDots"></div>
        </div>

        <!-- Main content -->
        <div class="main">
            <!-- Explanation -->
            <div class="explanation" id="explanation">
                <!-- Populated by JS -->
            </div>

            <!-- Code editor -->
            <div class="editor-panel">
                <div class="panel-header">
                    <span class="panel-label">CSS Editor</span>
                    <button class="btn-reset" id="btnReset" title="Reset to default code">Reset</button>
                </div>
                <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
            </div>

            <!-- Live preview -->
            <div class="preview-panel">
                <div class="panel-header">
                    <span class="panel-label">Live Preview</span>
                    <span class="panel-label" id="previewInfo"></span>
                </div>
                <div class="preview-area" id="previewArea">
                    <div class="grid-demo" id="gridDemo"></div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <button class="btn" id="btnPrev" disabled>&larr; Prev</button>
            <span class="nav-step-info" id="navStepInfo"></span>
            <button class="btn btn-primary" id="btnNext">Next &rarr;</button>
        </div>
    </div>

    <style id="userStyles"></style>

    <script>
    (function() {
        'use strict';

        // ── Step data ────────────────────────────────────────
        var steps = [
            {
                title: 'grid-template-columns',
                badge: 'Step 1 of 7',
                explanation: '<p>The <code>display: grid</code> property turns an element into a grid container. ' +
                    'Use <code>grid-template-columns</code> to define how many columns the grid has and how wide each one is.</p>' +
                    '<p>Try changing the column values below. Use <code>px</code>, <code>%</code>, or the <code>fr</code> unit ' +
                    '(fractional unit -- <code>1fr 2fr</code> means the second column is twice as wide).</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 1fr 1fr 1fr;\n' +
                    '}',
                items: ['A', 'B', 'C', 'D', 'E', 'F']
            },
            {
                title: 'grid-template-rows',
                badge: 'Step 2 of 7',
                explanation: '<p><code>grid-template-rows</code> defines explicit row heights. Without it, rows size to fit their content.</p>' +
                    '<p>Try setting explicit row heights. Mix units like <code>100px</code>, <code>1fr</code>, or <code>auto</code>. ' +
                    'Notice how <code>fr</code> distributes remaining space after fixed rows take their share.</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 1fr 1fr;\n' +
                    '  grid-template-rows: 80px 120px 60px;\n' +
                    '}',
                items: ['A', 'B', 'C', 'D', 'E', 'F']
            },
            {
                title: 'gap',
                badge: 'Step 3 of 7',
                explanation: '<p>The <code>gap</code> property adds spacing between grid tracks (rows and columns) without ' +
                    'adding space around the outer edges.</p>' +
                    '<p>You can use a single value for uniform gaps, or two values: <code>gap: row-gap column-gap</code>. ' +
                    'Try <code>gap: 8px 24px</code> for tighter rows and wider columns.</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 1fr 1fr 1fr;\n' +
                    '  gap: 16px;\n' +
                    '}',
                items: ['A', 'B', 'C', 'D', 'E', 'F']
            },
            {
                title: 'grid-template-areas',
                badge: 'Step 4 of 7',
                explanation: '<p><code>grid-template-areas</code> lets you name regions of the grid using a visual, text-based ' +
                    'layout map. Each quoted string is one row; each word is a named area.</p>' +
                    '<p>Items are placed into areas using <code>grid-area: name</code>. Use a dot <code>.</code> for an empty cell. ' +
                    'Try rearranging the area names to restructure the layout.</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 200px 1fr;\n' +
                    '  grid-template-rows: auto 1fr auto;\n' +
                    '  grid-template-areas:\n' +
                    '    "header header"\n' +
                    '    "sidebar main"\n' +
                    '    "footer footer";\n' +
                    '  gap: 8px;\n' +
                    '}\n' +
                    '.grid-demo .item:nth-child(1) { grid-area: header; }\n' +
                    '.grid-demo .item:nth-child(2) { grid-area: sidebar; }\n' +
                    '.grid-demo .item:nth-child(3) { grid-area: main; }\n' +
                    '.grid-demo .item:nth-child(4) { grid-area: footer; }',
                items: ['Header', 'Sidebar', 'Main', 'Footer']
            },
            {
                title: 'Spanning Cells',
                badge: 'Step 5 of 7',
                explanation: '<p>Grid items can span multiple columns or rows using <code>grid-column</code> and <code>grid-row</code>.</p>' +
                    '<p>The syntax <code>grid-column: 1 / 3</code> means "start at line 1, end at line 3" (spanning 2 columns). ' +
                    'You can also use <code>span 2</code> as a shorthand. Try making different items span the grid.</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 1fr 1fr 1fr;\n' +
                    '  gap: 8px;\n' +
                    '}\n' +
                    '.grid-demo .item:nth-child(1) {\n' +
                    '  grid-column: 1 / 3;\n' +
                    '}\n' +
                    '.grid-demo .item:nth-child(4) {\n' +
                    '  grid-column: span 2;\n' +
                    '}',
                items: ['A (spans 2 cols)', 'B', 'C', 'D (spans 2 cols)', 'E']
            },
            {
                title: 'Responsive: minmax + auto-fill',
                badge: 'Step 6 of 7',
                explanation: '<p>The <code>repeat()</code> function with <code>auto-fill</code> or <code>auto-fit</code> creates ' +
                    'responsive grids that adapt to the container width without media queries.</p>' +
                    '<p><code>minmax(200px, 1fr)</code> means each column is at least 200px but can grow to fill space. ' +
                    '<code>auto-fill</code> creates as many columns as will fit. Try changing the minimum width.</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns:\n' +
                    '    repeat(auto-fill, minmax(120px, 1fr));\n' +
                    '  gap: 12px;\n' +
                    '}',
                items: ['A', 'B', 'C', 'D', 'E', 'F']
            },
            {
                title: 'Challenge: Dashboard Layout',
                badge: 'Step 7 of 7 -- Final Challenge',
                explanation: '<p>Put it all together! Build a dashboard layout with a header spanning the full width, ' +
                    'a sidebar, a main content area, and a footer.</p>' +
                    '<p>Use <code>grid-template-areas</code>, <code>grid-template-columns</code>, and <code>gap</code>. ' +
                    'Bonus: make the sidebar a fixed width and the main area flexible. The starter code is incomplete -- finish it!</p>',
                defaultCode:
                    '.grid-demo {\n' +
                    '  display: grid;\n' +
                    '  grid-template-columns: 160px 1fr 1fr;\n' +
                    '  grid-template-rows: 60px 1fr 1fr 40px;\n' +
                    '  grid-template-areas:\n' +
                    '    "header header header"\n' +
                    '    "nav    main   main"\n' +
                    '    "nav    main   main"\n' +
                    '    "footer footer footer";\n' +
                    '  gap: 8px;\n' +
                    '  min-height: 350px;\n' +
                    '}\n' +
                    '.grid-demo .item:nth-child(1) { grid-area: header; }\n' +
                    '.grid-demo .item:nth-child(2) { grid-area: nav; }\n' +
                    '.grid-demo .item:nth-child(3) { grid-area: main; }\n' +
                    '.grid-demo .item:nth-child(4) { grid-area: footer; }',
                items: ['Header', 'Nav', 'Main Content', 'Footer']
            }
        ];

        var currentStep = 0;

        // ── DOM refs ─────────────────────────────────────────
        var codeEditor = document.getElementById('codeEditor');
        var gridDemo = document.getElementById('gridDemo');
        var userStyles = document.getElementById('userStyles');
        var explanation = document.getElementById('explanation');
        var progressFill = document.getElementById('progressFill');
        var progressText = document.getElementById('progressText');
        var stepDotsContainer = document.getElementById('stepDots');
        var navStepInfo = document.getElementById('navStepInfo');
        var previewInfo = document.getElementById('previewInfo');
        var btnPrev = document.getElementById('btnPrev');
        var btnNext = document.getElementById('btnNext');
        var btnReset = document.getElementById('btnReset');
        var drawingNo = document.getElementById('drawingNo');

        // ── Build step dots ──────────────────────────────────
        function buildDots() {
            stepDotsContainer.innerHTML = '';
            for (var i = 0; i < steps.length; i++) {
                var dot = document.createElement('button');
                dot.className = 'step-dot';
                dot.setAttribute('aria-label', 'Go to step ' + (i + 1));
                dot.dataset.step = i;
                dot.addEventListener('click', function() {
                    goToStep(parseInt(this.dataset.step));
                });
                stepDotsContainer.appendChild(dot);
            }
        }

        // ── Render step ──────────────────────────────────────
        function renderStep() {
            var step = steps[currentStep];

            // Explanation
            explanation.innerHTML =
                '<div class="step-badge">' + step.badge + '</div>' +
                '<h2>' + step.title + '</h2>' +
                step.explanation;

            // Code editor
            codeEditor.value = step.defaultCode;

            // Preview items
            gridDemo.innerHTML = '';
            for (var i = 0; i < step.items.length; i++) {
                var div = document.createElement('div');
                div.className = 'item';
                div.textContent = step.items[i];
                gridDemo.appendChild(div);
            }

            // Apply default CSS
            applyCSS();

            // Progress
            var pct = ((currentStep + 1) / steps.length * 100).toFixed(1);
            progressFill.style.width = pct + '%';
            progressText.textContent = (currentStep + 1) + ' / ' + steps.length;

            // Dots
            var dots = stepDotsContainer.querySelectorAll('.step-dot');
            for (var d = 0; d < dots.length; d++) {
                dots[d].classList.remove('active', 'completed');
                if (d < currentStep) dots[d].classList.add('completed');
                if (d === currentStep) dots[d].classList.add('active');
            }

            // Nav buttons
            btnPrev.disabled = currentStep === 0;
            if (currentStep === steps.length - 1) {
                btnNext.textContent = 'Complete!';
                btnNext.disabled = true;
            } else {
                btnNext.textContent = 'Next \u2192';
                btnNext.disabled = false;
            }

            // Nav info
            navStepInfo.textContent = step.title;

            // Preview info
            previewInfo.textContent = step.items.length + ' items';

            // Drawing number
            drawingNo.textContent = 'DWG. GRID-00' + (currentStep + 1);
        }

        // ── Apply CSS from editor to preview ─────────────────
        function applyCSS() {
            var css = codeEditor.value;
            // Scope all rules to #gridDemo by replacing .grid-demo with #gridDemo
            var scoped = css.replace(/\.grid-demo/g, '#gridDemo');
            userStyles.textContent = scoped;
        }

        // ── Navigation ───────────────────────────────────────
        function goToStep(n) {
            if (n < 0 || n >= steps.length) return;
            currentStep = n;
            renderStep();
        }

        // ── Events ───────────────────────────────────────────
        codeEditor.addEventListener('input', applyCSS);

        // Handle Tab key in textarea
        codeEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                applyCSS();
            }
        });

        btnPrev.addEventListener('click', function() { goToStep(currentStep - 1); });
        btnNext.addEventListener('click', function() { goToStep(currentStep + 1); });
        btnReset.addEventListener('click', function() {
            codeEditor.value = steps[currentStep].defaultCode;
            applyCSS();
        });

        // Keyboard nav
        document.addEventListener('keydown', function(e) {
            if (e.target === codeEditor) return; // Don't intercept typing
            if (e.key === 'ArrowLeft' && currentStep > 0) goToStep(currentStep - 1);
            if (e.key === 'ArrowRight' && currentStep < steps.length - 1) goToStep(currentStep + 1);
        });

        // ── Init ─────────────────────────────────────────────
        buildDots();
        renderStep();
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
