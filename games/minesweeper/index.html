<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper — Windows 3.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --win-black: #000000;
  --win-dark-blue: #000080;
  --win-light-gray: #C0C0C0;
  --win-dark-gray: #808080;
  --win-white: #FFFFFF;
  --win-red: #FF0000;
  --win-blue: #0000FF;
  --win-dark-green: #008000;
  --win-dark-cyan: #008080;
  --win-dark-red: #800000;
  --win-dark-magenta: #800080;
  --win-brown: #808000;
  --font-system: 'VT323', 'MS Sans Serif', Tahoma, sans-serif;
}

html { font-size: 16px; }

body {
  font-family: var(--font-system);
  font-size: 1.1rem;
  background: var(--win-dark-cyan);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  user-select: none;
  -webkit-user-select: none;
}

/* Back link */
.back-link {
  position: fixed;
  top: 12px;
  left: 16px;
  font-family: var(--font-system);
  font-size: 1.1rem;
  color: var(--win-white);
  text-decoration: none;
  background: var(--win-dark-gray);
  border: 2px solid;
  border-color: var(--win-white) var(--win-black) var(--win-black) var(--win-white);
  padding: 2px 10px;
  cursor: pointer;
  box-shadow: inset 1px 1px 0 var(--win-white), inset -1px -1px 0 var(--win-dark-gray);
}
.back-link:hover { background: var(--win-dark-blue); }

/* Window frame */
.window {
  background: var(--win-light-gray);
  border: 2px solid;
  border-color: var(--win-white) var(--win-black) var(--win-black) var(--win-white);
  box-shadow:
    inset 1px 1px 0 var(--win-white),
    inset -1px -1px 0 var(--win-dark-gray),
    4px 4px 0 rgba(0,0,0,0.3);
  display: inline-block;
}

/* Title bar */
.titlebar {
  background: var(--win-dark-blue);
  color: var(--win-white);
  padding: 2px 3px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: bold;
  letter-spacing: 0.5px;
  font-size: 1.1rem;
}

.titlebar-text {
  flex: 1;
  padding-left: 4px;
  white-space: nowrap;
}

.titlebar-buttons {
  display: flex;
  gap: 2px;
}

.titlebar-btn {
  width: 20px;
  height: 18px;
  background: var(--win-light-gray);
  border: 2px solid;
  border-color: var(--win-white) var(--win-black) var(--win-black) var(--win-white);
  box-shadow: inset 1px 1px 0 var(--win-white), inset -1px -1px 0 var(--win-dark-gray);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  color: var(--win-black);
  line-height: 1;
  padding: 0;
  font-family: var(--font-system);
}
.titlebar-btn:active {
  border-color: var(--win-black) var(--win-white) var(--win-white) var(--win-black);
  box-shadow: inset 1px 1px 0 var(--win-dark-gray), inset -1px -1px 0 var(--win-white);
}

/* Menu bar */
.menubar {
  background: var(--win-light-gray);
  padding: 2px 0;
  display: flex;
  border-bottom: 1px solid var(--win-dark-gray);
}

.menu-item {
  padding: 2px 8px;
  cursor: pointer;
  font-family: var(--font-system);
  font-size: 1rem;
  position: relative;
}
.menu-item:hover { background: var(--win-dark-blue); color: var(--win-white); }

.menu-item .underline { text-decoration: underline; }

/* Dropdown menu */
.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--win-light-gray);
  color: var(--win-black);
  border: 2px solid;
  border-color: var(--win-white) var(--win-black) var(--win-black) var(--win-white);
  box-shadow: inset 1px 1px 0 var(--win-white), inset -1px -1px 0 var(--win-dark-gray), 3px 3px 0 rgba(0,0,0,0.25);
  z-index: 100;
  min-width: 160px;
  padding: 2px;
}
.dropdown.open { display: block; }

.dropdown-item {
  padding: 3px 20px 3px 24px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 1rem;
  position: relative;
}
.dropdown-item:hover { background: var(--win-dark-blue); color: var(--win-white); }
.dropdown-item.checked::before {
  content: '\2713';
  position: absolute;
  left: 8px;
}
.dropdown-sep {
  height: 1px;
  background: var(--win-dark-gray);
  margin: 2px 4px;
  box-shadow: 0 1px 0 var(--win-white);
}

/* Game area */
.game-body {
  padding: 6px;
}

/* Top panel with counters and smiley */
.top-panel {
  border: 2px solid;
  border-color: var(--win-dark-gray) var(--win-white) var(--win-white) var(--win-dark-gray);
  box-shadow: inset 1px 1px 0 var(--win-dark-gray);
  padding: 5px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  background: var(--win-light-gray);
}

/* LCD counter */
.lcd-counter {
  background: #300;
  border: 1px solid;
  border-color: var(--win-dark-gray) var(--win-white) var(--win-white) var(--win-dark-gray);
  box-shadow: inset 1px 1px 0 var(--win-black);
  color: #f00;
  font-family: 'VT323', monospace;
  font-size: 2rem;
  letter-spacing: 2px;
  padding: 2px 4px;
  min-width: 60px;
  text-align: right;
  line-height: 1;
}

/* Smiley button */
.smiley-btn {
  width: 36px;
  height: 36px;
  background: var(--win-light-gray);
  border: 2px solid;
  border-color: var(--win-white) var(--win-black) var(--win-black) var(--win-white);
  box-shadow: inset 1px 1px 0 var(--win-white), inset -1px -1px 0 var(--win-dark-gray);
  cursor: pointer;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
}
.smiley-btn:active {
  border-color: var(--win-black) var(--win-white) var(--win-white) var(--win-black);
  box-shadow: inset 1px 1px 0 var(--win-dark-gray), inset -1px -1px 0 var(--win-white);
}

/* Minefield */
.minefield-wrap {
  border: 3px solid;
  border-color: var(--win-dark-gray) var(--win-white) var(--win-white) var(--win-dark-gray);
  box-shadow: inset 1px 1px 0 var(--win-dark-gray);
  display: inline-block;
  line-height: 0;
}

.minefield {
  display: grid;
  gap: 0;
}

/* Cells */
.cell {
  width: 24px;
  height: 24px;
  background: var(--win-light-gray);
  border: 2px solid;
  border-color: var(--win-white) var(--win-dark-gray) var(--win-dark-gray) var(--win-white);
  box-shadow: inset 1px 1px 0 var(--win-white);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: var(--font-system);
  font-size: 1.1rem;
  font-weight: bold;
  line-height: 1;
}

.cell.revealed {
  border: 1px solid var(--win-dark-gray);
  box-shadow: none;
  cursor: default;
}

.cell.flagged { cursor: pointer; }

.cell.mine-hit {
  background: var(--win-red);
  border: 1px solid var(--win-dark-gray);
  box-shadow: none;
}

.cell.mine-wrong {
  border: 1px solid var(--win-dark-gray);
  box-shadow: none;
  position: relative;
}
.cell.mine-wrong::after {
  content: '\2716';
  position: absolute;
  color: var(--win-red);
  font-size: 1.3em;
  line-height: 1;
}

/* Number colors (classic minesweeper) */
.cell.n1 { color: #0000FF; }
.cell.n2 { color: #008000; }
.cell.n3 { color: #FF0000; }
.cell.n4 { color: #000080; }
.cell.n5 { color: #800000; }
.cell.n6 { color: #008080; }
.cell.n7 { color: #000000; }
.cell.n8 { color: #808080; }

/* Status bar */
.statusbar {
  background: var(--win-light-gray);
  border-top: 1px solid var(--win-dark-gray);
  padding: 2px 6px;
  font-size: 0.9rem;
  color: var(--win-black);
  display: flex;
  gap: 8px;
}

.statusbar-section {
  border: 1px solid;
  border-color: var(--win-dark-gray) var(--win-white) var(--win-white) var(--win-dark-gray);
  padding: 1px 6px;
  flex: 1;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding: 8px; }
  .window { max-width: 100vw; overflow-x: auto; }
  .cell { width: 20px; height: 20px; font-size: 0.9rem; }
  .lcd-counter { font-size: 1.5rem; min-width: 48px; }
  .smiley-btn { width: 30px; height: 30px; font-size: 18px; }
  .back-link { top: 4px; left: 8px; font-size: 0.9rem; padding: 1px 6px; }
}

@media (max-width: 520px) {
  .cell { width: 16px; height: 16px; font-size: 0.75rem; }
  .cell.mine-wrong::after { font-size: 1.1em; }
}
</style>
</head>
<body>

<a href="../" class="back-link">&larr; Arcade</a>

<div class="window" id="game-window">
  <!-- Title bar -->
  <div class="titlebar">
    <span class="titlebar-text">Minesweeper</span>
    <div class="titlebar-buttons">
      <button class="titlebar-btn" title="Minimize">_</button>
      <button class="titlebar-btn" title="Maximize">&#9633;</button>
      <button class="titlebar-btn" title="Close" onclick="if(confirm('Quit Minesweeper?')) window.location='../';">&#215;</button>
    </div>
  </div>

  <!-- Menu bar -->
  <div class="menubar">
    <div class="menu-item" id="menu-game" onclick="toggleMenu(event, 'dropdown-game')">
      <span class="underline">G</span>ame
      <div class="dropdown" id="dropdown-game">
        <div class="dropdown-item" onclick="newGame()">New &nbsp; F2</div>
        <div class="dropdown-sep"></div>
        <div class="dropdown-item" id="opt-beginner" onclick="setDifficulty('beginner')">Beginner</div>
        <div class="dropdown-item" id="opt-intermediate" onclick="setDifficulty('intermediate')">Intermediate</div>
        <div class="dropdown-item" id="opt-expert" onclick="setDifficulty('expert')">Expert</div>
        <div class="dropdown-sep"></div>
        <div class="dropdown-item" onclick="showBestTimes()">Best Times...</div>
      </div>
    </div>
    <div class="menu-item" id="menu-help" onclick="toggleMenu(event, 'dropdown-help')">
      <span class="underline">H</span>elp
      <div class="dropdown" id="dropdown-help">
        <div class="dropdown-item" onclick="showHelp()">About Minesweeper...</div>
      </div>
    </div>
  </div>

  <!-- Game body -->
  <div class="game-body">
    <!-- Top panel -->
    <div class="top-panel">
      <div class="lcd-counter" id="mine-counter">010</div>
      <button class="smiley-btn" id="smiley-btn" onclick="newGame()">&#128578;</button>
      <div class="lcd-counter" id="timer">000</div>
    </div>

    <!-- Minefield -->
    <div class="minefield-wrap">
      <div class="minefield" id="minefield"></div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <span class="statusbar-section" id="status-text">Ready</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== GAME STATE =====
  const DIFFICULTIES = {
    beginner:     { rows: 9,  cols: 9,  mines: 10 },
    intermediate: { rows: 16, cols: 16, mines: 40 },
    expert:       { rows: 16, cols: 30, mines: 99 }
  };

  let difficulty = 'beginner';
  let rows, cols, totalMines;
  let board = [];       // 2D array of cell data
  let revealed = [];    // 2D boolean
  let flagged = [];     // 2D boolean
  let gameOver = false;
  let firstClick = true;
  let timerInterval = null;
  let timerValue = 0;
  let minesRemaining = 0;
  let mouseDownOnCell = false;

  const minefield = document.getElementById('minefield');
  const mineCounter = document.getElementById('mine-counter');
  const timerDisplay = document.getElementById('timer');
  const smileyBtn = document.getElementById('smiley-btn');
  const statusText = document.getElementById('status-text');

  // Smiley faces
  const FACE_SMILE = '\u{1F642}';
  const FACE_SURPRISED = '\u{1F62E}';
  const FACE_DEAD = '\u{1F635}';
  const FACE_COOL = '\u{1F60E}';

  // Cell content characters
  const FLAG_CHAR = '\u{1F6A9}';
  const MINE_CHAR = '\u{1F4A3}';

  // ===== INITIALIZATION =====
  function init() {
    const cfg = DIFFICULTIES[difficulty];
    rows = cfg.rows;
    cols = cfg.cols;
    totalMines = cfg.mines;

    board = [];
    revealed = [];
    flagged = [];
    gameOver = false;
    firstClick = true;
    minesRemaining = totalMines;

    stopTimer();
    timerValue = 0;
    updateTimer();
    updateMineCounter();
    setSmiley(FACE_SMILE);
    statusText.textContent = 'Ready';

    // Initialize empty board
    for (let r = 0; r < rows; r++) {
      board[r] = [];
      revealed[r] = [];
      flagged[r] = [];
      for (let c = 0; c < cols; c++) {
        board[r][c] = 0;
        revealed[r][c] = false;
        flagged[r][c] = false;
      }
    }

    // Update difficulty check marks
    document.getElementById('opt-beginner').classList.toggle('checked', difficulty === 'beginner');
    document.getElementById('opt-intermediate').classList.toggle('checked', difficulty === 'intermediate');
    document.getElementById('opt-expert').classList.toggle('checked', difficulty === 'expert');

    renderBoard();
  }

  // ===== MINE PLACEMENT (after first click) =====
  function placeMines(safeRow, safeCol) {
    let placed = 0;
    while (placed < totalMines) {
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);
      // Don't place on safe cell or its neighbors
      if (Math.abs(r - safeRow) <= 1 && Math.abs(c - safeCol) <= 1) continue;
      if (board[r][c] === -1) continue;
      board[r][c] = -1;
      placed++;
    }
    // Calculate numbers
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
          }
        }
        board[r][c] = count;
      }
    }
  }

  // ===== RENDERING =====
  function renderBoard() {
    minefield.innerHTML = '';
    minefield.style.gridTemplateColumns = `repeat(${cols}, auto)`;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;

        cell.addEventListener('mousedown', onCellMouseDown);
        cell.addEventListener('mouseup', onCellMouseUp);
        cell.addEventListener('mouseleave', onCellMouseLeave);
        cell.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // Touch support
        cell.addEventListener('touchstart', onTouchStart, { passive: false });
        cell.addEventListener('touchend', onTouchEnd, { passive: false });
        cell.addEventListener('touchmove', onTouchMove, { passive: false });

        minefield.appendChild(cell);
      }
    }
  }

  function updateCell(r, c) {
    const idx = r * cols + c;
    const cell = minefield.children[idx];
    if (!cell) return;

    cell.className = 'cell';
    cell.textContent = '';

    if (revealed[r][c]) {
      cell.classList.add('revealed');
      const val = board[r][c];
      if (val === -1) {
        cell.textContent = MINE_CHAR;
      } else if (val > 0) {
        cell.textContent = val;
        cell.classList.add('n' + val);
      }
    } else if (flagged[r][c]) {
      cell.classList.add('flagged');
      cell.textContent = FLAG_CHAR;
    }
  }

  // ===== MOUSE HANDLING =====
  function onCellMouseDown(e) {
    e.preventDefault();
    if (gameOver) return;
    const r = parseInt(this.dataset.row);
    const c = parseInt(this.dataset.col);

    if (e.button === 2) {
      // Right click - toggle flag
      toggleFlag(r, c);
    } else if (e.button === 0) {
      // Left click - show pressed state
      if (!revealed[r][c] && !flagged[r][c]) {
        this.classList.add('revealed'); // visual press
        setSmiley(FACE_SURPRISED);
        mouseDownOnCell = true;
      }
    }
  }

  function onCellMouseUp(e) {
    if (gameOver) return;
    const r = parseInt(this.dataset.row);
    const c = parseInt(this.dataset.col);

    if (e.button === 0 && mouseDownOnCell) {
      mouseDownOnCell = false;
      if (!revealed[r][c] && !flagged[r][c]) {
        revealCell(r, c);
      }
      if (!gameOver) setSmiley(FACE_SMILE);
    }
  }

  function onCellMouseLeave() {
    if (mouseDownOnCell && !gameOver) {
      // Restore unpressed appearance
      const r = parseInt(this.dataset.row);
      const c = parseInt(this.dataset.col);
      if (!revealed[r][c]) {
        updateCell(r, c);
      }
      setSmiley(FACE_SMILE);
    }
  }

  // ===== TOUCH HANDLING =====
  let touchTimer = null;
  let touchTarget = null;
  let touchFlagged = false;

  function onTouchStart(e) {
    e.preventDefault();
    if (gameOver) return;
    const cell = e.currentTarget;
    touchTarget = cell;
    touchFlagged = false;
    const r = parseInt(cell.dataset.row);
    const c = parseInt(cell.dataset.col);

    // Long press for flag
    touchTimer = setTimeout(function() {
      toggleFlag(r, c);
      touchFlagged = true;
      touchTarget = null;
      setSmiley(FACE_SMILE);
    }, 400);

    if (!revealed[r][c] && !flagged[r][c]) {
      cell.classList.add('revealed');
      setSmiley(FACE_SURPRISED);
    }
  }

  function onTouchEnd(e) {
    e.preventDefault();
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
    if (!touchTarget || gameOver) {
      // If long-press flagged a cell, restore its visual
      if (touchFlagged) { touchFlagged = false; return; }
      touchTarget = null;
      return;
    }
    const r = parseInt(touchTarget.dataset.row);
    const c = parseInt(touchTarget.dataset.col);

    if (!revealed[r][c] && !flagged[r][c]) {
      revealCell(r, c);
    }
    if (!gameOver) setSmiley(FACE_SMILE);
    touchTarget = null;
  }

  // Cancel long-press if finger moves
  function onTouchMove(e) {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
    if (touchTarget && !gameOver) {
      const r = parseInt(touchTarget.dataset.row);
      const c = parseInt(touchTarget.dataset.col);
      if (!revealed[r][c]) updateCell(r, c);
      setSmiley(FACE_SMILE);
    }
    touchTarget = null;
  }

  // ===== GAME LOGIC =====
  function revealCell(r, c) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    if (revealed[r][c] || flagged[r][c]) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      startTimer();
    }

    revealed[r][c] = true;

    if (board[r][c] === -1) {
      // Hit a mine
      gameLose(r, c);
      return;
    }

    updateCell(r, c);

    // Flood fill for empty cells
    if (board[r][c] === 0) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          revealCell(r + dr, c + dc);
        }
      }
    }

    checkWin();
  }

  function toggleFlag(r, c) {
    if (revealed[r][c] || gameOver) return;

    flagged[r][c] = !flagged[r][c];
    minesRemaining += flagged[r][c] ? -1 : 1;
    updateMineCounter();
    updateCell(r, c);
  }

  function checkWin() {
    let unrevealedSafe = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!revealed[r][c] && board[r][c] !== -1) unrevealedSafe++;
      }
    }
    if (unrevealedSafe === 0) {
      gameWin();
    }
  }

  function gameWin() {
    gameOver = true;
    stopTimer();
    setSmiley(FACE_COOL);
    statusText.textContent = 'You win!';

    // Auto-flag all mines
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === -1 && !flagged[r][c]) {
          flagged[r][c] = true;
          updateCell(r, c);
        }
      }
    }
    minesRemaining = 0;
    updateMineCounter();

    // Check best time
    saveBestTime();
  }

  function gameLose(hitR, hitC) {
    gameOver = true;
    stopTimer();
    setSmiley(FACE_DEAD);
    statusText.textContent = 'Game over!';

    // Reveal all mines, mark wrong flags
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === -1) {
          if (flagged[r][c]) {
            // Correctly flagged mine — keep showing flag
            continue;
          }
          revealed[r][c] = true;
          updateCell(r, c);
          if (r === hitR && c === hitC) {
            const idx = r * cols + c;
            minefield.children[idx].classList.add('mine-hit');
          }
        } else if (flagged[r][c]) {
          // Wrong flag — show X over mine icon
          revealed[r][c] = true;
          const idx = r * cols + c;
          const cell = minefield.children[idx];
          cell.className = 'cell revealed mine-wrong';
          cell.textContent = MINE_CHAR;
        }
      }
    }
  }

  // ===== TIMER =====
  function startTimer() {
    if (timerInterval) return;
    timerValue = 0;
    timerInterval = setInterval(function() {
      timerValue++;
      if (timerValue > 999) timerValue = 999;
      updateTimer();
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function updateTimer() {
    timerDisplay.textContent = String(timerValue).padStart(3, '0');
  }

  function updateMineCounter() {
    const val = Math.max(-99, Math.min(999, minesRemaining));
    mineCounter.textContent = val < 0
      ? '-' + String(Math.abs(val)).padStart(2, '0')
      : String(val).padStart(3, '0');
  }

  function setSmiley(face) {
    smileyBtn.textContent = face;
  }

  // ===== BEST TIMES =====
  function saveBestTime() {
    const key = 'minesweeper_best_' + difficulty;
    const prev = parseInt(localStorage.getItem(key)) || 999;
    if (timerValue < prev) {
      localStorage.setItem(key, timerValue);
      setTimeout(function() {
        alert('New best time for ' + difficulty.charAt(0).toUpperCase() + difficulty.slice(1) + ': ' + timerValue + ' seconds!');
      }, 100);
    }
  }

  function showBestTimes() {
    closeMenus();
    const b = localStorage.getItem('minesweeper_best_beginner') || '---';
    const i = localStorage.getItem('minesweeper_best_intermediate') || '---';
    const e = localStorage.getItem('minesweeper_best_expert') || '---';
    alert(
      'Fastest Mine Sweeper\n\n' +
      'Beginner:         ' + b + ' seconds\n' +
      'Intermediate:   ' + i + ' seconds\n' +
      'Expert:             ' + e + ' seconds'
    );
  }

  // ===== MENU SYSTEM =====
  let menuActive = false;

  window.toggleMenu = function(e, id) {
    e.stopPropagation();
    const dropdown = document.getElementById(id);
    const wasOpen = dropdown.classList.contains('open');
    closeMenus();
    if (!wasOpen) {
      dropdown.classList.add('open');
      menuActive = true;
    } else {
      menuActive = false;
    }
  };

  function closeMenus() {
    document.querySelectorAll('.dropdown').forEach(function(d) { d.classList.remove('open'); });
  }

  // Hover-to-switch: when a menu is open, hovering another menu item opens its dropdown
  document.querySelectorAll('.menu-item').forEach(function(item) {
    item.addEventListener('mouseenter', function() {
      if (!menuActive) return;
      const dropdown = item.querySelector('.dropdown');
      if (!dropdown) return;
      closeMenus();
      dropdown.classList.add('open');
    });
  });

  // Stop dropdown-item clicks from re-triggering parent menu toggle
  document.querySelectorAll('.dropdown-item').forEach(function(item) {
    item.addEventListener('click', function(e) { e.stopPropagation(); });
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.menu-item')) {
      closeMenus();
      menuActive = false;
    }
  });

  // ===== PUBLIC FUNCTIONS =====
  window.newGame = function() {
    closeMenus();
    init();
  };

  window.setDifficulty = function(d) {
    closeMenus();
    difficulty = d;
    init();
  };

  window.showBestTimes = showBestTimes;

  window.showHelp = function() {
    closeMenus();
    alert(
      'Minesweeper\n\n' +
      'Clear the minefield without detonating any mines.\n\n' +
      'Left-click to reveal a cell.\n' +
      'Right-click (or long-press on mobile) to place a flag.\n\n' +
      'Numbers show how many adjacent mines surround a cell.\n' +
      'The first click is always safe.\n\n' +
      'Difficulty:\n' +
      '  Beginner: 9\u00d79, 10 mines\n' +
      '  Intermediate: 16\u00d716, 40 mines\n' +
      '  Expert: 30\u00d716, 99 mines'
    );
  };

  // Keyboard shortcut
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F2') {
      e.preventDefault();
      newGame();
    }
  });

  // Reset mouseDown state if released outside a cell
  document.addEventListener('mouseup', function() {
    if (mouseDownOnCell) {
      mouseDownOnCell = false;
      if (!gameOver) setSmiley(FACE_SMILE);
    }
  });

  // Prevent context menu on the game area and the minefield specifically
  document.getElementById('game-window').addEventListener('contextmenu', function(e) { e.preventDefault(); });
  minefield.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; });

  // Start!
  init();
})();
</script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
