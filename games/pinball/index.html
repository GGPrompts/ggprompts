<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Pinball</title>
    <link rel="stylesheet" href="../casino-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--night-black, #0c0612);
            font-family: 'Inter', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #pinball-canvas {
            display: block;
            image-rendering: auto;
        }

        #back-link {
            position: absolute;
            top: 8px;
            left: 8px;
            color: var(--text-light, #e8e0d4);
            text-decoration: none;
            font-size: 13px;
            opacity: 0.5;
            z-index: 10;
            padding: 4px 10px;
            border: 1px solid rgba(232, 224, 212, 0.2);
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        #back-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <a id="back-link" href="../index.html">Back</a>
        <canvas id="pinball-canvas"></canvas>
    </div>

    <script src="physics.js"></script>
    <script src="table.js"></script>
    <script src="audio.js"></script>
    <script src="engine.js"></script>
    <script>
        PinballEngine.init();
    </script>
</body>
</html>
