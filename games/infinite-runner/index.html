<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dash — Infinite Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0c0612;
            --purple-main: #7c4dff;
            --purple-light: #b388ff;
            --purple-deep: #1a0a2e;
            --neon-green: #00ffaa;
            --neon-red: #ff4466;
            --gold: #ffd700;
            --text-light: #e8e0d4;
            --font-main: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--font-main);
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--purple-deep) 0%, var(--bg-dark) 100%);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        /* HUD buttons */
        .hud-btn {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: var(--font-main);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #btn-back {
            top: 10px;
            left: 10px;
        }

        #btn-mute {
            top: 10px;
            right: 10px;
        }

        /* Mobile slide button */
        #btn-slide {
            display: none;
            position: absolute;
            z-index: 10;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(124, 77, 255, 0.4);
            color: #fff;
            border: 2px solid rgba(124, 77, 255, 0.6);
            border-radius: 50%;
            width: 64px;
            height: 64px;
            font-family: var(--font-main);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        @media (pointer: coarse) {
            #btn-slide {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .hud-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="game-canvas"></canvas>
        <button class="hud-btn" id="btn-back" onclick="location.href='../games/index.html'">&larr; Back</button>
        <button class="hud-btn" id="btn-mute">Mute</button>
        <button id="btn-slide">&#8595;</button>
    </div>

    <script src="terrain.js"></script>
    <script src="player.js"></script>
    <script src="renderer.js"></script>
    <script src="audio.js"></script>
    <script src="engine.js"></script>
    <script>
        // Fix back button path
        document.getElementById('btn-back').onclick = function() {
            window.location.href = '../index.html';
        };

        // Mobile slide button
        document.getElementById('btn-slide').addEventListener('touchstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown' }));
        }, { passive: false });

        Engine.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
