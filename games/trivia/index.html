<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0a1a;
  --bg-panel: #12122a;
  --bg-card: #1a1a3e;
  --bg-card-hover: #222255;
  --cat-color: #00d4ff;
  --accent: #7b5ea7;
  --accent-bright: #a78bfa;
  --gold: #fbbf24;
  --gold-glow: 0 0 12px rgba(251, 191, 36, 0.4);
  --correct-green: #22c55e;
  --wrong-red: #ef4444;
  --skip-blue: #60a5fa;
  --text-light: #e8e4f0;
  --text-dim: rgba(232, 228, 240, 0.5);
  --text-muted: rgba(232, 228, 240, 0.3);
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --border-glow: 0 0 8px rgba(123, 94, 167, 0.3);
  --card-radius: 12px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  font-family: var(--font-body);
  color: var(--text-light);
  background: var(--bg-deep);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(123, 94, 167, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.02) 0%, transparent 40%);
}

/* ===== SCREENS ===== */
.screen { display: none; width: 100%; max-width: 700px; padding: 0 16px; position: relative; z-index: 1; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ===== HEADER ===== */
.header {
  text-align: center;
  padding: 28px 16px 16px;
  width: 100%;
  position: relative;
}

.back-link {
  position: absolute;
  top: 28px;
  left: 0;
  color: var(--accent-bright);
  text-decoration: none;
  font-size: 0.85rem;
  opacity: 0.7;
  transition: opacity var(--transition);
}
.back-link:hover { opacity: 1; }

.header h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.2rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--accent-bright), var(--gold), var(--cat-color, #00d4ff));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 4s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header .subtitle {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-top: 4px;
  font-weight: 300;
}

/* ===== MENU SCREEN ===== */
.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  width: 100%;
  margin-top: 24px;
}

.category-card {
  background: var(--bg-card);
  border: 1px solid rgba(123, 94, 167, 0.2);
  border-radius: var(--card-radius);
  padding: 28px 16px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
  font-family: inherit;
  color: var(--text-light);
}

.category-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--cat-color), transparent 70%);
  opacity: 0.06;
  transition: opacity var(--transition);
}

.category-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--cat-color);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 15px color-mix(in srgb, var(--cat-color) 20%, transparent);
}
.category-card:hover::before { opacity: 0.12; }

.cat-icon { font-size: 2.4rem; }
.cat-name {
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--cat-color);
}
.cat-count {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-weight: 300;
}

/* Stats */
.stats-section {
  margin-top: 32px;
  width: 100%;
  padding-bottom: 32px;
}
.stats-title {
  font-family: var(--font-display);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 12px;
}
.stats-display {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.stat-item {
  background: var(--bg-card);
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  border: 1px solid rgba(123, 94, 167, 0.1);
}
.stat-val {
  display: block;
  font-family: var(--font-mono);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--gold);
}
.stat-lbl {
  display: block;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-top: 2px;
}
.stats-empty {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.85rem;
  font-style: italic;
}

/* ===== GAME SCREEN ===== */
.game-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 16px 0 8px;
  gap: 12px;
}

.game-back {
  color: var(--accent-bright);
  text-decoration: none;
  font-size: 0.8rem;
  opacity: 0.6;
  transition: opacity var(--transition);
  white-space: nowrap;
}
.game-back:hover { opacity: 1; }

.category-badge {
  font-family: var(--font-display);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--cat-color);
  background: rgba(123, 94, 167, 0.1);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(123, 94, 167, 0.2);
}

.question-counter {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* HUD */
.hud {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  width: 100%;
  padding: 8px 0;
}

.hud-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
}
.hud-label {
  color: var(--text-dim);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.hud-score {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--gold);
}
.hud-streak {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--accent-bright);
  transition: all 0.3s;
}
.hud-streak.on-fire {
  color: #f97316;
  text-shadow: 0 0 8px rgba(249, 115, 22, 0.6);
  animation: pulse-fire 0.6s ease-in-out infinite;
}
@keyframes pulse-fire {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* Timer */
.timer-container {
  position: relative;
  width: 64px;
  height: 64px;
  margin: 12px auto;
}
.timer-ring-bg, .timer-ring-fg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.timer-ring-bg {
  border: 4px solid rgba(123, 94, 167, 0.15);
}
.timer-ring {
  position: absolute;
  inset: 0;
}
.timer-ring svg {
  width: 64px;
  height: 64px;
  transform: rotate(-90deg);
}
.timer-ring circle {
  fill: none;
  stroke: var(--cat-color);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 176;
  stroke-dashoffset: calc(176 * (1 - var(--progress, 1)));
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
.timer-ring.urgent circle {
  stroke: var(--wrong-red);
}
.timer-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--text-light);
  transition: color 0.3s;
}
.timer-text.urgent {
  color: var(--wrong-red);
  animation: pulse-fire 0.5s ease-in-out infinite;
}

/* Question */
.question-card {
  background: var(--bg-panel);
  border: 1px solid rgba(123, 94, 167, 0.2);
  border-radius: var(--card-radius);
  padding: 24px;
  width: 100%;
  margin: 8px 0;
  position: relative;
}
.question-text {
  font-size: 1.1rem;
  font-weight: 500;
  line-height: 1.5;
  text-align: center;
  min-height: 3em;
}

/* Answers */
.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  margin-top: 16px;
}

.answer-btn {
  background: var(--bg-card);
  border: 2px solid rgba(123, 94, 167, 0.2);
  border-radius: 10px;
  padding: 14px 12px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  color: var(--text-light);
  text-align: left;
  position: relative;
  overflow: hidden;
}

.answer-btn:not(:disabled):hover {
  background: var(--bg-card-hover);
  border-color: var(--cat-color);
  transform: translateY(-1px);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
}

.answer-btn:not(:disabled):active {
  transform: scale(0.98);
}

.answer-label {
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 700;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: rgba(123, 94, 167, 0.2);
  color: var(--accent-bright);
  flex-shrink: 0;
}

.answer-text {
  flex: 1;
  line-height: 1.3;
}

.answer-btn.correct {
  background: rgba(34, 197, 94, 0.15);
  border-color: var(--correct-green);
  animation: flash-correct 0.4s ease;
}
.answer-btn.correct .answer-label {
  background: var(--correct-green);
  color: #fff;
}

.answer-btn.wrong {
  background: rgba(239, 68, 68, 0.15);
  border-color: var(--wrong-red);
  animation: flash-wrong 0.4s ease;
}
.answer-btn.wrong .answer-label {
  background: var(--wrong-red);
  color: #fff;
}

.answer-btn.eliminated {
  opacity: 0.2;
  pointer-events: none;
  transform: scale(0.95);
}

@keyframes flash-correct {
  0% { box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
  50% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
  100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.2); }
}
@keyframes flash-wrong {
  0% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
  50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
  100% { box-shadow: 0 0 8px rgba(239, 68, 68, 0.2); }
}

/* Lifelines */
.lifelines-bar {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 14px;
  width: 100%;
}

.lifeline-btn {
  background: var(--bg-card);
  border: 1px solid rgba(123, 94, 167, 0.25);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.78rem;
  color: var(--text-light);
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.lifeline-btn:not(:disabled):hover {
  background: var(--bg-card-hover);
  border-color: var(--accent-bright);
}

.lifeline-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.lifeline-btn.used {
  text-decoration: line-through;
  opacity: 0.25;
}

.lifeline-icon {
  font-size: 1rem;
}
.lifeline-key {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  background: rgba(255,255,255,0.08);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--text-dim);
}

/* Feedback */
.feedback {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 12px 28px;
  border-radius: 12px;
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-transform: uppercase;
}
.feedback.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.feedback.correct {
  background: rgba(34, 197, 94, 0.2);
  color: var(--correct-green);
  border: 2px solid var(--correct-green);
  box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
}
.feedback.wrong {
  background: rgba(239, 68, 68, 0.2);
  color: var(--wrong-red);
  border: 2px solid var(--wrong-red);
  box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
}
.feedback.neutral {
  background: rgba(96, 165, 250, 0.2);
  color: var(--skip-blue);
  border: 2px solid var(--skip-blue);
  box-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
}

/* ===== RESULTS SCREEN ===== */
.results-card {
  background: var(--bg-panel);
  border: 1px solid rgba(123, 94, 167, 0.2);
  border-radius: var(--card-radius);
  padding: 32px 24px;
  width: 100%;
  text-align: center;
  margin-top: 16px;
}

.result-category {
  font-family: var(--font-display);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--cat-color);
  margin-bottom: 12px;
}

.result-grade {
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 900;
  line-height: 1;
  margin: 8px 0;
}
.grade-s { color: var(--gold); text-shadow: var(--gold-glow); }
.grade-a { color: var(--correct-green); text-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
.grade-b { color: #60a5fa; text-shadow: 0 0 12px rgba(96, 165, 250, 0.4); }
.grade-c { color: var(--accent-bright); }
.grade-d { color: #f97316; }
.grade-f { color: var(--wrong-red); }

.result-score-line {
  font-family: var(--font-mono);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold);
  margin: 8px 0 20px;
}
.result-score-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  display: block;
  margin-bottom: 2px;
}

.result-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 20px 0;
}
.result-stat {
  text-align: center;
}
.result-stat-val {
  display: block;
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
}
.result-stat-lbl {
  display: block;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-correct-val { color: var(--correct-green); }
.result-wrong-val { color: var(--wrong-red); }
.result-skipped-val { color: var(--skip-blue); }
.result-streak-val { color: #f97316; }

.result-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
}

.btn-primary, .btn-secondary {
  font-family: var(--font-display);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: #fff;
  box-shadow: 0 2px 12px rgba(123, 94, 167, 0.3);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(123, 94, 167, 0.5);
}
.btn-secondary {
  background: var(--bg-card);
  color: var(--text-light);
  border: 1px solid rgba(123, 94, 167, 0.25);
}
.btn-secondary:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent-bright);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .header h1 { font-size: 1.6rem; }
  .category-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .category-card { padding: 20px 12px; }
  .cat-icon { font-size: 2rem; }
  .answers-grid { grid-template-columns: 1fr; }
  .answer-btn { padding: 12px 10px; }
  .question-text { font-size: 1rem; }
  .hud { gap: 16px; }
  .result-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .result-buttons { flex-direction: column; }
  .stats-display { grid-template-columns: repeat(2, 1fr); }
  .feedback { font-size: 1.1rem; padding: 10px 20px; }
}

@media (max-width: 400px) {
  .header h1 { font-size: 1.3rem; }
  .category-grid { grid-template-columns: 1fr; }
  .lifelines-bar { flex-direction: column; align-items: center; }
}
</style>
</head>
<body>

<!-- ===== MENU SCREEN ===== -->
<div class="screen screen-menu active">
  <header class="header">
    <a href="../index.html" class="back-link">&#8592; Games</a>
    <h1>Trivia Arena</h1>
    <p class="subtitle">Test your knowledge across 4 categories</p>
  </header>

  <div class="category-grid"></div>

  <section class="stats-section">
    <h2 class="stats-title">Your Stats</h2>
    <div class="stats-display"></div>
  </section>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen screen-game">
  <div class="game-top-bar">
    <a href="#" class="game-back">&#8592; Quit</a>
    <span class="category-badge"></span>
    <span class="question-counter"></span>
  </div>

  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-score">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Streak</span>
      <span class="hud-streak">0</span>
    </div>
  </div>

  <div class="timer-container">
    <div class="timer-ring-bg"></div>
    <div class="timer-ring">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="28" />
      </svg>
    </div>
    <div class="timer-text">15</div>
  </div>

  <div class="question-card">
    <p class="question-text"></p>
  </div>

  <div class="answers-grid"></div>

  <div class="lifelines-bar">
    <button class="lifeline-btn lifeline-5050">
      <span class="lifeline-icon">&#189;</span>
      50/50
      <span class="lifeline-key">F</span>
    </button>
    <button class="lifeline-btn lifeline-skip">
      <span class="lifeline-icon">&#10145;</span>
      Skip
      <span class="lifeline-key">S</span>
    </button>
  </div>
</div>

<!-- ===== RESULTS SCREEN ===== -->
<div class="screen screen-results">
  <header class="header">
    <h1>Round Over</h1>
  </header>

  <div class="results-card">
    <div class="result-category"></div>
    <div class="result-grade"></div>
    <div class="result-score-line">
      <span class="result-score-label">Final Score</span>
      <span class="result-score">0</span>
    </div>

    <div class="result-stats-grid">
      <div class="result-stat">
        <span class="result-stat-val result-correct-val result-correct">0</span>
        <span class="result-stat-lbl">Correct</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-val result-wrong-val result-wrong">0</span>
        <span class="result-stat-lbl">Wrong</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-val result-skipped-val result-skipped">0</span>
        <span class="result-stat-lbl">Skipped</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-val result-streak-val result-streak">0</span>
        <span class="result-stat-lbl">Best Streak</span>
      </div>
    </div>

    <div class="result-accuracy-line">
      <span class="result-stat-lbl">Accuracy:</span>
      <span class="result-accuracy" style="font-family:var(--font-mono);font-weight:700;font-size:1.1rem;">0%</span>
    </div>
