<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #66ccff;
            --dim: #444444;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-mono);
            color: var(--text);
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* Back button */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            color: var(--dim);
            border: 1px solid var(--dim);
            border-radius: 4px;
            padding: 6px 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Mute button */
        .mute-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            color: var(--dim);
            border: 1px solid var(--dim);
            border-radius: 4px;
            padding: 6px 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mute-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Mobile controls info */
        .mobile-hint {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--dim);
            font-size: 11px;
            z-index: 20;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .mobile-hint { display: block; }
            .back-btn { padding: 4px 10px; font-size: 12px; }
            .mute-btn { padding: 4px 10px; font-size: 12px; }
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <a href="../index.html" class="back-btn">&larr; Arcade</a>
        <button class="mute-btn" id="btn-mute" onclick="toggleMute()">SOUND: ON</button>
        <canvas id="game-canvas"></canvas>
        <div class="mobile-hint">Left half: thrust &middot; Right half: shoot &middot; Swipe to turn</div>
    </div>

    <script src="audio.js"></script>
    <script src="entities.js"></script>
    <script src="renderer.js"></script>
    <script src="engine.js"></script>
    <script>
        function toggleMute() {
            const muted = AsteroidsAudio.toggleMute();
            document.getElementById('btn-mute').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');
        }
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
