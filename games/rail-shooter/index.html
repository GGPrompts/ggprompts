<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD CORRIDOR — Rail Shooter Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
  --arcade-black: #0a0a0e;
  --arcade-dark: #141420;
  --blood-red: #cc1111;
  --blood-dark: #880808;
  --neon-orange: #ff6600;
  --neon-yellow: #ffcc00;
  --steel-blue: #4488bb;
  --hud-green: #33ff66;
  --hud-amber: #ffaa00;
  --chrome: #c0c8d0;
  --white: #f0f0f0;
  --font-pixel: 'Press Start 2P', monospace;
  --font-display: 'Orbitron', sans-serif;
  --font-heading: 'Russo One', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-heading);
  background: var(--arcade-black);
  color: var(--white);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

/* Nav bar */
.nav-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: linear-gradient(180deg, #1a1a2e, #0a0a18);
  border-bottom: 2px solid var(--blood-red);
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-bar a {
  color: var(--chrome);
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 0.85rem;
  letter-spacing: 1px;
}
.nav-bar a:hover { color: var(--neon-orange); }

/* Screens */
.screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s;
}
.screen.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Title Screen */
#title-screen {
  background: radial-gradient(ellipse at center, #1a0a0a 0%, var(--arcade-black) 70%);
}
.title-logo {
  text-align: center;
  margin-bottom: 30px;
}
.title-logo h1 {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 8vw, 5.5rem);
  font-weight: 900;
  color: var(--blood-red);
  text-shadow: 0 0 30px rgba(204,17,17,0.6), 0 4px 0 #440000;
  letter-spacing: 6px;
  line-height: 1.1;
}
.title-logo .subtitle {
  font-family: var(--font-pixel);
  font-size: clamp(0.6rem, 2vw, 0.9rem);
  color: var(--neon-orange);
  margin-top: 10px;
  letter-spacing: 3px;
  text-shadow: 0 0 10px rgba(255,102,0,0.5);
}
.title-info {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: #666;
  margin-top: 20px;
  text-align: center;
  line-height: 2;
}

.btn-start {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 700;
  padding: 14px 50px;
  background: linear-gradient(180deg, var(--blood-red), #770808);
  color: var(--white);
  border: 2px solid var(--neon-orange);
  cursor: pointer;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 20px;
  transition: all 0.15s;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.btn-start:hover {
  background: linear-gradient(180deg, #ee2222, var(--blood-red));
  box-shadow: 0 0 20px rgba(204,17,17,0.5);
  transform: scale(1.03);
}

/* Game Canvas Container */
#game-screen {
  z-index: 5;
  cursor: none;
}
#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: auto;
}

/* Results screen */
#results-screen {
  background: rgba(5,5,10,0.95);
}
.results-box {
  background: linear-gradient(180deg, #1a1a2e, #0a0a18);
  border: 2px solid var(--blood-red);
  padding: 30px 50px;
  text-align: center;
  max-width: 500px;
}
.results-box h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--neon-orange);
  margin-bottom: 5px;
  letter-spacing: 3px;
}
.results-box .level-name {
  font-family: var(--font-pixel);
  font-size: 0.7rem;
  color: #888;
  margin-bottom: 20px;
}
.results-box .rating {
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 900;
  margin: 10px 0;
  text-shadow: 0 0 30px currentColor;
}
.rating-S { color: #ffcc00; }
.rating-A { color: #33ff66; }
.rating-B { color: #4488bb; }
.rating-C { color: #ff6600; }
.rating-D { color: #cc1111; }
.results-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 20px;
  margin: 15px 0;
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  text-align: left;
}
.results-stats .label { color: #888; }
.results-stats .value { color: var(--hud-green); text-align: right; }
.results-btns {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: center;
}
.results-btns button {
  font-family: var(--font-display);
  font-size: 0.85rem;
  padding: 10px 24px;
  border: 2px solid var(--blood-red);
  background: var(--arcade-dark);
  color: var(--white);
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.15s;
}
.results-btns button:hover {
  background: var(--blood-red);
}

/* Game Over */
#gameover-screen {
  background: rgba(20,0,0,0.95);
}
.gameover-box {
  text-align: center;
}
.gameover-box h2 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 6vw, 4rem);
  font-weight: 900;
  color: var(--blood-red);
  text-shadow: 0 0 40px rgba(204,17,17,0.8);
  letter-spacing: 5px;
  margin-bottom: 10px;
}
.gameover-box .final-score {
  font-family: var(--font-pixel);
  font-size: 1rem;
  color: var(--neon-orange);
  margin-bottom: 5px;
}
.gameover-box .high-score-msg {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  color: var(--hud-green);
  margin-bottom: 20px;
}

/* CRT overlay */
.crt-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 999;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.06) 0px,
      rgba(0,0,0,0.06) 1px,
      transparent 1px,
      transparent 3px
    );
  mix-blend-mode: multiply;
}

@media (max-width: 768px) {
  .nav-bar { padding: 4px 10px; }
  .nav-bar a { font-size: 0.7rem; }
  .results-box { padding: 20px 25px; }
  .results-stats { font-size: 0.5rem; }
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="../index.html">&#9664; ARCADE</a>
  <span style="color:#555; font-family:var(--font-pixel); font-size:0.55rem;">DEAD CORRIDOR</span>
</div>

<div class="crt-overlay"></div>

<!-- Title Screen -->
<div id="title-screen" class="screen">
  <div class="title-logo">
    <h1>DEAD<br>CORRIDOR</h1>
    <div class="subtitle">ON-RAILS LIGHT GUN SHOOTER</div>
  </div>
  <button class="btn-start" id="btn-start">INSERT COIN</button>
  <div class="title-info">
    CLICK TO SHOOT &bull; R TO RELOAD<br>
    SHOOT ENEMIES BEFORE THEY FIRE<br>
    DON'T HIT CIVILIANS
  </div>
</div>

<!-- Game Screen -->
<div id="game-screen" class="screen hidden">
  <canvas id="game-canvas"></canvas>
</div>

<!-- Results Screen -->
<div id="results-screen" class="screen hidden">
  <div class="results-box">
    <h2>MISSION CLEAR</h2>
    <div class="level-name" id="res-level"></div>
    <div class="rating" id="res-rating"></div>
    <div class="results-stats">
      <span class="label">SCORE</span><span class="value" id="res-score"></span>
      <span class="label">ENEMIES</span><span class="value" id="res-enemies"></span>
      <span class="label">ACCURACY</span><span class="value" id="res-accuracy"></span>
      <span class="label">MAX COMBO</span><span class="value" id="res-combo"></span>
      <span class="label">HEADSHOTS</span><span class="value" id="res-headshots"></span>
      <span class="label">CIVILIANS</span><span class="value" id="res-civs"></span>
    </div>
    <div class="results-btns">
      <button id="btn-next">NEXT LEVEL</button>
      <button id="btn-menu">MENU</button>
    </div>
  </div>
</div>

<!-- Game Over Screen -->
<div id="gameover-screen" class="screen hidden">
  <div class="gameover-box">
    <h2>GAME OVER</h2>
    <div class="final-score" id="go-score"></div>
    <div class="high-score-msg" id="go-highscore"></div>
    <div class="results-btns">
      <button id="btn-continue">CONTINUE?</button>
      <button id="btn-go-menu">MENU</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// DEAD CORRIDOR — Rail Shooter Engine
// ============================================================
(() => {
'use strict';

// --- Audio Engine (Web Audio) ---
const Audio = (() => {
  let ctx = null;
  function init() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function play(type) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const g = ctx.createGain();
    g.connect(ctx.destination);
    const o = ctx.createOscillator();
    switch (type) {
      case 'shoot': {
        const n = ctx.createBufferSource();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
        }
        n.buffer = buf;
        const flt = ctx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.setValueAtTime(3000, now);
        flt.frequency.exponentialRampToValueAtTime(200, now + 0.1);
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        n.connect(flt); flt.connect(g);
        n.start(now); n.stop(now + 0.12);
        return;
      }
      case 'empty': {
        o.type = 'square';
        o.frequency.setValueAtTime(800, now);
        o.frequency.exponentialRampToValueAtTime(200, now + 0.06);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        o.connect(g); o.start(now); o.stop(now + 0.06);
        return;
      }
      case 'reload': {
        o.type = 'triangle';
        o.frequency.setValueAtTime(300, now);
        o.frequency.linearRampToValueAtTime(600, now + 0.15);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        o.connect(g); o.start(now); o.stop(now + 0.2);
        return;
      }
      case 'hit': {
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, now);
        o.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        g.gain.setValueAtTime(0.25, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        o.connect(g); o.start(now); o.stop(now + 0.1);
        return;
      }
      case 'damage': {
        const n = ctx.createBufferSource();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5) * 0.4;
        }
        n.buffer = buf;
        const flt = ctx.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = 800;
        g.gain.setValueAtTime(0.4, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        n.connect(flt); flt.connect(g);
        n.start(now); n.stop(now + 0.3);
        return;
      }
      case 'civilian': {
        o.type = 'sine';
        o.frequency.setValueAtTime(600, now);
        o.frequency.linearRampToValueAtTime(200, now + 0.4);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        o.connect(g); o.start(now); o.stop(now + 0.4);
        return;
      }
      case 'boss_hit': {
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(150, now);
        o.frequency.exponentialRampToValueAtTime(50, now + 0.15);
        g.gain.setValueAtTime(0.35, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        o.connect(g); o.start(now); o.stop(now + 0.15);
        return;
      }
      case 'level_clear': {
        [523, 659, 784, 1047].forEach((f, i) => {
          const oo = ctx.createOscillator();
          const gg = ctx.createGain();
          oo.type = 'square';
          oo.frequency.value = f;
          gg.gain.setValueAtTime(0.15, now + i * 0.12);
          gg.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
          oo.connect(gg); gg.connect(ctx.destination);
          oo.start(now + i * 0.12); oo.stop(now + i * 0.12 + 0.2);
        });
        return;
      }
      case 'game_over': {
        [400, 350, 300, 200].forEach((f, i) => {
          const oo = ctx.createOscillator();
          const gg = ctx.createGain();
          oo.type = 'sawtooth';
          oo.frequency.value = f;
          gg.gain.setValueAtTime(0.2, now + i * 0.2);
          gg.gain.exponentialRampToValueAtTime(0.01, now + i * 0.2 + 0.3);
          oo.connect(gg); gg.connect(ctx.destination);
          oo.start(now + i * 0.2); oo.stop(now + i * 0.2 + 0.3);
        });
        return;
      }
    }
  }
  return { init, play };
})();

// --- Constants ---
const MAX_AMMO = 8;
const MAX_HEALTH = 100;
const RELOAD_TIME = 1.0;
const LS_KEY = 'deadcorridor_highscore';

// --- State ---
let canvas, cx, W, H;
let state = 'title'; // title, playing, results, gameover
let mouseX = 0, mouseY = 0;
let score = 0, totalScore = 0, combo = 0, maxCombo = 0;
let health = MAX_HEALTH, ammo = MAX_AMMO;
let reloading = false, reloadTimer = 0;
let shotsFired = 0, shotsHit = 0, enemiesKilled = 0, headshotsCount = 0;
let civiliansHit = 0;
let currentLevel = 0;
let levelTimer = 0, levelDuration = 0;
let enemies = [], civilians = [], particles = [], shellCasings = [];
let muzzleFlash = 0, damageFlash = 0;
let spawnQueue = [];
let bossActive = null;
let scrollOffset = 0;
let levelComplete = false;

// --- Levels ---
const LEVELS = [
  {
    name: 'MANSION HALLS',
    duration: 45,
    bgColors: { sky: '#1a0a20', far: '#2a1535', mid: '#1e1028', near: '#0e0818', floor: '#0c0612' },
    accentColor: '#8844aa',
    coverColor: '#2a1838',
    spawnPattern: 'mansion',
    bossHP: 15,
    bossName: 'THE BUTLER'
  },
  {
    name: 'RESEARCH LAB',
    duration: 50,
    bgColors: { sky: '#0a1a10', far: '#0e2818', mid: '#0a2010', near: '#061408', floor: '#040e04' },
    accentColor: '#33cc55',
    coverColor: '#0e2818',
    spawnPattern: 'lab',
    bossHP: 20,
    bossName: 'DR. HAZARD'
  },
  {
    name: 'CITY STREETS',
    duration: 55,
    bgColors: { sky: '#0a0e1e', far: '#141830', mid: '#0e1225', near: '#080c18', floor: '#06080e' },
    accentColor: '#4488cc',
    coverColor: '#141830',
    spawnPattern: 'city',
    bossHP: 25,
    bossName: 'THE WARLORD'
  },
  {
    name: 'THE GRAVEYARD',
    duration: 60,
    bgColors: { sky: '#0e0a0a', far: '#1a1215', mid: '#14101a', near: '#0a080e', floor: '#060408' },
    accentColor: '#996633',
    coverColor: '#1a1215',
    spawnPattern: 'graveyard',
    bossHP: 30,
    bossName: 'THE REAPER'
  }
];

// --- Cover / Spawn Points (normalized 0-1 coordinates) ---
function getSpawnPoints(pattern) {
  // Returns array of { x, y, side, coverW, coverH } normalized
  switch (pattern) {
    case 'mansion': return [
      { x: 0.08, y: 0.35, side: 'left', coverW: 0.1, coverH: 0.55 },
      { x: 0.88, y: 0.35, side: 'right', coverW: 0.1, coverH: 0.55 },
      { x: 0.3, y: 0.25, side: 'top', coverW: 0.12, coverH: 0.08 },
      { x: 0.65, y: 0.25, side: 'top', coverW: 0.12, coverH: 0.08 },
      { x: 0.2, y: 0.55, side: 'left', coverW: 0.08, coverH: 0.35 },
      { x: 0.78, y: 0.55, side: 'right', coverW: 0.08, coverH: 0.35 },
      { x: 0.48, y: 0.3, side: 'top', coverW: 0.15, coverH: 0.06 },
    ];
    case 'lab': return [
      { x: 0.05, y: 0.3, side: 'left', coverW: 0.09, coverH: 0.6 },
      { x: 0.92, y: 0.3, side: 'right', coverW: 0.09, coverH: 0.6 },
      { x: 0.25, y: 0.4, side: 'left', coverW: 0.07, coverH: 0.4 },
      { x: 0.72, y: 0.4, side: 'right', coverW: 0.07, coverH: 0.4 },
      { x: 0.4, y: 0.28, side: 'top', coverW: 0.1, coverH: 0.07 },
      { x: 0.58, y: 0.28, side: 'top', coverW: 0.1, coverH: 0.07 },
      { x: 0.15, y: 0.55, side: 'left', coverW: 0.06, coverH: 0.35 },
      { x: 0.83, y: 0.55, side: 'right', coverW: 0.06, coverH: 0.35 },
    ];
    case 'city': return [
      { x: 0.03, y: 0.25, side: 'left', coverW: 0.11, coverH: 0.65 },
      { x: 0.9, y: 0.25, side: 'right', coverW: 0.11, coverH: 0.65 },
      { x: 0.22, y: 0.3, side: 'left', coverW: 0.08, coverH: 0.5 },
      { x: 0.75, y: 0.3, side: 'right', coverW: 0.08, coverH: 0.5 },
      { x: 0.35, y: 0.22, side: 'top', coverW: 0.12, coverH: 0.1 },
      { x: 0.6, y: 0.22, side: 'top', coverW: 0.12, coverH: 0.1 },
      { x: 0.48, y: 0.45, side: 'top', coverW: 0.14, coverH: 0.06 },
    ];
    case 'graveyard': return [
      { x: 0.06, y: 0.4, side: 'left', coverW: 0.08, coverH: 0.5 },
      { x: 0.9, y: 0.4, side: 'right', coverW: 0.08, coverH: 0.5 },
      { x: 0.2, y: 0.5, side: 'left', coverW: 0.06, coverH: 0.38 },
      { x: 0.78, y: 0.5, side: 'right', coverW: 0.06, coverH: 0.38 },
      { x: 0.35, y: 0.35, side: 'top', coverW: 0.06, coverH: 0.1 },
      { x: 0.5, y: 0.32, side: 'top', coverW: 0.08, coverH: 0.08 },
      { x: 0.65, y: 0.35, side: 'top', coverW: 0.06, coverH: 0.1 },
      { x: 0.42, y: 0.5, side: 'left', coverW: 0.05, coverH: 0.3 },
      { x: 0.58, y: 0.5, side: 'right', coverW: 0.05, coverH: 0.3 },
    ];
    default: return [];
  }
}

// --- Enemy Creation ---
function createEnemy(sp, level, isBoss) {
  const attackTime = isBoss ? 4.0 : Math.max(1.2, 2.5 - level * 0.2 + Math.random() * 0.8);
  const px = sp.x * W, py = sp.y * H;
  const cw = sp.coverW * W, ch = sp.coverH * H;
  const bodyW = isBoss ? W * 0.09 : W * 0.05;
  const bodyH = isBoss ? H * 0.2 : H * 0.14;
  const headR = isBoss ? W * 0.03 : W * 0.02;

  // Compute pop-out target relative to cover
  let targetX = px, targetY = py;
  if (sp.side === 'left') targetX = px + cw + bodyW * 0.5;
  else if (sp.side === 'right') targetX = px - bodyW * 0.5;
  else if (sp.side === 'top') targetY = py + ch + bodyH * 0.3;

  // Start hidden behind cover
  let startX = sp.side === 'left' ? px : sp.side === 'right' ? px + cw : targetX;
  let startY = sp.side === 'top' ? py : targetY;

  return {
    x: startX, y: startY,
    targetX, targetY,
    startX, startY,
    bodyW, bodyH, headR,
    headX: targetX, headY: targetY - bodyH * 0.35,
    coverX: px, coverY: py, coverW: cw, coverH: ch,
    side: sp.side,
    hp: isBoss ? LEVELS[currentLevel].bossHP : 1,
    maxHp: isBoss ? LEVELS[currentLevel].bossHP : 1,
    isBoss,
    state: 'popping', // popping, exposed, attacking, dying, dead
    popTimer: 0,
    popDuration: 0.4,
    attackTimer: 0,
    attackTime,
    exposedTime: 0,
    dyingTimer: 0,
    flashTimer: 0,
    damage: isBoss ? 20 : 10
  };
}

// --- Civilian Creation ---
function createCivilian() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const startX = dir === 1 ? -W * 0.05 : W * 1.05;
  const y = H * (0.4 + Math.random() * 0.3);
  const speed = W * (0.15 + Math.random() * 0.1);
  return {
    x: startX, y,
    dir, speed,
    bodyW: W * 0.035, bodyH: H * 0.12,
    headR: W * 0.015,
    alive: true, dyingTimer: 0,
    color: ['#4488ff', '#44cc44', '#ffaa00', '#ff66aa'][Math.floor(Math.random() * 4)]
  };
}

// --- Particle Effects ---
function spawnBlood(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 50,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.4 + Math.random() * 0.4,
      size: 2 + Math.random() * 4,
      color: Math.random() < 0.7 ? '#cc1111' : '#880808',
      type: 'blood'
    });
  }
}

function spawnSpark(x, y) {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 120;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.15 + Math.random() * 0.15,
      maxLife: 0.2,
      size: 1 + Math.random() * 2,

    });

}

function spawnShellCasing() {
  shellCasings.push({
    x: W * 0.52, y: H * 0.85,
    vx: 40 + Math.random() * 60,
    vy: -80 - Math.random() * 40,
    rot: 0, rotV: 5 + Math.random() * 10,
    life: 1.0
  });
}

// --- Level Spawn Scheduling ---
function buildSpawnQueue(level) {
  const lv = LEVELS[level];
  const points = getSpawnPoints(lv.spawnPattern);
  const queue = [];
  const dur = lv.duration;
  const enemyCount = 12 + level * 5;
  const civCount = 3 + level;

  // Spread enemies over time, ramp density
  for (let i = 0; i < enemyCount; i++) {
    const t = (i / enemyCount) * (dur - 8) + 2 + Math.random() * 1.5;
    const sp = points[Math.floor(Math.random() * points.length)];
    queue.push({ time: t, type: 'enemy', sp });
  }

  // Civilians scattered
  for (let i = 0; i < civCount; i++) {
    const t = 5 + Math.random() * (dur - 12);
    queue.push({ time: t, type: 'civilian' });
  }

  // Boss at end
  const bossSp = points[Math.floor(Math.random() * Math.min(2, points.length))];
  queue.push({ time: dur - 6, type: 'boss', sp: bossSp });

  queue.sort((a, b) => a.time - b.time);
  return queue;
}

// --- Drawing ---
function drawBackground(lv) {
  const bg = lv.bgColors;
  // Sky gradient
  const grad = cx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, bg.sky);
  grad.addColorStop(0.3, bg.far);
  grad.addColorStop(0.5, bg.mid);
  grad.addColorStop(0.7, bg.near);
  grad.addColorStop(1, bg.floor);
  cx.fillStyle = grad;
  cx.fillRect(0, 0, W, H);

  // Depth lines / features based on level
  cx.strokeStyle = lv.accentColor + '18';
  cx.lineWidth = 1;
  // Horizontal depth lines
  for (let i = 0; i < 8; i++) {
    const y = H * (0.25 + i * 0.08);
    cx.beginPath();
    cx.moveTo(0, y);
    cx.lineTo(W, y);
    cx.stroke();
  }

  // Perspective corridor lines
  cx.strokeStyle = lv.accentColor + '25';
  cx.lineWidth = 2;
  const vanishX = W * 0.5, vanishY = H * 0.2;
  // Left wall
  cx.beginPath(); cx.moveTo(0, H); cx.lineTo(vanishX, vanishY); cx.stroke();
  cx.beginPath(); cx.moveTo(0, H * 0.3); cx.lineTo(vanishX, vanishY); cx.stroke();
  // Right wall
  cx.beginPath(); cx.moveTo(W, H); cx.lineTo(vanishX, vanishY); cx.stroke();
  cx.beginPath(); cx.moveTo(W, H * 0.3); cx.lineTo(vanishX, vanishY); cx.stroke();

  // Ambient details per level
  drawLevelDetails(lv);
}

function drawLevelDetails(lv) {
  const pattern = lv.spawnPattern;
  cx.save();
  if (pattern === 'mansion') {
    // Pillars
    cx.fillStyle = '#2a1838';
    for (let i = 0; i < 6; i++) {
      const x = W * (0.1 + i * 0.16);
      cx.fillRect(x, H * 0.15, W * 0.02, H * 0.65);
      // Capital
      cx.fillStyle = '#3a2848';
      cx.fillRect(x - W * 0.005, H * 0.15, W * 0.03, H * 0.02);
      cx.fillStyle = '#2a1838';
    }
    // Chandelier
    cx.fillStyle = lv.accentColor + '40';
    cx.beginPath();
    cx.arc(W * 0.5, H * 0.12, W * 0.04, 0, Math.PI * 2);
    cx.fill();
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
      cx.fillStyle = '#ffcc6640';
      cx.beginPath();
      cx.arc(W * 0.5 + Math.cos(angle) * W * 0.03, H * 0.12 + Math.sin(angle) * W * 0.03, 3, 0, Math.PI * 2);
      cx.fill();
    }
  } else if (pattern === 'lab') {
    // Computer terminals
    for (let i = 0; i < 4; i++) {
      const x = W * (0.15 + i * 0.2);
      cx.fillStyle = '#0a1810';
      cx.fillRect(x, H * 0.5, W * 0.06, H * 0.03);
      cx.fillStyle = lv.accentColor + '60';
      cx.fillRect(x + 2, H * 0.5 + 2, W * 0.06 - 4, H * 0.03 - 4);
    }
    // Warning stripes
    cx.fillStyle = '#cccc0020';
    cx.fillRect(0, H * 0.78, W, H * 0.005);
    cx.fillRect(0, H * 0.8, W, H * 0.005);
    // Pipes on ceiling
    cx.strokeStyle = '#1a3020';
    cx.lineWidth = 4;
    cx.beginPath(); cx.moveTo(0, H * 0.18); cx.lineTo(W, H * 0.18); cx.stroke();
    cx.beginPath(); cx.moveTo(0, H * 0.21); cx.lineTo(W, H * 0.21); cx.stroke();
  } else if (pattern === 'city') {
    // Building silhouettes
    const builds = [
      { x: 0, w: 0.15, h: 0.5 }, { x: 0.12, w: 0.1, h: 0.6 },
      { x: 0.75, w: 0.12, h: 0.55 }, { x: 0.85, w: 0.16, h: 0.45 },
      { x: 0.35, w: 0.08, h: 0.35 }, { x: 0.55, w: 0.1, h: 0.38 }
    ];
    builds.forEach(b => {
      cx.fillStyle = '#0c1020';
      cx.fillRect(b.x * W, H * (1 - b.h) * 0.5, b.w * W, H * b.h);
      // Windows
      cx.fillStyle = '#223355';
      for (let wy = 0; wy < 5; wy++) {
        for (let wx = 0; wx < 3; wx++) {
          if (Math.random() < 0.4) {
            cx.fillStyle = '#ffcc6630';
          } else {
            cx.fillStyle = '#22335520';
          }
          cx.fillRect(
            b.x * W + wx * b.w * W * 0.3 + b.w * W * 0.08,
            H * (1 - b.h) * 0.5 + wy * H * b.h * 0.18 + H * 0.02,
            b.w * W * 0.2, H * b.h * 0.1
          );
        }
      }
    });
    // Street lamp
    cx.strokeStyle = '#445566';
    cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(W * 0.45, H * 0.8); cx.lineTo(W * 0.45, H * 0.3); cx.stroke();
    cx.fillStyle = '#ffcc4420';
    cx.beginPath(); cx.arc(W * 0.45, H * 0.3, 15, 0, Math.PI * 2); cx.fill();
  } else if (pattern === 'graveyard') {
    // Gravestones
    const graves = [0.15, 0.3, 0.45, 0.55, 0.7, 0.82];
    graves.forEach(gx => {
      const gy = H * (0.55 + Math.sin(gx * 10) * 0.05);
      cx.fillStyle = '#2a2025';
      // Stone
      cx.beginPath();
      cx.moveTo(gx * W - 8, gy + 20);
      cx.lineTo(gx * W - 8, gy);
      cx.arc(gx * W, gy - 4, 8, Math.PI, 0);
      cx.lineTo(gx * W + 8, gy + 20);
      cx.fill();
    });
    // Dead trees
    cx.strokeStyle = '#1a1218';
    cx.lineWidth = 3;
    [0.08, 0.92].forEach(tx => {
      cx.beginPath();
      cx.moveTo(tx * W, H * 0.8);
      cx.lineTo(tx * W, H * 0.2);
      cx.stroke();
      // Branches
      for (let b = 0; b < 4; b++) {
        const by = H * (0.25 + b * 0.12);
        const dir = b % 2 === 0 ? 1 : -1;
        cx.beginPath();
        cx.moveTo(tx * W, by);
        cx.lineTo(tx * W + dir * W * 0.04, by - H * 0.06);
        cx.stroke();
      }
    });
    // Fog
    cx.fillStyle = '#ffffff06';
    cx.fillRect(0, H * 0.6, W, H * 0.15);
  }
  cx.restore();
}

function drawCoverObjects(lv) {
  const points = getSpawnPoints(lv.spawnPattern);
  cx.save();
  points.forEach(sp => {
    const x = sp.x * W, y = sp.y * H;
    const w = sp.coverW * W, h = sp.coverH * H;
    // Cover object
    cx.fillStyle = lv.coverColor;
    cx.fillRect(x, y, w, h);
    // Edge highlight
    cx.strokeStyle = lv.accentColor + '40';
    cx.lineWidth = 1;
    cx.strokeRect(x, y, w, h);
    // Detail
    cx.fillStyle = lv.accentColor + '15';
    cx.fillRect(x + 2, y + 2, w - 4, h * 0.15);
  });
  cx.restore();
}

function drawEnemy(e) {
  if (e.state === 'dead') return;
  cx.save();

  // Interpolate position for pop-out
  let drawX = e.x, drawY = e.y;
  if (e.state === 'popping') {
    const t = Math.min(e.popTimer / e.popDuration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    drawX = e.startX + (e.targetX - e.startX) * ease;
    drawY = e.startY + (e.targetY - e.startY) * ease;
  } else if (e.state === 'dying') {
    drawY = e.targetY + e.dyingTimer * 60;
  } else {
    drawX = e.targetX;
    drawY = e.targetY;
  }

  // Flash on hit
  const flashing = e.flashTimer > 0;
  const alpha = e.state === 'dying' ? Math.max(0, 1 - e.dyingTimer / 0.5) : 1;
  cx.globalAlpha = alpha;

  // Body
  const bw = e.bodyW, bh = e.bodyH;
  // Outline glow for visibility
  if (!flashing) {
    cx.strokeStyle = e.isBoss ? '#ff004480' : '#ff660040';
    cx.lineWidth = 3;
    cx.strokeRect(drawX - bw / 2 - 1, drawY - 1, bw + 2, bh + 2);
  }
  cx.fillStyle = flashing ? '#ffffff' : (e.isBoss ? '#770022' : '#444444');
  cx.fillRect(drawX - bw / 2, drawY, bw, bh);
  // Vest / shirt detail
  cx.fillStyle = flashing ? '#ffffff' : (e.isBoss ? '#aa0044' : '#555555');
  cx.fillRect(drawX - bw / 2 + 2, drawY + 2, bw - 4, bh * 0.4);

  // Head
  const headX = drawX;
  const headY = drawY - e.headR * 0.5;
  e.headX = headX;
  e.headY = headY;
  cx.fillStyle = flashing ? '#ffffff' : (e.isBoss ? '#990044' : '#ddaa77');
  cx.beginPath();
  cx.arc(headX, headY, e.headR, 0, Math.PI * 2);
  cx.fill();
  // Head outline
  cx.strokeStyle = flashing ? '#ffffff' : '#00000060';
  cx.lineWidth = 1.5;
  cx.stroke();

  // Eyes
  if (!flashing) {
    cx.fillStyle = e.state === 'attacking' ? '#ff0000' : '#ffffff';
    cx.beginPath();
    cx.arc(headX - e.headR * 0.3, headY - e.headR * 0.1, e.headR * 0.22, 0, Math.PI * 2);
    cx.arc(headX + e.headR * 0.3, headY - e.headR * 0.1, e.headR * 0.22, 0, Math.PI * 2);
    cx.fill();
    // Pupils
    cx.fillStyle = '#000000';
    cx.beginPath();
    cx.arc(headX - e.headR * 0.3, headY - e.headR * 0.05, e.headR * 0.1, 0, Math.PI * 2);
    cx.arc(headX + e.headR * 0.3, headY - e.headR * 0.05, e.headR * 0.1, 0, Math.PI * 2);
    cx.fill();
  }

  // Boss HP bar
  if (e.isBoss && e.hp > 0) {
    const barW = bw * 2;
    const barH = 6;
    const barX = drawX - barW / 2;
    const barY = headY - e.headR - 14;
    cx.fillStyle = '#440000';
    cx.fillRect(barX, barY, barW, barH);
    cx.fillStyle = '#cc1111';
    cx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
    cx.strokeStyle = '#ffffff40';
    cx.lineWidth = 1;
    cx.strokeRect(barX, barY, barW, barH);
    // Name
    cx.fillStyle = '#ffcc00';
    cx.font = `bold ${Math.round(W * 0.012)}px 'Orbitron', sans-serif`;
    cx.textAlign = 'center';
    cx.fillText(LEVELS[currentLevel].bossName, drawX, barY - 4);
  }

  // Attack warning (gun raising animation)
  if (e.state === 'exposed' || e.state === 'attacking') {
    const attackProgress = e.attackTimer / e.attackTime;
    if (attackProgress > 0.6) {
      // Gun arm raising
      const armLen = bw * 1.2;
      const armAngle = (attackProgress - 0.6) / 0.4 * (Math.PI * 0.4);
      cx.strokeStyle = flashing ? '#ffffff' : '#555555';
      cx.lineWidth = 3;
      cx.beginPath();
      cx.moveTo(drawX + bw * 0.4, drawY + bh * 0.2);
      cx.lineTo(
        drawX + bw * 0.4 + Math.cos(-armAngle) * armLen,
        drawY + bh * 0.2 + Math.sin(-armAngle) * armLen
      );
      cx.stroke();
    }
    // Warning indicator
    if (attackProgress > 0.7) {
      const blink = Math.sin(Date.now() * 0.02) > 0;
      if (blink) {
        cx.fillStyle = '#ff0000';
        cx.font = `bold ${Math.round(W * 0.02)}px 'Orbitron', sans-serif`;
        cx.textAlign = 'center';
        cx.fillText('!', headX, headY - e.headR - 8);
      }
    }
  }

  cx.restore();
}

function drawCivilian(c) {
  if (!c.alive && c.dyingTimer > 0.5) return;
  cx.save();
  const alpha = !c.alive ? Math.max(0, 1 - c.dyingTimer / 0.5) : 1;
  cx.globalAlpha = alpha;

  // Body
  cx.fillStyle = c.color;
  cx.fillRect(c.x - c.bodyW / 2, c.y, c.bodyW, c.bodyH);

  // Head
  cx.fillStyle = '#ffcc99';
  cx.beginPath();
  cx.arc(c.x, c.y - c.headR * 0.3, c.headR, 0, Math.PI * 2);
  cx.fill();

  // Arms up (surrender pose)
  cx.strokeStyle = c.color;
  cx.lineWidth = 2;
  cx.beginPath();
  cx.moveTo(c.x - c.bodyW * 0.4, c.y + c.bodyH * 0.15);
  cx.lineTo(c.x - c.bodyW * 1.2, c.y - c.bodyH * 0.2);
  cx.stroke();
  cx.beginPath();
  cx.moveTo(c.x + c.bodyW * 0.4, c.y + c.bodyH * 0.15);
  cx.lineTo(c.x + c.bodyW * 1.2, c.y - c.bodyH * 0.2);
  cx.stroke();

  // "CIVILIAN" text
  if (c.alive) {
    cx.fillStyle = '#ffffff80';
    cx.font = `${Math.round(W * 0.008)}px 'Press Start 2P', monospace`;
    cx.textAlign = 'center';
    cx.fillText('DON\'T SHOOT', c.x, c.y - c.headR - 6);
  }

  cx.restore();
}

function drawParticles(dt) {
  particles.forEach(p => {
    cx.save();
    const alpha = p.life / p.maxLife;
    cx.globalAlpha = alpha;
    cx.fillStyle = p.color;
    if (p.type === 'blood') {
      cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    } else {
      cx.beginPath();
      cx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      cx.fill();
    }
    cx.restore();
  });

  // Shell casings
  shellCasings.forEach(s => {
    cx.save();
    cx.globalAlpha = Math.min(1, s.life * 3);
    cx.fillStyle = '#ccaa44';
    cx.translate(s.x, s.y);
    cx.rotate(s.rot);
    cx.fillRect(-3, -1.5, 6, 3);
    cx.fillStyle = '#ffcc66';
    cx.fillRect(-3, -1.5, 2, 3);
    cx.restore();
  });
}

function drawMuzzleFlash() {
  if (muzzleFlash <= 0) return;
  cx.save();
  cx.globalAlpha = muzzleFlash;
  const flashX = W * 0.5, flashY = H * 0.88;
  const r = 15 + muzzleFlash * 25;
  const grad = cx.createRadialGradient(flashX, flashY, 0, flashX, flashY, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.3, '#ffcc44');
  grad.addColorStop(0.7, '#ff660080');
  grad.addColorStop(1, 'transparent');
  cx.fillStyle = grad;
  cx.fillRect(flashX - r, flashY - r, r * 2, r * 2);
  cx.restore();
}

function drawDamageFlash() {
  if (damageFlash <= 0) return;
  cx.save();
  cx.globalAlpha = damageFlash * 0.4;
  cx.fillStyle = '#cc0000';
  cx.fillRect(0, 0, W, H);
  // Vignette
  cx.globalAlpha = damageFlash * 0.6;
  const grad = cx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.7);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, '#880000');
  cx.fillStyle = grad;
  cx.fillRect(0, 0, W, H);
  cx.restore();
}

function drawHUD() {
  cx.save();

  // Top bar background
  cx.fillStyle = '#00000080';
  cx.fillRect(0, 30, W, 36);

  // Level name
  cx.fillStyle = LEVELS[currentLevel].accentColor;
  cx.font = `bold ${Math.round(W * 0.013)}px 'Orbitron', sans-serif`;
  cx.textAlign = 'left';
  cx.fillText(LEVELS[currentLevel].name, 12, 54);

  // Score
  cx.fillStyle = '#ffcc00';
  cx.font = `${Math.round(W * 0.012)}px 'Press Start 2P', monospace`;
  cx.textAlign = 'center';
  cx.fillText('SCORE ' + String(score).padStart(7, '0'), W / 2, 54);

  // Combo
  if (combo > 1) {
    cx.fillStyle = '#ff6600';
    cx.font = `bold ${Math.round(W * 0.018)}px 'Orbitron', sans-serif`;
    cx.textAlign = 'center';
    cx.fillText(combo + 'x COMBO', W / 2, 82);
  }

  // Health bar (bottom left)
  const hbX = 12, hbY = H - 40, hbW = W * 0.18, hbH = 14;
  cx.fillStyle = '#440000';
  cx.fillRect(hbX, hbY, hbW, hbH);
  const hpRatio = health / MAX_HEALTH;
  cx.fillStyle = hpRatio > 0.5 ? '#33cc33' : hpRatio > 0.25 ? '#ffaa00' : '#cc1111';
  cx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
  cx.strokeStyle = '#ffffff40';
  cx.lineWidth = 1;
  cx.strokeRect(hbX, hbY, hbW, hbH);
  cx.fillStyle = '#ffffff';
  cx.font = `${Math.round(W * 0.008)}px 'Press Start 2P', monospace`;
  cx.textAlign = 'left';
  cx.fillText('HEALTH', hbX, hbY - 4);

  // Ammo (bottom right)
  const ammoX = W - 12, ammoY = H - 28;
  cx.textAlign = 'right';
  cx.fillStyle = '#ffffff';
  cx.font = `${Math.round(W * 0.008)}px 'Press Start 2P', monospace`;
  cx.fillText('AMMO', ammoX, ammoY - 16);

  for (let i = 0; i < MAX_AMMO; i++) {
    const bx = ammoX - (MAX_AMMO - i) * 14;
    cx.fillStyle = i < ammo ? '#ffcc00' : '#333333';
    cx.fillRect(bx, ammoY, 10, 16);
    if (i < ammo) {
      cx.fillStyle = '#ff8800';
      cx.fillRect(bx + 1, ammoY + 1, 8, 4);
    }
  }

  // Reloading
  if (reloading) {
    cx.fillStyle = '#ff6600';
    cx.font = `bold ${Math.round(W * 0.016)}px 'Orbitron', sans-serif`;
    cx.textAlign = 'center';
    const dots = '.'.repeat(Math.floor((Date.now() / 250) % 4));
    cx.fillText('RELOADING' + dots, W / 2, H - 60);
    // Reload progress bar
    const rlW = W * 0.12, rlH = 4;
    cx.fillStyle = '#333';
    cx.fillRect(W / 2 - rlW / 2, H - 50, rlW, rlH);
    cx.fillStyle = '#ff6600';
    cx.fillRect(W / 2 - rlW / 2, H - 50, rlW * (1 - reloadTimer / RELOAD_TIME), rlH);
  }

  // High score
  const hi = parseInt(localStorage.getItem(LS_KEY) || '0');
  cx.fillStyle = '#666';
  cx.font = `${Math.round(W * 0.007)}px 'Press Start 2P', monospace`;
  cx.textAlign = 'right';
  cx.fillText('HI ' + String(hi).padStart(7, '0'), W - 12, 54);

  cx.restore();
}

function drawCrosshair() {
  cx.save();
  const size = 18;
  cx.strokeStyle = ammo > 0 && !reloading ? '#ff3333' : '#666666';
  cx.lineWidth = 2;
  cx.shadowColor = '#ff0000';
  cx.shadowBlur = ammo > 0 ? 8 : 0;

  // Outer circle
  cx.beginPath();
  cx.arc(mouseX, mouseY, size, 0, Math.PI * 2);
  cx.stroke();

  // Cross
  cx.beginPath();
  cx.moveTo(mouseX - size - 5, mouseY);
  cx.lineTo(mouseX - size * 0.4, mouseY);
  cx.moveTo(mouseX + size * 0.4, mouseY);
  cx.lineTo(mouseX + size + 5, mouseY);
  cx.moveTo(mouseX, mouseY - size - 5);
  cx.lineTo(mouseX, mouseY - size * 0.4);
  cx.moveTo(mouseX, mouseY + size * 0.4);
  cx.lineTo(mouseX, mouseY + size + 5);
  cx.stroke();

  // Center dot
  cx.fillStyle = '#ff3333';
  cx.beginPath();
  cx.arc(mouseX, mouseY, 2, 0, Math.PI * 2);
  cx.fill();

  cx.restore();
}

// --- Hit Detection ---
function hitTestEnemy(ex, ey) {
  // Check enemies (reverse order for front-to-back priority)
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.state === 'dead' || e.state === 'dying') continue;

    const drawX = e.state === 'popping'
      ? e.startX + (e.targetX - e.startX) * Math.min(e.popTimer / e.popDuration, 1)
      : e.targetX;
    const drawY = e.state === 'popping'
      ? e.startY + (e.targetY - e.startY) * Math.min(e.popTimer / e.popDuration, 1)
      : e.targetY;

    // Headshot check
    const headX = drawX;
    const headY = drawY - e.headR * 0.5;
    const hdx = ex - headX, hdy = ey - headY;
    if (Math.sqrt(hdx * hdx + hdy * hdy) < e.headR * 1.5) {
      return { enemy: e, headshot: true };
    }

    // Body check
    if (ex > drawX - e.bodyW / 2 && ex < drawX + e.bodyW / 2 &&
        ey > drawY && ey < drawY + e.bodyH) {
      return { enemy: e, headshot: false };
    }
  }
  return null;
}

function hitTestCivilian(ex, ey) {
  for (let i = civilians.length - 1; i >= 0; i--) {
    const c = civilians[i];
    if (!c.alive) continue;
    if (ex > c.x - c.bodyW && ex < c.x + c.bodyW &&
        ey > c.y - c.headR * 2 && ey < c.y + c.bodyH) {
      return c;
    }
  }
  return null;
}

// --- Shoot ---
function shoot(x, y) {
  if (reloading) { Audio.play('empty'); return; }
  if (ammo <= 0) { Audio.play('empty'); startReload(); return; }

  ammo--;
  shotsFired++;
  muzzleFlash = 1;
  Audio.play('shoot');
  spawnShellCasing();

  // Check civilian first
  const civ = hitTestCivilian(x, y);
  if (civ) {
    civ.alive = false;
    civiliansHit++;
    health = Math.max(0, health - 15);
    score = Math.max(0, score - 500);
    combo = 0;
    damageFlash = 0.5;
    Audio.play('civilian');
    spawnBlood(civ.x, civ.y, 8);
    if (health <= 0) gameOver();
    return;
  }

  // Check enemies
  const hit = hitTestEnemy(x, y);
  if (hit) {
    const e = hit.enemy;
    const dmg = hit.headshot ? (e.isBoss ? 3 : 1) : 1;
    e.hp -= dmg;
    e.flashTimer = 0.08;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    shotsHit++;
    if (hit.headshot) headshotsCount++;

    Audio.play(e.isBoss ? 'boss_hit' : 'hit');
    spawnBlood(hit.headshot ? e.headX : x, hit.headshot ? e.headY : y, hit.headshot ? 15 : 8);

    if (e.hp <= 0) {
      e.state = 'dying';
      e.dyingTimer = 0;
      enemiesKilled++;
      const basePoints = e.isBoss ? 2000 : 100;
      const headBonus = hit.headshot ? 50 : 0;
      const comboMult = Math.min(combo, 10);
      const quickBonus = e.exposedTime < 0.5 ? 75 : 0;
      score += (basePoints + headBonus + quickBonus) * comboMult;
    }
  } else {
    // Miss
    combo = 0;
    spawnSpark(x, y);
  }

  if (ammo <= 0) startReload();
}

function startReload() {
  if (reloading) return;
  reloading = true;
  reloadTimer = RELOAD_TIME;
  Audio.play('reload');
}

// --- Update ---
function update(dt) {
  if (state !== 'playing') return;

  levelTimer += dt;

  // Process spawn queue
  while (spawnQueue.length && spawnQueue[0].time <= levelTimer) {
    const sp = spawnQueue.shift();
    if (sp.type === 'enemy') {
      enemies.push(createEnemy(sp.sp, currentLevel, false));
    } else if (sp.type === 'boss') {
      const boss = createEnemy(sp.sp, currentLevel, true);
      enemies.push(boss);
      bossActive = boss;
    } else if (sp.type === 'civilian') {
      civilians.push(createCivilian());
    }
  }

  // Update enemies
  enemies.forEach(e => {
    if (e.state === 'dead') return;
    e.flashTimer = Math.max(0, e.flashTimer - dt);

    if (e.state === 'popping') {
      e.popTimer += dt;
      if (e.popTimer >= e.popDuration) {
        e.state = 'exposed';
        e.x = e.targetX;
        e.y = e.targetY;
      }
    } else if (e.state === 'exposed') {
      e.exposedTime += dt;
      e.attackTimer += dt;
      if (e.attackTimer >= e.attackTime) {
        e.state = 'attacking';
      }
    } else if (e.state === 'attacking') {
      // Enemy fires — damage player
      health = Math.max(0, health - e.damage);
      damageFlash = 0.7;
      Audio.play('damage');
      if (health <= 0) { gameOver(); return; }
      // Enemy retreats and becomes dead
      e.state = 'dead';
    } else if (e.state === 'dying') {
      e.dyingTimer += dt;
      if (e.dyingTimer > 0.5) e.state = 'dead';
    }
  });

  // Update civilians
  civilians.forEach(c => {
    if (c.alive) {
      c.x += c.dir * c.speed * dt;
    } else {
      c.dyingTimer += dt;
    }
  });
  civilians = civilians.filter(c => c.alive ? (c.x > -W * 0.2 && c.x < W * 1.2) : c.dyingTimer < 0.6);

  // Update particles
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt; // gravity
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  // Update shell casings
  shellCasings.forEach(s => {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 400 * dt;
    s.rot += s.rotV * dt;
    s.life -= dt;
  });
  shellCasings = shellCasings.filter(s => s.life > 0);

  // Decay effects
  muzzleFlash = Math.max(0, muzzleFlash - dt * 12);
  damageFlash = Math.max(0, damageFlash - dt * 3);

  // Reload
  if (reloading) {
    reloadTimer -= dt;
    if (reloadTimer <= 0) {
      reloading = false;
      ammo = MAX_AMMO;
    }
  }

  // Check level complete — boss must have spawned and all enemies resolved
  if (!levelComplete && spawnQueue.length === 0 && enemies.length > 0) {
    const bossExists = enemies.some(e => e.isBoss);
    const allDone = enemies.every(e => e.state === 'dead' || e.state === 'dying');
    if (bossExists && allDone && levelTimer > 8) {
      levelComplete = true;
      setTimeout(() => showResults(), 800);
    }
  }
}

// --- Render ---
function render() {
  cx.clearRect(0, 0, W, H);
  const lv = LEVELS[currentLevel];

  // Background
  drawBackground(lv);

  // Enemies behind cover
  enemies.forEach(e => drawEnemy(e));

  // Civilians
  civilians.forEach(c => drawCivilian(c));

  // Cover objects (drawn on top to hide enemy spawn)
  drawCoverObjects(lv);

  // Particles
  drawParticles();

  // Effects
  drawMuzzleFlash();
  drawDamageFlash();

  // HUD
  drawHUD();

  // Crosshair
  drawCrosshair();
}

// --- Game Loop ---
let lastTime = 0;
function gameLoop(time) {
  if (state !== 'playing') return;
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// --- Screen Management ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startGame() {
  Audio.init();
  currentLevel = 0;
  totalScore = 0;
  health = MAX_HEALTH;
  startLevel();
}

function startLevel() {
  score = totalScore;
  ammo = MAX_AMMO;
  reloading = false;
  reloadTimer = 0;
  combo = 0; maxCombo = 0;
  shotsFired = 0; shotsHit = 0;
  enemiesKilled = 0; headshotsCount = 0;
  civiliansHit = 0;
  levelTimer = 0;
  levelComplete = false;
  enemies = [];
  civilians = [];
  particles = [];
  shellCasings = [];
  muzzleFlash = 0;
  damageFlash = 0;
  bossActive = null;
  spawnQueue = buildSpawnQueue(currentLevel);
  state = 'playing';
  showScreen('game-screen');
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function showResults() {
  state = 'results';
  Audio.play('level_clear');
  totalScore = score;

  const accuracy = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
  let rating = 'D';
  if (accuracy >= 90 && civiliansHit === 0 && maxCombo >= 8) rating = 'S';
  else if (accuracy >= 75 && civiliansHit === 0) rating = 'A';
  else if (accuracy >= 60) rating = 'B';
  else if (accuracy >= 40) rating = 'C';

  document.getElementById('res-level').textContent = LEVELS[currentLevel].name;
  document.getElementById('res-rating').textContent = rating;
  document.getElementById('res-rating').className = 'rating rating-' + rating;
  document.getElementById('res-score').textContent = String(score).padStart(7, '0');
  document.getElementById('res-enemies').textContent = enemiesKilled;
  document.getElementById('res-accuracy').textContent = accuracy + '%';
  document.getElementById('res-combo').textContent = maxCombo;
  document.getElementById('res-headshots').textContent = headshotsCount;
  document.getElementById('res-civs').textContent = civiliansHit;

  const isLast = currentLevel >= LEVELS.length - 1;
  document.getElementById('btn-next').textContent = isLast ? 'PLAY AGAIN' : 'NEXT LEVEL';
  document.getElementById('btn-next').onclick = () => {
    if (isLast) {
      currentLevel = 0;
      totalScore = 0;
      health = MAX_HEALTH;
    } else {
      currentLevel++;
    }
    startLevel();
  };

  showScreen('results-screen');
  saveHighScore();
}

function gameOver() {
  state = 'gameover';
  Audio.play('game_over');
  totalScore = score;

  document.getElementById('go-score').textContent = 'SCORE: ' + String(score).padStart(7, '0');
  const hi = parseInt(localStorage.getItem(LS_KEY) || '0');
  if (score > hi) {
    document.getElementById('go-highscore').textContent = 'NEW HIGH SCORE!';
  } else {
    document.getElementById('go-highscore').textContent = 'HIGH SCORE: ' + String(hi).padStart(7, '0');
  }

  showScreen('gameover-screen');
  saveHighScore();
}

function saveHighScore() {
  const hi = parseInt(localStorage.getItem(LS_KEY) || '0');
  if (score > hi) localStorage.setItem(LS_KEY, score);
}

// --- Canvas Setup ---
function initCanvas() {
  canvas = document.getElementById('game-canvas');
  cx = canvas.getContext('2d');
  resize();
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}

// --- Input ---
function initInput() {
  const gameScreen = document.getElementById('game-screen');

  gameScreen.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  gameScreen.addEventListener('click', e => {
    if (state !== 'playing') return;
    mouseX = e.clientX;
    mouseY = e.clientY;
    shoot(mouseX, mouseY);
  });

  gameScreen.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    const t = e.touches[0];
    mouseX = t.clientX;
    mouseY = t.clientY;
    shoot(mouseX, mouseY);
  }, { passive: false });

  gameScreen.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    mouseX = t.clientX;
    mouseY = t.clientY;
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') {
      if (state === 'playing' && !reloading && ammo < MAX_AMMO) {
        startReload();
      }
    }
  });

  // Right-click to reload
  gameScreen.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (state === 'playing' && !reloading && ammo < MAX_AMMO) {
      startReload();
    }
  });
}

// --- Init ---
function init() {
  initCanvas();
  initInput();
  window.addEventListener('resize', resize);

  document.getElementById('btn-start').addEventListener('click', () => {
    Audio.init();
    startGame();
  });

  document.getElementById('btn-continue').addEventListener('click', () => {
    health = MAX_HEALTH;
    startLevel();
  });

  document.getElementById('btn-go-menu').addEventListener('click', () => {
    state = 'title';
    showScreen('title-screen');
  });

  document.getElementById('btn-menu').addEventListener('click', () => {
    state = 'title';
    showScreen('title-screen');
  });

  showScreen('title-screen');
}

init();

})();
</script>
