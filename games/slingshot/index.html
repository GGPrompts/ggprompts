<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slingshot Siege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #87CEEB;
            --grass-green: #6abf6a;
            --bird-red: #e74c3c;
            --text-dark: #2c3e50;
            --gold: #FFD700;
            --font-main: 'Fredoka', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: var(--font-main);
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        /* HUD buttons */
        .hud-btn {
            position: absolute;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: var(--font-main);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hud-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.6);
        }

        #btn-menu {
            top: 48px;
            left: 10px;
        }

        #btn-restart {
            top: 48px;
            right: 10px;
        }

        #btn-skip {
            top: 48px;
            right: 100px;
        }

        @media (max-width: 768px) {
            .hud-btn {
                font-size: 12px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="game-canvas"></canvas>
        <button class="hud-btn" id="btn-menu" title="Back to menu">Menu</button>
        <button class="hud-btn" id="btn-restart" title="Restart level">Retry</button>
    </div>

    <script src="physics.js"></script>
    <script src="levels.js"></script>
    <script src="renderer.js"></script>
    <script src="engine.js"></script>
    <script>
        'use strict';

        const canvas = document.getElementById('game-canvas');
        Renderer.init(canvas);

        window.addEventListener('resize', () => Renderer.resize());

        // Input handling
        function getWorldPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX - rect.left;
                cy = e.touches[0].clientY - rect.top;
            } else {
                cx = e.clientX - rect.left;
                cy = e.clientY - rect.top;
            }
            return Renderer.screenToWorld(cx, cy);
        }

        canvas.addEventListener('mousedown', (e) => {
            const w = getWorldPos(e);
            Engine.onPointerDown(w.x, w.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            const w = getWorldPos(e);
            Engine.onPointerMove(w.x, w.y);
        });

        canvas.addEventListener('mouseup', () => {
            Engine.onPointerUp();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const w = getWorldPos(e);
            Engine.onPointerDown(w.x, w.y);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const w = getWorldPos(e);
            Engine.onPointerMove(w.x, w.y);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            Engine.onPointerUp();
        }, { passive: false });

        // HUD buttons
        document.getElementById('btn-menu').addEventListener('click', () => {
            Engine.goToMenu();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            Engine.loadLevel(Engine.getCurrentLevel());
        });

        // Game loop
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 1 / 30);
            lastTime = timestamp;

            Engine.update(dt);
            Engine.render();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame((ts) => {
            lastTime = ts;
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
