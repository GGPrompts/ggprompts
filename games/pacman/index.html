<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC-MAN - Neon Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-yellow: #ffff00;
            --neon-blue: #0088ff;
            --neon-pink: #ff2d7b;
            --neon-cyan: #00ffff;
            --neon-orange: #ff8800;
            --neon-red: #ff3333;
            --neon-green: #39ff14;
            --cabinet-dark: #0a0a1a;
            --cabinet-border: #1a1a3a;
            --cabinet-accent: #222244;
            --glow-yellow: 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffff00;
            --glow-blue: 0 0 10px #0088ff, 0 0 20px #0088ff;
            --glow-pink: 0 0 10px #ff2d7b, 0 0 20px #ff2d7b;
            --font-arcade: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-arcade);
            background: var(--cabinet-dark);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.08) 0px,
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        /* Arcade cabinet frame */
        .cabinet {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
            padding: 8px;
        }

        /* Marquee header */
        .marquee {
            width: 100%;
            text-align: center;
            padding: 8px 16px;
            background: linear-gradient(180deg, #111133 0%, #0a0a1a 100%);
            border: 2px solid var(--neon-blue);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            position: relative;
            overflow: hidden;
        }

        .marquee::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0, 136, 255, 0.05) 50%,
                transparent 100%
            );
            animation: marquee-sweep 3s ease-in-out infinite;
        }

        @keyframes marquee-sweep {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .marquee h1 {
            font-size: clamp(18px, 5vw, 28px);
            color: var(--neon-yellow);
            text-shadow: var(--glow-yellow);
            letter-spacing: 0.15em;
            position: relative;
            z-index: 1;
        }

        .marquee h1 span {
            display: inline-block;
            animation: letter-float 2s ease-in-out infinite;
        }

        .marquee h1 span:nth-child(2) { animation-delay: 0.1s; }
        .marquee h1 span:nth-child(3) { animation-delay: 0.2s; }
        .marquee h1 span:nth-child(4) { animation-delay: 0.3s; }
        .marquee h1 span:nth-child(5) { animation-delay: 0.4s; }
        .marquee h1 span:nth-child(6) { animation-delay: 0.5s; }

        @keyframes letter-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Score bar */
        .score-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #0e0e2a;
            border-left: 2px solid var(--neon-blue);
            border-right: 2px solid var(--neon-blue);
            font-size: clamp(8px, 2vw, 11px);
        }

        .score-section {
            text-align: center;
        }

        .score-label {
            color: #888;
            font-size: 0.7em;
            margin-bottom: 2px;
        }

        .score-value {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(255, 255, 0, 0.5);
        }

        .hi-score .score-value {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        .level-display .score-value {
            color: var(--neon-green);
        }

        /* Screen bezel */
        .screen-bezel {
            width: 100%;
            background: #111;
            border: 2px solid var(--neon-blue);
            border-radius: 0;
            padding: 4px;
            position: relative;
            box-shadow:
                inset 0 0 30px rgba(0, 136, 255, 0.1),
                0 0 15px rgba(0, 136, 255, 0.15);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Controls area */
        .controls-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: linear-gradient(0deg, #111133 0%, #0e0e2a 100%);
            border: 2px solid var(--neon-blue);
            border-top: none;
            border-radius: 0 0 12px 12px;
        }

        .lives-display {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .life-icon {
            width: 14px;
            height: 14px;
            background: var(--neon-yellow);
            border-radius: 50%;
            clip-path: polygon(50% 50%, 100% 0%, 100% 100%, 50% 50%, 0% 100%, 0% 0%);
            box-shadow: 0 0 6px rgba(255, 255, 0, 0.6);
        }

        .controls-hint {
            font-size: 7px;
            color: #555;
            text-align: right;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-neon {
            font-family: var(--font-arcade);
            font-size: 8px;
            padding: 6px 12px;
            border: 1px solid var(--neon-pink);
            background: rgba(255, 45, 123, 0.1);
            color: var(--neon-pink);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-neon:hover {
            background: rgba(255, 45, 123, 0.25);
            box-shadow: var(--glow-pink);
        }

        .btn-neon.muted {
            opacity: 0.4;
        }

        /* Mobile D-pad */
        .dpad-container {
            display: none;
            justify-content: center;
            margin-top: 10px;
            gap: 4px;
        }

        .dpad {
            display: grid;
            grid-template-columns: 48px 48px 48px;
            grid-template-rows: 48px 48px 48px;
            gap: 4px;
        }

        .dpad-btn {
            background: rgba(0, 136, 255, 0.15);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: var(--font-arcade);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .dpad-btn:active {
            background: rgba(0, 136, 255, 0.4);
            box-shadow: var(--glow-blue);
        }

        .dpad-btn.up { grid-column: 2; grid-row: 1; border-radius: 8px 8px 0 0; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; border-radius: 8px 0 0 8px; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; border-radius: 0 8px 8px 0; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; border-radius: 0 0 8px 8px; }
        .dpad-center { grid-column: 2; grid-row: 2; background: rgba(0, 136, 255, 0.05); border: 1px solid rgba(0, 136, 255, 0.2); border-radius: 4px; }

        /* Back link */
        .back-link {
            position: fixed;
            top: 8px;
            left: 8px;
            font-family: var(--font-arcade);
            font-size: 8px;
            color: #555;
            text-decoration: none;
            z-index: 10;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--neon-blue);
        }

        /* Start screen overlay */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 26, 0.95);
            z-index: 5;
            padding: 20px;
            cursor: pointer;
        }

        .start-overlay h2 {
            font-size: clamp(20px, 5vw, 32px);
            color: var(--neon-yellow);
            text-shadow: var(--glow-yellow);
            margin-bottom: 20px;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .start-ghosts {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .start-ghost {
            text-align: center;
            font-size: 9px;
            line-height: 1.6;
        }

        .ghost-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .start-ghost:nth-child(1) { color: #ff3333; }
        .start-ghost:nth-child(2) { color: #ff77cc; }
        .start-ghost:nth-child(3) { color: #33ffff; }
        .start-ghost:nth-child(4) { color: #ffaa33; }

        .start-text {
            color: #888;
            font-size: 8px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .start-controls {
            margin-top: 16px;
            color: #555;
            font-size: 7px;
            text-align: center;
            line-height: 2;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cabinet {
                padding: 4px;
            }
            .dpad-container {
                display: flex;
            }
            .controls-hint {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .marquee h1 {
                font-size: 16px;
            }
            .score-bar {
                font-size: 7px;
                padding: 4px 8px;
            }
            .dpad-btn {
                width: 40px;
                height: 40px;
            }
            .dpad {
                grid-template-columns: 40px 40px 40px;
                grid-template-rows: 40px 40px 40px;
            }
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">&larr; ARCADE</a>

<div class="cabinet">
    <!-- Marquee -->
    <div class="marquee">
        <h1>
            <span>P</span><span>A</span><span>C</span><span>-</span><span>M</span><span>A</span><span>N</span>
        </h1>
    </div>

    <!-- Score bar -->
    <div class="score-bar">
        <div class="score-section">
            <div class="score-label">1UP</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-section hi-score">
            <div class="score-label">HIGH SCORE</div>
            <div class="score-value" id="hi-score">0</div>
        </div>
        <div class="score-section level-display">
            <div class="score-label">LEVEL</div>
            <div class="score-value" id="level">1</div>
        </div>
    </div>

    <!-- Screen -->
    <div class="screen-bezel" id="screen-bezel">
        <canvas id="game-canvas"></canvas>

        <!-- Start overlay -->
        <div class="start-overlay" id="start-overlay">
            <h2>PAC-MAN</h2>
            <div class="start-ghosts">
                <div class="start-ghost">
                    <span class="ghost-icon">&#x1F47E;</span>
                    BLINKY<br>Shadow
                </div>
                <div class="start-ghost">
                    <span class="ghost-icon">&#x1F47E;</span>
                    PINKY<br>Speedy
                </div>
                <div class="start-ghost">
                    <span class="ghost-icon">&#x1F47E;</span>
                    INKY<br>Bashful
                </div>
                <div class="start-ghost">
                    <span class="ghost-icon">&#x1F47E;</span>
                    CLYDE<br>Pokey
                </div>
            </div>
            <div class="start-text">PRESS SPACE OR TAP TO START</div>
            <div class="start-controls">
                ARROW KEYS / WASD TO MOVE<br>
                M TO MUTE &bull; SPACE TO START
            </div>
        </div>
    </div>

    <!-- Controls bar -->
    <div class="controls-bar">
        <div class="lives-display" id="lives-display">
            <div class="life-icon"></div>
            <div class="life-icon"></div>
            <div class="life-icon"></div>
        </div>
        <div class="btn-row">
            <button class="btn-neon" id="btn-mute" title="Toggle sound">SND</button>
            <button class="btn-neon" id="btn-start" title="New game">START</button>
        </div>
        <div class="controls-hint">
            ARROWS / WASD<br>M = MUTE
        </div>
    </div>

    <!-- Mobile D-pad -->
    <div class="dpad-container" id="dpad">
        <div class="dpad">
            <button class="dpad-btn up" data-dir="up">&#9650;</button>
            <button class="dpad-btn left" data-dir="left">&#9664;</button>
            <div class="dpad-center"></div>
            <button class="dpad-btn right" data-dir="right">&#9654;</button>
            <button class="dpad-btn down" data-dir="down">&#9660;</button>
        </div>
    </div>
</div>

<!-- Load modules in dependency order -->
<script src="maze.js"></script>
<script src="audio.js"></script>
<script src="ghosts.js"></script>
<script src="engine.js"></script>

<script>
(function () {
    'use strict';

    const canvas = document.getElementById('game-canvas');
    const scoreEl = document.getElementById('score');
    const hiScoreEl = document.getElementById('hi-score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives-display');
    const startOverlay = document.getElementById('start-overlay');
    const btnMute = document.getElementById('btn-mute');
    const btnStart = document.getElementById('btn-start');

    // Initialize canvas
    PacEngine.initCanvas(canvas);

    // Show saved high score
    hiScoreEl.textContent = PacEngine.getHighScore();

    // Callbacks
    PacEngine.setCallbacks({
        onScoreUpdate(score, hi) {
            scoreEl.textContent = score;
            hiScoreEl.textContent = hi;
        },
        onLivesUpdate(lives) {
            livesEl.innerHTML = '';
            for (let i = 0; i < lives - 1; i++) {
                const div = document.createElement('div');
                div.className = 'life-icon';
                livesEl.appendChild(div);
            }
        },
        onLevelUpdate(level) {
            levelEl.textContent = level;
        },
        onGameOver(score) {
            // Game over handled in engine render
        },
        onGameStart() {
            startOverlay.style.display = 'none';
        },
    });

    function startGame() {
        PacEngine.startGame();
    }

    // Keyboard input
    document.addEventListener('keydown', function (e) {
        const state = PacEngine.getState();

        switch (e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                e.preventDefault();
                PacEngine.setDirection('up');
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                e.preventDefault();
                PacEngine.setDirection('down');
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                e.preventDefault();
                PacEngine.setDirection('left');
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                e.preventDefault();
                PacEngine.setDirection('right');
                break;
            case ' ':
                e.preventDefault();
                if (state === 'idle' || state === 'gameover') {
                    startGame();
                }
                break;
            case 'm':
            case 'M':
                toggleMute();
                break;
        }
    });

    // Start overlay click
    startOverlay.addEventListener('click', function () {
        startGame();
    });

    // Buttons
    btnStart.addEventListener('click', function () {
        startGame();
    });

    btnMute.addEventListener('click', function () {
        toggleMute();
    });

    function toggleMute() {
        PacAudio.setMuted(!PacAudio.isMuted());
        btnMute.classList.toggle('muted', PacAudio.isMuted());
    }

    // Mobile D-pad
    const dpad = document.getElementById('dpad');
    dpad.querySelectorAll('.dpad-btn').forEach(btn => {
        function handleDir(e) {
            e.preventDefault();
            const dir = btn.dataset.dir;
            if (dir) {
                PacEngine.setDirection(dir);
                const state = PacEngine.getState();
                if (state === 'idle' || state === 'gameover') {
                    startGame();
                }
            }
        }
        btn.addEventListener('touchstart', handleDir, { passive: false });
        btn.addEventListener('mousedown', handleDir);
    });

    // Touch swipe support on canvas
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', function (e) {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        const state = PacEngine.getState();
        if (state === 'idle' || state === 'gameover') {
            startGame();
        }
    }, { passive: true });

    canvas.addEventListener('touchmove', function (e) {
        e.preventDefault();
        const touch = e.touches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const threshold = 20;

        if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
            if (Math.abs(dx) > Math.abs(dy)) {
                PacEngine.setDirection(dx > 0 ? 'right' : 'left');
            } else {
                PacEngine.setDirection(dy > 0 ? 'down' : 'up');
            }
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }
    }, { passive: false });

})();
</script>

</body>
</html>
