<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Daily Crossword</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --sepia-bg: #f5f0e1;
  --sepia-dark: #3b2f1e;
  --sepia-medium: #6b5a42;
  --sepia-light: #c4b7a0;
  --sepia-accent: #8b6914;
  --ink-black: #1a1409;
  --cell-size: 40px;
  --cell-border: #3b2f1e;
  --cell-highlight: #f0e6c8;
  --cell-active: #e8d9a8;
  --cell-word: #f0e6c8;
  --cell-correct: #d4edda;
  --cell-incorrect: #f8d7da;
  --cell-revealed: #cce5ff;
  --pencil-color: #a0a0a0;
  --gold-accent: #c9a84c;
  --paper-white: #faf6eb;
  --border-ornament: #8b6914;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--sepia-bg);
  color: var(--sepia-dark);
  font-family: 'Libre Baskerville', Georgia, serif;
  min-height: 100vh;
}

/* ===== HEADER ===== */
.masthead {
  text-align: center;
  padding: 20px 16px 12px;
  border-bottom: 3px double var(--sepia-dark);
  position: relative;
  background: linear-gradient(to bottom, var(--paper-white), var(--sepia-bg));
}

.masthead::before, .masthead::after {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 700px;
}

.masthead::before {
  border-top: 1px solid var(--sepia-light);
  top: 8px;
}

.masthead h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  font-size: 2.4em;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-black);
  margin-bottom: 2px;
}

.masthead .edition-line {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: 0.9em;
  color: var(--sepia-medium);
  margin-bottom: 4px;
}

.masthead .rule {
  display: block;
  width: 60%;
  max-width: 400px;
  margin: 6px auto;
  border: none;
  border-top: 1px solid var(--sepia-light);
}

.nav-back {
  position: absolute;
  top: 16px;
  left: 16px;
  font-size: 0.85em;
  color: var(--sepia-medium);
  text-decoration: none;
  font-style: italic;
}

.nav-back:hover { color: var(--sepia-dark); }

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--sepia-light);
  background: var(--paper-white);
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.toolbar-divider {
  width: 1px;
  height: 24px;
  background: var(--sepia-light);
  margin: 0 6px;
}

.btn {
  font-family: 'Libre Baskerville', Georgia, serif;
  font-size: 0.75em;
  padding: 5px 10px;
  border: 1px solid var(--sepia-light);
  border-radius: 3px;
  background: var(--paper-white);
  color: var(--sepia-dark);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn:hover {
  background: var(--cell-highlight);
  border-color: var(--sepia-medium);
}

.btn.active {
  background: var(--sepia-accent);
  color: var(--paper-white);
  border-color: var(--sepia-accent);
}

.btn-icon {
  font-size: 1em;
  padding: 4px 8px;
}

.timer-display {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.1em;
  font-weight: 700;
  min-width: 60px;
  text-align: center;
  color: var(--sepia-dark);
  letter-spacing: 0.05em;
}

.streak-badge {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.8em;
  padding: 3px 8px;
  background: var(--gold-accent);
  color: var(--paper-white);
  border-radius: 3px;
  font-weight: 700;
}

/* ===== PUZZLE SELECTOR ===== */
.puzzle-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--sepia-light);
  font-size: 0.85em;
}

.puzzle-selector label {
  font-style: italic;
  color: var(--sepia-medium);
}

.puzzle-selector select {
  font-family: 'Libre Baskerville', Georgia, serif;
  font-size: 1em;
  padding: 3px 8px;
  border: 1px solid var(--sepia-light);
  border-radius: 3px;
  background: var(--paper-white);
  color: var(--sepia-dark);
}

/* ===== MAIN LAYOUT ===== */
.game-container {
  display: flex;
  gap: 24px;
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ===== GRID ===== */
.grid-wrapper {
  flex-shrink: 0;
  position: relative;
}

.grid-frame {
  border: 2px solid var(--sepia-dark);
  display: inline-block;
  position: relative;
  box-shadow: 2px 2px 8px rgba(59,47,30,0.2);
}

.grid-frame::before {
  content: '';
  position: absolute;
  top: -6px; left: -6px;
  right: -6px; bottom: -6px;
  border: 1px solid var(--border-ornament);
  pointer-events: none;
}

.grid {
  display: grid;
  position: relative;
}

.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  border: 1px solid var(--cell-border);
  position: relative;
  cursor: pointer;
  background: var(--paper-white);
  user-select: none;
}

.cell.black {
  background: var(--ink-black);
  cursor: default;
}

.cell-number {
  position: absolute;
  top: 1px;
  left: 2px;
  font-size: 10px;
  font-family: 'Libre Baskerville', Georgia, serif;
  color: var(--sepia-dark);
  line-height: 1;
  pointer-events: none;
}

.cell-letter {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink-black);
  pointer-events: none;
}

.cell-letter.pencil {
  color: var(--pencil-color);
  font-weight: 400;
}

.cell.selected {
  background: var(--cell-active);
}

.cell.in-word {
  background: var(--cell-word);
}

.cell.selected.in-word {
  background: var(--cell-active);
}

.cell.correct {
  background: var(--cell-correct) !important;
}

.cell.incorrect {
  background: var(--cell-incorrect) !important;
}

.cell.revealed .cell-letter {
  color: #0066cc;
}

.cell.incorrect::after {
  content: '';
  position: absolute;
  top: 4px; right: 4px;
  width: 6px; height: 6px;
  background: #cc3333;
  border-radius: 50%;
}

/* ===== CLUE PANELS ===== */
.clues-container {
  display: flex;
  gap: 20px;
  flex: 1;
  min-width: 0;
}

.clue-panel {
  flex: 1;
  min-width: 0;
}

.clue-panel h3 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding-bottom: 6px;
  margin-bottom: 8px;
  border-bottom: 2px solid var(--sepia-dark);
  color: var(--ink-black);
}

.clue-list {
  list-style: none;
  max-height: 400px;
  overflow-y: auto;
}

.clue-list::-webkit-scrollbar {
  width: 6px;
}

.clue-list::-webkit-scrollbar-track {
  background: var(--sepia-bg);
}

.clue-list::-webkit-scrollbar-thumb {
  background: var(--sepia-light);
  border-radius: 3px;
}

.clue-item {
  padding: 5px 6px;
  font-size: 0.82em;
  line-height: 1.4;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.1s;
}

.clue-item:hover {
  background: var(--cell-highlight);
}

.clue-item.active {
  background: var(--cell-active);
  font-weight: 700;
}

.clue-item .clue-num {
  font-weight: 700;
  color: var(--sepia-accent);
  margin-right: 4px;
  display: inline;
}

/* ===== DROPDOWN MENU ===== */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--paper-white);
  border: 1px solid var(--sepia-light);
  border-radius: 3px;
  box-shadow: 2px 4px 12px rgba(59,47,30,0.2);
  z-index: 100;
  min-width: 160px;
}

.dropdown-menu.open {
  display: block;
}

.dropdown-menu button {
  display: block;
  width: 100%;
  text-align: left;
  font-family: 'Libre Baskerville', Georgia, serif;
  font-size: 0.78em;
  padding: 7px 12px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--sepia-dark);
}

.dropdown-menu button:hover {
  background: var(--cell-highlight);
}

.dropdown-menu button + button {
  border-top: 1px solid var(--sepia-bg);
}

/* ===== COMPLETION BANNER ===== */
.completion-banner {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(59, 47, 30, 0.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.completion-banner.show {
  display: flex;
}

.completion-card {
  background: var(--paper-white);
  border: 3px double var(--sepia-dark);
  padding: 40px 50px;
  text-align: center;
  max-width: 400px;
  position: relative;
  box-shadow: 4px 4px 20px rgba(26, 20, 9, 0.4);
}

.completion-card::before {
  content: '';
  position: absolute;
  top: -8px; left: -8px;
  right: -8px; bottom: -8px;
  border: 1px solid var(--border-ornament);
  pointer-events: none;
}

.completion-card h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.8em;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}

.completion-card .stats {
  font-size: 0.9em;
  color: var(--sepia-medium);
  margin-bottom: 8px;
}

.completion-card .streak-msg {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: 1.1em;
  color: var(--gold-accent);
  margin: 12px 0;
}

.completion-card .btn {
  margin-top: 16px;
  font-size: 0.9em;
  padding: 8px 24px;
}

/* ===== PAUSE OVERLAY ===== */
.pause-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--sepia-bg);
  z-index: 50;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}

.pause-overlay.show {
  display: flex;
}

.pause-overlay p {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.2em;
  font-style: italic;
  color: var(--sepia-medium);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .masthead h1 { font-size: 1.6em; }

  .game-container {
    flex-direction: column;
    align-items: center;
  }

  .clues-container {
    width: 100%;
  }

  .clue-list {
    max-height: 250px;
  }

  :root {
    --cell-size: 34px;
  }

  .cell-letter { font-size: 17px; }
  .cell-number { font-size: 9px; }

  .toolbar {
    gap: 4px;
    padding: 8px 8px;
  }

  .toolbar-divider { display: none; }
}

@media (max-width: 480px) {
  :root {
    --cell-size: 28px;
  }

  .cell-letter { font-size: 14px; }
  .cell-number { font-size: 8px; }

  .clues-container {
    flex-direction: column;
    gap: 12px;
  }
}
</style>
</head>
<body>

<header class="masthead">
  <a href="../" class="nav-back">&#8592; Games</a>
  <h1>The Daily Crossword</h1>
  <div class="edition-line">A Puzzle for the Discerning Mind</div>
  <hr class="rule">
</header>

<div class="puzzle-selector">
  <label for="puzzle-select">Puzzle:</label>
  <select id="puzzle-select"></select>
</div>

<div class="toolbar">
  <div class="toolbar-group">
    <span class="timer-display" id="timer">0:00</span>
    <button class="btn btn-icon" id="btn-pause" title="Pause">&#9646;&#9646;</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button class="btn" id="btn-pencil">Pencil</button>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group dropdown">
    <button class="btn" id="btn-check">Check &#9662;</button>
    <div class="dropdown-menu" id="menu-check">
      <button data-action="check-letter">Check Letter</button>
      <button data-action="check-word">Check Word</button>
      <button data-action="check-puzzle">Check Puzzle</button>
    </div>
  </div>

  <div class="toolbar-group dropdown">
    <button class="btn" id="btn-reveal">Reveal &#9662;</button>
    <div class="dropdown-menu" id="menu-reveal">
      <button data-action="reveal-letter">Reveal Letter</button>
      <button data-action="reveal-word">Reveal Word</button>
      <button data-action="reveal-puzzle">Reveal Puzzle</button>
    </div>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button class="btn" id="btn-clear">Clear</button>
  </div>

  <div class="toolbar-group">
    <span class="streak-badge" id="streak-badge" style="display:none"></span>
  </div>
</div>

<div class="game-container">
  <div class="grid-wrapper">
    <div class="grid-frame">
      <div class="grid" id="grid"></div>
    </div>
    <div class="pause-overlay" id="pause-overlay">
      <p>Paused</p>
      <button class="btn" id="btn-resume">Resume</button>
    </div>
  </div>

  <div class="clues-container">
    <div class="clue-panel">
      <h3>Across</h3>
      <ul class="clue-list" id="clues-across"></ul>
    </div>
    <div class="clue-panel">
      <h3>Down</h3>
      <ul class="clue-list" id="clues-down"></ul>
    </div>
  </div>
</div>

<div class="completion-banner" id="completion-banner">
  <div class="completion-card">
    <h2>Puzzle Complete</h2>
    <div class="stats" id="completion-stats"></div>
    <div class="streak-msg" id="completion-streak"></div>
    <button class="btn" id="btn-close-banner">Continue</button>
  </div>
</div>

<script src="puzzles.js"></script>
<script>
(function() {
  'use strict';

  // ===== STATE =====
  const puzzles = window.Puzzles;
  let puzzle = null;         // current puzzle object
  let grid = [];             // grid[row][col] = { letter:'', pencil:false, correct:false, revealed:false, incorrect:false }
  let cellNumbers = [];      // cellNumbers[row][col] = number or 0
  let selectedRow = 0;
  let selectedCol = 0;
  let direction = 'across';  // 'across' | 'down'
  let pencilMode = false;
  let paused = false;
  let timerSeconds = 0;
  let timerInterval = null;
  let solved = false;

  // DOM refs
  const $grid = document.getElementById('grid');
  const $timer = document.getElementById('timer');
  const $cluesAcross = document.getElementById('clues-across');
  const $cluesDown = document.getElementById('clues-down');
  const $puzzleSelect = document.getElementById('puzzle-select');
  const $pauseOverlay = document.getElementById('pause-overlay');
  const $completionBanner = document.getElementById('completion-banner');
  const $completionStats = document.getElementById('completion-stats');
  const $completionStreak = document.getElementById('completion-streak');
  const $streakBadge = document.getElementById('streak-badge');

  // ===== PUZZLE SELECTOR =====
  function populateSelector() {
    puzzles.forEach(function(p, i) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = '#' + p.id + ' - ' + p.title + ' (' + p.difficulty + ', ' + p.size + 'x' + p.size + ')';
      $puzzleSelect.appendChild(opt);
    });
  }

  $puzzleSelect.addEventListener('change', function() {
    loadPuzzle(parseInt(this.value));
  });

  // ===== LOAD PUZZLE =====
  function loadPuzzle(index) {
    puzzle = puzzles[index];
    solved = false;
    pencilMode = false;
    document.getElementById('btn-pencil').classList.remove('active');
    timerSeconds = 0;
    updateTimer();
    startTimer();

    // Init state grid
    grid = [];
    cellNumbers = [];
    for (let r = 0; r < puzzle.size; r++) {
      grid[r] = [];
      cellNumbers[r] = [];
      for (let c = 0; c < puzzle.size; c++) {
        grid[r][c] = { letter: '', pencil: false, correct: false, revealed: false, incorrect: false };
        cellNumbers[r][c] = 0;
      }
    }

    // Assign cell numbers
    const numMap = {};
    ['across', 'down'].forEach(function(dir) {
      puzzle.clues[dir].forEach(function(clue) {
        numMap[clue.row + ',' + clue.col] = clue.number;
      });
    });
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        const key = r + ',' + c;
        if (numMap[key]) cellNumbers[r][c] = numMap[key];
      }
    }

    // Load saved progress
    loadProgress();

    buildGrid();
    buildClues();

    selectedRow = 0;
    selectedCol = 0;
    direction = 'across';
    // Move to first non-black cell
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] !== '#') {
          selectedRow = r;
          selectedCol = c;
          updateHighlights();
          return;
        }
      }
    }
  }

  // ===== BUILD GRID DOM =====
  function buildGrid() {
    $grid.innerHTML = '';
    $grid.style.gridTemplateColumns = 'repeat(' + puzzle.size + ', var(--cell-size))';
    $grid.style.gridTemplateRows = 'repeat(' + puzzle.size + ', var(--cell-size))';

    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;

        if (puzzle.grid[r][c] === '#') {
          cell.classList.add('black');
        } else {
          if (cellNumbers[r][c]) {
            const numSpan = document.createElement('span');
            numSpan.className = 'cell-number';
            numSpan.textContent = cellNumbers[r][c];
            cell.appendChild(numSpan);
          }
          const letterSpan = document.createElement('span');
          letterSpan.className = 'cell-letter';
          cell.appendChild(letterSpan);

          cell.addEventListener('click', function() {
            onCellClick(r, c);
          });
        }

        $grid.appendChild(cell);
      }
    }
    renderLetters();
  }

  // ===== BUILD CLUES =====
  function buildClues() {
    $cluesAcross.innerHTML = '';
    $cluesDown.innerHTML = '';

    puzzle.clues.across.forEach(function(clue) {
      const li = document.createElement('li');
      li.className = 'clue-item';
      li.dataset.dir = 'across';
      li.dataset.number = clue.number;
      li.dataset.row = clue.row;
      li.dataset.col = clue.col;
      li.innerHTML = '<span class="clue-num">' + clue.number + '</span>' + escapeHtml(clue.clue);
      li.addEventListener('click', function() {
        direction = 'across';
        selectedRow = clue.row;
        selectedCol = clue.col;
        updateHighlights();
        focusGrid();
      });
      $cluesAcross.appendChild(li);
    });

    puzzle.clues.down.forEach(function(clue) {
      const li = document.createElement('li');
      li.className = 'clue-item';
      li.dataset.dir = 'down';
      li.dataset.number = clue.number;
      li.dataset.row = clue.row;
      li.dataset.col = clue.col;
      li.innerHTML = '<span class="clue-num">' + clue.number + '</span>' + escapeHtml(clue.clue);
      li.addEventListener('click', function() {
        direction = 'down';
        selectedRow = clue.row;
        selectedCol = clue.col;
        updateHighlights();
        focusGrid();
      });
      $cluesDown.appendChild(li);
    });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ===== CELL CLICK =====
  function onCellClick(r, c) {
    if (puzzle.grid[r][c] === '#') return;
    if (r === selectedRow && c === selectedCol) {
      // Toggle direction
      direction = direction === 'across' ? 'down' : 'across';
    } else {
      selectedRow = r;
      selectedCol = c;
    }
    updateHighlights();
    focusGrid();
  }

  // ===== FIND ACTIVE CLUE =====
  function getActiveClue() {
    const clues = puzzle.clues[direction];
    for (let i = clues.length - 1; i >= 0; i--) {
      const cl = clues[i];
      if (direction === 'across') {
        if (selectedRow === cl.row && selectedCol >= cl.col && selectedCol < cl.col + cl.length) return cl;
      } else {
        if (selectedCol === cl.col && selectedRow >= cl.row && selectedRow < cl.row + cl.length) return cl;
      }
    }
    return null;
  }

  // ===== GET CELLS FOR A CLUE =====
  function getClueCells(clue, dir) {
    const cells = [];
    for (let i = 0; i < clue.length; i++) {
      const r = dir === 'across' ? clue.row : clue.row + i;
      const c = dir === 'across' ? clue.col + i : clue.col;
      cells.push({ row: r, col: c });
    }
    return cells;
  }

  // ===== UPDATE HIGHLIGHTS =====
  function updateHighlights() {
    // Clear old highlights
    document.querySelectorAll('.cell.selected, .cell.in-word').forEach(function(el) {
      el.classList.remove('selected', 'in-word');
    });

    // Highlight active word
    const clue = getActiveClue();
    if (clue) {
      const cells = getClueCells(clue, direction);
      cells.forEach(function(pos) {
        getCellEl(pos.row, pos.col).classList.add('in-word');
      });
    }

    // Highlight selected cell
    const selEl = getCellEl(selectedRow, selectedCol);
    if (selEl) selEl.classList.add('selected');

    // Highlight active clue in list
    document.querySelectorAll('.clue-item.active').forEach(function(el) {
      el.classList.remove('active');
    });
    if (clue) {
      const list = direction === 'across' ? $cluesAcross : $cluesDown;
      const item = list.querySelector('[data-number="' + clue.number + '"]');
      if (item) {
        item.classList.add('active');
        item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
  }

  // ===== RENDER LETTERS =====
  function renderLetters() {
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] === '#') continue;
        const cellEl = getCellEl(r, c);
        const letterEl = cellEl.querySelector('.cell-letter');
        const state = grid[r][c];
        letterEl.textContent = state.letter;
        letterEl.classList.toggle('pencil', state.pencil && !state.revealed);

        cellEl.classList.toggle('correct', state.correct);
        cellEl.classList.toggle('incorrect', state.incorrect);
        cellEl.classList.toggle('revealed', state.revealed);
      }
    }
  }

  // ===== GET CELL DOM =====
  function getCellEl(r, c) {
    return $grid.children[r * puzzle.size + c];
  }

  function focusGrid() {
    $grid.focus();
  }

  // ===== KEYBOARD =====
  $grid.setAttribute('tabindex', '0');

  $grid.addEventListener('keydown', function(e) {
    if (solved || paused) return;

    const key = e.key;

    if (key >= 'a' && key <= 'z' || key >= 'A' && key <= 'Z') {
      e.preventDefault();
      enterLetter(key.toUpperCase());
      return;
    }

    switch(key) {
      case 'Backspace':
        e.preventDefault();
        deleteLetter();
        break;
      case 'Delete':
        e.preventDefault();
        clearCurrentCell();
        break;
      case 'Tab':
        e.preventDefault();
        if (e.shiftKey) prevClue(); else nextClue();
        break;
      case 'ArrowRight':
        e.preventDefault();
        moveSelection(0, 1);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        moveSelection(0, -1);
        break;
      case 'ArrowDown':
        e.preventDefault();
        moveSelection(1, 0);
        break;
      case 'ArrowUp':
        e.preventDefault();
        moveSelection(-1, 0);
        break;
      case ' ':
        e.preventDefault();
        direction = direction === 'across' ? 'down' : 'across';
        updateHighlights();
        break;
    }
  });

  function enterLetter(ch) {
    if (puzzle.grid[selectedRow][selectedCol] === '#') return;
    const state = grid[selectedRow][selectedCol];
    if (state.revealed) {
      advanceCursor();
      return;
    }
    state.letter = ch;
    state.pencil = pencilMode;
    state.incorrect = false;
    state.correct = false;
    renderLetters();
    saveProgress();
    advanceCursor();
    checkCompletion();
  }

  function deleteLetter() {
    const state = grid[selectedRow][selectedCol];
    if (state.letter && !state.revealed) {
      state.letter = '';
      state.pencil = false;
      state.incorrect = false;
      state.correct = false;
      renderLetters();
      saveProgress();
    } else {
      retreatCursor();
      const st2 = grid[selectedRow][selectedCol];
      if (!st2.revealed) {
        st2.letter = '';
        st2.pencil = false;
        st2.incorrect = false;
        st2.correct = false;
        renderLetters();
        saveProgress();
      }
    }
  }

  function clearCurrentCell() {
    const state = grid[selectedRow][selectedCol];
    if (state.revealed) return;
    state.letter = '';
    state.pencil = false;
    state.incorrect = false;
    state.correct = false;
    renderLetters();
    saveProgress();
  }

  function advanceCursor() {
    const dr = direction === 'down' ? 1 : 0;
    const dc = direction === 'across' ? 1 : 0;
    let r = selectedRow + dr;
    let c = selectedCol + dc;
    if (r < puzzle.size && c < puzzle.size && puzzle.grid[r][c] !== '#') {
      selectedRow = r;
      selectedCol = c;
      updateHighlights();
    }
  }

  function retreatCursor() {
    const dr = direction === 'down' ? -1 : 0;
    const dc = direction === 'across' ? -1 : 0;
    let r = selectedRow + dr;
    let c = selectedCol + dc;
    if (r >= 0 && c >= 0 && puzzle.grid[r][c] !== '#') {
      selectedRow = r;
      selectedCol = c;
      updateHighlights();
    }
  }

  function moveSelection(dr, dc) {
    // Set direction based on arrow
    if (dc !== 0 && direction !== 'across') {
      direction = 'across';
      updateHighlights();
      return;
    }
    if (dr !== 0 && direction !== 'down') {
      direction = 'down';
      updateHighlights();
      return;
    }

    let r = selectedRow + dr;
    let c = selectedCol + dc;
    // Skip black cells
    while (r >= 0 && r < puzzle.size && c >= 0 && c < puzzle.size) {
      if (puzzle.grid[r][c] !== '#') {
        selectedRow = r;
        selectedCol = c;
        updateHighlights();
        return;
      }
      r += dr;
      c += dc;
    }
  }

  function nextClue() {
    const allClues = puzzle.clues.across.map(function(cl) { return { clue: cl, dir: 'across' }; })
      .concat(puzzle.clues.down.map(function(cl) { return { clue: cl, dir: 'down' }; }));
    const current = getActiveClue();
    let idx = -1;
    if (current) {
      for (let i = 0; i < allClues.length; i++) {
        if (allClues[i].clue.number === current.number && allClues[i].dir === direction) {
          idx = i;
          break;
        }
      }
    }
    idx = (idx + 1) % allClues.length;
    direction = allClues[idx].dir;
    selectedRow = allClues[idx].clue.row;
    selectedCol = allClues[idx].clue.col;
    updateHighlights();
  }

  function prevClue() {
    const allClues = puzzle.clues.across.map(function(cl) { return { clue: cl, dir: 'across' }; })
      .concat(puzzle.clues.down.map(function(cl) { return { clue: cl, dir: 'down' }; }));
    const current = getActiveClue();
    let idx = 0;
    if (current) {
      for (let i = 0; i < allClues.length; i++) {
        if (allClues[i].clue.number === current.number && allClues[i].dir === direction) {
          idx = i;
          break;
        }
      }
    }
    idx = (idx - 1 + allClues.length) % allClues.length;
    direction = allClues[idx].dir;
    selectedRow = allClues[idx].clue.row;
    selectedCol = allClues[idx].clue.col;
    updateHighlights();
  }

  // ===== CHECK / REVEAL =====
  function checkLetter() {
    if (puzzle.grid[selectedRow][selectedCol] === '#') return;
    const state = grid[selectedRow][selectedCol];
    if (!state.letter || state.revealed) return;
    if (state.letter === puzzle.grid[selectedRow][selectedCol]) {
      state.correct = true;
      state.incorrect = false;
    } else {
      state.incorrect = true;
      state.correct = false;
    }
    renderLetters();
    saveProgress();
  }

  function checkWord() {
    const clue = getActiveClue();
    if (!clue) return;
    const cells = getClueCells(clue, direction);
    cells.forEach(function(pos) {
      const state = grid[pos.row][pos.col];
      if (!state.letter || state.revealed) return;
      if (state.letter === puzzle.grid[pos.row][pos.col]) {
        state.correct = true;
        state.incorrect = false;
      } else {
        state.incorrect = true;
        state.correct = false;
      }
    });
    renderLetters();
    saveProgress();
  }

  function checkPuzzle() {
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] === '#') continue;
        const state = grid[r][c];
        if (!state.letter || state.revealed) continue;
        if (state.letter === puzzle.grid[r][c]) {
          state.correct = true;
          state.incorrect = false;
        } else {
          state.incorrect = true;
          state.correct = false;
        }
      }
    }
    renderLetters();
    saveProgress();
  }

  function revealLetter() {
    if (puzzle.grid[selectedRow][selectedCol] === '#') return;
    const state = grid[selectedRow][selectedCol];
    state.letter = puzzle.grid[selectedRow][selectedCol];
    state.revealed = true;
    state.pencil = false;
    state.incorrect = false;
    state.correct = false;
    renderLetters();
    saveProgress();
    checkCompletion();
  }

  function revealWord() {
    const clue = getActiveClue();
    if (!clue) return;
    const cells = getClueCells(clue, direction);
    cells.forEach(function(pos) {
      const state = grid[pos.row][pos.col];
      state.letter = puzzle.grid[pos.row][pos.col];
      state.revealed = true;
      state.pencil = false;
      state.incorrect = false;
      state.correct = false;
    });
    renderLetters();
    saveProgress();
    checkCompletion();
  }

  function revealPuzzle() {
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] === '#') continue;
        const state = grid[r][c];
        state.letter = puzzle.grid[r][c];
        state.revealed = true;
        state.pencil = false;
        state.incorrect = false;
        state.correct = false;
      }
    }
    renderLetters();
    saveProgress();
    checkCompletion();
  }

  function clearPuzzle() {
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] === '#') continue;
        const state = grid[r][c];
        if (state.revealed) continue;
        state.letter = '';
        state.pencil = false;
        state.incorrect = false;
        state.correct = false;
      }
    }
    renderLetters();
    saveProgress();
  }

  // ===== COMPLETION =====
  function checkCompletion() {
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (puzzle.grid[r][c] === '#') continue;
        if (grid[r][c].letter !== puzzle.grid[r][c]) return;
      }
    }
    // All correct
    solved = true;
    stopTimer();

    // Check if any cells were revealed (for streak purposes)
    let anyRevealed = false;
    for (let r = 0; r < puzzle.size; r++) {
      for (let c = 0; c < puzzle.size; c++) {
        if (grid[r][c].revealed) { anyRevealed = true; break; }
      }
      if (anyRevealed) break;
    }

    // Update streak
    const streakData = updateStreak(!anyRevealed);

    // Show banner
    const minutes = Math.floor(timerSeconds / 60);
    const seconds = timerSeconds % 60;
    $completionStats.textContent = 'Time: ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds +
      (anyRevealed ? ' (with hints)' : '');
    if (streakData.streak > 0 && !anyRevealed) {
      $completionStreak.textContent = 'Streak: ' + streakData.streak + ' day' + (streakData.streak > 1 ? 's' : '') + '!';
    } else {
      $completionStreak.textContent = '';
    }
    $completionBanner.classList.add('show');
    clearProgress();
  }

  // ===== TIMER =====
  function startTimer() {
    stopTimer();
    paused = false;
    $pauseOverlay.classList.remove('show');
    timerInterval = setInterval(function() {
      if (!paused) {
        timerSeconds++;
        updateTimer();
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function updateTimer() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    $timer.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  }

  function togglePause() {
    paused = !paused;
    $pauseOverlay.classList.toggle('show', paused);
    document.getElementById('btn-pause').textContent = paused ? '\u25B6' : '\u23F8';
  }

  // ===== PENCIL MODE =====
  document.getElementById('btn-pencil').addEventListener('click', function() {
    pencilMode = !pencilMode;
    this.classList.toggle('active', pencilMode);
  });

  // ===== PAUSE =====
  document.getElementById('btn-pause').addEventListener('click', togglePause);
  document.getElementById('btn-resume').addEventListener('click', togglePause);

  // ===== DROPDOWN MENUS =====
  function setupDropdown(btnId, menuId) {
    const btn = document.getElementById(btnId);
    const menu = document.getElementById(menuId);

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      // Close other menus
      document.querySelectorAll('.dropdown-menu.open').forEach(function(m) {
        if (m !== menu) m.classList.remove('open');
      });
      menu.classList.toggle('open');
    });
  }

  setupDropdown('btn-check', 'menu-check');
  setupDropdown('btn-reveal', 'menu-reveal');

  document.addEventListener('click', function() {
    document.querySelectorAll('.dropdown-menu.open').forEach(function(m) {
      m.classList.remove('open');
    });
  });

  // Action handlers
  document.querySelectorAll('.dropdown-menu button').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const action = this.dataset.action;
      document.querySelectorAll('.dropdown-menu.open').forEach(function(m) { m.classList.remove('open'); });
      switch (action) {
        case 'check-letter': checkLetter(); break;
        case 'check-word': checkWord(); break;
        case 'check-puzzle': checkPuzzle(); break;
        case 'reveal-letter': revealLetter(); break;
        case 'reveal-word': revealWord(); break;
        case 'reveal-puzzle': revealPuzzle(); break;
      }
      focusGrid();
    });
  });

  // Clear button
  document.getElementById('btn-clear').addEventListener('click', function() {
    clearPuzzle();
    focusGrid();
  });

  // Close completion banner
  document.getElementById('btn-close-banner').addEventListener('click', function() {
    $completionBanner.classList.remove('show');
  });

  // ===== STREAK TRACKING =====
  function getStreakData() {
    try {
      const raw = localStorage.getItem('crossword-streak');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { streak: 0, lastDate: null };
  }

  function updateStreak(cleanSolve) {
    const data = getStreakData();
    const today = new Date().toISOString().slice(0, 10);

    if (!cleanSolve) {
      // Hints used -- don't break streak, just don't increment
      saveStreakData(data);
      return data;
    }

    if (data.lastDate === today) {
      // Already solved today
      saveStreakData(data);
      return data;
    }

    // Check if yesterday
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = yesterday.toISOString().slice(0, 10);

    if (data.lastDate === yStr) {
      data.streak++;
    } else {
      data.streak = 1;
    }
    data.lastDate = today;
    saveStreakData(data);
    return data;
  }

  function saveStreakData(data) {
    try {
      localStorage.setItem('crossword-streak', JSON.stringify(data));
    } catch(e) {}
    showStreak(data);
  }

  function showStreak(data) {
    if (data && data.streak > 0) {
      $streakBadge.style.display = '';
      $streakBadge.textContent = 'Streak: ' + data.streak;
    } else {
      $streakBadge.style.display = 'none';
    }
  }

  // ===== PROGRESS SAVE / LOAD =====
  function getProgressKey() {
    return 'crossword-progress-' + puzzle.id;
  }

  function saveProgress() {
    try {
      const data = {
        grid: grid.map(function(row) {
          return row.map(function(cell) {
            return { l: cell.letter, p: cell.pencil, r: cell.revealed };
          });
        }),
        time: timerSeconds
      };
      localStorage.setItem(getProgressKey(), JSON.stringify(data));
    } catch(e) {}
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(getProgressKey());
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.grid && data.grid.length === puzzle.size) {
        for (let r = 0; r < puzzle.size; r++) {
          for (let c = 0; c < puzzle.size; c++) {
            if (data.grid[r] && data.grid[r][c]) {
              grid[r][c].letter = data.grid[r][c].l || '';
              grid[r][c].pencil = !!data.grid[r][c].p;
              grid[r][c].revealed = !!data.grid[r][c].r;
            }
          }
        }
      }
      if (data.time) timerSeconds = data.time;
    } catch(e) {}
  }

  function clearProgress() {
    try {
      localStorage.removeItem(getProgressKey());
    } catch(e) {}
  }

  // ===== INIT =====
  populateSelector();
  showStreak(getStreakData());
  loadPuzzle(0);
  focusGrid();

})();
</script>
</body>
</html>
