<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELI ATTACK — Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root {
  --sky-top: #1a0a2e;
  --sky-mid: #2d1b69;
  --sky-bot: #4a2c8a;
  --ground: #2a3a1a;
  --ground-dark: #1e2b12;
  --hud-bg: rgba(0,0,0,0.7);
  --hud-text: #00ff88;
  --hud-warn: #ff4444;
  --hud-ammo: #ffaa00;
  --health-bar: #00cc44;
  --health-low: #ff2222;
  --accent: #ff6600;
  --explosion: #ffcc00;
  --font-pixel: 'Press Start 2P', monospace;
  --font-display: 'Russo One', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  font-family: var(--font-pixel);
  user-select: none;
  -webkit-user-select: none;
  cursor: crosshair;
}

.back-link {
  position: fixed;
  top: 8px;
  left: 12px;
  z-index: 100;
  font-family: var(--font-display);
  font-size: 1rem;
  color: #fff;
  text-decoration: none;
  background: rgba(0,0,0,0.6);
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
}
.back-link:hover { background: rgba(255,255,255,0.2); }

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* Title screen overlay */
#title-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-mid), var(--sky-bot));
}

#title-screen h1 {
  font-family: var(--font-display);
  font-size: 4rem;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(255,102,0,0.6), 0 4px 0 #331a00;
  margin-bottom: 0.5rem;
  letter-spacing: 4px;
}

#title-screen .subtitle {
  font-family: var(--font-pixel);
  font-size: 0.7rem;
  color: var(--hud-text);
  margin-bottom: 2rem;
}

#title-screen .controls-info {
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  color: #aaa;
  line-height: 2;
  text-align: center;
  margin-bottom: 2rem;
}

#title-screen .start-btn {
  font-family: var(--font-pixel);
  font-size: 0.9rem;
  color: #fff;
  background: var(--accent);
  border: none;
  padding: 14px 40px;
  cursor: pointer;
  animation: pulse 1.5s ease-in-out infinite;
}
#title-screen .start-btn:hover { background: #ff8833; }

#title-screen .high-score {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  color: var(--hud-ammo);
  margin-top: 1.5rem;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* Game over overlay */
#game-over {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 50;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.85);
}

#game-over h2 {
  font-family: var(--font-display);
  font-size: 3rem;
  color: var(--hud-warn);
  margin-bottom: 1rem;
}

#game-over .final-score {
  font-family: var(--font-pixel);
  font-size: 1rem;
  color: #fff;
  margin-bottom: 0.5rem;
}

#game-over .final-wave {
  font-family: var(--font-pixel);
  font-size: 0.7rem;
  color: var(--hud-text);
  margin-bottom: 0.5rem;
}

#game-over .new-high {
  font-family: var(--font-pixel);
  font-size: 0.65rem;
  color: var(--hud-ammo);
  margin-bottom: 1.5rem;
}

#game-over .restart-btn {
  font-family: var(--font-pixel);
  font-size: 0.8rem;
  color: #fff;
  background: var(--accent);
  border: none;
  padding: 12px 36px;
  cursor: pointer;
}
#game-over .restart-btn:hover { background: #ff8833; }

@media (max-width: 768px) {
  #title-screen h1 { font-size: 2.2rem; }
  #title-screen .subtitle { font-size: 0.55rem; }
  #title-screen .controls-info { font-size: 0.45rem; }
  .back-link { font-size: 0.8rem; padding: 3px 8px; }
}
</style>
</head>
<body>

<a href="../" class="back-link">&larr; Arcade</a>

<div id="title-screen">
  <h1>HELI ATTACK</h1>
  <div class="subtitle">SIDE-SCROLLING SHOOTER</div>
  <div class="controls-info">
    A/D or ARROWS &mdash; Move &nbsp;|&nbsp; W or SPACE &mdash; Jump<br>
    MOUSE AIM + CLICK &mdash; Shoot &nbsp;|&nbsp; 1-6 or SCROLL &mdash; Weapons<br>
    R &mdash; Reload
  </div>
  <button class="start-btn" id="start-btn">START GAME</button>
  <div class="high-score" id="title-high-score"></div>
</div>

<div id="game-over">
  <h2>GAME OVER</h2>
  <div class="final-score" id="final-score"></div>
  <div class="final-wave" id="final-wave"></div>
  <div class="new-high" id="new-high"></div>
  <button class="restart-btn" id="restart-btn">PLAY AGAIN</button>
</div>

<canvas id="game"></canvas>

<script>
(() => {
'use strict';

/* ===== CONSTANTS ===== */
const GRAVITY = 0.6;
const PLAYER_SPEED = 4;
const PLAYER_JUMP = -12;
const PLAYER_MAX_HP = 100;
const GROUND_HEIGHT_RATIO = 0.18;
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}
const WEAPON_DEFS = [
  { name: 'Machine Gun', key: '1', ammo: Infinity, maxAmmo: Infinity, fireRate: 5, damage: 8, speed: 14, spread: 0.04, color: '#ffee00', size: 3, sound: 'mg', auto: true },
  { name: 'Shotgun',     key: '2', ammo: 0, maxAmmo: 40, fireRate: 20, damage: 6, speed: 12, spread: 0.15, color: '#ff8844', size: 4, pellets: 6, sound: 'shotgun', auto: false },
  { name: 'Rocket',      key: '3', ammo: 0, maxAmmo: 20, fireRate: 30, damage: 50, speed: 8, spread: 0.02, color: '#ff4400', size: 6, explosive: 60, sound: 'rocket', auto: false },
  { name: 'Laser',       key: '4', ammo: 0, maxAmmo: 100, fireRate: 2, damage: 15, speed: 40, spread: 0, color: '#00ffff', size: 2.5, piercing: true, sound: 'laser', auto: true },
  { name: 'Grenades',    key: '5', ammo: 0, maxAmmo: 30, fireRate: 25, damage: 40, speed: 10, spread: 0.03, color: '#44ff44', size: 5, bouncing: true, explosive: 50, sound: 'grenade', auto: false },
  { name: 'Railgun',     key: '6', ammo: 0, maxAmmo: 15, fireRate: 45, damage: 120, speed: 60, spread: 0, color: '#ff00ff', size: 3, piercing: true, railTrail: true, sound: 'rail', auto: false },
];

/* ===== CANVAS SETUP ===== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, groundY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H * (1 - GROUND_HEIGHT_RATIO);
}
resize();
window.addEventListener('resize', resize);

/* ===== AUDIO ENGINE ===== */
const Audio = (() => {
  let actx = null;
  function init() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function play(type) {
    if (!actx) return;
    const t = actx.currentTime;
    const g = actx.createGain();
    g.connect(actx.destination);
    const osc = actx.createOscillator();
    switch (type) {
      case 'mg':
        osc.type = 'square'; osc.frequency.value = 200 + Math.random() * 80;
        g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(g); osc.start(t); osc.stop(t + 0.05); break;
      case 'shotgun':
        osc.type = 'sawtooth'; osc.frequency.value = 100;
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g); osc.start(t); osc.stop(t + 0.12); break;
      case 'rocket':
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t); osc.frequency.linearRampToValueAtTime(40, t + 0.3);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(g); osc.start(t); osc.stop(t + 0.3); break;
      case 'laser':
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, t); osc.frequency.linearRampToValueAtTime(800, t + 0.08);
        g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(g); osc.start(t); osc.stop(t + 0.08); break;
      case 'grenade':
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(100, t + 0.15);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(g); osc.start(t); osc.stop(t + 0.15); break;
      case 'rail':
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2000, t); osc.frequency.linearRampToValueAtTime(200, t + 0.25);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(g); osc.start(t); osc.stop(t + 0.25); break;
      case 'explode': {
        const buf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = actx.createBufferSource(); src.buffer = buf;
        g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        src.connect(g); src.start(t); return; }
      case 'pickup': {
        const o2 = actx.createOscillator(); o2.type = 'sine';
        o2.frequency.setValueAtTime(400, t); o2.frequency.linearRampToValueAtTime(800, t + 0.15);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o2.connect(g); o2.start(t); o2.stop(t + 0.2); return; }
      case 'hit':
        osc.type = 'square'; osc.frequency.value = 150;
        g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(g); osc.start(t); osc.stop(t + 0.06); break;
      case 'playerHit':
        osc.type = 'square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(100, t + 0.1);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(g); osc.start(t); osc.stop(t + 0.1); break;
      case 'waveStart': {
        const o3 = actx.createOscillator(); o3.type = 'square';
        o3.frequency.setValueAtTime(200, t); o3.frequency.linearRampToValueAtTime(600, t + 0.3);
        g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0.08, t + 0.2); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        o3.connect(g); o3.start(t); o3.stop(t + 0.4); return; }
      default: return;
    }
  }
  return { init, play };
})();

/* ===== GAME STATE ===== */
let state = 'title'; // title, playing, gameover
let player, bullets = [], enemies = [], particles = [], pickups = [], score = 0, wave = 0, waveTimer = 0, waveEnemiesLeft = 0, shakeMag = 0, shakeTimer = 0;
let weapons = [], currentWeapon = 0, fireCooldown = 0;
let mouseX = 0, mouseY = 0, mouseDown = false;
let keys = {};
let railTrails = [];
let waveAnnounceTicks = 0;
let highScore = parseInt(localStorage.getItem('heliAttackHigh') || '0', 10);

function resetGame() {
  player = { x: W / 2, y: groundY, vx: 0, vy: 0, hp: PLAYER_MAX_HP, facing: 1, onGround: true, invuln: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  pickups = [];
  railTrails = [];
  score = 0;
  wave = 0;
  waveTimer = 0;
  waveEnemiesLeft = 0;
  shakeMag = 0;
  shakeTimer = 0;
  fireCooldown = 0;
  weapons = WEAPON_DEFS.map(w => ({ ...w, ammo: w.ammo }));
  weapons[0].ammo = Infinity;
  currentWeapon = 0;
  waveAnnounceTicks = 0;
  nextWave();
}

/* ===== WAVE SYSTEM ===== */
function nextWave() {
  wave++;
  waveAnnounceTicks = 120;
  Audio.play('waveStart');
  const isBoss = wave % 5 === 0;
  if (isBoss) {
    waveEnemiesLeft = 1;
    spawnBoss();
  } else {
    const heliCount = Math.min(2 + Math.floor(wave * 0.8), 12);
    const groundCount = Math.min(Math.floor(wave * 0.5), 6);
    waveEnemiesLeft = heliCount + groundCount;
    for (let i = 0; i < heliCount; i++) setTimeout(() => spawnHeli(), i * 600);
    for (let i = 0; i < groundCount; i++) setTimeout(() => spawnGround(), i * 800 + 300);
  }
}

function spawnHeli() {
  if (state !== 'playing') return;
  const fromLeft = Math.random() < 0.5;
  const pattern = ['hover', 'strafe', 'dive'][Math.floor(Math.random() * 3)];
  const hpScale = 1 + (wave - 1) * 0.15;
  enemies.push({
    type: 'heli',
    x: fromLeft ? -60 : W + 60,
    y: 60 + Math.random() * (groundY * 0.4),
    vx: fromLeft ? 1.5 + Math.random() : -(1.5 + Math.random()),
    vy: 0,
    w: 60, h: 30,
    hp: Math.floor(30 * hpScale),
    maxHp: Math.floor(30 * hpScale),
    pattern,
    timer: 0,
    fireTimer: 60 + Math.floor(Math.random() * 60),
    propAngle: 0,
    boss: false,
  });
}

function spawnGround() {
  if (state !== 'playing') return;
  const fromLeft = Math.random() < 0.5;
  const hpScale = 1 + (wave - 1) * 0.12;
  enemies.push({
    type: 'ground',
    x: fromLeft ? 28 : W - 28,
    y: groundY,
    vx: fromLeft ? 1.1 + Math.random() * 0.4 : -(1.1 + Math.random() * 0.4),
    vy: 0,
    w: 20, h: 36,
    hp: Math.floor(20 * hpScale),
    maxHp: Math.floor(20 * hpScale),
    fireTimer: 80 + Math.floor(Math.random() * 60),
    hasEnteredArena: false,
    boss: false,
  });
}

function spawnBoss() {
  const fromLeft = Math.random() < 0.5;
  const hpScale = 1 + (wave - 1) * 0.2;
  enemies.push({
    type: 'heli',
    x: fromLeft ? -100 : W + 100,
    y: 100 + Math.random() * 80,
    vx: fromLeft ? 0.8 : -0.8,
    vy: 0,
    w: 120, h: 55,
    hp: Math.floor(200 * hpScale),
    maxHp: Math.floor(200 * hpScale),
    pattern: 'boss',
    timer: 0,
    fireTimer: 30,
    propAngle: 0,
    boss: true,
  });
}

/* ===== INPUT ===== */
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'playing') {
    const num = parseInt(e.key);
    if (num >= 1 && num <= 6 && weapons[num - 1].ammo > 0) {
      currentWeapon = num - 1;
    }
    if (e.code === 'KeyR') fireCooldown = 0;
  }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => { mouseDown = true; e.preventDefault(); });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('wheel', e => {
  if (state !== 'playing') return;
  const dir = e.deltaY > 0 ? 1 : -1;
  let next = currentWeapon;
  for (let i = 0; i < 6; i++) {
    next = (next + dir + 6) % 6;
    if (weapons[next].ammo > 0 || next === 0) { currentWeapon = next; break; }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ===== PLAYER UPDATE ===== */
function updatePlayer() {
  const p = player;
  // Movement
  let moveDir = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) moveDir = -1;
  if (keys['KeyD'] || keys['ArrowRight']) moveDir = 1;
  p.vx = moveDir * PLAYER_SPEED;
  if (moveDir !== 0) p.facing = moveDir;

  // Jump
  if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && p.onGround) {
    p.vy = PLAYER_JUMP;
    p.onGround = false;
  }

  // Physics
  p.vy += GRAVITY;
  p.x += p.vx;
  p.y += p.vy;

  // Ground collision
  if (p.y >= groundY) {
    p.y = groundY;
    p.vy = 0;
    p.onGround = true;
  }

  // Screen bounds
  p.x = Math.max(16, Math.min(W - 16, p.x));

  // Invulnerability timer
  if (p.invuln > 0) p.invuln--;

  // Shooting
  if (fireCooldown > 0) fireCooldown--;
  const wep = weapons[currentWeapon];
  if (mouseDown && fireCooldown <= 0 && wep.ammo > 0) {
    fireWeapon(wep);
    fireCooldown = wep.fireRate;
    if (wep.ammo !== Infinity) wep.ammo--;
    if (wep.ammo <= 0 && currentWeapon !== 0) {
      currentWeapon = 0; // fallback to machine gun
    }
  }

  // Aim direction
  const dx = mouseX - p.x, dy = mouseY - p.y;
  p.aimAngle = Math.atan2(dy, dx);
  if (dx < 0) p.facing = -1;
  if (dx > 0) p.facing = 1;
}

/* ===== SHOOTING ===== */
function fireWeapon(wep) {
  Audio.play(wep.sound);
  const p = player;
  const angle = p.aimAngle;
  const pellets = wep.pellets || 1;

  for (let i = 0; i < pellets; i++) {
    const a = angle + (Math.random() - 0.5) * wep.spread * 2;
    const cos = Math.cos(a), sin = Math.sin(a);
    const bul = {
      x: p.x + cos * 20,
      y: p.y - 16 + sin * 20,
      vx: cos * wep.speed,
      vy: sin * wep.speed,
      damage: wep.damage,
      color: wep.color,
      size: wep.size,
      life: 120,
      piercing: wep.piercing || false,
      explosive: wep.explosive || 0,
      bouncing: wep.bouncing || false,
      fromPlayer: true,
    };
    bullets.push(bul);

    if (wep.railTrail) {
      railTrails.push({ x1: bul.x, y1: bul.y, x2: bul.x + cos * 2000, y2: bul.y + sin * 2000, life: 15, color: wep.color });
    }
  }
}

/* ===== BULLETS UPDATE ===== */
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    // Gravity for bouncing grenades
    if (b.bouncing) {
      b.vy += 0.3;
      if (b.y >= groundY) {
        b.y = groundY;
        b.vy = -b.vy * 0.6;
        b.vx *= 0.8;
        if (Math.abs(b.vy) < 1) {
          explode(b.x, b.y, b.explosive);
          bullets.splice(i, 1);
          continue;
        }
      }
    }

    // Off screen or expired
    if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50 || b.life <= 0) {
      if (b.explosive && b.life <= 0) explode(b.x, b.y, b.explosive);
      bullets.splice(i, 1);
      continue;
    }

    // Bullet trail particles
    if (Math.random() < 0.3) {
      particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, life: 8, maxLife: 8, color: b.color, size: b.size * 0.5 });
    }

    // Check collision
    if (b.fromPlayer) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (b.x > e.x - e.w / 2 && b.x < e.x + e.w / 2 && b.y > e.y - e.h / 2 && b.y < e.y + e.h / 2) {
          e.hp -= b.damage;
          Audio.play('hit');
          spawnHitParticles(b.x, b.y, b.color, 3);
          if (b.explosive) {
            explode(b.x, b.y, b.explosive);
            bullets.splice(i, 1);
            break;
          }
          if (!b.piercing) {
            bullets.splice(i, 1);
            break;
          }
        }
      }
    } else {
      // Enemy bullet hitting player
      const p = player;
      if (p.invuln <= 0 && Math.abs(b.x - p.x) < 14 && Math.abs(b.y - (p.y - 18)) < 22) {
        p.hp -= b.damage;
        p.invuln = 30;
        Audio.play('playerHit');
        addShake(3);
        spawnHitParticles(b.x, b.y, '#ff0000', 5);
        bullets.splice(i, 1);
      }
    }
  }
}

/* ===== EXPLOSIONS ===== */
function explode(x, y, radius) {
  Audio.play('explode');
  addShake(radius > 50 ? 8 : 5);
  // Particles
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 20 + Math.random() * 15, maxLife: 35, color: Math.random() < 0.5 ? '#ffcc00' : '#ff6600', size: 2 + Math.random() * 4 });
  }
  // Damage enemies in radius
  for (const e of enemies) {
    const dx = e.x - x, dy = e.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < radius) {
      const dmg = Math.floor(40 * (1 - dist / radius));
      e.hp -= dmg;
    }
  }
  // Damage player
  const pdx = player.x - x, pdy = (player.y - 18) - y;
  const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
  if (pdist < radius && player.invuln <= 0) {
    player.hp -= Math.floor(15 * (1 - pdist / radius));
    player.invuln = 20;
  }
}

function spawnHitParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 10 + Math.random() * 10, maxLife: 20, color, size: 1 + Math.random() * 2 });
  }
}

function addShake(mag) {
  shakeMag = Math.max(shakeMag, mag);
  shakeTimer = 10;
}

/* ===== ENEMIES UPDATE ===== */
function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.timer++;

    if (e.type === 'heli') {
      e.propAngle += 0.5;
      updateHeliMovement(e);
      // Shooting
      e.fireTimer--;
      if (e.fireTimer <= 0) {
        enemyShoot(e);
        e.fireTimer = e.boss ? 20 + Math.floor(Math.random() * 15) : 60 + Math.floor(Math.random() * 40);
      }
    } else if (e.type === 'ground') {
      const targetDir = Math.sign(player.x - e.x) || (e.vx >= 0 ? 1 : -1);
      e.vx += targetDir * 0.12;
      e.vx = clamp(e.vx, -2.4, 2.4);
      e.x += e.vx;
      if (e.x > 28 && e.x < W - 28) e.hasEnteredArena = true;
      e.x = clamp(e.x, 16, W - 16);
      // Keep on ground
      e.y = groundY;
      // Shooting
      e.fireTimer--;
      if (e.fireTimer <= 0 && e.hasEnteredArena) {
        enemyShoot(e);
        e.fireTimer = 50 + Math.floor(Math.random() * 40);
      }
    }

    // Death check
    if (e.hp <= 0) {
      // Explosion
      for (let j = 0; j < (e.boss ? 30 : 12); j++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 15 + Math.random() * 20, maxLife: 35, color: ['#ff6600', '#ffcc00', '#ff2200', '#ffffff'][Math.floor(Math.random() * 4)], size: 2 + Math.random() * 4 });
      }
      Audio.play('explode');
      addShake(e.boss ? 12 : 4);

      // Score
      const pts = e.boss ? 500 : (e.type === 'heli' ? 100 : 50);
      score += pts;

      // Weapon drop
      if (Math.random() < (e.boss ? 1 : 0.3)) {
        spawnPickup(e.x, e.y);
      }

      waveEnemiesLeft--;
      enemies.splice(i, 1);
    }
  }

  // Check wave complete
  if (waveEnemiesLeft <= 0 && enemies.length === 0) {
    waveTimer++;
    if (waveTimer > 90) {
      waveTimer = 0;
      nextWave();
    }
  }
}

function updateHeliMovement(e) {
  const px = player.x, py = player.y - 18;

  switch (e.pattern) {
    case 'hover': {
      // Float toward player horizontally, stay at altitude
      const targetX = px + (e.x > px ? 120 : -120);
      const targetY = 80 + Math.sin(e.timer * 0.02) * 40;
      e.vx += (targetX - e.x) * 0.002;
      e.vy += (targetY - e.y) * 0.01;
      e.vx *= 0.98; e.vy *= 0.95;
      break;
    }
    case 'strafe': {
      // Fly across, bobbing
      e.vy = Math.sin(e.timer * 0.04) * 1.5;
      if (e.x < -80 || e.x > W + 80) e.vx = -e.vx;
      break;
    }
    case 'dive': {
      // Periodically dive toward player
      if (e.timer % 180 < 60) {
        e.vy += (py - 90 - e.y) * 0.0026;
        e.vx += (px - e.x) * 0.0016;
      } else {
        e.vy += (100 - e.y) * 0.006;
        const targetX = px + (e.x > px ? 150 : -150);
        e.vx += (targetX - e.x) * 0.0008;
      }
      e.vx *= 0.99; e.vy *= 0.97;
      e.vx = clamp(e.vx, -3.4, 3.4);
      e.vy = clamp(e.vy, -2.8, 2.8);
      break;
    }
    case 'boss': {
      // Complex boss pattern
      const phase = Math.floor(e.timer / 150) % 3;
      if (phase === 0) {
        // Strafe across
        e.vx += (e.timer % 300 < 150 ? 0.05 : -0.05);
        e.vy += (120 - e.y) * 0.008;
      } else if (phase === 1) {
        // Dive
        e.vy += (py - e.y) * 0.003;
        e.vx += (px - e.x) * 0.002;
      } else {
        // Retreat high
        e.vy += (60 - e.y) * 0.01;
        e.vx *= 0.99;
      }
      e.vx *= 0.98; e.vy *= 0.96;
      e.vx = clamp(e.vx, -3.8, 3.8);
      e.vy = clamp(e.vy, -3.2, 3.2);
      break;
    }
  }

  e.x += e.vx;
  e.y += e.vy;

  // Keep on screen vertically
  e.y = Math.max(30, Math.min(groundY - 40, e.y));
}

function enemyShoot(e) {
  const dx = player.x - e.x, dy = (player.y - 18) - e.y;
  const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.2;
  const speed = e.boss ? 5 : 4;
  const damage = e.boss ? 12 : 5;

  bullets.push({
    x: e.x, y: e.y + (e.type === 'heli' ? e.h / 2 : -12),
    vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    damage, color: '#ff4444', size: 4, life: 180,
    fromPlayer: false, piercing: false, explosive: 0, bouncing: false,
  });

  // Boss fires extra bullets
  if (e.boss) {
    for (let i = -1; i <= 1; i += 1) {
      const a2 = a + i * 0.15;
      bullets.push({
        x: e.x, y: e.y + e.h / 2,
        vx: Math.cos(a2) * speed, vy: Math.sin(a2) * speed,
        damage: 8, color: '#ff2222', size: 3, life: 150,
        fromPlayer: false, piercing: false, explosive: 0, bouncing: false,
      });
    }
  }
}

/* ===== PICKUPS ===== */
function spawnPickup(x, y) {
  // Pick a random non-machine-gun weapon
  const idx = 1 + Math.floor(Math.random() * 5);
  pickups.push({
    x, y, vy: 0,
    weaponIdx: idx,
    life: 600,
  });
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.vy += 0.15;
    p.y += p.vy;
    if (p.y >= groundY - 10) { p.y = groundY - 10; p.vy = 0; }
    p.life--;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }

    // Player pickup
    if (Math.abs(p.x - player.x) < 30 && Math.abs(p.y - player.y) < 30) {
      const wep = weapons[p.weaponIdx];
      const addAmmo = Math.ceil(wep.maxAmmo * 0.4);
      wep.ammo = Math.min(wep.maxAmmo, wep.ammo + addAmmo);
      currentWeapon = p.weaponIdx;
      Audio.play('pickup');
      score += 25;
      pickups.splice(i, 1);
    }
  }
}

/* ===== PARTICLES UPDATE ===== */
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = railTrails.length - 1; i >= 0; i--) {
    railTrails[i].life--;
    if (railTrails[i].life <= 0) railTrails.splice(i, 1);
  }
}

/* ===== RENDERING ===== */
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, groundY);
  grad.addColorStop(0, '#1a0a2e');
  grad.addColorStop(0.4, '#2d1b69');
  grad.addColorStop(0.8, '#4a2c8a');
  grad.addColorStop(1, '#6b3fa0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, groundY);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const seed = 42;
  for (let i = 0; i < 60; i++) {
    const sx = ((seed * (i + 1) * 7 + 13) % W);
    const sy = ((seed * (i + 1) * 3 + 7) % (groundY * 0.6));
    const sz = 0.5 + (i % 3) * 0.5;
    ctx.fillRect(sx, sy, sz, sz);
  }

  // Distant mountains (parallax layer)
  ctx.fillStyle = '#1a1a3a';
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= W; x += 80) {
    const h = 40 + Math.sin(x * 0.008 + 1) * 30 + Math.sin(x * 0.015) * 20;
    ctx.lineTo(x, groundY - h);
  }
  ctx.lineTo(W, groundY);
  ctx.fill();

  // Buildings silhouette
  ctx.fillStyle = '#111128';
  const buildSeed = 17;
  for (let x = 0; x < W; x += 50 + (buildSeed * x % 30)) {
    const bw = 30 + (x * 3 % 25);
    const bh = 30 + (x * 7 % 60);
    ctx.fillRect(x, groundY - bh, bw, bh);
    // Windows
    ctx.fillStyle = 'rgba(255,200,50,0.15)';
    for (let wy = groundY - bh + 8; wy < groundY - 4; wy += 12) {
      for (let wx = x + 5; wx < x + bw - 5; wx += 10) {
        if ((wx * wy) % 3 !== 0) ctx.fillRect(wx, wy, 4, 5);
      }
    }
    ctx.fillStyle = '#111128';
  }

  // Ground
  const gGrad = ctx.createLinearGradient(0, groundY, 0, H);
  gGrad.addColorStop(0, '#2a3a1a');
  gGrad.addColorStop(0.3, '#1e2b12');
  gGrad.addColorStop(1, '#0f1a08');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Ground line
  ctx.strokeStyle = '#4a5a2a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
}

function drawPlayer() {
  const p = player;
  const flash = p.invuln > 0 && Math.floor(p.invuln / 3) % 2 === 0;
  if (flash) ctx.globalAlpha = 0.4;

  ctx.save();
  ctx.translate(p.x, p.y);

  // Legs
  const walkFrame = Math.floor(Date.now() / 100) % 4;
  const legSpread = (p.vx !== 0) ? Math.sin(walkFrame * Math.PI / 2) * 6 : 0;
  ctx.strokeStyle = '#2a5030';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-legSpread, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(legSpread, 0); ctx.stroke();

  // Body
  ctx.fillStyle = '#3a7040';
  ctx.fillRect(-6, -28, 12, 24);

  // Head
  ctx.fillStyle = '#d4a574';
  ctx.beginPath();
  ctx.arc(0, -34, 7, 0, Math.PI * 2);
  ctx.fill();

  // Helmet
  ctx.fillStyle = '#2a5030';
  ctx.beginPath();
  ctx.arc(0, -36, 8, Math.PI, 0);
  ctx.fill();

  // Gun arm
  const aimAngle = p.aimAngle;
  ctx.save();
  ctx.translate(0, -20);
  ctx.rotate(aimAngle);
  ctx.fillStyle = '#555';
  ctx.fillRect(0, -2, 22, 4);
  // Muzzle flash when firing
  if (fireCooldown > weapons[currentWeapon].fireRate - 3) {
    ctx.fillStyle = '#ffee00';
    ctx.beginPath();
    ctx.arc(24, 0, 4 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.type === 'heli') {
      drawHeli(e);
    } else {
      drawGroundEnemy(e);
    }
  }
}

function drawHeli(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const scale = e.boss ? 1 : 1;
  const w = e.w, h = e.h;

  // Body
  ctx.fillStyle = e.boss ? '#8a2020' : '#5a5a6a';
  ctx.beginPath();
  ctx.ellipse(0, 0, w / 2, h / 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cockpit
  ctx.fillStyle = e.boss ? '#ff6644' : '#88ccff';
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.ellipse(e.vx >= 0 ? w * 0.2 : -w * 0.2, -2, w * 0.15, h * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Tail
  const tailDir = e.vx >= 0 ? -1 : 1;
  ctx.fillStyle = e.boss ? '#6a1515' : '#4a4a5a';
  ctx.beginPath();
  ctx.moveTo(tailDir * w * 0.4, -2);
  ctx.lineTo(tailDir * w * 0.7, -h * 0.3);
  ctx.lineTo(tailDir * w * 0.7, h * 0.1);
  ctx.closePath();
  ctx.fill();

  // Tail rotor
  ctx.fillStyle = '#aaa';
  ctx.fillRect(tailDir * w * 0.65, -h * 0.4, 2, h * 0.25);

  // Main rotor
  ctx.strokeStyle = 'rgba(200,200,200,0.6)';
  ctx.lineWidth = 2;
  const ra = e.propAngle;
  ctx.beginPath();
  ctx.moveTo(Math.cos(ra) * w * 0.55, -h / 2.5 + Math.sin(ra) * 3);
  ctx.lineTo(Math.cos(ra + Math.PI) * w * 0.55, -h / 2.5 + Math.sin(ra + Math.PI) * 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(Math.cos(ra + Math.PI / 2) * w * 0.55, -h / 2.5 + Math.sin(ra + Math.PI / 2) * 3);
  ctx.lineTo(Math.cos(ra + Math.PI * 1.5) * w * 0.55, -h / 2.5 + Math.sin(ra + Math.PI * 1.5) * 3);
  ctx.stroke();

  // Rotor hub
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, -h / 2.5, 3, 0, Math.PI * 2);
  ctx.fill();

  // Skids
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-w * 0.25, h * 0.35); ctx.lineTo(-w * 0.25, h * 0.45);
  ctx.moveTo(w * 0.25, h * 0.35); ctx.lineTo(w * 0.25, h * 0.45);
  ctx.moveTo(-w * 0.3, h * 0.45); ctx.lineTo(w * 0.3, h * 0.45);
  ctx.stroke();

  // Health bar
  const hpRatio = e.hp / e.maxHp;
  const barW = w * 0.7;
  ctx.fillStyle = '#300';
  ctx.fillRect(-barW / 2, -h / 2 - 10, barW, 4);
  ctx.fillStyle = hpRatio > 0.3 ? '#0c0' : '#f00';
  ctx.fillRect(-barW / 2, -h / 2 - 10, barW * hpRatio, 4);

  // Boss label
  if (e.boss) {
    ctx.fillStyle = '#ff4444';
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('BOSS', 0, -h / 2 - 16);
  }

  ctx.restore();
}

function drawGroundEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  // Legs
  const walkFrame = Math.floor(Date.now() / 120) % 4;
  const legSpread = Math.abs(e.vx) > 0.1 ? Math.sin(walkFrame * Math.PI / 2) * 5 : 0;
  ctx.strokeStyle = '#5a2020';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-legSpread, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(legSpread, 0); ctx.stroke();

  // Body
  ctx.fillStyle = '#8a3030';
  ctx.fillRect(-5, -26, 10, 22);

  // Head
  ctx.fillStyle = '#c49060';
  ctx.beginPath();
  ctx.arc(0, -31, 6, 0, Math.PI * 2);
  ctx.fill();

  // Gun pointing at player
  const dx = player.x - e.x, dy = (player.y - 18) - e.y;
  const a = Math.atan2(dy, dx);
  ctx.save();
  ctx.translate(0, -18);
  ctx.rotate(a);
  ctx.fillStyle = '#444';
  ctx.fillRect(0, -1.5, 16, 3);
  ctx.restore();

  // Health bar
  const hpRatio = e.hp / e.maxHp;
  ctx.fillStyle = '#300';
  ctx.fillRect(-12, -42, 24, 3);
  ctx.fillStyle = hpRatio > 0.3 ? '#0c0' : '#f00';
  ctx.fillRect(-12, -42, 24 * hpRatio, 3);

  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    const drawSize = Math.max(3, b.size);
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.fromPlayer ? 1 : 0.8;
    if (b.bouncing) {
      // Grenade shape
      ctx.beginPath();
      ctx.arc(b.x, b.y, drawSize, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const speedMag = Math.hypot(b.vx, b.vy);
      const trailLen = clamp(speedMag * 0.7, drawSize * 1.4, drawSize * 4.5);
      const angle = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.fillRect(-trailLen / 2, -drawSize / 2, trailLen, drawSize);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // Rail trails
  for (const r of railTrails) {
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = r.life / 15;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1);
    ctx.lineTo(r.x2, r.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawPickups() {
  for (const p of pickups) {
    const wep = WEAPON_DEFS[p.weaponIdx];
    const bob = Math.sin(Date.now() * 0.005) * 3;
    const flash = p.life < 120 && Math.floor(p.life / 8) % 2 === 0;
    if (flash) continue;

    ctx.save();
    ctx.translate(p.x, p.y + bob);

    // Box
    ctx.fillStyle = '#334';
    ctx.strokeStyle = wep.color;
    ctx.lineWidth = 2;
    ctx.fillRect(-14, -14, 28, 20);
    ctx.strokeRect(-14, -14, 28, 20);

    // Label
    ctx.fillStyle = wep.color;
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(wep.key, 0, 0);

    ctx.restore();
  }
}

function drawHUD() {
  const p = player;
  const wep = weapons[currentWeapon];

  // Health bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, H - 50, 204, 22);
  const hpRatio = Math.max(0, p.hp / PLAYER_MAX_HP);
  ctx.fillStyle = hpRatio > 0.3 ? '#00cc44' : '#ff2222';
  ctx.fillRect(12, H - 48, 200 * hpRatio, 18);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, H - 50, 204, 22);

  ctx.fillStyle = '#fff';
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'left';
  ctx.fillText('HP', 16, H - 35);

  // Weapon info
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, H - 80, 220, 24);
  ctx.fillStyle = wep.color;
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText(wep.name, 16, H - 63);
  if (wep.ammo !== Infinity) {
    ctx.fillStyle = wep.ammo < 5 ? '#ff4444' : '#ffaa00';
    ctx.textAlign = 'right';
    ctx.fillText(wep.ammo + '/' + wep.maxAmmo, 224, H - 63);
  } else {
    ctx.fillStyle = '#888';
    ctx.textAlign = 'right';
    ctx.fillText('INF', 224, H - 63);
  }

  // Weapon slots
  ctx.textAlign = 'left';
  for (let i = 0; i < 6; i++) {
    const w = weapons[i];
    const sx = 10 + i * 38;
    const sy = H - 108;
    ctx.fillStyle = i === currentWeapon ? 'rgba(255,102,0,0.5)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(sx, sy, 34, 22);
    ctx.strokeStyle = i === currentWeapon ? '#ff6600' : '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx, sy, 34, 22);
    ctx.fillStyle = w.ammo > 0 ? w.color : '#444';
    ctx.font = '7px "Press Start 2P"';
    ctx.fillText(w.key, sx + 3, sy + 15);
  }

  // Score
  ctx.fillStyle = '#fff';
  ctx.font = '12px "Press Start 2P"';
  ctx.textAlign = 'right';
  ctx.fillText('SCORE: ' + score, W - 16, 30);

  // Wave
  ctx.fillStyle = '#00ff88';
  ctx.font = '10px "Press Start 2P"';
  ctx.fillText('WAVE ' + wave, W - 16, 50);

  // Wave announcement
  if (waveAnnounceTicks > 0) {
    waveAnnounceTicks--;
    const alpha = waveAnnounceTicks > 60 ? 1 : waveAnnounceTicks / 60;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = wave % 5 === 0 ? '#ff4444' : '#00ff88';
    ctx.font = '24px "Russo One"';
    ctx.textAlign = 'center';
    const txt = wave % 5 === 0 ? 'BOSS WAVE ' + wave : 'WAVE ' + wave;
    ctx.fillText(txt, W / 2, H / 3);
    ctx.globalAlpha = 1;
  }

  // Crosshair
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouseX - 16, mouseY); ctx.lineTo(mouseX - 8, mouseY);
  ctx.moveTo(mouseX + 8, mouseY); ctx.lineTo(mouseX + 16, mouseY);
  ctx.moveTo(mouseX, mouseY - 16); ctx.lineTo(mouseX, mouseY - 8);
  ctx.moveTo(mouseX, mouseY + 8); ctx.lineTo(mouseX, mouseY + 16);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,80,0,0.8)';
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 2, 0, Math.PI * 2);
  ctx.fill();
}

/* ===== SCREEN SHAKE ===== */
function applyShake() {
  if (shakeTimer > 0) {
    shakeTimer--;
    const ox = (Math.random() - 0.5) * shakeMag * 2;
    const oy = (Math.random() - 0.5) * shakeMag * 2;
    ctx.translate(ox, oy);
    shakeMag *= 0.85;
  }
}

/* ===== GAME LOOP ===== */
function update() {
  if (state !== 'playing') return;

  updatePlayer();
  updateBullets();
  updateEnemies();
  updatePickups();
  updateParticles();

  // Player death
  if (player.hp <= 0) {
    state = 'gameover';
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-score').textContent = 'SCORE: ' + score;
    document.getElementById('final-wave').textContent = 'Reached Wave ' + wave;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('heliAttackHigh', highScore);
      document.getElementById('new-high').textContent = 'NEW HIGH SCORE!';
    } else {
      document.getElementById('new-high').textContent = 'Best: ' + highScore;
    }
  }
}

function draw() {
  ctx.save();
  applyShake();
  drawBackground();
  if (state === 'playing') {
    drawPickups();
    drawPlayer();
    drawEnemies();
    drawBullets();
    drawParticles();
    drawHUD();
  }
  ctx.restore();
}

function gameLoop() {
  if (state === 'playing') {
    update();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

/* ===== START / RESTART ===== */
const titleScreen = document.getElementById('title-screen');
const gameOver = document.getElementById('game-over');

// Show high score on title
const hs = document.getElementById('title-high-score');
if (highScore > 0) hs.textContent = 'HIGH SCORE: ' + highScore;

document.getElementById('start-btn').addEventListener('click', () => {
  Audio.init();
  titleScreen.style.display = 'none';
  state = 'playing';
  resetGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  gameOver.style.display = 'none';
  state = 'playing';
  resetGame();
});

// Initial draw
draw();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
