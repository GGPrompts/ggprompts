<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Breaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0014;
            --bg-grad-top: #140028;
            --bg-grad-bot: #0a0014;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff2d7b;
            --neon-yellow: #ffe234;
            --neon-green: #39ff14;
            --neon-purple: #b24dff;
            --neon-orange: #ff6e1a;
            --neon-blue: #2d7bff;
            --chrome: #c0c0c0;
            --text-light: #e8e0f0;
            --text-dim: rgba(232, 224, 240, 0.4);
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-mono);
            color: var(--text-light);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #game-canvas {
            display: block;
            image-rendering: auto;
        }

        #back-link {
            position: absolute;
            top: 8px;
            left: 8px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 13px;
            font-family: var(--font-mono);
            opacity: 0.5;
            z-index: 10;
            padding: 4px 10px;
            border: 1px solid rgba(232, 224, 240, 0.2);
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        #back-link:hover {
            opacity: 1;
        }

        #mute-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            color: var(--text-light);
            background: none;
            border: 1px solid rgba(232, 224, 240, 0.2);
            border-radius: 4px;
            font-size: 13px;
            font-family: var(--font-mono);
            padding: 4px 10px;
            opacity: 0.5;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.2s;
        }

        #mute-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <a id="back-link" href="../index.html">Back</a>
        <button id="mute-btn">Sound: ON</button>
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="engine.js"></script>
    <script>
        BrickBreaker.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
