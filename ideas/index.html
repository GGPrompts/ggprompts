<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideas Board — GG Prompts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c10;
            --bg-card: #16161d;
            --bg-card-hover: #1e1e28;
            --border: #2a2a38;
            --border-hover: #3d3d52;
            --text: #e0dfe6;
            --text-dim: #8a899a;
            --text-muted: #5a596a;
            --accent-styles: #a78bfa;
            --accent-games: #f472b6;
            --accent-stories: #38bdf8;
            --accent-done: #34d399;
            --accent-pending: #fbbf24;
            --accent-tier1: #f87171;
            --accent-tier2: #fb923c;
            --accent-tier3: #a3e635;
            --accent-wild: #c084fc;
            --accent-brief: #22d3ee;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 3rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .back-link {
            display: inline-block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text); }
        .back-link::before { content: '\2190  '; }

        h1 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-styles), var(--accent-games), var(--accent-stories));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.05rem;
            margin-bottom: 0.75rem;
            font-weight: 300;
        }

        .stats {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }

        .stats span { margin-right: 1.5rem; }

        /* ─── Filters ─── */
        .filters {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .filter-group {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .filter-group::before {
            content: attr(data-label);
            display: flex;
            align-items: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-right: 0.25rem;
            white-space: nowrap;
        }

        .filter-btn {
            padding: 0.3rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
            background: var(--bg-card);
        }

        .filter-btn.active {
            border-color: currentColor;
            background: var(--bg-card);
        }

        .filter-btn[data-section="styles"].active { color: var(--accent-styles); }
        .filter-btn[data-section="games"].active { color: var(--accent-games); }
        .filter-btn[data-section="stories"].active { color: var(--accent-stories); }
        .filter-btn[data-status="done"].active { color: var(--accent-done); }
        .filter-btn[data-status="pending"].active { color: var(--accent-pending); }
        .filter-btn[data-status="brief"].active { color: var(--accent-brief); }
        .filter-btn[data-tier="tier1"].active { color: var(--accent-tier1); }
        .filter-btn[data-tier="tier2"].active { color: var(--accent-tier2); }
        .filter-btn[data-tier="tier3"].active { color: var(--accent-tier3); }
        .filter-btn[data-tier="wild"].active { color: var(--accent-wild); }

        .search-box {
            flex: 1;
            min-width: 180px;
            max-width: 300px;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box::placeholder { color: var(--text-muted); }
        .search-box:focus { border-color: var(--accent-styles); }

        /* ─── Grid ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.4rem;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            box-shadow: var(--shadow);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .card[data-section="styles"]::before { background: var(--accent-styles); }
        .card[data-section="games"]::before { background: var(--accent-games); }
        .card[data-section="stories"]::before { background: var(--accent-stories); }

        .card-section {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card[data-section="styles"] .card-section { color: var(--accent-styles); }
        .card[data-section="games"] .card-section { color: var(--accent-games); }
        .card[data-section="stories"] .card-section { color: var(--accent-stories); }

        .card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .card .desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.55;
            margin-bottom: 0.9rem;
        }

        .card .tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .tag-done { background: rgba(52, 211, 153, 0.15); color: var(--accent-done); }
        .tag-pending { background: rgba(251, 191, 36, 0.15); color: var(--accent-pending); }
        .tag-brief { background: rgba(34, 211, 238, 0.15); color: var(--accent-brief); }
        .tag-tier1 { background: rgba(248, 113, 113, 0.12); color: var(--accent-tier1); }
        .tag-tier2 { background: rgba(251, 146, 60, 0.12); color: var(--accent-tier2); }
        .tag-tier3 { background: rgba(163, 230, 53, 0.12); color: var(--accent-tier3); }
        .tag-wild { background: rgba(192, 132, 252, 0.12); color: var(--accent-wild); }
        .tag-category {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
        }

        .card.status-done { opacity: 0.6; }
        .card.status-done:hover { opacity: 0.85; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
            .filters { gap: 0.5rem; }
            .search-box { max-width: 100%; min-width: 100%; order: -1; }
        }

        @media (max-width: 480px) {
            .filter-group { width: 100%; }
        }
    </style>
</head>
<body>

        <div class="grid" id="grid"></div>

    // ─── State ───
    const filters = { section: null, status: null, tier: null };
    let searchTerm = '';

    function toggleFilter(key, value, btn) {
        if (filters[key] === value) {
            filters[key] = null;
            btn.classList.remove('active');
        } else {
            // deactivate siblings
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            filters[key] = value;
            btn.classList.add('active');
        }
        render();
    }

    document.getElementById('search').addEventListener('input', e => {
        searchTerm = e.target.value.toLowerCase();
        render();
    });

    function render() {
        const grid = document.getElementById('grid');
        const filtered = IDEAS.filter(idea => {
            if (filters.section && idea.section !== filters.section) return false;
            if (filters.status) {
                if (filters.status === 'brief') {
                    if (idea.section !== 'stories') return false;
                } else if (idea.status !== filters.status) return false;
            }
            if (filters.tier && idea.tier !== filters.tier) return false;
            if (searchTerm) {
                const hay = (idea.name + ' ' + idea.desc + ' ' + (idea.category || '')).toLowerCase();
                if (!hay.includes(searchTerm)) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state">No ideas match the current filters.</div>';
        } else {
            grid.innerHTML = filtered.map(idea => {
                const statusClass = idea.status === 'done' ? 'status-done' : '';
                const statusTag = idea.status === 'done'
                    ? '<span class="tag tag-done">Done</span>'
                    : '<span class="tag tag-pending">Pending</span>';

                let tierTag = '';
                if (idea.tier === 'tier1') tierTag = '<span class="tag tag-tier1">Tier 1</span>';
                else if (idea.tier === 'tier2') tierTag = '<span class="tag tag-tier2">Tier 2</span>';
                else if (idea.tier === 'tier3') tierTag = '<span class="tag tag-tier3">Tier 3</span>';
                else if (idea.tier === 'wild') tierTag = '<span class="tag tag-wild">Wild Card</span>';

                const categoryTag = idea.category
                    ? `<span class="tag tag-category">${idea.category}</span>`
                    : '';

                const briefTag = idea.section === 'stories'
                    ? '<span class="tag tag-brief">Brief</span>'
                    : '';

                return `
                    <div class="card ${statusClass}" data-section="${idea.section}">
                        <div class="card-section">${idea.section}</div>
                        <h3>${idea.name}</h3>
                        <p class="desc">${idea.desc}</p>
                        <div class="tags">
                            ${statusTag}${tierTag}${briefTag}${categoryTag}
                        </div>
                    </div>`;
            }).join('');
        }

        // Update stats
        const total = IDEAS.length;
        const done = IDEAS.filter(i => i.status === 'done').length;
        const pending = IDEAS.filter(i => i.status === 'pending').length;
        const showing = filtered.length;
        document.getElementById('stats').innerHTML =
            `<span>${total} ideas total</span>` +
            `<span>${done} done</span>` +
            `<span>${pending} pending</span>` +
            `<span>showing ${showing}</span>`;
    }

    render();
    </script>
