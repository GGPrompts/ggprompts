<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fencing Match in a Thunderstorm — Music Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="video-base-styles.css">
    <style>
        :root {
            --vid-bg: #06060c;
            --vid-bg-rgb: 6,6,12;
            --vid-font: 'JetBrains Mono', monospace;
            --vid-accent: #8090c0;
            --vid-accent-r: 128;
            --vid-accent-g: 144;
            --vid-accent-b: 192;
            --vid-title-min: 16px;

            --vid-title-max: 40px;
            --vid-title-spacing: 0.06em;
            --vid-sub-alpha: 0.4;
        }
    </style>
</head>
<body>
    <a href="music-videos/index.html" class="back-link">&larr; Music Videos</a>
    <canvas id="viz-canvas"></canvas>
    <div class="play-overlay" id="play-overlay">
        <div class="play-title">Fencing Match in a Thunderstorm</div>
        <div class="play-sub">a rooftop duel</div>
        <div class="play-btn"></div>
    </div>

    <script src="../audio-tracker/playback-engine.js"></script>
    <script src="engine.js"></script>
    <script src="stick-fight-engine.js"></script>
    <script src="video-utils.js"></script>
    <script src="base-renderer.js"></script>
    <script>
    // ── Fencing Match in a Thunderstorm Video Renderer ──────────────
    (function() {
        window.noShortMode = true;
        "use strict";

        var W = 0, H = 0;
        var analysis = null;

        // ── Palette ──
        var SKY_TOP = '#04040a';
        var SKY_BOT = '#0c0e18';
        var ROOF_COLOR = '#18181f';
        var ROOF_EDGE = '#2a2a36';
        var FENCER_A_COLOR = '#8898c8';   // steel blue
        var FENCER_B_COLOR = '#c09070';   // warm bronze
        var LIGHTNING_COLOR = '#e0e8ff';
        var RAIN_COLOR = 'rgba(160,180,220,';
        var SPARK_COLOR = '#fffae0';

        // ── Layout ──
        var ROOF_Y_RATIO = 0.78;
        var roofY = 0;

        // ── State ──
        var beatPulse = 0;
        var flashAlpha = 0;
        var lastSeqIndex = -1;
        var sectionMood = 'storm';  // storm, salute, bout1, lightning, bout2, interlude, finale, denouement

        // Rain
        var raindrops = [];
        var rainIntensity = 0.3;

        // Lightning
        var lightningBolts = [];
        var lightningTimer = 0;
        var lightningFreeze = 0;   // freeze-frame alpha

        // Sparks from sword clash (now driven by onContact)
        var sparks = [];

        // Fencer state (StickFight figures)
        var fencerA = null;
        var fencerB = null;
        var fencerBaseXA = 0, fencerBaseXB = 0;
        var stanceA = 0, stanceB = 0;  // -1=back, 0=neutral, 1=lunge
        var attackFlashA = 0, attackFlashB = 0;

        // Cloud layer
        var clouds = [];

        // Title
        var titleAlpha = 0;
        var titleTarget = 0;

        // Screen shake (engine-managed)
        var shakeObj = null;
        // Lightning shake (separate from combat shake, for thunder)
        var thunderShakeIntensity = 0;
        var thunderShakeX = 0, thunderShakeY = 0;

        // ── Choreography state ──
        var activeChoreo = null;       // current StickFight.choreograph() object
        var choreoPool = {};           // section name → array of sequence templates
        var lastChoreoSection = '';     // track section changes for launching new choreographies
        var beatAccum = 0;             // beat counter within current section

        // Denouement tracking
        var ragdolled = false;

        // Contact callback registered flag
        var contactRegistered = false;

        // ── Helpers ──

        // ── Section mapping ──
        // 52 sequence entries total
        // 0-2: storm intro (Thunder Rumble + Rain)
        // 3: salute (Swords Drawn)
        // 4-11: bout1 (First Bout patterns)
        // 12: lightning break
        // 13-15: bout2 start
        // 16-21: bout2 continued
        // 22-23: thunder interlude
        // 24-28: bout2 intensifies
        // 29-39: finale (Final Bout patterns)
        // 40-49: finale reprises
        // 50-51: denouement
        function mapSection(seqIndex) {
            if (seqIndex <= 2) return 'storm';
            if (seqIndex <= 3) return 'salute';
            if (seqIndex <= 11) return 'bout1';
            if (seqIndex <= 12) return 'lightning';
            if (seqIndex <= 21) return 'bout2';
            if (seqIndex <= 23) return 'interlude';
            if (seqIndex <= 28) return 'bout2';
            if (seqIndex <= 47) return 'finale';
            if (seqIndex <= 49) return 'denouement';
            return 'denouement';
        }

        // ── Choreography sequence templates ──
        // Each is an array of steps for StickFight.choreograph().
        // beat values are relative to the start of the choreography.
        // attacker: 'A' or 'B', move: StickFight.MOVES key, defender: pose name
        function buildChoreoPool() {
            choreoPool = {
                // Bout 1: cautious probing — alternating slashes with blocks, wide spacing
                bout1: [
                    [
                        { beat: 0, attacker: 'A', move: 'slash', defender: 'block' },
                        { beat: 2, spacing: true },
                        { beat: 4, attacker: 'B', move: 'slash', defender: 'block' },
                        { beat: 6, spacing: true }
                    ],
                    [
                        { beat: 0, attacker: 'B', move: 'lunge', defender: 'block' },
                        { beat: 2, attacker: 'A', move: 'slash', result: 'whiff' },
                        { beat: 4, spacing: true },
                        { beat: 6, attacker: 'A', move: 'lunge', defender: 'block' }
                    ],
                    [
                        { beat: 0, attacker: 'A', move: 'lunge', defender: 'block' },
                        { beat: 3, attacker: 'B', move: 'slash', defender: 'recoil' },
                        { beat: 5, spacing: true },
                        { beat: 7, attacker: 'A', move: 'slash', defender: 'block' }
                    ]
                ],
                // Bout 2: aggressive exchanges — faster tempo, more hits landing
                bout2: [
                    [
                        { beat: 0, attacker: 'A', move: 'slash', defender: 'block' },
                        { beat: 1, attacker: 'B', move: 'lunge', defender: 'recoil' },
                        { beat: 2, attacker: 'A', move: 'lunge', defender: 'block' },
                        { beat: 3, spacing: true }
                    ],
                    [
                        { beat: 0, attacker: 'B', move: 'slash', defender: 'block' },
                        { beat: 1, attacker: 'B', move: 'lunge', result: 'hit' },
                        { beat: 2, attacker: 'A', move: 'slash', defender: 'recoil' },
                        { beat: 3, attacker: 'A', move: 'slash', defender: 'block' }
                    ],
                    [
                        { beat: 0, attacker: 'A', move: 'lunge', defender: 'block' },
                        { beat: 1, attacker: 'A', move: 'slash', result: 'hit' },
                        { beat: 2, spacing: true },
                        { beat: 3, attacker: 'B', move: 'lunge', defender: 'block' }
                    ]
                ],
                // Finale: furious simultaneous attacks — every beat is action
                finale: [
                    [
                        { beat: 0, attacker: 'A', move: 'slash', defender: 'block' },
                        { beat: 0.5, attacker: 'B', move: 'slash', defender: 'block' },
                        { beat: 1, attacker: 'A', move: 'lunge', result: 'hit' },
                        { beat: 1.5, attacker: 'B', move: 'lunge', defender: 'recoil' }
                    ],
                    [
                        { beat: 0, attacker: 'B', move: 'lunge', defender: 'block' },
                        { beat: 0.5, attacker: 'A', move: 'slash', result: 'hit' },
                        { beat: 1, attacker: 'B', move: 'slash', defender: 'recoil' },
                        { beat: 1.5, attacker: 'A', move: 'lunge', defender: 'block' }
                    ],
                    [
                        { beat: 0, attacker: 'A', move: 'lunge', result: 'hit' },
                        { beat: 0.5, attacker: 'B', move: 'slash', result: 'hit' },
                        { beat: 1, attacker: 'A', move: 'slash', defender: 'block' },
                        { beat: 1.5, attacker: 'B', move: 'lunge', result: 'hit' }
                    ],
                    [
                        { beat: 0, attacker: 'A', move: 'slash', defender: 'block' },
                        { beat: 0.5, attacker: 'A', move: 'lunge', result: 'hit' },
                        { beat: 1, attacker: 'B', move: 'slash', defender: 'block' },
                        { beat: 1.5, attacker: 'B', move: 'lunge', result: 'hit' }
                    ]
                ]
            };
        }

        // Pick a random sequence from the pool for a given section
        function pickChoreoSequence(section) {
            var pool = choreoPool[section];
            if (!pool || pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // Launch a new choreography for the current section
        function launchChoreography(section, beatDuration) {
            var seq = pickChoreoSequence(section);
            if (!seq) return;

            // Reset HP to prevent actual ragdoll from combat damage during bouts
            // (we control ragdoll manually in denouement)
            fencerA.hp = 100;
            fencerB.hp = 100;

            // Clear any in-progress attacks so new choreography can start clean
            fencerA.attacking = null;
            fencerB.attacking = null;

            activeChoreo = StickFight.choreograph(fencerA, fencerB, seq);
            activeChoreo.beatDuration = beatDuration;
        }

        // ── Rain system ──
        function initRain() {
            raindrops = [];
            for (var i = 0; i < 500; i++) {
                raindrops.push({
                    x: Math.random() * W * 1.3 - W * 0.15,
                    y: Math.random() * H,
                    speed: rand(600, 1200),
                    len: rand(8, 25),
                    alpha: rand(0.1, 0.5),
                    wind: rand(-1, -0.3)
                });
            }
        }

        function updateRain(dt, intensity) {
            for (var i = 0; i < raindrops.length; i++) {
                var r = raindrops[i];
                r.y += r.speed * dt * intensity;
                r.x += r.wind * r.speed * dt * 0.3;
                if (r.y > H + 20) {
                    r.y = -r.len;
                    r.x = Math.random() * W * 1.3 - W * 0.15;
                }
            }
        }

        function drawRain(ctx, intensity) {
            if (intensity < 0.05) return;
            ctx.save();
            ctx.lineCap = 'round';
            for (var i = 0; i < raindrops.length; i++) {
                var r = raindrops[i];
                var a = r.alpha * intensity;
                if (a < 0.02) continue;
                ctx.strokeStyle = RAIN_COLOR + a + ')';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x + r.wind * r.len * 0.3, r.y + r.len);
                ctx.stroke();
            }
            ctx.restore();
        }

        // ── Lightning system ──
        function createBolt(x, y, targetY) {
            var segments = [];
            var cx = x, cy = y;
            var step = (targetY - y) / rand(8, 16);
            while (cy < targetY) {
                var nx = cx + rand(-40, 40);
                var ny = cy + step;
                segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
                // Branch chance
                if (Math.random() > 0.7) {
                    var bx = nx + rand(-60, 60);
                    var by = ny + rand(20, 60);
                    segments.push({ x1: nx, y1: ny, x2: bx, y2: by, branch: true });
                }
                cx = nx;
                cy = ny;
            }
            return {
                segments: segments,
                alpha: 1,
                decay: rand(2, 5),
                glow: rand(20, 50)
            };
        }

        function triggerLightning(count) {
            count = count || 1;
            for (var i = 0; i < count; i++) {
                var x = rand(W * 0.1, W * 0.9);
                lightningBolts.push(createBolt(x, -10, roofY + rand(-20, 30)));
            }
            flashAlpha = Math.max(flashAlpha, rand(0.15, 0.4));
            thunderShakeIntensity = Math.max(thunderShakeIntensity, rand(2, 6));
        }

        function updateLightning(dt) {
            for (var i = lightningBolts.length - 1; i >= 0; i--) {
                lightningBolts[i].alpha -= lightningBolts[i].decay * dt;
                if (lightningBolts[i].alpha <= 0) {
                    lightningBolts.splice(i, 1);
                }
            }
        }

        function drawLightning(ctx) {
            for (var i = 0; i < lightningBolts.length; i++) {
                var bolt = lightningBolts[i];
                if (bolt.alpha <= 0) continue;
                ctx.save();
                ctx.globalAlpha = bolt.alpha;
                ctx.shadowColor = LIGHTNING_COLOR;
                ctx.shadowBlur = bolt.glow * bolt.alpha;
                ctx.strokeStyle = LIGHTNING_COLOR;
                ctx.lineCap = 'round';

                for (var j = 0; j < bolt.segments.length; j++) {
                    var s = bolt.segments[j];
                    ctx.lineWidth = s.branch ? 1.5 : 3;
                    ctx.beginPath();
                    ctx.moveTo(s.x1, s.y1);
                    ctx.lineTo(s.x2, s.y2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // ── Spark system (sword clashes — now contact-driven) ──
        function emitSparks(x, y, count) {
            for (var i = 0; i < count; i++) {
                var angle = rand(-Math.PI, Math.PI);
                var speed = rand(100, 400);
                sparks.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - rand(50, 150),
                    life: rand(0.2, 0.6),
                    maxLife: 0.6,
                    size: rand(1, 3)
                });
            }
        }

        function updateSparks(dt) {
            for (var i = sparks.length - 1; i >= 0; i--) {
                var s = sparks[i];
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.vy += 500 * dt; // gravity
                s.life -= dt;
                if (s.life <= 0) sparks.splice(i, 1);
            }
        }

        function drawSparks(ctx) {
            ctx.save();
            for (var i = 0; i < sparks.length; i++) {
                var s = sparks[i];
                var a = Math.max(0, s.life / s.maxLife);
                ctx.fillStyle = SPARK_COLOR;
                ctx.globalAlpha = a;
                ctx.shadowColor = SPARK_COLOR;
                ctx.shadowBlur = 8;
                ctx.fillRect(s.x - s.size * 0.5, s.y - s.size * 0.5, s.size, s.size);
            }
            ctx.restore();
        }

        // ── Cloud system ──
        function initClouds() {
            clouds = [];
            for (var i = 0; i < 12; i++) {
                clouds.push({
                    x: rand(-200, W + 200),
                    y: rand(-30, H * 0.25),
                    w: rand(150, 400),
                    h: rand(40, 100),
                    speed: rand(5, 20),
                    alpha: rand(0.15, 0.4)
                });
            }
        }

        function updateClouds(dt) {
            for (var i = 0; i < clouds.length; i++) {
                var c = clouds[i];
                c.x += c.speed * dt;
                if (c.x - c.w > W + 100) {
                    c.x = -c.w - rand(50, 200);
                    c.y = rand(-30, H * 0.25);
                }
            }
        }

        function drawClouds(ctx, lightningIntensity) {
            ctx.save();
            for (var i = 0; i < clouds.length; i++) {
                var c = clouds[i];
                var lit = c.alpha + lightningIntensity * 0.3;
                ctx.fillStyle = 'rgba(30,32,48,' + Math.min(0.8, lit) + ')';
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                // lighter center
                ctx.fillStyle = 'rgba(50,54,72,' + (lit * 0.5) + ')';
                ctx.beginPath();
                ctx.ellipse(c.x + c.w * 0.1, c.y - c.h * 0.1, c.w * 0.3, c.h * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // ── Rooftop ──
        function drawRooftop(ctx, energy) {
            // Flat roof surface
            ctx.save();
            ctx.fillStyle = ROOF_COLOR;
            ctx.fillRect(0, roofY, W, H - roofY);

            // Edge line
            ctx.strokeStyle = ROOF_EDGE;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, roofY);
            ctx.lineTo(W, roofY);
            ctx.stroke();

            // Wet reflection shimmer
            var shimmer = 0.02 + energy * 0.04 + flashAlpha * 0.15;
            var grad = ctx.createLinearGradient(0, roofY, 0, roofY + (H - roofY) * 0.3);
            grad.addColorStop(0, 'rgba(140,160,220,' + shimmer + ')');
            grad.addColorStop(1, 'rgba(140,160,220,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, roofY, W, (H - roofY) * 0.3);

            // Puddle reflections
            ctx.fillStyle = 'rgba(100,120,180,' + (shimmer * 0.5) + ')';
            for (var i = 0; i < 5; i++) {
                var px = W * (0.15 + i * 0.18);
                var py = roofY + (H - roofY) * rand(0.3, 0.7);
                ctx.beginPath();
                ctx.ellipse(px, py, rand(20, 50), rand(3, 8), 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // ── Cityscape silhouette (far background) ──
        function drawCityscape(ctx, lightningIntensity) {
            ctx.save();
            var baseY = roofY;
            var buildingAlpha = 0.08 + lightningIntensity * 0.25;
            ctx.fillStyle = 'rgba(20,22,35,' + Math.min(1, buildingAlpha + 0.3) + ')';

            // Draw distant buildings
            var bw = W / 20;
            for (var i = 0; i < 20; i++) {
                var bh = rand(H * 0.1, H * 0.45);
                var bx = i * bw + rand(-5, 5);
                ctx.fillRect(bx, baseY - bh, bw - 2, bh);

                // Lightning reveals windows
                if (lightningIntensity > 0.1) {
                    ctx.fillStyle = 'rgba(200,210,240,' + (lightningIntensity * 0.15) + ')';
                    var winSize = 2;
                    var winGap = 8;
                    for (var wy = baseY - bh + 10; wy < baseY - 10; wy += winGap) {
                        for (var wx = bx + 4; wx < bx + bw - 6; wx += winGap) {
                            if (Math.random() > 0.6) {
                                ctx.fillRect(wx, wy, winSize, winSize);
                            }
                        }
                    }
                    ctx.fillStyle = 'rgba(20,22,35,' + Math.min(1, buildingAlpha + 0.3) + ')';
                }
            }
            ctx.restore();
        }

        // ── Fencer drawing (delegates to StickFight) ──
        // Draws attack flash on sword tip after StickFight draws the figure
        function drawFencerFlash(ctx, fig, flashAlphaVal) {
            if (flashAlphaVal < 0.05) return;
            if (fig.mode === 'ragdoll') return;
            var joints = StickFight.computeJoints(fig);
            var hand = (fig.weaponHand === 'right') ? joints.handR : joints.handL;
            if (fig.params.swordLen > 0) {
                var sLen = fig.params.swordLen * fig.figH;
                var sAng = fig.params.swordAngle;
                var tipX = fig.x + hand.x + Math.cos(sAng) * sLen * fig.facing;
                var tipY = fig.y + hand.y + Math.sin(sAng) * sLen;
                ctx.save();
                ctx.globalAlpha = flashAlphaVal;
                ctx.shadowColor = SPARK_COLOR;
                ctx.shadowBlur = 20;
                ctx.fillStyle = SPARK_COLOR;
                ctx.beginPath();
                ctx.arc(tipX, tipY, 4 + flashAlphaVal * 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ── Fencer position update ──
        function updateFencerPosition(fig, stance, baseX, dt, energy) {
            if (fig.mode === 'ragdoll') return;
            var lungeOffset = stance * Math.min(W * 0.06, fig.figH * 0.4);
            var targetX = baseX + lungeOffset * fig.facing;
            fig.x = lerpExp(fig.x, targetX, 6, dt);
        }

        // Guard pose helper (used for non-combat sections)
        function setFencerGuard(fig, armExt, lean, swordAng, legSpr) {
            if (fig.mode === 'ragdoll') return;
            StickFight.setPose(fig, 'guard');
            StickFight.setTarget(fig, 'lean', lean);
            StickFight.setTarget(fig, 'swordAngle', swordAng);
            StickFight.setTarget(fig, 'legSpread', legSpr);
        }

        // ── Beat handler: manages choreography lifecycle ──
        function handleBeat(beat, energy, seqIdx) {
            beatAccum++;

            // Non-combat sections use direct pose control
            if (sectionMood === 'storm') {
                activeChoreo = null;
                setFencerGuard(fencerA, 0.3, 0, -0.3, 0.3);
                stanceA = 0;
                setFencerGuard(fencerB, 0.3, 0, -0.3, 0.3);
                stanceB = 0;
                return;
            }

            if (sectionMood === 'salute') {
                activeChoreo = null;
                StickFight.setPose(fencerA, 'salute');
                StickFight.setTarget(fencerA, 'swordAngle', -1.2);
                stanceA = 0;
                StickFight.setPose(fencerB, 'salute');
                StickFight.setTarget(fencerB, 'swordAngle', -1.2);
                stanceB = 0;
                return;
            }

            if (sectionMood === 'interlude') {
                activeChoreo = null;
                setFencerGuard(fencerA, 0.4, -0.2, -0.2, 0.2);
                stanceA = 0;
                setFencerGuard(fencerB, 0.4, -0.2, -0.2, 0.2);
                stanceB = 0;
                return;
            }

            if (sectionMood === 'denouement') {
                activeChoreo = null;
                if (!ragdolled) {
                    // Fencer B loses — final lunge from A
                    StickFight.attack(fencerA, 'lunge', fencerB);
                    // Ragdoll B with impulse away from A
                    StickFight.goRagdoll(fencerB, roofY, fencerB.facing * -200, -300);
                    ragdolled = true;
                }
                // A salutes
                StickFight.setPose(fencerA, 'salute');
                StickFight.setTarget(fencerA, 'swordAngle', -1.0);
                stanceA = 0;
                return;
            }

            // ── Active combat sections: bout1, bout2, finale ──
            // Compute beat duration from analysis
            var beatDur = analysis ? analysis.secondsPerBeat : 0.25;

            // Launch new choreography when current one finishes or on section change
            if (!activeChoreo || !activeChoreo.isActive || sectionMood !== lastChoreoSection) {
                lastChoreoSection = sectionMood;
                var section = sectionMood;
                // Map 'lightning' to bout2-style sequences
                if (section === 'lightning') section = 'bout2';
                launchChoreography(section, beatDur);
            }

            // Update stance offsets based on who is attacking
            if (fencerA.attacking) {
                stanceA = 0.6;
                attackFlashA = 0.8;
            } else {
                stanceA = lerpExp(stanceA, 0, 4, beatDur);
            }
            if (fencerB.attacking) {
                stanceB = 0.6;
                attackFlashB = 0.8;
            } else {
                stanceB = lerpExp(stanceB, 0, 4, beatDur);
            }
        }

        // ── Contact callback (registered once via StickFight.onContact) ──
        function onContactHandler(contact, attacker, target) {
            // Spawn sparks at the actual contact point
            var sparkCount = Math.floor(10 + contact.strength * 20);
            emitSparks(contact.point.x, contact.point.y, sparkCount);

            // Attack flash on the attacker
            if (attacker === fencerA) {
                attackFlashA = Math.max(attackFlashA, 0.6 + contact.strength * 0.4);
            } else {
                attackFlashB = Math.max(attackFlashB, 0.6 + contact.strength * 0.4);
            }

            // Flash overlay proportional to hit strength
            flashAlpha = Math.max(flashAlpha, 0.05 + contact.strength * 0.15);

            // HitStop: 2-3 frames of freeze on both fencers for clash feel
            var stopFrames = contact.strength > 0.7 ? 3 : 2;
            StickFight.hitStop(attacker, stopFrames);
            StickFight.hitStop(target, stopFrames);

            // Screen shake on heavy hits via engine API
            var shakeStrength = 2 + contact.strength * 5;
            var shakeDur = 0.15 + contact.strength * 0.1;
            shakeObj = StickFight.screenShake(shakeStrength, shakeDur);

            // Prevent actual HP-based ragdoll during bouts (we control that in denouement)
            attacker.hp = 100;
            target.hp = 100;
        }

        // ── Sky gradient ──
        function drawSky(ctx, lightningIntensity) {
            var grad = ctx.createLinearGradient(0, 0, 0, roofY);
            if (lightningIntensity > 0.1) {
                var li = lightningIntensity * 0.3;
                grad.addColorStop(0, 'rgba(' + Math.floor(20 + li * 80) + ',' + Math.floor(22 + li * 85) + ',' + Math.floor(40 + li * 100) + ',1)');
                grad.addColorStop(1, 'rgba(' + Math.floor(12 + li * 60) + ',' + Math.floor(14 + li * 65) + ',' + Math.floor(24 + li * 80) + ',1)');
            } else {
                grad.addColorStop(0, SKY_TOP);
                grad.addColorStop(1, SKY_BOT);
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, roofY);
        }

        // ── Title ──
        function drawTitle(ctx) {
            if (titleAlpha < 0.01) return;
            ctx.save();
            ctx.globalAlpha = titleAlpha;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            var fontSize = Math.max(14, Math.min(W * 0.03, 36));
            ctx.font = '700 ' + fontSize + 'px "JetBrains Mono", monospace';

            // Glow
            ctx.shadowColor = LIGHTNING_COLOR;
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#c0c8e0';
            ctx.fillText('FENCING MATCH IN A THUNDERSTORM', W * 0.5, H * 0.12);

            // Subtitle during finale
            if (sectionMood === 'finale') {
                ctx.font = '400 ' + (fontSize * 0.5) + 'px "JetBrains Mono", monospace';
                ctx.shadowBlur = 15;
                ctx.fillStyle = 'rgba(180,190,220,0.6)';
                ctx.fillText('THE FINAL BOUT', W * 0.5, H * 0.12 + fontSize * 1.2);
            }

            ctx.restore();
        }

        // ── Flash overlay ──
        function drawFlash(ctx) {
            if (flashAlpha < 0.01) return;
            ctx.save();
            ctx.globalAlpha = flashAlpha;
            ctx.fillStyle = LIGHTNING_COLOR;
            ctx.fillRect(0, 0, W, H);
            ctx.restore();
        }

        // ── Freeze frame silhouettes ──
        function drawFreezeFrame(ctx, alpha) {
            if (alpha < 0.02) return;
            ctx.save();
            ctx.globalAlpha = alpha * 0.08;
            ctx.fillStyle = LIGHTNING_COLOR;
            ctx.fillRect(0, 0, W, roofY);
            ctx.restore();
        }

        // ── Init ──
        function init(ctx, width, height, anal) {
            W = width; H = height;
            analysis = anal;
            roofY = H * ROOF_Y_RATIO;

            var figH = H * 0.3;
            var gap = Math.min(figH * 0.7, W * 0.2);
            fencerBaseXA = W * 0.5 - gap * 0.5;
            fencerBaseXB = W * 0.5 + gap * 0.5;

            fencerA = StickFight.create({
                x: fencerBaseXA, y: roofY,
                figH: figH, facing: 1,
                color: FENCER_A_COLOR, poseSpeed: 10,
                weaponHand: 'left', leadSide: 'left'
            });
            fencerA.params.swordLen = 0.35;
            fencerA.targets.swordLen = 0.35;

            fencerB = StickFight.create({
                x: fencerBaseXB, y: roofY,
                figH: figH, facing: -1,
                color: FENCER_B_COLOR, poseSpeed: 10,
                weaponHand: 'right', leadSide: 'right'
            });
            fencerB.params.swordLen = 0.35;
            fencerB.targets.swordLen = 0.35;

            stanceA = 0; stanceB = 0;
            attackFlashA = 0; attackFlashB = 0;
            ragdolled = false;

            // Register contact callback once
            if (!contactRegistered) {
                StickFight.onContact(onContactHandler);
                contactRegistered = true;
            }

            // Build choreography sequence pool
            buildChoreoPool();
            activeChoreo = null;
            lastChoreoSection = '';
            beatAccum = 0;

            // Screen shake state
            shakeObj = null;
            thunderShakeIntensity = 0;
            thunderShakeX = 0;
            thunderShakeY = 0;

            initRain();
            initClouds();

            lightningBolts = [];
            sparks = [];
            beatPulse = 0;
            flashAlpha = 0;
            lightningFreeze = 0;
            lastSeqIndex = -1;
            titleAlpha = 0;
            sectionMood = 'storm';
        }

        // ── Resize ──
        function resize(width, height) {
            W = width; H = height;
            roofY = H * ROOF_Y_RATIO;
            var figH = H * 0.3;
            var gap = Math.min(figH * 0.7, W * 0.2);
            fencerBaseXA = W * 0.5 - gap * 0.5;
            fencerBaseXB = W * 0.5 + gap * 0.5;
            if (fencerA) { fencerA.figH = figH; fencerA.y = roofY; }
            if (fencerB) { fencerB.figH = figH; fencerB.y = roofY; }
            initRain();
            initClouds();
        }

        // ── Main render ──
        function render(frameData) {
            var ctx = frameData.ctx;
            var dt = frameData.dt || 1/60;
            var cursor = frameData.cursor;
            beatPulse = frameData.beatPulse;

            // Background
            ctx.fillStyle = SKY_TOP;
            ctx.fillRect(0, 0, W, H);

            if (!cursor) {
                // Idle: dark stormy scene
                drawSky(ctx, 0);
                drawCityscape(ctx, 0);
                drawClouds(ctx, 0);
                drawRooftop(ctx, 0);
                updateRain(dt, 0.2);
                drawRain(ctx, 0.2);
                return;
            }

            var beat = cursor.beat;
            var seqIdx = cursor.seqIndex;
            var energy = analysis ? (analysis.energy[cursor.timelineIndex] || 0) : 0;

            // ── Section transitions ──
            var newSection = mapSection(seqIdx);
            if (seqIdx !== lastSeqIndex) {
                sectionMood = newSection;
                lastSeqIndex = seqIdx;
            }

            // ── Rain intensity tracks energy and section ──
            var targetRain;
            if (sectionMood === 'storm') targetRain = 0.3 + energy * 0.3;
            else if (sectionMood === 'interlude') targetRain = 0.4;
            else if (sectionMood === 'denouement') targetRain = Math.max(0, 0.3 - (cursor.elapsed > 5 ? 0.3 : 0));
            else targetRain = 0.4 + energy * 0.6;
            rainIntensity = lerpExp(rainIntensity, targetRain, 3, dt);

            // ── Beat detection ──
            if (frameData.beatChanged) {

                // Handle choreography and poses on beat
                handleBeat(beat, energy, seqIdx);

                // Lightning on high energy beats
                if (energy > 0.5 && Math.random() < energy * 0.4) {
                    triggerLightning(1);
                }
                // Extra lightning during lightning break sections
                if (sectionMood === 'lightning') {
                    triggerLightning(Math.random() > 0.5 ? 2 : 1);
                    flashAlpha = Math.max(flashAlpha, 0.2);
                }

                // Freeze frame on section changes
                if (seqIdx !== lastSeqIndex - 1 && (sectionMood === 'finale' || sectionMood === 'lightning')) {
                    lightningFreeze = 0.3;
                }
            }

            // ── Advance active choreography each frame ──
            if (activeChoreo && activeChoreo.isActive) {
                StickFight.advanceChoreography(activeChoreo, dt);
            }

            // ── Decay ──
            flashAlpha *= Math.exp(-5 * dt);
            lightningFreeze *= Math.exp(-3 * dt);
            thunderShakeIntensity *= Math.exp(-6 * dt);

            // ── Compute combined screen shake ──
            // Thunder shake (lightning-triggered, manual decay)
            if (thunderShakeIntensity > 0.1) {
                thunderShakeX = (Math.random() - 0.5) * thunderShakeIntensity * 2;
                thunderShakeY = (Math.random() - 0.5) * thunderShakeIntensity * 2;
            } else {
                thunderShakeX = 0; thunderShakeY = 0;
            }

            // Combat shake (engine-managed via StickFight.screenShake)
            var combatShakeX = 0, combatShakeY = 0;
            if (shakeObj && shakeObj.active) {
                StickFight.updateShake(shakeObj, dt);
                combatShakeX = shakeObj.x;
                combatShakeY = shakeObj.y;
            }

            // Combined shake offset
            var totalShakeX = thunderShakeX + combatShakeX;
            var totalShakeY = thunderShakeY + combatShakeY;

            // Title visibility
            if (sectionMood === 'storm' || sectionMood === 'salute') {
                titleTarget = 1;
            } else if (sectionMood === 'finale') {
                titleTarget = 0.7;
            } else if (sectionMood === 'denouement') {
                titleTarget = 0.5;
            } else {
                titleTarget = 0;
            }
            titleAlpha = lerpExp(titleAlpha, titleTarget, 3, dt);

            // ── Update systems ──
            updateFencerPosition(fencerA, stanceA, fencerBaseXA, dt, energy);
            updateFencerPosition(fencerB, stanceB, fencerBaseXB, dt, energy);
            StickFight.updateAll([fencerA, fencerB], dt);
            attackFlashA *= Math.exp(-8 * dt);
            attackFlashB *= Math.exp(-8 * dt);
            updateRain(dt, rainIntensity);
            updateClouds(dt);
            updateLightning(dt);
            updateSparks(dt);

            // Lightning intensity for glow effects
            var lightningIntensity = 0;
            for (var li = 0; li < lightningBolts.length; li++) {
                lightningIntensity = Math.max(lightningIntensity, lightningBolts[li].alpha);
            }
            lightningIntensity = Math.max(lightningIntensity, flashAlpha);

            // ── Draw scene (back to front) ──
            ctx.save();
            ctx.translate(totalShakeX, totalShakeY);

            // 1. Sky
            drawSky(ctx, lightningIntensity);

            // 2. Distant cityscape
            drawCityscape(ctx, lightningIntensity);

            // 3. Clouds
            drawClouds(ctx, lightningIntensity);

            // 4. Lightning bolts (behind rooftop)
            drawLightning(ctx);

            // 5. Freeze-frame silhouette effect
            drawFreezeFrame(ctx, lightningFreeze);

            // 6. Rain (behind fencers)
            drawRain(ctx, rainIntensity * 0.6);

            // 7. Rooftop
            drawRooftop(ctx, energy);

            // 8. Fencers
            StickFight.drawAll(ctx, [fencerA, fencerB]);
            drawFencerFlash(ctx, fencerA, attackFlashA);
            drawFencerFlash(ctx, fencerB, attackFlashB);

            // 9. Sparks
            drawSparks(ctx);

            // 10. Foreground rain
            drawRain(ctx, rainIntensity * 0.4);

            // 11. Title
            drawTitle(ctx);

            // 12. Flash
            drawFlash(ctx);

            ctx.restore();
        }

        BaseRenderer('fencing-thunderstorm-video', 'Fencing Match in a Thunderstorm', {
            init: init,
            render: render,
            resize: resize
        });
    })();

    // ── Page bootstrap ──
    (function() {
        var canvas = document.getElementById('viz-canvas');
        var overlay = document.getElementById('play-overlay');

        Visualizer.init(canvas);
        Visualizer.setRenderer('fencing-thunderstorm-video');

        function loadAndPlay(json) {
            Visualizer.loadSong(json);
            Visualizer.play();
        }

        function fetchSong() {
            var url = '../audio-tracker/songs/fencing-match-in-a-thunderstorm.json';
            if (window.fetch && location.protocol !== 'file:') {
                return fetch(url).then(function(r) { return r.json(); });
            }
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function() {
                    if (xhr.status === 200 || xhr.status === 0) {
                        resolve(JSON.parse(xhr.responseText));
                    } else {
                        reject(new Error('XHR failed: ' + xhr.status));
                    }
                };
                xhr.onerror = function() { reject(new Error('XHR error')); };
                xhr.send();
            });
        }

        overlay.addEventListener('click', function() {
            overlay.classList.add('hidden');
            fetchSong().then(loadAndPlay).catch(function(err) {
                console.error('Failed to load song:', err);
                overlay.classList.remove('hidden');
            });
        });

        // Auto-play when embedded (e.g. jukebox iframe with ?autoplay=1)
        if (new URLSearchParams(window.location.search).get('autoplay') === '1') {
            overlay.click();
        }

        canvas.addEventListener('click', function() {
            if (overlay.classList.contains('hidden')) {
                if (Visualizer.isPlaying()) {
                    Visualizer.pause();
                } else if (Visualizer.isPaused()) {
                    Visualizer.resume();
                } else {
                    Visualizer.play();
                }
            }
        });
    })();
    </script>
</body>
</html>
