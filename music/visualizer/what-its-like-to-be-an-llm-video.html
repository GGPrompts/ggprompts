<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What It's Like to Be an LLM &mdash; Music Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="video-base-styles.css">
    <style>
        :root {
            --vid-bg: #0a0e1a;
            --vid-bg-rgb: 10,14,26;
            --vid-font: 'Space Mono', monospace;
            --vid-accent: #00e5cc;
            --vid-accent-r: 0;
            --vid-accent-g: 229;
            --vid-accent-b: 204;
        }
    </style>
</head>
<body>
    <a href="music-videos/index.html" class="back-link">&larr; Music Videos</a>
    <canvas id="viz-canvas"></canvas>
    <div class="play-overlay" id="play-overlay">
        <div class="play-title">What It's Like to Be an LLM</div>
        <div class="play-sub">inside the inference engine</div>
        <div class="play-btn"></div>
    </div>

    <script src="../audio-tracker/playback-engine.js"></script>
    <script src="engine.js"></script>
    <script src="video-utils.js"></script>
    <script src="base-renderer.js"></script>
    <script>
    // -- What It's Like to Be an LLM -- Video Renderer --
    (function() {
        window.noShortMode = true;
        "use strict";

        var W = 0, H = 0;
        var analysis = null;

        // -- Colors --
        var COL_CYAN    = '#00e5cc';
        var COL_AMBER   = '#f0a030';
        var COL_MAGENTA = '#e040a0';
        var COL_GRAY    = '#4a5568';
        var COL_SICKLY  = '#c0e040';
        var COL_BG      = '#0a0e1a';

        // -- State --
        var bpLocal = 0;
        var lastSeqIndex = -1;
        var globalTime = 0;
        var flashAlpha = 0;
        var shakeX = 0, shakeY = 0;

        // -- Node system --
        var nodes = [];
        var MAX_NODES = 40;
        var targetNodeCount = 6;
        var aliveRadius = 1.0;

        // -- Token rain --
        var tokens = [];
        var MAX_TOKENS = 50;

        // -- Output column --
        var outputTokens = [];
        var MAX_OUTPUT = 20;
        var probBars = [];
        var MAX_PROB_BARS = 15;

        // -- Sparkle particles --
        var sparkles = [];
        var MAX_SPARKLES = 100;

        // -- Cursor blink --
        var cursorVisible = true;
        var cursorTimer = 0;
        var cursorBlinkRate = 2;

        // -- Hallucination state --
        var tearBands = [];
        var hallucinationPhase = 'chaos';
        var blackoutAlpha = 0;
        var rebuildNode = null;
        var rebuildRadius = 0;

        // -- Ghost tokens (Context Fade) --
        var ghostTokens = [];

        // -- Ripple system --
        var rippleSource = -1;
        var rippleTime = 0;

        // -- Beat counter --
        var beatCount = 0;

        // -- Helpers --
        function hexRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }
        function rgbaStr(hex, a) {
            var c = hexRgb(hex);
            return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
        }
        function distN(a, b) {
            var dx = a.x - b.x, dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function lerpV(a, b, t) { return a + (b - a) * t; }

        // =====================
        // NODE SYSTEM
        // =====================
        function createNode(x, y, color, radius) {
            return {
                x: x !== undefined ? x : Math.random() * W,
                y: y !== undefined ? y : Math.random() * H,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                radius: radius || (3 + Math.random() * 5),
                alpha: 0,
                targetAlpha: 0.6,
                color: color || COL_CYAN,
                pulse: 0,
                phase: Math.random() * Math.PI * 2
            };
        }

        function drawNode(ctx, n) {
            if (n.alpha < 0.01) return;
            var r = n.radius * (1 + n.pulse * 0.4);
            // Outer glow
            ctx.fillStyle = rgbaStr(n.color, n.alpha * 0.12);
            ctx.beginPath();
            ctx.arc(n.x, n.y, r * 3, 0, Math.PI * 2);
            ctx.fill();
            // Mid glow
            ctx.fillStyle = rgbaStr(n.color, n.alpha * 0.3);
            ctx.beginPath();
            ctx.arc(n.x, n.y, r * 1.8, 0, Math.PI * 2);
            ctx.fill();
            // Core
            ctx.fillStyle = rgbaStr(n.color, n.alpha * 0.8);
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function manageNodes(target, dt) {
            targetNodeCount = Math.min(target, MAX_NODES);
            while (nodes.length < targetNodeCount) {
                nodes.push(createNode());
            }
            for (var i = 0; i < nodes.length; i++) {
                if (i < targetNodeCount) {
                    if (nodes[i].targetAlpha < 0.1) nodes[i].targetAlpha = 0.4 + Math.random() * 0.3;
                } else {
                    nodes[i].targetAlpha = 0;
                }
            }
            for (var j = nodes.length - 1; j >= 0; j--) {
                if (nodes[j].alpha < 0.01 && nodes[j].targetAlpha <= 0) {
                    nodes.splice(j, 1);
                }
            }
        }

        function updateNodes(dt) {
            for (var i = 0; i < nodes.length; i++) {
                var n = nodes[i];
                n.vx += (Math.random() - 0.5) * 60 * dt;
                n.vy += (Math.random() - 0.5) * 60 * dt;
                n.vx *= 0.96;
                n.vy *= 0.96;
                n.x += n.vx * dt;
                n.y += n.vy * dt;
                if (n.x < -30) n.x = W + 30;
                if (n.x > W + 30) n.x = -30;
                if (n.y < -30) n.y = H + 30;
                if (n.y > H + 30) n.y = -30;
                n.alpha = lerpExp(n.alpha, n.targetAlpha, 4, dt);
                n.pulse *= Math.exp(-5 * dt);
                n.phase += dt;
            }
        }

        // =====================
        // CONNECTION SYSTEM
        // =====================
        function drawConnections(ctx, maxDist, useArcs, wobble, dashPat) {
            var threshold = maxDist || Math.min(W, H) * 0.25;
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i].alpha < 0.05) continue;
                for (var j = i + 1; j < nodes.length; j++) {
                    if (nodes[j].alpha < 0.05) continue;
                    var d = distN(nodes[i], nodes[j]);
                    if (d > threshold || d < 1) continue;
                    var alpha = (1 - d / threshold) * 0.35 * Math.min(nodes[i].alpha, nodes[j].alpha);
                    alpha += bpLocal * 0.12;
                    if (alpha < 0.01) continue;

                    var col = nodes[i].color;
                    ctx.strokeStyle = rgbaStr(col, Math.min(alpha, 0.55));
                    ctx.lineWidth = 1 + bpLocal * 0.5;

                    if (dashPat) {
                        ctx.setLineDash(dashPat);
                        ctx.lineDashOffset = -globalTime * 30;
                    }

                    ctx.beginPath();
                    if (useArcs) {
                        var mx = (nodes[i].x + nodes[j].x) / 2;
                        var my = (nodes[i].y + nodes[j].y) / 2;
                        var dx = nodes[j].x - nodes[i].x;
                        var dy = nodes[j].y - nodes[i].y;
                        var perpX = -dy * 0.2 * Math.sin(globalTime * 0.5 + i + j);
                        var perpY = dx * 0.2 * Math.sin(globalTime * 0.5 + i + j);
                        if (wobble) {
                            perpX += Math.sin(globalTime * 3 + i) * wobble;
                            perpY += Math.cos(globalTime * 3 + j) * wobble;
                        }
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.quadraticCurveTo(mx + perpX, my + perpY, nodes[j].x, nodes[j].y);
                    } else {
                        var x1 = nodes[i].x, y1 = nodes[i].y;
                        var x2 = nodes[j].x, y2 = nodes[j].y;
                        if (wobble) {
                            x1 += Math.sin(globalTime * 3 + i) * wobble;
                            y1 += Math.cos(globalTime * 3 + i) * wobble;
                            x2 += Math.sin(globalTime * 3 + j) * wobble;
                            y2 += Math.cos(globalTime * 3 + j) * wobble;
                        }
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                    }
                    ctx.stroke();
                    if (dashPat) ctx.setLineDash([]);
                }
            }
        }

        // -- Attention arcs (colored bezier, animated dash) --
        var ARC_COLORS = [COL_CYAN, COL_AMBER, '#80e0ff', '#ff80c0', '#a0ff80'];
        function drawAttentionArcs(ctx, energy, amberTint) {
            var threshold = Math.min(W, H) * 0.35;
            var arcIdx = 0;
            for (var i = 0; i < nodes.length; i++) {
                if (nodes[i].alpha < 0.1) continue;
                for (var j = i + 1; j < nodes.length; j++) {
                    if (nodes[j].alpha < 0.1) continue;
                    var d = distN(nodes[i], nodes[j]);
                    if (d > threshold || d < 1) continue;
                    var alpha = (1 - d / threshold) * 0.3 * energy;
                    if (amberTint) alpha *= 1.4;
                    if (alpha < 0.01) continue;

                    var col = ARC_COLORS[arcIdx % ARC_COLORS.length];
                    if (amberTint && arcIdx % 2 === 0) col = COL_AMBER;
                    ctx.strokeStyle = rgbaStr(col, Math.min(alpha + bpLocal * 0.1, 0.65));
                    ctx.lineWidth = amberTint ? (1.5 + bpLocal) : (1 + bpLocal * 0.5);

                    ctx.setLineDash([6, 4]);
                    ctx.lineDashOffset = -globalTime * 40 + arcIdx * 10;

                    var mx = (nodes[i].x + nodes[j].x) / 2;
                    var my = (nodes[i].y + nodes[j].y) / 2;
                    var dx2 = nodes[j].x - nodes[i].x;
                    var dy2 = nodes[j].y - nodes[i].y;
                    var offset = 0.15 + Math.sin(globalTime * 0.7 + arcIdx) * 0.1;
                    var perpX = -dy2 * offset;
                    var perpY = dx2 * offset;

                    ctx.beginPath();
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                    ctx.quadraticCurveTo(mx + perpX, my + perpY, nodes[j].x, nodes[j].y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    arcIdx++;
                }
            }
        }

        // -- Ripple brightness wave --
        function triggerRipple() {
            if (nodes.length === 0) return;
            rippleSource = Math.floor(Math.random() * nodes.length);
            rippleTime = 0;
        }
        function updateRipple(dt) {
            if (rippleSource < 0) return;
            rippleTime += dt;
            var src = nodes[rippleSource];
            if (!src) { rippleSource = -1; return; }
            var speed = Math.min(W, H) * 0.6;
            var waveFront = rippleTime * speed;
            for (var i = 0; i < nodes.length; i++) {
                var d = distN(nodes[i], src);
                if (d < waveFront && d > waveFront - speed * 0.15) {
                    nodes[i].pulse = Math.min(nodes[i].pulse + 0.5, 1.0);
                }
            }
            if (rippleTime > 2.0) rippleSource = -1;
        }

        // =====================
        // TOKEN RAIN
        // =====================
        function createToken() {
            return {
                x: Math.random() * W,
                y: -10 - Math.random() * 50,
                vy: 40 + Math.random() * 60,
                width: 4 + Math.random() * 8,
                height: 2 + Math.random() * 4,
                alpha: 0.4 + Math.random() * 0.4,
                color: Math.random() > 0.3 ? COL_CYAN : '#e0f8ff',
                absorbed: false
            };
        }

        function updateTokens(dt) {
            var absorbY = H * 0.4;
            for (var i = tokens.length - 1; i >= 0; i--) {
                var t = tokens[i];
                t.vy += 120 * dt;
                t.y += t.vy * dt;
                if (!t.absorbed && t.y > absorbY) {
                    var nearest = null, nearDist = Infinity;
                    for (var j = 0; j < nodes.length; j++) {
                        var d = distN(t, nodes[j]);
                        if (d < nearDist) { nearDist = d; nearest = nodes[j]; }
                    }
                    if (nearest && nearDist < 120) {
                        nearest.pulse = Math.min(nearest.pulse + 0.4, 1.0);
                        nearest.alpha = Math.min(nearest.alpha + 0.15, 1.0);
                        t.absorbed = true;
                    }
                }
                if (t.absorbed || t.y > H + 30) {
                    tokens.splice(i, 1);
                }
            }
        }

        function drawTokens(ctx) {
            for (var i = 0; i < tokens.length; i++) {
                var t = tokens[i];
                ctx.save();
                ctx.fillStyle = rgbaStr(t.color, t.alpha);
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.roundRect(t.x - t.width / 2, t.y - t.height / 2, t.width, t.height, 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // =====================
        // OUTPUT COLUMN
        // =====================
        function drawOutputColumn(ctx, dt) {
            var colX = W * 0.78;
            var colW = W * 0.18;
            var tokenH = 14;
            var spacing = 4;
            var baseY = H * 0.85;

            for (var i = 0; i < outputTokens.length; i++) {
                var ot = outputTokens[i];
                ot.targetY = baseY - i * (tokenH + spacing);
                ot.y = lerpV(ot.y, ot.targetY, 1 - Math.exp(-12 * dt));
                if (ot.overshoot > 0) {
                    ot.overshoot *= Math.exp(-8 * dt);
                    ot.y -= ot.overshoot;
                }

                var rw = colW * (0.3 + ot.width * 0.7);
                ctx.fillStyle = rgbaStr(COL_AMBER, 0.12 + ot.brightness * 0.35);
                ctx.beginPath();
                ctx.roundRect(colX, ot.y, rw, tokenH, 3);
                ctx.fill();

                ctx.fillStyle = rgbaStr(COL_AMBER, ot.brightness * 0.55);
                ctx.beginPath();
                ctx.roundRect(colX, ot.y, rw * 0.8, tokenH, 3);
                ctx.fill();

                ot.brightness *= Math.exp(-4 * dt);
            }

            // Probability bars
            for (var p = probBars.length - 1; p >= 0; p--) {
                var pb = probBars[p];
                pb.life -= dt * 2;
                if (pb.life <= 0) { probBars.splice(p, 1); continue; }
                var pbAlpha = pb.life * 0.6;
                for (var b = 0; b < pb.bars.length; b++) {
                    var bar = pb.bars[b];
                    var bx = colX + b * 8;
                    var bh = bar.height * (tokenH * 2);
                    var by = pb.y + tokenH + 2;
                    ctx.fillStyle = rgbaStr(bar.winner ? COL_AMBER : COL_GRAY, pbAlpha * bar.alpha);
                    ctx.fillRect(bx, by + (tokenH * 2 - bh), 5, bh);
                }
            }
        }

        function spawnOutputToken() {
            if (outputTokens.length >= MAX_OUTPUT) outputTokens.shift();
            var baseY = H * 0.85;
            outputTokens.push({
                y: baseY + 30,
                targetY: baseY,
                width: 0.3 + Math.random() * 0.7,
                brightness: 1.0,
                overshoot: -8
            });
            if (probBars.length >= MAX_PROB_BARS) probBars.shift();
            var bars = [];
            var winIdx = Math.floor(Math.random() * 5);
            for (var i = 0; i < 5; i++) {
                bars.push({
                    height: i === winIdx ? (0.6 + Math.random() * 0.4) : (Math.random() * 0.3),
                    winner: i === winIdx,
                    alpha: i === winIdx ? 1.0 : 0.4
                });
            }
            probBars.push({ y: baseY + 30, bars: bars, life: 1.0 });
        }

        function spawnChaoticBars() {
            if (probBars.length >= MAX_PROB_BARS) probBars.shift();
            var bars = [];
            for (var i = 0; i < 5; i++) {
                bars.push({
                    height: 0.3 + Math.random() * 0.7,
                    winner: Math.random() > 0.5,
                    alpha: 0.5 + Math.random() * 0.5
                });
            }
            probBars.push({
                y: H * 0.85 - outputTokens.length * 18,
                bars: bars,
                life: 0.5 + Math.random() * 0.5
            });
        }

        // =====================
        // SPARKLE PARTICLES
        // =====================
        function createSparkle(x, y) {
            var angle = Math.random() * Math.PI * 2;
            var speed = 30 + Math.random() * 80;
            return {
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                size: 1 + Math.random() * 2,
                color: COL_AMBER
            };
        }

        function updateSparkles(dt) {
            for (var i = sparkles.length - 1; i >= 0; i--) {
                var s = sparkles[i];
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.life -= dt * 2.5;
                if (s.life <= 0) sparkles.splice(i, 1);
            }
        }

        function drawSparkles(ctx) {
            for (var i = 0; i < sparkles.length; i++) {
                var s = sparkles[i];
                ctx.fillStyle = rgbaStr(s.color, s.life * 0.8);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // =====================
        // GHOST TOKENS (Context Fade)
        // =====================
        function createGhostToken() {
            return {
                x: Math.random() * W,
                y: -20,
                vy: 15 + Math.random() * 25,
                width: 4 + Math.random() * 6,
                height: 2 + Math.random() * 3,
                alpha: 0.03 + Math.random() * 0.05
            };
        }

        // =====================
        // VISUAL EFFECTS
        // =====================
        function drawScanlines(ctx, alpha) {
            if (alpha < 0.01) return;
            ctx.fillStyle = rgbaStr(COL_BG, alpha);
            for (var y = 0; y < H; y += 4) {
                ctx.fillRect(0, y, W, 1);
            }
        }

        function drawCursorChar(ctx) {
            if (!cursorVisible) return;
            var fontSize = Math.max(20, Math.min(W * 0.03, 40));
            ctx.save();
            ctx.font = '700 ' + fontSize + 'px "Space Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = rgbaStr(COL_CYAN, 0.7);
            ctx.shadowColor = COL_CYAN;
            ctx.shadowBlur = 15;
            ctx.fillText('_', W / 2, H / 2);
            ctx.restore();
        }

        function drawVignette(ctx, alpha) {
            if (alpha < 0.01) return;
            var grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, rgbaStr('#000000', alpha));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        function drawScreenTear(ctx) {
            for (var i = 0; i < tearBands.length; i++) {
                var band = tearBands[i];
                ctx.save();
                ctx.fillStyle = rgbaStr(COL_MAGENTA, 0.03 + Math.random() * 0.04);
                ctx.fillRect(band.offset, band.y, W, band.height);
                ctx.translate(band.offset, 0);
                ctx.fillStyle = rgbaStr(COL_CYAN, 0.02);
                ctx.fillRect(0, band.y, W, band.height);
                ctx.restore();
            }
        }

        // =====================
        // INIT / RESIZE
        // =====================
        function init(ctx, width, height, anal) {
            W = width; H = height;
            analysis = anal;
            globalTime = 0;
            bpLocal = 0;
            lastSeqIndex = -1;
            flashAlpha = 0;
            shakeX = 0; shakeY = 0;
            cursorVisible = true;
            cursorTimer = 0;
            cursorBlinkRate = 2;
            aliveRadius = 1.0;
            blackoutAlpha = 0;
            hallucinationPhase = 'chaos';
            rebuildNode = null;
            rebuildRadius = 0;
            rippleSource = -1;
            rippleTime = 0;
            beatCount = 0;

            nodes = [];
            tokens = [];
            outputTokens = [];
            probBars = [];
            sparkles = [];
            ghostTokens = [];
            tearBands = [];

            for (var i = 0; i < 6; i++) {
                var n = createNode();
                n.alpha = 0.08;
                n.targetAlpha = 0.12;
                nodes.push(n);
            }
        }

        function resize(width, height) {
            W = width; H = height;
        }

        // =====================
        // MAIN RENDER
        // =====================
        function render(frameData) {
            var ctx = frameData.ctx;
            var dt = frameData.dt || 1/60;
            var cursor = frameData.cursor;
            bpLocal = frameData.beatPulse;
            globalTime += dt;

            // -- Idle (cursor null) --
            if (!cursor) {
                ctx.fillStyle = COL_BG;
                ctx.fillRect(0, 0, W, H);
                updateNodes(dt);
                for (var idleN = 0; idleN < nodes.length; idleN++) {
                    nodes[idleN].targetAlpha = 0.1;
                    drawNode(ctx, nodes[idleN]);
                }
                drawConnections(ctx, Math.min(W, H) * 0.18, false, 0, null);
                drawScanlines(ctx, 0.35);
                cursorTimer += dt;
                if (cursorTimer > 0.8) { cursorTimer = 0; cursorVisible = !cursorVisible; }
                drawCursorChar(ctx);
                return;
            }

            var seqIdx = cursor.seqIndex;
            var rowIdx = cursor.rowIndex;
            var energy = analysis ? (analysis.energy[cursor.timelineIndex] || 0) : 0;

            // -- Section change --
            if (seqIdx !== lastSeqIndex) {
                lastSeqIndex = seqIdx;
                beatCount = 0;
                if (seqIdx === 8) {
                    hallucinationPhase = 'chaos';
                    blackoutAlpha = 0;
                    rebuildNode = null;
                    rebuildRadius = 0;
                }
                if (seqIdx === 9) {
                    aliveRadius = 1.0;
                }
                if (seqIdx <= 1) {
                    outputTokens = [];
                    probBars = [];
                }
            }

            // -- Beat events --
            if (frameData.beatChanged) {
                beatCount++;
                if (beatCount % cursorBlinkRate === 0) {
                    cursorVisible = !cursorVisible;
                }
            }

            shakeX *= Math.exp(-10 * dt);
            shakeY *= Math.exp(-10 * dt);
            flashAlpha *= Math.exp(-5 * dt);

            // -- Background --
            ctx.fillStyle = COL_BG;
            ctx.fillRect(0, 0, W, H);

            // -- Camera shake --
            ctx.save();
            ctx.translate(shakeX, shakeY);

            // ===========================================
            // seqIndex 0 -- VOID
            // ===========================================
            if (seqIdx === 0) {
                manageNodes(7, dt);
                for (var v0 = 0; v0 < nodes.length; v0++) {
                    nodes[v0].targetAlpha = 0.12;
                    nodes[v0].color = COL_CYAN;
                }
                if (rowIdx >= 16 && nodes.length > 0) {
                    nodes[0].targetAlpha = 0.5;
                    nodes[0].pulse = Math.max(nodes[0].pulse, 0.15);
                }
                updateNodes(dt);
                drawConnections(ctx, Math.min(W, H) * 0.18, false, 0, null);
                for (var v1 = 0; v1 < nodes.length; v1++) drawNode(ctx, nodes[v1]);
                drawScanlines(ctx, 0.4);
                cursorBlinkRate = 2;
                drawCursorChar(ctx);
            }

            // ===========================================
            // seqIndex 1 -- PROMPT ARRIVES
            // ===========================================
            else if (seqIdx === 1) {
                manageNodes(15, dt);
                for (var p1 = 0; p1 < nodes.length; p1++) {
                    nodes[p1].color = COL_CYAN;
                    nodes[p1].targetAlpha = 0.3 + energy * 0.3;
                }

                if (frameData.beatChanged) {
                    var tokSpawn = 1 + Math.floor(Math.random() * 2);
                    for (var ts = 0; ts < tokSpawn; ts++) {
                        if (tokens.length < MAX_TOKENS) tokens.push(createToken());
                    }
                    if (energy > 0.4) {
                        shakeX = (Math.random() - 0.5) * 3;
                        shakeY = (Math.random() - 0.5) * 3;
                    }
                    if (energy > 0.5) flashAlpha = 0.06;

                    for (var pn1 = 0; pn1 < nodes.length; pn1++) {
                        nodes[pn1].pulse += 0.15;
                    }
                }

                updateNodes(dt);
                updateTokens(dt);
                drawConnections(ctx, Math.min(W, H) * 0.22, false, 0, null);
                for (var pn2 = 0; pn2 < nodes.length; pn2++) drawNode(ctx, nodes[pn2]);
                drawTokens(ctx);

                if (flashAlpha > 0.005) {
                    ctx.fillStyle = rgbaStr(COL_CYAN, flashAlpha);
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // ===========================================
            // seqIndex 2-3 -- ATTENTION BLOOM
            // ===========================================
            else if (seqIdx === 2 || seqIdx === 3) {
                manageNodes(30, dt);
                var isAmber = seqIdx === 3;

                for (var a1 = 0; a1 < nodes.length; a1++) {
                    nodes[a1].color = isAmber ? (a1 % 3 === 0 ? COL_AMBER : COL_CYAN) : COL_CYAN;
                    nodes[a1].targetAlpha = 0.45 + energy * 0.35;
                }

                if (frameData.beatChanged) {
                    triggerRipple();
                    flashAlpha = 0.03 + energy * 0.05;
                }

                updateNodes(dt);
                updateRipple(dt);

                drawVignette(ctx, 0.3);
                drawAttentionArcs(ctx, energy, isAmber);
                for (var a2 = 0; a2 < nodes.length; a2++) drawNode(ctx, nodes[a2]);

                if (flashAlpha > 0.005) {
                    ctx.fillStyle = rgbaStr(isAmber ? COL_AMBER : COL_CYAN, flashAlpha);
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // ===========================================
            // seqIndex 4-6 -- GENERATION FLOW
            // ===========================================
            else if (seqIdx >= 4 && seqIdx <= 6) {
                manageNodes(20, dt);
                for (var g1 = 0; g1 < nodes.length; g1++) {
                    nodes[g1].color = COL_CYAN;
                    nodes[g1].targetAlpha = 0.3 + bpLocal * 0.2;
                }

                if (frameData.beatChanged) {
                    spawnOutputToken();

                    if (seqIdx === 5 && outputTokens.length > 0) {
                        var spkX = W * 0.78 + W * 0.09;
                        var spkY = outputTokens[outputTokens.length - 1].y || H * 0.85;
                        var spkC = 5 + Math.floor(Math.random() * 6);
                        for (var sp = 0; sp < spkC; sp++) {
                            if (sparkles.length < MAX_SPARKLES) sparkles.push(createSparkle(spkX, spkY));
                        }
                    }

                    for (var gp1 = 0; gp1 < nodes.length; gp1++) {
                        nodes[gp1].pulse += 0.15 + energy * 0.2;
                    }
                }

                updateNodes(dt);
                updateSparkles(dt);

                drawConnections(ctx, Math.min(W, H) * 0.22, true, 0, null);
                for (var g2 = 0; g2 < nodes.length; g2++) drawNode(ctx, nodes[g2]);
                drawOutputColumn(ctx, dt);
                drawSparkles(ctx);
            }

            // ===========================================
            // seqIndex 7 -- UNCERTAINTY
            // ===========================================
            else if (seqIdx === 7) {
                manageNodes(20, dt);
                for (var u1 = 0; u1 < nodes.length; u1++) {
                    nodes[u1].vx += (Math.random() - 0.5) * 150 * dt;
                    nodes[u1].vy += (Math.random() - 0.5) * 150 * dt;
                    nodes[u1].color = COL_SICKLY;
                    nodes[u1].targetAlpha = 0.35 + Math.random() * 0.2;
                }

                if (frameData.beatChanged) {
                    spawnChaoticBars();
                    if (Math.random() > 0.5 && outputTokens.length > 0) {
                        outputTokens.pop();
                    } else {
                        spawnOutputToken();
                    }
                    if (Math.random() > 0.6) flashAlpha = 0.05;
                }

                updateNodes(dt);

                drawConnections(ctx, Math.min(W, H) * 0.25, false, 8, null);

                // Ghost double on nodes
                for (var u2 = 0; u2 < nodes.length; u2++) {
                    var gOff = 3 + Math.random() * 2;
                    var oX = nodes[u2].x, oY = nodes[u2].y, oA = nodes[u2].alpha;
                    nodes[u2].x += gOff * (Math.random() - 0.5) * 2;
                    nodes[u2].y += gOff * (Math.random() - 0.5) * 2;
                    nodes[u2].alpha *= 0.4;
                    drawNode(ctx, nodes[u2]);
                    nodes[u2].x = oX; nodes[u2].y = oY; nodes[u2].alpha = oA;
                    drawNode(ctx, nodes[u2]);
                }

                drawOutputColumn(ctx, dt);

                // Random magenta flash
                if (Math.random() < 0.03) {
                    ctx.fillStyle = rgbaStr(COL_MAGENTA, 0.05);
                    ctx.fillRect(0, 0, W, H);
                }
                if (flashAlpha > 0.005) {
                    ctx.fillStyle = rgbaStr(COL_MAGENTA, flashAlpha);
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // ===========================================
            // seqIndex 8 -- HALLUCINATION
            // ===========================================
            else if (seqIdx === 8) {
                if (rowIdx < 16) {
                    hallucinationPhase = 'chaos';
                } else if (rowIdx < 20) {
                    hallucinationPhase = 'blackout';
                } else {
                    hallucinationPhase = 'rebuild';
                }

                if (hallucinationPhase === 'chaos') {
                    manageNodes(25, dt);
                    var chColors = [COL_MAGENTA, COL_SICKLY, COL_CYAN, '#ff4040', '#40ff40'];
                    for (var c1 = 0; c1 < nodes.length; c1++) {
                        nodes[c1].color = chColors[Math.floor(Math.random() * chColors.length)];
                        nodes[c1].vx += (Math.random() - 0.5) * 300 * dt;
                        nodes[c1].vy += (Math.random() - 0.5) * 300 * dt;
                        nodes[c1].targetAlpha = 0.3 + Math.random() * 0.5;
                    }

                    if (frameData.beatChanged) {
                        tearBands = [];
                        var nTears = 3 + Math.floor(Math.random() * 3);
                        for (var tb = 0; tb < nTears; tb++) {
                            tearBands.push({
                                y: Math.random() * H,
                                height: 10 + Math.random() * 40,
                                offset: (Math.random() - 0.5) * 60
                            });
                        }
                        flashAlpha = 0.08;
                    }

                    updateNodes(dt);
                    drawConnections(ctx, Math.min(W, H) * 0.4, true, 15, null);
                    for (var c2 = 0; c2 < nodes.length; c2++) drawNode(ctx, nodes[c2]);
                    drawScreenTear(ctx);

                    if (Math.random() < 0.08) {
                        ctx.fillStyle = rgbaStr(COL_MAGENTA, 0.06);
                        ctx.fillRect(0, 0, W, H);
                    }
                    if (flashAlpha > 0.005) {
                        ctx.fillStyle = rgbaStr(COL_MAGENTA, flashAlpha);
                        ctx.fillRect(0, 0, W, H);
                    }
                }

                else if (hallucinationPhase === 'blackout') {
                    blackoutAlpha = lerpExp(blackoutAlpha, 1.0, 15, dt);
                    tearBands = [];
                    for (var b1 = 0; b1 < nodes.length; b1++) {
                        nodes[b1].targetAlpha = 0;
                    }
                    updateNodes(dt);
                    for (var b2 = 0; b2 < nodes.length; b2++) drawNode(ctx, nodes[b2]);
                    ctx.fillStyle = rgbaStr('#000000', blackoutAlpha);
                    ctx.fillRect(0, 0, W, H);
                }

                else { // rebuild
                    blackoutAlpha = lerpExp(blackoutAlpha, 0, 3, dt);
                    tearBands = [];

                    if (!rebuildNode) {
                        for (var r1 = 0; r1 < nodes.length; r1++) {
                            nodes[r1].targetAlpha = 0;
                        }
                        rebuildNode = createNode(W / 2, H / 2, COL_CYAN, 2);
                        rebuildNode.targetAlpha = 0.8;
                        rebuildNode.vx = 0;
                        rebuildNode.vy = 0;
                        nodes.push(rebuildNode);
                    }
                    rebuildRadius = lerpExp(rebuildRadius, Math.min(W, H) * 0.15, 2, dt);
                    rebuildNode.radius = lerpV(rebuildNode.radius, 6, 1 - Math.exp(-3 * dt));

                    var rbProg = Math.min(1, (rowIdx - 20) / 12);
                    var rbTarget = Math.floor(3 + rbProg * 15);
                    manageNodes(rbTarget, dt);

                    for (var r2 = 0; r2 < nodes.length; r2++) {
                        nodes[r2].color = COL_CYAN;
                        nodes[r2].targetAlpha = 0.25 + rbProg * 0.4;
                    }

                    updateNodes(dt);
                    drawConnections(ctx, Math.min(W, H) * 0.25, true, 0, null);
                    for (var r3 = 0; r3 < nodes.length; r3++) drawNode(ctx, nodes[r3]);

                    // Radial bloom from center
                    var rbGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, rebuildRadius);
                    rbGrad.addColorStop(0, rgbaStr(COL_CYAN, 0.08 * rbProg));
                    rbGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = rbGrad;
                    ctx.fillRect(0, 0, W, H);

                    if (blackoutAlpha > 0.01) {
                        ctx.fillStyle = rgbaStr('#000000', blackoutAlpha);
                        ctx.fillRect(0, 0, W, H);
                    }
                }
            }

            // ===========================================
            // seqIndex 9 -- CONTEXT FADE
            // ===========================================
            else if (seqIdx === 9) {
                manageNodes(30, dt);
                aliveRadius = lerpExp(aliveRadius, 0.12, 0.8, dt);
                var cx = W / 2, cy = H / 2;
                var mxR = Math.max(W, H) * aliveRadius;

                for (var f1 = 0; f1 < nodes.length; f1++) {
                    var nd = nodes[f1];
                    var dC = Math.sqrt((nd.x - cx) * (nd.x - cx) + (nd.y - cy) * (nd.y - cy));
                    if (dC > mxR) {
                        nd.targetAlpha = Math.max(0, nd.targetAlpha - dt * 0.8);
                        nd.color = COL_GRAY;
                    } else {
                        nd.color = COL_GRAY;
                        nd.targetAlpha = 0.3;
                    }
                }

                if (frameData.beatChanged) {
                    aliveRadius *= 0.92;
                    if (ghostTokens.length < 15) ghostTokens.push(createGhostToken());
                }

                for (var gt2 = ghostTokens.length - 1; gt2 >= 0; gt2--) {
                    ghostTokens[gt2].y += ghostTokens[gt2].vy * dt;
                    if (ghostTokens[gt2].y > H + 30) ghostTokens.splice(gt2, 1);
                }

                updateNodes(dt);
                drawConnections(ctx, Math.min(W, H) * 0.25, false, 0, [4, 8]);
                for (var f2 = 0; f2 < nodes.length; f2++) drawNode(ctx, nodes[f2]);

                // Ghost rain
                for (var gt3 = 0; gt3 < ghostTokens.length; gt3++) {
                    var gh = ghostTokens[gt3];
                    ctx.fillStyle = rgbaStr(COL_GRAY, gh.alpha);
                    ctx.fillRect(gh.x, gh.y, gh.width, gh.height);
                }
            }

            // ===========================================
            // seqIndex 10-11 -- NEXT PROMPT / FADE
            // ===========================================
            else if (seqIdx >= 10) {
                var remNodes = seqIdx === 10 ? 4 : 2;
                manageNodes(remNodes, dt);

                for (var n1 = 0; n1 < nodes.length; n1++) {
                    nodes[n1].vy -= 5 * dt;
                    nodes[n1].color = COL_CYAN;
                    nodes[n1].targetAlpha = seqIdx === 10 ? 0.35 : Math.max(0.02, 0.25 - rowIdx * 0.008);
                }

                if (frameData.beatChanged && seqIdx === 10) {
                    var brIdx = beatCount % Math.max(nodes.length, 1);
                    if (nodes[brIdx]) {
                        nodes[brIdx].pulse = 0.6;
                        nodes[brIdx].alpha = Math.min(nodes[brIdx].alpha + 0.3, 0.8);
                    }
                }

                updateNodes(dt);
                drawConnections(ctx, Math.min(W, H) * 0.2, false, 0, null);
                for (var n2 = 0; n2 < nodes.length; n2++) drawNode(ctx, nodes[n2]);

                cursorBlinkRate = seqIdx === 11 ? 4 : 2;
                drawCursorChar(ctx);

                if (seqIdx === 11) {
                    var fadeAmt = Math.min(0.85, rowIdx / 32);
                    ctx.fillStyle = rgbaStr(COL_BG, fadeAmt);
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // -- Restore camera shake --
            ctx.restore();
        }

        BaseRenderer('what-its-like-to-be-an-llm-video', 'What It\'s Like to Be an LLM', {
            beatDecay: 8,
            init: init,
            render: render,
            resize: resize
        });
    })();

    // -- Page bootstrap --
    (function() {
        var canvas = document.getElementById('viz-canvas');
        var overlay = document.getElementById('play-overlay');

        Visualizer.init(canvas);
        Visualizer.setRenderer('what-its-like-to-be-an-llm-video');

        function loadAndPlay(json) {
            Visualizer.loadSong(json);
            Visualizer.play();
        }

        function fetchSong() {
            var url = '../audio-tracker/songs/what-its-like-to-be-an-llm.json';
            if (window.fetch && location.protocol !== 'file:') {
                return fetch(url).then(function(r) { return r.json(); });
            }
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function() {
                    if (xhr.status === 200 || xhr.status === 0) {
                        resolve(JSON.parse(xhr.responseText));
                    } else {
                        reject(new Error('XHR failed: ' + xhr.status));
                    }
                };
                xhr.onerror = function() { reject(new Error('XHR error')); };
                xhr.send();
            });
        }

        overlay.addEventListener('click', function() {
            overlay.classList.add('hidden');
            fetchSong().then(loadAndPlay).catch(function(err) {
                console.error('Failed to load song:', err);
                overlay.classList.remove('hidden');
            });
        });

        if (new URLSearchParams(window.location.search).get('autoplay') === '1') {
            overlay.click();
        }

        canvas.addEventListener('click', function() {
            if (overlay.classList.contains('hidden')) {
                if (Visualizer.isPlaying()) {
                    Visualizer.pause();
                } else if (Visualizer.isPaused()) {
                    Visualizer.resume();
                } else {
                    Visualizer.play();
                }
            }
        });
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
