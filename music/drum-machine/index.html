<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Machine — Neumorphism Step Sequencer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;

            --bg: #2d3436;
            --bg-alt: #252829;
            --text-primary: #ecf0f1;
            --text-secondary: #b2bec3;
            --text-muted: #636e72;
            --accent: #6d5dfc;
            --accent-light: #8b7dfd;
            --accent-dim: rgba(109, 93, 252, 0.3);
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;

            --shadow-light: #3d4447;
            --shadow-dark: #1d2425;

            --neu-flat:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            --neu-pressed:
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
            --neu-convex:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light),
                inset -2px -2px 4px var(--shadow-dark),
                inset 2px 2px 4px var(--shadow-light);
            --neu-flat-sm:
                3px 3px 6px var(--shadow-dark),
                -3px -3px 6px var(--shadow-light);
            --neu-pressed-sm:
                inset 2px 2px 4px var(--shadow-dark),
                inset -2px -2px 4px var(--shadow-light);

            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 30px;
            --radius-full: 9999px;

            --transition-fast: 0.15s ease;
            --transition-base: 0.3s ease;

            /* Track colors */
            --clr-kick: #e74c3c;
            --clr-snare: #f39c12;
            --clr-hihat-c: #f1c40f;
            --clr-hihat-o: #e67e22;
            --clr-clap: #e84393;
            --clr-tom-lo: #6d5dfc;
            --clr-tom-hi: #0984e3;
            --clr-rim: #00cec9;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: var(--font-sans);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            padding: 24px 20px 40px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 32px;
            margin-bottom: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--neu-flat);
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.02em;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 12px;
            transition: color var(--transition-fast);
        }

        .back-link:hover { color: var(--accent); }

        /* ===== TRANSPORT BAR ===== */
        .transport {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--neu-flat);
        }

        .transport-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: var(--bg);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            box-shadow: var(--neu-flat-sm);
            transition: all var(--transition-fast);
            padding: 10px 18px;
            user-select: none;
        }

        .btn:hover { box-shadow: var(--neu-convex); }
        .btn:active, .btn.active { box-shadow: var(--neu-pressed); }

        .btn-round {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .btn-play.playing {
            background: linear-gradient(145deg, var(--accent-light), var(--accent));
            color: white;
            box-shadow: var(--neu-pressed);
        }

        .transport-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transport-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .transport-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-light);
            min-width: 36px;
            text-align: center;
        }

        .slider {
            width: 100px;
            height: 10px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-pressed-sm);
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-flat-sm);
            cursor: pointer;
            transition: box-shadow var(--transition-fast);
        }

        .slider::-webkit-slider-thumb:hover {
            box-shadow: var(--neu-convex);
        }

        .slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-flat-sm);
            cursor: pointer;
            border: none;
        }

        .slider::-moz-range-track {
            height: 10px;
            border-radius: var(--radius-full);
            background: transparent;
        }

        /* ===== PATTERN SLOTS ===== */
        .pattern-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            margin-bottom: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--neu-flat);
        }

        .pattern-bar .transport-label { margin-right: 4px; }

        .pattern-btn {
            width: 40px;
            height: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0;
            border-radius: var(--radius-sm);
        }

        .pattern-btn.active {
            background: linear-gradient(145deg, var(--accent-light), var(--accent));
            color: white;
        }

        .pattern-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ===== STEP GRID ===== */
        .grid-wrap {
            border-radius: var(--radius-lg);
            box-shadow: var(--neu-flat);
            padding: 20px;
            overflow-x: auto;
        }

        .grid-table {
            display: grid;
            grid-template-columns: 140px repeat(16, 1fr);
            gap: 6px;
            min-width: 780px;
        }

        /* Step column numbers */
        .step-numbers {
            display: contents;
        }

        .step-num {
            font-size: 0.65rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-muted);
            padding-bottom: 2px;
            transition: color var(--transition-fast);
        }

        .step-num.beat { color: var(--text-secondary); }
        .step-num.current { color: var(--accent-light); }

        /* Track rows */
        .track-row {
            display: contents;
        }

        .track-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 8px;
            min-height: 42px;
        }

        .track-name {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-color {
            width: 8px;
            height: 8px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        .track-btn {
            font-family: var(--font-sans);
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            background: var(--bg);
            color: var(--text-muted);
            border-radius: 6px;
            box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
            padding: 4px 6px;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .track-btn:active { box-shadow: var(--neu-pressed-sm); }
        .track-btn.muted { color: var(--danger); box-shadow: var(--neu-pressed-sm); }
        .track-btn.soloed { color: var(--warning); box-shadow: var(--neu-pressed-sm); }

        /* Step cells */
        .step {
            width: 100%;
            aspect-ratio: 1;
            min-width: 32px;
            max-width: 48px;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: var(--neu-flat-sm);
            cursor: pointer;
            transition: box-shadow var(--transition-fast), background var(--transition-fast);
            position: relative;
            border: none;
            outline: none;
        }

        .step:hover {
            box-shadow: var(--neu-convex);
        }

        .step.on {
            box-shadow: var(--neu-pressed-sm);
        }

        .step.on::after {
            content: '';
            position: absolute;
            inset: 25%;
            border-radius: 50%;
            background: var(--step-color, var(--accent));
            opacity: 0.9;
            transition: opacity var(--transition-fast);
        }

        .step.current-col {
            background: var(--bg-alt);
        }

        .step.on.current-col::after {
            opacity: 1;
            box-shadow: 0 0 8px var(--step-color, var(--accent));
        }

        /* Beat marker (every 4th step gets a slightly different bg) */
        .step.beat-start {
            border-left: 2px solid var(--shadow-light);
        }

        /* ===== TRACK VOLUME SECTION ===== */
        .volumes-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            margin-top: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--neu-flat);
        }

        .vol-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vol-group label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .vol-slider {
            width: 60px;
            height: 8px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-pressed-sm);
            -webkit-appearance: none;
            appearance: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-flat-sm);
            cursor: pointer;
        }

        .vol-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: var(--radius-full);
            background: var(--bg);
            box-shadow: var(--neu-flat-sm);
            cursor: pointer;
            border: none;
        }

        .vol-slider::-moz-range-track {
            height: 8px;
            border-radius: var(--radius-full);
            background: transparent;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 24px;
            margin-top: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--neu-flat);
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer a:hover { color: var(--accent-light); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .app { padding: 12px 10px 24px; }
            .header { padding: 20px 16px; margin-bottom: 16px; }
            .transport { padding: 14px 16px; gap: 12px; }
            .slider { width: 80px; }
            .grid-wrap { padding: 12px; }
            .grid-table { gap: 4px; grid-template-columns: 110px repeat(16, 1fr); }
            .step { min-width: 24px; border-radius: 8px; }
            .volumes-bar { padding: 12px 16px; gap: 12px; }
            .pattern-bar { padding: 10px 16px; }
        }

        @media (max-width: 480px) {
            .transport { flex-direction: column; align-items: stretch; }
            .transport-btns { justify-content: center; }
            .transport-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <a href="../index.html" class="back-link">&larr; Mozart's Study</a>
            <h1>Drum Machine</h1>
            <p>16-step sequencer with synthesized percussion</p>
        </header>

        <!-- Transport Controls -->
        <div class="transport">
            <div class="transport-btns">
                <button class="btn btn-round btn-play" id="btn-play" title="Play / Pause">&#9654;</button>
                <button class="btn btn-round btn-stop" id="btn-stop" title="Stop">&#9632;</button>
            </div>

            <div class="transport-group">
                <span class="transport-label">BPM</span>
                <input type="range" class="slider" id="tempo-slider" min="60" max="200" value="120">
                <span class="transport-value" id="tempo-display">120</span>
            </div>

            <div class="transport-group">
                <span class="transport-label">Swing</span>
                <input type="range" class="slider" id="swing-slider" min="0" max="75" value="0">
                <span class="transport-value" id="swing-display">0%</span>
            </div>

            <div class="transport-group">
                <span class="transport-label">Vol</span>
                <input type="range" class="slider" id="master-vol" min="0" max="100" value="80">
            </div>
        </div>

        <!-- Pattern Slots -->
        <div class="pattern-bar">
            <span class="transport-label">Pattern</span>
            <button class="btn pattern-btn active" data-pattern="0">A</button>
            <button class="btn pattern-btn" data-pattern="1">B</button>
            <button class="btn pattern-btn" data-pattern="2">C</button>
            <button class="btn pattern-btn" data-pattern="3">D</button>
            <div class="pattern-actions">
                <button class="btn" id="btn-clear" title="Clear current pattern">Clear</button>
                <button class="btn" id="btn-copy" title="Copy pattern">Copy</button>
                <button class="btn" id="btn-paste" title="Paste pattern">Paste</button>
            </div>
        </div>

        <!-- Step Grid -->
        <div class="grid-wrap">
            <div class="grid-table" id="grid"></div>
        </div>

        <!-- Per-Track Volumes -->
        <div class="volumes-bar" id="volumes"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>Patterns auto-save to localStorage. <a href="../index.html">Back to Mozart's Study</a></p>
        </footer>
    </div>

    <script>
    (function () {
        'use strict';

        // ======== TRACK DEFINITIONS ========
        var TRACKS = [
            { id: 'kick',    name: 'Kick',     color: 'var(--clr-kick)' },
            { id: 'snare',   name: 'Snare',    color: 'var(--clr-snare)' },
            { id: 'hihat-c', name: 'HH Closed', color: 'var(--clr-hihat-c)' },
            { id: 'hihat-o', name: 'HH Open',  color: 'var(--clr-hihat-o)' },
            { id: 'clap',    name: 'Clap',     color: 'var(--clr-clap)' },
            { id: 'tom-lo',  name: 'Tom Low',   color: 'var(--clr-tom-lo)' },
            { id: 'tom-hi',  name: 'Tom High',  color: 'var(--clr-tom-hi)' },
            { id: 'rim',     name: 'Rimshot',  color: 'var(--clr-rim)' }
        ];

        var STEPS = 16;
        var NUM_PATTERNS = 4;

        // ======== STATE ========
        var patterns = [];      // patterns[patIdx][trackIdx][step] = 0|1
        var trackVolumes = [];  // trackVolumes[trackIdx] = 0..1
        var trackMuted = [];    // trackMuted[trackIdx] = bool
        var trackSoloed = [];   // trackSoloed[trackIdx] = bool
        var currentPattern = 0;
        var currentStep = -1;
        var isPlaying = false;
        var tempo = 120;
        var swing = 0;
        var masterVol = 0.8;
        var clipboard = null;

        // Web Audio
        var audioCtx = null;
        var masterGain = null;
        var trackGains = [];
        var noiseBuffer = null;

        // Scheduling
        var nextStepTime = 0;
        var scheduleTimer = null;
        var LOOK_AHEAD = 0.1;    // seconds to look ahead
        var SCHEDULE_INTERVAL = 25; // ms between schedule calls

        // DOM refs
        var stepEls = [];  // stepEls[trackIdx][step]
        var stepNumEls = [];
        var prevColStep = -1;

        // ======== INIT ========
        function init() {
            initState();
            buildGrid();
            buildVolumes();
            loadFromStorage();
            refreshGrid();
            bindEvents();
        }

        function initState() {
            for (var p = 0; p < NUM_PATTERNS; p++) {
                patterns[p] = [];
                for (var t = 0; t < TRACKS.length; t++) {
                    patterns[p][t] = new Uint8Array(STEPS);
                }
            }
            for (var t = 0; t < TRACKS.length; t++) {
                trackVolumes[t] = 0.8;
                trackMuted[t] = false;
                trackSoloed[t] = false;
            }
        }

        // ======== AUDIO CONTEXT ========
        function ensureAudio() {
            if (audioCtx) return;
            var AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = masterVol;
            masterGain.connect(audioCtx.destination);

            for (var i = 0; i < TRACKS.length; i++) {
                var g = audioCtx.createGain();
                g.gain.value = trackVolumes[i];
                g.connect(masterGain);
                trackGains[i] = g;
            }

            // Pre-generate noise buffer (2 seconds)
            var sr = audioCtx.sampleRate;
            var len = sr * 2;
            noiseBuffer = audioCtx.createBuffer(1, len, sr);
            var data = noiseBuffer.getChannelData(0);
            for (var i = 0; i < len; i++) {
                data[i] = Math.random() * 2 - 1;
            }
        }

        function resumeAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ======== DRUM SYNTHESIS ========

        function makeNoise(duration) {
            var src = audioCtx.createBufferSource();
            src.buffer = noiseBuffer;
            return src;
        }

        function playKick(time, trackIdx) {
            var t = time;
            // Sine oscillator with pitch sweep
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);

            var oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(1, t);
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

            // Short noise click for attack
            var noise = makeNoise(0.03);
            var noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);

            var noiseFilt = audioCtx.createBiquadFilter();
            noiseFilt.type = 'lowpass';
            noiseFilt.frequency.setValueAtTime(400, t);

            osc.connect(oscGain);
            oscGain.connect(trackGains[trackIdx]);

            noise.connect(noiseFilt);
            noiseFilt.connect(noiseGain);
            noiseGain.connect(trackGains[trackIdx]);

            osc.start(t);
            osc.stop(t + 0.45);
            noise.start(t);
            noise.stop(t + 0.05);
        }

        function playSnare(time, trackIdx) {
            var t = time;
            // Noise body
            var noise = makeNoise(0.2);
            var noiseFilt = audioCtx.createBiquadFilter();
            noiseFilt.type = 'bandpass';
            noiseFilt.frequency.setValueAtTime(3000, t);
            noiseFilt.Q.setValueAtTime(0.8, t);

            var noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.7, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

            // Tone body
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, t);

            var oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.5, t);
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

            noise.connect(noiseFilt);
            noiseFilt.connect(noiseGain);
            noiseGain.connect(trackGains[trackIdx]);

            osc.connect(oscGain);
            oscGain.connect(trackGains[trackIdx]);

            noise.start(t);
            noise.stop(t + 0.25);
            osc.start(t);
            osc.stop(t + 0.12);
        }

        function playHihatClosed(time, trackIdx) {
            var t = time;
            var noise = makeNoise(0.06);
            var filt = audioCtx.createBiquadFilter();
            filt.type = 'highpass';
            filt.frequency.setValueAtTime(8000, t);
            filt.Q.setValueAtTime(1, t);

            var gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

            noise.connect(filt);
            filt.connect(gain);
            gain.connect(trackGains[trackIdx]);

            noise.start(t);
            noise.stop(t + 0.08);
        }

        function playHihatOpen(time, trackIdx) {
            var t = time;
            var noise = makeNoise(0.3);
            var filt = audioCtx.createBiquadFilter();
            filt.type = 'highpass';
            filt.frequency.setValueAtTime(8000, t);
            filt.Q.setValueAtTime(1, t);

            var gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

            noise.connect(filt);
            filt.connect(gain);
            gain.connect(trackGains[trackIdx]);

            noise.start(t);
            noise.stop(t + 0.35);
        }

        function playClap(time, trackIdx) {
            var t = time;
            // Layered noise bursts with slight offsets
            for (var i = 0; i < 3; i++) {
                var offset = i * 0.01;
                var noise = makeNoise(0.06);
                var filt = audioCtx.createBiquadFilter();
                filt.type = 'bandpass';
                filt.frequency.setValueAtTime(2000, t + offset);
                filt.Q.setValueAtTime(1.5, t + offset);

                var gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, t + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.08);

                noise.connect(filt);
                filt.connect(gain);
                gain.connect(trackGains[trackIdx]);

                noise.start(t + offset);
                noise.stop(t + offset + 0.1);
            }
            // Tail
            var tail = makeNoise(0.15);
            var tailFilt = audioCtx.createBiquadFilter();
            tailFilt.type = 'bandpass';
            tailFilt.frequency.setValueAtTime(1500, t + 0.03);
            tailFilt.Q.setValueAtTime(1, t + 0.03);

            var tailGain = audioCtx.createGain();
            tailGain.gain.setValueAtTime(0.25, t + 0.03);
            tailGain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

            tail.connect(tailFilt);
            tailFilt.connect(tailGain);
            tailGain.connect(trackGains[trackIdx]);

            tail.start(t + 0.03);
            tail.stop(t + 0.2);
        }

        function playTomLow(time, trackIdx) {
            var t = time;
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(60, t + 0.2);

            var gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

            osc.connect(gain);
            gain.connect(trackGains[trackIdx]);

            osc.start(t);
            osc.stop(t + 0.4);
        }

        function playTomHigh(time, trackIdx) {
            var t = time;
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);

            var gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.7, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

            osc.connect(gain);
            gain.connect(trackGains[trackIdx]);

            osc.start(t);
            osc.stop(t + 0.3);
        }

        function playRimshot(time, trackIdx) {
            var t = time;
            // Short noise burst
            var noise = makeNoise(0.03);
            var noiseFilt = audioCtx.createBiquadFilter();
            noiseFilt.type = 'highpass';
            noiseFilt.frequency.setValueAtTime(4000, t);

            var noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);

            // High sine tone
            var osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);

            var oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.4, t);
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);

            noise.connect(noiseFilt);
            noiseFilt.connect(noiseGain);
            noiseGain.connect(trackGains[trackIdx]);

            osc.connect(oscGain);
            oscGain.connect(trackGains[trackIdx]);

            noise.start(t);
            noise.stop(t + 0.05);
            osc.start(t);
            osc.stop(t + 0.05);
        }

        var PLAY_FNS = [playKick, playSnare, playHihatClosed, playHihatOpen, playClap, playTomLow, playTomHigh, playRimshot];

        function triggerDrum(trackIdx, time) {
            // Check mute/solo
            var anySoloed = trackSoloed.some(function (s) { return s; });
            if (anySoloed) {
                if (!trackSoloed[trackIdx]) return;
            } else {
                if (trackMuted[trackIdx]) return;
            }

            PLAY_FNS[trackIdx](time, trackIdx);
        }

        // ======== SCHEDULING ========
        function getStepDuration(stepIndex) {
            var baseStep = 60 / tempo / 4; // 16th note duration
            if (swing === 0) return baseStep;

            // Swing: even-numbered steps (0-indexed) are on-beat,
            // odd-numbered steps get delayed
            var swingRatio = swing / 100;
            if (stepIndex % 2 === 0) {
                return baseStep * (1 + swingRatio * 0.5);
            } else {
                return baseStep * (1 - swingRatio * 0.5);
            }
        }

        function scheduleStep(step, time) {
            var pat = patterns[currentPattern];
            for (var t = 0; t < TRACKS.length; t++) {
                if (pat[t][step]) {
                    triggerDrum(t, time);
                }
            }
        }

        function scheduler() {
            while (nextStepTime < audioCtx.currentTime + LOOK_AHEAD) {
                var step = (currentStep + 1) % STEPS;
                currentStep = step;

                scheduleStep(step, nextStepTime);
                highlightStep(step);

                nextStepTime += getStepDuration(step);
            }
        }

        function highlightStep(step) {
            // Use setTimeout to sync visual update close to audio time
            var delay = (nextStepTime - audioCtx.currentTime) * 1000;
            if (delay < 0) delay = 0;

            setTimeout(function () {
                // Clear previous column
                if (prevColStep >= 0) {
                    stepNumEls[prevColStep].classList.remove('current');
                    for (var t = 0; t < TRACKS.length; t++) {
                        stepEls[t][prevColStep].classList.remove('current-col');
                    }
                }
                // Highlight current column
                stepNumEls[step].classList.remove('current');
                stepNumEls[step].classList.add('current');
                for (var t = 0; t < TRACKS.length; t++) {
                    stepEls[t][step].classList.add('current-col');
                }
                prevColStep = step;
            }, delay);
        }

        function startPlayback() {
            ensureAudio();
            resumeAudio();

            isPlaying = true;
            currentStep = -1;
            nextStepTime = audioCtx.currentTime + 0.05;

            document.getElementById('btn-play').classList.add('playing');
            document.getElementById('btn-play').innerHTML = '&#10074;&#10074;';

            scheduleTimer = setInterval(scheduler, SCHEDULE_INTERVAL);
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(scheduleTimer);
            scheduleTimer = null;

            document.getElementById('btn-play').classList.remove('playing');
            document.getElementById('btn-play').innerHTML = '&#9654;';

            // Clear highlight
            if (prevColStep >= 0) {
                stepNumEls[prevColStep].classList.remove('current');
                for (var t = 0; t < TRACKS.length; t++) {
                    stepEls[t][prevColStep].classList.remove('current-col');
                }
                prevColStep = -1;
            }
            currentStep = -1;
        }

        // ======== BUILD DOM ========
        function buildGrid() {
            var grid = document.getElementById('grid');
            var html = '';

            // Step number row
            html += '<div class="step-num"></div>'; // empty cell for label column
            for (var s = 0; s < STEPS; s++) {
                var beatClass = (s % 4 === 0) ? ' beat' : '';
                html += '<div class="step-num' + beatClass + '" data-step="' + s + '">' + (s + 1) + '</div>';
            }

            // Track rows
            for (var t = 0; t < TRACKS.length; t++) {
                var track = TRACKS[t];
                html += '<div class="track-label">';
                html += '<div class="track-color" style="background:' + track.color + '"></div>';
                html += '<span class="track-name">' + track.name + '</span>';
                html += '<button class="track-btn btn-mute" data-track="' + t + '" title="Mute">M</button>';
                html += '<button class="track-btn btn-solo" data-track="' + t + '" title="Solo">S</button>';
                html += '</div>';

                for (var s = 0; s < STEPS; s++) {
                    var beatStart = (s % 4 === 0) ? ' beat-start' : '';
                    html += '<button class="step' + beatStart + '" data-track="' + t + '" data-step="' + s + '" style="--step-color:' + track.color + '"></button>';
                }
            }

            grid.innerHTML = html;

            // Cache step elements
            stepEls = [];
            stepNumEls = [];
            var numEls = grid.querySelectorAll('.step-num[data-step]');
            for (var i = 0; i < numEls.length; i++) {
                stepNumEls[parseInt(numEls[i].dataset.step)] = numEls[i];
            }

            for (var t = 0; t < TRACKS.length; t++) {
                stepEls[t] = [];
                var cells = grid.querySelectorAll('.step[data-track="' + t + '"]');
                for (var s = 0; s < cells.length; s++) {
                    stepEls[t][parseInt(cells[s].dataset.step)] = cells[s];
                }
            }
        }

        function buildVolumes() {
            var container = document.getElementById('volumes');
            var html = '<span class="transport-label">Track Volume</span>';
            for (var t = 0; t < TRACKS.length; t++) {
                html += '<div class="vol-group">';
                html += '<input type="range" class="vol-slider" data-track="' + t + '" min="0" max="100" value="80">';
                html += '<label>' + TRACKS[t].name + '</label>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function refreshGrid() {
            var pat = patterns[currentPattern];
            for (var t = 0; t < TRACKS.length; t++) {
                for (var s = 0; s < STEPS; s++) {
                    if (pat[t][s]) {
                        stepEls[t][s].classList.add('on');
                    } else {
                        stepEls[t][s].classList.remove('on');
                    }
                }
            }
        }

        // ======== EVENTS ========
        function bindEvents() {
            var grid = document.getElementById('grid');

            // Step toggle
            grid.addEventListener('click', function (e) {
                var cell = e.target.closest('.step');
                if (!cell) return;

                ensureAudio();
                resumeAudio();

                var t = parseInt(cell.dataset.track);
                var s = parseInt(cell.dataset.step);
                patterns[currentPattern][t][s] = patterns[currentPattern][t][s] ? 0 : 1;
                cell.classList.toggle('on');
                saveToStorage();

                // Preview sound on toggle-on
                if (patterns[currentPattern][t][s]) {
                    triggerDrum(t, audioCtx.currentTime);
                }
            });

            // Mute / Solo
            grid.addEventListener('click', function (e) {
                var muteBtn = e.target.closest('.btn-mute');
                if (muteBtn) {
                    var t = parseInt(muteBtn.dataset.track);
                    trackMuted[t] = !trackMuted[t];
                    muteBtn.classList.toggle('muted', trackMuted[t]);
                    return;
                }
                var soloBtn = e.target.closest('.btn-solo');
                if (soloBtn) {
                    var t = parseInt(soloBtn.dataset.track);
                    trackSoloed[t] = !trackSoloed[t];
                    soloBtn.classList.toggle('soloed', trackSoloed[t]);
                    return;
                }
            });

            // Play/Pause
            document.getElementById('btn-play').addEventListener('click', function () {
                if (isPlaying) {
                    stopPlayback();
                } else {
                    startPlayback();
                }
            });

            // Stop
            document.getElementById('btn-stop').addEventListener('click', function () {
                stopPlayback();
            });

            // Tempo
            var tempoSlider = document.getElementById('tempo-slider');
            var tempoDisplay = document.getElementById('tempo-display');
            tempoSlider.addEventListener('input', function () {
                tempo = parseInt(this.value);
                tempoDisplay.textContent = tempo;
                saveToStorage();
            });

            // Swing
            var swingSlider = document.getElementById('swing-slider');
            var swingDisplay = document.getElementById('swing-display');
            swingSlider.addEventListener('input', function () {
                swing = parseInt(this.value);
                swingDisplay.textContent = swing + '%';
                saveToStorage();
            });

            // Master volume
            document.getElementById('master-vol').addEventListener('input', function () {
                masterVol = parseInt(this.value) / 100;
                if (masterGain) {
                    masterGain.gain.setValueAtTime(masterVol, audioCtx.currentTime);
                }
                saveToStorage();
            });

            // Track volumes
            document.getElementById('volumes').addEventListener('input', function (e) {
                var slider = e.target.closest('.vol-slider');
                if (!slider) return;
                var t = parseInt(slider.dataset.track);
                trackVolumes[t] = parseInt(slider.value) / 100;
                if (trackGains[t]) {
                    trackGains[t].gain.setValueAtTime(trackVolumes[t], audioCtx.currentTime);
                }
                saveToStorage();
            });

            // Pattern slots
            document.querySelectorAll('.pattern-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var idx = parseInt(this.dataset.pattern);
                    switchPattern(idx);
                });
            });

            // Clear
            document.getElementById('btn-clear').addEventListener('click', function () {
                for (var t = 0; t < TRACKS.length; t++) {
                    patterns[currentPattern][t].fill(0);
                }
                refreshGrid();
                saveToStorage();
            });

            // Copy / Paste
            document.getElementById('btn-copy').addEventListener('click', function () {
                clipboard = [];
                for (var t = 0; t < TRACKS.length; t++) {
                    clipboard[t] = new Uint8Array(patterns[currentPattern][t]);
                }
            });

            document.getElementById('btn-paste').addEventListener('click', function () {
                if (!clipboard) return;
                for (var t = 0; t < TRACKS.length; t++) {
                    patterns[currentPattern][t] = new Uint8Array(clipboard[t]);
                }
                refreshGrid();
                saveToStorage();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function (e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (isPlaying) stopPlayback(); else startPlayback();
                }
            });
        }

        function switchPattern(idx) {
            currentPattern = idx;
            document.querySelectorAll('.pattern-btn').forEach(function (btn) {
                btn.classList.toggle('active', parseInt(btn.dataset.pattern) === idx);
            });
            refreshGrid();
            saveToStorage();
        }

        // ======== PERSISTENCE ========
        var STORAGE_KEY = 'drum-machine-state';

        function saveToStorage() {
            try {
                var data = {
                    patterns: [],
                    trackVolumes: trackVolumes,
                    currentPattern: currentPattern,
                    tempo: tempo,
                    swing: swing,
                    masterVol: masterVol
                };
                for (var p = 0; p < NUM_PATTERNS; p++) {
                    data.patterns[p] = [];
                    for (var t = 0; t < TRACKS.length; t++) {
                        data.patterns[p][t] = Array.from(patterns[p][t]);
                    }
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadFromStorage() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                var data = JSON.parse(raw);

                if (data.patterns) {
                    for (var p = 0; p < NUM_PATTERNS && p < data.patterns.length; p++) {
                        for (var t = 0; t < TRACKS.length && t < data.patterns[p].length; t++) {
                            patterns[p][t] = new Uint8Array(data.patterns[p][t]);
                        }
                    }
                }

                if (data.trackVolumes) {
                    for (var t = 0; t < TRACKS.length && t < data.trackVolumes.length; t++) {
                        trackVolumes[t] = data.trackVolumes[t];
                    }
                    // Update volume sliders
                    document.querySelectorAll('.vol-slider').forEach(function (sl) {
                        var idx = parseInt(sl.dataset.track);
                        sl.value = Math.round(trackVolumes[idx] * 100);
                    });
                }

                if (typeof data.currentPattern === 'number') {
                    switchPattern(data.currentPattern);
                }

                if (typeof data.tempo === 'number') {
                    tempo = data.tempo;
                    document.getElementById('tempo-slider').value = tempo;
                    document.getElementById('tempo-display').textContent = tempo;
                }

                if (typeof data.swing === 'number') {
                    swing = data.swing;
                    document.getElementById('swing-slider').value = swing;
                    document.getElementById('swing-display').textContent = swing + '%';
                }

                if (typeof data.masterVol === 'number') {
                    masterVol = data.masterVol;
                    document.getElementById('master-vol').value = Math.round(masterVol * 100);
                }
            } catch (e) {}
        }

        // Go
        init();
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
