<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive educational story: The Physician's Garden — An Apothecary Interactive Story. The Hortus Medicus. A visual, narrated learning experience from...">
    <title>The Physician's Garden — An Apothecary Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           CSS VARIABLES — From Apothecary Style Guide
        ═══════════════════════════════════════════ */
        :root {
            --font-display: 'EB Garamond', Georgia, serif;
            --font-body: 'Spectral', 'Palatino Linotype', Georgia, serif;
            --font-label: 'EB Garamond', Georgia, serif;
            --font-mono: 'Courier Prime', 'Courier New', monospace;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;

            /* Apothecary Colors */
            --amber-glass: #c47b20;
            --amber-light: #d4942e;
            --amber-dark: #8b5a10;
            --amber-glow: rgba(196, 123, 32, 0.15);

            --forest-deep: #2a4a3a;
            --forest: #3a6b52;
            --forest-light: #4d8b6a;
            --forest-muted: #5a7d6b;

            --cream: #f5efe0;
            --cream-warm: #ede4cf;
            --parchment: #e6dcc6;
            --parchment-dark: #d6ccb0;

            --brass: #b08d57;
            --brass-light: #c9a96e;
            --brass-dark: #8a6d3e;

            --wood-dark: #3a2a1a;
            --wood: #5c3d20;
            --wood-medium: #7a5630;
            --wood-light: #9a7a52;

            --tincture-red: #8b3a3a;
            --tincture-blue: #3a5a7a;
            --tincture-purple: #6a4a6a;
            --dried-herb: #7a8a5a;
            --copper: #b87333;
            --sepia: #704214;

            --text-primary: var(--wood-dark);
            --text-secondary: var(--wood);
            --text-muted: var(--wood-light);
            --text-on-dark: var(--cream);
            --bg-primary: var(--cream);
            --bg-secondary: var(--cream-warm);
            --bg-card: var(--parchment);
            --border-color: var(--parchment-dark);
            --border-ornate: var(--brass);
            --accent: var(--amber-glass);

            --transition-base: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 17px; }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-primary);
            background: var(--cream);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Parchment texture */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
                radial-gradient(ellipse at 30% 20%, transparent 40%, rgba(196, 123, 32, 0.06) 100%),
                radial-gradient(ellipse at 70% 80%, transparent 50%, rgba(58, 107, 82, 0.05) 100%),
                linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 40%, var(--parchment) 80%, var(--parchment-dark) 100%);
            opacity: 0.35;
            z-index: -1;
        }

        /* Shelf edge accents */
        .shelf-edge {
            position: fixed;
            pointer-events: none;
            z-index: 3;
        }
        .shelf-edge-left {
            left: 0; top: 0; bottom: 0; width: 24px;
            background: linear-gradient(90deg, rgba(92, 61, 32, 0.2) 0%, rgba(92, 61, 32, 0.05) 60%, transparent 100%);
        }
        .shelf-edge-right {
            right: 0; top: 0; bottom: 0; width: 24px;
            background: linear-gradient(-90deg, rgba(92, 61, 32, 0.2) 0%, rgba(92, 61, 32, 0.05) 60%, transparent 100%);
        }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .game-container {
            max-width: 780px;
            margin: 0 auto;
            padding: 2rem var(--space-6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        /* ═══════════════════════════════════════════
           TYPOGRAPHY
        ═══════════════════════════════════════════ */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.04em;
            color: var(--wood);
        }
        h1 {
            font-size: clamp(2.2rem, 5.5vw, 3.5rem);
            margin-bottom: var(--space-5);
            color: var(--forest-deep);
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: var(--space-5);
            color: var(--forest-deep);
        }
        h3 {
            font-size: 1.3rem;
            margin-bottom: var(--space-3);
        }
        p {
            margin-bottom: var(--space-4);
            max-width: 60ch;
            text-align: justify;
            hyphens: auto;
        }
        .lead {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--sepia);
            font-style: italic;
        }

        /* Decorative initial */
        .dropcap {
            float: left;
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 700;
            line-height: 0.8;
            padding-right: var(--space-3);
            padding-top: var(--space-2);
            color: var(--forest-deep);
            text-shadow: 1px 1px 0 var(--brass-light);
        }

        /* Botanical divider */
        .herb-divider {
            text-align: center;
            font-size: 1.3rem;
            color: var(--forest-muted);
            margin: var(--space-5) 0;
            letter-spacing: 0.5em;
        }
        .herb-divider::before,
        .herb-divider::after {
            content: '';
            display: inline-block;
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--forest-muted), transparent);
            vertical-align: middle;
            margin: 0 var(--space-4);
        }

        /* Marginalia / side notes */
        .marginalia {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 0.88rem;
            color: var(--wood-light);
            border-left: 3px solid var(--forest);
            padding-left: var(--space-4);
            margin: var(--space-5) 0;
        }

        /* ═══════════════════════════════════════════
           CARDS — Apothecary styled
        ═══════════════════════════════════════════ */
        .card {
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-warm) 100%);
            border: 2px solid var(--parchment-dark);
            border-left: 4px solid var(--forest);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            position: relative;
            transition: all var(--transition-base);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid var(--parchment-dark);
            pointer-events: none;
            opacity: 0.4;
        }
        .card h3 {
            font-family: var(--font-display);
            margin-bottom: var(--space-3);
            color: var(--forest-deep);
        }
        .card p {
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
            font-size: 0.95rem;
        }
        .card p:last-child { margin-bottom: 0; }

        /* Amber-glow card for discoveries */
        .card-amber {
            border-left-color: var(--amber-glass);
            background: linear-gradient(135deg, var(--cream) 0%, rgba(196, 123, 32, 0.08) 100%);
        }
        .card-amber::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 40px; height: 40px;
            background: radial-gradient(circle at top right, var(--amber-glow), transparent 70%);
            pointer-events: none;
        }

        /* Danger / poison card */
        .card-danger {
            border-left-color: var(--tincture-red);
            background: linear-gradient(135deg, var(--cream) 0%, rgba(139, 58, 58, 0.06) 100%);
        }

        /* Herb specimen card */
        .card-herb {
            border-left-color: var(--dried-herb);
            background: linear-gradient(135deg, var(--cream) 0%, rgba(122, 138, 90, 0.08) 100%);
        }

        /* ═══════════════════════════════════════════
           BADGES
        ═══════════════════════════════════════════ */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-3);
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-radius: 2px;
            border: 1px solid currentColor;
        }
        .badge-forest { color: var(--forest); background: rgba(58, 107, 82, 0.08); }
        .badge-amber { color: var(--amber-dark); background: var(--amber-glow); border-color: var(--amber-glass); }
        .badge-red { color: var(--tincture-red); border-color: var(--tincture-red); background: rgba(139, 58, 58, 0.06); }
        .badge-brass {
            color: var(--cream);
            background: radial-gradient(circle at 30% 30%, var(--brass-light) 0%, var(--brass-dark) 100%);
            border: none;
            padding: var(--space-1) var(--space-3);
            border-radius: 10px;
        }
        .badge-row {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: var(--space-3);
        }

        /* ═══════════════════════════════════════════
           SECTION HEADERS
        ═══════════════════════════════════════════ */
        .section-header {
            margin-bottom: var(--space-5);
            text-align: center;
        }
        .section-numeral {
            font-family: var(--font-display);
            font-size: 0.8rem;
            color: var(--forest);
            letter-spacing: 0.2em;
            margin-bottom: var(--space-3);
            text-transform: uppercase;
        }
        .section-numeral::before,
        .section-numeral::after {
            content: '\2022';
            margin: 0 var(--space-3);
            color: var(--amber-glass);
        }

        /* ═══════════════════════════════════════════
           INTERACTIVE ELEMENTS
        ═══════════════════════════════════════════ */

        /* Expandable herb entries */
        .herb-entry {
            border: 1px solid var(--parchment-dark);
            margin-bottom: var(--space-3);
            background: var(--cream);
            transition: all var(--transition-base);
        }
        .herb-entry-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            cursor: pointer;
            user-select: none;
            transition: background var(--transition-base);
        }
        .herb-entry-header:hover {
            background: var(--cream-warm);
        }
        .herb-entry-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .herb-entry-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1rem;
            color: var(--forest-deep);
            flex: 1;
        }
        .herb-entry-latin {
            font-style: italic;
            font-size: 0.85rem;
            color: var(--wood-light);
        }
        .herb-entry-toggle {
            font-size: 0.75rem;
            color: var(--forest-muted);
            transition: transform var(--transition-base);
        }
        .herb-entry.open .herb-entry-toggle {
            transform: rotate(180deg);
        }
        .herb-entry-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 var(--space-4);
        }
        .herb-entry.open .herb-entry-body {
            max-height: 400px;
            padding: 0 var(--space-4) var(--space-4);
        }
        .herb-entry-body p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: left;
        }

        /* Quiz / knowledge test */
        .quiz-box {
            background: linear-gradient(135deg, var(--cream-warm) 0%, var(--parchment) 100%);
            border: 2px solid var(--brass);
            padding: var(--space-5);
            margin: var(--space-5) 0;
        }
        .quiz-box h4 {
            font-family: var(--font-display);
            color: var(--amber-dark);
            margin-bottom: var(--space-4);
            font-size: 1.05rem;
        }
        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-2);
            font-family: var(--font-body);
            font-size: 0.9rem;
            border: 1px solid var(--parchment-dark);
            background: var(--cream);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .quiz-option:hover {
            background: var(--cream-warm);
            border-color: var(--forest);
        }
        .quiz-option.correct {
            background: rgba(58, 107, 82, 0.12);
            border-color: var(--forest);
            color: var(--forest-deep);
        }
        .quiz-option.incorrect {
            background: rgba(139, 58, 58, 0.08);
            border-color: var(--tincture-red);
            color: var(--tincture-red);
            opacity: 0.7;
        }
        .quiz-option:disabled {
            cursor: default;
        }
        .quiz-result {
            margin-top: var(--space-3);
            padding: var(--space-3) var(--space-4);
            font-style: italic;
            font-size: 0.9rem;
            display: none;
        }
        .quiz-result.show { display: block; }
        .quiz-result.correct-result {
            color: var(--forest-deep);
            border-left: 3px solid var(--forest);
        }
        .quiz-result.incorrect-result {
            color: var(--tincture-red);
            border-left: 3px solid var(--tincture-red);
        }

        /* Hover-reveal recipe cards */
        .recipe-card {
            background: var(--cream);
            border: 1px solid var(--parchment-dark);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            position: relative;
            cursor: default;
        }
        .recipe-card-title {
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--forest-deep);
            margin-bottom: var(--space-2);
        }
        .recipe-card-ingredients {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-style: italic;
        }
        .recipe-card-secret {
            font-size: 0.85rem;
            color: var(--tincture-purple);
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px dashed var(--parchment-dark);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s ease;
        }
        .recipe-card:hover .recipe-card-secret {
            max-height: 120px;
            opacity: 1;
        }

        /* ═══════════════════════════════════════════
           TITLE SCREEN
        ═══════════════════════════════════════════ */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
        }
        .title-screen h1 {
            margin-bottom: var(--space-3);
            text-shadow: 2px 2px 0 var(--parchment-dark);
        }
        .title-icon {
            font-size: 3.5rem;
            margin-bottom: var(--space-4);
            filter: drop-shadow(1px 1px 2px rgba(58, 42, 26, 0.3));
        }
        .title-subtitle {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 1.05rem;
            color: var(--sepia);
            letter-spacing: 0.08em;
            margin-bottom: var(--space-5);
        }
        .title-tagline {
            font-family: var(--font-body);
            font-style: italic;
            color: var(--wood-light);
            margin-bottom: var(--space-6);
            max-width: 480px;
            line-height: 1.8;
        }
        .title-start {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-6);
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            border: 2px solid var(--forest);
            background: transparent;
            color: var(--forest-deep);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .title-start::before {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1px solid var(--forest-muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .title-start:hover {
            background: var(--forest-deep);
            color: var(--cream);
            box-shadow: 0 2px 12px rgba(42, 74, 58, 0.3);
        }
        .title-start:hover::before {
            opacity: 1;
            border-color: var(--forest-light);
        }
        .title-credits {
            margin-top: var(--space-6);
            font-family: var(--font-display);
            font-size: 0.65rem;
            color: var(--wood-light);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ═══════════════════════════════════════════
           SCENE WRAPPER
        ═══════════════════════════════════════════ */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
            padding-top: 1rem;
        }
        .scene-wrapper.active { display: flex; }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-3);
            margin-bottom: var(--space-5);
            border-bottom: 1px solid var(--parchment-dark);
        }
        .scene-era {
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--forest);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* ═══════════════════════════════════════════
           SCENE CONTENT
        ═══════════════════════════════════════════ */
        .scene-content {
            animation: sceneFadeIn 0.8s ease-out;
        }
        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scene-content::after {
            content: '';
            display: table;
            clear: both;
        }

        /* Fact toast */
        .fact-found {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            background: linear-gradient(135deg, rgba(58, 107, 82, 0.12) 0%, rgba(58, 107, 82, 0.05) 100%);
            border: 1px solid var(--forest);
            color: var(--forest-deep);
            padding: var(--space-2) var(--space-4);
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: var(--space-4);
            animation: factSlideIn 0.6s ease-out;
        }
        .fact-found::before {
            content: '\2698';
            font-size: 1rem;
            color: var(--forest);
        }
        @keyframes factSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ═══════════════════════════════════════════
           CHOICES
        ═══════════════════════════════════════════ */
        .choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-top: var(--space-5);
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }
        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .choice-btn {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-5);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            border: 2px solid var(--parchment-dark);
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-warm) 100%);
            color: var(--wood);
            cursor: pointer;
            transition: all var(--transition-base);
            text-align: left;
            line-height: 1.5;
        }
        .choice-btn:hover {
            border-color: var(--forest);
            background: linear-gradient(135deg, var(--cream-warm) 0%, rgba(58, 107, 82, 0.08) 100%);
            color: var(--forest-deep);
            box-shadow: 0 2px 8px rgba(42, 74, 58, 0.15);
        }
        .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 1px solid var(--forest-muted);
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--forest);
            margin-right: var(--space-3);
            font-family: var(--font-mono);
        }

        /* ═══════════════════════════════════════════
           FACT TRACKER
        ═══════════════════════════════════════════ */
        .fact-tracker {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            max-width: 280px;
        }
        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--forest);
            background: var(--cream);

    // =================================================================
    //  QUIZ HANDLER

    function handleQuiz(btn, isCorrect) {
        const quizBox = btn.closest('.quiz-box');
        const options = quizBox.querySelectorAll('.quiz-option');
        const correctResult = quizBox.querySelector('.quiz-result.correct-result');
        const incorrectResult = quizBox.querySelector('.quiz-result.incorrect-result');

        options.forEach(opt => {
            opt.disabled = true;
            opt.style.cursor = 'default';
        });

        if (isCorrect) {
            btn.classList.add('correct');
            correctResult.classList.add('show');
        } else {
            btn.classList.add('incorrect');
            // Highlight the correct answer
            options.forEach(opt => {
                if (opt.getAttribute('onclick') && opt.getAttribute('onclick').includes('true')) {
                    opt.classList.add('correct');
                }
            });
            incorrectResult.classList.add('show');
        }
    }

    // =================================================================
    //  STORY ENGINE
    // =================================================================

    const engine = {
        currentScene: null,
        history: [],
        facts: [],
        factsPanelOpen: false,

        init() {
            document.getElementById('startBtn').addEventListener('click', () => this.start());
            document.getElementById('restartBtn').addEventListener('click', () => this.restart());
            document.getElementById('factToggle').addEventListener('click', () => this.toggleFacts());

            // Keyboard support: 1-9 for choices
            document.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '9') {
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.choice-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        },

        start() {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('sceneWrapper').classList.add('active');
            document.getElementById('factTracker').style.display = 'block';
            this.goTo('monastery_garden');
        },

        restart() {
            this.currentScene = null;
            this.history = [];
            this.facts = [];
            this.factsPanelOpen = false;
            document.getElementById('factPanel').classList.remove('open');
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('titleScreen').style.display = 'flex';
            document.getElementById('factTracker').style.display = 'none';
            this.updateFactUI();
            window.scrollTo(0, 0);
        },

        goTo(sceneId) {
            if (sceneId === '_restart') {
                this.restart();
                return;
            }

            const scene = STORY[sceneId];
            if (!scene) return;

            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 500);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1200);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
        },

        renderScene(sceneId, scene) {
            if (scene.era) {
                document.getElementById('sceneEra').textContent = scene.era;
            }

            const container = document.getElementById('sceneContent');
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = sceneId.startsWith('ending') ? 'none' : '';

            let html = '<div class="scene-content">';
            html += scene.content;

            if (scene.fact) {
                this.addFact(scene.fact);
            }

            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    html += `<button class="choice-btn" onclick="engine.goTo('${choice.next}')">`;
                    html += `<span class="choice-key">${i + 1}</span>`;
                    html += choice.text;
                    html += '</button>';
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;
            this.updateFactUI();
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">No remedies yet discovered...</p>';
            } else {
                list.innerHTML = this.facts.map(f => `<div class="fact-item">${f}</div>`).join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    engine.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
