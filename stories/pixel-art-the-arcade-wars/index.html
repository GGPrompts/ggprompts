<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade Wars - A Pixel Art Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           THE ARCADE WARS - Pixel Art Design System Story Build
           Setting: The Golden Age of Arcades, 1978-1985
        ================================================================ */

        :root {
            --pixel-black: #0f0f0f;
            --pixel-dark: #1a1a2e;
            --pixel-navy: #16213e;
            --pixel-blue: #0077c0;
            --pixel-cyan: #00d4ff;
            --pixel-green: #00a854;
            --pixel-lime: #7cfc00;
            --pixel-yellow: #fcbf00;
            --pixel-orange: #ff7700;
            --pixel-red: #e4002b;
            --pixel-pink: #ff6b9d;
            --pixel-magenta: #c800c8;
            --pixel-purple: #6b2d9e;
            --pixel-white: #fcfcfc;
            --pixel-gray-light: #bcbcbc;
            --pixel-gray: #7c7c7c;
            --pixel-gray-dark: #3c3c3c;

            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-surface: #222244;

            --text-primary: #fcfcfc;
            --text-secondary: #bcbcbc;
            --text-muted: #7c7c7c;

            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;

            --border-pixel: 4px solid;
            --shadow-pixel: 4px 4px 0 var(--pixel-black);
            --shadow-pixel-lg: 8px 8px 0 var(--pixel-black);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            font-size: 18px;
            line-height: 1.6;
            image-rendering: pixelated;
        }

        /* --- SCANLINE OVERLAY --- */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px, transparent 2px,
                rgba(0, 0, 0, 0.08) 2px, rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* --- KEYFRAMES --- */
        @keyframes blink-cursor {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes pixel-fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes coin-flash {
            0%, 100% { color: var(--pixel-yellow); text-shadow: 0 0 8px var(--pixel-yellow); }
            50% { color: var(--pixel-orange); text-shadow: 0 0 16px var(--pixel-orange); }
        }

        @keyframes screen-flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.85; }
            94% { opacity: 1; }
            95% { opacity: 0.9; }
            97% { opacity: 1; }
        }

        @keyframes choices-appear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fact-slide {
            from { opacity: 0; transform: translateX(-16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes power-on {
            0% { transform: scaleY(0.01) scaleX(0.5); filter: brightness(10); }
            40% { transform: scaleY(0.01) scaleX(1); filter: brightness(5); }
            60% { transform: scaleY(1) scaleX(1); filter: brightness(2); }
            100% { transform: scaleY(1) scaleX(1); filter: brightness(1); }
        }

        /* --- GAME CONTAINER --- */
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-6);
            position: relative;
        }

        /* --- TITLE SCREEN --- */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
            padding: var(--space-8) var(--space-4);
        }

        .back-to-stories {
            position: absolute;
            top: var(--space-4);
            left: var(--space-4);
            color: var(--pixel-gray);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.55rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .back-to-stories:hover { color: var(--pixel-cyan); }
        .back-to-stories::before { content: '< '; }

        .title-cabinet {
            border: var(--border-pixel) var(--pixel-purple);
            background: var(--bg-secondary);
            padding: var(--space-7) var(--space-6);
            box-shadow: var(--shadow-pixel-lg), inset 0 0 60px rgba(107, 45, 158, 0.15);
            max-width: 600px;
            width: 100%;
        }

        .title-marquee {
            background: linear-gradient(180deg, var(--pixel-blue), var(--pixel-navy));
            border: var(--border-pixel) var(--pixel-cyan);
            padding: var(--space-5) var(--space-4);
            margin-bottom: var(--space-6);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(1rem, 4vw, 1.6rem);
            color: var(--pixel-yellow);
            text-shadow: 3px 3px 0 var(--pixel-orange), 6px 6px 0 var(--pixel-red);
            line-height: 1.8;
            letter-spacing: 2px;
        }

        .title-subtitle {
            font-family: var(--font-body);
            font-size: 1.4rem;
            color: var(--pixel-cyan);
            margin-top: var(--space-3);
            letter-spacing: 3px;
        }

        .title-year {
            font-family: var(--font-display);
            font-size: 0.6rem;
            color: var(--pixel-gray);
            margin-top: var(--space-2);
            letter-spacing: 4px;
        }

        .coin-prompt {
            font-family: var(--font-display);
            font-size: 0.65rem;
            animation: coin-flash 1.2s ease-in-out infinite;
            margin-bottom: var(--space-5);
        }

        .start-btn {
            font-family: var(--font-display);
            font-size: 0.7rem;
            background: var(--pixel-red);
            color: var(--pixel-white);
            border: var(--border-pixel) var(--pixel-yellow);
            padding: var(--space-4) var(--space-7);
            cursor: pointer;
            box-shadow: var(--shadow-pixel);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s;
        }

        .start-btn:hover {
            background: var(--pixel-yellow);
            color: var(--pixel-black);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--pixel-black);
        }

        .start-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--pixel-black);
        }

        .credit-text {
            font-family: var(--font-display);
            font-size: 0.5rem;
            color: var(--pixel-gray-dark);
            margin-top: var(--space-6);
            letter-spacing: 1px;
        }

        /* --- SCENE WRAPPER --- */
        .scene-wrapper {
            display: none;
        }
        .scene-wrapper.active {
            display: block;
            animation: pixel-fade-in 0.3s ease-out;
        }

        /* --- SCENE HEADER (HUD) --- */
        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-secondary);
            border: var(--border-pixel) var(--pixel-gray-dark);
            margin-bottom: var(--space-5);
            box-shadow: var(--shadow-pixel);
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .hud-era {
            font-family: var(--font-display);
            font-size: 0.5rem;
            color: var(--pixel-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-year {
            font-family: var(--font-display);
            font-size: 0.55rem;
            color: var(--pixel-yellow);
        }

        .hud-progress {
            font-family: var(--font-display);
            font-size: 0.5rem;
            color: var(--pixel-green);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--pixel-black);
            border: 2px solid var(--pixel-gray-dark);
            margin-top: var(--space-2);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pixel-green), var(--pixel-lime));
            transition: width 0.5s ease;
        }

        /* --- SCENE CONTENT --- */
        #sceneContent {
            animation: pixel-fade-in 0.5s ease-out;
        }

        .scene-content {
            animation: pixel-fade-in 0.4s ease-out;
        }

        /* --- ARCADE CABINET FRAME (scene cards) --- */
        .cabinet-screen {
            border: var(--border-pixel) var(--pixel-gray-dark);
            background: var(--bg-card);
            padding: var(--space-5);
            margin-bottom: var(--space-4);
            box-shadow: var(--shadow-pixel), inset 0 0 40px rgba(0, 119, 192, 0.1);
            position: relative;
        }

        .cabinet-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent, var(--pixel-cyan), transparent
            );
            opacity: 0.5;
        }

        .screen-header {
            font-family: var(--font-display);
            font-size: 0.6rem;
            color: var(--pixel-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding-bottom: var(--space-3);
            margin-bottom: var(--space-4);
            border-bottom: 2px solid var(--pixel-gray-dark);
        }

        .scene-text p {
            font-family: var(--font-body);
            font-size: 1.3rem;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: var(--space-4);
        }

        .scene-text p:last-child { margin-bottom: 0; }

        /* Highlight spans */
        .hl-yellow { color: var(--pixel-yellow); }
        .hl-cyan { color: var(--pixel-cyan); }
        .hl-green { color: var(--pixel-lime); }
        .hl-red { color: var(--pixel-red); }
        .hl-pink { color: var(--pixel-pink); }
        .hl-orange { color: var(--pixel-orange); }
        .hl-purple { color: var(--pixel-purple); }

        /* --- STAT BLOCKS (like RPG item descriptions) --- */
        .stat-block {
            border: 2px solid var(--pixel-gray-dark);
            background: rgba(0, 0, 0, 0.4);
            padding: var(--space-3) var(--space-4);
            margin: var(--space-4) 0;
            font-family: var(--font-body);
        }

        .stat-block .stat-title {
            font-family: var(--font-display);
            font-size: 0.55rem;
            color: var(--pixel-yellow);
            margin-bottom: var(--space-2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-block .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 1.1rem;
            border-bottom: 1px dotted var(--pixel-gray-dark);
        }

        .stat-block .stat-row:last-child { border-bottom: none; }

        .stat-label { color: var(--pixel-gray-light); }
        .stat-value { color: var(--pixel-cyan); }
        .stat-value-gold { color: var(--pixel-yellow); }
        .stat-value-red { color: var(--pixel-red); }
        .stat-value-green { color: var(--pixel-lime); }

        /* --- DIALOGUE BOXES --- */
        .dialogue-box {
            border: var(--border-pixel) var(--pixel-blue);
            background: var(--pixel-black);
            padding: var(--space-4);
            margin: var(--space-4) 0;
            position: relative;
        }

        .dialogue-box::after {
            content: '\25BC';
            position: absolute;
            bottom: var(--space-2);
            right: var(--space-3);
            color: var(--pixel-white);
            animation: blink-cursor 0.8s step-end infinite;
            font-size: 0.8rem;
        }

        .dialogue-speaker {
            font-family: var(--font-display);
            font-size: 0.55rem;
            color: var(--pixel-yellow);
            margin-bottom: var(--space-2);
            text-transform: uppercase;
        }

        .dialogue-text {
            font-family: var(--font-body);
            font-size: 1.3rem;
            line-height: 1.6;
            color: var(--pixel-white);
        }

        /* --- HIGH SCORE TABLE --- */
        .high-score-table {
            border: var(--border-pixel) var(--pixel-yellow);
            background: var(--pixel-black);
            padding: var(--space-4);
            margin: var(--space-4) 0;
            text-align: center;
        }

        .high-score-table .hs-title {
            font-family: var(--font-display);
            font-size: 0.65rem;
            color: var(--pixel-red);
            margin-bottom: var(--space-3);
            letter-spacing: 2px;
        }

        .high-score-row {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-body);
            font-size: 1.2rem;
            padding: 2px var(--space-2);
        }

        .hs-rank { color: var(--pixel-gray); }
        .hs-name { color: var(--pixel-yellow); letter-spacing: 4px; }
        .hs-score { color: var(--pixel-white); }

        /* --- FACT FOUND --- */
        .fact-found-inline {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--pixel-green);
            color: var(--pixel-black);
            padding: var(--space-2) var(--space-4);
            font-family: var(--font-display);
            font-size: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: var(--space-4);
            animation: fact-slide 0.6s ease-out;
            box-shadow: var(--shadow-pixel);
        }

        /* --- CHOICES --- */
        .choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-top: var(--space-6);
            opacity: 0;
            animation: choices-appear 0.5s ease-out 0.6s forwards;
        }

        .choice-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-family: var(--font-display);
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: var(--border-pixel) var(--pixel-cyan);
            background: var(--bg-secondary);
            color: var(--pixel-cyan);
            cursor: pointer;
            box-shadow: var(--shadow-pixel);
            transition: all 0.1s;
            text-align: left;
            line-height: 1.8;
        }

        .choice-btn:hover {
            background: var(--pixel-cyan);
            color: var(--pixel-black);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--pixel-black);
        }

        .choice-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--pixel-black);
        }

        .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: 2px solid currentColor;
            font-size: 0.55rem;
            margin-right: var(--space-3);
            flex-shrink: 0;
        }

        .choice-btn-danger {
            border-color: var(--pixel-red);
            color: var(--pixel-red);
        }
        .choice-btn-danger:hover {
            background: var(--pixel-red);
            color: var(--pixel-white);
        }

        .choice-btn-gold {
            border-color: var(--pixel-yellow);
            color: var(--pixel-yellow);
        }
        .choice-btn-gold:hover {
            background: var(--pixel-yellow);
            color: var(--pixel-black);
        }

        /* --- FACT TRACKER (top-right) --- */
        .fact-tracker {
            position: fixed;
            top: var(--space-4);
            right: var(--space-4);
            z-index: 100;
            max-width: 280px;
            display: none;
        }

        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: var(--bg-secondary);
            border: var(--border-pixel) var(--pixel-green);
            color: var(--pixel-green);
            font-family: var(--font-display);
            font-size: 0.45rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow-pixel);
            margin-left: auto;
            transition: all 0.1s;
        }

        .fact-tracker-toggle:hover {
            background: var(--pixel-green);
            color: var(--pixel-black);
        }

        .fact-tracker-panel {
            display: none;
            margin-top: var(--space-2);
            background: var(--bg-secondary);
            border: var(--border-pixel) var(--pixel-green);
            padding: var(--space-3);
            box-shadow: var(--shadow-pixel);
            max-height: 50vh;
            overflow-y: auto;
        }

        .fact-tracker-panel.open { display: block; }

        .fact-tracker-panel .panel-title {
            font-family: var(--font-display);
            font-size: 0.5rem;
            color: var(--pixel-yellow);
            margin-bottom: var(--space-3);
            letter-spacing: 1px;
        }

        .fact-item {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-secondary);
            padding: var(--space-2) 0;
            border-bottom: 1px dotted var(--pixel-gray-dark);
            animation: fact-slide 0.4s ease-out;
        }
        .fact-item:last-child { border-bottom: none; }

        .no-facts {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--pixel-gray-dark);
        }

        /* --- TRANSITION OVERLAY --- */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            pointer-events: none;
            background: var(--pixel-black);
            opacity: 0;
        }

        .transition-overlay.active {
            pointer-events: all;
            animation: screen-flicker 0.6s ease-in-out;
        }

        /* --- ENDING SCREEN SPECIAL --- */
        .ending-banner {
            border: var(--border-pixel) var(--pixel-yellow);
            background: linear-gradient(180deg, var(--pixel-navy), var(--pixel-dark));
            padding: var(--space-6);
            text-align: center;
            box-shadow: var(--shadow-pixel-lg);
            margin-bottom: var(--space-5);
        }

        .ending-banner h2 {
            font-family: var(--font-display);
            font-size: clamp(0.7rem, 3vw, 1rem);
            color: var(--pixel-yellow);
            text-shadow: 2px 2px 0 var(--pixel-orange);
            margin-bottom: var(--space-3);
        }

        .ending-banner .ending-subtitle {
            font-family: var(--font-body);
            font-size: 1.4rem;
            color: var(--pixel-cyan);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .game-container { padding: var(--space-4); }
            .title-cabinet { padding: var(--space-5) var(--space-4); }
            .scene-header { flex-direction: column; align-items: flex-start; gap: var(--space-2); }
            .cabinet-screen { padding: var(--space-4); }
            .fact-tracker { max-width: 220px; }
            .fact-tracker-toggle { font-size: 0.4rem; }
            .choice-btn { font-size: 0.5rem; padding: var(--space-3); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Title Screen -->
        <div class="title-screen" id="titleScreen">
            <a href="../index.html" class="back-to-stories">Stories</a>
            <div class="title-cabinet">
                <div class="title-marquee">
                    <h1>The Arcade Wars</h1>
                    <div class="title-subtitle">SPACE INVADERS TO THE NES</div>
                    <div class="title-year">1978 - 1985</div>
                </div>
                <p class="coin-prompt">INSERT COIN TO CONTINUE</p>
                <button class="start-btn" id="startBtn">Start Game</button>
                <p class="credit-text">An interactive history of the golden age of arcades</p>
            </div>
        </div>

        <!-- Scene Display -->
        <div class="scene-wrapper" id="sceneWrapper">
            <div class="scene-header" id="sceneHeader">
                <span class="hud-era" id="hudEra">THE INVASION</span>
                <span class="hud-year" id="hudYear">1978</span>
                <span class="hud-progress" id="hudProgress">FACTS: 0</span>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            <div id="sceneContent"></div>
        </div>

        <!-- Fact Tracker -->
        <div class="fact-tracker" id="factTracker">
            <button class="fact-tracker-toggle" id="factToggle">
                FACTS: <span id="factCount">0</span>
            </button>
            <div class="fact-tracker-panel" id="factPanel">
                <div class="panel-title">ARCADE HISTORY LOG</div>
                <div id="factList"><p class="no-facts">No facts discovered yet...</p></div>
            </div>
        </div>

        <!-- Transition -->
        <div class="transition-overlay" id="transition"></div>
    </div>

    <script>
    const TOTAL_FACTS = 14;

    const STORY = {

        // ==============================
        // SCENE 1: THE INVASION BEGINS
        // ==============================
        intro: {
            year: '1978',
            era: 'THE INVASION',
            content: `
                <div class="cabinet-screen">
                    <div class="screen-header">/// TRANSMISSION INCOMING ///</div>
                    <div class="scene-text">
                        <p>It is <span class="hl-yellow">1978</span>. In a cramped office in Tokyo, a 34-year-old engineer named <span class="hl-cyan">Tomohiro Nishikado</span> has spent the last year building something nobody asked for. His employer, <span class="hl-cyan">Taito Corporation</span>, wanted another breakout clone. Instead, Nishikado designed custom hardware from scratch &mdash; a new microprocessor board that could handle something never attempted in arcades: <span class="hl-yellow">moving rows of animated enemies</span>.</p>

            if (!scene) return;

            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 300);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 600);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
        },

        renderScene(sceneId, scene) {
            const container = document.getElementById('sceneContent');

            // Update HUD
            if (scene.era) document.getElementById('hudEra').textContent = scene.era;
            if (scene.year) document.getElementById('hudYear').textContent = scene.year;

            let html = '<div class="scene-content">';
            html += scene.content;

            // Collect fact
            if (scene.fact && !this.facts.includes(scene.fact)) {
                this.addFact(scene.fact);
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    const btnClass = choice.class || 'choice-btn';
                    html += `<button class="${btnClass}" onclick="engine.goTo('${choice.next}')">`;
                    html += `<span class="choice-key">${i + 1}</span>`;
                    html += choice.text;
                    html += '</button>';
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // Update final score displays if on ending
            if (sceneId.startsWith('ending')) {
                const scoreEl1 = document.getElementById('finalScore1');
                const scoreEl2 = document.getElementById('finalScore2');
                const scoreEl3 = document.getElementById('finalScore3');
                if (scoreEl1) scoreEl1.textContent = this.facts.length + ' / ' + TOTAL_FACTS;
                if (scoreEl2) scoreEl2.textContent = this.facts.length + ' / ' + TOTAL_FACTS;
                if (scoreEl3) scoreEl3.textContent = this.facts.length + ' / ' + TOTAL_FACTS;
            }

            this.updateFactUI();
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;
            document.getElementById('hudProgress').textContent = 'FACTS: ' + count + '/' + TOTAL_FACTS;

            // Progress bar
            const pct = Math.round((count / TOTAL_FACTS) * 100);
            document.getElementById('progressFill').style.width = pct + '%';

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">No facts discovered yet...</p>';
            } else {
                list.innerHTML = this.facts.map(f => '<div class="fact-item">' + f + '</div>').join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    engine.init();
    </script>
</body>
</html>
