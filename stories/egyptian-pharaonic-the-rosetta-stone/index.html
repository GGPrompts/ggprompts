<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rosetta Stone &mdash; An Egyptian Pharaonic Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Cinzel Decorative', 'Cinzel', serif;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Cormorant Garamond', Georgia, serif;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;
            --space-9: 96px;

            /* Gold Palette */
            --gold-bright: #d4af37;
            --gold: #c9a032;
            --gold-light: #e8cc6e;
            --gold-pale: #f2e6b5;
            --gold-dark: #8b6914;
            --gold-deep: #6b4f0a;

            /* Lapis Lazuli */
            --lapis: #1e3a6e;
            --lapis-light: #2a4f8f;
            --lapis-dark: #0f2240;
            --lapis-deep: #0a1629;

            /* Turquoise */
            --turquoise: #30a5a5;
            --turquoise-light: #5cc5c5;
            --turquoise-dark: #1e7070;

            /* Papyrus & Sand */
            --papyrus: #e8d5a3;
            --papyrus-light: #f4ecd4;
            --papyrus-dark: #d4bc82;
            --sand: #c9b27c;
            --sand-dark: #a89060;
            --desert: #b8975a;

            /* Stone & Earth */
            --sandstone: #c4a86c;
            --terracotta: #b35a38;
            --obsidian: #1a1a1a;
            --nile-green: #2e6b4f;
            --carnelian: #b44830;

            /* Neutrals */
            --black: #0d0d0d;
            --charcoal: #1e1e1e;
            --graphite: #3a3530;
            --warm-grey: #7a6f60;
            --white: #faf8f0;

            /* Semantic */
            --text-primary: var(--papyrus-light);
            --text-secondary: rgba(244, 236, 212, 0.8);
            --text-muted: rgba(244, 236, 212, 0.5);
            --bg-primary: var(--lapis-deep);
            --bg-secondary: var(--lapis-dark);
            --accent: var(--gold);

            --border-gold: 2px solid var(--gold-dark);
            --shadow-warm: 0 4px 24px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(201, 160, 50, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 17px; }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-primary);
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(30, 58, 110, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Papyrus Texture */
        .texture-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 22, 41, 0.5) 100%);
        }

        /* ======================================================
           LAYOUT
        ====================================================== */
        .game-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ======================================================
           TITLE SCREEN
        ====================================================== */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: var(--space-9) var(--space-6);
        }

        .back-to-stories {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 200;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-to-stories::before { content: '\2190  '; }
        .back-to-stories:hover { color: var(--gold-light); }

        .title-flourish {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--gold-dark);
            letter-spacing: 0.5em;
            margin-bottom: var(--space-5);
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--gold-light);
            margin-bottom: var(--space-4);
            text-shadow: 0 2px 8px rgba(201, 160, 50, 0.3);
        }

        .title-subtitle {
            font-family: var(--font-heading);
            font-size: 1.125rem;
            font-style: italic;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            max-width: 520px;
            margin: 0 auto var(--space-6);
        }

        .title-quote {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-7);
            max-width: 500px;
        }

        .title-start {
            font-family: var(--font-heading);
            font-size: 0.9375rem;
            letter-spacing: 0.15em;
            padding: var(--space-3) var(--space-7);
            border: 2px solid var(--gold-dark);
            background: transparent;
            color: var(--gold-light);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            text-transform: uppercase;
        }

        .title-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--lapis);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .title-start:hover {
            border-color: var(--gold);
            color: var(--papyrus-light);
            box-shadow: var(--shadow-glow);
        }

        .title-start:hover::before { left: 0; }

        .title-credits {
            margin-top: var(--space-7);
            font-family: var(--font-body);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            font-style: italic;
        }

        /* ======================================================
           HIEROGLYPHIC DIVIDER
        ====================================================== */
        .ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-4);
            margin: var(--space-7) 0;
            color: var(--gold-dark);
        }

        .ornate-divider::before,
        .ornate-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
        }

        .ornate-divider span {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.3em;
        }

        /* ======================================================
           SCENE CONTAINER
        ====================================================== */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .scene-wrapper.active {
            display: flex;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-4);
            margin-bottom: var(--space-6);
            border-bottom: 1px solid rgba(201, 160, 50, 0.25);
        }

        .scene-era {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--gold-dark);
            text-transform: uppercase;
        }

        .scene-year {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--turquoise-light);
        }

        .scene-discovery-count {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: var(--gold);
        }

        /* ======================================================
           SCENE TYPES
        ====================================================== */

        /* --- Papyrus Scroll (main narrative) --- */
        .scene-scroll {
            position: relative;
            padding: var(--space-6);
            background: linear-gradient(to right, rgba(15, 34, 64, 0.3) 0%, rgba(10, 22, 41, 0.6) 2%, rgba(10, 22, 41, 0.6) 98%, rgba(15, 34, 64, 0.3) 100%);
            border-top: 2px solid rgba(201, 160, 50, 0.3);
            border-bottom: 2px solid rgba(201, 160, 50, 0.3);
            margin-bottom: var(--space-6);
        }

        .scene-scroll::before {
            content: '';
            position: absolute;
            left: 50px;
            top: 0; bottom: 0;
            width: 1px;
            background: rgba(201, 160, 50, 0.15);
        }

        .scene-scroll .scene-text {
            padding-left: var(--space-7);
        }

        .scene-scroll .scene-text p {
            margin-bottom: var(--space-4);
        }

        .scene-scroll .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Stone Tablet (historical context, inscriptions) --- */
        .scene-tablet {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 34, 64, 0.7) 0%, rgba(10, 22, 41, 0.9) 100%);
            border: 2px solid var(--gold-dark);
            padding: var(--space-7);
            margin-bottom: var(--space-6);
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.4),
                var(--shadow-warm);
        }

        .scene-tablet::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(201, 160, 50, 0.2);
            pointer-events: none;
        }

        .scene-tablet .scene-text p {
            margin-bottom: var(--space-4);
        }

        .scene-tablet .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Cartouche Card (character profiles, artifacts) --- */
        .scene-cartouche {
            background: linear-gradient(145deg, rgba(15, 34, 64, 0.5) 0%, rgba(10, 22, 41, 0.8) 100%);
            border: 1px solid rgba(201, 160, 50, 0.3);
            border-radius: var(--space-1);
            padding: var(--space-6);
            position: relative;
            margin-bottom: var(--space-6);
        }

        .scene-cartouche::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--lapis), var(--gold), var(--turquoise-dark), var(--gold), var(--lapis));
        }

        .scene-cartouche .card-title {
            font-family: var(--font-heading);
            font-size: 1.375rem;
            letter-spacing: 0.05em;
            color: var(--gold-light);
            margin-bottom: var(--space-3);
        }

        .scene-cartouche .scene-text {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .scene-cartouche .scene-text p {
            margin-bottom: var(--space-4);
        }

        .scene-cartouche .scene-text p:last-child {
            margin-bottom: 0;
        }

        .scene-cartouche .card-footer {
            margin-top: var(--space-5);
            padding-top: var(--space-4);
            border-top: 1px solid rgba(201, 160, 50, 0.2);
            font-family: var(--font-heading);
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        /* --- Ending --- */
        .scene-ending {
            text-align: center;
            padding: var(--space-8) var(--space-6);
            margin-bottom: var(--space-6);
        }

        .scene-ending .ending-label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: var(--gold);
            margin-bottom: var(--space-4);
            text-transform: uppercase;
        }

        .scene-ending .ending-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: var(--gold-light);
            margin-bottom: var(--space-6);
            text-shadow: 0 2px 8px rgba(201, 160, 50, 0.3);
        }

        .scene-ending .scene-text {
            max-width: 550px;
            margin: 0 auto;
        }

        .scene-ending .scene-text p {
            margin-bottom: var(--space-4);
            color: var(--text-secondary);
        }

        .scene-ending .the-end {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.5em;
            color: var(--gold-dark);
            margin-top: var(--space-7);
        }

        /* ======================================================
           DROP CAP
        ====================================================== */
        .dropcap {
            position: relative;
        }

        .dropcap::first-letter {
            float: left;
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.75;
            padding-right: var(--space-3);
            padding-top: var(--space-2);
            color: var(--gold);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        }

        /* ======================================================
           BLOCKQUOTE
        ====================================================== */
        blockquote, .scene-blockquote {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.6;
            padding: var(--space-6);
            margin: var(--space-5) 0;
            border-left: 3px solid var(--gold-dark);
            background: rgba(201, 160, 50, 0.06);
            color: var(--text-secondary);
        }

        blockquote cite, .scene-blockquote cite {
            display: block;
            font-family: var(--font-body);
            font-size: 0.8125rem;
            font-style: normal;
            letter-spacing: 0.1em;
            margin-top: var(--space-4);
            color: var(--text-muted);
        }

        /* ======================================================
           HISTORICAL CARD (INLINE)
        ====================================================== */
        .historical-card {
            background: linear-gradient(145deg, rgba(15, 34, 64, 0.5) 0%, rgba(10, 22, 41, 0.7) 100%);
            border: 1px solid rgba(201, 160, 50, 0.3);
            padding: var(--space-5);
            margin: var(--space-5) 0;
            position: relative;
            box-shadow: var(--shadow-glow);
        }

        .historical-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--turquoise-dark), var(--gold));
        }

        .historical-card .card-label {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--turquoise-light);
            margin-bottom: var(--space-2);
            text-transform: uppercase;
        }

        .historical-card .card-title {
            font-family: var(--font-heading);
            font-size: 1.125rem;
            color: var(--gold-light);
            margin-bottom: var(--space-3);
        }

        .historical-card .card-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* ======================================================
           DISCOVERY TOAST
        ====================================================== */
        .discovery-found {
            display: inline-block;
            background: rgba(201, 160, 50, 0.12);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 6px 16px 6px 28px;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-top: var(--space-5);
            position: relative;
            animation: discoverySlideIn 0.6s ease-out;
        }

        .discovery-found::before {
            content: '';
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            width: 8px; height: 8px;
            background: var(--gold);
            border-radius: 50%;
        }

        @keyframes discoverySlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ======================================================
           CHOICES
        ====================================================== */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: var(--space-5);
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }

        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-btn {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-6);
            font-family: var(--font-heading);
            font-size: 0.9375rem;
            letter-spacing: 0.08em;
            border: 1px solid var(--gold-dark);
            background: transparent;
            color: var(--papyrus-light);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            text-align: left;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--lapis);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .choice-btn:hover {
            border-color: var(--gold);
            color: var(--gold-light);
            box-shadow: var(--shadow-glow);
        }

        .choice-btn:hover::before { left: 0; }

        .choice-btn .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px; height: 24px;
            border: 1px solid var(--gold-dark);
            font-size: 0.7rem;
            color: var(--gold-dark);
            margin-right: var(--space-4);
            flex-shrink: 0;
        }

        .choice-btn:hover .choice-key {
            border-color: var(--gold);
            color: var(--gold-light);
        }

        .choice-btn.btn-french {
            border-color: var(--turquoise-dark);
        }

        .choice-btn.btn-french::before {
            background: rgba(30, 112, 112, 0.4);
        }

        .choice-btn.btn-french:hover {
            border-color: var(--turquoise-light);
        }

        .choice-btn.btn-british {
            border-color: var(--carnelian);
        }

        .choice-btn.btn-british::before {
            background: rgba(180, 72, 56, 0.3);
        }

        .choice-btn.btn-british:hover {
            border-color: var(--terracotta);
        }

        .choice-btn.btn-scholar {
            border-color: var(--nile-green);
        }

        .choice-btn.btn-scholar::before {
            background: rgba(46, 107, 79, 0.3);
        }

        .choice-btn.btn-scholar:hover {
            border-color: var(--nile-green);
        }

        /* ======================================================
           TRANSITION
        ====================================================== */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            background: var(--lapis-deep);
        }

        .transition-overlay.active {
            pointer-events: all;
            animation: pageTransition 1s ease-in-out;
        }

        @keyframes pageTransition {
            0% { opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ======================================================
           SCENE FADE IN
        ====================================================== */
        .scene-content {
            animation: sceneFadeIn 0.8s ease-out;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ======================================================
           DISCOVERY TRACKER (SIDEBAR)
        ====================================================== */
        .discovery-tracker {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            max-width: 260px;
        }

        .discovery-tracker-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: 1px solid rgba(201, 160, 50, 0.4);
            color: var(--gold);
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: auto;
        }

        .discovery-tracker-toggle:hover {
            border-color: var(--gold);
            box-shadow: var(--shadow-glow);
        }

        .discovery-tracker-panel {
            display: none;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid rgba(201, 160, 50, 0.4);
            padding: var(--space-5);
            max-height: 60vh;
            overflow-y: auto;
        }

        .discovery-tracker-panel.open {
            display: block;
            animation: panelSlideIn 0.3s ease-out;
        }

        @keyframes panelSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .discovery-tracker-panel h4 {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--gold-dark);
            margin-bottom: var(--space-4);
            text-transform: uppercase;
        }

        .discovery-item {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: var(--gold-light);
            padding: 6px 0;
            border-bottom: 1px solid rgba(201, 160, 50, 0.15);
            animation: discoverySlideIn 0.4s ease-out;
            line-height: 1.5;
        }

        .discovery-item:last-child { border-bottom: none; }

        .no-discoveries {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ======================================================
           GAME CONTROLS
        ====================================================== */
        .game-controls {
            display: flex;
            gap: 0.75rem;
            margin-top: var(--space-6);
            padding-top: var(--space-5);

            <h1>The Rosetta Stone</h1>

    <script>
    // ================================================================
    //  THE ROSETTA STONE -- Story Data
    // ================================================================

    const STORY = {

        // -------------------------------------------------------
        // SCENE 1: THE DISCOVERY
        // -------------------------------------------------------
        intro: {
            type: 'scroll',
            era: 'NAPOLEON\'S CAMPAIGN',
            year: '1799',
            text: [
                '<p class="dropcap">The Egyptian sun is merciless. You stand among the rubble of Fort Julien near the port town of Rashid&mdash;known to Europeans as Rosetta&mdash;watching French soldiers reinforce the Mamluk-era fortifications. Napoleon Bonaparte\'s <em>Arm&eacute;e d\'Orient</em> has occupied Egypt since July 1798, bringing with it not only 38,000 troops but 167 scientists, engineers, and scholars in the <strong>Commission des Sciences et des Arts</strong>.</p>',
                '<p>It is <strong>July 15, 1799</strong>. A soldier named Pierre-Fran&ccedil;ois Bouchard, a captain of engineers, calls out from a demolished wall. He has found a slab of dark granodiorite, 114 centimeters tall, 72 centimeters wide, and 28 centimeters thick, weighing approximately <strong>760 kilograms</strong>. Its polished face bears three distinct bands of text.</p>',
                '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Rosetta_Stone.JPG/800px-Rosetta_Stone.JPG" alt="The Rosetta Stone, a dark granodiorite slab inscribed with three scripts, displayed at the British Museum" style="max-width: 100%; height: auto; border-radius: 4px; opacity: 0.9; margin: var(--space-5) 0;">',
                '<div class="historical-card"><div class="card-label">Historical Artifact</div><div class="card-title">The Rosetta Stone (196 BC)</div><div class="card-text">The stone is a decree issued at Memphis on <strong>March 27, 196 BC</strong>, during the reign of Ptolemy V Epiphanes. It records the same text in three scripts: <strong>14 lines of hieroglyphic</strong> (the sacred script of the priests), <strong>32 lines of demotic</strong> (the everyday script of literate Egyptians), and <strong>54 lines of ancient Greek</strong> (the language of the Ptolemaic administration). The Greek section was immediately readable&mdash;it was the key to everything.</div></div>',
                '<p>You are one of Napoleon\'s <em>savants</em>&mdash;the scholars tasked with cataloguing Egypt\'s antiquities. Bouchard recognizes the significance immediately and reports to General Jacques-Fran&ccedil;ois Menou. The stone is transported to Cairo for study. But the question is: what role will you play?</p>'
            ],
            fact: 'The Rosetta Stone was found on July 15, 1799 by Captain Pierre-Francois Bouchard at Fort Julien near Rashid (Rosetta), Egypt.',
            choices: [
                { text: 'Join the French scholarly effort in Cairo', next: 'french_path', style: 'btn-french' },
                { text: 'Follow the British intelligence reports from Alexandria', next: 'british_path', style: 'btn-british' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 2a: THE FRENCH PERSPECTIVE
        // -------------------------------------------------------
        french_path: {
            type: 'cartouche',
            era: 'THE INSTITUT D\'EGYPTE',
            year: '1799-1801',
            cardTitle: 'The Savants of Cairo',
            text: [
                '<p>In Cairo, the <strong>Institut d\'&Eacute;gypte</strong>&mdash;founded by Napoleon on <strong>August 22, 1798</strong>&mdash;buzzes with scholarly activity. The stone has been brought to the Institute, and multiple copies are being made. The mathematician and linguist <strong>Jean-Joseph Marcel</strong> is the first to attempt readings, using ink impressions to reproduce the texts.</p>',
                '<p>You examine the stone alongside fellow savants. The Greek portion is translated quickly&mdash;it is a priestly decree honoring Ptolemy V for tax exemptions and temple endowments. But the hieroglyphic and demotic sections resist all attempts at reading.</p>',
                '<img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/RosettaStoneDetail.jpg" alt="Detail of the Rosetta Stone showing hieroglyphic and demotic script bands" style="max-width: 100%; height: auto; border-radius: 4px; opacity: 0.9; margin: var(--space-5) 0;">',
                '<div class="historical-card"><div class="card-label">The Three Scripts</div><div class="card-title">Hieroglyphic, Demotic, and Greek</div><div class="card-text"><strong>Hieroglyphics</strong> had been unreadable since the 4th century AD, when the last known inscription was carved at the Temple of Isis at Philae in <strong>394 AD</strong>. <strong>Demotic</strong> was a cursive script derived from hieratic, itself a shorthand of hieroglyphics, used from about 650 BC. The <strong>ancient Greek</strong> of the Ptolemaic dynasty was well known to European scholars.</div></div>',
                '<p>But France\'s grip on Egypt is weakening. The British Royal Navy, under Admiral Nelson, destroyed the French fleet at the <strong>Battle of the Nile on August 1, 1798</strong>. Napoleon himself has already fled back to France in August 1799, leaving his army stranded. The stone\'s future is uncertain.</p>'
            ],
            fact: 'The last known hieroglyphic inscription was carved at the Temple of Isis at Philae in 394 AD, after which the script was lost for over 1,400 years.',
            choices: [
                { text: 'Focus on making copies before the British arrive', next: 'copies', style: 'btn-french' },
                { text: 'Study the demotic script for phonetic clues', next: 'demotic_study', style: 'btn-scholar' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 2b: THE BRITISH PERSPECTIVE
        // -------------------------------------------------------
        british_path: {
            type: 'tablet',
            era: 'THE TREATY OF ALEXANDRIA',
            year: '1801',
            text: [
                '<p class="dropcap">The French surrender in Egypt comes on <strong>September 2, 1801</strong>, after a combined British-Ottoman force besieges Cairo and Alexandria. Under Article XVI of the <strong>Treaty (Capitulation) of Alexandria</strong>, all antiquities collected by the French savants are to be surrendered to the British Crown.</p>',
                '<p>General Menou initially hides the Rosetta Stone in his personal luggage, claiming it as private property. But the British commander, General John Hely-Hutchinson, is adamant. Colonel Tomkyns Hilgrove Turner of the Royal Artillery is dispatched to secure the stone personally.</p>',
                '<div class="historical-card"><div class="card-label">Historical Event</div><div class="card-title">The Surrender of Antiquities (1801)</div><div class="card-text">The French savants protested bitterly. The naturalist <strong>&Eacute;tienne Geoffroy Saint-Hilaire</strong> reportedly threatened to burn all his notes and collections rather than surrender them, comparing the seizure to the destruction of the Library of Alexandria. The British relented on the scholarly notes and drawings but insisted on the physical artifacts. The Rosetta Stone, along with other major pieces, was shipped to Portsmouth in February 1802.</div></div>',
                '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/The_Battle_of_the_Nile%2C_1_August_1798_RMG_BHC0513.tiff/lossy-page1-800px-The_Battle_of_the_Nile%2C_1_August_1798_RMG_BHC0513.tiff.jpg" alt="The Capitulation of Alexandria in 1801, when British forces secured the surrender of French troops in Egypt" style="max-width: 100%; height: auto; border-radius: 4px; opacity: 0.9; margin: var(--space-5) 0;">',
                '<p>You watch as the great slab is loaded onto HMS <em>L\'Egyptienne</em>&mdash;a captured French frigate, adding insult to injury. The stone arrives in England and is deposited at the <strong>Society of Antiquaries of London</strong> before its transfer to the <strong>British Museum in 1802</strong>, where it has remained ever since.</p>',
                '<p>But the French savants kept their copies. And copies, it turns out, are all that is needed to unlock an entire civilization.</p>'
            ],
            fact: 'The Rosetta Stone was surrendered to the British under Article XVI of the 1801 Treaty of Alexandria and has been in the British Museum since 1802.',
            choices: [
                { text: 'Follow the stone to the British Museum', next: 'british_scholars', style: 'btn-british' },
                { text: 'Track the French copies back to Paris', next: 'copies', style: 'btn-french' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 3a: THE COPIES
        // -------------------------------------------------------
        copies: {
            type: 'scroll',
            era: 'THE RACE BEGINS',
            year: '1802',
            text: [
                '<p class="dropcap">Before the stone left Egypt, French scholars had made several copies using different techniques. The most important were <strong>ink rubbings</strong> (estampages) and <strong>plaster casts</strong>. These reproductions were sent to scholars across Europe, turning the Rosetta Stone into the most widely studied artifact in history&mdash;even though most researchers never saw the original.</p>',
                '<p>In Paris, copies reach the <strong>Abb&eacute; Silvestre de Sacy</strong>, one of Europe\'s foremost Orientalists and a professor at the &Eacute;cole Sp&eacute;ciale des Langues Orientales. De Sacy had already deciphered Pahlavi (Middle Persian) inscriptions. He focuses on the demotic section, reasoning that its cursive nature might reveal phonetic patterns more easily than the hieroglyphics.</p>',
                '<div class="historical-card"><div class="card-label">Scholarly Approach</div><div class="card-title">De Sacy\'s Method (1802)</div><div class="card-text">Silvestre de Sacy made the crucial early observation that certain clusters of demotic characters appeared in positions corresponding to proper names in the Greek text&mdash;specifically <strong>"Ptolemy"</strong> and <strong>"Alexander."</strong> However, he could not determine whether these characters were alphabetic, syllabic, or ideographic. He abandoned his attempts by 1802, declaring the task "scientifically impossible."</div></div>',
                '<p>De Sacy passes his copies to his Swedish student, <strong>Johan David &Aring;kerblad</strong>, who makes further progress. &Aring;kerblad correctly identifies all the proper names in the demotic text and builds a partial demotic alphabet of 29 characters. But he makes a fatal assumption: he believes demotic is entirely phonetic. It is not.</p>'
            ],
            fact: 'Akerblad correctly identified proper names in demotic and built a 29-character alphabet, but wrongly assumed the entire script was phonetic.',
            choices: [
                { text: 'Follow Thomas Young\'s work in London', next: 'british_scholars', style: 'btn-british' },
                { text: 'Jump ahead to Champollion\'s breakthrough', next: 'champollion_enters', style: 'btn-scholar' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 3b: BRITISH SCHOLARS
        // -------------------------------------------------------
        british_scholars: {
            type: 'cartouche',
            era: 'THE POLYMATH\'S ATTEMPT',
            year: '1814-1818',
            cardTitle: 'Thomas Young and the Encyclopaedia Britannica',
            text: [
                '<p>In London, the stone sits in the British Museum, attracting crowds and scholars alike. Painted white to make the inscriptions more legible, it becomes the Museum\'s most famous object. Among those who study it is <strong>Thomas Young</strong>&mdash;physician, physicist, and polymath, the man who proved the wave nature of light.</p>',
                '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Thomas_Young_%28scientist%29.jpg/800px-Thomas_Young_%28scientist%29.jpg" alt="Portrait of Thomas Young, English polymath who made early breakthroughs in deciphering the Rosetta Stone" style="max-width: 100%; height: auto; border-radius: 4px; opacity: 0.9; margin: var(--space-5) 0;">',
                '<p>Young approaches the stone with the systematic rigor of a natural philosopher. Between 1814 and 1818, he makes several breakthroughs. He correctly identifies that the <strong>cartouche</strong>&mdash;the oval ring enclosing certain hieroglyphs&mdash;contains the name <strong>Ptolemy (Ptolemaios)</strong>. He matches six of the hieroglyphs to their correct phonetic values.</p>',
                '<div class="historical-card"><div class="card-label">Key Breakthrough</div><div class="card-title">Young\'s Cartouche Discovery (1814)</div><div class="card-text">Thomas Young identified <strong>86 parallels</strong> between the Greek and demotic texts. He proved that demotic was not a wholly separate script but was derived from hieroglyphic. Most critically, he showed that the cartouches contained <strong>phonetic spellings</strong> of royal names&mdash;not symbolic pictures. He published his findings in the <em>Supplement to the Encyclopaedia Britannica</em> in 1819, correctly assigning sound values to the signs P, T, O, L, M, and S in Ptolemy\'s name.</div></div>',
                '<p>Yet Young makes a critical error: he believes that only foreign names (like Greek Ptolemy) were written phonetically. He assumes that <strong>native Egyptian words</strong> were still written as pure ideograms&mdash;pictures representing ideas, not sounds. This assumption will block him from the full decipherment.</p>'
            ],
            fact: 'Thomas Young correctly identified 6 phonetic hieroglyphs in the cartouche of Ptolemy and showed that demotic derived from hieroglyphic, but wrongly believed only foreign names used phonetics.',
            choices: [
                { text: 'Examine the rivalry between Young and Champollion', next: 'rivalry', style: '' },
                { text: 'Follow Champollion\'s linguistic preparation', next: 'champollion_enters', style: 'btn-scholar' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 4: CHAMPOLLION ENTERS
        // -------------------------------------------------------
        champollion_enters: {
            type: 'scroll',
            era: 'THE LINGUIST\'S APPRENTICESHIP',
            year: '1807-1821',
            text: [
                '<p class="dropcap">Jean-Fran&ccedil;ois Champollion is unlike any other scholar in the race. Born on <strong>December 23, 1790</strong>, in Figeac, France, he was a linguistic prodigy. At age <strong>13</strong>, he began studying Arabic, Syriac, Chaldean, and Coptic. At <strong>16</strong>, he presented a paper arguing that <strong>Coptic</strong>&mdash;the language still used in Egyptian Christian liturgy&mdash;was the final form of the ancient Egyptian language.</p>',
                '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Leon_Cogniet_-_Jean-Francois_Champollion.jpg/800px-Leon_Cogniet_-_Jean-Francois_Champollion.jpg" alt="Portrait of Jean-Francois Champollion by Leon Cogniet, circa 1831" style="max-width: 100%; height: auto; border-radius: 4px; opacity: 0.9; margin: var(--space-5) 0;">',
                '<p>This insight is his secret weapon. While other scholars treat hieroglyphics as a purely visual puzzle, Champollion understands that the <em>language</em> behind the symbols is the key. He spends years mastering Coptic, studying under the monk <strong>Dom Rapha&euml;l de Monachis</strong>, an Egyptian Copt who taught at the Institut de France.</p>',
                '<div class="historical-card"><div class="card-label">Linguistic Insight</div><div class="card-title">Coptic: The Living Echo of Ancient Egypt</div><div class="card-text"><strong>Coptic</strong> is the final stage of the Egyptian language, written in a modified Greek alphabet with 7 extra characters from demotic. It preserves the <strong>grammar and vocabulary</strong> of the language spoken by the pharaohs, though its script is alphabetic. Champollion realized that if hieroglyphics encoded this same language, then knowing Coptic would let him read the sounds <em>and</em> meanings of the ancient signs. No other rival had this advantage.</div></div>',
                '<p>By 1821, Champollion has produced the first systematic comparison of hieratic (priestly shorthand) with both hieroglyphic and demotic, proving the three scripts are variations of one system. He is closing in. But he needs more cartouches&mdash;more names with known Greek equivalents&mdash;to build a complete phonetic alphabet.</p>'
            ],
            fact: 'Champollion recognized that Coptic was the descendant of the ancient Egyptian language, giving him a unique advantage over all other scholars.',
            choices: [
                { text: 'Follow the rivalry with Thomas Young', next: 'rivalry', style: '' },
                { text: 'Jump to the moment of breakthrough', next: 'breakthrough', style: 'btn-scholar' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 5: THE RIVALRY
        // -------------------------------------------------------
        rivalry: {
            type: 'tablet',
            era: 'SCHOLARS AT WAR',
            year: '1819-1822',
            text: [
                '<p class="dropcap">The competition between Thomas Young and Jean-Fran&ccedil;ois Champollion is one of the great intellectual rivalries in history. Young is older, wealthier, and better connected in the scientific establishment. Champollion is younger, politically suspect (he supported Napoleon during the Hundred Days), and frequently impoverished.</p>',
                '<p>Young publishes first, in 1819, claiming priority for identifying phonetic hieroglyphs. He shares his findings with Champollion through intermediaries, including Silvestre de Sacy, who&mdash;harboring his own resentments&mdash;tells Young that Champollion has been secretly using his work without attribution.</p>',
                '<div class="historical-card"><div class="card-label">Scholarly Politics</div><div class="card-title">De Sacy\'s Letter to Young (1815)</div><div class="card-text">In a letter dated <strong>July 20, 1815</strong>, de Sacy warned Young that Champollion might plagiarize his work: "I am not sure that Champollion will not claim to have made the discovery before you." De Sacy had been Champollion\'s own teacher, but the two had fallen out. This letter poisoned the relationship between Young and Champollion for years, though modern historians believe Champollion\'s work was largely independent.</div></div>',
                '<p>The truth is more complex. Young identified the phonetic principle in cartouches but could not extend it beyond foreign names. Champollion is working on a far more ambitious theory: that hieroglyphics are a <strong>mixed system</strong>&mdash;part phonetic, part ideographic, part determinative. If he is right, it will unlock not just names but every word ever written in hieroglyphics.</p>',
                '<p>The critical test will come from a new source: the <strong>Bankes obelisk</strong> from Philae, which carries a cartouche believed to contain the name <strong>Cleopatra</strong>.</p>'
            ],
            fact: 'De Sacy warned Young in an 1815 letter that Champollion might claim his discoveries, poisoning relations between the two scholars for years.',
            choices: [
                { text: 'Follow the Cleopatra cartouche test', next: 'cleopatra', style: 'btn-scholar' },
                { text: 'Investigate the political intrigues behind the scenes', next: 'politics', style: '' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 6: THE CLEOPATRA TEST
        // -------------------------------------------------------
        cleopatra: {
            type: 'scroll',
            era: 'THE PHONETIC KEY',
            year: '1822',
            text: [
                '<p class="dropcap">The <strong>Bankes obelisk</strong>, discovered by Giovanni Belzoni at Philae in 1815 and transported to England by William John Bankes, carries a bilingual inscription: Greek at the base and hieroglyphics on the shaft. The Greek mentions <strong>Cleopatra</strong>, and a cartouche on the obelisk presumably spells her name.</p>',
                '<p>This is the perfect test. If the cartouche system is phonetic, then the signs in "Cleopatra" should share common letters with "Ptolemy." In Greek: <strong>PTOLEMAIOS</strong> and <strong>KLEOPATRA</strong>. They share the letters P, T, O, L, and A.</p>',
                '<div class="script-sample">&#x1330C; &#x13193; &#x13171; &#x1337A; &#x131CB; &#x13000;</div>',
                '<div class="historical-card"><div class="card-label">The Decipherment Test</div><div class="card-title">Cross-Referencing Ptolemy and Cleopatra</div><div class="card-text">Champollion matched the signs: the <strong>P</strong> in position 1 of PTOLEMAIOS appeared in position 5 of KLEOPATRA. The <strong>T</strong> in position 2 of PTOLEMAIOS appeared in position 4. The <strong>L</strong> in position 4 appeared in position 2. The <strong>O</strong> in position 3 appeared in position 3. Each cross-reference confirmed the phonetic values. By comparing these two cartouches alone, Champollion identified <strong>12 phonetic signs</strong>.</div></div>',
                '<p>But Champollion goes further. He applies these phonetic values to other cartouches from temples and tombs across Egypt. He identifies <strong>Alexander (Alexandros)</strong>, <strong>Berenice</strong>, <strong>Tiberius</strong>, and <strong>Domitian</strong>. The alphabet grows with each new name.</p>',
                '<p>Still, a crucial question remains: do these phonetic signs only spell <em>foreign</em> names, as Young believes? Or do they work for native Egyptian words too?</p>'
            ],
            fact: 'By cross-referencing the cartouches of Ptolemy and Cleopatra, Champollion identified 12 phonetic hieroglyphic signs through shared letters.',
            choices: [
                { text: 'Follow the September 14, 1822 breakthrough', next: 'breakthrough', style: 'btn-scholar' },
                { text: 'Explore the political dimension first', next: 'politics', style: '' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 7: POLITICAL INTRIGUE
        // -------------------------------------------------------
        politics: {
            type: 'cartouche',
            era: 'EMPIRES AND ANTIQUITIES',
            year: '1800-1822',
            cardTitle: 'The Politics of Ancient Knowledge',
            text: [
                '<p>The Rosetta Stone is not merely an artifact&mdash;it is a trophy of imperial warfare. Napoleon\'s invasion of Egypt was as much about undermining British trade routes to India as it was about "enlightening" the East. The seizure of the stone by British forces was an act of cultural conquest wrapped in the language of scholarship.</p>',
                '<p>In London, the stone is painted white, its inscriptions traced in chalk, and placed on public display as proof of British victory. In Paris, French scholars insist that their <em>copies</em> and <em>scholarship</em> matter more than physical possession. The argument has never been settled.</p>',
                '<div class="historical-card"><div class="card-label">Colonial Context</div><div class="card-title">The Description de l\'&Eacute;gypte (1809-1828)</div><div class="card-text">Napoleon\'s scholars produced the <em>Description de l\'&Eacute;gypte</em>, a monumental 23-volume survey published between 1809 and 1828. It contained <strong>837 copperplate engravings</strong> documenting every aspect of Egyptian antiquity, natural history, and modern life. It sparked "Egyptomania" across Europe, driving demand for Egyptian artifacts and fueling the plunder of temples and tombs for decades.</div></div>',
                '<p>Egypt itself has no voice in this debate. Under Ottoman suzerainty, then under the ambitious <strong>Muhammad Ali Pasha</strong> (who seized power in 1805), Egyptian antiquities are given away as diplomatic gifts or sold to European collectors. The Egyptians themselves cannot read their own ancient script&mdash;a language silenced for over a millennium.</p>',
                '<p>Champollion, for all his genius, is aware of this irony. He writes to his brother Jacques-Joseph: "I wish to give back to Egypt the ability to read its own history."</p>'
            ],
            fact: 'The Description de l\'Egypte, published 1809-1828 in 23 volumes with 837 engravings, sparked Egyptomania across Europe but also accelerated the plunder of Egyptian antiquities.',
            choices: [
                { text: 'Return to the scholarly race', next: 'cleopatra', style: 'btn-scholar' },
                { text: 'Follow the story to its climax', next: 'breakthrough', style: 'btn-scholar' },
                { text: 'Pursue the alternative political ending', next: 'ending_politics', style: '' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 8: THE BREAKTHROUGH
        // -------------------------------------------------------
        breakthrough: {

    // ================================================================
    //  STORY ENGINE
    // ================================================================

    const engine = {
        currentScene: null,
        history: [],
        discoveries: [],
        discoveryPanelOpen: false,

        init() {
            document.getElementById('startBtn').addEventListener('click', () => this.start());
            document.getElementById('restartBtn').addEventListener('click', () => this.restart());
            document.getElementById('discoveryToggle').addEventListener('click', () => this.toggleDiscoveries());

            // Keyboard navigation (1-9 for choices)
            document.addEventListener('keydown', (e) => {
                const num = parseInt(e.key);
                if (num >= 1 && num <= 9) {
                    const btns = document.querySelectorAll('.choice-btn');
                    if (btns[num - 1]) btns[num - 1].click();
                }
            });
        },

        start() {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('sceneWrapper').classList.add('active');
            document.getElementById('discoveryTracker').style.display = 'block';
            this.goTo('intro');
        },

        restart() {
            this.currentScene = null;
            this.history = [];
            this.discoveries = [];
            this.discoveryPanelOpen = false;
            document.getElementById('titleScreen').style.display = '';
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('discoveryTracker').style.display = 'none';
            this.updateDiscoveryUI();
            window.scrollTo(0, 0);
        },

        goTo(sceneId) {
            if (sceneId === '_restart') {
                this.restart();
                return;
            }
            if (sceneId === '_exit') {
                window.location.href = '../index.html';
                return;
            }

            const scene = STORY[sceneId];
            if (!scene) return;

            // Transition effect
            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 400);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1000);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
        },

        renderScene(sceneId, scene) {
            const container = document.getElementById('sceneContent');
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = sceneId.startsWith('ending') ? 'none' : '';

            // Update header
            if (scene.era) {
                document.getElementById('sceneEra').textContent = scene.era;
            }
            if (scene.year) {
                document.getElementById('sceneYear').textContent = scene.year;
            }
            document.getElementById('sceneDiscoveries').textContent = this.discoveries.length + ' discoveries';

            let html = '<div class="scene-content">';

            // Build scene based on type
            switch (scene.type) {
                case 'scroll':
                    html += this.renderScroll(scene);
                    break;
                case 'tablet':
                    html += this.renderTablet(scene);
                    break;
                case 'cartouche':
                    html += this.renderCartouche(scene);
                    break;
                case 'ending':
                    html += this.renderEnding(scene);
                    break;
            }

            // Discovery notification
            if (scene.fact) {
                this.addDiscovery(scene.fact);
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    const styleClass = choice.style ? ' ' + choice.style : '';
                    html += '<button class="choice-btn' + styleClass + '" onclick="engine.goTo(\'' + choice.next + '\')">';
                    html += '<span class="choice-key">' + (i + 1) + '</span>';
                    html += choice.text;
                    html += '</button>';
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;
            this.updateDiscoveryUI();
        },

        renderScroll(scene) {
            let html = '<div class="scene-scroll"><div class="scene-text">';
            scene.text.forEach(p => { html += p; });
            html += '</div></div>';
            return html;
        },

        renderTablet(scene) {
            let html = '<div class="scene-tablet"><div class="scene-text">';
            scene.text.forEach(p => { html += p; });
            html += '</div></div>';
            return html;
        },

        renderCartouche(scene) {
            let html = '<div class="scene-cartouche">';
            if (scene.cardTitle) html += '<div class="card-title">' + scene.cardTitle + '</div>';
            html += '<div class="scene-text">';
            scene.text.forEach(p => { html += p; });
            html += '</div></div>';
            return html;
        },

        renderEnding(scene) {
            let html = '<div class="scene-ending">';
            html += '<div class="ending-label">The Decipherment Concludes</div>';
            html += '<div class="ending-title">' + scene.endingTitle + '</div>';
            html += '<div class="ornate-divider"><span>&#x2BC1; &#x25CA; &#x2BC1;</span></div>';
            html += '<div class="scene-text">';
            scene.text.forEach(p => { html += p; });
            html += '</div>';
            html += '<div class="the-end">The End</div>';
            html += '</div>';
            return html;
        },

        addDiscovery(fact) {
            if (!this.discoveries.includes(fact)) {
                this.discoveries.push(fact);
            }
        },

        updateDiscoveryUI() {
            const count = this.discoveries.length;
            document.getElementById('discoveryCount').textContent = count;
            document.getElementById('sceneDiscoveries').textContent = count + ' discoveries';

            const list = document.getElementById('discoveryList');
            if (count === 0) {
                list.innerHTML = '<p class="no-discoveries">No discoveries yet...</p>';
            } else {
                list.innerHTML = this.discoveries.map(d => '<div class="discovery-item">' + d + '</div>').join('');
            }
        },

        toggleDiscoveries() {
            this.discoveryPanelOpen = !this.discoveryPanelOpen;
            document.getElementById('discoveryPanel').classList.toggle('open', this.discoveryPanelOpen);
        }
    };

    // Boot
    engine.init();
    </script>
