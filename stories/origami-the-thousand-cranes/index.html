<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive educational story: The Thousand Cranes — An Origami Interactive Story. Paper Comes East. A visual, narrated learning experience from GG Prom...">
    <title>The Thousand Cranes &mdash; An Origami Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-serif: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
            --font-sans: 'Inter', 'Zen Kaku Gothic New', sans-serif;

            --paper-white: #faf9f6;
            --paper-cream: #f5f0e8;
            --paper-warm: #efe9dd;
            --fold-shadow: #d8d0c4;
            --fold-line: #c9bfb0;
            --crease-dark: #b3a898;
            --text-primary: #2c2420;
            --text-secondary: #4a433c;
            --text-muted: #7a7168;
            --ink-black: #1a1614;
            --japanese-red: #c23b22;
            --japanese-red-light: #d94f3a;
            --japanese-red-muted: rgba(194, 59, 34, 0.12);
            --peace-gold: #c4a35a;
            --peace-gold-light: #ddc07a;
            --bamboo-green: #6b7f5e;
            --sky-blue: #7a9cba;
            --sadako-pink: #d4a0a0;

            --shadow-fold: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            --shadow-lifted: 0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);

            --transition-fold: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: var(--font-serif);
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-primary);
            background: var(--paper-white);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Paper texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.035;
            pointer-events: none;
            z-index: 1000;
        }

        /* Fold line accents */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg,
                transparent 0%,
                var(--fold-line) 15%,
                var(--fold-line) 85%,
                transparent 100%
            );
            opacity: 0.25;
            pointer-events: none;
            z-index: 999;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-serif);
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: 0.02em;
        }

        p { margin-bottom: 1rem; max-width: 60ch; }

        .lead {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .small { font-size: 0.875rem; }
        .text-center { text-align: center; }

        /* =========================================
           ORIGAMI CRANE SVG (CSS-only)
        ========================================= */
        .crane-icon {
            display: inline-block;
            width: 32px;
            height: 32px;
            position: relative;
        }

        .crane-icon::before {
            content: '\9DB4';
            font-size: 1.5rem;
            color: var(--japanese-red);
            opacity: 0.8;
        }

        /* =========================================
           LAYOUT
        ========================================= */
        .game-container {
            max-width: 780px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .game-container { padding: 1.25rem; }
        }

        /* =========================================
           PAPER CARD COMPONENT
        ========================================= */
        .paper-card {
            background: var(--paper-cream);
            padding: 1.5rem 1.75rem;
            margin: 1.25rem 0;
            position: relative;
            box-shadow: var(--shadow-fold);
            border: none;
        }

        /* Fold line at top */
        .paper-card::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--fold-shadow), transparent);
        }

        /* Corner fold */
        .paper-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 24px; height: 24px;
            background: linear-gradient(225deg, var(--paper-white) 50%, var(--fold-shadow) 50%, var(--paper-warm) 52%);
        }

        .paper-card h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .paper-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .paper-card.red-accent {
            border-left: 3px solid var(--japanese-red);
        }

        .paper-card.red-accent::before {
            background: linear-gradient(90deg, var(--japanese-red-muted), transparent);
        }

        /* =========================================
           FOLD REVEAL (interactive element)
        ========================================= */
        .fold-reveal {
            background: var(--paper-warm);
            padding: 1rem 1.25rem;
            margin: 1rem 0;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition-fold);
            box-shadow: var(--shadow-fold);
        }

        .fold-reveal::before {
            content: '[ unfold to read ]';
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
        }

        .fold-reveal .fold-content {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fold-reveal.unfolded::before {
            opacity: 0;
        }

        .fold-reveal.unfolded .fold-content {
            opacity: 1;
            max-height: 600px;
        }

        .fold-reveal:hover {
            box-shadow: var(--shadow-lifted);
        }

        /* Diagonal fold line */
        .fold-reveal::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            background: linear-gradient(225deg, var(--paper-white) 48%, var(--fold-line) 49%, var(--fold-line) 51%, var(--paper-warm) 52%);
            transition: var(--transition-fold);
        }

        .fold-reveal.unfolded::after {
            width: 0; height: 0;
        }

        /* =========================================
           CRANE COUNTER
        ========================================= */
        .crane-counter {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: var(--paper-cream);
            padding: 0.5rem 1rem;
            box-shadow: var(--shadow-fold);
            z-index: 100;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: var(--transition-base);
        }

        .crane-counter.active { display: flex; }

        .crane-counter .crane-count {
            font-weight: 600;
            color: var(--japanese-red);
            font-size: 1rem;
            min-width: 2ch;
            text-align: right;
        }

        .crane-counter .crane-label {
            letter-spacing: 0.05em;
        }

        .crane-counter .crane-goal {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .crane-counter.pulse {
            animation: crane-pulse 0.6s ease;
        }

        @keyframes crane-pulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.08); box-shadow: var(--shadow-lifted); }
            100% { transform: scale(1); }
        }

        /* =========================================
           QUOTE BLOCK
        ========================================= */
        .quote-block {
            margin: 1.5rem 0;
            padding: 1.25rem 1.5rem;
            position: relative;
            background: var(--paper-cream);
        }

        .quote-block::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--japanese-red);
            opacity: 0.6;
        }

        .quote-text {
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .quote-source {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* =========================================
           FOLD ANIMATION (CSS origami fold)
        ========================================= */
        .fold-animation {
            width: 120px;
            height: 120px;
            margin: 1.5rem auto;
            perspective: 600px;
            position: relative;
        }

        .fold-paper {
            width: 100%;
            height: 100%;
            background: var(--paper-cream);
            border: 1px solid var(--fold-line);
            position: relative;
            transform-style: preserve-3d;
            animation: paper-fold 4s ease-in-out infinite;
        }

        .fold-paper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent 49%, var(--fold-shadow) 49.5%, var(--fold-shadow) 50.5%, transparent 51%);
            animation: crease-appear 4s ease-in-out infinite;
        }

        @keyframes paper-fold {
            0%, 100% { transform: rotateY(0deg); }
            25% { transform: rotateY(-15deg) rotateX(5deg); }
            50% { transform: rotateY(0deg) rotateX(-10deg); }
            75% { transform: rotateY(10deg) rotateX(5deg); }
        }

        @keyframes crease-appear {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* =========================================
           TITLE SCREEN
        ========================================= */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
            position: relative;
        }

        /* Decorative folded corners on title */
        .title-screen::before {
            content: '';
            position: absolute;
            top: 2rem; left: 2rem;
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--paper-white) 48%, var(--fold-shadow) 49%, var(--fold-shadow) 51%, var(--paper-cream) 52%);
            opacity: 0.6;
        }

        .title-screen::after {
            content: '';
            position: absolute;
            bottom: 2rem; right: 2rem;
            width: 60px; height: 60px;
            background: linear-gradient(315deg, var(--paper-white) 48%, var(--fold-shadow) 49%, var(--fold-shadow) 51%, var(--paper-cream) 52%);
            opacity: 0.6;
        }

        .title-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.75rem;
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: var(--paper-warm);
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .title-screen h1 {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .title-jp {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .title-subtitle {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 420px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .back-to-stories {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s;
            margin-bottom: 2rem;
        }

        .back-to-stories::before { content: '\2190  '; }
        .back-to-stories:hover { color: var(--japanese-red); }

        .start-btn {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: var(--ink-black);
            color: var(--paper-white);
            border: none;
            padding: 0.9rem 2.5rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .start-btn:hover {
            background: var(--japanese-red);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lifted);
        }

        /* Tiny crane decorations around start button */
        .start-btn::before {
            content: '\25C6';
            position: absolute;
            left: -2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fold-line);
            font-size: 0.6rem;
        }

        .start-btn::after {
            content: '\25C6';
            position: absolute;
            right: -2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--fold-line);
            font-size: 0.6rem;
        }

        /* =========================================
           SCENE WRAPPER
        ========================================= */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        .scene-wrapper.active { display: flex; }

        .scene-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--fold-line);
        }

        .scene-era {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .scene-progress {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* =========================================
           SCENE CONTENT
        ========================================= */
        .scene-content {
            animation: scene-enter 0.6s ease;
        }

        @keyframes scene-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scene-content h2 {
            font-size: 1.75rem;
            font-weight: 400;
            margin-bottom: 1.25rem;
            letter-spacing: 0.03em;
        }

        .header-label {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--japanese-red);
            margin-bottom: 0.5rem;
        }

        /* =========================================
           CHOICES
        ========================================= */
        .choices {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .choice-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem 1.25rem;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--paper-cream);
            border: 1px solid var(--fold-line);
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            position: relative;
        }

        .choice-btn:hover {
            background: var(--paper-warm);
            border-color: var(--japanese-red);
            transform: translateX(4px);
            box-shadow: var(--shadow-fold);
        }

        .choice-btn:hover .choice-key {
            background: var(--japanese-red);
            color: var(--paper-white);
        }

        .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--fold-shadow);
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        /* =========================================
           TRANSITION OVERLAY
        ========================================= */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--paper-white);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Fold pattern in transition */
        .transition-overlay::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 80px; height: 80px;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 2px solid var(--fold-line);
            animation: fold-spin 1.5s ease-in-out infinite;
        }

        @keyframes fold-spin {
            0% { transform: translate(-50%, -50%) rotate(45deg) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) rotate(225deg) scale(1.2); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) rotate(405deg) scale(0.8); opacity: 0.3; }
        }

        /* =========================================
           FACT TRACKER
        ========================================= */
        .fact-tracker {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            display: none;
        }

        .fact-toggle {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.85rem;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            background: var(--paper-cream);
            border: 1px solid var(--fold-line);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }

        .fact-toggle:hover {
            background: var(--paper-warm);
            border-color: var(--crease-dark);
        }

        .fact-panel {
            position: absolute;
            bottom: calc(100% + 0.5rem);
            left: 0;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--paper-cream);
            border: 1px solid var(--fold-line);
            padding: 1rem;
            box-shadow: var(--shadow-lifted);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: all 0.3s;
        }

        .fact-panel.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .fact-panel h4 {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .fact-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--fold-shadow);
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .fact-item:last-child { border-bottom: none; }

        .no-facts {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        /* =========================================
           SCENE-SPECIFIC COMPONENTS
        ========================================= */

        /* Historical date stamp */
        .date-stamp {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--japanese-red);
            padding: 0.3rem 0.6rem;
            background: var(--japanese-red-muted);
            display: inline-block;
            margin-bottom: 1rem;
        }

        /* Peace symbol / memorial marker */
        .memorial-marker {
            text-align: center;
            padding: 2rem 1rem;
            margin: 1.5rem 0;
            background: linear-gradient(180deg, var(--paper-cream), var(--paper-warm));
            position: relative;
        }

        .memorial-marker::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: var(--japanese-red);
            opacity: 0.3;
        }

        .memorial-marker .symbol {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        .memorial-marker .caption {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* Crane fold step */
        .fold-step {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            margin: 1rem 0;
            padding: 0.75rem;
            background: var(--paper-cream);
            border-left: 2px solid var(--fold-line);
        }

        .fold-step .step-num {
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--japanese-red);
            min-width: 1.5rem;
        }

        .fold-step .step-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Origami math box */
        .math-box {
            background: var(--paper-warm);
            padding: 1.25rem;
            margin: 1.25rem 0;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            position: relative;
        }

        .math-box::before {
            content: '\25B3';
            position: absolute;
            top: 0.5rem; right: 0.75rem;
            color: var(--fold-line);
            font-size: 1rem;
        }

        .math-box strong {
            color: var(--japanese-red);
        }

        /* Miura fold pattern (CSS grid) */
        .miura-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            width: 180px;
            margin: 1.5rem auto;
        }

        .miura-cell {
            aspect-ratio: 1;
            background: var(--paper-cream);
            border: 1px solid var(--fold-line);
            transform: skewX(-5deg);
            transition: all 0.3s;
        }

        .miura-cell:nth-child(even) {
            transform: skewX(5deg);
            background: var(--paper-warm);

                <p class="header-label">The First Fold</p>
                <h2>Paper Comes East</h2>

                <p class="lead">It begins with paper itself. In 105 CE, Cai Lun, a Chinese court official, perfected the art of papermaking from bark, hemp, and rags. Within centuries, Buddhist monks carried this knowledge to Japan.</p>

                <div class="paper-card">
                    <h3>Washi &mdash; The Soul of Japanese Paper</h3>
                    <p>By the 6th century, Japan had developed <em>washi</em> &mdash; handmade paper from the inner bark of the gampi tree, the mitsumata shrub, or the paper mulberry. Stronger and more flexible than Chinese paper, washi could be folded without tearing. The Japanese word for paper folding, <strong>origami</strong>, joins <em>ori</em> (folding) and <em>kami</em> (paper, also meaning "god" or "spirit").</p>

                <p>The crane appears across Japanese art &mdash; on kimonos, ceramics, screens, and scrolls. In Hokusai's woodblock prints, cranes soar over snowy landscapes. In Noh theater, the crane dance (<em>Tsuru no Mai</em>) embodies grace and spiritual transcendence.</p>

                <p>Her cranes are tiny &mdash; some smaller than a fingernail. She uses a needle to make the folds in scraps of paper too small for fingers alone. Her roommates in the hospital ward begin folding with her, and visitors bring paper in every color.</p>

                <p class="header-label">Beyond the Legend</p>

                <p>The common Western account says she wished to get well. But Japanese sources suggest something more complex. Sadako knew she was dying. Her family's accounts describe a girl who moved beyond hoping for her own recovery toward a broader wish: that no other children would suffer as she had.</p>

    // ================================================================
    //  STORY ENGINE

    const engine = {
        currentScene: null,
        history: [],
        facts: [],
        factsPanelOpen: false,
        craneCount: 0,

        init() {
            document.getElementById('startBtn').addEventListener('click', () => this.start());
            document.getElementById('restartBtn').addEventListener('click', () => this.restart());
            document.getElementById('factToggle').addEventListener('click', () => this.toggleFacts());

            // Keyboard support: 1-9 for choices
            document.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '9') {
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.choice-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        },

        start() {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('sceneWrapper').classList.add('active');
            document.getElementById('factTracker').style.display = 'block';
            document.getElementById('craneCounter').classList.add('active');
            this.goTo('origins');
        },

        restart() {
            this.currentScene = null;
            this.history = [];
            this.facts = [];
            this.craneCount = 0;
            this.factsPanelOpen = false;
            document.getElementById('factPanel').classList.remove('open');
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('titleScreen').style.display = 'flex';
            document.getElementById('factTracker').style.display = 'none';
            document.getElementById('craneCounter').classList.remove('active');
            this.updateFactUI();
            this.updateCraneCounter();
            window.scrollTo(0, 0);
        },

        goTo(sceneId) {
            if (sceneId === '_restart') {
                this.restart();
                return;
            }

            const scene = STORY[sceneId];
            if (!scene) return;

            // Add cranes for each scene visited
            this.addCranes(this.getSceneCranes(sceneId));

            // Transition effect
            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 500);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1200);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
        },

        getSceneCranes(sceneId) {
            const craneCounts = {
                origins: 25,
                crane_symbol: 50,
                ceremonial: 40,
                hiroshima: 100,
                sadako_diagnosis: 80,
                sadako_folding: 100,
                sadako_meaning: 75,
                sadako_end: 150,
                origami_math: 60,
                peace_movement: 80,
                miura_fold: 50,
                modern_applications: 40,
                final_cranes: 100,
                ending_memory: 50,
                ending_science: 50,
                ending_peace: 50
            };
            return craneCounts[sceneId] || 25;
        },

        addCranes(count) {
            this.craneCount = Math.min(1000, this.craneCount + count);
            this.updateCraneCounter();

            // Animate the crane tally if visible
            const tally = document.getElementById('craneTally');
            if (tally) {
                this.renderCraneTally(tally);
            }
        },

        updateCraneCounter() {
            const el = document.getElementById('craneCount');
            if (el) {
                el.textContent = this.craneCount;
            }

            const counter = document.getElementById('craneCounter');
            if (counter) {
                counter.classList.remove('pulse');
                void counter.offsetWidth; // force reflow
                counter.classList.add('pulse');
            }
        },

        renderCraneTally(container) {
            const displayCount = Math.min(30, Math.ceil(this.craneCount / 35));
            let html = '';
            for (let i = 0; i < displayCount; i++) {
                html += `<span class="tally-crane" style="animation-delay: ${i * 0.05}s">\u25C6</span>`;
            }
            container.innerHTML = html;
        },

        renderScene(sceneId, scene) {
            const eraLabel = document.getElementById('sceneEra');
            eraLabel.textContent = scene.era || '';

            const container = document.getElementById('sceneContent');
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = sceneId.startsWith('ending') ? 'none' : '';

            let html = '<div class="scene-content">';
            html += scene.content;

            // Add fact
            if (scene.fact) {
                this.addFact(scene.fact);
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    html += `<button class="choice-btn" onclick="engine.goTo('${choice.next}')">`;
                    html += `<span class="choice-key">${i + 1}</span>`;
                    html += `${choice.text}`;
                    html += `</button>`;
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // Render crane tally if on final_cranes scene
            if (sceneId === 'final_cranes') {
                const tally = document.getElementById('craneTally');
                if (tally) this.renderCraneTally(tally);
            }

            this.updateFactUI();
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">The paper awaits...</p>';
            } else {
                list.innerHTML = this.facts.map(f => `<div class="fact-item">${f}</div>`).join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    // Boot
    engine.init();
    </script>
