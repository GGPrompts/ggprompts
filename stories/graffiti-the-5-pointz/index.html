<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 5 Pointz &mdash; An Interactive Graffiti Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           GRAFFITI DESIGN SYSTEM -- Story Build
           5 Pointz: The Institute of Higher Burnin'
        ================================================================ */

        :root {
            --wall-dark: #1A1A2E;
            --wall-concrete: #2D2D2D;
            --wall-brick: #3D2B1F;

            --spray-chrome: #C0C0C0;
            --spray-red: #FF2E00;
            --spray-gold: #FFD700;
            --spray-green: #00FF41;
            --spray-magenta: #FF00FF;
            --spray-blue: #00BFFF;
            --spray-orange: #FF6B00;

            --outline-black: #000000;
            --highlight-white: #FFFFFF;
            --paper-aged: #F5F0DC;

            --text-primary: #E8E8E8;
            --text-muted: #8A8A8A;

            --glow-red: rgba(255, 46, 0, 0.5);
            --glow-gold: rgba(255, 215, 0, 0.5);
            --glow-green: rgba(0, 255, 65, 0.5);
            --glow-magenta: rgba(255, 0, 255, 0.5);
            --glow-blue: rgba(0, 191, 255, 0.5);

            --font-display: 'Rubik Spray Paint', cursive;
            --font-heading: 'Permanent Marker', cursive;
            --font-body: 'Space Grotesk', sans-serif;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;

            --transition-fast: 0.15s ease;
            --transition-base: 0.3s ease;

            --radius-sm: 2px;
            --radius-md: 6px;
        }

        /* --- KEYFRAMES --- */
        @keyframes drip {
            0% { transform: scaleY(0); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: scaleY(1); opacity: 0.85; }
        }

        @keyframes spray-in {
            0% { opacity: 0; transform: scale(0.7) rotate(-5deg); }
            60% { opacity: 1; transform: scale(1.05) rotate(1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes factSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes sprayPulse {
            0%, 100% { text-shadow: 0 0 10px var(--glow-gold); }
            50% { text-shadow: 0 0 20px var(--glow-gold), 0 0 40px var(--glow-gold); }
        }

        @keyframes tagFlicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.6; }
            94% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
        }

        @keyframes transitionSpray {
            0% { opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* --- RESET --- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--wall-dark);
            background-image:
                repeating-linear-gradient(
                    0deg, transparent, transparent 2px,
                    rgba(255, 255, 255, 0.008) 2px, rgba(255, 255, 255, 0.008) 4px
                ),
                repeating-linear-gradient(
                    90deg, transparent, transparent 3px,
                    rgba(255, 255, 255, 0.005) 3px, rgba(255, 255, 255, 0.005) 6px
                ),
                repeating-linear-gradient(
                    45deg, transparent, transparent 8px,
                    rgba(0, 0, 0, 0.03) 8px, rgba(0, 0, 0, 0.03) 10px
                ),
                radial-gradient(ellipse at 20% 50%, rgba(61, 43, 31, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 30%, rgba(45, 45, 45, 0.2) 0%, transparent 60%);
        }

        /* ==============================
           LAYOUT
        ============================== */
        .game-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        /* ==============================
           TITLE SCREEN
        ============================== */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
        }

        .back-to-stories {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--spray-chrome);
            text-decoration: none;
            letter-spacing: 2px;
            transition: color var(--transition-fast);
            z-index: 10;
        }

        .back-to-stories:hover { color: var(--spray-gold); }

        .title-label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            color: var(--spray-chrome);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: var(--space-4);
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1;
            color: var(--spray-gold);
            text-shadow:
                3px 3px 0 var(--spray-red),
                -2px -2px 0 var(--spray-blue),
                0 0 30px var(--glow-gold);
            margin-bottom: var(--space-3);
            animation: sprayPulse 4s ease infinite;
        }

        .title-subtitle {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--spray-magenta);
            letter-spacing: 2px;
            margin-bottom: var(--space-3);
        }

        .title-tagline {
            font-family: var(--font-body);
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: var(--space-7);
            max-width: 520px;
            line-height: 1.7;
        }

        .title-start {
            font-family: var(--font-heading);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: var(--space-4) var(--space-7);
            background: transparent;
            border: 3px solid var(--spray-gold);
            color: var(--spray-gold);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-fast);
        }

        .title-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: var(--spray-gold);
            transition: left var(--transition-fast);
            z-index: -1;
        }

        .title-start:hover {
            color: var(--wall-dark);
            text-shadow: none;
            box-shadow: 0 0 20px var(--glow-gold);
        }

        .title-start:hover::before { left: 0; }

        .title-credits {
            margin-top: var(--space-7);
            font-family: var(--font-body);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ==============================
           SCENE CONTAINER
        ============================== */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
            padding-top: 1rem;
        }

        .scene-wrapper.active { display: flex; }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-3);
            margin-bottom: var(--space-5);
            border-bottom: 4px solid transparent;
            border-image: repeating-linear-gradient(
                -45deg,
                var(--spray-gold), var(--spray-gold) 10px,
                var(--outline-black) 10px, var(--outline-black) 20px
            ) 4;
            position: relative;
        }

        .scene-era {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            color: var(--spray-magenta);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .scene-year {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--spray-gold);
            letter-spacing: 1px;
        }

        .scene-fact-count {
            font-family: var(--font-body);
            font-size: 0.7rem;
            color: var(--spray-green);
            letter-spacing: 1px;
        }

        .scene-content { animation: sceneFadeIn 0.8s ease-out; }

        /* ==============================
           SCENE TYPES
        ============================== */

        /* Wall scene -- main narrative panels */
        .scene-wall {
            background: var(--wall-concrete);
            border-left: 5px solid var(--spray-red);
            padding: var(--space-6);
            margin-bottom: var(--space-5);
            position: relative;
            overflow: hidden;
        }

        .scene-wall::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                repeating-linear-gradient(
                    0deg, transparent, transparent 2px,
                    rgba(255, 255, 255, 0.01) 2px, rgba(255, 255, 255, 0.01) 4px
                );
            pointer-events: none;
        }

        .scene-wall .wall-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            letter-spacing: 2px;
            margin-bottom: var(--space-4);
            color: var(--spray-gold);
        }

        .scene-wall .scene-text {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.8;
        }

        .scene-wall .scene-text p { margin-bottom: var(--space-4); }
        .scene-wall .scene-text p:last-child { margin-bottom: 0; }

        /* Brick scene -- discovery/investigation */
        .scene-brick {
            background: linear-gradient(135deg, var(--wall-brick), #2a1f15);
            border: 2px solid rgba(255, 215, 0, 0.2);
            padding: var(--space-6);
            margin-bottom: var(--space-5);
            position: relative;
        }

        .scene-brick::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--spray-red), var(--spray-gold), var(--spray-green), var(--spray-blue), var(--spray-magenta));
        }

        .scene-brick .brick-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--spray-gold);
            margin-bottom: var(--space-4);
        }

        .scene-brick .scene-text {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.8;
        }

        .scene-brick .scene-text p { margin-bottom: var(--space-4); }
        .scene-brick .scene-text p:last-child { margin-bottom: 0; }

        /* Tag scene -- alerts and important moments */
        .scene-tag {
            padding: var(--space-5);
            border: 2px solid rgba(255, 46, 0, 0.3);
            background: rgba(45, 45, 45, 0.8);
            margin-bottom: var(--space-5);
            position: relative;
        }

        .scene-tag::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 4px; height: 100%;
        }

        .scene-tag-danger::before { background: var(--spray-red); }
        .scene-tag-info::before { background: var(--spray-blue); }
        .scene-tag-legal::before { background: var(--spray-gold); }
        .scene-tag-art::before { background: var(--spray-magenta); }

        .scene-tag .tag-title {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: var(--space-3);
        }

        .scene-tag .scene-text {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.8;
        }

        .scene-tag .scene-text p { margin-bottom: var(--space-4); }
        .scene-tag .scene-text p:last-child { margin-bottom: 0; }

        /* Ending scene */
        .scene-ending {
            text-align: center;
            padding: var(--space-8) var(--space-5);
            margin-bottom: var(--space-5);
        }

        .scene-ending .ending-label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--spray-magenta);
            margin-bottom: var(--space-4);
        }

        .scene-ending .ending-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: var(--spray-gold);
            text-shadow:
                3px 3px 0 var(--spray-red),
                -2px -2px 0 var(--spray-blue),
                0 0 20px var(--glow-gold);
            margin-bottom: var(--space-6);
        }

        .scene-ending .scene-text {
            max-width: 550px;
            margin: 0 auto;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .scene-ending .scene-text p { margin-bottom: var(--space-4); }

        .scene-ending .the-end {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: var(--space-6);
            text-transform: uppercase;
        }

        /* ==============================
           INLINE COMPONENTS
        ============================== */

        .scene-title-bar {
            font-family: var(--font-display);
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            letter-spacing: 2px;
            margin-bottom: var(--space-5);
            padding-bottom: var(--space-3);
            color: var(--spray-gold);
            border-bottom: 4px solid transparent;
            border-image: repeating-linear-gradient(
                -45deg,
                var(--spray-gold), var(--spray-gold) 8px,
                var(--outline-black) 8px, var(--outline-black) 16px
            ) 4;
        }

        .text-red { color: var(--spray-red); }
        .text-gold { color: var(--spray-gold); }
        .text-green { color: var(--spray-green); }
        .text-blue { color: var(--spray-blue); }
        .text-magenta { color: var(--spray-magenta); }
        .text-chrome { color: var(--spray-chrome); }
        .text-orange { color: var(--spray-orange); }

        .glow-gold { text-shadow: 0 0 10px var(--glow-gold); }
        .glow-red { text-shadow: 0 0 10px var(--glow-red); }

        /* Badge / spray tag */
        .badge {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: var(--space-1) var(--space-3);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--spray-red);
            color: var(--highlight-white);
        }

        .badge-gold { background: var(--spray-gold); color: var(--outline-black); }
        .badge-green { background: var(--spray-green); color: var(--outline-black); }
        .badge-blue { background: var(--spray-blue); color: var(--outline-black); }
        .badge-magenta { background: var(--spray-magenta); color: var(--outline-black); }

        /* Fact found toast */
        .fact-found {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--spray-green);
            color: var(--outline-black);
            padding: 6px 16px;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: var(--space-4);
            animation: factSlideIn 0.6s ease-out;
        }

        /* ==============================
           CHOICES
        ============================== */
        .choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-top: var(--space-5);
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }

        .choice-btn {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-5);
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 2px;
            border: 3px solid var(--spray-chrome);
            background: transparent;
            color: var(--spray-chrome);
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--spray-gold);
            transition: left var(--transition-fast);
            z-index: -1;
        }

        .choice-btn:hover {
            color: var(--outline-black);
            border-color: var(--spray-gold);
            box-shadow: 0 0 15px var(--glow-gold);
        }

        .choice-btn:hover::before { left: 0; }
        .choice-btn:active { transform: scale(0.98); }

        .choice-btn .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            border: 2px solid currentColor;
            font-size: 0.7rem;
            margin-right: var(--space-3);
            flex-shrink: 0;
            font-family: var(--font-body);
            font-weight: 700;
        }

        .choice-btn:hover .choice-key { border-color: var(--outline-black); }

        /* Danger choice */
        .choice-btn-danger {
            color: var(--spray-red);
            border-color: rgba(255, 46, 0, 0.4);
        }

        .choice-btn-danger::before { background: var(--spray-red); }

        .choice-btn-danger:hover {
            border-color: var(--spray-red);
            box-shadow: 0 0 15px var(--glow-red);
            color: var(--highlight-white);
        }

        /* ==============================
           TRANSITION OVERLAY
        ============================== */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
        }

        .transition-overlay.active {
            pointer-events: all;
            animation: transitionSpray 0.8s ease-in-out;
        }

        .transition-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--wall-dark);
        }

        /* ==============================
           FACT TRACKER
        ============================== */
        .fact-tracker {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            max-width: 280px;
        }

        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px 14px;
            background: var(--wall-concrete);
            border: 2px solid var(--spray-green);
            color: var(--spray-green);
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
        }

        .fact-tracker-toggle:hover {
            box-shadow: 0 0 12px var(--glow-green);
        }

        .fact-tracker-panel {
            display: none;
            margin-top: var(--space-2);
            background: var(--wall-concrete);
            border: 2px solid rgba(0, 255, 65, 0.3);
            padding: var(--space-4);
            max-height: 60vh;
            overflow-y: auto;
        }

        .fact-tracker-panel.open { display: block; animation: factSlideIn 0.3s ease-out; }

        .fact-tracker-panel .panel-title {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            color: var(--spray-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 2px solid rgba(0, 255, 65, 0.2);
        }

        .fact-tracker-panel .fact-item {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: var(--space-2) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            line-height: 1.5;
        }

        .fact-tracker-panel .fact-item:last-child { border-bottom: none; }
        .fact-tracker-panel .fact-item::before {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--spray-green);
            margin-right: var(--space-2);
            vertical-align: middle;
        }

        /* ==============================
           RESPONSIVE
        ============================== */
        @media (max-width: 768px) {
            .game-container { padding: 1rem; }
            .title-screen h1 { font-size: clamp(2rem, 10vw, 4rem); }
            .scene-wall, .scene-brick { padding: var(--space-4); }
            .fact-tracker { max-width: 200px; }
            .fact-tracker-toggle { font-size: 0.6rem; padding: 4px 10px; }
            .choice-btn { font-size: 0.75rem; padding: var(--space-3) var(--space-4); }
            .scene-header { flex-wrap: wrap; gap: var(--space-2); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Title Screen -->
        <div class="title-screen" id="titleScreen">
            <a href="../index.html" class="back-to-stories">Stories</a>
            <div class="title-label">An Interactive Graffiti Story</div>
            <h1>5 Pointz</h1>
            <div class="title-subtitle">The Institute of Higher Burnin'</div>
            <p class="title-tagline">Long Island City, Queens. 1993&ndash;2014. The world's greatest open-air aerosol gallery &mdash; and the fight over who owns a wall.</p>
            <button class="title-start" onclick="engine.start()">Grab a Can</button>
            <div class="title-credits">Built with the Graffiti design system</div>
        </div>

        <!-- Scene Display -->
        <div class="scene-wrapper" id="sceneWrapper">
            <div class="scene-header">
                <div>
                    <span class="scene-era" id="sceneEra"></span>
                    <span class="scene-year" id="sceneYear"></span>
                </div>
                <span class="scene-fact-count" id="sceneFactCount"></span>
            </div>
            <div id="sceneContent"></div>
        </div>

        <!-- Fact Tracker -->
        <div class="fact-tracker" id="factTracker" style="display:none;">
            <button class="fact-tracker-toggle" id="factToggle" onclick="engine.toggleFacts()">
                Facts: <span id="factCountBadge">0</span>
            </button>
            <div class="fact-tracker-panel" id="factPanel">
                <div class="panel-title">Collected Facts</div>
                <div id="factList"></div>
            </div>
        </div>

        <!-- Transition -->
        <div class="transition-overlay" id="transitionOverlay">
            <div class="transition-bg"></div>
        </div>
    </div>

    <script>
        /* ==============================================================
           STORY DATA -- 5 Pointz: The Institute of Higher Burnin'
           15 scenes, 3 branching perspectives, 3 endings
        ============================================================== */

            // ---- SCENE 1: THE BEGINNING ----

                        <div class="the-end">The walls remember</div>
                    </div>
                `,
                fact: 'The Cohen v. G&M Realty ruling was upheld by the Second Circuit Court of Appeals in 2020, establishing binding federal precedent that graffiti and aerosol art qualify for VARA protection -- forever changing the legal landscape for street art in America.',
                choices: [
                    { text: 'Play Again', next: 'intro' },
                    { text: 'Back to Stories', next: '_exit' }
                ]
            },

            // ---- ENDING B: GENTRIFICATION ----
            ending_gentrification: {
                year: '2020s',
                era: 'THE NEW LIC',
                content: `
                    <div class="scene-ending">
                        <div class="ending-label">Ending</div>
                        <div class="ending-title">Glass and Steel</div>
                        <div class="scene-text">
                            <p>The luxury towers rise on the 5 Pointz site. Wolkoff's development, rebranded as "<span class="text-gold">The Creek and The Cave</span>" and later "<span class="text-blue">22-22 Jackson Avenue</span>," opens with apartments starting at <span class="text-red">$600,000</span> for studios. The buildings include a gym, rooftop deck, and parking -- but no art gallery.</p>
                            <p>Long Island City is unrecognizable from the industrial neighborhood where Meres One first picked up a spray can. Glass towers crowd the skyline. A <span class="text-gold">one-bedroom apartment</span> in the new development rents for upward of <span class="text-red">$3,000 per month</span>. The 7 train riders who once admired aerosol art now see luxury balconies.</p>
                            <p>This is the irony the artists always understood: the art that made the neighborhood interesting is destroyed to make room for people who moved there <span class="text-magenta">because the neighborhood was interesting</span>. The cultural capital created by artists gets cashed in by developers. It's the oldest story in gentrification.</p>
                            <p>Some of the $6.75 million in damages is paid. But no amount of money replaces what was created and destroyed at 45-46 Davis Street.</p>
                        </div>
                        <div class="the-end">The walls are gone</div>
                    </div>
                `,
                fact: 'The luxury towers built on the 5 Pointz site feature apartments starting around $600,000, in a neighborhood transformed from industrial warehouses to one of NYC\'s fastest-growing luxury residential markets -- a textbook case of arts-driven gentrification.',
                choices: [
                    { text: 'Play Again', next: 'intro' },
                    { text: 'Back to Stories', next: '_exit' }
                ]
            },

            // ---- ENDING C: THE ART ----
            ending_walls: {
                year: 'Forever',
                era: 'THE ART',
                content: `
                    <div class="scene-ending">
                        <div class="ending-label">Ending</div>
                        <div class="ending-title">What the Walls Held</div>
                        <div class="scene-text">
                            <p>In the end, 5 Pointz was about something older than property rights or legal precedent. It was about <span class="text-gold">the human need to make marks on walls</span>.</p>
                            <p>From <span class="text-blue">Lascaux to Pompeii to the Berlin Wall to 45-46 Davis Street</span>, humans have always painted on surfaces that weren't theirs. The cave painters of 17,000 years ago didn't own the rock. The graffiti artists of ancient Rome didn't own the plaster. The writers of 5 Pointz didn't own the concrete.</p>
                            <p>What was lost in the whitewashing wasn't just 49 artworks. It was <span class="text-magenta">memorial portraits of dead friends</span>. It was a teenager's first piece, the one that made them feel like an artist for the first time. It was 20 years of layered history -- each new painting a conversation with every painting beneath it.</p>
                            <p>Graffiti has always understood something that galleries forget: <span class="text-gold">art is not meant to last forever</span>. It's meant to exist, to be seen, to matter in its moment. 5 Pointz mattered. And nothing -- not white paint, not wrecking balls, not luxury condominiums -- can undo the fact that it existed.</p>
                        </div>
                        <div class="the-end">Aerosol is forever</div>
                    </div>
                `,
                fact: 'The tradition of painting on walls stretches from the caves of Lascaux (17,000 years ago) through Pompeii, the Berlin Wall, and 5 Pointz -- an unbroken human impulse to make marks on surfaces, regardless of who owns them.',
                choices: [
                    { text: 'Play Again', next: 'intro' },
                    { text: 'Back to Stories', next: '_exit' }
                ]
            }
        };

        /* ==============================================================
           ENGINE
        ============================================================== */
        const engine = {
            currentScene: null,
            history: [],
            clues: [],
            factsOpen: false,

            init() {
                document.addEventListener('keydown', (e) => {
                    const key = parseInt(e.key);
                    if (key >= 1 && key <= 9) {
                        const btns = document.querySelectorAll('.choice-btn');
                        if (btns[key - 1]) btns[key - 1].click();
                    }
                });
            },

            start() {
                document.getElementById('titleScreen').style.display = 'none';
                document.getElementById('sceneWrapper').classList.add('active');
                document.getElementById('factTracker').style.display = 'block';
                this.goTo('intro');
            },

            goTo(id) {
                if (id === '_exit') {
                    window.location.href = '../index.html';
                    return;
                }

                if (id === 'intro') {
                    this.history = [];
                    this.clues = [];
                    this.updateFactTracker();
                }

                const overlay = document.getElementById('transitionOverlay');
                overlay.classList.add('active');

                setTimeout(() => {
                    this.currentScene = id;
                    this.history.push(id);
                    this.renderScene();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 400);

                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 800);
            },

            renderScene() {
                const scene = STORY[this.currentScene];
                if (!scene) return;

                // Update HUD
                const eraEl = document.getElementById('sceneEra');
                const yearEl = document.getElementById('sceneYear');
                const factCountEl = document.getElementById('sceneFactCount');

                if (scene.era) eraEl.textContent = scene.era;
                if (scene.year) yearEl.textContent = scene.year;

                // Collect fact
                if (scene.fact && !this.clues.includes(scene.fact)) {
                    this.clues.push(scene.fact);
                }

                factCountEl.textContent = 'Facts: ' + this.clues.length;
                this.updateFactTracker();

                // Build content
                let html = '<div class="scene-content">';
                html += scene.content;

                // Fact found toast
                if (scene.fact) {
                    html += '<div class="fact-found">Fact Collected</div>';
                }

                // Choices
                if (scene.choices && scene.choices.length) {
                    html += '<div class="choices">';
                    scene.choices.forEach((choice, i) => {
                        const cls = choice.danger ? ' choice-btn-danger' : '';
                        html += `<button class="choice-btn${cls}" onclick="engine.goTo('${choice.next}')">
                            <span class="choice-key">${i + 1}</span>${choice.text}
                        </button>`;
                    });
                    html += '</div>';
                }

                html += '</div>';
                document.getElementById('sceneContent').innerHTML = html;
            },

            toggleFacts() {
                this.factsOpen = !this.factsOpen;
                const panel = document.getElementById('factPanel');
                panel.classList.toggle('open', this.factsOpen);
            },

            updateFactTracker() {
                document.getElementById('factCountBadge').textContent = this.clues.length;
                const list = document.getElementById('factList');
                list.innerHTML = this.clues.map(f =>
                    `<div class="fact-item">${f}</div>`
                ).join('');
            }
        };

        engine.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
