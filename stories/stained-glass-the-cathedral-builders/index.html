<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cathedral Builders &mdash; A Stained Glass Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Cinzel', serif;
            --font-body: 'Crimson Text', serif;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;

            /* Jewel Tones */
            --ruby: #9b111e;
            --ruby-glow: rgba(155, 17, 30, 0.6);
            --sapphire: #0f52ba;
            --sapphire-glow: rgba(15, 82, 186, 0.6);
            --emerald: #046307;
            --emerald-glow: rgba(4, 99, 7, 0.6);
            --amber: #ffbf00;
            --amber-glow: rgba(255, 191, 0, 0.6);
            --amethyst: #9966cc;
            --amethyst-glow: rgba(153, 102, 204, 0.6);
            --topaz: #ffc87c;
            --topaz-glow: rgba(255, 200, 124, 0.6);

            /* Leading and Structure */
            --leading: #1a1a1a;
            --leading-highlight: #2d2d2d;
            --cathedral-dark: #0a0a0a;
            --cathedral-stone: #3d3d3d;

            /* Light Effects */
            --light-bloom: rgba(255, 255, 255, 0.15);
            --light-ray: rgba(255, 255, 255, 0.08);

            --text-primary: #f0e6d3;
            --text-secondary: rgba(240, 230, 211, 0.7);
            --bg-primary: var(--cathedral-dark);
            --bg-secondary: var(--leading);

            --leading-width: 4px;
            --leading-border: var(--leading-width) solid var(--leading);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 400;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Glass Texture Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Light Rays Background */
        .light-rays {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 30% 0%, var(--ruby-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 0%, var(--sapphire-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, var(--amber-glow) 0%, transparent 40%);
            opacity: 0.15;
        }

        /* =============================================
           LAYOUT
        ============================================= */
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* =============================================
           TITLE SCREEN
        ============================================= */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }

        .title-rose-window {
            width: 120px;
            height: 120px;
            margin-bottom: var(--space-6);
            position: relative;
            border-radius: 50%;
            background:
                conic-gradient(
                    var(--ruby) 0deg 60deg,
                    var(--sapphire) 60deg 120deg,
                    var(--emerald) 120deg 180deg,
                    var(--amber) 180deg 240deg,
                    var(--amethyst) 240deg 300deg,
                    var(--topaz) 300deg 360deg
                );
            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 191, 0, 0.3),
                0 0 2px 2px var(--leading);
            animation: roseGlow 4s ease-in-out infinite alternate;
        }

        .title-rose-window::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.5), 0 0 20px var(--amber-glow);
            border: 3px solid var(--leading);
        }

        @keyframes roseGlow {
            0% { box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.3), 0 0 40px rgba(255, 191, 0, 0.2), 0 0 2px 2px var(--leading); }
            100% { box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.3), 0 0 60px rgba(255, 191, 0, 0.4), 0 0 2px 2px var(--leading); }
        }

        .title-badge {
            display: inline-block;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--amber);
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(180deg, var(--amber) 0%, var(--topaz) 50%, var(--text-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 0.75rem;
        }

        .title-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 2.5rem;
            max-width: 500px;
        }

        .title-start {
            font-family: var(--font-display);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 14px 48px;
            background: transparent;
            color: var(--amber);
            border: 2px solid var(--amber);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .title-start::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--ruby-glow), var(--sapphire-glow), var(--amber-glow));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .title-start:hover {
            background: var(--amber);
            color: var(--cathedral-dark);
            box-shadow: 0 0 30px var(--amber-glow);
        }

        .title-start:hover::before { opacity: 0.2; }

        .back-to-stories {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .back-to-stories:hover { opacity: 1; }

        /* =============================================
           SCENE WRAPPER
        ============================================= */
        .scene-wrapper {
            display: none;
        }
        .scene-wrapper.active {
            display: block;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-4);
            margin-bottom: var(--space-5);
            border-bottom: var(--leading-border);
        }

        .scene-era {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--amber);
            opacity: 0.7;
        }

        .scene-year {
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
        }

        .scene-progress {
            font-family: var(--font-display);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--cathedral-stone);
        }

        /* =============================================
           SCENE TYPES
        ============================================= */

        /* --- Narration (body text, description) --- */
        .scene-narration {
            background: var(--bg-secondary);
            border: var(--leading-border);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .scene-narration::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--ruby), var(--sapphire), var(--emerald), var(--amber));
        }

        .scene-narration .scene-text p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .scene-narration .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Workshop (hands-on craft scenes) --- */
        .scene-workshop {
            background: var(--bg-secondary);
            border: var(--leading-border);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .scene-workshop::before {
            content: 'WORKSHOP';
            position: absolute;
            top: 1rem; right: 1rem;
            font-family: var(--font-display);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--topaz);
            padding: 4px 8px;
            border: 1px solid var(--topaz);
            opacity: 0.6;
        }

        .scene-workshop .workshop-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--amber);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .scene-workshop .scene-text p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        /* --- Cathedral (grand architectural reveal) --- */
        .scene-cathedral {
            position: relative;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
            background: var(--bg-secondary);
            border: var(--leading-border);
            overflow: hidden;
        }

        .scene-cathedral::before {
            content: '';
            position: absolute;
            top: -30%; left: 50%;
            transform: translateX(-50%);
            width: 150%; height: 160%;
            background:
                radial-gradient(ellipse at 50% 0%, var(--amber-glow) 0%, transparent 40%),
                radial-gradient(ellipse at 30% 0%, var(--ruby-glow) 0%, transparent 30%),
                radial-gradient(ellipse at 70% 0%, var(--sapphire-glow) 0%, transparent 30%);
            opacity: 0.15;
            pointer-events: none;
        }

        .scene-cathedral .cathedral-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 0.75rem;
            position: relative;
        }

        .scene-cathedral .cathedral-name {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .scene-cathedral .scene-text {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        .scene-cathedral .scene-text p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        /* --- Illumination (dialogue / confrontation) --- */
        .scene-illumination {
            position: relative;
            background: var(--bg-secondary);
            border: var(--leading-border);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .scene-illumination::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--amethyst), var(--sapphire), var(--emerald));
        }

        .scene-illumination .speaker {
            font-family: var(--font-display);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--amber);
            margin-bottom: 0.5rem;
        }

        .scene-illumination .scene-text p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .scene-illumination .scene-text p.dialogue {
            font-style: italic;
            color: var(--text-primary);
            padding-left: 1rem;
            border-left: 3px solid var(--amber);
        }

        /* --- Ending --- */
        .scene-ending {
            text-align: center;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            border: var(--leading-border);
            position: relative;
            overflow: hidden;
        }

        .scene-ending::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--ruby), var(--amber), var(--sapphire), var(--emerald), var(--amethyst), var(--topaz));
        }

        .scene-ending .ending-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--amber);
            margin-bottom: 1rem;
        }

        .scene-ending .ending-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            background: linear-gradient(180deg, var(--amber) 0%, var(--topaz) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .scene-ending .scene-text {
            max-width: 550px;
            margin: 0 auto;
        }

        .scene-ending .scene-text p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .scene-ending .the-end {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--cathedral-stone);
            margin-top: 2rem;
        }

        /* =============================================
           FACT DISCOVERED TOAST
        ============================================= */
        .fact-found {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--ruby), var(--sapphire));
            color: var(--text-primary);
            padding: 6px 16px;
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 1.5rem;
            position: relative;
            animation: factSlideIn 0.6s ease-out;
        }

        .fact-found::before {
            content: '\2726';
            font-size: 0.9rem;
        }

        @keyframes factSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* =============================================
           CHOICES
        ============================================= */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }

        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-btn {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            border: var(--leading-border);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--ruby), var(--amber));
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .choice-btn:hover {
            border-color: var(--amber);
            background: rgba(255, 191, 0, 0.05);
            padding-left: 28px;
            box-shadow: 0 0 20px rgba(255, 191, 0, 0.1);
        }

        .choice-btn:hover::before { transform: scaleY(1); }

        .choice-btn .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px; height: 24px;
            border: 1px solid var(--cathedral-stone);
            font-family: var(--font-display);
            font-size: 0.7rem;
            color: var(--cathedral-stone);
            margin-right: 12px;
            flex-shrink: 0;
        }

        .choice-btn:hover .choice-key {
            border-color: var(--amber);
            color: var(--amber);
        }

        /* =============================================
           TRANSITION OVERLAY
        ============================================= */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .transition-overlay.active {
            pointer-events: all;
            opacity: 1;
        }

        .transition-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 50%, var(--amber-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 30%, var(--ruby-glow) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 70%, var(--sapphire-glow) 0%, transparent 40%);
            opacity: 0.4;
            animation: transGlow 1.2s ease-in-out;
        }

        @keyframes transGlow {
            0% { opacity: 0; }
            40% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        /* =============================================
           FACT TRACKER (SIDEBAR)
        ============================================= */
        .fact-tracker {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            max-width: 240px;
        }

        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: var(--leading-border);
            color: var(--amber);
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
        }

        .fact-tracker-toggle:hover {
            border-color: var(--amber);
            box-shadow: 0 0 15px rgba(255, 191, 0, 0.15);
        }

        .fact-tracker-panel {
            display: none;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border: var(--leading-border);
            padding: 1rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .fact-tracker-panel.open {
            display: block;
            animation: panelSlideIn 0.3s ease-out;
        }

        @keyframes panelSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fact-tracker-panel h4 {
            font-family: var(--font-display);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--cathedral-stone);
            margin-bottom: 0.75rem;
        }

        .fact-item {
            font-size: 0.8rem;
            color: var(--topaz);
            padding: 6px 0;
            border-bottom: 1px solid var(--leading-highlight);
            animation: factSlideIn 0.4s ease-out;
        }

        .fact-item:last-child { border-bottom: none; }

        .no-facts {
            font-size: 0.8rem;
            color: var(--cathedral-stone);
            font-style: italic;
        }

        /* =============================================
           GAME CONTROLS
        ============================================= */
        .game-controls {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: var(--leading-border);
        }

        .ctrl-btn {
            padding: 8px 16px;
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: 1px solid var(--leading-highlight);
            background: transparent;
            color: var(--cathedral-stone);
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            border-color: var(--amber);
            color: var(--text-primary);
        }

        /* =============================================
           SCENE FADE IN
        ============================================= */
        .scene-content {
            animation: sceneFadeIn 0.8s ease-out;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =============================================
           RESPONSIVE
        ============================================= */
        @media (max-width: 768px) {
            .game-container { padding: 1rem; }
            .scene-narration, .scene-workshop, .scene-cathedral, .scene-illumination { padding: 1.5rem; }
            .fact-tracker { right: 0.75rem; top: 0.75rem; max-width: 200px; }
            .title-screen h1 { letter-spacing: 0.05em; }
            .scene-cathedral .cathedral-name { letter-spacing: 0.04em; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--cathedral-stone); }
        ::selection { background: var(--ruby); color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="light-rays"></div>

    <!-- Transition overlay -->
    <div class="transition-overlay" id="transition">
        <div class="transition-glow"></div>
    </div>

    <!-- Fact Tracker -->
    <div class="fact-tracker" id="factTracker" style="display: none;">
        <button class="fact-tracker-toggle" id="factToggle">
            <span>Discoveries</span>
            <span id="factCount">0</span>
        </button>
        <div class="fact-tracker-panel" id="factPanel">
            <h4>Knowledge Gained</h4>
            <div id="factList">
                <p class="no-facts">No discoveries yet...</p>
            </div>
        </div>
    </div>

    <div class="game-container">
        <!-- Title Screen -->
        <div class="title-screen" id="titleScreen">
            <div class="title-rose-window"></div>
            <div class="title-badge">Anno Domini 1140 &ndash; 1260</div>
            <h1>The Cathedral Builders</h1>
            <p class="title-subtitle">"To build a cathedral is to negotiate between heaven and earth, between the geometry of God and the weight of stone."</p>
            <button class="title-start" id="startBtn">Enter the Building Site</button>
            <a href="../index.html" class="back-to-stories">&larr; All Stories</a>
        </div>

        <!-- Scene Container -->
        <div class="scene-wrapper" id="sceneWrapper">
            <div class="scene-header">

        // --- CONVERGENCE & ENDINGS ---

    // =================================================================
    //  STORY ENGINE
    // =================================================================

    const engine = {
        currentScene: null,
        history: [],
        facts: [],
        factsPanelOpen: false,
        sceneCount: 0,

        init() {
            document.getElementById('startBtn').addEventListener('click', () => this.start());
            document.getElementById('restartBtn').addEventListener('click', () => this.restart());
            document.getElementById('factToggle').addEventListener('click', () => this.toggleFacts());

            // Keyboard support: 1-9 for choices
            document.addEventListener('keydown', (e) => {
                if (e.key >= '1' && e.key <= '9') {
                    const idx = parseInt(e.key) - 1;
                    const btns = document.querySelectorAll('.choice-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        },

        start() {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('sceneWrapper').classList.add('active');
            document.getElementById('factTracker').style.display = 'block';
            this.goTo('intro');
        },

        restart() {
            this.currentScene = null;
            this.history = [];
            this.facts = [];
            this.factsPanelOpen = false;
            this.sceneCount = 0;
            document.getElementById('factPanel').classList.remove('open');
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('titleScreen').style.display = 'flex';
            document.getElementById('factTracker').style.display = 'none';
            this.updateFactUI();
            window.scrollTo(0, 0);
        },

        goTo(sceneId) {
            if (sceneId === '_restart') {
                this.restart();
                return;
            }
            if (sceneId === '_exit') {
                window.location.href = '../index.html';
                return;
            }

            const scene = STORY[sceneId];
            if (!scene) return;

            // Transition effect
            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 400);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1000);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
            this.sceneCount++;
        },

        renderScene(sceneId, scene) {
            const container = document.getElementById('sceneContent');
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = scene.type === 'ending' ? 'none' : '';

            // Update HUD
            document.getElementById('sceneEra').textContent = scene.era || '';
            document.getElementById('sceneYear').textContent = scene.year ? 'A.D. ' + scene.year : '';
            document.getElementById('sceneProgress').textContent = 'Scene ' + this.sceneCount;

            let html = '<div class="scene-content">';

            // Build scene based on type
            switch (scene.type) {
                case 'narration':
                    html += this.renderNarration(scene);
                    break;
                case 'workshop':
                    html += this.renderWorkshop(scene);
                    break;
                case 'cathedral':
                    html += this.renderCathedral(scene);
                    break;
                case 'illumination':
                    html += this.renderIllumination(scene);
                    break;
                case 'ending':
                    html += this.renderEnding(scene);
                    break;
            }

            // Fact notification
            if (scene.fact) {
                this.addFact(scene.fact);
                html += '<div class="fact-found">Discovery Made</div>';
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    html += `<button class="choice-btn" onclick="engine.goTo('${choice.next}')">`;
                    html += `<span class="choice-key">${i + 1}</span>`;
                    html += `${choice.text}`;
                    html += `</button>`;
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;
            this.updateFactUI();
        },

        renderNarration(scene) {
            let html = '<div class="scene-narration"><div class="scene-text">';
            scene.text.forEach(p => { html += `<p>${p}</p>`; });
            html += '</div></div>';
            return html;
        },

        renderWorkshop(scene) {
            let html = '<div class="scene-workshop">';
            if (scene.workshopTitle) html += `<div class="workshop-title">${scene.workshopTitle}</div>`;
            html += '<div class="scene-text">';
            scene.text.forEach(p => { html += `<p>${p}</p>`; });
            html += '</div></div>';
            return html;
        },

        renderCathedral(scene) {
            let html = '<div class="scene-cathedral">';
            if (scene.cathedralLabel) html += `<div class="cathedral-label">${scene.cathedralLabel}</div>`;
            if (scene.cathedralName) html += `<div class="cathedral-name">${scene.cathedralName}</div>`;
            html += '<div class="scene-text">';
            scene.text.forEach(p => { html += `<p>${p}</p>`; });
            html += '</div></div>';
            return html;
        },

        renderIllumination(scene) {
            let html = '<div class="scene-illumination">';
            if (scene.speaker) html += `<div class="speaker">${scene.speaker}</div>`;
            html += '<div class="scene-text">';
            scene.text.forEach(p => {
                if (p.startsWith('<p class="dialogue">')) {
                    html += p;
                } else {
                    html += `<p>${p}</p>`;
                }
            });
            html += '</div></div>';
            return html;
        },

        renderEnding(scene) {
            let html = '<div class="scene-ending">';
            html += '<div class="ending-label">Opus Completum</div>';
            html += `<div class="ending-title">${scene.endingTitle}</div>`;
            html += '<div class="scene-text">';
            scene.text.forEach(p => { html += `<p>${p}</p>`; });
            html += '</div>';
            html += '<div class="the-end">Finis</div>';
            html += '</div>';
            return html;
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">No discoveries yet...</p>';
            } else {
                list.innerHTML = this.facts.map(f => `<div class="fact-item">${f}</div>`).join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    engine.init();
    </script>
