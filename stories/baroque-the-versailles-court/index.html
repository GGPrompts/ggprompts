<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive educational story: The Court of the Sun King — A Baroque Interactive Story. The Young King. A visual, narrated learning experience from GG P...">
    <title>The Court of the Sun King — A Baroque Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        /* ===================================================
           BAROQUE DESIGN SYSTEM — CSS
           Adapted from baroque.html style guide
        =================================================== */
        :root {
            /* Baroque Palette */
            --deep-burgundy: #4a0020;
            --burgundy-light: #6e1040;
            --burgundy-glow: #8a2050;
            --royal-gold: #d4a017;
            --gold-light: #f0d060;
            --gold-pale: #f8e8a0;
            --gold-dark: #a07a10;
            --midnight-blue: #1a1a3e;
            --blue-deep: #12122e;
            --blue-light: #2a2a5e;
            --ivory: #f5f0e0;
            --ivory-warm: #ede5d0;
            --ivory-dark: #d8d0b8;
            --walnut: #3e2723;
            --walnut-light: #5d4037;
            --walnut-dark: #2a1a15;
            --verdigris: #2e8b57;
            --plum: #6a1b4d;

            /* Semantic Colors */
            --bg-primary: #0e0e1a;
            --bg-secondary: #161628;
            --bg-card: #1a1a30;
            --bg-elevated: #222240;
            --text-primary: var(--ivory);
            --text-secondary: #b8b0a0;
            --text-muted: #888070;
            --text-gold: var(--royal-gold);
            --accent: var(--royal-gold);
            --border-gold: rgba(212, 160, 23, 0.35);
            --border-gold-strong: rgba(212, 160, 23, 0.6);

            /* Typography */
            --font-display: 'Cinzel', serif;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Cormorant Garamond', serif;

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 32px;
            --space-xl: 64px;
            --space-2xl: 96px;

            /* Shadows */
            --shadow-chiaroscuro: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-gold-glow: 0 0 30px rgba(212, 160, 23, 0.2), 0 0 60px rgba(212, 160, 23, 0.1);
            --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 1px rgba(212, 160, 23, 0.3);

            /* Gradients */
            --gradient-gold: linear-gradient(135deg, var(--gold-dark), var(--royal-gold), var(--gold-light), var(--royal-gold), var(--gold-dark));
            --gradient-burgundy: linear-gradient(135deg, var(--deep-burgundy), var(--burgundy-light));
            --gradient-velvet: linear-gradient(180deg, rgba(74, 0, 32, 0.3), rgba(26, 26, 62, 0.5));

            /* Radii */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 400;
            line-height: 1.75;
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Texture */
        .bg-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 800px 600px at 20% 10%, rgba(74, 0, 32, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 600px 800px at 80% 30%, rgba(26, 26, 62, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 50% 80%, rgba(106, 27, 77, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse 300px 300px at 70% 60%, rgba(212, 160, 23, 0.04) 0%, transparent 70%);
        }

        .bg-texture::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        /* ===================================================
           ORNAMENTAL ELEMENTS
        =================================================== */
        .flourish {
            text-align: center;
            margin: var(--space-lg) 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-md);
        }

        .flourish::before,
        .flourish::after {
            content: '';
            flex: 1;
            max-width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-gold-strong), var(--royal-gold), var(--border-gold-strong), transparent);
        }

        .flourish-ornament {
            color: var(--royal-gold);
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(212, 160, 23, 0.4);
        }

        /* ===================================================
           TITLE SCREEN
        =================================================== */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
        }

        .title-crest {
            font-size: 3rem;
            color: var(--royal-gold);
            margin-bottom: var(--space-md);
            text-shadow: var(--shadow-gold-glow);
        }

        .title-era-badge {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--royal-gold);
            padding: var(--space-sm) var(--space-lg);
            border: 1px solid var(--border-gold-strong);
            margin-bottom: var(--space-lg);
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 7vw, 4rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--royal-gold);
            text-shadow: var(--shadow-gold-glow);
            margin-bottom: var(--space-sm);
            line-height: 1.2;
        }

        .title-subtitle {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }

        .title-tagline {
            font-family: var(--font-body);
            font-style: italic;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.8;
            margin-bottom: var(--space-xl);
            font-size: 1.15rem;
        }

        .title-start {
            font-family: var(--font-display);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: var(--space-md) var(--space-xl);
            border: 2px solid var(--royal-gold);
            background: transparent;
            color: var(--royal-gold);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .title-start::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gradient-gold);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .title-start:hover {
            color: #1a0e00;
            border-color: var(--gold-light);
        }

        .title-start:hover::before {
            left: 0;
        }

        .title-credits {
            margin-top: var(--space-lg);
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: rgba(245, 240, 224, 0.35);
            letter-spacing: 0.15em;
            font-style: italic;
        }

        /* ===================================================
           SCENE WRAPPER
        =================================================== */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .scene-wrapper.active {
            display: flex;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-md);
            margin-bottom: var(--space-lg);
            border-bottom: 1px solid var(--border-gold);
        }

        .scene-era-label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--royal-gold);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .scene-perspective {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-style: italic;
        }

        /* Scene Content */
        .scene-content {
            animation: sceneFadeIn 0.8s ease-out;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Headers */
        .section-header {
            text-align: center;
            margin-bottom: var(--space-lg);
        }

        .section-number {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--royal-gold);
            opacity: 0.3;
            margin-bottom: var(--space-xs);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--royal-gold);
            margin-bottom: var(--space-sm);
        }

        .section-line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--royal-gold), transparent);
            margin: 0 auto;
        }

        /* Body text */
        .type-body {
            font-size: 1.1rem;
            max-width: 65ch;
            margin: 0 auto var(--space-md);
            line-height: 1.85;
            text-align: left;
        }

        .type-body:last-of-type {
            margin-bottom: 0;
        }

        .text-gold { color: var(--royal-gold); }
        .text-burgundy { color: var(--burgundy-glow); }
        .text-verdigris { color: var(--verdigris); }

        /* Cards (Cartouches) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--space-lg);
            margin: var(--space-lg) 0;
        }

        .card {
            padding: var(--space-lg);
            border: 1px solid var(--border-gold-strong);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            box-shadow: var(--shadow-card);
            position: relative;
            transition: all 0.3s ease;
            margin-bottom: var(--space-md);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            pointer-events: none;
        }

        .card:hover {
            box-shadow: var(--shadow-chiaroscuro), var(--shadow-gold-glow);
            border-color: var(--royal-gold);
        }

        .card-icon {
            font-size: 2rem;
            text-align: center;
            margin-bottom: var(--space-md);
            color: var(--royal-gold);
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            letter-spacing: 0.08em;
            color: var(--royal-gold);
            margin-bottom: var(--space-sm);
            text-align: center;
        }

        .card-content {
            color: var(--text-secondary);
            line-height: 1.75;
            font-size: 1rem;
        }

        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: var(--space-md);
            margin: var(--space-lg) 0;
        }

        .stat-item {
            text-align: center;
            padding: var(--space-md);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            background: rgba(26, 26, 48, 0.6);
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: var(--royal-gold);
            letter-spacing: 0.05em;
        }

        .stat-label {
            font-family: var(--font-body);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: var(--space-xs);
        }

        /* Fact Box */
        .fact-box {
            position: relative;
            padding: var(--space-lg);
            margin: var(--space-lg) 0;
            border: 1px solid var(--border-gold-strong);
            border-radius: var(--radius-md);
            background: rgba(212, 160, 23, 0.04);
        }

        .fact-box::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            pointer-events: none;
        }

        .fact-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--royal-gold);
            margin-bottom: var(--space-sm);
            font-weight: 600;
        }

        .fact-box p {
            color: var(--text-secondary);
            line-height: 1.75;
            font-size: 0.95rem;
        }

        /* Dialogue Block */
        .dialogue-block {
            padding: var(--space-lg);
            margin: var(--space-lg) 0;
            text-align: center;
            position: relative;
            border-left: 3px solid var(--border-gold-strong);
            background: rgba(74, 0, 32, 0.08);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .dialogue-speaker {
            font-family: var(--font-display);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--royal-gold);
            margin-bottom: var(--space-sm);
        }

        .dialogue-text {
            font-family: var(--font-heading);
            font-style: italic;
            color: var(--text-primary);
            line-height: 1.85;
            font-size: 1.1rem;
        }

        /* Interactive: Expandable Sections */
        .expandable {
            margin: var(--space-md) 0;
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .expandable:hover {
            border-color: var(--border-gold-strong);
        }

        .expandable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-card);
            cursor: pointer;
            transition: background 0.3s ease;
            user-select: none;
        }

        .expandable-header:hover {
            background: var(--bg-elevated);
        }

        .expandable-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--royal-gold);
        }

        .expandable-arrow {
            color: var(--royal-gold);
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }

        .expandable.open .expandable-arrow {
            transform: rotate(180deg);
        }

        .expandable-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background: rgba(26, 26, 48, 0.4);
        }

        .expandable.open .expandable-body {
            max-height: 800px;
        }

        .expandable-content {
            padding: var(--space-md) var(--space-lg);
            color: var(--text-secondary);
            line-height: 1.75;
            font-size: 0.95rem;
        }

        /* Interactive: Quiz */
        .quiz-box {
            margin: var(--space-lg) 0;
            padding: var(--space-lg);
            border: 1px solid var(--border-gold-strong);
            border-radius: var(--radius-md);
            background: var(--bg-card);
        }

        .quiz-question {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            font-style: italic;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .quiz-option {
            display: flex;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: left;
        }

        .quiz-option:hover:not(.answered) {
            border-color: var(--royal-gold);
            background: rgba(212, 160, 23, 0.06);
        }

        .quiz-option.correct {
            border-color: var(--verdigris);
            background: rgba(46, 139, 87, 0.15);
            color: #a0e8c0;
        }

        .quiz-option.incorrect {
            border-color: var(--deep-burgundy);
            background: rgba(74, 0, 32, 0.15);
            color: #d88;
        }

        .quiz-option.answered {
            cursor: default;
        }

        .quiz-result {
            margin-top: var(--space-md);
            padding: var(--space-md);
            font-size: 0.95rem;
            color: var(--text-secondary);
            display: none;
            line-height: 1.7;
        }

        .quiz-result.visible {
            display: block;
        }

        /* Choices */
        .choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            margin-top: var(--space-xl);
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }

        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-btn {
            display: flex;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            border: 1px solid var(--border-gold-strong);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(212, 160, 23, 0.08);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .choice-btn:hover {
            border-color: var(--royal-gold);
            box-shadow: var(--shadow-gold-glow);
        }

        .choice-btn:hover::before {
            left: 0;
        }

        .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: 1px solid var(--royal-gold);
            border-radius: var(--radius-sm);
            color: var(--royal-gold);
            font-family: var(--font-display);
            font-weight: 700;
            margin-right: var(--space-md);
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        /* Game Controls */
        .game-controls {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-gold);
        }

        .ctrl-btn {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: var(--space-sm) var(--space-lg);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ctrl-btn:hover {
            border-color: var(--royal-gold);
            color: var(--royal-gold);
        }

        /* Transition Overlay */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .transition-overlay.active {
            opacity: 1;
        }

        .transition-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(14, 14, 26, 0.95), rgba(22, 22, 40, 0.92));
        }

        .transition-ornament {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: var(--royal-gold);
            opacity: 0.6;
            animation: ornamentPulse 1.5s ease-in-out infinite;
        }

        @keyframes ornamentPulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Fact Tracker */
        .fact-tracker {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 500;
        }

        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid var(--royal-gold);
            border-radius: var(--radius-sm);

<body>
    <div class="bg-texture"></div>

            <h1>The Court of<br>the Sun King</h1>

            <a href="../index.html" class="back-to-stories" style="display:inline-block;margin-top:1.5rem;color:inherit;text-decoration:none;font-size:0.8rem;opacity:0.5;transition:opacity 0.2s;font-family:var(--font-body);" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">&larr; All Stories</a>
        </div>

        <!-- Scene Container -->

    <script>
    // ===================================================
    //  THE COURT OF THE SUN KING -- Story Data
    // ===================================================

    const STORY = {

        // --- SCENE 1: The Young King ---
        the_young_king: {
            year: '1661',
            content: `
                <div class="section-header">
                    <div class="section-number">I</div>
                    <h2 class="section-title">The Young King</h2>
                    <div class="section-line"></div>
                </div>

                <div class="flourish"><span class="flourish-ornament">&#10048;</span></div>

                <p class="type-body">On March 9, 1661, Cardinal Mazarin, the chief minister who has governed France since Louis XIV was a child, dies in Vincennes. The next morning, the Archbishop of Rouen asks the twenty-two-year-old king a question that will reshape Europe: <em class="text-gold">"To whom shall we address ourselves hereafter?"</em></p>

                <div class="dialogue-block">
                    <div class="dialogue-speaker">Louis XIV</div>
                    <div class="dialogue-text">"To me."</div>
                </div>

                <p class="type-body">With those two words, Louis XIV abolishes the position of chief minister and declares personal rule over France. No French king has governed without one in living memory. The courtiers are stunned. The foreign ambassadors are skeptical. The young man they have dismissed as a dancing king with a taste for theater is about to become the most powerful monarch in European history.</p>

                <p class="type-body">But Louis has learned a hard lesson. In 1648, when he was just ten years old, Parisian mobs invaded the royal palace during the civil wars known as the <span class="hover-reveal">Fronde<span class="reveal-content">The Fronde (1648-1653) was a series of civil wars in France. Nobles and parliamentarians rebelled against royal authority. The young Louis was forced to flee Paris twice and once pretended to sleep while rioters searched his bedchamber.</span></span>. He was forced to pretend to be asleep while armed men filed through his bedroom. He never forgot it. He never forgave it.</p>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>Cardinal Mazarin died on March 9, 1661. When asked who would govern, Louis replied "To me" (or in some accounts, "To myself"). He was 22 years old and would rule France personally for the next 54 years without a chief minister, the longest reign of any European monarch in recorded history.</p>
                </div>
            `,
            fact: 'Louis XIV began personal rule at age 22 in 1661 after Mazarin\'s death, famously declaring "To me" when asked who would govern. He reigned for 54 years without a chief minister.',
            choices: [
                { text: 'Witness the arrest of Fouquet', next: 'fouquet_arrest' },
                { text: 'See the hunting lodge at Versailles', next: 'hunting_lodge' },
                { text: 'Learn about the Sun King persona', next: 'sun_king' }
            ]
        },

        // --- SCENE 2A: Fouquet's Arrest ---
        fouquet_arrest: {
            year: '1661',
            perspective: 'THE POLITICS OF ENVY',
            content: `
                <div class="section-header">
                    <div class="section-number">II</div>
                    <h2 class="section-title">The Fall of Fouquet</h2>
                    <div class="section-line"></div>
                </div>

                <p class="type-body">On August 17, 1661, Nicolas Fouquet, the Superintendent of Finances, hosts the most extravagant party France has ever seen at his newly built chateau of <em class="text-gold">Vaux-le-Vicomte</em>. Six thousand guests feast on gold plates. Moliere premieres a new comedy. A fireworks display lights up the Seine valley. Le Notre's geometric gardens stretch to the horizon.</p>

                <p class="type-body">Louis XIV attends. He is 23 years old. He watches everything. He says nothing.</p>

                <div class="card">
                    <div class="card-icon">&#9827;</div>
                    <h3 class="card-title">Vaux-le-Vicomte</h3>
                    <p class="card-content">Fouquet's chateau brought together three artists who would later create Versailles: architect Louis Le Vau, painter Charles Le Brun, and landscape designer Andre Le Notre. The chateau cost 18 million livres to build and was so magnificent that it sealed Fouquet's fate. Louis saw it as proof of embezzlement from royal coffers.</p>
                </div>

                <p class="type-body">Three weeks later, on September 5, 1661, d'Artagnan (yes, the real one &mdash; captain of the King's Musketeers) arrests Fouquet on Louis's orders. The charges: embezzlement and treason. The real crime: outshining the king.</p>

                <p class="type-body">Fouquet will spend the remaining 19 years of his life in the fortress of Pignerol. But Louis has learned something valuable from his rival's downfall. He has seen what Le Vau, Le Brun, and Le Notre can do &mdash; and he wants them to do it for <em>him</em>.</p>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>Nicolas Fouquet was arrested by d'Artagnan (Charles de Batz-Castelmore, Comte d'Artagnan) on September 5, 1661, just three weeks after the Vaux-le-Vicomte fete. The trial lasted three years. Louis commuted the court's sentence of banishment to life imprisonment. Fouquet died in the Pignerol fortress in 1680. Louis immediately hired Le Vau, Le Brun, and Le Notre to begin work on Versailles.</p>
                </div>
            `,
            fact: 'Fouquet\'s lavish fete at Vaux-le-Vicomte on August 17, 1661 so enraged Louis XIV that he had Fouquet arrested three weeks later by d\'Artagnan. Louis then hired Fouquet\'s artists for Versailles.',
            choices: [
                { text: 'See the transformation of Versailles', next: 'hunting_lodge' },
                { text: 'Explore the Sun King\'s image-making', next: 'sun_king' }
            ]
        },

        // --- SCENE 2B: The Hunting Lodge ---
        hunting_lodge: {
            year: '1664',
            perspective: 'THE ARCHITECTURE',
            content: `
                <div class="section-header">
                    <div class="section-number">II</div>
                    <h2 class="section-title">From Hunting Lodge to Palace</h2>
                    <div class="section-line"></div>
                </div>

                <p class="type-body">Versailles begins as a modest brick-and-stone hunting lodge built by Louis XIII in 1623 on marshy ground 12 miles southwest of Paris. It is, by the standards of French royalty, a humble place. The Duc de Saint-Simon calls it <em class="text-burgundy">"the saddest and most barren of places, with no view, no woods, no water, no soil."</em></p>

                <p class="type-body">Louis XIV does not care. He loves the place because his father loved it. And he sees something else: a blank canvas far from the treacherous politics of Paris, where he can build a world entirely under his control.</p>

                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value">2,300</div>
                        <div class="stat-label">Rooms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">67</div>
                        <div class="stat-label">Staircases</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">1,250</div>
                        <div class="stat-label">Fireplaces</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">800</div>
                        <div class="stat-label">Hectares of gardens</div>
                    </div>
                </div>

                <p class="type-body">Construction begins in earnest in 1664. The first phase, supervised by Le Vau, wraps the original hunting lodge in an "envelope" of new stone buildings &mdash; preserving Louis XIII's modest retreat at the heart of the growing palace like a pearl inside an oyster.</p>

                <div class="expandable" onclick="this.classList.toggle('open')">
                    <div class="expandable-header">
                        <span class="expandable-title">The Three Building Campaigns</span>
                        <span class="expandable-arrow">&#9660;</span>
                    </div>
                    <div class="expandable-body">
                        <div class="expandable-content">
                            <strong style="color:var(--royal-gold)">First Campaign (1664-1668):</strong> Le Vau's envelope wraps the old hunting lodge. The gardens take shape under Le Notre. Cost: 1.5 million livres.<br><br>
                            <strong style="color:var(--royal-gold)">Second Campaign (1669-1672):</strong> Le Vau builds the grand stone envelope, adds the terrace that will become the Hall of Mirrors. The workforce peaks at 22,000 men and 6,000 horses.<br><br>
                            <strong style="color:var(--royal-gold)">Third Campaign (1678-1715):</strong> Jules Hardouin-Mansart takes over after Le Vau's death. He builds the Hall of Mirrors, the Grand Trianon, the Chapel Royal, and the massive North and South Wings. The palace reaches its final form.
                        </div>
                    </div>
                </div>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>The Palace of Versailles grew from a 1623 hunting lodge to the largest palace in Europe across three major building campaigns (1664-1715). At peak construction, 36,000 workers labored on the site. The total cost is estimated at 2 billion livres (roughly $300 billion in modern terms), consuming approximately 25% of France's annual revenue during the heaviest years of construction.</p>
                </div>
            `,
            fact: 'Versailles grew from a 1623 hunting lodge to the largest palace in Europe. At peak construction, 36,000 workers labored on site. The total cost reached an estimated 2 billion livres.',
            choices: [
                { text: 'Enter the Hall of Mirrors', next: 'hall_of_mirrors' },
                { text: 'Explore the gardens of Le Notre', next: 'gardens' }
            ]
        },

        // --- SCENE 2C: The Sun King ---
        sun_king: {
            year: '1662',
            perspective: 'THE IMAGE',
            content: `
                <div class="section-header">
                    <div class="section-number">II</div>
                    <h2 class="section-title">Le Roi Soleil</h2>
                    <div class="section-line"></div>
                </div>

                <p class="type-body">In June 1662, Louis XIV hosts the <em class="text-gold">Grand Carrousel</em>, a spectacular equestrian tournament in the square that still bears its name in Paris. The king appears dressed as a Roman emperor, riding a magnificent horse, his shield emblazoned with a golden sun and the motto <em>Nec Pluribus Impar</em> &mdash; "Not Unequal to Many," meaning he alone is the equal of many kings.</p>

                <p class="type-body">This is not vanity. It is statecraft.</p>

                <div class="card-grid">
                    <div class="card">
                        <div class="card-icon">&#9788;</div>
                        <h3 class="card-title">The Solar Mythology</h3>
                        <p class="card-content">Louis chose Apollo, the Greek sun god, as his personal symbol. Apollo drives his chariot across the sky, bringing light and order. The sun rises, governs the day, and all things revolve around it. The metaphor was deliberate: Louis was the source of all power, warmth, and civilization.</p>
                    </div>
                    <div class="card">
                        <div class="card-icon">&#127917;</div>
                        <h3 class="card-title">The Dancer King</h3>
                        <p class="card-content">Louis was a trained ballet dancer who performed in 40 major ballet productions between 1651 and 1670. In 1653, at age 14, he danced the role of Apollo in the Ballet Royal de la Nuit, rising as the sun at dawn after 13 hours of performance. His dancing body was itself a political statement of grace and power.</p>
                    </div>
                </div>

                <p class="type-body">Every aspect of Louis's public image is orchestrated. Le Brun paints him as Alexander the Great. Hyacinthe Rigaud's 1701 portrait shows him in coronation robes with impossibly elegant legs in silk stockings &mdash; Louis was 63 years old at the time but insisted on being painted with the legs of a dancer.</p>

                <div class="quiz-box" id="quiz1">
                    <div class="fact-label">Test Your Knowledge</div>
                    <div class="quiz-question">What role did young Louis XIV famously dance at age 14 in the Ballet Royal de la Nuit?</div>
                    <div class="quiz-options">
                        <button class="quiz-option" onclick="checkQuiz('quiz1', this, false)">Jupiter, king of the gods</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz1', this, true)">Apollo, the rising sun</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz1', this, false)">Mars, god of war</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz1', this, false)">Hercules, son of Zeus</button>
                    </div>
                    <div class="quiz-result" id="quiz1-result">Correct! In 1653, the 14-year-old Louis danced as the rising sun (Apollo) in the final act of the Ballet Royal de la Nuit, an all-night spectacle. This performance is considered the origin of his "Sun King" identity.</div>
                </div>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>Louis XIV danced the role of Apollo in the Ballet Royal de la Nuit on February 23, 1653. He performed in approximately 40 ballets between 1651 and 1670, only stopping when his expanding waistline made dancing undignified. He founded the Academie Royale de Danse in 1661 &mdash; the world's first professional dance institution, predecessor of the Paris Opera Ballet.</p>
                </div>
            `,
            fact: 'Louis XIV danced as Apollo in the Ballet Royal de la Nuit (1653) at age 14, birthing his "Sun King" identity. He founded the Academie Royale de Danse in 1661, the world\'s first dance institution.',
            choices: [
                { text: 'See how Versailles embodied this vision', next: 'hunting_lodge' },
                { text: 'Experience court ceremony at Versailles', next: 'daily_ceremony' }
            ]
        },

        // --- SCENE 3: The Hall of Mirrors ---
        hall_of_mirrors: {
            year: '1684',
            content: `
                <div class="section-header">
                    <div class="section-number">III</div>
                    <h2 class="section-title">The Hall of Mirrors</h2>
                    <div class="section-line"></div>
                </div>

                <div class="flourish"><span class="flourish-ornament">&#10022;</span></div>

                <p class="type-body">The <em class="text-gold">Galerie des Glaces</em> is completed in 1684. It is 240 feet long, 34 feet wide, and 40 feet high. Seventeen arched windows face the gardens to the west. Opposite each window stands an arched mirror of identical dimensions, composed of 21 individual mirror panes &mdash; 357 mirrors in total.</p>

                <p class="type-body">At sunset, the hall performs its most astonishing trick: the mirrors catch the dying light pouring through the western windows and multiply it, so the gallery glows as if lit from within. Twenty thousand candles in silver and crystal chandeliers amplify the effect after dark. It is the most expensive room ever built.</p>

                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value">357</div>
                        <div class="stat-label">Mirrors</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">20,000</div>
                        <div class="stat-label">Candles</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">240</div>
                        <div class="stat-label">Feet long</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">30</div>
                        <div class="stat-label">Le Brun paintings</div>
                    </div>
                </div>

                <p class="type-body">But the Hall of Mirrors is also an act of economic warfare. In 1665, Louis's finance minister Jean-Baptiste Colbert lured Venetian mirror-makers to France. Venice had jealously guarded the secret of large flat mirrors for centuries &mdash; the Murano glassmakers were forbidden from leaving on pain of death. Colbert's agents smuggled them out anyway.</p>

                <div class="expandable" onclick="this.classList.toggle('open')">
                    <div class="expandable-header">
                        <span class="expandable-title">Le Brun's Ceiling Paintings</span>
                        <span class="expandable-arrow">&#9660;</span>
                    </div>
                    <div class="expandable-body">
                        <div class="expandable-content">
                            Charles Le Brun painted 30 compositions on the ceiling of the Hall of Mirrors between 1681 and 1684. The central painting, "The King Governs Alone" (1661), shows Louis taking the reins of government. The other 29 paintings depict French military victories, diplomatic triumphs, and administrative reforms &mdash; all featuring Louis as a classical hero. It is the most ambitious propaganda program in European art.
                        </div>
                    </div>
                </div>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>The Hall of Mirrors was designed by Jules Hardouin-Mansart and decorated by Charles Le Brun between 1678 and 1684. The 357 mirrors were manufactured at the newly established Manufacture Royale de Glaces (now Saint-Gobain, still a Fortune 500 company). Venice's Council of Ten had threatened death to any glassmaker who fled &mdash; at least two of the defectors to France died under suspicious circumstances.</p>
                </div>
            `,
            fact: 'The Hall of Mirrors contains 357 mirrors made with stolen Venetian technology. Colbert smuggled mirror-makers from Murano despite Venice\'s death penalty for defectors. Saint-Gobain exists because of this espionage.',
            choices: [
                { text: 'Experience a day of court ceremony', next: 'daily_ceremony' },
                { text: 'Explore the gardens of Le Notre', next: 'gardens' }
            ]
        },

        // --- SCENE 4: The Gardens ---
        gardens: {
            year: '1680',
            content: `
                <div class="section-header">
                    <div class="section-number">IV</div>
                    <h2 class="section-title">The Gardens of Le Notre</h2>
                    <div class="section-line"></div>
                </div>

                <p class="type-body">Andre Le Notre's gardens at Versailles are not gardens in any normal sense. They are a philosophical argument made in greenery: nature herself must bow to the will of the king.</p>

                <p class="type-body">From the Hall of Mirrors, the eye travels down the Royal Avenue through a perfect geometric axis that stretches <em class="text-gold">over three miles</em> to the horizon. Every hedge, every fountain, every gravel path obeys the laws of mathematical perspective. The trees are clipped into walls. The flowers are arranged by color in patterns visible only from above. Nature is forced into submission.</p>

                <div class="card-grid">
                    <div class="card">
                        <div class="card-icon">&#9732;</div>
                        <h3 class="card-title">The Water Problem</h3>
                        <p class="card-content">Versailles had no natural water supply. Louis built the Machine de Marly (1684), a hydraulic marvel of 14 water wheels and 259 pumps that lifted water from the Seine 500 feet uphill through 3 stages. He also attempted to divert the entire River Eure through an aqueduct, a project abandoned after 30,000 soldiers working on it suffered massive casualties from malaria.</p>
                    </div>
                    <div class="card">
                        <div class="card-icon">&#9883;</div>
                        <h3 class="card-title">The Orangerie</h3>
                        <p class="card-content">Mansart's Orangerie (1684-1686) sheltered over 2,000 orange trees, including specimens over 200 years old. Some had been confiscated from Fouquet's Vaux-le-Vicomte. The building is 500 feet long with walls 16 feet thick to insulate the trees through winter without heating.</p>
                    </div>
                </div>

                <div class="quiz-box" id="quiz2">
                    <div class="fact-label">Test Your Knowledge</div>
                    <div class="quiz-question">How many fountains did Le Notre design for the gardens of Versailles?</div>
                    <div class="quiz-options">
                        <button class="quiz-option" onclick="checkQuiz('quiz2', this, false)">About 50 major fountains</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz2', this, false)">About 150 major fountains</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz2', this, true)">Over 1,400 fountains</button>
                        <button class="quiz-option" onclick="checkQuiz('quiz2', this, false)">About 600 fountains</button>
                    </div>
                    <div class="quiz-result" id="quiz2-result">Correct! The gardens contained over 1,400 fountains at their peak. Because there was never enough water pressure to run them all simultaneously, footmen would run ahead of the king as he walked through the gardens, signaling hidden engineers to turn on only the fountains Louis was approaching.</div>
                </div>

                <div class="fact-box">
                    <div class="fact-label">Historical Fact</div>
                    <p>The gardens of Versailles cover 800 hectares (nearly 2,000 acres). Le Notre employed up to 36,000 workers during the most intensive years of garden construction. The Grand Canal, dug between 1668 and 1679, is 1.6 km long and was used for gondola rides in Venetian boats given to Louis by the Doge of Venice. The Machine de Marly cost 5.5 million livres and required constant maintenance by 60 full-time workers.</p>
                </div>
            `,
            fact: 'The gardens contain over 1,400 fountains across 800 hectares. Because water pressure was never sufficient, footmen ran ahead of the king to turn on only the fountains he approached.',
            choices: [
                { text: 'Experience a day of court ceremony', next: 'daily_ceremony' },
                { text: 'Visit the Hall of Mirrors', next: 'hall_of_mirrors' }
            ]
        },

        // --- SCENE 5: Daily Ceremony (Convergence) ---
        daily_ceremony: {

            this.updateFactUI();
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('factTracker').style.display = 'none';
            document.getElementById('titleScreen').style.display = '';
        },

        goTo(id) {
            if (id === '_exit') {
                window.location.href = '../index.html';
                return;
            }

            const scene = STORY[id];
            if (!scene) return;

            // Transition
            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(id, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 400);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1000);
            } else {
                this.renderScene(id, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = id;
        },

        renderScene(sceneId, scene) {
            // Update year
            if (scene.year) {
                document.getElementById('sceneEraLabel').textContent = scene.year;
            }

            // Update perspective
            const perspEl = document.getElementById('scenePerspective');
            perspEl.textContent = scene.perspective || '';

            // Hide game controls on endings
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = sceneId.startsWith('ending') ? 'none' : '';

            const container = document.getElementById('sceneContent');
            let html = '<div class="scene-content">';

            html += scene.content;

            // Fact
            if (scene.fact) {
                this.addFact(scene.fact);
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    html += `<button class="choice-btn" onclick="engine.goTo('${choice.next}')">`;
                    html += `<span class="choice-key">${i + 1}</span>`;
                    html += `${choice.text}`;
                    html += `</button>`;
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            this.updateFactUI();
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">No facts discovered yet...</p>';
            } else {
                list.innerHTML = this.facts.map(f => `<div class="fact-item">${f}</div>`).join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    engine.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
