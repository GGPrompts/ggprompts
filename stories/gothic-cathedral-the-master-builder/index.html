<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Master Builder — A Gothic Cathedral Interactive Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Cinzel Decorative', 'Cinzel', serif;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;

            --stone-darkest: #0f0e0d;
            --stone-dark: #1a1816;
            --stone-mid: #2a2622;
            --stone-light: #3d3832;
            --stone-pale: #5a534b;

            --parchment: #e8dcc8;
            --parchment-dark: #d4c5aa;
            --parchment-faded: rgba(232, 220, 200, 0.7);

            --ruby: #8b1a1a;
            --ruby-glow: #c0392b;
            --sapphire: #1a3a6b;
            --sapphire-glow: #2e6bc6;
            --emerald: #1a5c3a;
            --emerald-glow: #27ae60;
            --gold: #c9a227;
            --gold-dim: #9a7b3f;
            --amber: #d4920b;

            --text-primary: var(--parchment);
            --text-secondary: var(--parchment-faded);
            --text-muted: rgba(232, 220, 200, 0.45);
            --bg-primary: var(--stone-darkest);
            --bg-secondary: var(--stone-dark);

            --border-stone: 1px solid var(--stone-light);
            --shadow-cathedral: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 20px rgba(201, 162, 39, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 17px; }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-primary);
            background: var(--bg-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Stone Texture Background */
        .texture-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.06;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(15, 14, 13, 0.5) 100%);
        }

        /* Rose Window Decorative Element (top of page) */
        .rose-window-bg {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            background: conic-gradient(
                from 0deg,
                var(--ruby) 0deg 30deg,
                var(--sapphire) 30deg 60deg,
                var(--emerald) 60deg 90deg,
                var(--ruby) 90deg 120deg,
                var(--sapphire) 120deg 150deg,
                var(--emerald) 150deg 180deg,
                var(--ruby) 180deg 210deg,
                var(--sapphire) 210deg 240deg,
                var(--emerald) 240deg 270deg,
                var(--ruby) 270deg 300deg,
                var(--sapphire) 300deg 330deg,
                var(--emerald) 330deg 360deg
            );
            border-radius: 50%;
            filter: blur(30px);
        }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .game-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 64px 32px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ═══════════════════════════════════════════
           POINTED ARCH MOTIF (CSS)
        ═══════════════════════════════════════════ */
        .pointed-arch {
            position: relative;
            text-align: center;
            margin-bottom: 2rem;
        }

        .pointed-arch svg {
            width: 120px;
            height: 80px;
            opacity: 0.3;
        }

        /* ═══════════════════════════════════════════
           TITLE SCREEN
        ═══════════════════════════════════════════ */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 96px 32px;
        }

        .title-cross {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--gold-dim);
            letter-spacing: 0.5em;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }

        .title-screen h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: var(--parchment);
            margin-bottom: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
        }

        .title-subtitle {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            max-width: 500px;
            margin: 0 auto 2rem;
            text-transform: uppercase;
        }

        .title-quote {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.03em;
            margin-bottom: 3rem;
            max-width: 500px;
            line-height: 1.7;
        }

        .title-start {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 14px 48px;
            border: 1px solid var(--gold-dim);
            background: transparent;
            color: var(--parchment);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .title-start::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--ruby);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .title-start:hover {
            border-color: var(--ruby);
            color: #fff;
        }

        .title-start:hover::before { left: 0; }

        .title-credits {
            margin-top: 3rem;
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.1em;
        }

        /* ═══════════════════════════════════════════
           ORNATE DIVIDER
        ═══════════════════════════════════════════ */
        .ornate-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 48px 0;
            color: var(--gold-dim);
        }

        .ornate-divider::before,
        .ornate-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }

        .ornate-divider span {
            font-family: var(--font-heading);
            font-size: 1rem;
            letter-spacing: 0.3em;
        }

        /* ═══════════════════════════════════════════
           SCENE CONTAINER
        ═══════════════════════════════════════════ */
        .scene-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .scene-wrapper.active {
            display: flex;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--stone-light);
        }

        .scene-era {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--gold-dim);
            text-transform: uppercase;
        }

        .scene-year {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--gold);
        }

        /* ═══════════════════════════════════════════
           SCENE TYPES
        ═══════════════════════════════════════════ */

        /* --- Nave (main narrative — stone wall feel) --- */
        .scene-nave {
            position: relative;
            padding: 32px;
            background: linear-gradient(to right, rgba(42, 38, 34, 0.3) 0%, rgba(26, 24, 22, 0.5) 2%, rgba(26, 24, 22, 0.5) 98%, rgba(42, 38, 34, 0.3) 100%);
            border-top: 1px solid var(--stone-light);
            border-bottom: 1px solid var(--stone-light);
            margin-bottom: 32px;
        }

        .scene-nave::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--ruby), var(--sapphire), var(--emerald));
            opacity: 0.4;
        }

        .scene-nave .scene-text p {
            margin-bottom: 16px;
        }

        .scene-nave .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Transept (discovery/exploration — stained glass glow) --- */
        .scene-transept {
            position: relative;
            background: linear-gradient(135deg, rgba(26, 58, 107, 0.15) 0%, rgba(26, 24, 22, 0.8) 30%, rgba(139, 26, 26, 0.1) 100%);
            border: 1px solid var(--stone-light);
            padding: 40px;
            margin-bottom: 32px;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.3),
                var(--shadow-cathedral);
        }

        .scene-transept::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(201, 162, 39, 0.15);
            pointer-events: none;
        }

        .scene-transept .scene-text p {
            margin-bottom: 16px;
        }

        .scene-transept .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Chapter House (information panels) --- */
        .scene-chapter-house {
            background: linear-gradient(145deg, rgba(42, 38, 34, 0.5) 0%, rgba(26, 24, 22, 0.7) 100%);
            border: 1px solid var(--stone-light);
            padding: 32px;
            position: relative;
            margin-bottom: 32px;
        }

        .scene-chapter-house::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-dim));
        }

        .scene-chapter-house .card-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            letter-spacing: 0.08em;
            color: var(--parchment);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .scene-chapter-house .scene-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .scene-chapter-house .scene-text p {
            margin-bottom: 16px;
        }

        .scene-chapter-house .scene-text p:last-child {
            margin-bottom: 0;
        }

        /* --- Ending --- */
        .scene-ending {
            text-align: center;
            padding: 64px 32px;
            margin-bottom: 32px;
        }

        .scene-ending .ending-label {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: var(--gold);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .scene-ending .ending-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--parchment);
            margin-bottom: 32px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .scene-ending .scene-text {
            max-width: 550px;
            margin: 0 auto;
        }

        .scene-ending .scene-text p {
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .scene-ending .the-end {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            letter-spacing: 0.6em;
            color: var(--gold-dim);
            margin-top: 48px;
            text-transform: uppercase;
        }

        /* ═══════════════════════════════════════════
           DROP CAP
        ═══════════════════════════════════════════ */
        .dropcap { position: relative; }

        .dropcap::first-letter {
            float: left;
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.75;
            padding-right: 10px;
            padding-top: 6px;
            color: var(--ruby);
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        }

        /* ═══════════════════════════════════════════
           BLOCKQUOTE
        ═══════════════════════════════════════════ */
        .scene-blockquote {
            font-family: var(--font-body);
            font-size: 1.3rem;
            font-style: italic;
            line-height: 1.6;
            padding: 24px 32px;
            margin: 24px 0;
            border-left: 3px solid var(--gold-dim);
            background: rgba(201, 162, 39, 0.05);
            color: var(--text-secondary);
        }

        .scene-blockquote cite {
            display: block;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-style: normal;
            letter-spacing: 0.08em;
            margin-top: 12px;
            color: var(--text-muted);
        }

        /* ═══════════════════════════════════════════
           HISTORICAL FACT CARD
        ═══════════════════════════════════════════ */
        .historical-card {
            background: linear-gradient(145deg, rgba(42, 38, 34, 0.6) 0%, rgba(26, 24, 22, 0.8) 100%);
            border: 1px solid var(--stone-light);
            padding: 24px;
            margin: 24px 0;
            position: relative;
            box-shadow: var(--shadow-glow);
        }

        .historical-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--ruby), var(--gold), var(--sapphire));
        }

        .historical-card .card-label {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .historical-card .card-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: var(--parchment);
            margin-bottom: 10px;
        }

        .historical-card .card-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* ═══════════════════════════════════════════
           INTERACTIVE DIAGRAM
        ═══════════════════════════════════════════ */
        .diagram-container {
            background: var(--stone-dark);
            border: 1px solid var(--stone-light);
            padding: 24px;
            margin: 24px 0;
            text-align: center;
        }

        .diagram-container h4 {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--gold);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .diagram-container svg {
            max-width: 100%;
            height: auto;
        }

        .diagram-container .diagram-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 12px;
        }

        .diagram-labels text {
            font-family: 'Cinzel', serif;
            fill: var(--parchment);
        }

        /* ═══════════════════════════════════════════
           TIMELINE
        ═══════════════════════════════════════════ */
        .timeline {
            position: relative;
            padding-left: 32px;
            margin: 24px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--gold-dim), var(--stone-light));
        }

        .timeline-entry {
            position: relative;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(42, 38, 34, 0.4);
            border: 1px solid var(--stone-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeline-entry::before {
            content: '';
            position: absolute;
            left: -28px; top: 16px;
            width: 10px; height: 10px;
            background: var(--gold-dim);
            border-radius: 50%;
            border: 2px solid var(--stone-darkest);
            transition: all 0.3s;
        }

        .timeline-entry:hover {
            border-color: var(--gold-dim);
            background: rgba(42, 38, 34, 0.7);
        }

        .timeline-entry:hover::before {
            background: var(--gold);
            box-shadow: 0 0 8px rgba(201, 162, 39, 0.4);
        }

        .timeline-entry .tl-year {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .timeline-entry .tl-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 4px;
        }

        .timeline-entry .tl-detail {
            display: none;
            font-size: 0.85rem;
            color: var(--parchment-faded);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--stone-light);
            line-height: 1.7;
        }

        .timeline-entry.expanded .tl-detail {
            display: block;
            animation: factSlideIn 0.4s ease-out;
        }

        /* ═══════════════════════════════════════════
           FACT DISCOVERED TOAST
        ═══════════════════════════════════════════ */
        .fact-found {
            display: inline-block;
            background: rgba(201, 162, 39, 0.12);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 16px 6px 28px;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            margin-top: 24px;
            position: relative;
            animation: factSlideIn 0.6s ease-out;
            text-transform: uppercase;
        }

        .fact-found::before {
            content: '';
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            width: 8px; height: 8px;
            background: var(--gold);
            border-radius: 50%;
        }

        @keyframes factSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ═══════════════════════════════════════════
           CHOICES
        ═══════════════════════════════════════════ */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 28px;
            opacity: 0;
            animation: choicesFadeIn 0.6s ease-out 0.8s forwards;
        }

        @keyframes choicesFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-btn {
            display: flex;
            align-items: center;
            padding: 12px 28px;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            border: 1px solid var(--stone-light);
            background: transparent;
            color: var(--parchment);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            text-align: left;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--ruby);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .choice-btn:hover {
            border-color: var(--ruby);
            color: #fff;
        }

        .choice-btn:hover::before { left: 0; }

        .choice-btn .choice-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px; height: 24px;
            border: 1px solid var(--stone-pale);
            font-size: 0.7rem;
            color: var(--gold-dim);
            margin-right: 16px;
            flex-shrink: 0;
        }

        .choice-btn:hover .choice-key {
            border-color: rgba(255,255,255,0.4);
            color: #fff;
        }

        .choice-btn.btn-bold {
            border-color: var(--ruby);
        }

        .choice-btn.btn-cautious {
            border-color: var(--sapphire);
        }

        .choice-btn.btn-cautious::before {
            background: var(--sapphire);
        }

        .choice-btn.btn-cautious:hover {
            border-color: var(--sapphire-glow);
        }

        /* ═══════════════════════════════════════════
           TRANSITION
        ═══════════════════════════════════════════ */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            background: var(--stone-darkest);
        }

        .transition-overlay.active {
            pointer-events: all;
            animation: pageTransition 1s ease-in-out;
        }

        @keyframes pageTransition {
            0% { opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ═══════════════════════════════════════════
           SCENE FADE IN
        ═══════════════════════════════════════════ */
        .scene-content {
            animation: sceneFadeIn 0.8s ease-out;
        }

        @keyframes sceneFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════
           KNOWLEDGE TRACKER
        ═══════════════════════════════════════════ */
        .fact-tracker {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            max-width: 280px;
        }

        .fact-tracker-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--stone-light);
            color: var(--gold);
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: auto;
            text-transform: uppercase;
        }

        .fact-tracker-toggle:hover {
            border-color: var(--gold-dim);
            box-shadow: var(--shadow-glow);
        }

        .fact-tracker-panel {
            display: none;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--stone-light);
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .fact-tracker-panel.open {
            display: block;
            animation: panelSlideIn 0.3s ease-out;
        }

        @keyframes panelSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fact-tracker-panel h4 {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--gold-dim);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .fact-item {
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: var(--gold);
            padding: 6px 0;
            border-bottom: 1px solid var(--stone-light);
            animation: factSlideIn 0.4s ease-out;
            line-height: 1.5;
        }

        .fact-item:last-child { border-bottom: none; }

        .no-facts {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ═══════════════════════════════════════════
           GAME CONTROLS
        ═══════════════════════════════════════════ */
        .game-controls {
            display: flex;
            gap: 0.75rem;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--stone-light);
        }

        .ctrl-btn {
            padding: 8px 16px;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            border: 1px solid var(--stone-light);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .ctrl-btn:hover {
            border-color: var(--gold-dim);
            color: var(--parchment);
        }

        /* ═══════════════════════════════════════════
           SCROLLBAR
        ═══════════════════════════════════════════ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--stone-pale); }
        ::selection { background: var(--ruby); color: var(--parchment); }

        /* ═══════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════ */
        @media (max-width: 768px) {
            html { font-size: 16px; }
            .game-container { padding: 32px 16px; }
            .title-screen { padding: 48px 16px; }
            .scene-transept { padding: 24px; }
            .scene-transept::before {
                top: 4px; left: 4px; right: 4px; bottom: 4px;
            }
            .dropcap::first-letter { font-size: 3.2rem; }
            .fact-tracker { right: 0.75rem; top: 0.75rem; max-width: 220px; }
            .choice-btn { width: 100%; }
            .rose-window-bg { width: 300px; height: 300px; top: -120px; }
            .diagram-container { padding: 16px; }
            .timeline { padding-left: 24px; }
        }
    </style>
</head>
<body>
    <div class="texture-bg"></div>
    <div class="vignette"></div>
    <div class="rose-window-bg"></div>

    <!-- Page transition overlay -->
    <div class="transition-overlay" id="transition"></div>

    <!-- Knowledge Tracker -->
    <div class="fact-tracker" id="factTracker" style="display: none;">
        <button class="fact-tracker-toggle" id="factToggle">
            <span>Builder's Knowledge</span>
            <span id="factCount">0</span>
        </button>
        <div class="fact-tracker-panel" id="factPanel">
            <h4>Masonry Secrets Uncovered</h4>
            <div id="factList">
                <p class="no-facts">No secrets yet discovered...</p>
            </div>
        </div>
    </div>

    <div class="game-container">
        <!-- Title Screen -->
        <div class="title-screen" id="titleScreen">
            <div class="pointed-arch">
                <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 80 L10 30 Q60 -10 110 30 L110 80" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.4" color="#9a7b3f"/>
                    <path d="M20 80 L20 35 Q60 0 100 35 L100 80" stroke="currentColor" stroke-width="1" fill="none" opacity="0.25" color="#9a7b3f"/>
                    <circle cx="60" cy="22" r="8" stroke="currentColor" stroke-width="1" fill="none" opacity="0.3" color="#9a7b3f"/>
                </svg>
            </div>
            <h1>The Master Builder</h1>
            <div class="title-subtitle">A Gothic Cathedral Interactive Story</div>
            <p class="title-quote">"We who cut mere stones must always be envisioning cathedrals."</p>
            <button class="title-start" id="startBtn">Enter the Lodge</button>
            <p class="title-credits">A story of stone, light, and the men who built heaven on earth</p>
            <a href="../index.html" class="back-to-stories" style="display:inline-block;margin-top:1.5rem;color:inherit;text-decoration:none;font-size:0.8rem;opacity:0.5;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">&larr; All Stories</a>
        </div>

        <!-- Scene Container -->
        <div class="scene-wrapper" id="sceneWrapper">
            <div class="scene-header">
                <span class="scene-era" id="sceneEra">The Foundation</span>
                <span class="scene-year" id="sceneYear">AD 1163</span>
            </div>
            <div id="sceneContent"></div>
            <div class="game-controls">
                <button class="ctrl-btn" id="restartBtn">Return to Title</button>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════
    //  THE MASTER BUILDER — Story Data
    // ═══════════════════════════════════════════════════════════════

    const STORY = {

        // -------------------------------------------------------
        // SCENE 1: THE SUMMONS TO BUILD
        // -------------------------------------------------------
        summons: {
            type: 'nave',
            era: 'THE SUMMONS',
            year: 'AD 1163',
            content: `<div class="scene-nave"><div class="scene-text">
                <p class="dropcap">The Bishop of Paris has summoned you. Maurice de Sully, son of a peasant family who rose through scholarship and iron will to become the most powerful churchman in France, stands before you in his private chambers beside the Seine. He speaks of a vision: a cathedral so vast, so luminous, that the faithful will believe they have entered the gates of Heaven itself.</p>
                <p>"The old cathedral of Saint-&Eacute;tienne is crumbling," he says, his eyes burning with conviction. "Paris deserves a house of God worthy of its name. I want you to build it. I want you to build <strong>Notre-Dame</strong>."</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Bishop Maurice de Sully &amp; Notre-Dame de Paris</div><div class="card-text">In 1160, Maurice de Sully became Bishop of Paris and immediately began planning a new cathedral. On the site of the old basilica of Saint-&Eacute;tienne, Pope Alexander III laid the cornerstone in 1163. The choir was completed by 1182, and the entire cathedral would not be finished until roughly 1345&mdash;a span of 182 years encompassing the reigns of seven kings.</div></div>
                <p>You are a <em>ma&icirc;tre d'&oelig;uvre</em>&mdash;a master builder. Not an architect in the modern sense, but something more: engineer, geometer, foreman, and artist combined. You have spent twenty years learning your craft in the mason's lodge, from cutting ashlar blocks to computing the thrust of an arch. Now the greatest commission in Christendom lies before you.</p>
                <p>But first, you must decide how to begin.</p>
            </div></div>`,
            fact: 'Notre-Dame de Paris was begun in 1163 under Bishop Maurice de Sully. Its construction took roughly 182 years, finishing around 1345.',
            choices: [
                { text: 'Study the innovations at Saint-Denis first', next: 'saint_denis', style: 'btn-cautious' },
                { text: 'Begin with the foundation stone immediately', next: 'foundation', style: 'btn-bold' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 2a: THE BIRTH OF GOTHIC AT SAINT-DENIS
        // -------------------------------------------------------
        saint_denis: {
            type: 'transept',
            era: 'THE ORIGIN',
            year: 'AD 1144 (recalled)',
            content: `<div class="scene-transept"><div class="scene-text">
                <p class="dropcap">Before you lay a single stone, you travel north to the Abbey of Saint-Denis, where twenty years ago Abbot Suger created the first truly Gothic building. You were a boy then, apprenticed to your father's mason lodge, but you remember the stories: how Suger tore down the dark Carolingian walls and replaced them with walls of light.</p>
                <p>Standing in Suger's ambulatory, you understand. The pointed arches do not merely hold weight&mdash;they channel it downward with brutal efficiency. The ribbed vaults overhead distribute thrust along slender stone ribs instead of thick walls. And because the walls no longer bear the load, Suger filled them with <strong>stained glass</strong>&mdash;sheets of ruby, sapphire, and emerald that transform sunlight into scripture.</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Abbot Suger &amp; the Birth of Gothic (1137&ndash;1144)</div><div class="card-text">Abbot Suger of Saint-Denis is credited with creating the Gothic style. Between 1137 and 1144, he rebuilt the west facade and choir of the royal abbey church, combining pointed arches, ribbed vaults, and large stained-glass windows for the first time. Suger's theological philosophy of <em>lux nova</em>&mdash;divine new light&mdash;held that physical light streaming through colored glass could elevate the soul toward God.</div></div>
                <div class="scene-blockquote">"The dull mind rises to truth through that which is material. And, in seeing this light, is resurrected from its former submersion."<cite>&mdash; Abbot Suger, De Administratione, c. 1145</cite></div>
                <p>You sketch furiously. The three elements&mdash;pointed arch, ribbed vault, and flying buttress&mdash;are not inventions but <em>combinations</em>. Each existed before Suger. His genius was seeing how they worked together, each making the others possible. Now you must take his vision and scale it to an unprecedented size.</p>
            </div></div>`,
            fact: 'Abbot Suger created the first Gothic building at Saint-Denis (1137-1144), combining pointed arches, ribbed vaults, and stained glass under his philosophy of lux nova (divine new light).',
            choices: [
                { text: 'Return to Paris and lay the foundation', next: 'foundation', style: '' },
                { text: 'Study the geometry of sacred design', next: 'geometry', style: 'btn-cautious' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 2b: THE FOUNDATION
        // -------------------------------------------------------
        foundation: {
            type: 'chapter-house',
            era: 'THE FOUNDATION',
            year: 'AD 1163',
            cardTitle: 'Breaking Ground',
            content: `<div class="scene-chapter-house"><div class="card-title">Breaking Ground</div><div class="scene-text">
                <p>On an island in the Seine, your workers drive wooden piles into the marshy ground. The foundation must reach bedrock&mdash;in places, twenty feet below the surface. You have no power tools, no cranes, no concrete. Your equipment is rope, timber, iron, and human muscle.</p>
                <p>The work is brutal and exact. You use a <strong>plumb line</strong>&mdash;a lead weight on a string&mdash;to ensure every wall rises perfectly vertical. A <strong>square</strong> of wood and cord checks right angles. For curves, your masons use a compass of iron, their arms as long as a man's leg.</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Medieval Construction Tools</div><div class="card-text">Gothic cathedrals were built with remarkably simple tools: the plumb bob (lead weight on a string for vertical alignment), the mason's square, the compass, cord, and the level (a triangular frame with a hanging plumb line). For heavy lifting, builders used treadwheel cranes powered by men walking inside enormous wooden wheels&mdash;some reaching 20 feet in diameter. These cranes could lift stones weighing over a ton to heights exceeding 100 feet.</div></div>
                <p>You must decide how to organize your workforce. The lodge system provides two models: a small elite team of master masons who can ensure quality but work slowly, or a vast labor force that can raise walls quickly but risks errors.</p>
            </div></div>`,
            fact: 'Medieval builders used treadwheel cranes (up to 20 feet in diameter) powered by men walking inside giant wheels, lifting stones over a ton to heights exceeding 100 feet.',
            choices: [
                { text: 'Assemble a small lodge of master craftsmen', next: 'guild', style: 'btn-cautious' },
                { text: 'Recruit hundreds of laborers for rapid construction', next: 'workforce', style: 'btn-bold' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 3a: SACRED GEOMETRY
        // -------------------------------------------------------
        geometry: {
            type: 'transept',
            era: 'THE SECRET KNOWLEDGE',
            year: 'AD 1163',
            content: `<div class="scene-transept"><div class="scene-text">
                <p class="dropcap">In the mason's lodge, a timber building beside the construction site, you unroll sheets of parchment and begin to draw. The cathedral's proportions are not arbitrary&mdash;they are governed by sacred geometry, mathematical ratios believed to reflect the divine order of creation.</p>
                <p>Your primary tool is <em>ad quadratum</em>&mdash;design by the square. You inscribe a square, then rotate it 45 degrees to create an octagon. From these nested forms, every measurement flows: the width of the nave, the height of the vault, the spacing of the columns. The square root of 2 (approximately 1.414) becomes your fundamental ratio.</p>
                <div class="diagram-container">
                    <h4>Ad Quadratum &mdash; Design by the Square</h4>
                    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                        <rect x="50" y="50" width="200" height="200" fill="none" stroke="#9a7b3f" stroke-width="1.5" opacity="0.6"/>
                        <rect x="50" y="50" width="200" height="200" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4" transform="rotate(45 150 150)"/>
                        <circle cx="150" cy="150" r="100" fill="none" stroke="#8b1a1a" stroke-width="1" opacity="0.4"/>
                        <circle cx="150" cy="150" r="141" fill="none" stroke="#1a3a6b" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
                        <line x1="150" y1="50" x2="150" y2="250" stroke="#9a7b3f" stroke-width="0.5" opacity="0.3"/>
                        <line x1="50" y1="150" x2="250" y2="150" stroke="#9a7b3f" stroke-width="0.5" opacity="0.3"/>
                        <g class="diagram-labels" font-size="10" fill="#e8dcc8">
                            <text x="150" y="40" text-anchor="middle" opacity="0.7">1.000</text>
                            <text x="260" y="155" text-anchor="start" opacity="0.7">&radic;2</text>
                        </g>
                    </svg>
                    <p class="diagram-caption">The rotated square generates the &radic;2 ratio governing nave proportions. Click timeline entries below to explore how geometry shaped the great cathedrals.</p>
                </div>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Sacred Geometry in Gothic Architecture</div><div class="card-text">Medieval masons used two primary geometric systems: <em>ad quadratum</em> (by the square, ratio &radic;2 &asymp; 1.414) and <em>ad triangulum</em> (by the equilateral triangle, ratio &radic;3 &asymp; 1.732). These systems generated all proportions without written calculations. The master builder's design tools&mdash;compass and straightedge alone&mdash;could produce these ratios through pure geometric construction, a process masons guarded as trade secrets transmitted only within the lodge.</div></div>
                <p>Armed with these proportions, you return to Paris. The geometry is your secret language&mdash;a code written in stone that will outlast the builder's hand. Now you must raise the walls.</p>
            </div></div>`,
            fact: 'Gothic cathedrals were designed using ad quadratum (ratio sqrt 2) and ad triangulum (ratio sqrt 3) systems, generating all proportions through compass and straightedge alone.',
            choices: [
                { text: 'Begin the foundation work', next: 'foundation', style: '' },
                { text: 'Study the guild system before building', next: 'guild', style: 'btn-cautious' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 3b: THE GUILD SYSTEM
        // -------------------------------------------------------
        guild: {
            type: 'chapter-house',
            era: 'THE LODGE',
            year: 'AD 1170',
            cardTitle: 'The Masons\' Lodge',
            content: `<div class="scene-chapter-house"><div class="card-title">The Masons' Lodge</div><div class="scene-text">
                <p>Your lodge is a wooden structure beside the rising walls, part workshop, part school, part sanctuary. Here your masons eat, sleep, and guard the secrets of their craft. The guild hierarchy is absolute: <strong>apprentices</strong> (7 years of training), <strong>journeymen</strong> (traveling workers), and <strong>masters</strong> (those who have produced a <em>chef-d'&oelig;uvre</em>, a masterwork).</p>
                <p>Each mason marks his stones with a personal sigil&mdash;a geometric symbol unique to him. These marks serve as both quality control and payment records. Centuries from now, archaeologists will find thousands of these marks carved into cathedral stones, each one the signature of a craftsman whose name history has forgotten.</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">The Medieval Mason's Guild</div><div class="card-text">Medieval stonemasons organized into lodges (<em>loges</em> in French, <em>Bauhutten</em> in German) that functioned as trade unions, schools, and mutual aid societies. Apprenticeship lasted 7 years, after which a journeyman traveled to learn from different lodges. Master status required producing a masterwork judged by peers. The lodges jealously guarded construction secrets&mdash;geometric formulas, vault calculations, and structural techniques transmitted orally. The Regius Manuscript (c. 1390), the oldest known Masonic document, records lodge rules including penalties for revealing trade secrets.</div></div>
                <p>A dispute has arisen among your workers. The stone-cutters demand higher wages&mdash;they point out that at Chartres Cathedral, begun in <strong>1194</strong>, skilled masons earn twice what common laborers receive. Meanwhile, your timber workers threaten to leave for the castle-building projects in Normandy.</p>
            </div></div>`,
            fact: 'Mason apprenticeships lasted 7 years. The Regius Manuscript (c. 1390), the oldest known Masonic document, records lodge rules including penalties for revealing construction secrets.',
            choices: [
                { text: 'Raise wages and keep your skilled team intact', next: 'vaults', style: 'btn-cautious' },
                { text: 'Let the dissenters leave and train new apprentices', next: 'workforce', style: 'btn-bold' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 4a: THE GREAT WORKFORCE
        // -------------------------------------------------------
        workforce: {
            type: 'nave',
            era: 'THE LABOR',
            year: 'AD 1175',
            content: `<div class="scene-nave"><div class="scene-text">
                <p class="dropcap">You marshal an army of builders. At peak construction, your site employs over 300 workers: stone-cutters, mortar-mixers, carpenters, blacksmiths, glass-makers, lead-workers, and unskilled laborers who haul materials. The quarries at Vaugirard, south of Paris, supply limestone blocks ferried up the Seine on flat-bottomed barges.</p>
                <p>The organization is military in its precision. Work begins at dawn and ends at dusk&mdash;there is no artificial light adequate for precision stonework. In summer, masons work 16-hour days. In winter, the site largely shuts down, as frost ruins fresh mortar. You lose roughly four months each year to weather.</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Cathedral Workforce &amp; Economics</div><div class="card-text">Building a major Gothic cathedral typically required 200&ndash;400 workers at peak construction. Skilled masons earned approximately 4 pence per day in 13th-century England (roughly equivalent to a modern skilled tradesman's wage). The total cost of a cathedral like Chartres has been estimated at the equivalent of hundreds of millions of modern dollars. Funding came from the diocese, royal donations, pilgrim offerings, and the sale of relics and indulgences. Construction was a year-round enterprise except during hard winter freezes.</div></div>
                <p>The walls are rising, but you face a critical engineering decision. The nave must soar higher than any building in Paris. To achieve this, you need a way to support walls that are more window than stone. Two approaches present themselves.</p>
            </div></div>`,
            fact: 'Gothic cathedral construction employed 200-400 workers at peak. Skilled masons earned about 4 pence per day. Total cost of cathedrals like Chartres equaled hundreds of millions in modern currency.',
            choices: [
                { text: 'Engineer flying buttresses to support the walls', next: 'buttresses', style: 'btn-bold' },
                { text: 'Use thick walls and smaller windows for safety', next: 'vaults', style: 'btn-cautious' }
            ]
        },

        // -------------------------------------------------------
        // SCENE 5: FLYING BUTTRESSES (convergence point)
        // -------------------------------------------------------
        buttresses: {
            type: 'transept',
            era: 'THE INNOVATION',
            year: 'AD 1180',
            content: `<div class="scene-transept"><div class="scene-text">
                <p class="dropcap">This is the breakthrough that will define Gothic architecture for three centuries. You have conceived of an external skeleton of stone: half-arches that leap from freestanding piers across open air to press against the nave walls at precisely the point where the vault's outward thrust is greatest.</p>
                <p>You call them <em>arcs-boutants</em>&mdash;flying buttresses. They are engineering made visible, the bones of the building worn on the outside so that the interior can be pure space and light.</p>
                <div class="diagram-container">
                    <h4>Forces in a Flying Buttress</h4>
                    <svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
                        <!-- Ground -->
                        <line x1="0" y1="260" x2="360" y2="260" stroke="#5a534b" stroke-width="2"/>
                        <!-- Nave wall -->
                        <rect x="180" y="20" width="30" height="240" fill="none" stroke="#e8dcc8" stroke-width="1.5" opacity="0.7"/>
                        <!-- Vault indication -->
                        <path d="M180 20 Q195 5 210 20" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.6"/>
                        <!-- Buttress pier -->
                        <rect x="40" y="100" width="30" height="160" fill="none" stroke="#e8dcc8" stroke-width="1.5" opacity="0.7"/>
                        <!-- Flying buttress arch -->
                        <path d="M70 120 Q125 80 180 100" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.8"/>
                        <!-- Pinnacle weight -->
                        <path d="M45 100 L55 70 L65 100" fill="none" stroke="#e8dcc8" stroke-width="1.5" opacity="0.6"/>
                        <!-- Force arrows -->
                        <line x1="195" y1="60" x2="165" y2="90" stroke="#8b1a1a" stroke-width="2" marker-end="url(#arrowRed)" opacity="0.8"/>
                        <text x="135" y="75" font-size="9" fill="#c0392b" font-family="Cinzel, serif">THRUST</text>
                        <line x1="125" y1="100" x2="95" y2="130" stroke="#1a3a6b" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.8"/>
                        <text x="68" y="155" font-size="9" fill="#2e6bc6" font-family="Cinzel, serif">TRANSFER</text>
                        <line x1="55" y1="100" x2="55" y2="140" stroke="#1a5c3a" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.8"/>
                        <text x="12" y="135" font-size="9" fill="#27ae60" font-family="Cinzel, serif">DOWN</text>
                        <!-- Window indication -->
                        <rect x="185" y="110" width="20" height="50" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
                        <rect x="185" y="170" width="20" height="50" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
                        <text x="230" y="150" font-size="8" fill="#c9a227" font-family="Cinzel, serif" opacity="0.7">WINDOWS</text>
                        <!-- Arrow markers -->
                        <defs>
                            <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
                            </marker>
                            <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6bc6"/>
                            </marker>
                            <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
                            </marker>
                        </defs>
                    </svg>
                    <p class="diagram-caption">The vault pushes outward (red). The flying buttress transfers that thrust diagonally to the pier (blue). The pinnacle's weight drives the force straight down into the ground (green), freeing the nave walls for enormous windows.</p>
                </div>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">The Flying Buttress</div><div class="card-text">Flying buttresses first appeared at Notre-Dame de Paris around 1180, possibly the earliest example in a major cathedral. They solved a fundamental problem: Gothic vaults push outward as well as downward. Without buttresses, walls must be thick enough to absorb this lateral thrust, limiting window size. By transferring the load to external piers, builders could reduce walls to thin screens of glass and tracery. The pinnacles atop buttress piers are not decorative&mdash;their weight converts diagonal thrust into vertical force, preventing the pier from toppling.</div></div>
                <p>The flying buttresses work. Your walls grow thin as parchment, and the glaziers begin setting enormous windows into the freed openings. But the question of the windows themselves now demands your attention.</p>
            </div></div>`,
            fact: 'Flying buttresses first appeared at Notre-Dame (c. 1180). Pinnacles atop buttress piers are not decorative but functional, converting diagonal thrust into vertical force.',
            choices: [

            content: `<div class="scene-nave"><div class="scene-text">
                <p class="dropcap">One hundred and eight feet above the nave floor, your masons are building the vault. The technique is audacious: instead of a solid barrel of stone, you construct a skeleton of pointed ribs that spring from column capitals and meet at the apex. Between the ribs, thin stone panels called <em>webbing</em> fill the gaps. The result is a vault that weighs a fraction of a solid one, yet is just as strong.</p>
                <p>The pointed arch is the key. Unlike a round Roman arch, which can only span a given width at a fixed height, a pointed arch can be made steeper or shallower to span any width at any height. This means your masons can vault rectangular bays&mdash;impossible with semicircular arches&mdash;creating a rhythmic marching of bays down the nave.</p>
                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">Ribbed Vaults &amp; Pointed Arches</div><div class="card-text">The ribbed vault was developed in Durham Cathedral, England (begun 1093), but the pointed arch that made Gothic vaults possible came from Islamic architecture, likely transmitted through Norman Sicily and Crusader contact with the Middle East. The pointed arch's variable geometry allowed masons to vault rectangles, octagons, and irregular shapes&mdash;a revolutionary advance over the rigid semicircular Roman arch. At Notre-Dame, the nave vault reaches 108 feet (33 meters), a height not exceeded in Paris for 700 years.</div></div>

                <div class="historical-card"><div class="card-label">Historical Record</div><div class="card-title">The Art of Stained Glass</div><div class="card-text">Medieval stained glass was colored during manufacture by adding metallic oxides to molten glass: cobalt for blue, copper for green, manganese for purple, and gold chloride for the famous ruby red. The glass was blown into cylinders, cut open, and flattened into sheets. Details were painted in iron oxide pigite (grisaille) and fired in a kiln. Lead strips (cames) held the pieces together. Chartres Cathedral contains 176 stained-glass windows covering 27,000 square feet&mdash;one of the largest surviving collections of medieval glass in the world.</div></div>

            this.history = [];
            this.facts = [];
            this.factsPanelOpen = false;
            document.getElementById('factPanel').classList.remove('open');
            document.getElementById('sceneWrapper').classList.remove('active');
            document.getElementById('titleScreen').style.display = 'flex';
            document.getElementById('factTracker').style.display = 'none';
            this.updateFactUI();
            window.scrollTo(0, 0);
        },

        goTo(sceneId) {
            if (sceneId === '_restart') {
                this.restart();
                return;
            }
            if (sceneId === '_exit') {
                window.location.href = '../index.html';
                return;
            }

            const scene = STORY[sceneId];
            if (!scene) return;

            // Transition effect
            if (this.currentScene) {
                const overlay = document.getElementById('transition');
                overlay.classList.add('active');
                setTimeout(() => {
                    this.renderScene(sceneId, scene);
                    window.scrollTo({ top: 0, behavior: 'auto' });
                }, 400);
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 1000);
            } else {
                this.renderScene(sceneId, scene);
            }

            if (this.currentScene) {
                this.history.push(this.currentScene);
            }
            this.currentScene = sceneId;
        },

        renderScene(sceneId, scene) {
            const container = document.getElementById('sceneContent');
            const gameControls = document.querySelector('.game-controls');
            if (gameControls) gameControls.style.display = scene.type === 'ending' ? 'none' : '';

            // Update era and year
            if (scene.era) {
                document.getElementById('sceneEra').textContent = scene.era;
            }
            if (scene.year !== undefined) {
                document.getElementById('sceneYear').textContent = scene.year;
            }

            let html = '<div class="scene-content">';
            html += scene.content;

            // Fact notification
            if (scene.fact) {
                this.addFact(scene.fact);
            }

            // Choices
            if (scene.choices && scene.choices.length > 0) {
                html += '<div class="choices">';
                scene.choices.forEach((choice, i) => {
                    const styleClass = choice.style ? ' ' + choice.style : '';
                    html += '<button class="choice-btn' + styleClass + '" onclick="engine.goTo(\'' + choice.next + '\')">';
                    html += '<span class="choice-key">' + (i + 1) + '</span>';
                    html += choice.text;
                    html += '</button>';
                });
                html += '</div>';
            }

            html += '</div>';
            container.innerHTML = html;
            this.updateFactUI();
        },

        addFact(fact) {
            if (!this.facts.includes(fact)) {
                this.facts.push(fact);
            }
        },

        updateFactUI() {
            const count = this.facts.length;
            document.getElementById('factCount').textContent = count;

            const list = document.getElementById('factList');
            if (count === 0) {
                list.innerHTML = '<p class="no-facts">No secrets yet discovered...</p>';
            } else {
                list.innerHTML = this.facts.map(f => '<div class="fact-item">' + f + '</div>').join('');
            }
        },

        toggleFacts() {
            this.factsPanelOpen = !this.factsPanelOpen;
            document.getElementById('factPanel').classList.toggle('open', this.factsPanelOpen);
        }
    };

    // Boot
    engine.init();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
