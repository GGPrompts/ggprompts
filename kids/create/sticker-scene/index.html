<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sticker Scene!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #87CEEB;
    --sky-bottom: #E0F4FF;
    --tray-bg: rgba(255, 255, 255, 0.95);
    --tray-border: #FFB3D9;
    --btn-bg: linear-gradient(135deg, #FF69B4, #FF1493, #D42B2B);
    --btn-border: #FFD700;
    --font: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    --font-heading: 'Lilita One', cursive;
    --radius: 20px;
    --radius-pill: 9999px;
    --shadow: 0 4px 16px rgba(0,0,0,0.2);
    --scene-tab-size: 56px;
    --sticker-tray-height: 140px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #E0F4FF;
  }

  /* ── Back Button ── */
  .back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: var(--btn-bg);
    color: #fff;
    font-size: 1.6rem;
    text-decoration: none;
    border: 4px solid var(--btn-border);
    border-radius: 50%;
    box-shadow: var(--shadow), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .back-btn:hover, .back-btn:active { transform: scale(1.1); }
  .back-btn:active { transform: scale(0.94); }

  /* ── Scene Tabs (top bar) ── */
  .scene-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 76px 8px 76px;
    background: linear-gradient(135deg, #FFB3D9, #A8D8EA);
    justify-content: center;
    flex-shrink: 0;
    z-index: 100;
    border-bottom: 3px solid rgba(255,255,255,0.5);
  }

  .scene-tab {
    width: var(--scene-tab-size);
    height: var(--scene-tab-size);
    border-radius: 16px;
    border: 4px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.7);
    font-size: 1.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .scene-tab:hover { transform: scale(1.08); }
  .scene-tab:active { transform: scale(0.94); }
  .scene-tab.active {
    border-color: #FFD700;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 16px rgba(255,215,0,0.5);
    transform: scale(1.05);
  }

  /* ── Scene Canvas Area ── */
  .scene-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    transition: background 0.5s ease;
  }

  /* Scene backgrounds via CSS */
  .scene-area[data-scene="farm"] {
    background:
      linear-gradient(180deg, #87CEEB 0%, #B8E6F0 50%, #7EC850 50%, #5DA83A 100%);
  }
  .scene-area[data-scene="ocean"] {
    background:
      linear-gradient(180deg, #1A8FCA 0%, #0E6BA8 30%, #084B7A 60%, #0A3D5C 80%, #1B4F72 100%);
  }
  .scene-area[data-scene="space"] {
    background:
      linear-gradient(180deg, #0B0B2E 0%, #1B1B4B 40%, #2D1B69 70%, #0B0B2E 100%);
  }
  .scene-area[data-scene="forest"] {
    background:
      linear-gradient(180deg, #A8D8A8 0%, #6BA368 30%, #4A8B3F 60%, #3D7A34 80%, #2D5A24 100%);
  }

  /* Scene decorations drawn with pseudo-elements/divs */
  .scene-decor {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* Farm decorations */
  .scene-area[data-scene="farm"] .farm-decor { display: block; }
  .farm-decor { display: none; }
  .farm-sun {
    position: absolute;
    top: 20px;
    right: 40px;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #FFE066 40%, #FFA500 70%, transparent 71%);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,200,0,0.5);
  }
  .farm-fence {
    position: absolute;
    bottom: 48%;
    left: 0;
    right: 0;
    height: 24px;
    display: flex;
    gap: 30px;
    padding: 0 20px;
  }
  .fence-post {
    width: 8px;
    height: 24px;
    background: #8B6914;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .fence-rail {
    position: absolute;
    top: 6px;
    left: 0;
    right: 0;
    height: 4px;
    background: #A0781C;
    border-radius: 2px;
  }
  .farm-barn {
    position: absolute;
    bottom: 50%;
    right: 10%;
    width: 70px;
    height: 50px;
    background: #C0392B;
    border-radius: 4px 4px 0 0;
  }
  .farm-barn::before {
    content: '';
    position: absolute;
    top: -20px;
    left: -5px;
    width: 80px;
    height: 30px;
    background: #922B21;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .farm-barn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 28px;
    background: #7B241C;
    border-radius: 10px 10px 0 0;
  }

  /* Ocean decorations */
  .scene-area[data-scene="ocean"] .ocean-decor { display: block; }
  .ocean-decor { display: none; }
  .ocean-wave {
    position: absolute;
    width: 200%;
    height: 30px;
    left: -50%;
    border-radius: 50%;
    opacity: 0.15;
  }
  .ocean-wave:nth-child(1) {
    top: 15%;
    background: #4FC3F7;
    animation: waveFloat 6s ease-in-out infinite;
  }
  .ocean-wave:nth-child(2) {
    top: 35%;
    background: #29B6F6;
    animation: waveFloat 8s ease-in-out infinite reverse;
  }
  .ocean-wave:nth-child(3) {
    top: 55%;
    background: #03A9F4;
    animation: waveFloat 7s ease-in-out infinite 1s;
  }
  .ocean-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 15%;
    background: linear-gradient(0deg, #C2955A 0%, #D4A76A 70%, transparent 100%);
    border-radius: 40% 60% 0 0;
  }
  .ocean-seaweed {
    position: absolute;
    bottom: 0;
    width: 12px;
    border-radius: 6px 6px 0 0;
    animation: seaweedSway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .ocean-seaweed:nth-child(5) { left: 10%; height: 80px; background: #27AE60; animation-delay: 0s; }
  .ocean-seaweed:nth-child(6) { left: 25%; height: 60px; background: #2ECC71; animation-delay: 0.5s; }
  .ocean-seaweed:nth-child(7) { left: 70%; height: 90px; background: #1E8449; animation-delay: 1s; }
  .ocean-seaweed:nth-child(8) { left: 85%; height: 55px; background: #27AE60; animation-delay: 1.5s; }
  .ocean-bubble {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    animation: bubbleRise linear infinite;
  }
  .ocean-bubble:nth-child(9) { left: 20%; bottom: -20px; width: 14px; height: 14px; animation-duration: 6s; }
  .ocean-bubble:nth-child(10) { left: 50%; bottom: -20px; width: 10px; height: 10px; animation-duration: 8s; animation-delay: 2s; }
  .ocean-bubble:nth-child(11) { left: 75%; bottom: -20px; width: 18px; height: 18px; animation-duration: 7s; animation-delay: 4s; }

  @keyframes waveFloat {
    0%, 100% { transform: translateX(-10%); }
    50% { transform: translateX(10%); }
  }
  @keyframes seaweedSway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes bubbleRise {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    100% { transform: translateY(-80vh) scale(0.5); opacity: 0; }
  }

  /* Space decorations */
  .scene-area[data-scene="space"] .space-decor { display: block; }
  .space-decor { display: none; }
  .space-star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
  }
  .space-planet {
    position: absolute;
    border-radius: 50%;
  }
  .space-planet-1 {
    top: 15%;
    right: 15%;
    width: 50px;
    height: 50px;
    background: radial-gradient(circle at 35% 35%, #E74C3C, #922B21);
    box-shadow: 0 0 20px rgba(231,76,60,0.3);
  }
  .space-planet-2 {
    bottom: 25%;
    left: 10%;
    width: 35px;
    height: 35px;
    background: radial-gradient(circle at 35% 35%, #F39C12, #D68910);
    box-shadow: 0 0 15px rgba(243,156,18,0.3);
  }
  .space-planet-2::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -10px;
    right: -10px;
    height: 6px;
    background: rgba(243,156,18,0.4);
    border-radius: 50%;
    transform: rotate(-15deg);
  }

  /* Forest decorations */
  .scene-area[data-scene="forest"] .forest-decor { display: block; }
  .forest-decor { display: none; }
  .forest-tree {
    position: absolute;
    bottom: 0;
  }
  .forest-tree .trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: #5D3E1A;
    border-radius: 4px;
  }
  .forest-tree .canopy {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50% 50% 10% 10%;
  }
  .forest-tree:nth-child(1) { left: 5%; }
  .forest-tree:nth-child(1) .trunk { width: 16px; height: 50px; }
  .forest-tree:nth-child(1) .canopy { width: 70px; height: 60px; background: radial-gradient(ellipse, #2ECC71, #1B7A3D); bottom: 40px; }
  .forest-tree:nth-child(2) { right: 8%; }
  .forest-tree:nth-child(2) .trunk { width: 20px; height: 70px; }
  .forest-tree:nth-child(2) .canopy { width: 90px; height: 80px; background: radial-gradient(ellipse, #27AE60, #196F3D); bottom: 60px; }
  .forest-tree:nth-child(3) { left: 40%; }
  .forest-tree:nth-child(3) .trunk { width: 14px; height: 40px; }
  .forest-tree:nth-child(3) .canopy { width: 55px; height: 50px; background: radial-gradient(ellipse, #58D68D, #2ECC71); bottom: 30px; }
  .forest-mushroom {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 14px;
  }
  .forest-mushroom::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 8px;
    background: #F5F0E1;
    border-radius: 2px;
  }
  .forest-mushroom::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 10px;
    background: #E74C3C;
    border-radius: 50% 50% 10% 10%;
  }
  .forest-mushroom:nth-child(4) { left: 20%; }
  .forest-mushroom:nth-child(5) { right: 25%; width: 16px; height: 12px; }

  /* Sunbeams for forest */
  .forest-beam {
    position: absolute;
    top: 0;
    width: 40px;
    height: 100%;
    background: linear-gradient(180deg, rgba(255,255,200,0.15) 0%, transparent 70%);
    transform: skewX(-10deg);
  }
  .forest-beam:nth-child(6) { left: 15%; }
  .forest-beam:nth-child(7) { left: 55%; width: 30px; opacity: 0.7; }
  .forest-beam:nth-child(8) { left: 80%; width: 25px; opacity: 0.5; }

  /* ── Placed Stickers ── */
  .placed-sticker {
    position: absolute;
    font-size: 2.8rem;
    cursor: grab;
    z-index: 10;
    transform-origin: center center;
    transition: filter 0.2s;
    line-height: 1;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.25));
  }
  .placed-sticker.dragging {
    z-index: 999;
    cursor: grabbing;
    filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.35));
  }
  .placed-sticker.wiggle {
    animation: stickerWiggle 0.5s ease-in-out;
  }
  .placed-sticker.bounce {
    animation: stickerBounce 0.4s ease-out;
  }
  .placed-sticker.grow {
    animation: stickerGrow 0.35s ease-out;
  }

  @keyframes stickerWiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    15% { transform: rotate(-15deg) scale(1.1); }
    30% { transform: rotate(12deg) scale(1.1); }
    45% { transform: rotate(-10deg) scale(1.05); }
    60% { transform: rotate(8deg) scale(1.05); }
    75% { transform: rotate(-4deg) scale(1.02); }
    90% { transform: rotate(2deg) scale(1); }
  }
  @keyframes stickerBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.35); }
    50% { transform: scale(0.85); }
    70% { transform: scale(1.15); }
    85% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  @keyframes stickerGrow {
    0% { transform: scale(1); }
    50% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* Sparkle particles */
  .sparkle {
    position: absolute;
    pointer-events: none;
    z-index: 1000;
    font-size: 1.2rem;
    animation: sparkleFade 0.6s ease-out forwards;
  }
  @keyframes sparkleFade {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.3); }
  }

  /* ── Sticker Tray ── */
  .sticker-tray-wrapper {
    flex-shrink: 0;
    background: var(--tray-bg);
    border-top: 4px solid var(--tray-border);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    z-index: 200;
  }

  .sticker-tray {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    height: var(--sticker-tray-height);
    align-items: center;
    scroll-snap-type: x mandatory;
    touch-action: pan-x;
  }
  .sticker-tray::-webkit-scrollbar { display: none; }

  .tray-sticker {
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    font-size: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.9);
    border: 3px solid #E0E0E0;
    border-radius: 18px;
    cursor: grab;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    scroll-snap-align: center;
  }
  .tray-sticker:hover {
    transform: scale(1.08);
    border-color: #FFB3D9;
    box-shadow: 0 4px 12px rgba(255,179,217,0.3);
  }
  .tray-sticker:active {
    transform: scale(0.92);
    border-color: #FF69B4;
  }

  /* ── Action Buttons ── */
  .action-bar {
    display: flex;
    gap: 8px;
    padding: 6px 16px 10px;
    justify-content: center;
    background: var(--tray-bg);
  }

  .action-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid #E0E0E0;
    background: #fff;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, border-color 0.2s;
  }
  .action-btn:hover {
    transform: scale(1.1);
    border-color: #FFB3D9;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-btn.danger { border-color: #FF6B6B; }
  .action-btn.danger:hover { border-color: #E53935; background: #FFF0F0; }

  /* ── Confirm Dialog ── */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 900;
    align-items: center;
    justify-content: center;
  }
  .confirm-overlay.visible {
    display: flex;
  }
  .confirm-dialog {
    background: #fff;
    border-radius: 28px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    border: 4px solid #FFB3D9;
    max-width: 300px;
    width: 85%;
    animation: dialogPop 0.3s ease-out;
  }
  @keyframes dialogPop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .confirm-emoji {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 16px;
  }
  .confirm-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
  }
  .confirm-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 4px solid;
    font-size: 2.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .confirm-btn:hover { transform: scale(1.1); }
  .confirm-btn:active { transform: scale(0.92); }
  .confirm-yes {
    border-color: #66BB6A;
    background: #E8F5E9;
  }
  .confirm-no {
    border-color: #E53935;
    background: #FFEBEE;
  }

  /* ── Size Toggle ── */
  .size-toggle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid #A8D8EA;
    background: #E0F4FF;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, border-color 0.2s;
    font-family: var(--font);
    color: #333;
  }
  .size-toggle:hover { transform: scale(1.1); border-color: #42A5F5; }
  .size-toggle:active { transform: scale(0.92); }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    :root {
      --scene-tab-size: 48px;
      --sticker-tray-height: 110px;
    }
    .scene-tabs { padding: 8px 64px 6px 64px; gap: 4px; }
    .scene-tab { font-size: 1.5rem; border-radius: 12px; }
    .tray-sticker { width: 68px; height: 68px; font-size: 2.2rem; }
    .sticker-tray { padding: 8px 12px; gap: 6px; }
    .back-btn { width: 48px; height: 48px; font-size: 1.3rem; top: 8px; left: 8px; }
    .action-btn, .size-toggle { width: 44px; height: 44px; font-size: 1.2rem; }
    .placed-sticker { font-size: 2.4rem; }
  }

  @media (min-width: 769px) {
    .tray-sticker { width: 90px; height: 90px; font-size: 3rem; }
    :root { --sticker-tray-height: 160px; }
    .placed-sticker { font-size: 3.2rem; }
  }

  /* ── Drop hint pulse ── */
  .drop-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4rem;
    opacity: 0.2;
    pointer-events: none;
    animation: hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.1); }
  }
  .drop-hint.hidden { display: none; }

  /* safe area for notched devices */
  @supports (padding: env(safe-area-inset-bottom)) {
    .action-bar {
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    .back-btn {
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
    }
    .scene-tabs {
      padding-top: calc(10px + env(safe-area-inset-top));
    }
  }
</style>
</head>
<body>

<!-- Back Button -->
<a href="../../index.html" class="back-btn" aria-label="Back to Kids Corner">&#11013;&#65039;</a>

<!-- Scene Tabs -->
<div class="scene-tabs">
  <button class="scene-tab active" data-scene="farm" aria-label="Farm">&#127806;</button>
  <button class="scene-tab" data-scene="ocean" aria-label="Ocean">&#127754;</button>
  <button class="scene-tab" data-scene="space" aria-label="Space">&#127756;</button>
  <button class="scene-tab" data-scene="forest" aria-label="Forest">&#127794;</button>
</div>

<!-- Scene Area -->
<div class="scene-area" id="sceneArea" data-scene="farm">
  <!-- Drop hint for empty scenes -->
  <div class="drop-hint" id="dropHint">&#128071;</div>

  <!-- Farm decorations -->
  <div class="scene-decor farm-decor">
    <div class="farm-sun"></div>
    <div class="farm-barn"></div>
  </div>

  <!-- Ocean decorations -->
  <div class="scene-decor ocean-decor">
    <div class="ocean-wave"></div>
    <div class="ocean-wave"></div>
    <div class="ocean-wave"></div>
    <div class="ocean-floor"></div>
    <div class="ocean-seaweed"></div>
    <div class="ocean-seaweed"></div>
    <div class="ocean-seaweed"></div>
    <div class="ocean-seaweed"></div>
    <div class="ocean-bubble"></div>
    <div class="ocean-bubble"></div>
    <div class="ocean-bubble"></div>
  </div>

  <!-- Space decorations -->
  <div class="scene-decor space-decor" id="spaceDecor">
    <div class="space-planet space-planet-1"></div>
    <div class="space-planet space-planet-2"></div>
  </div>

  <!-- Forest decorations -->
  <div class="scene-decor forest-decor">
    <div class="forest-tree"><div class="trunk"></div><div class="canopy"></div></div>
    <div class="forest-tree"><div class="trunk"></div><div class="canopy"></div></div>
    <div class="forest-tree"><div class="trunk"></div><div class="canopy"></div></div>
    <div class="forest-mushroom"></div>
    <div class="forest-mushroom"></div>
    <div class="forest-beam"></div>
    <div class="forest-beam"></div>
    <div class="forest-beam"></div>
  </div>
</div>

<!-- Sticker Tray -->
<div class="sticker-tray-wrapper">
  <div class="sticker-tray" id="stickerTray"></div>
  <div class="action-bar">
    <button class="size-toggle" id="sizeToggle" aria-label="Change sticker size">S</button>
    <button class="action-btn" id="undoBtn" aria-label="Undo last sticker">&#8617;&#65039;</button>
    <button class="action-btn danger" id="clearBtn" aria-label="Clear all stickers">&#128465;&#65039;</button>
  </div>
</div>

<!-- Confirm Clear Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <span class="confirm-emoji">&#129300;</span>
    <div class="confirm-buttons">
      <button class="confirm-btn confirm-yes" id="confirmYes" aria-label="Yes, clear">&#9989;</button>
      <button class="confirm-btn confirm-no" id="confirmNo" aria-label="No, cancel">&#10060;</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// Sticker Scene Builder — Toddler-friendly
// ═══════════════════════════════════════════

(function() {
  'use strict';

  // ── Sticker Data ──
  var STICKERS = {
    farm: [
      '\u{1F404}', // cow
      '\u{1F414}', // chicken
      '\u{1F416}', // pig
      '\u{1F411}', // sheep
      '\u{1F40E}', // horse
      '\u{1F415}', // dog
      '\u{1F408}', // cat
      '\u{1F430}', // rabbit
      '\u{1F426}', // bird
      '\u{1F69C}', // tractor
      '\u{1F33B}', // sunflower
      '\u{1F33E}', // wheat
      '\u{1F955}', // carrot
      '\u{1F34E}', // apple
      '\u{1F33F}', // herb
      '\u{1F3E1}', // house
      '\u{2B50}',  // star
      '\u{1F308}', // rainbow
      '\u{1F98B}', // butterfly
      '\u{1F41D}'  // bee
    ],
    ocean: [
      '\u{1F420}', // tropical fish
      '\u{1F41F}', // fish
      '\u{1F421}', // blowfish
      '\u{1F988}', // octopus
      '\u{1F990}', // shrimp
      '\u{1F99E}', // lobster
      '\u{1F433}', // whale
      '\u{1F42C}', // dolphin
      '\u{1F422}', // turtle
      '\u{1F980}', // crab
      '\u{1F419}', // octopus
      '\u{1F41A}', // shell
      '\u{1F9DC}', // merperson
      '\u{2693}',  // anchor
      '\u{1F6A2}', // ship
      '\u{26F5}',  // sailboat
      '\u{1FAA8}', // coral
      '\u{2B50}',  // starfish
      '\u{1F30A}', // wave
      '\u{1FAB8}'  // jellyfish
    ],
    space: [
      '\u{1F680}', // rocket
      '\u{1F6F8}', // ufo
      '\u{1F31F}', // star2
      '\u{2B50}',  // star
      '\u{1F319}', // moon
      '\u{1F31B}', // first quarter moon
      '\u{1F31E}', // sun with face
      '\u{1FA90}', // ringed planet
      '\u{1F468}\u{200D}\u{1F680}', // astronaut
      '\u{1F30D}', // earth
      '\u{1F30C}', // milky way
      '\u{2604}',  // comet
      '\u{1F4AB}', // dizzy (shooting star)
      '\u{1F52D}', // telescope
      '\u{1F6F0}', // satellite
      '\u{1F916}', // robot
      '\u{1F47D}', // alien
      '\u{1F31A}', // new moon face
      '\u{1F4A5}', // explosion
      '\u{1F30B}'  // volcano
    ],
    forest: [
      '\u{1F43B}', // bear
      '\u{1F98C}', // deer
      '\u{1F98A}', // fox
      '\u{1F407}', // bunny
      '\u{1F43F}', // chipmunk
      '\u{1F989}', // owl
      '\u{1F985}', // eagle
      '\u{1F99A}', // peacock
      '\u{1F98E}', // lizard
      '\u{1F40C}', // snail
      '\u{1F41B}', // caterpillar
      '\u{1F98B}', // butterfly
      '\u{1F33B}', // sunflower
      '\u{1F340}', // four leaf clover
      '\u{1F344}', // mushroom
      '\u{1F331}', // seedling
      '\u{1F33A}', // hibiscus
      '\u{1F490}', // bouquet
      '\u{1F333}', // tree
      '\u{1F338}'  // cherry blossom
    ]
  };

  // ── State ──
  var currentScene = 'farm';
  var placedStickers = []; // { el, scene, emoji, x, y }
  var stickerSizes = ['S', 'M', 'L'];
  var currentSizeIndex = 0;
  var stickerScales = { S: 1, M: 1.5, L: 2.2 };

  // ── DOM ──
  var sceneArea = document.getElementById('sceneArea');
  var stickerTray = document.getElementById('stickerTray');
  var dropHint = document.getElementById('dropHint');
  var clearBtn = document.getElementById('clearBtn');
  var undoBtn = document.getElementById('undoBtn');
  var sizeToggle = document.getElementById('sizeToggle');
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmYes = document.getElementById('confirmYes');
  var confirmNo = document.getElementById('confirmNo');
  var spaceDecor = document.getElementById('spaceDecor');

  // ── Audio Engine ──
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var audioCtx;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playPlaceSound() {
    ensureAudio();
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600 + Math.random() * 400, now);
    osc.frequency.exponentialRampToValueAtTime(900 + Math.random() * 300, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  function playTapSound() {
    ensureAudio();
    var now = audioCtx.currentTime;

    // Playful two-note boing
    var osc1 = audioCtx.createOscillator();
    var osc2 = audioCtx.createOscillator();
    var gain1 = audioCtx.createGain();
    var gain2 = audioCtx.createGain();
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);

    var baseFreq = 300 + Math.random() * 400;
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(baseFreq, now);
    osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.1);
    gain1.gain.setValueAtTime(0.12, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc1.start(now);
    osc1.stop(now + 0.2);

    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(baseFreq * 2, now + 0.05);
    osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.5, now + 0.15);
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.1, now + 0.06);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc2.start(now + 0.05);
    osc2.stop(now + 0.25);
  }

  function playClearSound() {
    ensureAudio();
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  }

  function playSceneSwitch() {
    ensureAudio();
    var now = audioCtx.currentTime;
    // Rising arpeggio
    var notes = [400, 500, 650, 800];
    for (var i = 0; i < notes.length; i++) {
      (function(freq, delay) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
        osc.start(now + delay);
        osc.stop(now + delay + 0.12);
      })(notes[i], i * 0.06);
    }
  }

  // ── Generate space stars ──
  function generateSpaceStars() {
    for (var i = 0; i < 40; i++) {
      var star = document.createElement('div');
      star.className = 'space-star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = (2 + Math.random() * 3) + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = (2 + Math.random() * 3) + 's';
      star.style.animationDelay = Math.random() * 3 + 's';
      spaceDecor.appendChild(star);
    }
  }
  generateSpaceStars();

  // ── Populate Sticker Tray ──
  function populateTray(scene) {
    stickerTray.innerHTML = '';
    var stickers = STICKERS[scene] || STICKERS.farm;
    for (var i = 0; i < stickers.length; i++) {
      var btn = document.createElement('div');
      btn.className = 'tray-sticker';
      btn.textContent = stickers[i];
      btn.dataset.emoji = stickers[i];
      btn.setAttribute('role', 'button');
      btn.setAttribute('aria-label', 'Sticker');
      stickerTray.appendChild(btn);
    }
  }

  // ── Scene Switching ──
  var sceneTabs = document.querySelectorAll('.scene-tab');
  sceneTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var scene = tab.dataset.scene;
      if (scene === currentScene) return;
      currentScene = scene;
      sceneArea.dataset.scene = scene;
      sceneTabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      populateTray(scene);
      updateDropHint();
      playSceneSwitch();
    });
  });

  // ── Drop Hint ──
  function updateDropHint() {
    var hasStickers = false;
    for (var i = 0; i < placedStickers.length; i++) {
      if (placedStickers[i].scene === currentScene) {
        hasStickers = true;
        break;
      }
    }
    dropHint.classList.toggle('hidden', hasStickers);
  }

  // ── Sticker Visibility per Scene ──
  function updateStickerVisibility() {
    for (var i = 0; i < placedStickers.length; i++) {
      var s = placedStickers[i];
      s.el.style.display = s.scene === currentScene ? '' : 'none';
    }
    updateDropHint();
  }

  // ── Place a Sticker ──
  function placeSticker(emoji, x, y) {
    var el = document.createElement('div');
    el.className = 'placed-sticker';
    el.textContent = emoji;
    var scale = stickerScales[stickerSizes[currentSizeIndex]];
    el.style.transform = 'scale(' + scale + ')';
    el.dataset.scale = scale;

    // Position centered on drop point
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.marginLeft = '-0.5em';
    el.style.marginTop = '-0.5em';

    sceneArea.appendChild(el);

    var sticker = { el: el, scene: currentScene, emoji: emoji, x: x, y: y, scale: scale };
    placedStickers.push(sticker);

    // Entry animation
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.classList.add('bounce');
    setTimeout(function() { el.classList.remove('bounce'); }, 400);

    playPlaceSound();
    updateDropHint();
    setupStickerInteraction(sticker);
  }

  // ── Sticker Tap + Drag ──
  function setupStickerInteraction(sticker) {
    var el = sticker.el;
    var isDragging = false;
    var wasDragged = false;
    var startX, startY, offsetX, offsetY;
    var dragThreshold = 8;

    function onStart(e) {
      e.preventDefault();
      e.stopPropagation();
      var touch = e.touches ? e.touches[0] : e;
      var rect = sceneArea.getBoundingClientRect();

      startX = touch.clientX;
      startY = touch.clientY;
      offsetX = touch.clientX - el.getBoundingClientRect().left - el.offsetWidth / 2;
      offsetY = touch.clientY - el.getBoundingClientRect().top - el.offsetHeight / 2;
      isDragging = true;
      wasDragged = false;
      el.classList.add('dragging');
    }

    function onMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      var touch = e.touches ? e.touches[0] : e;
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;

      if (Math.abs(dx) > dragThreshold || Math.abs(dy) > dragThreshold) {
        wasDragged = true;
      }

      var rect = sceneArea.getBoundingClientRect();
      var newX = touch.clientX - rect.left - offsetX;
      var newY = touch.clientY - rect.top - offsetY;

      // Clamp within scene
      newX = Math.max(0, Math.min(rect.width, newX));
      newY = Math.max(0, Math.min(rect.height, newY));

      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      sticker.x = newX;
      sticker.y = newY;
    }

    function onEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      el.classList.remove('dragging');

      if (!wasDragged) {
        // It was a tap, not a drag
        tapSticker(sticker);
      }
    }

    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);

    // Store cleanup for removal
    sticker._cleanup = function() {
      el.removeEventListener('mousedown', onStart);
      el.removeEventListener('touchstart', onStart);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchend', onEnd);
    };
  }

  // ── Tap Animation on Placed Sticker ──
  function tapSticker(sticker) {
    var el = sticker.el;
    var animations = ['wiggle', 'bounce', 'grow'];
    var anim = animations[Math.floor(Math.random() * animations.length)];

    el.classList.remove('wiggle', 'bounce', 'grow');
    el.offsetHeight; // reflow
    el.classList.add(anim);
    setTimeout(function() { el.classList.remove(anim); }, 600);

    // Spawn sparkles
    spawnSparkles(sticker);
    playTapSound();
  }

  function spawnSparkles(sticker) {
    var rect = sticker.el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var sparkleEmojis = ['\u2728', '\u{1F31F}', '\u{1F4AB}', '\u2B50', '\u{1F496}'];

    for (var i = 0; i < 5; i++) {
      (function(idx) {
        var s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = sparkleEmojis[idx % sparkleEmojis.length];
        var angle = (Math.PI * 2 / 5) * idx;
        var dist = 30 + Math.random() * 40;
        s.style.left = cx + 'px';
        s.style.top = cy + 'px';
        s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
        s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
        s.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
        document.body.appendChild(s);
        setTimeout(function() { s.remove(); }, 650);
      })(i);
    }
  }

  // ── Tray Sticker: Tap to place or Drag to scene ──
  var trayDragState = null;
  var trayGhost = null;

  function handleTrayStart(e) {
    var target = e.target.closest('.tray-sticker');
    if (!target) return;
    e.preventDefault();

    var touch = e.touches ? e.touches[0] : e;
    var emoji = target.dataset.emoji;

    trayDragState = {
      emoji: emoji,
      startX: touch.clientX,
      startY: touch.clientY,
      dragging: false,
      target: target
    };
  }

  function handleTrayMove(e) {
    if (!trayDragState) return;
    e.preventDefault();

    var touch = e.touches ? e.touches[0] : e;
    var dx = touch.clientX - trayDragState.startX;
    var dy = touch.clientY - trayDragState.startY;

    if (!trayDragState.dragging && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      trayDragState.dragging = true;
      // Create ghost sticker
      trayGhost = document.createElement('div');
      trayGhost.className = 'placed-sticker dragging';
      trayGhost.textContent = trayDragState.emoji;
      var scale = stickerScales[stickerSizes[currentSizeIndex]];
      trayGhost.style.transform = 'scale(' + scale + ')';
      trayGhost.style.position = 'fixed';
      trayGhost.style.zIndex = '999';
      trayGhost.style.pointerEvents = 'none';
      document.body.appendChild(trayGhost);
    }

    if (trayDragState.dragging && trayGhost) {
      trayGhost.style.left = touch.clientX + 'px';
      trayGhost.style.top = touch.clientY + 'px';
      trayGhost.style.marginLeft = '-0.5em';
      trayGhost.style.marginTop = '-0.5em';
    }
  }

  function handleTrayEnd(e) {
    if (!trayDragState) return;

    if (trayDragState.dragging && trayGhost) {
      // Get drop position
      var rect = sceneArea.getBoundingClientRect();
      var ghostRect = trayGhost.getBoundingClientRect();
      var cx = ghostRect.left + ghostRect.width / 2;
      var cy = ghostRect.top + ghostRect.height / 2;

      trayGhost.remove();
      trayGhost = null;

      // Check if dropped on scene
      if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) {
        placeSticker(trayDragState.emoji, cx - rect.left, cy - rect.top);
      }
    } else {
      // It was a tap — place at center of scene
      var rect = sceneArea.getBoundingClientRect();
      var cx = rect.width / 2 + (Math.random() - 0.5) * rect.width * 0.6;
      var cy = rect.height / 2 + (Math.random() - 0.5) * rect.height * 0.5;
      placeSticker(trayDragState.emoji, cx, cy);
    }

    trayDragState = null;
  }

  stickerTray.addEventListener('mousedown', handleTrayStart);
  stickerTray.addEventListener('touchstart', handleTrayStart, { passive: false });
  document.addEventListener('mousemove', handleTrayMove);
  document.addEventListener('touchmove', handleTrayMove, { passive: false });
  document.addEventListener('mouseup', handleTrayEnd);
  document.addEventListener('touchend', handleTrayEnd);

  // ── Size Toggle ──
  sizeToggle.addEventListener('click', function() {
    currentSizeIndex = (currentSizeIndex + 1) % stickerSizes.length;
    sizeToggle.textContent = stickerSizes[currentSizeIndex];
    playPlaceSound();
  });

  // ── Undo ──
  undoBtn.addEventListener('click', function() {
    // Find last sticker on current scene
    for (var i = placedStickers.length - 1; i >= 0; i--) {
      if (placedStickers[i].scene === currentScene) {
        var s = placedStickers[i];
        if (s._cleanup) s._cleanup();
        s.el.remove();
        placedStickers.splice(i, 1);
        playClearSound();
        updateDropHint();
        return;
      }
    }
  });

  // ── Clear ──
  clearBtn.addEventListener('click', function() {
    // Check if there are stickers to clear
    var hasStickers = false;
    for (var i = 0; i < placedStickers.length; i++) {
      if (placedStickers[i].scene === currentScene) {
        hasStickers = true;
        break;
      }
    }
    if (!hasStickers) return;
    confirmOverlay.classList.add('visible');
  });

  confirmYes.addEventListener('click', function() {
    confirmOverlay.classList.remove('visible');
    // Remove all stickers on current scene
    for (var i = placedStickers.length - 1; i >= 0; i--) {
      if (placedStickers[i].scene === currentScene) {
        var s = placedStickers[i];
        if (s._cleanup) s._cleanup();
        s.el.remove();
        placedStickers.splice(i, 1);
      }
    }
    playClearSound();
    updateDropHint();
  });

  confirmNo.addEventListener('click', function() {
    confirmOverlay.classList.remove('visible');
  });

  // Close confirm on overlay click
  confirmOverlay.addEventListener('click', function(e) {
    if (e.target === confirmOverlay) {
      confirmOverlay.classList.remove('visible');
    }
  });

  // ── Scene switching: show/hide stickers ──
  sceneTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      updateStickerVisibility();
    });
  });

  // ── Also allow tapping empty scene area to close confirm ──
  sceneArea.addEventListener('click', function(e) {
    if (e.target === sceneArea || e.target === dropHint) {
      // Do nothing special — just ensure confirm is closed
    }
  });

  // ── Prevent default touch behaviors ──
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); });

  // ── Initialize ──
  populateTray(currentScene);
  updateDropHint();

})();
</script>
<script defer src="../../../prompt-viewer.js"></script>
