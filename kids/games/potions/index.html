<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Potion Lab! — a fun, toddler-friendly game from Kids' Corner.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Potion Lab!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: linear-gradient(180deg, #1a0a2e 0%, #2d1b69 40%, #4a2c8a 100%);
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    position: relative;
  }

  /* Back button */
  .back-btn-carnival {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 300;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 140px;
    height: 64px;
    padding: 0 24px;
    background: linear-gradient(135deg, #FF69B4, #FF1493, #D42B2B);
    color: #fff;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    text-decoration: none;
    border: 4px solid #FFD700;
    border-radius: 9999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn-carnival:hover,
  .back-btn-carnival:active { transform: scale(1.08); box-shadow: 0 6px 24px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.6); }
  .back-btn-carnival:active { transform: scale(0.96); }

  /* Recipe book button */
  .book-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 300;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #8B4513, #D2691E);
    color: #fff;
    font-size: 2rem;
    border: 4px solid #FFD700;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .book-btn:active { transform: scale(0.92); }
  .book-btn .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #FF1493;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    min-width: 24px;
    height: 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #FFD700;
  }

  /* Cauldron area */
  #cauldron-area {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 260px;
    height: 260px;
    z-index: 10;
  }

  /* Ingredient shelf */
  #shelf {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    background: linear-gradient(0deg, rgba(60,20,10,0.95), rgba(80,30,15,0.8) 70%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 10px;
    flex-wrap: wrap;
    z-index: 50;
    border-top: 3px solid rgba(255,215,0,0.3);
  }

  .ingredient {
    width: 80px;
    height: 80px;
    border-radius: 16px;
    background: rgba(255,255,255,0.1);
    border: 3px solid rgba(255,215,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    cursor: grab;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .ingredient:active { transform: scale(1.15); }
  .ingredient.dragging {
    position: fixed;
    z-index: 500;
    transform: scale(1.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.6);
    pointer-events: none;
    border-color: #FFD700;
  }

  /* Added ingredients display */
  .added-ingredients {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -130px);
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  .added-ing {
    font-size: 1.8rem;
    animation: addedBounce 0.4s ease-out;
  }
  @keyframes addedBounce {
    0% { transform: scale(0) translateY(30px); }
    60% { transform: scale(1.3) translateY(-5px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* Result overlay */
  #result-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.6);
  }
  #result-overlay.active { display: flex; }
  .result-content {
    font-size: 5rem;
    animation: resultPop 0.6s ease-out;
    text-align: center;
  }
  .result-name {
    font-family: 'Lilita One', cursive;
    font-size: 2rem;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 2px 8px rgba(0,0,0,0.5);
    margin-top: 16px;
    animation: resultPop 0.6s 0.2s ease-out both;
  }
  .result-new {
    font-family: 'Fredoka', cursive;
    font-size: 1.2rem;
    color: #FF69B4;
    text-shadow: 0 0 10px rgba(255,105,180,0.6);
    margin-top: 8px;
    animation: resultPop 0.5s 0.4s ease-out both;
  }
  @keyframes resultPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Recipe book overlay */
  #book-overlay {
    position: fixed;
    inset: 0;
    z-index: 600;
    display: none;
    background: rgba(0,0,0,0.85);
    overflow-y: auto;
    padding: 80px 16px 32px;
  }
  #book-overlay.active { display: block; }
  .book-title {
    font-family: 'Lilita One', cursive;
    font-size: 2.2rem;
    color: #FFD700;
    text-align: center;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    margin-bottom: 20px;
  }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .book-cell {
    aspect-ratio: 1;
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    border: 3px solid rgba(255,215,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    transition: transform 0.15s;
  }
  .book-cell.discovered {
    border-color: rgba(255,215,0,0.6);
    background: rgba(255,215,0,0.1);
  }
  .book-cell.undiscovered {
    font-size: 2rem;
    color: rgba(255,255,255,0.15);
  }
  .book-cell .cell-name {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
    text-align: center;
    line-height: 1.1;
  }
  .book-close {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 610;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #D42B2B, #FF1493);
    color: #fff;
    font-size: 2rem;
    border: 4px solid #FFD700;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  /* Canvas layers */
  #bg-canvas, #steam-canvas, #fx-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #bg-canvas { z-index: 1; }
  #steam-canvas { z-index: 15; }
  #fx-canvas { z-index: 200; }

  /* Color splash overlay */
  .color-splash {
    position: fixed;
    inset: 0;
    z-index: 350;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .color-splash.active {
    opacity: 0.6;
    animation: splashFade 2s ease-out forwards;
  }
  @keyframes splashFade {
    0% { opacity: 0.7; }
    100% { opacity: 0; }
  }

  /* Bouncing critter */
  .critter {
    position: fixed;
    font-size: 4rem;
    z-index: 380;
    pointer-events: none;
    animation: critterBounce 0.5s ease-in-out infinite alternate;
  }
  @keyframes critterBounce {
    0% { transform: translateY(0) rotate(-5deg); }
    100% { transform: translateY(-20px) rotate(5deg); }
  }

  /* Weather particles */
  .weather-particle {
    position: fixed;
    pointer-events: none;
    z-index: 360;
  }

  /* Silly transform */
  .silly-transform {
    position: fixed;
    font-size: 6rem;
    z-index: 380;
    pointer-events: none;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: sillyPop 0.6s ease-out;
  }
  @keyframes sillyPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
    70% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }
</style>
</head>

<a href="../../index.html" class="back-btn-carnival">&#11013;&#65039; Kids</a>

<script>
// ---- Audio Engine ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.body.addEventListener('pointerdown', ensureAudio, { once: true });
document.body.addEventListener('touchstart', ensureAudio, { once: true });

function playBubbleSound() {
  ensureAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  const f = 200 + Math.random() * 400;
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 0.5, now + 0.15);
  gain.gain.setValueAtTime(0.08, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.start(now);
  osc.stop(now + 0.15);
}

function playSizzle() {
  ensureAudio();
  const now = audioCtx.currentTime;
  // White noise burst via buffer
  const bufSize = audioCtx.sampleRate * 0.3;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.setValueAtTime(3000, now);
  filt.frequency.exponentialRampToValueAtTime(8000, now + 0.3);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  src.connect(filt);
  filt.connect(gain);
  gain.connect(audioCtx.destination);
  src.start(now);
  src.stop(now + 0.3);
}

function playDropSound() {
  ensureAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc.start(now);
  osc.stop(now + 0.2);
}

function playMagicChime() {
  ensureAudio();
  const now = audioCtx.currentTime;
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + i * 0.08);
    gain.gain.setValueAtTime(0.2, now + i * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
    osc.start(now + i * 0.08);
    osc.stop(now + i * 0.08 + 0.4);
  });
}

function playDiscoveryFanfare() {
  ensureAudio();
  const now = audioCtx.currentTime;
  const notes = [392, 494, 587, 784, 784, 659, 784];
  const durs = [0.1, 0.1, 0.1, 0.2, 0.1, 0.1, 0.3];
  let t = 0;
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = i < 3 ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(f, now + t);
    gain.gain.setValueAtTime(0.2, now + t);
    gain.gain.exponentialRampToValueAtTime(0.001, now + t + durs[i]);
    osc.start(now + t);
    osc.stop(now + t + durs[i]);
    t += durs[i];
  });
}

// Continuous bubbling sound
let bubblingInterval = null;
function startBubbling() {
  if (bubblingInterval) return;
  bubblingInterval = setInterval(() => {
    if (cauldronIngredients.length > 0) playBubbleSound();
  }, 300 + Math.random() * 400);
}
function stopBubbling() {
  if (bubblingInterval) { clearInterval(bubblingInterval); bubblingInterval = null; }
}

// ---- Ingredients ----
const INGREDIENTS = [
  { id: 'sparkles', emoji: '\u2728', name: 'Sparkles', color: '#FFD700' },
  { id: 'moonbeam', emoji: '\uD83C\uDF19', name: 'Moonbeam', color: '#C0C0FF' },
  { id: 'rainbow', emoji: '\uD83C\uDF08', name: 'Rainbow Drop', color: '#FF69B4' },
  { id: 'stardust', emoji: '\u2B50', name: 'Star Dust', color: '#FFFF00' },
  { id: 'fairywing', emoji: '\uD83E\uDDDA', name: 'Fairy Wing', color: '#E0B0FF' },
  { id: 'flower', emoji: '\uD83C\uDF3A', name: 'Flower', color: '#FF6B8A' },
  { id: 'mushroom', emoji: '\uD83C\uDF44', name: 'Mushroom', color: '#C8553D' },
  { id: 'leaf', emoji: '\uD83C\uDF43', name: 'Leaf', color: '#4CAF50' },
  { id: 'berry', emoji: '\uD83C\uDF53', name: 'Berry', color: '#E91E63' },
  { id: 'feather', emoji: '\uD83E\uDEB6', name: 'Feather', color: '#87CEEB' },
  { id: 'crystal', emoji: '\uD83D\uDC8E', name: 'Crystal', color: '#00BCD4' },
  { id: 'waterdrop', emoji: '\uD83D\uDCA7', name: 'Water Drop', color: '#2196F3' },
  { id: 'flame', emoji: '\uD83D\uDD25', name: 'Flame', color: '#FF5722' },
  { id: 'snowflake', emoji: '\u2744\uFE0F', name: 'Snowflake', color: '#B3E5FC' },
  { id: 'heart', emoji: '\u2764\uFE0F', name: 'Heart', color: '#F44336' },
  { id: 'cloud', emoji: '\u2601\uFE0F', name: 'Cloud', color: '#CFD8DC' },
];

// ---- Recipes: key = sorted ingredient IDs joined by '+' ----
const RECIPES = [
  // Color potions
  { ingredients: ['flower', 'berry'], name: 'Pink Potion', emoji: '\uD83E\uDDEA', type: 'color', color: '#FF69B4' },
  { ingredients: ['leaf', 'waterdrop'], name: 'Green Potion', emoji: '\uD83E\uDDEA', type: 'color', color: '#4CAF50' },
  { ingredients: ['crystal', 'waterdrop'], name: 'Blue Potion', emoji: '\uD83E\uDDEA', type: 'color', color: '#2196F3' },
  { ingredients: ['stardust', 'flame'], name: 'Gold Potion', emoji: '\uD83E\uDDEA', type: 'color', color: '#FFD700' },
  { ingredients: ['moonbeam', 'crystal'], name: 'Purple Potion', emoji: '\uD83E\uDDEA', type: 'color', color: '#9C27B0' },

  // Creatures
  { ingredients: ['mushroom', 'leaf'], name: 'Friendly Frog', emoji: '\uD83D\uDC38', type: 'creature' },
  { ingredients: ['sparkles', 'fairywing'], name: 'Baby Dragon', emoji: '\uD83D\uDC32', type: 'creature' },
  { ingredients: ['waterdrop', 'flower'], name: 'Magic Fish', emoji: '\uD83D\uDC20', type: 'creature' },
  { ingredients: ['feather', 'rainbow'], name: 'Unicorn', emoji: '\uD83E\uDD84', type: 'creature' },
  { ingredients: ['heart', 'sparkles'], name: 'Love Bug', emoji: '\uD83E\uDD8B', type: 'creature' },
  { ingredients: ['mushroom', 'berry'], name: 'Happy Snail', emoji: '\uD83D\uDC0C', type: 'creature' },

  // Weather
  { ingredients: ['cloud', 'waterdrop'], name: 'Rainstorm', emoji: '\uD83C\uDF27\uFE0F', type: 'weather', weather: 'rain' },
  { ingredients: ['snowflake', 'cloud'], name: 'Snowfall', emoji: '\u2744\uFE0F', type: 'weather', weather: 'snow' },
  { ingredients: ['flame', 'stardust'], name: 'Sunshine', emoji: '\u2600\uFE0F', type: 'weather', weather: 'sun' },
  { ingredients: ['rainbow', 'waterdrop'], name: 'Rainbow Rain', emoji: '\uD83C\uDF08', type: 'weather', weather: 'rainbow' },

  // Transformations
  { ingredients: ['mushroom', 'sparkles'], name: 'Silly Frog', emoji: '\uD83D\uDC38', type: 'transform' },
  { ingredients: ['flower', 'stardust'], name: 'Magic Cake', emoji: '\uD83C\uDF82', type: 'transform' },
  { ingredients: ['flame', 'crystal'], name: 'Rocket Ship', emoji: '\uD83D\uDE80', type: 'transform' },
  { ingredients: ['moonbeam', 'snowflake'], name: 'Ice Castle', emoji: '\uD83C\uDFF0', type: 'transform' },
  { ingredients: ['heart', 'rainbow'], name: 'Love Tornado', emoji: '\uD83C\uDF00', type: 'transform' },
  { ingredients: ['feather', 'cloud'], name: 'Flying Carpet', emoji: '\uD83E\uDDF9', type: 'transform' },

  // 3-ingredient specials
  { ingredients: ['sparkles', 'rainbow', 'heart'], name: 'Super Unicorn', emoji: '\uD83E\uDD84', type: 'creature' },
  { ingredients: ['flame', 'snowflake', 'waterdrop'], name: 'Steam Explosion', emoji: '\uD83D\uDCA8', type: 'weather', weather: 'steam' },
  { ingredients: ['mushroom', 'flower', 'leaf'], name: 'Garden Giant', emoji: '\uD83C\uDF33', type: 'transform' },
  { ingredients: ['crystal', 'moonbeam', 'stardust'], name: 'Disco Ball', emoji: '\uD83E\uDEA9', type: 'transform' },
];

// ---- State ----
let cauldronIngredients = [];
let discovered = new Set();
let liquidColor = { r: 80, g: 40, b: 120 };
let liquidTargetColor = { r: 80, g: 40, b: 120 };
let bubbleIntensity = 0;
let cauldronBubbles = [];
let steamParticles = [];
let dragging = null;
let dragOffsetX = 0, dragOffsetY = 0;
let resultTimeout = null;
let effectElements = [];

// Load saved discoveries
try {
  const saved = localStorage.getItem('potions-discovered');
  if (saved) discovered = new Set(JSON.parse(saved));
} catch(e) {}

function saveDiscoveries() {
  try { localStorage.setItem('potions-discovered', JSON.stringify([...discovered])); } catch(e) {}
}

// ---- Canvas setup ----
const bgCanvas = document.getElementById('bg-canvas');
const steamCanvas = document.getElementById('steam-canvas');
const fxCanvas = document.getElementById('fx-canvas');
const bgCtx = bgCanvas.getContext('2d');
const steamCtx = steamCanvas.getContext('2d');
const fxCtx = fxCanvas.getContext('2d');

function resizeCanvases() {
  const w = window.innerWidth, h = window.innerHeight;
  [bgCanvas, steamCanvas, fxCanvas].forEach(c => {
    c.width = w;
    c.height = h;
  });
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

// ---- Cauldron geometry ----
function getCauldronCenter() {
  const area = document.getElementById('cauldron-area');
  const r = area.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function getCauldronRadius() { return 100; }

// ---- Draw cauldron on bg canvas ----
function drawCauldron() {
  const { x: cx, y: cy } = getCauldronCenter();
  const r = getCauldronRadius();
  const ctx = bgCtx;

  // Cauldron body - dark iron pot
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, cy + 10, r + 10, r - 10, 0, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(cx - 20, cy - 10, 10, cx, cy + 10, r + 10);
  grad.addColorStop(0, '#555');
  grad.addColorStop(0.5, '#333');
  grad.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = grad;
  ctx.fill();

  // Rim
  ctx.beginPath();
  ctx.ellipse(cx, cy - 40, r + 15, 20, 0, 0, Math.PI * 2);
  const rimGrad = ctx.createLinearGradient(cx - r, cy - 50, cx + r, cy - 30);
  rimGrad.addColorStop(0, '#666');
  rimGrad.addColorStop(0.3, '#888');
  rimGrad.addColorStop(0.5, '#aaa');
  rimGrad.addColorStop(0.7, '#888');
  rimGrad.addColorStop(1, '#555');
  ctx.fillStyle = rimGrad;
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Handles
  ctx.beginPath();
  ctx.arc(cx - r - 15, cy, 15, Math.PI * 0.5, Math.PI * 1.5);
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + r + 15, cy, 15, -Math.PI * 0.5, Math.PI * 0.5);
  ctx.stroke();

  // Liquid surface
  ctx.beginPath();
  ctx.ellipse(cx, cy - 30, r - 5, 18, 0, 0, Math.PI * 2);
  const liqGrad = ctx.createRadialGradient(cx, cy - 30, 5, cx, cy - 30, r - 5);
  const lc = liquidColor;
  liqGrad.addColorStop(0, `rgba(${lc.r + 60},${lc.g + 60},${lc.b + 60},0.9)`);
  liqGrad.addColorStop(0.7, `rgba(${lc.r},${lc.g},${lc.b},0.85)`);
  liqGrad.addColorStop(1, `rgba(${Math.max(0,lc.r-30)},${Math.max(0,lc.g-30)},${Math.max(0,lc.b-30)},0.9)`);
  ctx.fillStyle = liqGrad;
  ctx.fill();

  // Liquid shimmer
  const shimT = Date.now() / 1000;
  for (let i = 0; i < 3; i++) {
    const sx = cx + Math.cos(shimT * 1.5 + i * 2) * (r * 0.4);
    const sy = cy - 30 + Math.sin(shimT * 2 + i * 3) * 6;
    ctx.beginPath();
    ctx.ellipse(sx, sy, 15, 5, shimT + i, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(shimT * 3 + i) * 0.05})`;
    ctx.fill();
  }

  // Legs
  ctx.fillStyle = '#444';
  [-30, 0, 30].forEach(offset => {
    ctx.beginPath();
    ctx.moveTo(cx + offset - 8, cy + r - 25);
    ctx.lineTo(cx + offset + 8, cy + r - 25);
    ctx.lineTo(cx + offset + 5, cy + r + 10);
    ctx.lineTo(cx + offset - 5, cy + r + 10);
    ctx.fill();
  });

  // Glow from liquid
  if (cauldronIngredients.length > 0) {
    ctx.beginPath();
    ctx.ellipse(cx, cy - 20, r + 30, r, 0, 0, Math.PI * 2);
    const glowGrad = ctx.createRadialGradient(cx, cy - 30, 10, cx, cy - 20, r + 30);
    glowGrad.addColorStop(0, `rgba(${lc.r},${lc.g},${lc.b},0.3)`);
    glowGrad.addColorStop(1, `rgba(${lc.r},${lc.g},${lc.b},0)`);
    ctx.fillStyle = glowGrad;
    ctx.fill();
  }

  ctx.restore();
}

// ---- Cauldron bubbles ----
function spawnCauldronBubble() {
  const { x: cx, y: cy } = getCauldronCenter();
  const r = getCauldronRadius();
  cauldronBubbles.push({
    x: cx + (Math.random() - 0.5) * (r * 1.2),
    y: cy - 30 + Math.random() * 10,
    size: 3 + Math.random() * 10,
    speed: 0.5 + Math.random() * 1.5,
    life: 1,
    decay: 0.01 + Math.random() * 0.02,
  });
}

function drawCauldronBubbles() {
  const ctx = bgCtx;
  const lc = liquidColor;
  for (let i = cauldronBubbles.length - 1; i >= 0; i--) {
    const b = cauldronBubbles[i];
    b.y -= b.speed;
    b.x += Math.sin(Date.now() / 300 + i) * 0.3;
    b.life -= b.decay;
    if (b.life <= 0) { cauldronBubbles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${lc.r + 80},${lc.g + 80},${lc.b + 80},${b.life * 0.5})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${b.life * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ---- Steam particles ----
function spawnSteam() {
  const { x: cx, y: cy } = getCauldronCenter();
  const r = getCauldronRadius();
  steamParticles.push({
    x: cx + (Math.random() - 0.5) * r,
    y: cy - 50,
    size: 5 + Math.random() * 15,
    speed: 0.3 + Math.random() * 0.8,
    drift: (Math.random() - 0.5) * 0.5,
    life: 1,
    decay: 0.005 + Math.random() * 0.01,
  });
}

function drawSteam() {
  steamCtx.clearRect(0, 0, steamCanvas.width, steamCanvas.height);
  for (let i = steamParticles.length - 1; i >= 0; i--) {
    const p = steamParticles[i];
    p.y -= p.speed;
    p.x += p.drift + Math.sin(Date.now() / 1000 + i) * 0.2;
    p.size += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) { steamParticles.splice(i, 1); continue; }
    steamCtx.beginPath();
    steamCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    steamCtx.fillStyle = `rgba(200,200,220,${p.life * 0.15})`;
    steamCtx.fill();
  }
}

// ---- Background stars ----
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.7,
    size: 1 + Math.random() * 2,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 2,
  });
}

function drawStars() {
  const ctx = bgCtx;
  const t = Date.now() / 1000;
  stars.forEach(s => {
    const alpha = 0.3 + Math.sin(t * s.speed + s.twinkle) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x * bgCanvas.width, s.y * bgCanvas.height, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });
}

// ---- Ingredient shelf ----
function buildShelf() {
  const shelf = document.getElementById('shelf');
  shelf.innerHTML = '';
  INGREDIENTS.forEach(ing => {
    const el = document.createElement('div');
    el.className = 'ingredient';
    el.textContent = ing.emoji;
    el.dataset.id = ing.id;

    // Touch drag
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      ensureAudio();
      startDrag(ing, el, e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    // Mouse drag
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      ensureAudio();
      startDrag(ing, el, e.clientX, e.clientY);
    });

    shelf.appendChild(el);
  });
}

function startDrag(ing, el, x, y) {
  if (dragging) return;
  const clone = el.cloneNode(true);
  clone.className = 'ingredient dragging';
  clone.style.left = (x - 40) + 'px';
  clone.style.top = (y - 40) + 'px';
  document.body.appendChild(clone);
  dragging = { ing, el: clone, startX: x, startY: y };
}

function moveDrag(x, y) {
  if (!dragging) return;
  dragging.el.style.left = (x - 40) + 'px';
  dragging.el.style.top = (y - 40) + 'px';
}

function endDrag(x, y) {
  if (!dragging) return;
  const { ing, el } = dragging;
  el.remove();

  // Check if dropped on cauldron
  const { x: cx, y: cy } = getCauldronCenter();
  const r = getCauldronRadius();
  const dx = x - cx, dy = y - cy;
  if (Math.sqrt(dx * dx + dy * dy) < r + 40) {
    addIngredient(ing);
  }

  dragging = null;
}

document.addEventListener('touchmove', (e) => {
  if (dragging) {
    e.preventDefault();
    moveDrag(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });
document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
document.addEventListener('touchend', (e) => {
  if (dragging) {
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
  }
});
document.addEventListener('mouseup', (e) => endDrag(e.clientX, e.clientY));

// ---- Add ingredient to cauldron ----
function addIngredient(ing) {
  if (cauldronIngredients.length >= 3) return;
  // Don't allow duplicates
  if (cauldronIngredients.find(i => i.id === ing.id)) return;

  cauldronIngredients.push(ing);
  playDropSound();
  playSizzle();
  bubbleIntensity = 1;
  startBubbling();

  // Shift liquid color
  const hex = ing.color;
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  liquidTargetColor = {
    r: Math.round((liquidTargetColor.r + r) / 2),
    g: Math.round((liquidTargetColor.g + g) / 2),
    b: Math.round((liquidTargetColor.b + b) / 2),
  };

  // Show added ingredients
  updateAddedDisplay();

  // Check recipe after delay
  if (resultTimeout) clearTimeout(resultTimeout);
  if (cauldronIngredients.length >= 2) {
    resultTimeout = setTimeout(checkRecipe, 1200);
  }
}

function updateAddedDisplay() {
  const el = document.getElementById('addedIngredients');
  el.innerHTML = '';
  cauldronIngredients.forEach(ing => {
    const span = document.createElement('span');
    span.className = 'added-ing';
    span.textContent = ing.emoji;
    el.appendChild(span);
  });
}

// ---- Recipe matching ----
function checkRecipe() {
  const ids = cauldronIngredients.map(i => i.id).sort();
  const key = ids.join('+');

  let recipe = null;
  for (const r of RECIPES) {
    const rKey = [...r.ingredients].sort().join('+');
    if (rKey === key) { recipe = r; break; }
  }

  if (!recipe && cauldronIngredients.length < 3) {
    // Wait for more ingredients
    return;
  }

  if (!recipe) {
    // Mystery result - random fun thing
    recipe = {
      name: 'Mystery Goo',
      emoji: ['\uD83E\uDDA0', '\uD83E\uDD2A', '\uD83D\uDCA9', '\uD83C\uDF1F', '\uD83C\uDF6D', '\uD83E\uDDCA'][Math.floor(Math.random() * 6)],
      type: 'mystery',
    };
  }

  const isNew = !discovered.has(recipe.name);
  if (recipe.type !== 'mystery') {
    discovered.add(recipe.name);
    saveDiscoveries();
  }

  showResult(recipe, isNew);
}

// ---- Show result ----
function showResult(recipe, isNew) {
  stopBubbling();
  playMagicChime();
  if (isNew && recipe.type !== 'mystery') {
    setTimeout(playDiscoveryFanfare, 500);
  }

  // Big eruption bubbles
  for (let i = 0; i < 20; i++) {
    setTimeout(() => spawnCauldronBubble(), i * 30);
  }

  // Type-specific effect
  setTimeout(() => {
    switch (recipe.type) {
      case 'color': doColorSplash(recipe.color); break;
      case 'creature': doCreature(recipe.emoji); break;
      case 'weather': doWeather(recipe.weather); break;
      case 'transform': doTransform(recipe.emoji); break;
    }
  }, 400);

  // Show overlay
  const overlay = document.getElementById('result-overlay');
  document.getElementById('resultEmoji').textContent = recipe.emoji;
  document.getElementById('resultName').textContent = recipe.name;
  document.getElementById('resultNew').textContent = isNew && recipe.type !== 'mystery' ? 'NEW DISCOVERY!' : '';
  overlay.classList.add('active');

  // Update badge
  updateBadge();

  // Dismiss on tap
  const dismiss = () => {
    overlay.classList.remove('active');
    overlay.removeEventListener('pointerdown', dismiss);
    resetCauldron();
    clearEffects();
  };
  setTimeout(() => {
    overlay.addEventListener('pointerdown', dismiss);
    // Auto dismiss after 4s
    setTimeout(dismiss, 4000);
  }, 600);
}

function resetCauldron() {
  cauldronIngredients = [];
  liquidTargetColor = { r: 80, g: 40, b: 120 };
  bubbleIntensity = 0;
  updateAddedDisplay();
}

// ---- Effects ----
function clearEffects() {
  effectElements.forEach(el => el.remove());
  effectElements = [];
}

function doColorSplash(color) {
  const splash = document.getElementById('colorSplash');
  splash.style.background = color;
  splash.classList.remove('active');
  void splash.offsetWidth;
  splash.classList.add('active');
  setTimeout(() => splash.classList.remove('active'), 2000);

  // Spawn colored particles on fx canvas
  const particles = [];
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x: fxCanvas.width / 2, y: fxCanvas.height / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 5 + Math.random() * 15,
      life: 1, decay: 0.01 + Math.random() * 0.02,
    });
  }
  const hex = color;
  const cr = parseInt(hex.slice(1,3), 16);
  const cg = parseInt(hex.slice(3,5), 16);
  const cb = parseInt(hex.slice(5,7), 16);

  function animSplash() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1;
      p.life -= p.decay;
      if (p.life <= 0) return;
      alive = true;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fxCtx.fillStyle = `rgba(${cr},${cg},${cb},${p.life * 0.8})`;
      fxCtx.fill();
    });
    if (alive) requestAnimationFrame(animSplash);
    else fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
  animSplash();
}

function doCreature(emoji) {
  for (let i = 0; i < 3; i++) {
    const el = document.createElement('div');
    el.className = 'critter';
    el.textContent = emoji;
    el.style.left = (20 + Math.random() * (window.innerWidth - 100)) + 'px';
    el.style.top = (100 + Math.random() * (window.innerHeight - 300)) + 'px';
    el.style.animationDelay = (i * 0.2) + 's';
    document.body.appendChild(el);
    effectElements.push(el);

    // Bounce around
    let vx = (Math.random() - 0.5) * 4;
    let vy = (Math.random() - 0.5) * 4;
    let x = parseFloat(el.style.left);
    let y = parseFloat(el.style.top);
    const bounce = () => {
      if (!el.parentNode) return;
      x += vx; y += vy;
      if (x < 0 || x > window.innerWidth - 60) vx *= -1;
      if (y < 60 || y > window.innerHeight - 180) vy *= -1;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      requestAnimationFrame(bounce);
    };
    bounce();
  }
}

function doWeather(type) {
  let count = 0;
  const maxCount = 60;
  const spawn = () => {
    if (count >= maxCount) return;
    count++;
    const el = document.createElement('div');
    el.className = 'weather-particle';

    switch (type) {
      case 'rain':
        el.textContent = '\uD83D\uDCA7';
        el.style.fontSize = (1 + Math.random()) + 'rem';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-20px';
        el.animate([
          { transform: 'translateY(0)', opacity: 1 },
          { transform: `translateY(${window.innerHeight + 40}px)`, opacity: 0.5 }
        ], { duration: 1000 + Math.random() * 1000, fill: 'forwards' }).onfinish = () => el.remove();
        break;
      case 'snow':
        el.textContent = '\u2744\uFE0F';
        el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-20px';
        el.animate([
          { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
          { transform: `translateY(${window.innerHeight + 40}px) rotate(360deg)`, opacity: 0.3 }
        ], { duration: 2000 + Math.random() * 3000, fill: 'forwards' }).onfinish = () => el.remove();
        break;
      case 'sun':
        el.textContent = '\u2728';
        el.style.fontSize = (1.5 + Math.random()) + 'rem';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = Math.random() * 100 + '%';
        el.animate([
          { transform: 'scale(0)', opacity: 1 },
          { transform: 'scale(1.5)', opacity: 0 }
        ], { duration: 800 + Math.random() * 600, fill: 'forwards' }).onfinish = () => el.remove();
        break;
      case 'rainbow':
        const colors = ['#FF0000','#FF7700','#FFFF00','#00FF00','#0000FF','#8B00FF'];
        el.style.width = '15px';
        el.style.height = '15px';
        el.style.borderRadius = '50%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-20px';
        el.animate([
          { transform: 'translateY(0) scale(1)', opacity: 1 },
          { transform: `translateY(${window.innerHeight + 40}px) scale(0.5)`, opacity: 0.3 }
        ], { duration: 1500 + Math.random() * 1500, fill: 'forwards' }).onfinish = () => el.remove();
        break;
      case 'steam':
        el.textContent = '\uD83D\uDCA8';
        el.style.fontSize = (2 + Math.random() * 2) + 'rem';
        el.style.left = (30 + Math.random() * 40) + '%';
        el.style.bottom = '130px';
        el.animate([
          { transform: 'translateY(0) scale(1)', opacity: 0.8 },
          { transform: `translateY(-${200 + Math.random() * 300}px) scale(2)`, opacity: 0 }
        ], { duration: 1500 + Math.random() * 1000, fill: 'forwards' }).onfinish = () => el.remove();
        break;
    }

    document.body.appendChild(el);
    effectElements.push(el);
    setTimeout(spawn, 50 + Math.random() * 100);
  };
  spawn();
}

function doTransform(emoji) {
  const el = document.createElement('div');
  el.className = 'silly-transform';
  el.textContent = emoji;
  document.body.appendChild(el);
  effectElements.push(el);

  // Sparkle ring
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.style.position = 'fixed';
    s.style.left = '50%';
    s.style.top = '50%';
    s.style.fontSize = '1.5rem';
    s.style.pointerEvents = 'none';
    s.style.zIndex = '390';
    s.textContent = '\u2728';
    document.body.appendChild(s);
    effectElements.push(s);
    const angle = (Math.PI * 2 / 12) * i;
    const dist = 120;
    s.animate([
      { transform: `translate(-50%, -50%) translate(0, 0) scale(0)`, opacity: 1 },
      { transform: `translate(-50%, -50%) translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(1.5)`, opacity: 0 }
    ], { duration: 800, easing: 'ease-out', fill: 'forwards' }).onfinish = () => s.remove();
  }
}

// ---- Recipe book ----
function updateBadge() {
  document.getElementById('bookBadge').textContent = discovered.size;
}
updateBadge();

document.getElementById('bookBtn').addEventListener('pointerdown', () => {
  showBook();
});

document.getElementById('bookClose').addEventListener('pointerdown', () => {
  document.getElementById('book-overlay').classList.remove('active');
});

function showBook() {
  const grid = document.getElementById('bookGrid');
  grid.innerHTML = '';

  // Show all non-mystery recipes
  RECIPES.forEach(r => {
    const cell = document.createElement('div');
    cell.className = 'book-cell';
    if (discovered.has(r.name)) {
      cell.classList.add('discovered');
      cell.innerHTML = `<span>${r.emoji}</span><span class="cell-name">${r.name}</span>`;
    } else {
      cell.classList.add('undiscovered');
      cell.textContent = '?';
    }
    grid.appendChild(cell);
  });

  document.getElementById('book-overlay').classList.add('active');
}

// ---- Main render loop ----
function render() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

  // Lerp liquid color
  liquidColor.r += (liquidTargetColor.r - liquidColor.r) * 0.05;
  liquidColor.g += (liquidTargetColor.g - liquidColor.g) * 0.05;
  liquidColor.b += (liquidTargetColor.b - liquidColor.b) * 0.05;

  drawStars();
  drawCauldron();

  // Spawn bubbles based on intensity
  if (cauldronIngredients.length > 0) {
    if (Math.random() < 0.15 + bubbleIntensity * 0.3) spawnCauldronBubble();
    if (Math.random() < 0.08 + bubbleIntensity * 0.1) spawnSteam();
    bubbleIntensity *= 0.995;
  }

  drawCauldronBubbles();
  drawSteam();

  requestAnimationFrame(render);
}

// ---- Init ----
buildShelf();
render();
</script>
