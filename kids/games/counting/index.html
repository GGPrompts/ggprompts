<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#87CEEB">
<title>Counting Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;600;700&family=Bungee+Shade&display=swap" rel="stylesheet">
<style>
    :root {
        --tent-red: #D42B2B;
        --marquee-gold: #F5C542;
        --popcorn-yellow: #FFE066;
        --cotton-candy-pink: #FFB3D9;
        --cotton-candy-blue: #A8D8EA;
        --taffy-purple: #B07CC6;
        --balloon-red: #E53935;
        --balloon-blue: #42A5F5;
        --balloon-green: #66BB6A;
        --ticket-orange: #FF8F00;
        --sky-blue: #87CEEB;
        --sky-light: #E0F4FF;
        --cloud-white: #FFFFFF;
        --grass-green: #7EC850;

        --font-display: 'Bungee Shade', cursive;
        --font-heading: 'Lilita One', cursive;
        --font-body: 'Fredoka', sans-serif;

        --radius-lg: 24px;
        --radius-xl: 32px;
        --radius-pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
    }

    body {
        font-family: var(--font-body);
        background: linear-gradient(180deg, var(--sky-light) 0%, var(--sky-blue) 50%, var(--grass-green) 100%);
        min-height: 100vh;
        min-height: 100dvh;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* ── Back Button ── */
    .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--cloud-white);
        border: 4px solid var(--balloon-red);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        text-decoration: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        transition: transform 0.2s;
    }
    .back-btn:active { transform: scale(0.9); }

    /* ── Count Display ── */
    .count-display {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 90;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--cloud-white);
        border: 4px solid var(--marquee-gold);
        border-radius: var(--radius-pill);
        padding: 8px 28px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        min-width: 120px;
        justify-content: center;
    }

    .count-number {
        font-family: var(--font-heading);
        font-size: 3rem;
        color: var(--tent-red);
        line-height: 1;
        transition: transform 0.15s;
    }
    .count-number.bump {
        transform: scale(1.4);
    }

    .count-total {
        font-family: var(--font-body);
        font-size: 1.6rem;
        color: #999;
        font-weight: 600;
    }

    /* ── Level Stars ── */
    .level-display {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 90;
        display: flex;
        gap: 6px;
    }
    .level-star {
        font-size: 2rem;
        opacity: 0.25;
        transition: opacity 0.4s, transform 0.4s;
    }
    .level-star.earned {
        opacity: 1;
        transform: scale(1.2);
    }

    /* ── Game Area ── */
    .game-area {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 100px 24px 120px;
        max-width: 700px;
    }

    /* ── Countable Object ── */
    .countable {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100px;
        height: 100px;
        font-size: 3.5rem;
        border-radius: var(--radius-xl);
        background: var(--cloud-white);
        border: 4px solid #e0e0e0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                    border-color 0.3s, background 0.3s, box-shadow 0.3s;
        animation: objectEnter 0.5s ease backwards;
        position: relative;
    }

    .countable:active {
        transform: scale(0.92);
    }

    .countable.counted {
        border-color: var(--balloon-green);
        background: linear-gradient(135deg, #e8f8e8 0%, #c8f0c8 100%);
        box-shadow: 0 0 20px rgba(102, 187, 106, 0.4);
    }

    .countable.bounce {
        animation: countBounce 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .countable .count-badge {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--balloon-green);
        color: white;
        font-family: var(--font-heading);
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        animation: badgePop 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes objectEnter {
        0% { opacity: 0; transform: scale(0) rotate(-20deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes countBounce {
        0% { transform: scale(1); }
        30% { transform: scale(1.25); }
        60% { transform: scale(0.9); }
        100% { transform: scale(1); }
    }

    @keyframes badgePop {
        0% { transform: scale(0); }
        60% { transform: scale(1.3); }
        100% { transform: scale(1); }
    }

    /* ── Theme Label ── */
    .theme-label {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        font-family: var(--font-heading);
        font-size: 1.4rem;
        color: white;
        text-shadow: 0 2px 6px rgba(0,0,0,0.2);
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
        white-space: nowrap;
    }
    .theme-label.visible { opacity: 1; }

    /* ── Next Button ── */
    .next-btn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        z-index: 90;
        background: linear-gradient(135deg, var(--balloon-green) 0%, #43A047 100%);
        color: white;
        border: none;
        border-radius: var(--radius-pill);
        padding: 18px 48px;
        font-family: var(--font-heading);
        font-size: 1.8rem;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .next-btn.visible {
        transform: translateX(-50%) scale(1);
    }
    .next-btn:active {
        transform: translateX(-50%) scale(0.92);
    }
    .next-btn .arrow {
        font-size: 2rem;
    }

    /* ── Celebration Overlay ── */
    .celebration {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0,0,0,0.3);
    }
    .celebration.active {
        display: flex;
    }

    .celebration-text {
        font-family: var(--font-display);
        font-size: clamp(2rem, 10vw, 4rem);
        color: var(--marquee-gold);
        text-shadow: 3px 3px 0 var(--tent-red), 0 0 30px rgba(245,197,66,0.5);
        animation: celebBounce 0.6s ease-in-out infinite alternate;
        text-align: center;
        padding: 0 20px;
    }

    .celebration-stars {
        font-size: 3rem;
        margin-top: 16px;
        animation: celebSpin 2s linear infinite;
    }

    @keyframes celebBounce {
        0% { transform: scale(1) rotate(-2deg); }
        100% { transform: scale(1.08) rotate(2deg); }
    }

    @keyframes celebSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* ── Confetti ── */
    .confetti {
        position: fixed;
        width: 12px;
        height: 12px;
        z-index: 250;
        pointer-events: none;
        animation: confettiDrop linear forwards;
    }

    @keyframes confettiDrop {
        0% { opacity: 1; transform: translateY(0) rotate(0deg); }
        100% { opacity: 0; transform: translateY(100vh) rotate(1080deg); }
    }

    /* ── Start Screen ── */
    .start-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 300;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, var(--sky-light) 0%, var(--sky-blue) 50%, var(--grass-green) 100%);
        gap: 24px;
    }
    .start-screen.hidden { display: none; }

    .start-title {
        font-family: var(--font-display);
        font-size: clamp(2rem, 8vw, 3.5rem);
        color: var(--tent-red);
        text-shadow: 3px 3px 0 var(--marquee-gold);
        text-align: center;
        line-height: 1.3;
        padding: 0 20px;
    }

    .start-emoji {
        font-size: 5rem;
        animation: startBounce 1.5s ease-in-out infinite;
    }

    @keyframes startBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    .start-btn {
        background: linear-gradient(135deg, var(--balloon-green) 0%, #43A047 100%);
        color: white;
        border: none;
        border-radius: var(--radius-pill);
        padding: 24px 64px;
        font-family: var(--font-heading);
        font-size: 2rem;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        transition: transform 0.2s;
        margin-top: 12px;
    }
    .start-btn:active { transform: scale(0.92); }

    /* ── Finished Screen ── */
    .finish-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 300;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FFF3E0 0%, var(--popcorn-yellow) 50%, var(--marquee-gold) 100%);
        gap: 20px;
    }
    .finish-screen.active { display: flex; }

    .finish-trophy {
        font-size: 6rem;
        animation: startBounce 1.5s ease-in-out infinite;
    }

    .finish-title {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 7vw, 3rem);
        color: var(--tent-red);
        text-shadow: 3px 3px 0 var(--marquee-gold);
        text-align: center;
        padding: 0 20px;
    }

    .finish-stars {
        font-size: 3rem;
        display: flex;
        gap: 8px;
    }

    .replay-btn {
        background: linear-gradient(135deg, var(--balloon-blue) 0%, #1E88E5 100%);
        color: white;
        border: none;
        border-radius: var(--radius-pill);
        padding: 20px 56px;
        font-family: var(--font-heading);
        font-size: 1.8rem;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .replay-btn:active { transform: scale(0.92); }

    .home-btn {
        background: linear-gradient(135deg, var(--cotton-candy-pink) 0%, #F48FB1 100%);
        color: white;
        border: none;
        border-radius: var(--radius-pill);
        padding: 16px 48px;
        font-family: var(--font-heading);
        font-size: 1.4rem;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        transition: transform 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }
    .home-btn:active { transform: scale(0.92); }

    /* ── Responsive ── */
    @media (max-width: 500px) {
        .countable {
            width: 80px;
            height: 80px;
            font-size: 2.8rem;
        }
        .countable .count-badge {
            width: 26px;
            height: 26px;
            font-size: 0.9rem;
            top: -8px;
            right: -8px;
        }
        .count-number { font-size: 2.4rem; }
        .count-total { font-size: 1.3rem; }
        .count-display { padding: 6px 20px; }
        .back-btn { width: 52px; height: 52px; font-size: 1.6rem; }
        .game-area { padding: 90px 16px 120px; gap: 10px; }
        .next-btn { font-size: 1.4rem; padding: 14px 36px; }
    }

    @media (min-width: 501px) and (max-width: 768px) {
        .countable {
            width: 90px;
            height: 90px;
            font-size: 3rem;
        }
    }

    @media (min-height: 900px) {
        .countable {
            width: 110px;
            height: 110px;
            font-size: 4rem;
        }
    }

    /* ── Safe area for notched devices ── */
    @supports (padding: env(safe-area-inset-top)) {
        .back-btn { top: calc(16px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); }
        .count-display { top: calc(16px + env(safe-area-inset-top)); }
        .level-display { top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); }
        .next-btn { bottom: calc(24px + env(safe-area-inset-bottom)); }
    }
</style>
</head>
<body>

    <!-- Back to Kids Hub -->
    <a href="../../" class="back-btn" aria-label="Back to Kids Corner">&#x2B05;</a>

    <!-- Count Display -->
    <div class="count-display" id="countDisplay">
        <span class="count-number" id="countNumber">0</span>
        <span class="count-total" id="countTotal">/ 0</span>
    </div>

    <!-- Level Stars -->
    <div class="level-display" id="levelDisplay">
        <span class="level-star" id="star1">&#11088;</span>
        <span class="level-star" id="star2">&#11088;</span>
        <span class="level-star" id="star3">&#11088;</span>
    </div>

    <!-- Theme Label (e.g. "Farm Animals") -->
    <div class="theme-label" id="themeLabel"></div>

    <!-- Game Objects Area -->
    <div class="game-area" id="gameArea"></div>

    <!-- Next Round Button -->
    <button class="next-btn" id="nextBtn" aria-label="Next round">
        <span>&#127881;</span>
        <span class="arrow">&#x27A1;</span>
    </button>

    <!-- Round Celebration Overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-text" id="celebText"></div>
        <div class="celebration-stars">&#11088;&#127881;&#11088;</div>
    </div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-emoji">&#x1F522;</div>
        <div class="start-title">Counting Game</div>
        <button class="start-btn" id="startBtn">&#x25B6; Play!</button>
    </div>

    <!-- Finish Screen -->
    <div class="finish-screen" id="finishScreen">
        <div class="finish-trophy">&#127942;</div>
        <div class="finish-title">Great Counting!</div>
        <div class="finish-stars">
            <span>&#11088;</span><span>&#11088;</span><span>&#11088;</span>
        </div>
        <button class="replay-btn" id="replayBtn">&#128260; Again!</button>
        <a href="../../" class="home-btn">&#127968; Home</a>
    </div>

<script>
(function() {
    'use strict';

    // ── Audio Engine (Web Audio API) ──
    var audioCtx = null;

    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            audioCtx = null;
        }
    }

    function playCountBeep(number) {
        if (!audioCtx) return;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        // Rising pitch for each count
        var baseFreq = 300 + (number * 40);
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(baseFreq + 80, audioCtx.currentTime + 0.1);
        osc.type = 'triangle';

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.25);
    }

    function playCelebration() {
        if (!audioCtx) return;
        var notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
        notes.forEach(function(freq, i) {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
            osc.type = 'square';

            var t = audioCtx.currentTime + i * 0.12;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);

            osc.start(t);
            osc.stop(t + 0.4);
        });
    }

    function playFinishFanfare() {
        if (!audioCtx) return;
        var melody = [523, 659, 784, 784, 1047, 784, 1047];
        var durations = [0.15, 0.15, 0.15, 0.1, 0.2, 0.1, 0.4];
        var t = audioCtx.currentTime;
        melody.forEach(function(freq, i) {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, t);
            osc.type = 'square';
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.18, t + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.01, t + durations[i]);
            osc.start(t);
            osc.stop(t + durations[i] + 0.05);
            t += durations[i];
        });
    }

    // ── Themed Rounds ──
    var themes = [
        {
            name: 'Farm Animals',
            emoji: ['&#x1F404;', '&#x1F414;', '&#x1F411;', '&#x1F416;', '&#x1F40E;', '&#x1F410;', '&#x1F407;', '&#x1F425;', '&#x1F986;', '&#x1F9AE;'],
            icon: '&#x1F3E1;'
        },
        {
            name: 'Ocean Friends',
            emoji: ['&#x1F420;', '&#x1F419;', '&#x1F42C;', '&#x1F422;', '&#x1F433;', '&#x1F990;', '&#x1F980;', '&#x1F988;', '&#x1F41A;', '&#x1F42B;'],
            icon: '&#x1F30A;'
        },
        {
            name: 'Yummy Fruits',
            emoji: ['&#x1F34E;', '&#x1F34C;', '&#x1F347;', '&#x1F353;', '&#x1F34A;', '&#x1F352;', '&#x1F349;', '&#x1F351;', '&#x1F34D;', '&#x1F95D;'],
            icon: '&#x1F34E;'
        },
        {
            name: 'Space Objects',
            emoji: ['&#x2B50;', '&#x1F31F;', '&#x1FA90;', '&#x1F680;', '&#x1F6F8;', '&#x1F319;', '&#x2604;', '&#x1F30D;', '&#x1F311;', '&#x1F4AB;'],
            icon: '&#x1F680;'
        },
        {
            name: 'Garden Bugs',
            emoji: ['&#x1F41B;', '&#x1F98B;', '&#x1F41D;', '&#x1F41E;', '&#x1F40C;', '&#x1F997;', '&#x1FAB2;', '&#x1FAB3;', '&#x1FAB0;', '&#x1FAB1;'],
            icon: '&#x1F33B;'
        },
        {
            name: 'Vehicles',
            emoji: ['&#x1F697;', '&#x1F68C;', '&#x1F692;', '&#x1F691;', '&#x1F693;', '&#x2708;', '&#x1F6A2;', '&#x1F682;', '&#x1F6B2;', '&#x1F3CD;'],
            icon: '&#x1F698;'
        }
    ];

    // ── Difficulty Levels ──
    // Each level defines the range of objects and how many rounds at that level
    var levels = [
        { min: 1, max: 3, rounds: 3 },  // Level 1: 1-3 objects, 3 rounds
        { min: 4, max: 6, rounds: 3 },  // Level 2: 4-6 objects, 3 rounds
        { min: 7, max: 10, rounds: 3 }  // Level 3: 7-10 objects, 3 rounds
    ];

    // ── Game State ──
    var currentLevel = 0;
    var currentRound = 0;
    var totalRoundsPlayed = 0;
    var counted = 0;
    var totalObjects = 0;
    var roundActive = false;
    var usedThemeIndices = [];

    // ── DOM References ──
    var gameArea = document.getElementById('gameArea');
    var countNumber = document.getElementById('countNumber');
    var countTotal = document.getElementById('countTotal');
    var nextBtn = document.getElementById('nextBtn');
    var celebration = document.getElementById('celebration');
    var celebText = document.getElementById('celebText');
    var themeLabel = document.getElementById('themeLabel');
    var startScreen = document.getElementById('startScreen');
    var startBtn = document.getElementById('startBtn');
    var finishScreen = document.getElementById('finishScreen');
    var replayBtn = document.getElementById('replayBtn');

    // ── Start Game ──
    startBtn.addEventListener('click', function() {
        initAudio();
        startScreen.classList.add('hidden');
        startGame();
    });

    replayBtn.addEventListener('click', function() {
        finishScreen.classList.remove('active');
        startGame();
    });

    function startGame() {
        currentLevel = 0;
        currentRound = 0;
        totalRoundsPlayed = 0;
        usedThemeIndices = [];
        updateLevelStars();
        startRound();
    }

    // ── Pick a Random Theme (no repeats until exhausted) ──
    function pickTheme() {
        if (usedThemeIndices.length >= themes.length) {
            usedThemeIndices = [];
        }
        var available = [];
        for (var i = 0; i < themes.length; i++) {
            if (usedThemeIndices.indexOf(i) === -1) available.push(i);
        }
        var idx = available[Math.floor(Math.random() * available.length)];
        usedThemeIndices.push(idx);
        return themes[idx];
    }

    // ── Start a Round ──
    function startRound() {
        counted = 0;
        roundActive = true;

        var level = levels[currentLevel];
        totalObjects = level.min + Math.floor(Math.random() * (level.max - level.min + 1));

        var theme = pickTheme();

        // Update UI
        countNumber.textContent = '0';
        countTotal.textContent = '/ ' + totalObjects;
        nextBtn.classList.remove('visible');
        celebration.classList.remove('active');

        // Show theme label briefly
        themeLabel.innerHTML = theme.icon + ' ' + theme.name;
        themeLabel.classList.add('visible');
        setTimeout(function() { themeLabel.classList.remove('visible'); }, 2000);

        // Pick random emoji from theme (allow duplicates)
        var chosenEmoji = [];
        for (var i = 0; i < totalObjects; i++) {
            chosenEmoji.push(theme.emoji[Math.floor(Math.random() * theme.emoji.length)]);
        }

        // Render objects
        gameArea.innerHTML = '';
        chosenEmoji.forEach(function(emoji, idx) {
            var el = document.createElement('div');
            el.className = 'countable';
            el.innerHTML = emoji;
            el.style.animationDelay = (idx * 0.1) + 's';
            el.setAttribute('data-index', idx);
            el.addEventListener('click', onObjectTap);
            gameArea.appendChild(el);
        });
    }

    // ── Object Tap Handler ──
    function onObjectTap(e) {
        if (!roundActive) return;
        var el = e.currentTarget;
        if (el.classList.contains('counted')) return;

        counted++;
        el.classList.add('counted', 'bounce');

        // Add number badge
        var badge = document.createElement('div');
        badge.className = 'count-badge';
        badge.textContent = counted;
        el.appendChild(badge);

        // Update count display with bump animation
        countNumber.textContent = counted;
        countNumber.classList.add('bump');
        setTimeout(function() { countNumber.classList.remove('bump'); }, 150);

        // Play count beep
        playCountBeep(counted);

        // Remove bounce class after animation
        setTimeout(function() { el.classList.remove('bounce'); }, 400);

        // Check if round complete
        if (counted >= totalObjects) {
            roundActive = false;
            currentRound++;
            totalRoundsPlayed++;

            setTimeout(function() {
                roundComplete();
            }, 500);
        }
    }

    // ── Round Complete ──
    function roundComplete() {
        playCelebration();
        spawnConfetti(40);

        var cheers = ['&#127881; Yay!', '&#11088; Wow!', '&#127775; Great!', '&#128079; Super!', '&#127942; Cool!'];
        celebText.innerHTML = cheers[Math.floor(Math.random() * cheers.length)];
        celebration.classList.add('active');

        // Check level progression
        var level = levels[currentLevel];
        if (currentRound >= level.rounds) {
            // Level up!
            earnStar(currentLevel);
            currentLevel++;
            currentRound = 0;

            if (currentLevel >= levels.length) {
                // Game complete!
                setTimeout(function() {
                    celebration.classList.remove('active');
                    showFinishScreen();
                }, 2000);
                return;
            }
        }

        // Show next button after celebration
        setTimeout(function() {
            celebration.classList.remove('active');
            nextBtn.classList.add('visible');
        }, 1500);
    }

    // ── Level Stars ──
    function updateLevelStars() {
        for (var i = 0; i < 3; i++) {
            document.getElementById('star' + (i + 1)).classList.remove('earned');
        }
    }

    function earnStar(levelIndex) {
        var star = document.getElementById('star' + (levelIndex + 1));
        if (star) star.classList.add('earned');
    }

    // ── Next Button ──
    nextBtn.addEventListener('click', function() {
        nextBtn.classList.remove('visible');
        startRound();
    });

    // ── Finish Screen ──
    function showFinishScreen() {
        playFinishFanfare();
        spawnConfetti(80);
        finishScreen.classList.add('active');
    }

    // ── Confetti ──
    function spawnConfetti(count) {
        var colors = ['#D42B2B', '#F5C542', '#FFB3D9', '#42A5F5', '#66BB6A', '#B07CC6', '#FF8F00', '#FFE066'];
        for (var i = 0; i < count; i++) {
            (function(i) {
                setTimeout(function() {
                    var el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = (Math.random() * 100) + 'vw';
                    el.style.top = '-20px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (8 + Math.random() * 10) + 'px';
                    el.style.height = (8 + Math.random() * 10) + 'px';
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                    el.style.animationDelay = '0s';
                    document.body.appendChild(el);
                    setTimeout(function() { el.remove(); }, 4000);
                }, i * 30);
            })(i);
        }
    }

})();
</script>
