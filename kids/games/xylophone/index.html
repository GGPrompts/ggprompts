<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Rainbow Xylophone! — a fun, toddler-friendly game from Kids' Corner.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rainbow Xylophone!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: linear-gradient(180deg, #87CEEB 0%, #FFE4B5 40%, #FFDAB9 100%);
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* --- Back Button (carnival style) --- */
  .back-btn-carnival {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 300;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 140px;
    height: 64px;
    padding: 0 24px;
    background: linear-gradient(135deg, #FF69B4, #FF1493, #D42B2B);
    color: #fff;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    text-decoration: none;
    border: 4px solid #FFD700;
    border-radius: 9999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn-carnival:hover,
  .back-btn-carnival:active {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.6);
  }
  .back-btn-carnival:active {
    transform: scale(0.96);
  }

  /* --- Xylophone Container --- */
  #xylophone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 0;
    gap: 4px;
  }

  /* --- Bars --- */
  .bar {
    flex: 1;
    width: 100%;
    position: relative;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 0.1s ease-out, filter 0.1s;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60px;
  }

  .bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.35), rgba(255,255,255,0.05));
    border-radius: 8px 8px 0 0;
    pointer-events: none;
  }

  .bar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background: linear-gradient(to top, rgba(0,0,0,0.15), transparent);
    border-radius: 0 0 8px 8px;
    pointer-events: none;
  }

  .bar.pressed {
    transform: scaleY(0.92) scaleX(1.02);
    filter: brightness(1.3);
  }

  @keyframes barBounce {
    0%   { transform: scaleY(0.88) scaleX(1.03); filter: brightness(1.4); }
    30%  { transform: scaleY(1.05) scaleX(0.99); filter: brightness(1.2); }
    60%  { transform: scaleY(0.97); filter: brightness(1.1); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }

  .bar.bounce {
    animation: barBounce 0.35s ease-out;
  }

  /* --- Bar colors (rainbow: red to violet) --- */
  .bar-0 {
    background: linear-gradient(90deg, #FF4444 0%, #FF6B6B 50%, #FF4444 100%);
    box-shadow: 0 4px 12px rgba(255,68,68,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-1 {
    background: linear-gradient(90deg, #FF8C00 0%, #FFA94D 50%, #FF8C00 100%);
    box-shadow: 0 4px 12px rgba(255,140,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-2 {
    background: linear-gradient(90deg, #FFD700 0%, #FFE44D 50%, #FFD700 100%);
    box-shadow: 0 4px 12px rgba(255,215,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-3 {
    background: linear-gradient(90deg, #4CAF50 0%, #6BCB77 50%, #4CAF50 100%);
    box-shadow: 0 4px 12px rgba(76,175,80,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-4 {
    background: linear-gradient(90deg, #2196F3 0%, #4DABF7 50%, #2196F3 100%);
    box-shadow: 0 4px 12px rgba(33,150,243,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-5 {
    background: linear-gradient(90deg, #3F51B5 0%, #5C7CFA 50%, #3F51B5 100%);
    box-shadow: 0 4px 12px rgba(63,81,181,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-6 {
    background: linear-gradient(90deg, #9C27B0 0%, #CC5DE8 50%, #9C27B0 100%);
    box-shadow: 0 4px 12px rgba(156,39,176,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .bar-7 {
    background: linear-gradient(90deg, #7B1FA2 0%, #AB47BC 50%, #7B1FA2 100%);
    box-shadow: 0 4px 12px rgba(123,31,162,0.4), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  }

  /* --- Note label on bars --- */
  .bar-label {
    font-family: 'Lilita One', 'Fredoka', cursive;
    font-size: 2rem;
    color: rgba(255,255,255,0.8);
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 2;
  }

  /* --- Sparkle canvas --- */
  #sparkles {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 200;
  }

  /* --- Mallet cursor --- */
  #mallet {
    position: fixed;
    pointer-events: none;
    z-index: 250;
    font-size: 48px;
    transform: translate(-50%, -80%) rotate(-30deg);
    transition: transform 0.06s ease-out;
    display: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  #mallet.strike {
    transform: translate(-50%, -70%) rotate(0deg);
  }

  /* --- Glow ring on pressed bar --- */
  @keyframes glowPulse {
    0%   { box-shadow: 0 0 20px 8px currentColor; opacity: 0.8; }
    100% { box-shadow: 0 0 40px 16px currentColor; opacity: 0; }
  }
</style>
</head>
<body>

<a href="../../index.html" class="back-btn-carnival">&#11013;&#65039; Games</a>

<div id="xylophone"></div>
<canvas id="sparkles"></canvas>
<div id="mallet">&#x1F528;</div>

<script>
// ---- Note Definitions (C4 to C5) ----
const BARS = [
  { note: 'C4',  freq: 261.63, label: 'C' },
  { note: 'D4',  freq: 293.66, label: 'D' },
  { note: 'E4',  freq: 329.63, label: 'E' },
  { note: 'F4',  freq: 349.23, label: 'F' },
  { note: 'G4',  freq: 392.00, label: 'G' },
  { note: 'A4',  freq: 440.00, label: 'A' },
  { note: 'B4',  freq: 493.88, label: 'B' },
  { note: 'C5',  freq: 523.25, label: 'C' },
];

const BAR_COLORS = [
  '#FF4444', '#FF8C00', '#FFD700', '#4CAF50',
  '#2196F3', '#3F51B5', '#9C27B0', '#7B1FA2'
];

// ---- Audio Engine ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNote(freq) {
  ensureAudio();
  const now = audioCtx.currentTime;
  const dur = 0.8;

  // Triangle wave for warm xylophone tone
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.setValueAtTime(freq, now);

  // Slight harmonic overtone (2x freq, quieter)
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(freq * 2, now);

  // Sub-harmonic for body
  const osc3 = audioCtx.createOscillator();
  osc3.type = 'sine';
  osc3.frequency.setValueAtTime(freq * 0.5, now);

  const gain1 = audioCtx.createGain();
  const gain2 = audioCtx.createGain();
  const gain3 = audioCtx.createGain();
  const master = audioCtx.createGain();

  osc1.connect(gain1); gain1.connect(master);
  osc2.connect(gain2); gain2.connect(master);
  osc3.connect(gain3); gain3.connect(master);
  master.connect(audioCtx.destination);

  // Xylophone-like envelope: sharp attack, quick decay, gentle sustain
  gain1.gain.setValueAtTime(0.2, now);
  gain2.gain.setValueAtTime(0.06, now);
  gain3.gain.setValueAtTime(0.04, now);

  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(1, now + 0.005); // sharp attack
  master.gain.exponentialRampToValueAtTime(0.4, now + 0.08); // quick decay
  master.gain.exponentialRampToValueAtTime(0.001, now + dur); // ring out

  osc1.start(now); osc1.stop(now + dur);
  osc2.start(now); osc2.stop(now + dur);
  osc3.start(now); osc3.stop(now + dur);
}

// ---- Build Xylophone ----
const xyloEl = document.getElementById('xylophone');
const barElements = [];

BARS.forEach((bar, i) => {
  const el = document.createElement('div');
  el.className = `bar bar-${i}`;
  el.dataset.index = i;
  el.innerHTML = `<span class="bar-label">${bar.label}</span>`;
  xyloEl.appendChild(el);
  barElements.push(el);
});

// ---- Sparkle System ----
const sparkleCanvas = document.getElementById('sparkles');
const sCtx = sparkleCanvas.getContext('2d');
const sparkles = [];

function resizeCanvas() {
  sparkleCanvas.width = window.innerWidth;
  sparkleCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnSparkles(barIndex, barEl) {
  const rect = barEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const color = BAR_COLORS[barIndex];

  for (let i = 0; i < 10; i++) {
    sparkles.push({
      x: cx + (Math.random() - 0.5) * rect.width * 0.8,
      y: cy + (Math.random() - 0.5) * rect.height,
      vx: (Math.random() - 0.5) * 6,
      vy: -2 - Math.random() * 5,
      size: 3 + Math.random() * 7,
      color: color,
      life: 1,
      decay: 0.015 + Math.random() * 0.01,
      shape: Math.random() > 0.4 ? 'circle' : 'star',
    });
  }
}

function drawStar(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](x + Math.cos(angle) * r, y + Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fill();
}

function updateSparkles() {
  sCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);

  for (let i = sparkles.length - 1; i >= 0; i--) {
    const p = sparkles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1; // gravity
    p.life -= p.decay;

    if (p.life <= 0) {
      sparkles.splice(i, 1);
      continue;
    }

    sCtx.globalAlpha = p.life;
    sCtx.fillStyle = p.color;
    sCtx.shadowColor = p.color;
    sCtx.shadowBlur = p.size * 1.5;

    if (p.shape === 'star') {
      drawStar(sCtx, p.x, p.y, p.size);
    } else {
      sCtx.beginPath();
      sCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      sCtx.fill();
    }
  }
  sCtx.globalAlpha = 1;
  sCtx.shadowBlur = 0;
}

// ---- Mallet ----
const malletEl = document.getElementById('mallet');
let malletVisible = false;

function showMallet(x, y) {
  malletEl.style.left = x + 'px';
  malletEl.style.top = y + 'px';
  malletEl.style.display = 'block';
  malletVisible = true;
}

function moveMallet(x, y) {
  if (!malletVisible) {
    malletEl.style.display = 'block';
    malletVisible = true;
  }
  malletEl.style.left = x + 'px';
  malletEl.style.top = y + 'px';
}

function strikeMallet() {
  malletEl.classList.add('strike');
  setTimeout(() => malletEl.classList.remove('strike'), 80);
}

function hideMallet() {
  malletEl.style.display = 'none';
  malletVisible = false;
}

// ---- Bar Hit Logic ----
function getBarFromPoint(x, y) {
  for (let i = 0; i < barElements.length; i++) {
    const rect = barElements[i].getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom && x >= rect.left && x <= rect.right) {
      return i;
    }
  }
  return -1;
}

function hitBar(index) {
  if (index < 0 || index >= BARS.length) return;
  const bar = BARS[index];
  const el = barElements[index];

  playNote(bar.freq);
  spawnSparkles(index, el);
  strikeMallet();

  // Bounce animation
  el.classList.remove('bounce');
  // Force reflow to restart animation
  void el.offsetWidth;
  el.classList.add('bounce');
}

// ---- Touch Handling (multi-touch + glissando) ----
const activeTouches = new Map(); // touchId -> last bar index

document.addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  for (const touch of e.changedTouches) {
    const barIdx = getBarFromPoint(touch.clientX, touch.clientY);
    showMallet(touch.clientX, touch.clientY);
    if (barIdx >= 0) {
      activeTouches.set(touch.identifier, barIdx);
      hitBar(barIdx);
    } else {
      activeTouches.set(touch.identifier, -1);
    }
  }
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    moveMallet(touch.clientX, touch.clientY);
    const newBar = getBarFromPoint(touch.clientX, touch.clientY);
    const oldBar = activeTouches.get(touch.identifier);
    if (newBar >= 0 && newBar !== oldBar) {
      activeTouches.set(touch.identifier, newBar);
      hitBar(newBar);
    }
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  for (const touch of e.changedTouches) {
    activeTouches.delete(touch.identifier);
  }
  if (activeTouches.size === 0) hideMallet();
});

document.addEventListener('touchcancel', (e) => {
  for (const touch of e.changedTouches) {
    activeTouches.delete(touch.identifier);
  }
  if (activeTouches.size === 0) hideMallet();
});

// ---- Mouse Fallback ----
let mouseDown = false;
let lastMouseBar = -1;

document.addEventListener('mousedown', (e) => {
  ensureAudio();
  mouseDown = true;
  showMallet(e.clientX, e.clientY);
  const barIdx = getBarFromPoint(e.clientX, e.clientY);
  if (barIdx >= 0) {
    lastMouseBar = barIdx;
    hitBar(barIdx);
  }
});

document.addEventListener('mousemove', (e) => {
  if (!mouseDown) return;
  moveMallet(e.clientX, e.clientY);
  const barIdx = getBarFromPoint(e.clientX, e.clientY);
  if (barIdx >= 0 && barIdx !== lastMouseBar) {
    lastMouseBar = barIdx;
    hitBar(barIdx);
  }
});

document.addEventListener('mouseup', () => {
  mouseDown = false;
  lastMouseBar = -1;
  hideMallet();
});

// ---- Animation Loop ----
function animate() {
  updateSparkles();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// First-tap audio init
document.body.addEventListener('pointerdown', ensureAudio, { once: true });
document.body.addEventListener('touchstart', ensureAudio, { once: true });
</script>
<script defer src="../../../prompt-viewer.js"></script>
</body>
</html>
