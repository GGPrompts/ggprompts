<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal Sounds!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    transition: background 0.5s ease;
  }

  /* Theme backgrounds */
  body.theme-farm {
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 40%, #7BC67E 40%, #4CAF50 100%);
  }
  body.theme-jungle {
    background: linear-gradient(180deg, #2D5016 0%, #3A6B1E 20%, #4A8528 50%, #2D5016 80%, #1A3A0A 100%);
  }
  body.theme-ocean {
    background: linear-gradient(180deg, #0077B6 0%, #0096C7 30%, #00B4D8 60%, #48CAE4 80%, #90E0EF 100%);
  }

  /* Background decorations */
  .bg-decor {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    transition: opacity 0.4s;
  }

  /* Farm: clouds + fence */
  .bg-farm .cloud {
    position: absolute;
    background: rgba(255,255,255,0.8);
    border-radius: 50px;
    animation: cloudDrift linear infinite;
  }
  .bg-farm .cloud:nth-child(1) { width: 120px; height: 50px; top: 5%; left: -120px; animation-duration: 25s; }
  .bg-farm .cloud:nth-child(2) { width: 90px; height: 40px; top: 12%; left: -90px; animation-duration: 30s; animation-delay: 5s; }
  .bg-farm .cloud:nth-child(3) { width: 150px; height: 55px; top: 2%; left: -150px; animation-duration: 35s; animation-delay: 12s; }
  .bg-farm .fence {
    position: absolute;
    bottom: 55%;
    left: 0; right: 0;
    height: 30px;
    display: flex;
    gap: 30px;
    padding: 0 10px;
  }
  .bg-farm .fence-post {
    width: 8px;
    height: 40px;
    background: #8B6914;
    border-radius: 2px;
    position: relative;
  }
  .bg-farm .fence-post::before {
    content: '';
    position: absolute;
    top: 8px; left: -12px;
    width: 32px; height: 4px;
    background: #A07818;
    border-radius: 2px;
  }
  .bg-farm .fence-post::after {
    content: '';
    position: absolute;
    top: 22px; left: -12px;
    width: 32px; height: 4px;
    background: #A07818;
    border-radius: 2px;
  }

  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* Jungle: vines + leaves */
  .bg-jungle .vine {
    position: absolute;
    top: -10px;
    width: 6px;
    background: #2D5016;
    border-radius: 3px;
    animation: vineGrow 3s ease-out forwards;
  }
  .bg-jungle .vine:nth-child(1) { left: 8%; height: 80px; }
  .bg-jungle .vine:nth-child(2) { left: 25%; height: 110px; animation-delay: 0.3s; }
  .bg-jungle .vine:nth-child(3) { right: 15%; height: 95px; animation-delay: 0.6s; }
  .bg-jungle .vine:nth-child(4) { right: 5%; height: 70px; animation-delay: 0.9s; }
  .bg-jungle .leaf {
    position: absolute;
    font-size: 2rem;
    opacity: 0.5;
    animation: leafSway 4s ease-in-out infinite;
  }
  .bg-jungle .leaf:nth-child(5) { top: 3%; left: 5%; animation-delay: 0s; }
  .bg-jungle .leaf:nth-child(6) { top: 1%; right: 8%; animation-delay: 1s; font-size: 2.5rem; }
  .bg-jungle .leaf:nth-child(7) { top: 6%; left: 40%; animation-delay: 2s; }

  @keyframes vineGrow { from { height: 0; } }
  @keyframes leafSway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Ocean: bubbles */
  .bg-ocean .sea-bubble {
    position: absolute;
    bottom: -20px;
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    animation: seaBubbleRise linear infinite;
  }
  .bg-ocean .sea-bubble:nth-child(1) { left: 10%; width: 8px; height: 8px; animation-duration: 8s; }
  .bg-ocean .sea-bubble:nth-child(2) { left: 30%; animation-duration: 10s; animation-delay: 2s; }
  .bg-ocean .sea-bubble:nth-child(3) { left: 55%; width: 16px; height: 16px; animation-duration: 7s; animation-delay: 4s; }
  .bg-ocean .sea-bubble:nth-child(4) { left: 75%; animation-duration: 9s; animation-delay: 1s; }
  .bg-ocean .sea-bubble:nth-child(5) { left: 90%; width: 10px; height: 10px; animation-duration: 11s; animation-delay: 3s; }

  @keyframes seaBubbleRise {
    from { transform: translateY(0) translateX(0); opacity: 0.6; }
    50% { transform: translateY(-50vh) translateX(15px); opacity: 0.4; }
    to { transform: translateY(-105vh) translateX(-10px); opacity: 0; }
  }

  /* Tab bar */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: 80px;
    display: flex;
    justify-content: center;
    gap: 8px;
    align-items: center;
    z-index: 100;
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  .tab-btn {
    width: 100px;
    height: 64px;
    border: 4px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    font-size: 2.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn:active { transform: scale(0.92); }
  .tab-btn.active {
    background: rgba(255,255,255,0.45);
    border-color: #FFD700;
    box-shadow: 0 0 16px rgba(255,215,0,0.5);
    transform: scale(1.05);
  }

  /* Animal grid */
  .animal-grid {
    position: absolute;
    top: 90px;
    left: 0; right: 0;
    bottom: 88px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    align-content: start;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 10;
  }

  .animal-btn {
    aspect-ratio: 1;
    border-radius: 24px;
    border: 4px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    animation: idleBob 3s ease-in-out infinite;
    position: relative;
    min-height: 110px;
  }
  .animal-btn:nth-child(2) { animation-delay: 0.4s; }
  .animal-btn:nth-child(3) { animation-delay: 0.8s; }
  .animal-btn:nth-child(4) { animation-delay: 1.2s; }
  .animal-btn:nth-child(5) { animation-delay: 1.6s; }
  .animal-btn:nth-child(6) { animation-delay: 2.0s; }
  .animal-btn:nth-child(7) { animation-delay: 2.4s; }
  .animal-btn:nth-child(8) { animation-delay: 2.8s; }

  .animal-btn:active { transform: scale(0.92); }

  @keyframes idleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes wiggle {
    0% { transform: rotate(0deg) scale(1.15); }
    15% { transform: rotate(-12deg) scale(1.2); }
    30% { transform: rotate(10deg) scale(1.18); }
    45% { transform: rotate(-8deg) scale(1.15); }
    60% { transform: rotate(6deg) scale(1.12); }
    75% { transform: rotate(-3deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .animal-btn.wiggling {
    animation: wiggle 0.6s ease-out forwards !important;
    border-color: #FFD700;
    box-shadow: 0 0 20px rgba(255,215,0,0.6);
  }

  /* Sparkles on tap */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    font-size: 1.5rem;
  }

  /* Title area */
  .title-area {
    position: fixed;
    top: 12px;
    left: 0; right: 0;
    text-align: center;
    z-index: 50;
    pointer-events: none;
  }
  .title-area h1 {
    font-family: 'Lilita One', 'Fredoka', cursive;
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 0 3px 8px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.3);
    letter-spacing: 1px;
  }
  .title-area .subtitle {
    font-size: 2.5rem;
    margin-top: 2px;
  }

  /* Back button (carnival style from bubblepop) */
  .back-btn-carnival {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 300;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    height: 64px;
    padding: 0 18px;
    background: linear-gradient(135deg, #FF69B4, #FF1493, #D42B2B);
    color: #fff;
    font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    text-decoration: none;
    border: 4px solid #FFD700;
    border-radius: 9999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn-carnival:hover,
  .back-btn-carnival:active {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.6);
  }
  .back-btn-carnival:active {
    transform: scale(0.96);
  }

  /* Hidden grids */
  .animal-grid { display: none; }
  .animal-grid.active { display: grid; }
  .bg-decor { display: none; }
  .bg-decor.active { display: block; }
</style>
</head>

<script>
// ---- Audio Engine ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

document.body.addEventListener('pointerdown', ensureAudio, { once: true });
document.body.addEventListener('touchstart', ensureAudio, { once: true });

// Helper: create oscillator + gain (caller must start/stop)
function osc(type, freq) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  o.type = type;
  const t = audioCtx.currentTime;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.3, t);
  return { o, g, t };
}

// ---- Animal Sound Synthesizers ----
const sounds = {
  // FARM
  cow() {
    // Low sine sweep "moo"
    const { o, g, t } = osc('sine', 150);
    o.frequency.linearRampToValueAtTime(120, t + 0.3);
    o.frequency.linearRampToValueAtTime(160, t + 0.6);
    o.frequency.linearRampToValueAtTime(110, t + 0.9);
    g.gain.linearRampToValueAtTime(0.35, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o.start(t); o.stop(t + 0.9);
  },
  chicken() {
    // Quick clucks "bawk bawk"
    for (let i = 0; i < 3; i++) {
      const { o, g, t } = osc('sawtooth', 400);
      const offset = i * 0.15;
      o.frequency.setValueAtTime(400 + Math.random() * 100, t + offset);
      o.frequency.exponentialRampToValueAtTime(250, t + offset + 0.1);
      g.gain.setValueAtTime(0.15, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.12);
      o.start(t + offset);
      o.stop(t + offset + 0.12);
    }
  },
  pig() {
    // Nasal oink
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(200, t);
    o1.frequency.linearRampToValueAtTime(280, t + 0.15);
    o1.frequency.linearRampToValueAtTime(150, t + 0.4);
    o2.frequency.setValueAtTime(205, t);
    o2.frequency.linearRampToValueAtTime(285, t + 0.15);
    o2.frequency.linearRampToValueAtTime(155, t + 0.4);
    g.gain.setValueAtTime(0.12, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o1.start(t); o2.start(t);
    o1.stop(t + 0.4); o2.stop(t + 0.4);
  },
  horse() {
    // Whinny: rising then falling
    const { o, g, t } = osc('sawtooth', 300);
    o.frequency.linearRampToValueAtTime(600, t + 0.2);
    o.frequency.linearRampToValueAtTime(550, t + 0.35);
    o.frequency.linearRampToValueAtTime(350, t + 0.55);
    o.frequency.linearRampToValueAtTime(200, t + 0.7);
    g.gain.setValueAtTime(0.15, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.start(t); o.stop(t + 0.7);
  },
  sheep() {
    // "Baa" with vibrato
    const o1 = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    const g = audioCtx.createGain();
    lfo.connect(lfoG); lfoG.connect(o1.frequency);
    o1.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(300, t);
    o1.frequency.linearRampToValueAtTime(350, t + 0.1);
    o1.frequency.linearRampToValueAtTime(280, t + 0.6);
    lfo.frequency.setValueAtTime(8, t);
    lfoG.gain.setValueAtTime(15, t);
    g.gain.setValueAtTime(0.15, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o1.start(t); lfo.start(t);
    o1.stop(t + 0.6); lfo.stop(t + 0.6);
  },
  duck() {
    // Quack quack
    for (let i = 0; i < 2; i++) {
      const { o, g, t } = osc('square', 500);
      const offset = i * 0.2;
      o.frequency.setValueAtTime(500, t + offset);
      o.frequency.exponentialRampToValueAtTime(250, t + offset + 0.12);
      g.gain.setValueAtTime(0.12, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.15);
      o.start(t + offset);
      o.stop(t + offset + 0.15);
    }
  },
  rooster() {
    // Cock-a-doodle-doo: ascending cry
    const { o, g, t } = osc('sawtooth', 400);
    o.frequency.setValueAtTime(400, t);
    o.frequency.linearRampToValueAtTime(800, t + 0.15);
    o.frequency.setValueAtTime(600, t + 0.2);
    o.frequency.linearRampToValueAtTime(900, t + 0.4);
    o.frequency.linearRampToValueAtTime(700, t + 0.6);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.8);
    g.gain.setValueAtTime(0.12, t);
    g.gain.linearRampToValueAtTime(0.2, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.start(t); o.stop(t + 0.8);
  },
  dog() {
    // Bark bark
    for (let i = 0; i < 2; i++) {
      const offset = i * 0.25;
      const o1 = audioCtx.createOscillator();
      const g1 = audioCtx.createGain();
      o1.connect(g1); g1.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      o1.type = 'sawtooth';
      o1.frequency.setValueAtTime(350, t + offset);
      o1.frequency.exponentialRampToValueAtTime(200, t + offset + 0.15);
      g1.gain.setValueAtTime(0.2, t + offset);
      g1.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.18);
      o1.start(t + offset);
      o1.stop(t + offset + 0.2);
    }
  },

  // JUNGLE
  lion() {
    // Deep roar with rumble
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sawtooth'; o2.type = 'sine';
    o1.frequency.setValueAtTime(100, t);
    o1.frequency.linearRampToValueAtTime(180, t + 0.3);
    o1.frequency.linearRampToValueAtTime(80, t + 1.0);
    o2.frequency.setValueAtTime(50, t);
    o2.frequency.linearRampToValueAtTime(70, t + 0.3);
    o2.frequency.linearRampToValueAtTime(40, t + 1.0);
    g.gain.setValueAtTime(0.15, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
    o1.start(t); o2.start(t);
    o1.stop(t + 1.0); o2.stop(t + 1.0);
  },
  monkey() {
    // Excited "ooh ooh" chirps
    for (let i = 0; i < 4; i++) {
      const { o, g, t } = osc('sine', 800 + i * 100);
      const offset = i * 0.12;
      o.frequency.setValueAtTime(800 + i * 100, t + offset);
      o.frequency.exponentialRampToValueAtTime(500, t + offset + 0.08);
      g.gain.setValueAtTime(0.2, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.1);
      o.start(t + offset);
      o.stop(t + offset + 0.1);
    }
  },
  elephant() {
    // Trumpet blast
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(200, t);
    o1.frequency.linearRampToValueAtTime(500, t + 0.2);
    o1.frequency.linearRampToValueAtTime(450, t + 0.6);
    o1.frequency.linearRampToValueAtTime(250, t + 0.9);
    o2.frequency.setValueAtTime(203, t);
    o2.frequency.linearRampToValueAtTime(503, t + 0.2);
    o2.frequency.linearRampToValueAtTime(453, t + 0.6);
    o2.frequency.linearRampToValueAtTime(253, t + 0.9);
    g.gain.setValueAtTime(0.1, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o1.start(t); o2.start(t);
    o1.stop(t + 0.9); o2.stop(t + 0.9);
  },
  parrot() {
    // High chirpy squawk
    for (let i = 0; i < 3; i++) {
      const { o, g, t } = osc('square', 1200);
      const offset = i * 0.18;
      o.frequency.setValueAtTime(1200 + Math.random() * 400, t + offset);
      o.frequency.exponentialRampToValueAtTime(600, t + offset + 0.1);
      g.gain.setValueAtTime(0.1, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.12);
      o.start(t + offset);
      o.stop(t + offset + 0.12);
    }
  },
  snake() {
    // Hissing noise
    const bufSize = audioCtx.sampleRate * 0.6;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.3;
    }
    const src = audioCtx.createBufferSource();
    const filt = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    src.buffer = buf;
    src.connect(filt);
    filt.connect(g);
    g.connect(audioCtx.destination);
    filt.type = 'highpass';
    filt.frequency.setValueAtTime(3000, audioCtx.currentTime);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    src.start();
  },
  frog() {
    // Ribbit: two quick descending tones
    for (let i = 0; i < 2; i++) {
      const { o, g, t } = osc('sine', 600);
      const offset = i * 0.2;
      o.frequency.setValueAtTime(600, t + offset);
      o.frequency.exponentialRampToValueAtTime(200, t + offset + 0.12);
      g.gain.setValueAtTime(0.25, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.15);
      o.start(t + offset);
      o.stop(t + offset + 0.15);
    }
  },
  tiger() {
    // Growl: low sawtooth rumble
    const o1 = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    const g = audioCtx.createGain();
    lfo.connect(lfoG); lfoG.connect(o1.frequency);
    o1.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(90, t);
    o1.frequency.linearRampToValueAtTime(130, t + 0.3);
    o1.frequency.linearRampToValueAtTime(70, t + 0.8);
    lfo.frequency.setValueAtTime(15, t);
    lfoG.gain.setValueAtTime(20, t);
    g.gain.setValueAtTime(0.2, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o1.start(t); lfo.start(t);
    o1.stop(t + 0.8); lfo.stop(t + 0.8);
  },
  gorilla() {
    // Chest-beat booms
    for (let i = 0; i < 4; i++) {
      const { o, g, t } = osc('sine', 80);
      const offset = i * 0.15;
      o.frequency.setValueAtTime(80, t + offset);
      o.frequency.exponentialRampToValueAtTime(40, t + offset + 0.1);
      g.gain.setValueAtTime(0.3, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.12);
      o.start(t + offset);
      o.stop(t + offset + 0.12);
    }
  },

  // OCEAN
  whale() {
    // Haunting whale song: slow sine sweep
    const o1 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o1.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sine';
    o1.frequency.setValueAtTime(180, t);
    o1.frequency.linearRampToValueAtTime(300, t + 0.5);
    o1.frequency.linearRampToValueAtTime(200, t + 1.0);
    o1.frequency.linearRampToValueAtTime(350, t + 1.4);
    o1.frequency.linearRampToValueAtTime(150, t + 1.8);
    g.gain.setValueAtTime(0.2, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    o1.start(t);
    o1.stop(t + 1.8);
  },
  dolphin() {
    // High-pitched clicks and squeaks
    for (let i = 0; i < 5; i++) {
      const { o, g, t } = osc('sine', 2000 + Math.random() * 1000);
      const offset = i * 0.1;
      g.gain.setValueAtTime(0.15, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.05);
      o.start(t + offset);
      o.stop(t + offset + 0.06);
    }
  },
  fish() {
    // Bubble blops
    for (let i = 0; i < 3; i++) {
      const { o, g, t } = osc('sine', 500 + Math.random() * 200);
      const offset = i * 0.15;
      o.frequency.exponentialRampToValueAtTime(200, t + offset + 0.08);
      g.gain.setValueAtTime(0.2, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.1);
      o.start(t + offset);
      o.stop(t + offset + 0.1);
    }
  },
  octopus() {
    // Wobbly underwater bloop
    const o1 = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoG = audioCtx.createGain();
    const g = audioCtx.createGain();
    lfo.connect(lfoG); lfoG.connect(o1.frequency);
    o1.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o1.type = 'sine';
    o1.frequency.setValueAtTime(300, t);
    o1.frequency.linearRampToValueAtTime(150, t + 0.5);
    lfo.frequency.setValueAtTime(12, t);
    lfoG.gain.setValueAtTime(50, t);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o1.start(t); lfo.start(t);
    o1.stop(t + 0.5); lfo.stop(t + 0.5);
  },
  crab() {
    // Snappy clicks
    for (let i = 0; i < 2; i++) {
      const offset = i * 0.12;
      const bufSize = audioCtx.sampleRate * 0.03;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let j = 0; j < bufSize; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufSize * 0.15));
      }
      const src = audioCtx.createBufferSource();
      const filt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      src.buffer = buf;
      src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(2000, audioCtx.currentTime + offset);
      filt.Q.setValueAtTime(5, audioCtx.currentTime + offset);
      g.gain.setValueAtTime(0.4, audioCtx.currentTime + offset);
      src.start(audioCtx.currentTime + offset);
    }
  },
  seal() {
    // Arf arf bark
    for (let i = 0; i < 2; i++) {
      const { o, g, t } = osc('sawtooth', 450);
      const offset = i * 0.22;
      o.frequency.setValueAtTime(450, t + offset);
      o.frequency.linearRampToValueAtTime(600, t + offset + 0.05);
      o.frequency.exponentialRampToValueAtTime(250, t + offset + 0.15);
      g.gain.setValueAtTime(0.15, t + offset);
      g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.18);
      o.start(t + offset);
      o.stop(t + offset + 0.18);
    }
  },
  turtle() {
    // Gentle low hum
    const { o, g, t } = osc('sine', 120);
    o.frequency.linearRampToValueAtTime(140, t + 0.2);
    o.frequency.linearRampToValueAtTime(100, t + 0.5);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.start(t); o.stop(t + 0.5);
  },
  shrimp() {
    // Tiny snap (pistol shrimp!)
    const bufSize = audioCtx.sampleRate * 0.02;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.08));
    }
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    src.buffer = buf;
    src.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.35, audioCtx.currentTime);
    src.start();
  }
};

// ---- Tab Switching ----
const themes = ['farm', 'jungle', 'ocean'];
const themeIcons = { farm: '\uD83C\uDFE1', jungle: '\uD83C\uDF34', ocean: '\uD83C\uDF0A' };
let currentTheme = 'farm';

function switchTheme(theme) {
  if (theme === currentTheme) return;
  currentTheme = theme;

  // Body class
  document.body.className = 'theme-' + theme;

  // Tab buttons
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });

  // Grids
  document.querySelectorAll('.animal-grid').forEach(grid => {
    grid.classList.toggle('active', grid.id === 'grid-' + theme);
  });

  // Backgrounds
  document.querySelectorAll('.bg-decor').forEach(bg => {
    bg.classList.toggle('active', bg.id === 'bg-' + theme);
  });

  // Title icon
  document.getElementById('themeIcon').textContent = themeIcons[theme];
}

// Init title icon
document.getElementById('themeIcon').textContent = themeIcons.farm;

// Tab click handlers
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    switchTheme(btn.dataset.theme);
  });
});

// ---- Animal Button Handlers ----
function spawnSparkles(btn) {
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const sparkles = ['\u2728', '\u2B50', '\uD83C\uDF1F', '\u2764\uFE0F', '\uD83D\uDCAB'];

  for (let i = 0; i < 5; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
    sp.style.left = cx + 'px';
    sp.style.top = cy + 'px';
    document.body.appendChild(sp);

    const angle = (Math.PI * 2 / 5) * i + Math.random() * 0.5;
    const dist = 40 + Math.random() * 60;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;

    sp.animate([
      { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2)`, opacity: 0 }
    ], { duration: 500 + Math.random() * 200, easing: 'ease-out', fill: 'forwards' })
    .onfinish = () => sp.remove();
  }
}

document.querySelectorAll('.animal-btn').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();

    const animal = btn.dataset.animal;
    if (sounds[animal]) sounds[animal]();

    // Wiggle animation
    btn.classList.remove('wiggling');
    // Force reflow to restart animation
    void btn.offsetWidth;
    btn.classList.add('wiggling');

    // Sparkles
    spawnSparkles(btn);

    // Remove wiggle class when done
    setTimeout(() => btn.classList.remove('wiggling'), 600);
  });

  // Prevent touch default to avoid double-fire
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
  }, { passive: false });
});

// ---- Build farm fence ----
(function buildFence() {
  const fence = document.getElementById('fence');
  const posts = Math.ceil(window.innerWidth / 38);
  for (let i = 0; i < posts; i++) {
    const post = document.createElement('div');
    post.className = 'fence-post';
    fence.appendChild(post);
  }
})();
</script>
