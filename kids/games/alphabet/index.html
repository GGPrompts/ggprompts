<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="ABC Tracing! — a fun, toddler-friendly game from Kids' Corner.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ABC Tracing!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #87CEEB;
    --sky-bottom: #E0F4FF;
    --pink: #FFB3D9;
    --red: #D42B2B;
    --gold: #F5C542;
    --blue: #42A5F5;
    --green: #66BB6A;
    --purple: #B07CC6;
    --orange: #FF8F00;
    --yellow: #FFE066;
    --font: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    --font-heading: 'Lilita One', cursive;
    --radius: 20px;
    --radius-pill: 9999px;
    --shadow: 0 4px 16px rgba(0,0,0,0.15);
    --btn-bg: linear-gradient(135deg, #FF69B4, #FF1493, #D42B2B);
    --btn-border: #FFD700;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--sky-bottom) 0%, var(--sky-top) 100%);
  }

  /* ── Back Button ── */
  .back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: var(--btn-bg);
    color: #fff;
    font-size: 1.6rem;
    text-decoration: none;
    border: 4px solid var(--btn-border);
    border-radius: 50%;
    box-shadow: var(--shadow), 0 0 12px rgba(255,215,0,0.4);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .back-btn:hover, .back-btn:active { transform: scale(1.1); }
  .back-btn:active { transform: scale(0.94); }

  /* ── Top Bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 70px;
    background: linear-gradient(135deg, var(--pink), #A8D8EA);
    flex-shrink: 0;
    z-index: 10;
    border-bottom: 3px solid rgba(255,255,255,0.5);
    min-height: 60px;
  }

  .letter-label {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    text-align: center;
  }

  .emoji-label {
    font-size: 1.8rem;
    line-height: 1;
  }

  /* ── Canvas Area ── */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 10px;
  }

  canvas {
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow), inset 0 0 30px rgba(0,0,0,0.03);
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }

  /* ── Bottom Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 12px;
    background: linear-gradient(135deg, #A8D8EA, var(--pink));
    flex-shrink: 0;
    z-index: 10;
    border-top: 3px solid rgba(255,255,255,0.5);
    flex-wrap: wrap;
  }

  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 56px;
    height: 56px;
    padding: 0 14px;
    border: 4px solid var(--btn-border);
    border-radius: var(--radius-pill);
    background: var(--btn-bg);
    color: #fff;
    font-family: var(--font-heading);
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: var(--shadow), 0 0 8px rgba(255,215,0,0.3);
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:hover { transform: scale(1.08); }
  .ctrl-btn:active { transform: scale(0.93); }

  .ctrl-btn.nav { font-size: 1.6rem; min-width: 60px; }
  .ctrl-btn.case-toggle { font-size: 1rem; padding: 0 16px; }
  .ctrl-btn.clear { background: linear-gradient(135deg, var(--blue), #1976D2); font-size: 1.5rem; }

  .letter-display {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    min-width: 40px;
    text-align: center;
  }

  /* ── Celebration Overlay ── */
  .celebration {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .celebration.active {
    opacity: 1;
    pointer-events: auto;
  }

  .celebration-text {
    font-family: var(--font-heading);
    font-size: clamp(3rem, 12vw, 6rem);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--red), -2px -2px 0 var(--pink);
    animation: celebBounce 0.6s ease-in-out infinite alternate;
  }

  .celebration-emoji {
    font-size: clamp(3rem, 10vw, 5rem);
    margin-top: 10px;
    animation: celebSpin 1s ease-in-out infinite;
  }

  @keyframes celebBounce {
    0% { transform: scale(1) rotate(-2deg); }
    100% { transform: scale(1.1) rotate(2deg); }
  }

  @keyframes celebSpin {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(10deg); }
  }

  /* ── Confetti Particle ── */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 1001;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  /* ── Stars Burst ── */
  .star-burst {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    z-index: 1001;
    animation: starPop 0.8s ease-out forwards;
  }

  @keyframes starPop {
    0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
    60% { opacity: 1; transform: translate(var(--sx), var(--sy)) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.3); }
  }

  /* ── Progress Dots ── */
  .progress {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .progress-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: background 0.3s, transform 0.3s;
  }
  .progress-dot.active {
    background: #fff;
    transform: scale(1.3);
  }
  .progress-dot.done {
    background: var(--gold);
  }

  /* ── Responsive ── */
  @media (max-width: 400px) {
    .ctrl-btn { min-width: 48px; height: 48px; font-size: 1.1rem; }
    .ctrl-btn.nav { min-width: 52px; font-size: 1.3rem; }
    .controls { gap: 6px; padding: 8px 8px; }
    .top-bar { padding: 8px 64px; }
  }

  @media (min-height: 700px) {
    .canvas-area { padding: 16px; }
  }

  /* ── Safe area for notched devices ── */
  @supports (padding: env(safe-area-inset-top)) {
    .top-bar { padding-top: calc(10px + env(safe-area-inset-top)); }
    .controls { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .back-btn { top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); }
  }
</style>
</head>
<body>

<!-- Back Button -->
<a href="../../" class="back-btn" aria-label="Back to Kids Corner">&#11013;</a>

<!-- Top Bar -->
<div class="top-bar">
  <span class="emoji-label" id="emoji-display"></span>
  <span class="letter-label" id="letter-label"></span>
</div>

<!-- Canvas -->
<div class="canvas-area">
  <canvas id="trace-canvas"></canvas>
</div>

<!-- Bottom Controls -->
<div class="controls">
  <button class="ctrl-btn nav" id="btn-prev" aria-label="Previous letter">&#9664;</button>
  <span class="letter-display" id="current-letter">A</span>
  <button class="ctrl-btn nav" id="btn-next" aria-label="Next letter">&#9654;</button>
  <button class="ctrl-btn case-toggle" id="btn-case" aria-label="Toggle case">Aa</button>
  <button class="ctrl-btn clear" id="btn-clear" aria-label="Clear tracing">&#8634;</button>
</div>

<!-- Celebration Overlay -->
<div class="celebration" id="celebration">
  <div class="celebration-text" id="celeb-text"></div>
  <div class="celebration-emoji" id="celeb-emoji"></div>
</div>

<script>
(function() {
  'use strict';

  // ── Letter Data ──
  var LETTERS = [
    { letter: 'A', emoji: '\uD83C\uDF4E', word: 'Apple' },
    { letter: 'B', emoji: '\uD83D\uDC3B', word: 'Bear' },
    { letter: 'C', emoji: '\uD83D\uDC31', word: 'Cat' },
    { letter: 'D', emoji: '\uD83D\uDC36', word: 'Dog' },
    { letter: 'E', emoji: '\uD83D\uDC18', word: 'Elephant' },
    { letter: 'F', emoji: '\uD83D\uDC38', word: 'Frog' },
    { letter: 'G', emoji: '\uD83E\uDD92', word: 'Giraffe' },
    { letter: 'H', emoji: '\uD83C\uDFE0', word: 'House' },
    { letter: 'I', emoji: '\uD83C\uDF68', word: 'Ice Cream' },
    { letter: 'J', emoji: '\uD83E\uDD6D', word: 'Juice' },
    { letter: 'K', emoji: '\uD83E\uDD81', word: 'King (Lion)' },
    { letter: 'L', emoji: '\uD83E\uDD81', word: 'Lion' },
    { letter: 'M', emoji: '\uD83D\uDC12', word: 'Monkey' },
    { letter: 'N', emoji: '\uD83C\uDF19', word: 'Night' },
    { letter: 'O', emoji: '\uD83D\uDC19', word: 'Octopus' },
    { letter: 'P', emoji: '\uD83D\uDC27', word: 'Penguin' },
    { letter: 'Q', emoji: '\uD83D\uDC51', word: 'Queen' },
    { letter: 'R', emoji: '\uD83C\uDF08', word: 'Rainbow' },
    { letter: 'S', emoji: '\u2B50', word: 'Star' },
    { letter: 'T', emoji: '\uD83C\uDF33', word: 'Tree' },
    { letter: 'U', emoji: '\u2602\uFE0F', word: 'Umbrella' },
    { letter: 'V', emoji: '\uD83C\uDFBB', word: 'Violin' },
    { letter: 'W', emoji: '\uD83D\uDC33', word: 'Whale' },
    { letter: 'X', emoji: '\uD83C\uDFB8', word: 'Xylophone' },
    { letter: 'Y', emoji: '\uD83D\uDC9B', word: 'Yellow' },
    { letter: 'Z', emoji: '\uD83E\uDD93', word: 'Zebra' }
  ];

  var TRACE_COLORS = ['#FF69B4', '#42A5F5', '#66BB6A', '#F5C542', '#B07CC6', '#FF8F00', '#E53935', '#00BCD4'];
  var CELEB_WORDS = ['YAY!', 'WOW!', 'GREAT!', 'SUPER!', 'NICE!'];

  // ── State ──
  var currentIndex = 0;
  var isUppercase = true;
  var isDrawing = false;
  var tracePoints = [];
  var guidePoints = [];
  var tracedSegments = [];
  var completed = false;
  var audioCtx = null;

  // ── DOM refs ──
  var canvas = document.getElementById('trace-canvas');
  var ctx = canvas.getContext('2d');
  var emojiDisplay = document.getElementById('emoji-display');
  var letterLabel = document.getElementById('letter-label');
  var currentLetterEl = document.getElementById('current-letter');
  var celebration = document.getElementById('celebration');
  var celebText = document.getElementById('celeb-text');
  var celebEmoji = document.getElementById('celeb-emoji');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var btnCase = document.getElementById('btn-case');
  var btnClear = document.getElementById('btn-clear');

  // ── Audio ──
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTraceSound() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    var freq = 400 + Math.random() * 300;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playCompleteSound() {
    if (!audioCtx) return;
    var notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach(function(freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      var t = audioCtx.currentTime + i * 0.12;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  }

  function playNavSound() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.12);
  }

  // ── Canvas Sizing ──
  function resizeCanvas() {
    var area = canvas.parentElement;
    var pad = 20;
    var maxW = Math.min(area.clientWidth - pad, 600);
    var maxH = area.clientHeight - pad;
    var size = Math.min(maxW, maxH);
    size = Math.max(size, 200);
    canvas.width = size * (window.devicePixelRatio || 1);
    canvas.height = size * (window.devicePixelRatio || 1);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform((window.devicePixelRatio || 1), 0, 0, (window.devicePixelRatio || 1), 0, 0);
    renderLetter();
  }

  // ── Generate Guide Points for a Letter ──
  // We render the letter off-screen, scan for its outline, and create guide path points
  function generateGuidePoints(letter) {
    var size = parseInt(canvas.style.width) || 400;
    var offscreen = document.createElement('canvas');
    offscreen.width = size;
    offscreen.height = size;
    var offCtx = offscreen.getContext('2d');

    // Draw the letter large and bold
    var fontSize = size * 0.7;
    offCtx.font = '900 ' + fontSize + 'px ' + var_font_heading();
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillStyle = '#000';
    offCtx.fillText(letter, size / 2, size / 2);

    // Scan for filled pixels to create the letter mask
    var imageData = offCtx.getImageData(0, 0, size, size);
    var data = imageData.data;
    var points = [];

    // Sample grid points that are inside the letter
    var step = Math.max(4, Math.floor(size / 80));
    for (var y = 0; y < size; y += step) {
      for (var x = 0; x < size; x += step) {
        var idx = (y * size + x) * 4;
        if (data[idx + 3] > 128) {
          points.push({ x: x, y: y });
        }
      }
    }
    return points;
  }

  function var_font_heading() {
    return "'Lilita One', cursive";
  }

  // ── Drawing ──
  function renderLetter() {
    var size = parseInt(canvas.style.width) || 400;
    ctx.clearRect(0, 0, size, size);

    // Draw subtle grid dots
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    var gridStep = size / 20;
    for (var gy = gridStep; gy < size; gy += gridStep) {
      for (var gx = gridStep; gx < size; gx += gridStep) {
        ctx.beginPath();
        ctx.arc(gx, gy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    var letter = getLetter();
    var fontSize = size * 0.7;

    // Draw dotted letter outline
    ctx.save();
    ctx.font = '900 ' + fontSize + 'px ' + var_font_heading();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.strokeText(letter, size / 2, size / 2);
    ctx.setLineDash([]);

    // Draw light filled letter
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.fillText(letter, size / 2, size / 2);
    ctx.restore();

    // Draw directional arrow hints
    drawDirectionHints(letter, size, fontSize);

    // Draw user trace strokes
    drawTraceStrokes(size);

    // Draw traced/matched segments highlight
    drawTracedHighlight(size);
  }

  function drawDirectionHints(letter, size, fontSize) {
    // Show a small numbered start dot
    // We approximate the starting position for each letter
    var starts = getLetterStartPoint(letter, size);
    if (!starts) return;

    ctx.save();
    ctx.fillStyle = var_traceColor();
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(starts.x, starts.y, 10, 0, Math.PI * 2);
    ctx.fill();

    // Draw a small "1" inside the dot
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px ' + var_font_heading();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('1', starts.x, starts.y);
    ctx.restore();
  }

  function getLetterStartPoint(letter, size) {
    var cx = size / 2;
    var cy = size / 2;
    var top = size * 0.18;
    var bot = size * 0.82;
    var left = size * 0.22;
    var right = size * 0.78;

    // Approximate start points for uppercase letters
    var upperStarts = {
      'A': { x: cx, y: top },
      'B': { x: left, y: top },
      'C': { x: right, y: top + 20 },
      'D': { x: left, y: top },
      'E': { x: left, y: top },
      'F': { x: left, y: top },
      'G': { x: right, y: top + 20 },
      'H': { x: left, y: top },
      'I': { x: cx, y: top },
      'J': { x: right - 10, y: top },
      'K': { x: left, y: top },
      'L': { x: left, y: top },
      'M': { x: left, y: bot },
      'N': { x: left, y: bot },
      'O': { x: cx, y: top },
      'P': { x: left, y: top },
      'Q': { x: cx, y: top },
      'R': { x: left, y: top },
      'S': { x: right - 10, y: top + 20 },
      'T': { x: left, y: top },
      'U': { x: left, y: top },
      'V': { x: left, y: top },
      'W': { x: left, y: top },
      'X': { x: left, y: top },
      'Y': { x: left, y: top },
      'Z': { x: left, y: top }
    };

    var base = letter.toUpperCase();
    var pt = upperStarts[base];
    if (!pt) return { x: left, y: top };

    // For lowercase, adjust slightly down
    if (letter !== base) {
      return { x: pt.x, y: Math.min(pt.y + size * 0.1, bot) };
    }
    return pt;
  }

  function var_traceColor() {
    return TRACE_COLORS[currentIndex % TRACE_COLORS.length];
  }

  function drawTraceStrokes(size) {
    if (tracePoints.length < 2) return;

    ctx.save();
    ctx.strokeStyle = var_traceColor();
    ctx.lineWidth = Math.max(8, size * 0.025);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.85;

    ctx.beginPath();
    ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
    for (var i = 1; i < tracePoints.length; i++) {
      // Use null points as stroke breaks
      if (tracePoints[i] === null) {
        if (i + 1 < tracePoints.length && tracePoints[i + 1] !== null) {
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(tracePoints[i + 1].x, tracePoints[i + 1].y);
          i++;
        }
        continue;
      }
      ctx.lineTo(tracePoints[i].x, tracePoints[i].y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawTracedHighlight(size) {
    if (tracedSegments.length === 0) return;

    ctx.save();
    var color = var_traceColor();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.25;

    tracedSegments.forEach(function(pt) {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function getLetter() {
    var l = LETTERS[currentIndex].letter;
    return isUppercase ? l : l.toLowerCase();
  }

  // ── Tracing Logic ──
  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startTrace(e) {
    if (completed) return;
    initAudio();
    isDrawing = true;
    var pos = getCanvasPos(e);
    // Insert break if continuing after a lift
    if (tracePoints.length > 0) {
      tracePoints.push(null);
    }
    tracePoints.push(pos);
    checkTraceMatch(pos);
    renderLetter();
    e.preventDefault();
  }

  function moveTrace(e) {
    if (!isDrawing || completed) return;
    var pos = getCanvasPos(e);
    tracePoints.push(pos);
    checkTraceMatch(pos);

    // Periodic trace sound
    if (tracePoints.length % 8 === 0) {
      playTraceSound();
    }

    renderLetter();
    e.preventDefault();
  }

  function endTrace(e) {
    if (!isDrawing) return;
    isDrawing = false;
    checkCompletion();
    if (e) e.preventDefault();
  }

  function checkTraceMatch(pos) {
    // Check if trace point is near any guide points
    var matchDist = Math.max(12, parseInt(canvas.style.width) * 0.04);
    guidePoints.forEach(function(gp) {
      var dx = pos.x - gp.x;
      var dy = pos.y - gp.y;
      if (dx * dx + dy * dy < matchDist * matchDist) {
        if (!gp.traced) {
          gp.traced = true;
          tracedSegments.push(gp);
        }
      }
    });
  }

  function checkCompletion() {
    if (completed) return;
    if (guidePoints.length === 0) return;

    var tracedCount = 0;
    guidePoints.forEach(function(gp) {
      if (gp.traced) tracedCount++;
    });

    var ratio = tracedCount / guidePoints.length;

    // Need 55% coverage to complete
    if (ratio >= 0.55) {
      completed = true;
      showCelebration();
    }
  }

  // ── Celebration ──
  function showCelebration() {
    playCompleteSound();

    var data = LETTERS[currentIndex];
    celebText.textContent = CELEB_WORDS[Math.floor(Math.random() * CELEB_WORDS.length)];
    celebEmoji.textContent = data.emoji;
    celebration.classList.add('active');

    // Confetti
    spawnConfetti();

    // Stars
    spawnStars();

    // Auto-dismiss after 2.5s
    setTimeout(function() {
      celebration.classList.remove('active');
    }, 2500);
  }

  function spawnConfetti() {
    var colors = ['#FF69B4', '#42A5F5', '#66BB6A', '#F5C542', '#B07CC6', '#FF8F00', '#E53935'];
    for (var i = 0; i < 40; i++) {
      (function(idx) {
        setTimeout(function() {
          var el = document.createElement('div');
          el.className = 'confetti';
          el.style.left = (Math.random() * 100) + 'vw';
          el.style.top = '-20px';
          el.style.background = colors[idx % colors.length];
          el.style.width = (6 + Math.random() * 10) + 'px';
          el.style.height = (6 + Math.random() * 10) + 'px';
          el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
          document.body.appendChild(el);
          setTimeout(function() { el.remove(); }, 3500);
        }, idx * 40);
      })(i);
    }
  }

  function spawnStars() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var emojis = ['\u2B50', '\uD83C\uDF1F', '\u2728', '\uD83C\uDF89'];
    for (var i = 0; i < 12; i++) {
      var el = document.createElement('div');
      el.className = 'star-burst';
      el.textContent = emojis[i % emojis.length];
      var angle = (Math.PI * 2 / 12) * i;
      var dist = 80 + Math.random() * 120;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--sx', (Math.cos(angle) * dist) + 'px');
      el.style.setProperty('--sy', (Math.sin(angle) * dist) + 'px');
      document.body.appendChild(el);
      setTimeout(function(e) { return function() { e.remove(); }; }(el), 1000);
    }
  }

  // ── Navigation ──
  function goToLetter(index) {
    initAudio();
    playNavSound();
    currentIndex = ((index % 26) + 26) % 26;
    resetTracing();
    updateUI();
  }

  function resetTracing() {
    tracePoints = [];
    tracedSegments = [];
    completed = false;
    celebration.classList.remove('active');
    guidePoints = generateGuidePoints(getLetter());
    renderLetter();
  }

  function updateUI() {
    var data = LETTERS[currentIndex];
    var letter = getLetter();
    emojiDisplay.textContent = data.emoji;
    letterLabel.textContent = letter + ' is for ' + data.word;
    currentLetterEl.textContent = letter;
    btnCase.textContent = isUppercase ? 'Aa' : 'aA';
  }

  // ── Event Listeners ──
  canvas.addEventListener('mousedown', startTrace);
  canvas.addEventListener('mousemove', moveTrace);
  canvas.addEventListener('mouseup', endTrace);
  canvas.addEventListener('mouseleave', endTrace);
  canvas.addEventListener('touchstart', startTrace, { passive: false });
  canvas.addEventListener('touchmove', moveTrace, { passive: false });
  canvas.addEventListener('touchend', endTrace, { passive: false });
  canvas.addEventListener('touchcancel', endTrace, { passive: false });

  btnPrev.addEventListener('click', function() { goToLetter(currentIndex - 1); });
  btnNext.addEventListener('click', function() { goToLetter(currentIndex + 1); });
  btnClear.addEventListener('click', function() { initAudio(); playNavSound(); resetTracing(); });
  btnCase.addEventListener('click', function() {
    initAudio();
    playNavSound();
    isUppercase = !isUppercase;
    resetTracing();
    updateUI();
  });

  // Tap on celebration to dismiss
  celebration.addEventListener('click', function() {
    celebration.classList.remove('active');
  });
  celebration.addEventListener('touchend', function() {
    celebration.classList.remove('active');
  });

  // Handle resize
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      resizeCanvas();
      resetTracing();
    }, 150);
  });

  // ── Init ──
  resizeCanvas();
  updateUI();
  resetTracing();
})();
</script>
<script defer src="../../../prompt-viewer.js"></script>
</body>
</html>
