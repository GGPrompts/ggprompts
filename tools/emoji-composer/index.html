<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Emoji Composer — a creative tool built with vanilla HTML/CSS/JS.">
    <title>Emoji Composer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           EMOJI COMPOSER — Bright, playful sticker-sheet aesthetic
           Nunito (headings/labels), Inter (body/UI)
        ================================================================ */
        :root {
            --bg-primary: #fefbf6;
            --bg-surface: #fff8ee;
            --bg-panel: #ffffff;
            --bg-canvas: #ffffff;
            --bg-toolbar: #fffdf8;

            --text-primary: #2d2a26;
            --text-secondary: #6b6560;
            --text-muted: #a09890;

            --accent: #ff6b35;
            --accent-hover: #e85a28;
            --accent-light: rgba(255, 107, 53, 0.12);
            --purple: #7c5cff;
            --purple-light: rgba(124, 92, 255, 0.12);
            --teal: #00b4a0;
            --teal-light: rgba(0, 180, 160, 0.1);
            --pink: #ff5ca1;
            --pink-light: rgba(255, 92, 161, 0.1);
            --yellow: #ffc233;
            --yellow-light: rgba(255, 194, 51, 0.15);

            --border: #e8e2da;
            --border-light: #f0ece6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --radius: 12px;
            --radius-sm: 8px;

            --font-display: 'Nunito', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-primary);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ── App Layout ─────────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 280px 1fr 240px;
            grid-template-rows: 48px 1fr;
            height: 100vh;
        }

        /* ── Top Toolbar ────────────────────────────────────────── */
        .toolbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .toolbar-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 18px;
            margin-right: 16px;
            color: var(--accent);
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-panel);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-surface); border-color: #d0c8c0; }
        .btn:active { transform: scale(0.97); }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-icon {
            padding: 6px 8px;
            font-size: 16px;
            line-height: 1;
        }

        .btn.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .toolbar-spacer { flex: 1; }

        .back-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--accent); }

        /* ── Left Panel: Emoji Picker ───────────────────────────── */
        .emoji-panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .emoji-search {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .emoji-search input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
            background: var(--bg-surface);
        }
        .emoji-search input:focus { border-color: var(--accent); }

        .emoji-categories {
            display: flex;
            gap: 2px;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .cat-btn {
            font-size: 18px;
            padding: 4px 8px;
            border: none;
            background: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .cat-btn:hover { background: var(--yellow-light); }
        .cat-btn.active { background: var(--accent-light); }

        .emoji-grid-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 2px;
        }

        .emoji-item {
            font-size: 24px;
            text-align: center;
            padding: 6px 2px;
            border-radius: 8px;
            cursor: grab;
            transition: background 0.1s, transform 0.1s;
            line-height: 1.2;
        }
        .emoji-item:hover { background: var(--yellow-light); transform: scale(1.15); }
        .emoji-item:active { cursor: grabbing; }

        .emoji-section-label {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            padding: 10px 4px 4px;
            grid-column: 1 / -1;
        }

        /* ── Templates Panel (in left panel) ────────────────────── */
        .templates-section {
            border-top: 1px solid var(--border);
            padding: 10px 12px;
        }

        .templates-label {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .template-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 160px;
            overflow-y: auto;
        }

        .template-btn {
            font-family: var(--font-body);
            font-size: 13px;
            padding: 6px 10px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            background: var(--bg-surface);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .template-btn:hover { border-color: var(--accent); background: var(--accent-light); }

        .template-preview {
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* ── Canvas Area ────────────────────────────────────────── */
        .canvas-area {
            position: relative;
            background: repeating-conic-gradient(#f0ece6 0% 25%, transparent 0% 50%) 50% / 20px 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            background: var(--bg-canvas);
            box-shadow: var(--shadow-lg);
            border-radius: 4px;
        }

        #compose-canvas {
            display: block;
            cursor: default;
        }

        /* Drag ghost */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 48px;
            opacity: 0.8;
            transform: translate(-50%, -50%);
        }

        /* Selection handles */
        .selection-box {
            position: absolute;
            border: 2px solid var(--accent);
            border-radius: 4px;
            pointer-events: none;
            z-index: 5;
        }

        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid var(--accent);
            border-radius: 50%;
            z-index: 6;
            cursor: pointer;
        }
        .resize-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .resize-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .resize-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }

        .rotate-handle {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: var(--purple);
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 6;
            cursor: grab;
        }
        .rotate-handle:active { cursor: grabbing; }

        .rotate-line {
            position: absolute;
            top: -18px;
            left: 50%;
            width: 1px;
            height: 18px;
            background: var(--accent);
            z-index: 5;
        }

        /* Drop zone highlight */
        .canvas-area.drag-over .canvas-container {
            outline: 3px dashed var(--accent);
            outline-offset: 4px;
        }

        /* ── Right Panel: Properties ────────────────────────────── */
        .props-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .props-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
        }

        .props-section {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 12px;
            background: var(--bg-surface);
        }

        .props-section h3 {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .prop-row:last-child { margin-bottom: 0; }

        .prop-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .prop-input {
            width: 80px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 12px;
            text-align: center;
            outline: none;
        }
        .prop-input:focus { border-color: var(--accent); }

        .prop-range {
            width: 100%;
            accent-color: var(--accent);
        }

        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.1s;
            border: 1px solid transparent;
        }
        .layer-item:hover { background: var(--accent-light); }
        .layer-item.selected {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .layer-emoji { font-size: 20px; }
        .layer-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-actions {
            display: flex;
            gap: 2px;
        }

        .layer-btn {
            font-size: 14px;
            padding: 2px 4px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-muted);
            transition: color 0.1s;
        }
        .layer-btn:hover { color: var(--accent); }

        .canvas-size-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .canvas-size-row input {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 12px;
            text-align: center;
        }

        .bg-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .bg-option:hover { background: var(--accent-light); }
        .bg-option.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }

        .bg-swatch {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .no-selection-msg {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        /* ── Canvas Zoom Controls ───────────────────────────────── */
        .canvas-zoom {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 4px;
            z-index: 5;
        }

        .canvas-zoom .btn {
            padding: 4px 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.95);
            box-shadow: var(--shadow-sm);
        }

        .zoom-label {
            padding: 4px 8px;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
        }

        /* ── Responsive ─────────────────────────────────────────── */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 48px 200px 1fr 200px;
            }
            .props-panel { border-left: none; border-top: 1px solid var(--border); }
            .emoji-panel { border-right: none; border-bottom: 1px solid var(--border); }
        }

        @media (max-width: 768px) {
            .toolbar { overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- ── Toolbar ──────────────────────────────────────────────── -->
    <div class="toolbar">
        <a href="../index.html" class="back-link">&larr; Tools</a>
        <div class="toolbar-sep"></div>
        <span class="toolbar-title">Emoji Composer</span>
        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn btn-icon" id="btn-undo" title="Undo (Ctrl+Z)">&#8630;</button>
            <button class="btn btn-icon" id="btn-redo" title="Redo (Ctrl+Y)">&#8631;</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn btn-icon" id="btn-duplicate" title="Duplicate selected">&#10697;</button>
            <button class="btn btn-icon" id="btn-delete" title="Delete selected">&#10005;</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn btn-icon" id="btn-flip-h" title="Flip horizontal">&#8646;</button>
            <button class="btn btn-icon" id="btn-flip-v" title="Flip vertical">&#8645;</button>
        </div>

        <span class="toolbar-spacer"></span>

        <div class="toolbar-group">
            <button class="btn" id="btn-clear">Clear</button>
            <button class="btn btn-accent" id="btn-export">Export PNG</button>
        </div>
    </div>

    <!-- ── Left Panel: Emoji Picker ─────────────────────────────── -->
    <div class="emoji-panel">
        <div class="emoji-search">
            <input type="text" id="emoji-search" placeholder="Search emojis...">
        </div>

        <div class="emoji-categories" id="emoji-categories"></div>

        <div class="emoji-grid-wrap">
            <div class="emoji-grid" id="emoji-grid"></div>
        </div>

        <div class="templates-section">
            <div class="templates-label">Preset Templates</div>
            <div class="template-list" id="template-list"></div>
        </div>
    </div>

    <!-- ── Canvas ───────────────────────────────────────────────── -->
    <div class="canvas-area" id="canvas-area">
        <div class="canvas-container" id="canvas-container">
            <canvas id="compose-canvas" width="512" height="512"></canvas>
        </div>
        <div class="canvas-zoom">
            <button class="btn btn-icon" id="zoom-out">-</button>
            <span class="zoom-label" id="zoom-label">100%</span>
            <button class="btn btn-icon" id="zoom-in">+</button>
            <button class="btn btn-icon" id="zoom-fit">&#9633;</button>
        </div>
    </div>

    <!-- ── Right Panel: Properties ──────────────────────────────── -->
    <div class="props-panel">
        <div class="props-title">Properties</div>

        <div class="props-section">
            <h3>Canvas</h3>
            <div class="canvas-size-row">
                <input type="number" id="canvas-w" value="512" min="64" max="2048" step="64">
                <span style="color:var(--text-muted)">x</span>
                <input type="number" id="canvas-h" value="512" min="64" max="2048" step="64">
                <button class="btn" id="btn-resize" style="padding:4px 10px;font-size:12px">Apply</button>
            </div>
            <div style="margin-top:10px">
                <div class="prop-label" style="margin-bottom:6px">Background</div>
                <div id="bg-options"></div>
            </div>
        </div>

        <div id="selection-props">
            <div class="no-selection-msg">Select an emoji on the canvas to edit its properties</div>
        </div>

        <div class="props-section">
            <h3>Layers</h3>
            <div class="layer-list" id="layer-list"></div>
        </div>
    </div>
</div>

<!-- Drag ghost element -->
<div class="drag-ghost" id="drag-ghost" style="display:none"></div>

    // ── History ────────────────────────────────────────────────────
    function pushHistory() {
        undoStack.push(JSON.stringify(items));
        if (undoStack.length > 60) undoStack.shift();
        redoStack = [];
    }

    function undo() {
        if (undoStack.length === 0) return;
        redoStack.push(JSON.stringify(items));
        items = JSON.parse(undoStack.pop());
        selectedId = null;
        render();
    }

    function redo() {
        if (redoStack.length === 0) return;
        undoStack.push(JSON.stringify(items));
        items = JSON.parse(redoStack.pop());
        selectedId = null;
        render();
    }

    // ── Emoji Picker ──────────────────────────────────────────────
    let activeCategory = CATEGORIES[0].id;

    function buildCategories() {
        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn' + (cat.id === activeCategory ? ' active' : '');
            btn.textContent = cat.icon;
            btn.title = cat.name;
            btn.addEventListener('click', () => {
                activeCategory = cat.id;
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderEmojiGrid();
            });
            categoriesEl.appendChild(btn);
        });
    }

    function renderEmojiGrid(filter) {
        emojiGrid.innerHTML = '';
        const cats = filter
            ? CATEGORIES
            : CATEGORIES.filter(c => c.id === activeCategory);

        cats.forEach(cat => {
            const emojis = filter
                ? cat.emojis.filter(() => true) // search handled below
                : cat.emojis;

            if (filter) {
                const label = document.createElement('div');
                label.className = 'emoji-section-label';
                label.textContent = cat.name;
                emojiGrid.appendChild(label);
            }

            emojis.forEach(em => {
                if (filter && !matchEmoji(em, filter)) return;
                const el = document.createElement('div');
                el.className = 'emoji-item';
                el.textContent = em;
                el.draggable = true;
                el.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', em);
                    e.dataTransfer.effectAllowed = 'copy';
                    dragGhost.textContent = em;
                    dragGhost.style.display = 'block';
                    // Use a transparent 1x1 pixel as drag image
                    const img = new Image();
                    img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs=';
                    e.dataTransfer.setDragImage(img, 0, 0);
                });
                el.addEventListener('dblclick', () => addEmojiToCanvas(em));
                emojiGrid.appendChild(el);
            });
        });
    }

    function matchEmoji(emoji, query) {
        // Basic: check if the emoji char itself matches (very simple approach)
        // Since we can't easily search emoji names without a database, we do a best-effort
        return true; // Show all when filtering by category keyword
    }

    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        if (q) {
            renderEmojiGrid(q);
        } else {
            renderEmojiGrid();
        }
    });

    // ── Templates ─────────────────────────────────────────────────
    function buildTemplates() {
        TEMPLATES.forEach(tmpl => {
            const btn = document.createElement('button');
            btn.className = 'template-btn';
            btn.innerHTML = `<span class="template-preview">${tmpl.preview}</span> ${tmpl.name}`;
            btn.addEventListener('click', () => applyTemplate(tmpl));
            templateList.appendChild(btn);
        });
    }

    function applyTemplate(tmpl) {
        pushHistory();
        items = [];
        selectedId = null;
        tmpl.items.forEach(it => {
            items.push({
                id: nextId++,
                emoji: it.emoji,
                x: it.x,
                y: it.y,
                size: it.size,
                rotation: it.rotation || 0,
                flipH: false,
                flipV: false,
                opacity: 1
            });
        });
        render();
    }

    // ── Add emoji to canvas ───────────────────────────────────────
    function addEmojiToCanvas(emoji, x, y) {
        pushHistory();
        const item = {
            id: nextId++,
            emoji,
            x: x !== undefined ? x : canvasW / 2,
            y: y !== undefined ? y : canvasH / 2,
            size: 80,
            rotation: 0,
            flipH: false,
            flipV: false,
            opacity: 1
        };
        items.push(item);
        selectedId = item.id;
        render();
    }

        dragGhost.style.top = e.clientY + 'px';

        canvasArea.classList.remove('drag-over');
    });

    canvasArea.addEventListener('drop', e => {
        e.preventDefault();
        canvasArea.classList.remove('drag-over');
        dragGhost.style.display = 'none';
        const emoji = e.dataTransfer.getData('text/plain');
        if (!emoji) return;
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) / zoom;
        const cy = (e.clientY - rect.top) / zoom;
        addEmojiToCanvas(emoji, cx, cy);
    });

    document.addEventListener('drag', e => {
        if (dragGhost.style.display === 'block') {
            dragGhost.style.left = e.clientX + 'px';
            dragGhost.style.top = e.clientY + 'px';
        }
    });

    document.addEventListener('dragend', () => {
        dragGhost.style.display = 'none';
        canvasArea.classList.remove('drag-over');
    });

    // ── Canvas Interaction ────────────────────────────────────────
    function canvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) / zoom,
            y: (e.clientY - rect.top) / zoom
        };
    }

    function hitTest(px, py) {
        // Test from top (last in array = front)
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            const halfSize = it.size / 2;
            // Rotate point around item center
            const rad = -it.rotation * Math.PI / 180;
            const dx = px - it.x;
            const dy = py - it.y;
            const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
            const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
            if (Math.abs(rx) <= halfSize && Math.abs(ry) <= halfSize) {
                return it;
            }
        }
        return null;
    }

    canvas.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        const { x, y } = canvasCoords(e);
        const hit = hitTest(x, y);

        if (hit) {
            selectedId = hit.id;
            isDragging = true;
            dragItem = hit;
            dragOffsetX = x - hit.x;
            dragOffsetY = y - hit.y;
            pushHistory();
        } else {
            selectedId = null;
        }
        render();
    });

    document.addEventListener('mousemove', e => {
        if (isDragging && dragItem) {
            const { x, y } = canvasCoords(e);
            dragItem.x = x - dragOffsetX;
            dragItem.y = y - dragOffsetY;
            render();
        }
        if (isResizing && dragItem) {
            const dx = e.clientX - resizeStartX;
            const dy = e.clientY - resizeStartY;
            const dist = Math.max(dx, dy);
            dragItem.size = Math.max(16, resizeStartSize + dist / zoom);
            render();
        }
        if (isRotating && dragItem) {
            const { x, y } = canvasCoords(e);
            const angle = Math.atan2(y - dragItem.y, x - dragItem.x) * 180 / Math.PI;
            dragItem.rotation = angle + 90; // offset so up = 0
            render();
        }
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        isResizing = false;
        isRotating = false;
        dragItem = null;
    });

    // ── Rendering ─────────────────────────────────────────────────
    function render() {
        // Clear
        ctx.clearRect(0, 0, canvasW, canvasH);

        // Background
        if (bgMode === 'white') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvasW, canvasH);
        } else if (bgMode === 'color') {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvasW, canvasH);
        }
        // 'transparent' => leave cleared

        // Draw items
        items.forEach(it => {
            ctx.save();
            ctx.globalAlpha = it.opacity;
            ctx.translate(it.x, it.y);
            ctx.rotate(it.rotation * Math.PI / 180);
            ctx.scale(it.flipH ? -1 : 1, it.flipV ? -1 : 1);
            ctx.font = `${it.size}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(it.emoji, 0, 0);
            ctx.restore();
        });

        // Selection overlay
        renderSelection();
        renderLayers();
        renderPropsPanel();
    }

    function renderSelection() {
        // Remove old selection UI
        canvasContainer.querySelectorAll('.selection-box, .resize-handle, .rotate-handle, .rotate-line').forEach(el => el.remove());

        if (!selectedId) return;
        const it = items.find(i => i.id === selectedId);
        if (!it) return;

        const half = it.size / 2;
        const pad = 8;

        const box = document.createElement('div');
        box.className = 'selection-box';
        box.style.width = (it.size + pad * 2) * zoom + 'px';
        box.style.height = (it.size + pad * 2) * zoom + 'px';
        box.style.left = (it.x - half - pad) * zoom + 'px';
        box.style.top = (it.y - half - pad) * zoom + 'px';
        box.style.transform = `rotate(${it.rotation}deg)`;
        box.style.transformOrigin = 'center center';
        canvasContainer.appendChild(box);

        // Resize handles
        ['nw','ne','sw','se'].forEach(corner => {
            const h = document.createElement('div');
            h.className = `resize-handle ${corner}`;
            h.addEventListener('mousedown', e => {
                e.stopPropagation();
                isResizing = true;
                resizeCorner = corner;
                dragItem = it;
                resizeStartSize = it.size;
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                pushHistory();
            });
            box.appendChild(h);
        });

        // Rotate handle
        const rl = document.createElement('div');
        rl.className = 'rotate-line';
        box.appendChild(rl);

        const rh = document.createElement('div');
        rh.className = 'rotate-handle';
        rh.addEventListener('mousedown', e => {
            e.stopPropagation();
            isRotating = true;
            dragItem = it;
            pushHistory();
        });
        box.appendChild(rh);
    }

    // ── Layers Panel ──────────────────────────────────────────────
    function renderLayers() {
        layerList.innerHTML = '';
        // Show from top (last item) to bottom (first item)
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            const el = document.createElement('div');
            el.className = 'layer-item' + (it.id === selectedId ? ' selected' : '');
            el.innerHTML = `
                <span class="layer-emoji">${it.emoji}</span>
                <span class="layer-name">#${it.id}</span>
                <div class="layer-actions">
                    <button class="layer-btn" data-action="up" title="Move up">&#9650;</button>
                    <button class="layer-btn" data-action="down" title="Move down">&#9660;</button>
                    <button class="layer-btn" data-action="delete" title="Delete">&#10005;</button>
                </div>
            `;
            el.addEventListener('click', e => {
                if (e.target.closest('.layer-btn')) return;
                selectedId = it.id;
                render();
            });
            el.querySelectorAll('.layer-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const idx = items.indexOf(it);
                    if (action === 'up' && idx < items.length - 1) {
                        pushHistory();
                        items.splice(idx, 1);
                        items.splice(idx + 1, 0, it);
                        render();
                    } else if (action === 'down' && idx > 0) {
                        pushHistory();
                        items.splice(idx, 1);
                        items.splice(idx - 1, 0, it);
                        render();
                    } else if (action === 'delete') {
                        pushHistory();
                        items.splice(idx, 1);
                        if (selectedId === it.id) selectedId = null;
                        render();
                    }
                });
            });
            layerList.appendChild(el);
        }
    }

    // ── Properties Panel ──────────────────────────────────────────
    function renderPropsPanel() {
        const it = selectedId ? items.find(i => i.id === selectedId) : null;
        if (!it) {
            selectionProps.innerHTML = '<div class="no-selection-msg">Select an emoji on the canvas to edit its properties</div>';
            return;
        }

        selectionProps.innerHTML = `
            <div class="props-section">
                <h3>Selected: ${it.emoji} #${it.id}</h3>
                <div class="prop-row">
                    <span class="prop-label">X</span>
                    <input type="number" class="prop-input" id="prop-x" value="${Math.round(it.x)}" step="1">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Y</span>
                    <input type="number" class="prop-input" id="prop-y" value="${Math.round(it.y)}" step="1">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Size</span>
                    <input type="number" class="prop-input" id="prop-size" value="${Math.round(it.size)}" min="8" max="512" step="1">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Rotation</span>
                    <input type="number" class="prop-input" id="prop-rot" value="${Math.round(it.rotation)}" step="5">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Opacity</span>
                    <input type="range" class="prop-range" id="prop-opacity" value="${it.opacity}" min="0" max="1" step="0.05">
                </div>
            </div>
        `;

        const propX = document.getElementById('prop-x');
        const propY = document.getElementById('prop-y');
        const propSize = document.getElementById('prop-size');
        const propRot = document.getElementById('prop-rot');
        const propOpacity = document.getElementById('prop-opacity');

        function onPropChange() {
            pushHistory();
            it.x = parseFloat(propX.value) || 0;
            it.y = parseFloat(propY.value) || 0;
            it.size = Math.max(8, parseFloat(propSize.value) || 80);
            it.rotation = parseFloat(propRot.value) || 0;
            it.opacity = parseFloat(propOpacity.value);
            render();
        }

        [propX, propY, propSize, propRot].forEach(el => el.addEventListener('change', onPropChange));
        propOpacity.addEventListener('input', onPropChange);
    }

    // ── Background Options ────────────────────────────────────────
    function buildBgOptions() {
        const container = document.getElementById('bg-options');
        const options = [
            { mode: 'white', label: 'White', swatch: '#ffffff' },
            { mode: 'transparent', label: 'Transparent', swatch: 'repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 10px 10px' },
            { mode: 'color', label: 'Custom', swatch: null }
        ];

        options.forEach(opt => {
            const el = document.createElement('div');
            el.className = 'bg-option' + (bgMode === opt.mode ? ' active' : '');

            let swatchStyle = '';
            if (opt.mode === 'transparent') {
                swatchStyle = `background: ${opt.swatch}`;
            } else if (opt.mode === 'white') {
                swatchStyle = `background: ${opt.swatch}`;
            } else {
                swatchStyle = `background: ${bgColor}`;
            }

            el.innerHTML = `<span class="bg-swatch" style="${swatchStyle}"></span> ${opt.label}`;

            if (opt.mode === 'color') {
                const colorInput = document.createElement('input');
                colorInput.type = 'color';
                colorInput.value = bgColor;
                colorInput.style.cssText = 'width:24px;height:20px;border:none;padding:0;cursor:pointer;margin-left:4px';
                colorInput.addEventListener('input', e => {
                    bgColor = e.target.value;
                    bgMode = 'color';
                    buildBgOptions();
                    render();
                });
                el.appendChild(colorInput);
            }

            el.addEventListener('click', () => {
                bgMode = opt.mode;
                buildBgOptions();
                render();
            });

            container.appendChild(el);
        });
    }

    // ── Canvas Size ───────────────────────────────────────────────
    document.getElementById('btn-resize').addEventListener('click', () => {
        const w = parseInt(document.getElementById('canvas-w').value) || 512;
        const h = parseInt(document.getElementById('canvas-h').value) || 512;
        canvasW = Math.max(64, Math.min(2048, w));
        canvasH = Math.max(64, Math.min(2048, h));
        canvas.width = canvasW;
        canvas.height = canvasH;
        updateCanvasDisplay();
        render();
    });

    // ── Zoom ──────────────────────────────────────────────────────
    function updateCanvasDisplay() {
        canvasContainer.style.width = canvasW * zoom + 'px';
        canvasContainer.style.height = canvasH * zoom + 'px';
        canvas.style.width = canvasW * zoom + 'px';
        canvas.style.height = canvasH * zoom + 'px';
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
        zoom = Math.min(4, zoom + 0.25);
        updateCanvasDisplay();
        render();
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
        zoom = Math.max(0.25, zoom - 0.25);
        updateCanvasDisplay();
        render();
    });

    document.getElementById('zoom-fit').addEventListener('click', () => {
        const areaRect = canvasArea.getBoundingClientRect();
        const padding = 60;
        const scaleX = (areaRect.width - padding) / canvasW;
        const scaleY = (areaRect.height - padding) / canvasH;
        zoom = Math.min(scaleX, scaleY, 2);
        zoom = Math.round(zoom * 4) / 4; // snap to 0.25
        zoom = Math.max(0.25, zoom);
        updateCanvasDisplay();
        render();
    });

    // ── Toolbar Actions ───────────────────────────────────────────
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);

    document.getElementById('btn-duplicate').addEventListener('click', () => {
        const it = items.find(i => i.id === selectedId);
        if (!it) return;
        pushHistory();
        const dup = { ...it, id: nextId++, x: it.x + 30, y: it.y + 30 };
        items.push(dup);
        selectedId = dup.id;
        render();
    });

    document.getElementById('btn-delete').addEventListener('click', () => {
        const idx = items.findIndex(i => i.id === selectedId);
        if (idx === -1) return;
        pushHistory();
        items.splice(idx, 1);
        selectedId = null;
        render();
    });

    document.getElementById('btn-flip-h').addEventListener('click', () => {
        const it = items.find(i => i.id === selectedId);
        if (!it) return;
        pushHistory();
        it.flipH = !it.flipH;
        render();
    });

    document.getElementById('btn-flip-v').addEventListener('click', () => {
        const it = items.find(i => i.id === selectedId);
        if (!it) return;
        pushHistory();
        it.flipV = !it.flipV;
        render();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
        if (items.length === 0) return;
        pushHistory();
        items = [];
        selectedId = null;
        render();
    });

    // ── Export PNG ─────────────────────────────────────────────────
    document.getElementById('btn-export').addEventListener('click', () => {
        // Render to a clean offscreen canvas (no selection overlays)
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = canvasW;
        exportCanvas.height = canvasH;
        const ectx = exportCanvas.getContext('2d');

        if (bgMode === 'white') {
            ectx.fillStyle = '#ffffff';
            ectx.fillRect(0, 0, canvasW, canvasH);
        } else if (bgMode === 'color') {
            ectx.fillStyle = bgColor;
            ectx.fillRect(0, 0, canvasW, canvasH);
        }

        items.forEach(it => {
            ectx.save();
            ectx.globalAlpha = it.opacity;
            ectx.translate(it.x, it.y);
            ectx.rotate(it.rotation * Math.PI / 180);
            ectx.scale(it.flipH ? -1 : 1, it.flipV ? -1 : 1);
            ectx.font = `${it.size}px serif`;
            ectx.textAlign = 'center';
            ectx.textBaseline = 'middle';
            ectx.fillText(it.emoji, 0, 0);
            ectx.restore();
        });

        exportCanvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'emoji-composition.png';
            a.click();
            URL.revokeObjectURL(url);
        }, 'image/png');
    });

    // ── Keyboard Shortcuts ────────────────────────────────────────
    document.addEventListener('keydown', e => {
        // Don't intercept when typing in inputs
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
        if (e.key === 'Delete' || e.key === 'Backspace') {
            const idx = items.findIndex(i => i.id === selectedId);
            if (idx !== -1) { pushHistory(); items.splice(idx, 1); selectedId = null; render(); }
        }
        if (e.key === 'Escape') { selectedId = null; render(); }
        if (e.ctrlKey && e.key === 'd') {
            e.preventDefault();
            document.getElementById('btn-duplicate').click();
        }
    });

    // ── Init ──────────────────────────────────────────────────────
    buildCategories();
    renderEmojiGrid();
    buildTemplates();
    buildBgOptions();
    updateCanvasDisplay();
    render();

})();
</script>
<script defer src="../../prompt-viewer.js"></script>
</body>
