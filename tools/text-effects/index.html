<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text Effects Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #111116;
            --bg-panel: #1a1a22;
            --bg-input: #22222e;
            --bg-hover: #2a2a38;
            --bg-active: #33334a;
            --border: #2e2e3e;
            --border-focus: #6366f1;
            --text: #e8e8ee;
            --text-secondary: #9898a8;
            --text-muted: #66667a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-dim: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --danger-hover: #f87171;
            --success: #22c55e;
            --warning: #f59e0b;

            --radius: 8px;
            --radius-sm: 4px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 150ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ───────────────────────────────────── */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            height: 48px;
        }

        .header-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .header-back:hover { color: var(--text); }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        /* ── Layout ───────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 340px 1fr;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 48px);
        }

        /* ── Left Panel ───────────────────────────────── */
        .panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            grid-row: 1 / 3;
        }

        .panel-section {
            border-bottom: 1px solid var(--border);
        }

        .panel-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
        }

        .panel-section-body {
            padding: 0 14px 14px;
        }

        /* ── Buttons ──────────────────────────────────── */
        .btn {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        /* ── Controls ─────────────────────────────────── */
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .control-row label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            width: 72px;
            flex-shrink: 0;
        }

        .control-row input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-active);
            border-radius: 2px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-panel);
            cursor: pointer;
        }

        .control-row input[type="number"] {
            width: 52px;
            padding: 4px 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            text-align: center;
            outline: none;
        }
        .control-row input[type="number"]:focus { border-color: var(--border-focus); }

        .control-row input[type="color"] {
            -webkit-appearance: none;
            width: 32px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            padding: 2px;
        }
        .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

        .control-row input[type="text"],
        .control-row select {
            flex: 1;
            padding: 5px 8px;
            font-family: var(--font-sans);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            outline: none;
        }
        .control-row input[type="text"]:focus,
        .control-row select:focus { border-color: var(--border-focus); }

        .control-row select {
            cursor: pointer;
        }

        .toggle-btn {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .toggle-btn.on {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-hover);
        }
        .toggle-btn:hover { border-color: var(--text-muted); }

        /* ── Effect Tabs ──────────────────────────────── */
        .effect-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .effect-tab {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .effect-tab:hover { background: var(--bg-hover); border-color: var(--text-muted); color: var(--text); }
        .effect-tab.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-hover);
        }

        /* ── Effect Panel ─────────────────────────────── */
        .effect-panel {
            display: none;
        }
        .effect-panel.active {
            display: block;
        }

        .effect-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .effect-toggle-row .effect-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        /* ── Shadow Layer List ────────────────────────── */
        .shadow-layers {
            margin-bottom: 8px;
        }

        .shadow-layer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 2px;
            transition: all var(--transition);
            font-size: 11px;
        }
        .shadow-layer-item:hover { background: var(--bg-hover); }
        .shadow-layer-item.active {
            background: var(--accent-dim);
            border-color: var(--accent);
        }
        .shadow-layer-item .swatch {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .shadow-layer-item .info {
            flex: 1;
            min-width: 0;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shadow-layer-item .del-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 3px;
            transition: all var(--transition);
        }
        .shadow-layer-item .del-btn:hover {
            color: var(--danger);
            background: rgba(239,68,68,0.12);
        }

        /* ── Presets ──────────────────────────────────── */
        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }

        .preset-btn {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }
        .preset-btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            color: var(--text);
        }

        /* ── Preview Area ─────────────────────────────── */
        .preview-area {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(99,102,241,0.03) 0%, transparent 70%);
            position: relative;
            overflow: hidden;
        }

        .preview-checkerboard {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        #previewText {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 90%;
            word-break: break-word;
            line-height: 1.2;
        }

        /* ── Code Output ──────────────────────────────── */
        .code-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .code-output {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 160px;
            overflow-y: auto;
            min-height: 44px;
        }

        .code-output .kw { color: #c084fc; }
        .code-output .val { color: #67e8f9; }
        .code-output .fn { color: #fbbf24; }
        .code-output .num { color: #4ade80; }
        .code-output .punc { color: var(--text-muted); }

        .copy-btn {
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 2px;
        }

        .copy-btn.copied {
            color: var(--success);
            border-color: var(--success);
        }

        /* ── Scrollbar ────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Animations (injected into preview) ───────── */
        @keyframes glowPulse {
            0%, 100% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.85; filter: brightness(1.3); }
        }

        @keyframes typewriter {
            from { width: 0; }
            to { width: var(--tw-width, 100%); }
        }

        @keyframes blinkCaret {
            50% { border-color: transparent; }
        }

        @keyframes waveAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.15em); }
        }

        @keyframes flickerNeon {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }

        @keyframes rotateHue {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }

            .panel {
                grid-row: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 50vh;
                overflow-y: auto;
            }

            .preview-canvas {
                min-height: 250px;
            }

            .effect-tabs {
                gap: 3px;
            }

            .effect-tab {
                font-size: 9px;
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="../index.html" class="header-back">&#9664; Tools</a>
    <div class="header-sep"></div>
    <div class="header-title">CSS Text Effects Playground</div>
</div>

<div class="app">

    <!-- Left Panel -->
    <div class="panel">

        <!-- Sample Text & Font -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Text &amp; Font</span></div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Text</label>
                    <input type="text" id="sampleText" value="Hello World">
                </div>
                <div class="control-row">
                    <label>Font</label>
                    <select id="fontPicker">
                        <option value="Inter">Inter</option>
                        <option value="Playfair Display">Playfair Display</option>
                        <option value="Oswald">Oswald</option>
                        <option value="Bebas Neue">Bebas Neue</option>
                        <option value="Pacifico">Pacifico</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="Roboto Slab">Roboto Slab</option>
                        <option value="Lora">Lora</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Permanent Marker">Permanent Marker</option>
                        <option value="Press Start 2P">Press Start 2P</option>
                        <option value="Monoton">Monoton</option>
                        <option value="Abril Fatface">Abril Fatface</option>
                        <option value="Cinzel Decorative">Cinzel Decorative</option>
                        <option value="Rubik Mono One">Rubik Mono One</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Size</label>
                    <input type="range" id="fontSize" min="16" max="200" value="72">
                    <input type="number" id="fontSizeNum" min="8" max="400" value="72">
                </div>
                <div class="control-row">
                    <label>Weight</label>
                    <select id="fontWeight">
                        <option value="300">Light</option>
                        <option value="400">Regular</option>
                        <option value="500">Medium</option>
                        <option value="600">Semibold</option>
                        <option value="700" selected>Bold</option>
                        <option value="800">Extra Bold</option>
                        <option value="900">Black</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Color</label>
                    <input type="color" id="textColor" value="#e8e8ee">
                </div>
                <div class="control-row">
                    <label>Spacing</label>
                    <input type="range" id="letterSpacing" min="-10" max="30" value="0">
                    <input type="number" id="letterSpacingNum" min="-20" max="60" value="0">
                </div>
            </div>
        </div>

        <!-- Effect Selector -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Effects</span></div>
            <div class="panel-section-body">
                <div class="effect-tabs" id="effectTabs">
                    <button class="effect-tab active" data-effect="shadow">Shadow</button>
                    <button class="effect-tab" data-effect="gradient">Gradient</button>
                    <button class="effect-tab" data-effect="stroke">Stroke</button>
                    <button class="effect-tab" data-effect="transform">3D</button>
                    <button class="effect-tab" data-effect="animate">Animate</button>
                </div>
            </div>
        </div>

        <!-- Text Shadow Controls -->
        <div class="panel-section effect-panel active" id="panel-shadow">
            <div class="panel-section-header">
                <span>Text Shadow</span>
                <div style="display:flex;gap:4px;">
                    <button class="toggle-btn" id="shadowEnabled">On</button>
                    <button class="btn btn-sm btn-accent" id="addShadowLayer">+ Layer</button>
                </div>
            </div>
            <div class="panel-section-body">
                <div class="shadow-layers" id="shadowLayersList"></div>
                <div id="shadowLayerEditor" style="display:none;">
                    <div class="control-row">
                        <label>X Offset</label>
                        <input type="range" id="shX" min="-50" max="50" value="2">
                        <input type="number" id="shXNum" min="-100" max="100" value="2">
                    </div>
                    <div class="control-row">
                        <label>Y Offset</label>
                        <input type="range" id="shY" min="-50" max="50" value="2">
                        <input type="number" id="shYNum" min="-100" max="100" value="2">
                    </div>
                    <div class="control-row">
                        <label>Blur</label>
                        <input type="range" id="shBlur" min="0" max="100" value="4">
                        <input type="number" id="shBlurNum" min="0" max="200" value="4">
                    </div>
                    <div class="control-row">
                        <label>Color</label>
                        <input type="color" id="shColor" value="#6366f1">
                    </div>
                    <div class="control-row">
                        <label>Opacity</label>
                        <input type="range" id="shAlpha" min="0" max="100" value="80">
                        <input type="number" id="shAlphaNum" min="0" max="100" value="80">
                    </div>
                </div>
            </div>
        </div>

        <!-- Gradient Text Controls -->
        <div class="panel-section effect-panel" id="panel-gradient">
            <div class="panel-section-header">
                <span>Gradient Text</span>
                <button class="toggle-btn" id="gradientEnabled">Off</button>
            </div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Color 1</label>
                    <input type="color" id="gradColor1" value="#6366f1">
                </div>
                <div class="control-row">
                    <label>Color 2</label>
                    <input type="color" id="gradColor2" value="#ec4899">
                </div>
                <div class="control-row">
                    <label>Color 3</label>
                    <input type="color" id="gradColor3" value="#f59e0b">
                    <button class="toggle-btn" id="gradColor3Enabled">Off</button>
                </div>
                <div class="control-row">
                    <label>Angle</label>
                    <input type="range" id="gradAngle" min="0" max="360" value="135">
                    <input type="number" id="gradAngleNum" min="0" max="360" value="135">
                </div>
                <div class="control-row">
                    <label>Type</label>
                    <select id="gradType">
                        <option value="linear">Linear</option>
                        <option value="radial">Radial</option>
                        <option value="conic">Conic</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Stroke Controls -->
        <div class="panel-section effect-panel" id="panel-stroke">
            <div class="panel-section-header">
                <span>Text Stroke / Outline</span>
                <button class="toggle-btn" id="strokeEnabled">Off</button>
            </div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Width</label>
                    <input type="range" id="strokeWidth" min="0" max="10" step="0.5" value="2">
                    <input type="number" id="strokeWidthNum" min="0" max="20" step="0.5" value="2">
                </div>
                <div class="control-row">
                    <label>Color</label>
                    <input type="color" id="strokeColor" value="#6366f1">
                </div>
                <div class="control-row">
                    <label>Fill</label>
                    <select id="strokeFill">
                        <option value="keep">Keep text color</option>
                        <option value="transparent">Transparent (outline only)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3D / Transform Controls -->
        <div class="panel-section effect-panel" id="panel-transform">
            <div class="panel-section-header">
                <span>3D / Perspective</span>
                <button class="toggle-btn" id="transformEnabled">Off</button>
            </div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Perspective</label>
                    <input type="range" id="perspective" min="100" max="2000" value="800">
                    <input type="number" id="perspectiveNum" min="50" max="4000" value="800">
                </div>
                <div class="control-row">
                    <label>Rotate X</label>
                    <input type="range" id="rotateX" min="-90" max="90" value="0">
                    <input type="number" id="rotateXNum" min="-180" max="180" value="0">
                </div>
                <div class="control-row">
                    <label>Rotate Y</label>
                    <input type="range" id="rotateY" min="-90" max="90" value="0">
                    <input type="number" id="rotateYNum" min="-180" max="180" value="0">
                </div>
                <div class="control-row">
                    <label>Rotate Z</label>
                    <input type="range" id="rotateZ" min="-45" max="45" value="0">
                    <input type="number" id="rotateZNum" min="-180" max="180" value="0">
                </div>
                <div class="control-row">
                    <label>Skew X</label>
                    <input type="range" id="skewX" min="-45" max="45" value="0">
                    <input type="number" id="skewXNum" min="-90" max="90" value="0">
                </div>
                <div class="control-row">
                    <label>Scale</label>
                    <input type="range" id="scaleT" min="50" max="200" value="100">
                    <input type="number" id="scaleTNum" min="10" max="400" value="100">
                </div>
            </div>
        </div>

        <!-- Animation Controls -->
        <div class="panel-section effect-panel" id="panel-animate">
            <div class="panel-section-header">
                <span>Animation</span>
                <button class="toggle-btn" id="animateEnabled">Off</button>
            </div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Type</label>
                    <select id="animType">
                        <option value="none">None</option>
                        <option value="glowPulse">Glow Pulse</option>
                        <option value="typewriter">Typewriter</option>
                        <option value="wave">Wave</option>
                        <option value="neonFlicker">Neon Flicker</option>
                        <option value="hueRotate">Hue Rotate</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Speed</label>
                    <input type="range" id="animSpeed" min="0.2" max="5" step="0.1" value="1.5">
                    <input type="number" id="animSpeedNum" min="0.1" max="10" step="0.1" value="1.5">
                </div>
                <div class="control-row">
                    <label>Iteration</label>
                    <select id="animIteration">
                        <option value="infinite" selected>Infinite</option>
                        <option value="1">Once</option>
                        <option value="2">Twice</option>
                        <option value="3">Three</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Presets -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Presets</span></div>
            <div class="panel-section-body">
                <div class="presets-grid" id="presetsGrid"></div>
            </div>
        </div>

    </div>

    <!-- Preview + Code -->
    <div class="preview-area">
        <div class="preview-canvas">
            <div class="preview-checkerboard"></div>
            <div id="previewText">Hello World</div>
        </div>
        <div class="code-bar">
            <div class="code-output" id="codeOutput"></div>
            <button class="btn copy-btn" id="copyBtn">Copy</button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ── Google Fonts Loader ────────────────────
    var loadedFonts = { 'Inter': true, 'JetBrains Mono': true };

    function loadGoogleFont(name) {
        if (loadedFonts[name]) return;
        loadedFonts[name] = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' +
            encodeURIComponent(name).replace(/%20/g, '+') +
            ':wght@300;400;500;600;700;800;900&display=swap';
        document.head.appendChild(link);
    }

    // ── State ──────────────────────────────────
    var state = {
        text: 'Hello World',
        font: 'Inter',
        fontSize: 72,
        fontWeight: '700',
        textColor: '#e8e8ee',
        letterSpacing: 0,

        shadowEnabled: true,
        shadowLayers: [
            { x: 2, y: 2, blur: 4, color: '#6366f1', alpha: 80 }
        ],
        activeShadowIdx: 0,

        gradientEnabled: false,
        gradColor1: '#6366f1',
        gradColor2: '#ec4899',
        gradColor3: '#f59e0b',
        gradColor3Enabled: false,
        gradAngle: 135,
        gradType: 'linear',

        strokeEnabled: false,
        strokeWidth: 2,
        strokeColor: '#6366f1',
        strokeFill: 'keep',

        transformEnabled: false,
        perspective: 800,
        rotateX: 0,
        rotateY: 0,
        rotateZ: 0,
        skewX: 0,
        scaleT: 100,

        animateEnabled: false,
        animType: 'none',
        animSpeed: 1.5,
        animIteration: 'infinite'
    };

    // ── DOM ────────────────────────────────────
    var previewText = document.getElementById('previewText');
    var codeOutput = document.getElementById('codeOutput');
    var copyBtn = document.getElementById('copyBtn');
    var shadowLayersList = document.getElementById('shadowLayersList');
    var shadowLayerEditor = document.getElementById('shadowLayerEditor');

    // Text/font controls
    var sampleText = document.getElementById('sampleText');
    var fontPicker = document.getElementById('fontPicker');
    var fontSize = document.getElementById('fontSize');
    var fontSizeNum = document.getElementById('fontSizeNum');
    var fontWeight = document.getElementById('fontWeight');
    var textColor = document.getElementById('textColor');
    var letterSpacing = document.getElementById('letterSpacing');
    var letterSpacingNum = document.getElementById('letterSpacingNum');

    // Effect toggles
    var shadowEnabled = document.getElementById('shadowEnabled');
    var gradientEnabled = document.getElementById('gradientEnabled');
    var strokeEnabled = document.getElementById('strokeEnabled');
    var transformEnabled = document.getElementById('transformEnabled');
    var animateEnabled = document.getElementById('animateEnabled');

    // ── Helpers ────────────────────────────────
    function hexToRgb(hex) {
        var n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
    }

    function hexToRgba(hex, alpha) {
        var rgb = hexToRgb(hex);
        var a = (alpha / 100).toFixed(2).replace(/\.?0+$/, '') || '0';
        return 'rgba(' + rgb[0] + ', ' + rgb[1] + ', ' + rgb[2] + ', ' + a + ')';
    }

    // ── Effect Tabs ───────────────────────────
    var effectTabs = document.querySelectorAll('.effect-tab');
    var effectPanels = document.querySelectorAll('.effect-panel');

    effectTabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            effectTabs.forEach(function(t) { t.classList.remove('active'); });
            effectPanels.forEach(function(p) { p.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.effect).classList.add('active');
        });
    });

    // ── Toggle Bindings ───────────────────────
    function bindToggle(btn, key) {
        btn.classList.toggle('on', state[key]);
        btn.textContent = state[key] ? 'On' : 'Off';
        btn.addEventListener('click', function() {
            state[key] = !state[key];
            btn.classList.toggle('on', state[key]);
            btn.textContent = state[key] ? 'On' : 'Off';
            render();
        });
    }

    bindToggle(shadowEnabled, 'shadowEnabled');
    bindToggle(gradientEnabled, 'gradientEnabled');
    bindToggle(strokeEnabled, 'strokeEnabled');
    bindToggle(transformEnabled, 'transformEnabled');
    bindToggle(animateEnabled, 'animateEnabled');

    // Gradient color 3 toggle
    var gc3Btn = document.getElementById('gradColor3Enabled');
    gc3Btn.classList.toggle('on', state.gradColor3Enabled);
    gc3Btn.textContent = state.gradColor3Enabled ? 'On' : 'Off';
    gc3Btn.addEventListener('click', function() {
        state.gradColor3Enabled = !state.gradColor3Enabled;
        gc3Btn.classList.toggle('on', state.gradColor3Enabled);
        gc3Btn.textContent = state.gradColor3Enabled ? 'On' : 'Off';
        render();
    });

    // ── Slider/Number Pair Binding ────────────
    function bindPair(sliderId, numId, stateKey, parser) {
        var slider = document.getElementById(sliderId);
        var num = document.getElementById(numId);
        if (!parser) parser = parseInt;

        function update(val) {
            var v = parser(val);
            if (isNaN(v)) return;
            state[stateKey] = v;
            slider.value = v;
            num.value = v;
            render();
        }
        slider.addEventListener('input', function() { update(this.value); });
        num.addEventListener('input', function() { update(this.value); });
    }

    bindPair('fontSize', 'fontSizeNum', 'fontSize');
    bindPair('letterSpacing', 'letterSpacingNum', 'letterSpacing');
    bindPair('gradAngle', 'gradAngleNum', 'gradAngle');
    bindPair('strokeWidth', 'strokeWidthNum', 'strokeWidth', parseFloat);
    bindPair('perspective', 'perspectiveNum', 'perspective');
    bindPair('rotateX', 'rotateXNum', 'rotateX');
    bindPair('rotateY', 'rotateYNum', 'rotateY');
    bindPair('rotateZ', 'rotateZNum', 'rotateZ');
    bindPair('skewX', 'skewXNum', 'skewX');
    bindPair('scaleT', 'scaleTNum', 'scaleT');
    bindPair('animSpeed', 'animSpeedNum', 'animSpeed', parseFloat);

    // ── Shadow Layer Slider Binding ───────────
    function bindShadowPair(sliderId, numId, prop, parser) {
        var slider = document.getElementById(sliderId);
        var num = document.getElementById(numId);
        if (!parser) parser = parseInt;

        function update(val) {
            var layer = state.shadowLayers[state.activeShadowIdx];
            if (!layer) return;
            var v = parser(val);
            if (isNaN(v)) return;
            layer[prop] = v;
            slider.value = v;
            num.value = v;
            renderShadowList();
            renderPreview();
            renderCode();
        }
        slider.addEventListener('input', function() { update(this.value); });
        num.addEventListener('input', function() { update(this.value); });
    }

    bindShadowPair('shX', 'shXNum', 'x');
    bindShadowPair('shY', 'shYNum', 'y');
    bindShadowPair('shBlur', 'shBlurNum', 'blur');
    bindShadowPair('shAlpha', 'shAlphaNum', 'alpha');

    document.getElementById('shColor').addEventListener('input', function() {
        var layer = state.shadowLayers[state.activeShadowIdx];
        if (!layer) return;
        layer.color = this.value;
        renderShadowList();
        renderPreview();
        renderCode();
    });

    // ── Simple Control Bindings ───────────────
    sampleText.addEventListener('input', function() {
        state.text = this.value || 'Text';
        render();
    });

    fontPicker.addEventListener('change', function() {
        state.font = this.value;
        loadGoogleFont(state.font);
        render();
    });

    fontWeight.addEventListener('change', function() {
        state.fontWeight = this.value;
        render();
    });

    textColor.addEventListener('input', function() {
        state.textColor = this.value;
        render();
    });

    document.getElementById('gradColor1').addEventListener('input', function() { state.gradColor1 = this.value; render(); });
    document.getElementById('gradColor2').addEventListener('input', function() { state.gradColor2 = this.value; render(); });
    document.getElementById('gradColor3').addEventListener('input', function() { state.gradColor3 = this.value; render(); });
    document.getElementById('gradType').addEventListener('change', function() { state.gradType = this.value; render(); });

    document.getElementById('strokeColor').addEventListener('input', function() { state.strokeColor = this.value; render(); });
    document.getElementById('strokeFill').addEventListener('change', function() { state.strokeFill = this.value; render(); });

    document.getElementById('animType').addEventListener('change', function() {
        state.animType = this.value;
        if (state.animType !== 'none' && !state.animateEnabled) {
            state.animateEnabled = true;
            animateEnabled.classList.add('on');
            animateEnabled.textContent = 'On';
        }
        render();
    });
    document.getElementById('animIteration').addEventListener('change', function() { state.animIteration = this.value; render(); });

    // ── Shadow Layers ─────────────────────────
    document.getElementById('addShadowLayer').addEventListener('click', function() {
        state.shadowLayers.push({ x: 0, y: 0, blur: 8, color: '#6366f1', alpha: 60 });
        state.activeShadowIdx = state.shadowLayers.length - 1;
        if (!state.shadowEnabled) {
            state.shadowEnabled = true;
            shadowEnabled.classList.add('on');
            shadowEnabled.textContent = 'On';
        }
        render();
    });

    function renderShadowList() {
        shadowLayersList.innerHTML = '';
        state.shadowLayers.forEach(function(layer, i) {
            var div = document.createElement('div');
            div.className = 'shadow-layer-item' + (i === state.activeShadowIdx ? ' active' : '');
            var rgba = hexToRgba(layer.color, layer.alpha);
            div.innerHTML =
                '<span class="swatch" style="background:' + rgba + '"></span>' +
                '<span class="info">' + layer.x + ' ' + layer.y + ' ' + layer.blur + 'px ' + rgba + '</span>' +
                '<button class="del-btn" data-idx="' + i + '">&#10005;</button>';

            div.addEventListener('click', function(e) {
                if (e.target.closest('.del-btn')) {
                    state.shadowLayers.splice(i, 1);
                    if (state.activeShadowIdx >= state.shadowLayers.length) {
                        state.activeShadowIdx = Math.max(0, state.shadowLayers.length - 1);
                    }
                    render();
                    return;
                }
                state.activeShadowIdx = i;
                renderShadowList();
                loadShadowEditor();
            });

            shadowLayersList.appendChild(div);
        });
    }

    function loadShadowEditor() {
        var layer = state.shadowLayers[state.activeShadowIdx];
        if (!layer) {
            shadowLayerEditor.style.display = 'none';
            return;
        }
        shadowLayerEditor.style.display = '';
        document.getElementById('shX').value = layer.x;
        document.getElementById('shXNum').value = layer.x;
        document.getElementById('shY').value = layer.y;
        document.getElementById('shYNum').value = layer.y;
        document.getElementById('shBlur').value = layer.blur;
        document.getElementById('shBlurNum').value = layer.blur;
        document.getElementById('shColor').value = layer.color;
        document.getElementById('shAlpha').value = layer.alpha;
        document.getElementById('shAlphaNum').value = layer.alpha;
    }

    // ── Build CSS ─────────────────────────────
    function buildCSS() {
        var rules = [];

        rules.push({ prop: 'font-family', value: "'" + state.font + "', sans-serif" });
        rules.push({ prop: 'font-size', value: state.fontSize + 'px' });
        rules.push({ prop: 'font-weight', value: state.fontWeight });
        if (state.letterSpacing !== 0) {
            rules.push({ prop: 'letter-spacing', value: state.letterSpacing + 'px' });
        }

        // Color (may be overridden by gradient)
        if (state.gradientEnabled) {
            var gradFunc;
            var stops = state.gradColor1 + ', ' + state.gradColor2;
            if (state.gradColor3Enabled) {
                stops = state.gradColor1 + ', ' + state.gradColor2 + ', ' + state.gradColor3;
            }
            if (state.gradType === 'linear') {
                gradFunc = 'linear-gradient(' + state.gradAngle + 'deg, ' + stops + ')';
            } else if (state.gradType === 'radial') {
                gradFunc = 'radial-gradient(circle, ' + stops + ')';
            } else {
                gradFunc = 'conic-gradient(from ' + state.gradAngle + 'deg, ' + stops + ')';
            }
            rules.push({ prop: 'background', value: gradFunc });
            rules.push({ prop: '-webkit-background-clip', value: 'text' });
            rules.push({ prop: 'background-clip', value: 'text' });
            rules.push({ prop: 'color', value: 'transparent' });
            if (state.strokeEnabled && state.strokeFill === 'transparent') {
                rules.push({ prop: '-webkit-text-fill-color', value: 'transparent' });
            }
        } else {
            rules.push({ prop: 'color', value: state.textColor });
            if (state.strokeEnabled && state.strokeFill === 'transparent') {
                rules.push({ prop: '-webkit-text-fill-color', value: 'transparent' });
            }
        }

        // Stroke
        if (state.strokeEnabled) {
            rules.push({ prop: '-webkit-text-stroke', value: state.strokeWidth + 'px ' + state.strokeColor });
        }

        // Text shadow
        if (state.shadowEnabled && state.shadowLayers.length > 0) {
            var shadows = state.shadowLayers.map(function(l) {
                return l.x + 'px ' + l.y + 'px ' + l.blur + 'px ' + hexToRgba(l.color, l.alpha);
            }).join(',\n        ');
            rules.push({ prop: 'text-shadow', value: shadows });
        }

        // Transform
        if (state.transformEnabled) {
            var transforms = [];
            if (state.rotateX !== 0) transforms.push('rotateX(' + state.rotateX + 'deg)');
            if (state.rotateY !== 0) transforms.push('rotateY(' + state.rotateY + 'deg)');
            if (state.rotateZ !== 0) transforms.push('rotateZ(' + state.rotateZ + 'deg)');
            if (state.skewX !== 0) transforms.push('skewX(' + state.skewX + 'deg)');
            if (state.scaleT !== 100) transforms.push('scale(' + (state.scaleT / 100).toFixed(2) + ')');
            if (transforms.length > 0) {
                rules.push({ prop: 'transform', value: 'perspective(' + state.perspective + 'px) ' + transforms.join(' ') });
            }
        }

        // Animation
        if (state.animateEnabled && state.animType !== 'none') {
            var dur = state.animSpeed + 's';
            var iter = state.animIteration;
            switch (state.animType) {
                case 'glowPulse':
                    rules.push({ prop: 'animation', value: 'glowPulse ' + dur + ' ease-in-out ' + iter });
                    break;
                case 'typewriter':
                    rules.push({ prop: 'display', value: 'inline-block' });
                    rules.push({ prop: 'overflow', value: 'hidden' });
                    rules.push({ prop: 'white-space', value: 'nowrap' });
                    rules.push({ prop: '--tw-width', value: state.text.length + 'ch' });
                    rules.push({ prop: 'border-right', value: '3px solid ' + state.textColor });
                    rules.push({ prop: 'animation', value: 'typewriter ' + dur + ' steps(' + state.text.length + ') ' + iter + ' forwards, blinkCaret 0.7s step-end infinite' });
                    break;
                case 'wave':
                    // Wave applies per-character: wrap each char in a span with staggered delay
                    rules.push({ prop: '/* Apply to each character span */', value: '' });
                    rules.push({ prop: 'display', value: 'inline-block' });
                    rules.push({ prop: 'animation', value: 'waveAnim ' + dur + ' ease-in-out ' + iter });
                    rules.push({ prop: 'animation-delay', value: 'calc(var(--i) * 0.05s)' });
                    break;
                case 'neonFlicker':
                    rules.push({ prop: 'animation', value: 'flickerNeon ' + dur + ' linear ' + iter });
                    break;
                case 'hueRotate':
                    rules.push({ prop: 'animation', value: 'rotateHue ' + dur + ' linear ' + iter });
                    break;
            }
        }

        return rules;
    }

    function rulesToPlainCSS(rules) {
        return rules.map(function(r) {
            if (r.prop.charAt(0) === '/' && r.value === '') return r.prop;
            return r.prop + ': ' + r.value + ';';
        }).join('\n');
    }

    // ── Render ─────────────────────────────────
    function render() {
        renderShadowList();
        loadShadowEditor();
        renderPreview();
        renderCode();
    }

    var waveStyleEl = null;

    function renderPreview() {
        var el = previewText;

        // Clear previous inline styles and classes
        el.style.cssText = '';
        el.className = '';

        // Remove wave wrappers - restore to plain text
        if (waveStyleEl) {
            waveStyleEl.remove();
            waveStyleEl = null;
        }

        el.style.fontFamily = "'" + state.font + "', sans-serif";
        el.style.fontSize = state.fontSize + 'px';
        el.style.fontWeight = state.fontWeight;
        el.style.letterSpacing = state.letterSpacing + 'px';
        el.style.lineHeight = '1.2';
        el.style.maxWidth = '90%';
        el.style.wordBreak = 'break-word';
        el.style.textAlign = 'center';
        el.style.position = 'relative';
        el.style.zIndex = '1';

        // Color
        if (state.gradientEnabled) {
            var stops = state.gradColor1 + ', ' + state.gradColor2;
            if (state.gradColor3Enabled) stops += ', ' + state.gradColor3;
            var grad;
            if (state.gradType === 'linear') {
                grad = 'linear-gradient(' + state.gradAngle + 'deg, ' + stops + ')';
            } else if (state.gradType === 'radial') {
                grad = 'radial-gradient(circle, ' + stops + ')';
            } else {
                grad = 'conic-gradient(from ' + state.gradAngle + 'deg, ' + stops + ')';
            }
            el.style.background = grad;
            el.style.webkitBackgroundClip = 'text';
            el.style.backgroundClip = 'text';
            el.style.color = 'transparent';
        } else {
            el.style.color = state.textColor;
        }

        // Stroke
        if (state.strokeEnabled) {
            el.style.webkitTextStroke = state.strokeWidth + 'px ' + state.strokeColor;
            if (state.strokeFill === 'transparent') {
                el.style.webkitTextFillColor = 'transparent';
            }
        }

        // Shadow
        if (state.shadowEnabled && state.shadowLayers.length > 0) {
            el.style.textShadow = state.shadowLayers.map(function(l) {
                return l.x + 'px ' + l.y + 'px ' + l.blur + 'px ' + hexToRgba(l.color, l.alpha);
            }).join(', ');
        }

        // Transform
        if (state.transformEnabled) {
            var transforms = [];
            if (state.rotateX !== 0) transforms.push('rotateX(' + state.rotateX + 'deg)');
            if (state.rotateY !== 0) transforms.push('rotateY(' + state.rotateY + 'deg)');
            if (state.rotateZ !== 0) transforms.push('rotateZ(' + state.rotateZ + 'deg)');
            if (state.skewX !== 0) transforms.push('skewX(' + state.skewX + 'deg)');
            if (state.scaleT !== 100) transforms.push('scale(' + (state.scaleT / 100) + ')');
            if (transforms.length > 0) {
                el.style.transform = 'perspective(' + state.perspective + 'px) ' + transforms.join(' ');
            }
        }

        // Animation - wave needs per-character spans
        var isWave = state.animateEnabled && state.animType === 'wave';

        if (isWave) {
            el.innerHTML = '';
            var chars = state.text.split('');
            var dur = state.animSpeed;
            var staggerCSS = '';
            chars.forEach(function(ch, i) {
                var span = document.createElement('span');
                span.textContent = ch === ' ' ? '\u00A0' : ch;
                span.style.display = 'inline-block';
                span.style.animation = 'waveAnim ' + dur + 's ease-in-out ' + state.animIteration;
                span.style.animationDelay = (i * 0.05) + 's';
                el.appendChild(span);
            });
        } else {
            el.textContent = state.text;
        }

        // Other animations
        if (state.animateEnabled && state.animType !== 'none' && state.animType !== 'wave') {
            var dur = state.animSpeed + 's';
            var iter = state.animIteration;
            switch (state.animType) {
                case 'glowPulse':
                    el.style.animation = 'glowPulse ' + dur + ' ease-in-out ' + iter;
                    break;
                case 'typewriter':
                    el.style.overflow = 'hidden';
                    el.style.whiteSpace = 'nowrap';
                    el.style.borderRight = '3px solid ' + state.textColor;
                    el.style.display = 'inline-block';
                    el.style.maxWidth = 'none';
                    el.style.setProperty('--tw-width', state.text.length + 'ch');
                    el.style.width = '0';
                    el.style.animation = 'typewriter ' + dur + ' steps(' + state.text.length + ') ' + iter + ' forwards, blinkCaret 0.7s step-end infinite';
                    break;
                case 'neonFlicker':
                    el.style.animation = 'flickerNeon ' + dur + ' linear ' + iter;
                    break;
                case 'hueRotate':
                    el.style.animation = 'rotateHue ' + dur + ' linear ' + iter;
                    break;
            }
        }
    }

    function renderCode() {
        var rules = buildCSS();
        var htmlParts = rules.map(function(r) {
            if (r.prop.charAt(0) === '/' && r.value === '') {
                return '<span class="punc">' + escapeHtml(r.prop) + '</span>';
            }
            var propHtml = '<span class="kw">' + escapeHtml(r.prop) + '</span>';
            var valHtml = highlightValue(r.value);
            return propHtml + '<span class="punc">:</span> ' + valHtml + '<span class="punc">;</span>';
        });

        codeOutput.innerHTML = htmlParts.join('\n');
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightValue(val) {
        // Color hex values
        val = escapeHtml(val);
        val = val.replace(/(#[0-9a-fA-F]{3,8})/g, '<span class="num">$1</span>');
        // Numbers with units
        val = val.replace(/(-?\d+\.?\d*)(px|deg|s|%)/g, '<span class="num">$1$2</span>');
        // Functions
        val = val.replace(/(rgba?|linear-gradient|radial-gradient|conic-gradient|perspective|rotateX|rotateY|rotateZ|skewX|scale|steps)\(/g, '<span class="fn">$1</span><span class="punc">(</span>');
        // Keyword values
        val = val.replace(/\b(transparent|infinite|none|nowrap|hidden|forwards)\b/g, '<span class="val">$1</span>');
        return val;
    }

    // ── Copy ──────────────────────────────────
    copyBtn.addEventListener('click', function() {
        var rules = buildCSS();
        var css = rulesToPlainCSS(rules);
        navigator.clipboard.writeText(css).then(function() {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
                copyBtn.textContent = 'Copy';
                copyBtn.classList.remove('copied');
            }, 1500);
        });
    });

    // ── Presets ────────────────────────────────
    var PRESETS = [
        {
            name: 'Neon Glow',
            apply: function() {
                state.text = 'NEON';
                state.font = 'Monoton';
                state.fontSize = 80;
                state.fontWeight = '400';
                state.textColor = '#ffffff';
                state.letterSpacing = 8;
