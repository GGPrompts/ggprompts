<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Font Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           PIXEL FONT EDITOR — Retro terminal / CRT aesthetic
           Press Start 2P (headings), VT323 (UI), IBM Plex Mono (code)
        ================================================================ */
        :root {
            --bg-deep: #08080e;
            --bg-surface: #0c0c14;
            --bg-panel: #10101c;
            --bg-input: #14142a;
            --bg-hover: #1a1a30;
            --border: #2a2a44;
            --border-bright: #3a3a5e;
            --text: #d4d4e8;
            --text-dim: #8888aa;
            --text-muted: #5555778;
            --accent: #00e5ff;
            --accent-dim: #007788;
            --accent-glow: rgba(0, 229, 255, 0.25);
            --pixel-on: #00e5ff;
            --pixel-off: #16162e;
            --pixel-grid: #1e1e3a;
            --green: #39ff14;
            --yellow: #ffd600;
            --orange: #ff8c00;
            --red: #ff3366;
            --pink: #ff44cc;

            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            font-size: 18px;
            color: var(--text);
            background: var(--bg-deep);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── App Layout ─────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 220px 1fr 240px;
            grid-template-rows: 44px 1fr 200px;
            height: 100vh;
            gap: 1px;
            background: var(--border);
        }

        /* ── Toolbar ────────────────────────────────────────── */
        .toolbar {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-title {
            font-family: var(--font-display);
            font-size: 9px;
            color: var(--accent);
            margin-right: 12px;
            white-space: nowrap;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .tb-btn {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text-dim);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { color: var(--text); border-color: var(--accent-dim); background: var(--bg-hover); }
        .tb-btn.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(0,229,255,0.08); }

        .tb-select {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 3px 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .tb-select option { background: var(--bg-panel); }

        .tb-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-left: 6px;
        }

        /* ── Character Map (left panel) ─────────────────────── */
        .charmap-panel {
            background: var(--bg-panel);
            overflow-y: auto;
            padding: 8px;
            border-right: 1px solid var(--border);
        }

        .charmap-panel h3 {
            font-family: var(--font-display);
            font-size: 7px;
            color: var(--accent);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charmap-section {
            margin-bottom: 10px;
        }

        .charmap-section-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 4px;
            display: block;
        }

        .charmap-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
        }

        .char-btn {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-dim);
            background: var(--bg-input);
            border: 1px solid transparent;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.1s;
            position: relative;
        }
        .char-btn:hover { color: var(--text); background: var(--bg-hover); }
        .char-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(0,229,255,0.1);
            box-shadow: 0 0 6px var(--accent-glow);
        }
        .char-btn.has-data::after {
            content: '';
            position: absolute;
            bottom: 1px; right: 1px;
            width: 4px; height: 4px;
            background: var(--green);
            border-radius: 50%;
        }

        /* ── Main Canvas Area ───────────────────────────────── */
        .canvas-area {
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #glyphCanvas {
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .canvas-info {
            position: absolute;
            bottom: 8px; left: 12px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .canvas-char-label {
            position: absolute;
            top: 10px; left: 12px;
            font-family: var(--font-display);
            font-size: 11px;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        /* ── Properties Panel (right) ───────────────────────── */
        .props-panel {
            background: var(--bg-panel);
            overflow-y: auto;
            padding: 10px;
            border-left: 1px solid var(--border);
        }

        .props-panel h3 {
            font-family: var(--font-display);
            font-size: 7px;
            color: var(--accent);
            margin: 12px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .props-panel h3:first-child { margin-top: 0; }

        .prop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .prop-label {
            font-size: 14px;
            color: var(--text-dim);
        }

        .prop-input {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 2px 6px;
            width: 60px;
            text-align: center;
            border-radius: 3px;
        }
        .prop-input:focus { border-color: var(--accent-dim); outline: none; }

        .prop-input-wide {
            width: 100%;
            text-align: left;
            margin-bottom: 4px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-bottom: 8px;
        }

        .tool-btn {
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--text-dim);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 5px 2px;
            cursor: pointer;
            border-radius: 3px;
            text-align: center;
            transition: all 0.15s;
        }
        .tool-btn:hover { color: var(--text); background: var(--bg-hover); }
        .tool-btn.active {
            color: var(--accent);
            border-color: var(--accent-dim);
            background: rgba(0,229,255,0.1);
        }

        .small-btn {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-dim);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.15s;
        }
        .small-btn:hover { color: var(--text); background: var(--bg-hover); }

        .btn-row {
            display: flex;
            gap: 3px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        /* ── Preview Panel (bottom) ─────────────────────────── */
        .preview-panel {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .preview-header h3 {
            font-family: var(--font-display);
            font-size: 7px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #previewInput {
            font-family: var(--font-mono);
            font-size: 15px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            flex: 1;
            border-radius: 3px;
        }
        #previewInput:focus { border-color: var(--accent-dim); outline: none; }

        .preview-scale-btns {
            display: flex;
            gap: 3px;
        }

        .preview-canvas-wrap {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: auto;
            display: flex;
            align-items: center;
            padding: 8px 12px;
        }

        #previewCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ── Kerning modal ──────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--border-bright);
            border-radius: 8px;
            padding: 20px;
            width: 420px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-family: var(--font-display);
            font-size: 10px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .modal-close {
            float: right;
            font-size: 20px;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--red); }

        .kern-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .kern-pair-input {
            font-family: var(--font-mono);
            font-size: 16px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            width: 60px;
            text-align: center;
            border-radius: 3px;
        }

        .kern-val-input {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            width: 60px;
            text-align: center;
            border-radius: 3px;
        }

        .kern-remove {
            color: var(--red);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 44px 160px 1fr 200px 160px;
            }
            .charmap-panel { grid-column: 1; grid-row: 2; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
            .canvas-area { grid-column: 1; grid-row: 3; }
            .props-panel { grid-column: 1; grid-row: 4; border-left: none; border-top: 1px solid var(--border); }
            .preview-panel { grid-column: 1; grid-row: 5; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ── Toolbar ──────────────────────────────────────── -->
        <div class="toolbar">
            <span class="toolbar-title">PIXEL FONT</span>
            <div class="toolbar-sep"></div>
            <button class="tb-btn" id="btnNew" title="New Font">New</button>
            <button class="tb-btn" id="btnOpen" title="Open JSON">Open</button>
            <button class="tb-btn" id="btnSave" title="Save JSON">Save</button>
            <div class="toolbar-sep"></div>
            <button class="tb-btn" id="btnExportPNG" title="Export Sprite Sheet">Export PNG</button>
            <div class="toolbar-sep"></div>
            <button class="tb-btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
            <button class="tb-btn" id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
            <div class="toolbar-sep"></div>
            <span class="tb-label">Grid:</span>
            <select class="tb-select" id="gridSizeSelect">
                <option value="8">8x8</option>
                <option value="10">10x10</option>
                <option value="12">12x12</option>
                <option value="16">16x16</option>
            </select>
            <div class="toolbar-sep"></div>
            <button class="tb-btn" id="btnKerning" title="Kerning Editor">Kerning</button>
            <div style="flex:1"></div>
            <a href="../index.html" class="tb-btn" style="text-decoration:none">Back</a>
        </div>

        <!-- ── Character Map ────────────────────────────────── -->
        <div class="charmap-panel">
            <h3>Characters</h3>
            <div id="charmapContainer"></div>
        </div>

        <!-- ── Canvas ───────────────────────────────────────── -->
        <div class="canvas-area" id="canvasArea">
            <canvas id="glyphCanvas" width="400" height="400"></canvas>
            <div class="canvas-char-label" id="canvasCharLabel">A</div>
            <div class="canvas-info" id="canvasInfo">8x8 | Pencil</div>
        </div>

        <!-- ── Properties ───────────────────────────────────── -->
        <div class="props-panel">
            <h3>Drawing Tools</h3>
            <div class="tool-grid">
                <button class="tool-btn active" data-tool="pencil">Pencil</button>
                <button class="tool-btn" data-tool="eraser">Eraser</button>
                <button class="tool-btn" data-tool="fill">Fill</button>
                <button class="tool-btn" data-tool="line">Line</button>
                <button class="tool-btn" data-tool="rect">Rect</button>
                <button class="tool-btn" data-tool="rectFill">RectF</button>
            </div>

            <label style="display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:14px;color:var(--text-dim)">
                <input type="checkbox" id="mirrorToggle"> Mirror (H)
            </label>

            <h3>Glyph Actions</h3>
            <div class="btn-row">
                <button class="small-btn" id="btnClear">Clear</button>
                <button class="small-btn" id="btnInvert">Invert</button>
                <button class="small-btn" id="btnCopy">Copy</button>
                <button class="small-btn" id="btnPaste">Paste</button>
            </div>
            <div class="btn-row">
                <button class="small-btn" id="btnMirrorH">Flip H</button>
                <button class="small-btn" id="btnMirrorV">Flip V</button>
                <button class="small-btn" id="btnAutoAdv">AutoW</button>
            </div>
            <div class="btn-row">
                <button class="small-btn" data-shift="-1,0" title="Shift Left">&#8592;</button>
                <button class="small-btn" data-shift="1,0" title="Shift Right">&#8594;</button>
                <button class="small-btn" data-shift="0,-1" title="Shift Up">&#8593;</button>
                <button class="small-btn" data-shift="0,1" title="Shift Down">&#8595;</button>
            </div>

            <h3>Glyph Properties</h3>
            <div class="prop-row">
                <span class="prop-label">Advance</span>
                <input type="number" class="prop-input" id="propAdvance" min="1" max="32" value="8">
            </div>
            <div class="prop-row">
                <span class="prop-label">Offset X</span>
                <input type="number" class="prop-input" id="propOffsetX" min="-8" max="8" value="0">
            </div>
            <div class="prop-row">
                <span class="prop-label">Offset Y</span>
                <input type="number" class="prop-input" id="propOffsetY" min="-8" max="8" value="0">
            </div>

            <h3>Font Properties</h3>
            <input type="text" class="prop-input prop-input-wide" id="propFontName" placeholder="Font name" value="Untitled">
            <div class="prop-row">
                <span class="prop-label">Spacing</span>
                <input type="number" class="prop-input" id="propSpacing" min="0" max="8" value="1">
            </div>
            <div class="prop-row">
                <span class="prop-label">Line Height</span>
                <input type="number" class="prop-input" id="propLineHeight" min="1" max="48" value="10">
            </div>
            <div class="prop-row">
                <span class="prop-label">Baseline</span>
                <input type="number" class="prop-input" id="propBaseline" min="1" max="32" value="6">
            </div>
        </div>

        <!-- ── Preview ──────────────────────────────────────── -->
        <div class="preview-panel">
            <div class="preview-header">
                <h3>Live Preview</h3>
                <input type="text" id="previewInput" value="The quick brown fox jumps over the lazy dog. 0123456789" placeholder="Type text to preview...">
                <div class="preview-scale-btns">
                    <button class="small-btn" data-pscale="1">1x</button>
                    <button class="small-btn active" data-pscale="2">2x</button>
                    <button class="small-btn" data-pscale="3">3x</button>
                    <button class="small-btn" data-pscale="4">4x</button>
                </div>
            </div>
            <div class="preview-canvas-wrap">
                <canvas id="previewCanvas" width="800" height="120"></canvas>
            </div>
        </div>
    </div>

    <!-- ── Kerning Modal ────────────────────────────────────── -->
    <div class="modal-overlay" id="kerningModal">
        <div class="modal">
            <button class="modal-close" id="kerningClose">&times;</button>
            <h2>Kerning Pairs</h2>
            <p style="font-size:14px;color:var(--text-dim);margin-bottom:12px">Adjust pixel spacing between specific character pairs.</p>
            <div id="kernPairsList"></div>
            <div class="kern-row" style="margin-top:8px">
                <input type="text" class="kern-pair-input" id="newKernPair" maxlength="2" placeholder="AV">
                <input type="number" class="kern-val-input" id="newKernVal" value="-1" min="-8" max="8">
                <button class="small-btn" id="addKernPair">Add</button>
            </div>
        </div>
    </div>

    <!-- ── Hidden file inputs ───────────────────────────────── -->
    <input type="file" id="fileOpenInput" accept=".json" style="display:none">

    <script src="font-engine.js"></script>
    <script>
    (function () {
        'use strict';
        const FE = window.FontEngine;

        /* ── State ──────────────────────────────────────────── */
        let font = FE.loadAutosave() || FE.createFont({ gridWidth: 8, gridHeight: 8 });
        let currentChar = 'A';
        let currentTool = 'pencil';
        let mirrorMode = false;
        let previewScale = 2;
        let drawing = false;
        let drawVal = 1;
        let lineStart = null; // for line/rect tools
        let bitmapBeforeDrag = null; // snapshot before line/rect drag

        /* ── DOM refs ───────────────────────────────────────── */
        const glyphCanvas = document.getElementById('glyphCanvas');
        const glyphCtx = glyphCanvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        const canvasArea = document.getElementById('canvasArea');
        const canvasCharLabel = document.getElementById('canvasCharLabel');
        const canvasInfo = document.getElementById('canvasInfo');
        const charmapContainer = document.getElementById('charmapContainer');

        /* ── Build character map ────────────────────────────── */
        function buildCharmap() {
            charmapContainer.innerHTML = '';
            for (const range of FE.CHAR_RANGES) {
                const section = document.createElement('div');
                section.className = 'charmap-section';
                const label = document.createElement('span');
                label.className = 'charmap-section-label';
                label.textContent = range.label;
                section.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'charmap-grid';

                const chars = range.chars
                    ? Array.from(range.chars)
                    : Array.from({ length: range.end - range.start + 1 }, (_, i) => String.fromCharCode(range.start + i));

                for (const ch of chars) {
                    const btn = document.createElement('button');
                    btn.className = 'char-btn';
                    btn.dataset.char = ch;
                    btn.textContent = ch === ' ' ? 'SPC' : ch;
                    btn.title = ch === ' ' ? 'Space' : ch + ' (U+' + ch.charCodeAt(0).toString(16).padStart(4, '0').toUpperCase() + ')';
                    btn.addEventListener('click', () => selectChar(ch));
                    grid.appendChild(btn);
                }
                section.appendChild(grid);
                charmapContainer.appendChild(section);
            }
            updateCharmapIndicators();
        }

        function showToast(msg) {
            const el = document.createElement('div');
            el.textContent = msg;
            Object.assign(el.style, {
                position: 'fixed', bottom: '20px', left: '50%', transform: 'translateX(-50%)',
                background: 'var(--accent)', color: '#000', padding: '6px 14px',
                borderRadius: '4px', fontFamily: 'var(--font-body)', fontSize: '16px',
                zIndex: '999', boxShadow: '0 2px 8px rgba(0,0,0,0.5)',
                opacity: '0', transition: 'opacity 200ms ease'
            });
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.opacity = '1'; });
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 1500);
        }

        function updateCharmapIndicators() {
            const btns = charmapContainer.querySelectorAll('.char-btn');
            for (const btn of btns) {
                const ch = btn.dataset.char;
                btn.classList.toggle('active', ch === currentChar);
                const g = font.glyphs[ch];
                btn.classList.toggle('has-data', g && g.bitmap.some(v => v));
            }
        }

        function selectChar(ch) {
            currentChar = ch;
            lineStart = null;
            updateCharmapIndicators();
            updateGlyphProps();
            drawGlyph();
            canvasCharLabel.textContent = ch === ' ' ? 'SPACE' : ch;
        }

        /* ── Glyph canvas rendering ─────────────────────────── */
        function getCanvasMetrics() {
            const areaRect = canvasArea.getBoundingClientRect();
            const maxSize = Math.min(areaRect.width - 40, areaRect.height - 40, 500);
            const cellSize = Math.floor(maxSize / font.gridWidth);
            return { cellSize, totalW: cellSize * font.gridWidth, totalH: cellSize * font.gridHeight };
        }

        function resizeGlyphCanvas() {
            const m = getCanvasMetrics();
            glyphCanvas.width = m.totalW;
            glyphCanvas.height = m.totalH;
            drawGlyph();
        }

        function drawGlyph() {
            const w = font.gridWidth;
            const h = font.gridHeight;
            const m = getCanvasMetrics();
            const cs = m.cellSize;
            const ctx = glyphCtx;
            ctx.clearRect(0, 0, glyphCanvas.width, glyphCanvas.height);

            const glyph = font.glyphs[currentChar];
            if (!glyph) return;

            // Draw pixels
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    ctx.fillStyle = glyph.bitmap[y * w + x] ? 'var(--pixel-on)' : 'var(--pixel-off)';
                    // Use actual colors since CSS vars don't work in canvas
                    ctx.fillStyle = glyph.bitmap[y * w + x] ? '#00e5ff' : '#16162e';
                    ctx.fillRect(x * cs, y * cs, cs, cs);
                }
            }

            // Grid lines
            ctx.strokeStyle = '#1e1e3a';
            ctx.lineWidth = 1;
            for (let x = 0; x <= w; x++) {
                ctx.beginPath();
                ctx.moveTo(x * cs + 0.5, 0);
                ctx.lineTo(x * cs + 0.5, h * cs);
                ctx.stroke();
            }
            for (let y = 0; y <= h; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * cs + 0.5);
                ctx.lineTo(w * cs, y * cs + 0.5);
                ctx.stroke();
            }

            // Baseline indicator
            const by = font.baseline * cs;
            ctx.strokeStyle = 'rgba(255, 51, 102, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, by + 0.5);
            ctx.lineTo(w * cs, by + 0.5);
            ctx.stroke();
            ctx.setLineDash([]);

            // Advance width indicator
            const ax = glyph.advance * cs;
            if (ax < w * cs) {
                ctx.strokeStyle = 'rgba(57, 255, 20, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(ax + 0.5, 0);
                ctx.lineTo(ax + 0.5, h * cs);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            canvasInfo.textContent = w + 'x' + h + ' | ' + currentTool.charAt(0).toUpperCase() + currentTool.slice(1) + (mirrorMode ? ' + Mirror' : '');
        }

        /* ── Canvas interaction ──────────────────────────────── */
        function canvasToGrid(e) {
            const rect = glyphCanvas.getBoundingClientRect();
            const m = getCanvasMetrics();
            const x = Math.floor((e.clientX - rect.left) / m.cellSize);
            const y = Math.floor((e.clientY - rect.top) / m.cellSize);
            return { x, y };
        }

        function applyTool(gx, gy, isStart) {
            const glyph = font.glyphs[currentChar];
            if (!glyph) return;
            const w = font.gridWidth;

            if (currentTool === 'pencil') {
                FE.setPixel(glyph, gx, gy, w, 1);
                if (mirrorMode) FE.setPixel(glyph, w - 1 - gx, gy, w, 1);
            } else if (currentTool === 'eraser') {
                FE.setPixel(glyph, gx, gy, w, 0);
                if (mirrorMode) FE.setPixel(glyph, w - 1 - gx, gy, w, 0);
            } else if (currentTool === 'fill' && isStart) {
                const target = FE.getPixel(glyph, gx, gy, w) ? 0 : 1;
                FE.floodFill(glyph, gx, gy, w, target);
            } else if ((currentTool === 'line' || currentTool === 'rect' || currentTool === 'rectFill') && isStart) {
                lineStart = { x: gx, y: gy };
                bitmapBeforeDrag = new Uint8Array(glyph.bitmap);
            }

            drawGlyph();
            updatePreview();
        }

        function applyDragTool(gx, gy) {
            if (!lineStart || !bitmapBeforeDrag) return;
            const glyph = font.glyphs[currentChar];
            if (!glyph) return;
            const w = font.gridWidth;
            // Restore snapshot
            glyph.bitmap.set(bitmapBeforeDrag);

            if (currentTool === 'line') {
                FE.drawLine(glyph, lineStart.x, lineStart.y, gx, gy, w, 1);
                if (mirrorMode) FE.drawLine(glyph, w - 1 - lineStart.x, lineStart.y, w - 1 - gx, gy, w, 1);
            } else if (currentTool === 'rect') {
                FE.drawRect(glyph, lineStart.x, lineStart.y, gx, gy, w, 1, false);
                if (mirrorMode) FE.drawRect(glyph, w - 1 - lineStart.x, lineStart.y, w - 1 - gx, gy, w, 1, false);
            } else if (currentTool === 'rectFill') {
                FE.drawRect(glyph, lineStart.x, lineStart.y, gx, gy, w, 1, true);
                if (mirrorMode) FE.drawRect(glyph, w - 1 - lineStart.x, lineStart.y, w - 1 - gx, gy, w, 1, true);
            }
            drawGlyph();
        }

        glyphCanvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            glyphCanvas.setPointerCapture(e.pointerId);
            drawing = true;
            const { x, y } = canvasToGrid(e);
            const glyph = font.glyphs[currentChar];
            if (glyph) {
                FE.pushHistory(currentChar, new Uint8Array(glyph.bitmap));
            }
            if (currentTool === 'pencil' || currentTool === 'eraser' || currentTool === 'fill') {
                applyTool(x, y, true);
            } else {
                applyTool(x, y, true); // sets lineStart
            }
        });

        glyphCanvas.addEventListener('pointermove', (e) => {
            if (!drawing) return;
            const { x, y } = canvasToGrid(e);
            if (currentTool === 'pencil' || currentTool === 'eraser') {
                applyTool(x, y, false);
            } else if (lineStart) {
                applyDragTool(x, y);
            }
        });

        glyphCanvas.addEventListener('pointerup', (e) => {
            if (drawing && lineStart) {
                const { x, y } = canvasToGrid(e);
                applyDragTool(x, y);
            }
            drawing = false;
            lineStart = null;
            bitmapBeforeDrag = null;
            FE.autosave(font);
            updateCharmapIndicators();
        });

        /* ── Preview ────────────────────────────────────────── */
        function updatePreview() {
            const text = document.getElementById('previewInput').value || '';
            const ctx = previewCtx;
            // Compute needed size
            const lines = text.split('\n');
            const maxLen = Math.max(...lines.map(l => l.length));
            const neededW = (maxLen * (font.gridWidth + font.letterSpacing) + 10) * previewScale;
            const neededH = (lines.length * font.lineHeight + 10) * previewScale;
            previewCanvas.width = Math.max(800, neededW);
            previewCanvas.height = Math.max(60, neededH);
            ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            FE.renderText(ctx, font, text, 4 * previewScale, 4 * previewScale, previewScale, '#00e5ff');
        }

        document.getElementById('previewInput').addEventListener('input', updatePreview);

        document.querySelectorAll('[data-pscale]').forEach(btn => {
            btn.addEventListener('click', () => {
                previewScale = parseInt(btn.dataset.pscale);
                document.querySelectorAll('[data-pscale]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updatePreview();
            });
        });

        /* ── Tool selection ─────────────────────────────────── */
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTool = btn.dataset.tool;
                document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                drawGlyph();
            });
        });

        document.getElementById('mirrorToggle').addEventListener('change', (e) => {
            mirrorMode = e.target.checked;
            drawGlyph();
        });

        /* ── Glyph actions ──────────────────────────────────── */
        document.getElementById('btnClear').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
            g.bitmap.fill(0);
            drawGlyph(); updatePreview(); updateCharmapIndicators(); FE.autosave(font);
        });

        document.getElementById('btnInvert').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
            for (let i = 0; i < g.bitmap.length; i++) g.bitmap[i] = g.bitmap[i] ? 0 : 1;
            drawGlyph(); updatePreview(); FE.autosave(font);
        });

        document.getElementById('btnCopy').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (g) { FE.copyGlyph(g); showToast('Copied!'); }
        });

        document.getElementById('btnPaste').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            if (!FE.hasClipboard()) { showToast('Nothing to paste'); return; }
            FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
            FE.pasteGlyph(g);
            drawGlyph(); updatePreview(); updateGlyphProps(); updateCharmapIndicators(); FE.autosave(font);
            showToast('Pasted!');
        });

        document.getElementById('btnMirrorH').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
            FE.mirrorHorizontal(g, font.gridWidth);
            drawGlyph(); updatePreview(); FE.autosave(font);
        });

        document.getElementById('btnMirrorV').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
            FE.mirrorVertical(g, font.gridWidth);
            drawGlyph(); updatePreview(); FE.autosave(font);
        });

        document.getElementById('btnAutoAdv').addEventListener('click', () => {
            const g = font.glyphs[currentChar];
            if (!g) return;
            g.advance = FE.autoAdvance(g, font.gridWidth);
            document.getElementById('propAdvance').value = g.advance;
            drawGlyph(); updatePreview(); FE.autosave(font);
        });

        // Shift buttons
        document.querySelectorAll('[data-shift]').forEach(btn => {
            btn.addEventListener('click', () => {
                const g = font.glyphs[currentChar];
                if (!g) return;
                const [dx, dy] = btn.dataset.shift.split(',').map(Number);
                FE.pushHistory(currentChar, new Uint8Array(g.bitmap));
                FE.shiftBitmap(g, dx, dy, font.gridWidth);
                drawGlyph(); updatePreview(); FE.autosave(font);
            });
        });

        /* ── Glyph property inputs ──────────────────────────── */
        function updateGlyphProps() {
            const g = font.glyphs[currentChar];
            if (!g) return;
            document.getElementById('propAdvance').value = g.advance;
            document.getElementById('propOffsetX').value = g.offsetX;
            document.getElementById('propOffsetY').value = g.offsetY;
        }

        document.getElementById('propAdvance').addEventListener('input', (e) => {
            const g = font.glyphs[currentChar];
            if (g) { g.advance = parseInt(e.target.value) || font.gridWidth; drawGlyph(); updatePreview(); FE.autosave(font); }
        });
        document.getElementById('propOffsetX').addEventListener('input', (e) => {
            const g = font.glyphs[currentChar];
            if (g) { g.offsetX = parseInt(e.target.value) || 0; updatePreview(); FE.autosave(font); }
        });
        document.getElementById('propOffsetY').addEventListener('input', (e) => {
            const g = font.glyphs[currentChar];
            if (g) { g.offsetY = parseInt(e.target.value) || 0; updatePreview(); FE.autosave(font); }
        });

        /* ── Font property inputs ───────────────────────────── */
        document.getElementById('propFontName').addEventListener('input', (e) => {
            font.name = e.target.value || 'Untitled';
            FE.autosave(font);
        });
        document.getElementById('propSpacing').addEventListener('input', (e) => {
            font.letterSpacing = parseInt(e.target.value) || 0;
            updatePreview(); FE.autosave(font);
        });
        document.getElementById('propLineHeight').addEventListener('input', (e) => {
            font.lineHeight = parseInt(e.target.value) || font.gridHeight + 2;
            updatePreview(); FE.autosave(font);
        });
        document.getElementById('propBaseline').addEventListener('input', (e) => {
            font.baseline = parseInt(e.target.value) || Math.floor(font.gridHeight * 0.8);
            drawGlyph(); FE.autosave(font);
        });

        function syncFontPropsToUI() {
            document.getElementById('propFontName').value = font.name;
            document.getElementById('propSpacing').value = font.letterSpacing;
            document.getElementById('propLineHeight').value = font.lineHeight;
            document.getElementById('propBaseline').value = font.baseline;
            document.getElementById('gridSizeSelect').value = String(font.gridWidth);
        }

        /* ── Grid size change ───────────────────────────────── */
        document.getElementById('gridSizeSelect').addEventListener('change', (e) => {
            const size = parseInt(e.target.value);
            if (size === font.gridWidth) return;
            if (!confirm('Changing grid size will reset all glyphs. Continue?')) {
                e.target.value = String(font.gridWidth);
                return;
            }
            font = FE.createFont({ name: font.name, gridWidth: size, gridHeight: size, letterSpacing: font.letterSpacing });
            FE.clearHistory();
            syncFontPropsToUI();
            resizeGlyphCanvas();
            updateGlyphProps();
            updateCharmapIndicators();
            updatePreview();
            FE.autosave(font);
        });

        /* ── Toolbar actions ────────────────────────────────── */
        document.getElementById('btnNew').addEventListener('click', () => {
            if (!confirm('Create a new font? Unsaved changes will be lost.')) return;
            const size = font.gridWidth;
            font = FE.createFont({ gridWidth: size, gridHeight: size });
            FE.clearHistory();
            syncFontPropsToUI();
            buildCharmap();
            resizeGlyphCanvas();
            updateGlyphProps();
            updatePreview();
            FE.autosave(font);
        });

        document.getElementById('btnSave').addEventListener('click', () => {
            const json = JSON.stringify(FE.toJSON(font), null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (font.name || 'pixel-font').replace(/\s+/g, '-').toLowerCase() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('btnOpen').addEventListener('click', () => {
            document.getElementById('fileOpenInput').click();
        });

        document.getElementById('fileOpenInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    font = FE.fromJSON(data);
                    FE.clearHistory();
                    syncFontPropsToUI();
                    buildCharmap();
                    resizeGlyphCanvas();
                    updateGlyphProps();
                    updatePreview();
                    FE.autosave(font);
                } catch (err) {
                    alert('Error loading font: ' + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.getElementById('btnExportPNG').addEventListener('click', () => {
            const canvas = FE.exportSpriteSheet(font, 1, '#ffffff', '#000000');
            if (!canvas) { alert('No glyphs to export.'); return; }
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (font.name || 'pixel-font').replace(/\s+/g, '-').toLowerCase() + '-spritesheet.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        });

        document.getElementById('btnUndo').addEventListener('click', () => {
            const ch = FE.undo(font);
            if (ch !== null) {
                if (ch !== currentChar) selectChar(ch);
                else { drawGlyph(); updatePreview(); updateCharmapIndicators(); }
            }
        });

        document.getElementById('btnRedo').addEventListener('click', () => {
            const ch = FE.redo(font);
            if (ch !== null) {
                if (ch !== currentChar) selectChar(ch);
                else { drawGlyph(); updatePreview(); updateCharmapIndicators(); }
            }
        });

        /* ── Kerning modal ──────────────────────────────────── */
        document.getElementById('btnKerning').addEventListener('click', () => {
            document.getElementById('kerningModal').classList.add('open');
            renderKernPairs();
        });

        document.getElementById('kerningClose').addEventListener('click', () => {
            document.getElementById('kerningModal').classList.remove('open');
        });

        document.getElementById('kerningModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
        });

        function renderKernPairs() {
            const list = document.getElementById('kernPairsList');
            list.innerHTML = '';
            for (const pair in font.kerning) {
                const row = document.createElement('div');
                row.className = 'kern-row';
                row.innerHTML = `
                    <span style="font-family:var(--font-mono);font-size:16px;color:var(--text);width:40px;text-align:center">${pair}</span>
                    <input type="number" class="kern-val-input" value="${font.kerning[pair]}" min="-8" max="8" data-pair="${pair}">
                    <button class="kern-remove" data-pair="${pair}">&times;</button>
                `;
                list.appendChild(row);
            }
            list.querySelectorAll('.kern-val-input').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    font.kerning[e.target.dataset.pair] = parseInt(e.target.value) || 0;
                    updatePreview(); FE.autosave(font);
                });
            });
            list.querySelectorAll('.kern-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    delete font.kerning[e.target.dataset.pair];
                    renderKernPairs(); updatePreview(); FE.autosave(font);
                });
            });
        }

        document.getElementById('addKernPair').addEventListener('click', () => {
            const pair = document.getElementById('newKernPair').value;
            const val = parseInt(document.getElementById('newKernVal').value) || 0;
            if (pair.length !== 2) { alert('Kerning pair must be exactly 2 characters.'); return; }
            font.kerning[pair] = val;
            document.getElementById('newKernPair').value = '';
            renderKernPairs(); updatePreview(); FE.autosave(font);
        });

        /* ── Keyboard shortcuts ─────────────────────────────── */
        document.addEventListener('keydown', (e) => {
            // Don't intercept when typing in inputs
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); document.getElementById('btnUndo').click(); }
            else if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); document.getElementById('btnRedo').click(); }
            else if (e.ctrlKey && e.key === 's') { e.preventDefault(); document.getElementById('btnSave').click(); }
            else if (e.ctrlKey && e.key === 'c') { e.preventDefault(); document.getElementById('btnCopy').click(); }
            else if (e.ctrlKey && e.key === 'v') { e.preventDefault(); document.getElementById('btnPaste').click(); }
            else if (e.key === 'p' || e.key === 'P') { document.querySelector('[data-tool="pencil"]').click(); }
            else if (e.key === 'e' || e.key === 'E') { document.querySelector('[data-tool="eraser"]').click(); }
            else if (e.key === 'f' || e.key === 'F') { document.querySelector('[data-tool="fill"]').click(); }
            else if (e.key === 'l' || e.key === 'L') { document.querySelector('[data-tool="line"]').click(); }
            else if (e.key === 'r' || e.key === 'R') { document.querySelector('[data-tool="rect"]').click(); }
            else if (e.key === 'm' || e.key === 'M') {
                mirrorMode = !mirrorMode;
                document.getElementById('mirrorToggle').checked = mirrorMode;
                drawGlyph();
            }
            // Navigate chars with [ and ]
            else if (e.key === '[' || e.key === ']') {
                const allChars = FE.ALL_CHARS;
                const idx = allChars.indexOf(currentChar);
                if (idx >= 0) {
                    const newIdx = e.key === ']' ? Math.min(idx + 1, allChars.length - 1) : Math.max(idx - 1, 0);
                    selectChar(allChars[newIdx]);
                }
            }
        });

        /* ── Resize handling ────────────────────────────────── */
        window.addEventListener('resize', () => {
            resizeGlyphCanvas();
            updatePreview();
        });

        /* ── Init ───────────────────────────────────────────── */
        syncFontPropsToUI();
        buildCharmap();
        selectChar('A');
        resizeGlyphCanvas();
        updatePreview();

    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
