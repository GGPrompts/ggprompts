<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020810; }

  #aurora {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  #curtains {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="aurora"></canvas>
<canvas id="stars"></canvas>
<canvas id="curtains"></canvas>
<div id="hint">ESC to exit</div>

<script>
(function() {
  'use strict';

  /* --- Exit logic --- */
  function exitBg() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.replace(url);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitBg(); });
  document.addEventListener('click', exitBg);

  /* --- Hint fade --- */
  const hint = document.getElementById('hint');
  setTimeout(() => { hint.style.opacity = '0'; }, 3000);

  /* --- Canvas setup --- */
  const auroraCanvas = document.getElementById('aurora');
  const actx = auroraCanvas.getContext('2d');
  const starsCanvas = document.getElementById('stars');
  const sctx = starsCanvas.getContext('2d');
  const curtainCanvas = document.getElementById('curtains');
  const cctx = curtainCanvas.getContext('2d');

  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    [auroraCanvas, starsCanvas, curtainCanvas].forEach(c => {
      c.width = W;
      c.height = H;
    });
    drawStars();
  }

  window.addEventListener('resize', resize);
  resize();

  /* --- Stars (drawn once, redrawn on resize) --- */
  const starData = [];
  for (let i = 0; i < 220; i++) {
    starData.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.3 + 0.3,
      a: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.002 + 0.0005,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }

  function drawStars() {
    sctx.clearRect(0, 0, W, H);
    const t = performance.now();
    for (const s of starData) {
      const flicker = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);
      const alpha = s.a * (0.5 + 0.5 * flicker);
      sctx.beginPath();
      sctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      sctx.fillStyle = `rgba(220,230,255,${alpha})`;
      sctx.fill();
    }
  }

  /* --- Aurora bands --- */
  const bands = [];
  const BAND_COUNT = 5;
  const colors = [
    { r: 0, g: 255, b: 136 },   // #00ff88 green
    { r: 0, g: 221, b: 204 },   // #00ddcc teal
    { r: 136, g: 68, b: 255 },  // #8844ff violet
    { r: 0, g: 200, b: 180 },   // teal-green
    { r: 60, g: 140, b: 255 },  // blue accent
  ];

  for (let i = 0; i < BAND_COUNT; i++) {
    bands.push({
      color: colors[i % colors.length],
      yBase: 0.1 + i * 0.08,
      amplitude: 0.03 + Math.random() * 0.04,
      freq: 0.8 + Math.random() * 0.6,
      speed: 0.15 + Math.random() * 0.2,
      drift: Math.random() * 0.1 - 0.05,
      phase: Math.random() * Math.PI * 2,
      opacity: 0.12 + Math.random() * 0.1,
      heightScale: 0.25 + Math.random() * 0.2,
    });
  }

  function drawAurora(t) {
    actx.clearRect(0, 0, W, H);

    /* Dark sky base gradient */
    const bg = actx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#020810');
    bg.addColorStop(0.6, '#05102a');
    bg.addColorStop(1, '#0a0618');
    actx.fillStyle = bg;
    actx.fillRect(0, 0, W, H);

    /* Draw each aurora band */
    for (const band of bands) {
      const ts = t * band.speed;
      const segments = 80;

      for (let pass = 0; pass < 3; pass++) {
        actx.beginPath();
        const passOffset = pass * 0.008;
        const passAlpha = band.opacity * (1 - pass * 0.3);

        for (let i = 0; i <= segments; i++) {
          const pct = i / segments;
          const x = pct * W;

          /* Layered sine waves for organic movement */
          const wave1 = Math.sin(pct * band.freq * Math.PI * 2 + ts + band.phase) * band.amplitude;
          const wave2 = Math.sin(pct * band.freq * 1.7 * Math.PI * 2 - ts * 0.7 + band.phase * 2) * band.amplitude * 0.5;
          const wave3 = Math.sin(pct * 3.3 + ts * 0.4) * 0.01;

          const y = (band.yBase + wave1 + wave2 + wave3 + passOffset + band.drift * Math.sin(ts * 0.3)) * H;

          if (i === 0) actx.moveTo(x, y);
          else actx.lineTo(x, y);
        }

        /* Close the band downward */
        for (let i = segments; i >= 0; i--) {
          const pct = i / segments;
          const x = pct * W;
          const wave1 = Math.sin(pct * band.freq * Math.PI * 2 + ts + band.phase) * band.amplitude;
          const wave2 = Math.sin(pct * band.freq * 1.7 * Math.PI * 2 - ts * 0.7 + band.phase * 2) * band.amplitude * 0.5;
          const bandHeight = band.heightScale * (0.8 + 0.2 * Math.sin(pct * 4 + ts * 0.5));
          const y = (band.yBase + wave1 + wave2 + bandHeight + passOffset) * H;

          actx.lineTo(x, y);
        }

        actx.closePath();

        const { r, g, b } = band.color;
        actx.fillStyle = `rgba(${r},${g},${b},${passAlpha})`;
        actx.fill();
      }
    }
  }

  /* --- Vertical light streaks (curtains) --- */
  const streaks = [];
  for (let i = 0; i < 12; i++) {
    streaks.push({
      x: Math.random(),
      width: 0.005 + Math.random() * 0.015,
      driftSpeed: (Math.random() - 0.5) * 0.00003,
      shimmerSpeed: 0.5 + Math.random() * 1.5,
      shimmerPhase: Math.random() * Math.PI * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      opacity: 0.04 + Math.random() * 0.06,
      yStart: 0.02 + Math.random() * 0.1,
      yEnd: 0.3 + Math.random() * 0.3,
    });
  }

  function drawCurtains(t) {
    cctx.clearRect(0, 0, W, H);

    for (const s of streaks) {
      s.x += s.driftSpeed;
      if (s.x > 1.1) s.x = -0.1;
      if (s.x < -0.1) s.x = 1.1;

      const shimmer = 0.5 + 0.5 * Math.sin(t * s.shimmerSpeed + s.shimmerPhase);
      const alpha = s.opacity * shimmer;
      const cx = s.x * W;
      const w = s.width * W;

      const grad = cctx.createLinearGradient(0, s.yStart * H, 0, s.yEnd * H);
      const { r, g, b } = s.color;
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
      grad.addColorStop(0.3, `rgba(${r},${g},${b},${alpha})`);
      grad.addColorStop(0.7, `rgba(${r},${g},${b},${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

      cctx.fillStyle = grad;
      cctx.fillRect(cx - w / 2, s.yStart * H, w, (s.yEnd - s.yStart) * H);
    }
  }

  /* --- Animation loop --- */
  function frame(now) {
    const t = now * 0.001;
    drawAurora(t);
    drawStars();
    drawCurtains(t);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
