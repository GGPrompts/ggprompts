<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Light</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font: 13px/1 system-ui, sans-serif;
    letter-spacing: 0.05em;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="hint">ESC to exit</div>
<script>
(function() {
  const bg = document.getElementById('bg');

  // Exit logic
  function exit() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.href = url.toString();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exit(); });
  document.addEventListener('click', exit);

  // Fade hint
  const hint = document.getElementById('hint');
  setTimeout(() => hint.classList.add('hidden'), 3000);

  // Layer definitions: each conic gradient layer
  const layers = [
    { speed: 0.08, offset: 0,   opacity: 0.9,  scale: 1.0, xDrift: 0,    yDrift: 0    },
    { speed: -0.05, offset: 30,  opacity: 0.6,  scale: 1.1, xDrift: 0.02, yDrift: 0.01 },
    { speed: 0.12, offset: 60,  opacity: 0.45, scale: 0.9, xDrift: -0.01, yDrift: 0.02 },
    { speed: -0.03, offset: 90,  opacity: 0.35, scale: 1.2, xDrift: 0.015, yDrift: -0.01 },
    { speed: 0.07, offset: 120, opacity: 0.3,  scale: 0.8, xDrift: -0.02, yDrift: -0.015 },
  ];

  // Spectral colors
  const spectrum = [
    'rgba(255,0,0,0.85)',
    'rgba(255,127,0,0.85)',
    'rgba(255,255,0,0.85)',
    'rgba(0,200,0,0.85)',
    'rgba(0,220,220,0.85)',
    'rgba(0,80,255,0.85)',
    'rgba(140,0,255,0.85)',
    'rgba(255,0,0,0.85)',
  ];

  function buildConicStops(angleDeg) {
    const stops = spectrum.map((color, i) => {
      const pct = (i / (spectrum.length - 1)) * 100;
      return `${color} ${pct}%`;
    });
    return stops.join(', ');
  }

  let t = 0;

  function draw() {
    const parts = [];

    // Bright center radial overlay (on top)
    const centerX = 50 + Math.sin(t * 0.1) * 2;
    const centerY = 50 + Math.cos(t * 0.13) * 2;
    parts.push(
      `radial-gradient(ellipse at ${centerX}% ${centerY}%, rgba(255,255,255,0.95) 0%, rgba(255,255,240,0.6) 8%, rgba(255,255,255,0.15) 25%, transparent 50%)`
    );

    // Conic gradient layers (back to front, but CSS paints first = bottom)
    for (let i = layers.length - 1; i >= 0; i--) {
      const l = layers[i];
      const angle = (t * l.speed * 360 + l.offset) % 360;
      const cx = 50 + Math.sin(t * 0.15 + i) * l.xDrift * 100;
      const cy = 50 + Math.cos(t * 0.12 + i * 1.3) * l.yDrift * 100;

      // Build conic gradient string with rotated angle
      const stops = spectrum.map((color, si) => {
        // Adjust opacity per layer
        const baseColor = color.replace(/[\d.]+\)$/, `${l.opacity})`);
        const pct = (si / (spectrum.length - 1)) * 100;
        return `${baseColor} ${pct}%`;
      }).join(', ');

      parts.push(
        `conic-gradient(from ${angle.toFixed(1)}deg at ${cx.toFixed(1)}% ${cy.toFixed(1)}%, ${stops})`
      );
    }

    // Dark base at the very bottom
    parts.push('radial-gradient(ellipse at 50% 50%, #222 0%, #0a0a0a 100%)');

    bg.style.backgroundImage = parts.join(', ');
    bg.style.backgroundSize = layers.map((l, i) => {
      if (i === 0) return '100% 100%'; // center glow
      const s = (l.scale * 100).toFixed(0);
      return `${s}% ${s}%`;
    }).concat(['100% 100%']).join(', ');
    // First entry is the radial center, then layers, then base
    // Recalc: we have 1 center + N layers + 1 base
    const sizes = [];
    sizes.push('100% 100%'); // center glow
    for (const l of [...layers].reverse()) {
      const s = (l.scale * 100).toFixed(0);
      sizes.push(`${s}% ${s}%`);
    }
    sizes.push('100% 100%'); // base
    bg.style.backgroundSize = sizes.join(', ');
    bg.style.backgroundPosition = 'center';
    bg.style.backgroundRepeat = 'no-repeat';

    // Mix mode for rich blending
    bg.style.backgroundBlendMode = ['screen'].concat(
      layers.map(() => 'screen')
    ).concat(['normal']).join(', ');

    t += 0.016;
    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
<script defer src="../../../prompt-viewer.js"></script>
</body>
</html>
