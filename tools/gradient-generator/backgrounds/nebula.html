<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Cloud</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; width: 100%; height: 100%; background: #000; }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="hint">ESC to exit</div>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const hint = document.getElementById('hint');

  setTimeout(() => hint.classList.add('hidden'), 3000);

  function exit() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.href = url.toString();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exit(); });
  document.addEventListener('click', exit);

  // Nebula cloud nodes — each is a radial gradient blob
  const blobs = [];
  const BLOB_COUNT = 12;
  const colors = [
    { r: 255, g: 20, b: 147 },   // magenta #ff1493
    { r: 0, g: 136, b: 255 },    // electric blue #0088ff
    { r: 255, g: 170, b: 0 },    // gold #ffaa00
    { r: 119, g: 34, b: 204 },   // purple #7722cc
    { r: 200, g: 50, b: 200 },   // pink-purple
    { r: 0, g: 200, b: 180 },    // teal accent
  ];

  for (let i = 0; i < BLOB_COUNT; i++) {
    const color = colors[i % colors.length];
    // Orbital parameters
    const cx = 20 + Math.random() * 60;  // orbit center x %
    const cy = 20 + Math.random() * 60;  // orbit center y %
    const rx = 8 + Math.random() * 25;   // orbit radius x
    const ry = 8 + Math.random() * 25;   // orbit radius y
    const speed = 0.00008 + Math.random() * 0.00015; // rad/ms
    const phase = Math.random() * Math.PI * 2;
    const size = 25 + Math.random() * 35; // gradient size %
    const opacity = 0.12 + Math.random() * 0.2;
    // Intensity knots — some blobs pulse brighter
    const isKnot = i < 4;
    const pulseSpeed = 0.0003 + Math.random() * 0.0004;
    const pulsePhase = Math.random() * Math.PI * 2;

    blobs.push({ color, cx, cy, rx, ry, speed, phase, size, opacity, isKnot, pulseSpeed, pulsePhase });
  }

  let startTime = performance.now();

  function render(now) {
    const t = now - startTime;
    const parts = [];

    for (const b of blobs) {
      const angle = b.phase + t * b.speed;
      const x = b.cx + Math.sin(angle) * b.rx;
      const y = b.cy + Math.cos(angle * 0.7) * b.ry;

      let alpha = b.opacity;
      if (b.isKnot) {
        const pulse = 0.5 + 0.5 * Math.sin(b.pulsePhase + t * b.pulseSpeed);
        alpha = b.opacity + pulse * 0.25;
      }

      const { r, g, b: bl } = b.color;
      const sizeNow = b.size + Math.sin(t * 0.0001 + b.phase) * 5;

      parts.push(
        `radial-gradient(ellipse ${sizeNow}% ${sizeNow * 0.8}% at ${x}% ${y}%, rgba(${r},${g},${bl},${alpha}) 0%, rgba(${r},${g},${bl},${alpha * 0.3}) 40%, transparent 70%)`
      );
    }

    // Add a subtle overall veil that shifts
    const veilX = 50 + Math.sin(t * 0.00005) * 20;
    const veilY = 50 + Math.cos(t * 0.00004) * 20;
    parts.push(
      `radial-gradient(ellipse 80% 60% at ${veilX}% ${veilY}%, rgba(119,34,204,0.06) 0%, transparent 70%)`
    );

    canvas.style.backgroundImage = parts.join(',');
    canvas.style.backgroundColor = '#000';

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
