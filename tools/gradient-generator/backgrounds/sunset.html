<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Sunset</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0033; }

  #sunset {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.45);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="sunset"></canvas>
<div id="hint">ESC to exit</div>

<script>
(function() {
  'use strict';

  /* --- Exit logic --- */
  function exitBg() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.replace(url);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitBg(); });
  document.addEventListener('click', exitBg);

  /* --- Hint fade --- */
  setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 3000);

  /* --- Canvas --- */
  const canvas = document.getElementById('sunset');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  /* --- Sunset color bands (top to bottom) --- */
  const bandColors = [
    { r: 26,  g: 0,   b: 51  },  // #1a0033 deep purple-black
    { r: 60,  g: 15,  b: 80  },  // dark purple
    { r: 102, g: 51,  b: 170 },  // #6633aa purple
    { r: 204, g: 34,  b: 136 },  // #cc2288 magenta
    { r: 255, g: 68,  b: 102 },  // #ff4466 coral
    { r: 255, g: 102, b: 0   },  // #ff6600 orange
    { r: 255, g: 170, b: 50  },  // golden
    { r: 255, g: 220, b: 100 },  // pale gold (near sun)
    { r: 255, g: 200, b: 60  },  // gold
    { r: 255, g: 102, b: 0   },  // orange again
    { r: 180, g: 40,  b: 60  },  // deep red-orange
    { r: 80,  g: 10,  b: 30  },  // dark horizon
    { r: 30,  g: 5,   b: 20  },  // near-black ground
  ];

  /* The "sun position" cycles slowly */
  const SUN_CYCLE = 120; // seconds for a full subtle cycle

  function lerp(a, b, t) { return a + (b - a) * t; }

  function lerpColor(c1, c2, t) {
    return {
      r: Math.round(lerp(c1.r, c2.r, t)),
      g: Math.round(lerp(c1.g, c2.g, t)),
      b: Math.round(lerp(c1.b, c2.b, t)),
    };
  }

  function drawSkyGradient(t) {
    /* Compute sun elevation: oscillates gently */
    const sunPhase = (t % SUN_CYCLE) / SUN_CYCLE;
    const sunElevation = 0.55 + 0.08 * Math.sin(sunPhase * Math.PI * 2);
    /* Heat shimmer offset */
    const shimmer = Math.sin(t * 0.6) * 0.003 + Math.sin(t * 1.1) * 0.002;

    const grad = ctx.createLinearGradient(0, 0, 0, H);

    /* Build gradient stops, slightly shifted by time */
    const stopCount = bandColors.length;
    for (let i = 0; i < stopCount; i++) {
      let pos = i / (stopCount - 1);
      /* Warp positions around the sun elevation for that "sinking" feel */
      const distFromSun = Math.abs(pos - sunElevation);
      pos += shimmer * Math.sin(pos * 8 + t * 0.7);

      /* Brightness boost near sun */
      const sunInfluence = Math.max(0, 1 - distFromSun * 4);
      const boostedColor = lerpColor(
        bandColors[i],
        { r: 255, g: 240, b: 180 },
        sunInfluence * 0.15
      );

      pos = Math.max(0, Math.min(1, pos));
      grad.addColorStop(pos, `rgb(${boostedColor.r},${boostedColor.g},${boostedColor.b})`);
    }

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  /* --- Sun glow --- */
  function drawSun(t) {
    const sunPhase = (t % SUN_CYCLE) / SUN_CYCLE;
    const sunY = (0.55 + 0.08 * Math.sin(sunPhase * Math.PI * 2)) * H;
    const sunX = W * 0.5 + Math.sin(t * 0.03) * W * 0.05;

    /* Outer glow layers */
    for (let i = 3; i >= 0; i--) {
      const radius = (0.15 + i * 0.08) * Math.min(W, H);
      const alpha = 0.04 - i * 0.008;
      const pulse = 1 + 0.03 * Math.sin(t * 0.8 + i);

      const grad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, radius * pulse);
      grad.addColorStop(0, `rgba(255, 240, 180, ${alpha + 0.02})`);
      grad.addColorStop(0.3, `rgba(255, 180, 80, ${alpha})`);
      grad.addColorStop(0.7, `rgba(255, 100, 40, ${alpha * 0.4})`);
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, radius * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    /* Hot core */
    const coreRadius = 0.03 * Math.min(W, H);
    const corePulse = 1 + 0.02 * Math.sin(t * 1.2);
    const coreGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, coreRadius * corePulse);
    coreGrad.addColorStop(0, 'rgba(255, 255, 240, 0.6)');
    coreGrad.addColorStop(0.4, 'rgba(255, 220, 150, 0.3)');
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, coreRadius * corePulse, 0, Math.PI * 2);
    ctx.fill();
  }

  /* --- Heat shimmer distortion bands --- */
  function drawHeatShimmer(t) {
    ctx.globalCompositeOperation = 'overlay';
    const bands = 8;
    for (let i = 0; i < bands; i++) {
      const baseY = (0.35 + i * 0.08) * H;
      const shimmerY = baseY + Math.sin(t * (0.5 + i * 0.15) + i * 1.3) * H * 0.005;
      const bandH = H * 0.015;
      const alpha = 0.02 + 0.015 * Math.sin(t * 0.3 + i * 0.7);

      ctx.fillStyle = `rgba(255, 200, 120, ${alpha})`;
      ctx.fillRect(0, shimmerY, W, bandH);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- Horizontal cloud wisps --- */
  const wisps = [];
  for (let i = 0; i < 8; i++) {
    wisps.push({
      y: 0.15 + Math.random() * 0.4,
      x: Math.random(),
      width: 0.15 + Math.random() * 0.3,
      height: 0.005 + Math.random() * 0.01,
      speed: 0.002 + Math.random() * 0.003,
      alpha: 0.03 + Math.random() * 0.04,
      hueShift: Math.random() * 30,
    });
  }

  function drawWisps(t) {
    for (const w of wisps) {
      w.x += w.speed * 0.016;
      if (w.x > 1.3) w.x = -w.width - 0.1;

      const cx = w.x * W;
      const cy = (w.y + Math.sin(t * 0.1 + w.y * 10) * 0.005) * H;
      const hw = w.width * W * 0.5;
      const hh = w.height * H * 0.5;

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, hw);
      const hue = 20 + w.hueShift;
      grad.addColorStop(0, `hsla(${hue}, 80%, 70%, ${w.alpha})`);
      grad.addColorStop(0.6, `hsla(${hue}, 70%, 50%, ${w.alpha * 0.4})`);
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, hw, hh, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* --- Dust motes --- */
  const motes = [];
  for (let i = 0; i < 30; i++) {
    motes.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.3) * 0.0003,
      vy: (Math.random() - 0.5) * 0.0001,
      size: 0.5 + Math.random() * 1.5,
      pulseSpeed: 0.3 + Math.random() * 0.8,
      pulsePhase: Math.random() * Math.PI * 2,
      maxAlpha: 0.15 + Math.random() * 0.25,
    });
  }

  function drawMotes(t) {
    for (const m of motes) {
      m.x += m.vx;
      m.y += m.vy;
      if (m.x > 1.05) m.x = -0.05;
      if (m.x < -0.05) m.x = 1.05;
      if (m.y > 1.05 || m.y < -0.05) { m.y = Math.random(); m.x = Math.random(); }

      const pulse = 0.5 + 0.5 * Math.sin(t * m.pulseSpeed + m.pulsePhase);
      const alpha = m.maxAlpha * pulse;

      /* Warm glow */
      const glow = m.size * 6;
      const grad = ctx.createRadialGradient(m.x * W, m.y * H, 0, m.x * W, m.y * H, glow);
      grad.addColorStop(0, `rgba(255, 200, 120, ${alpha * 0.25})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(m.x * W - glow, m.y * H - glow, glow * 2, glow * 2);

      ctx.beginPath();
      ctx.arc(m.x * W, m.y * H, m.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 160, ${alpha})`;
      ctx.fill();
    }
  }

  /* --- Horizon silhouette (distant mesa shapes) --- */
  function drawHorizon(t) {
    const horizonY = 0.72;
    ctx.beginPath();
    ctx.moveTo(0, H);

    /* Generate mesa/butte profile */
    const points = [
      [0, horizonY + 0.02],
      [0.05, horizonY + 0.01],
      [0.08, horizonY - 0.03],
      [0.12, horizonY - 0.035],
      [0.15, horizonY + 0.005],
      [0.22, horizonY + 0.01],
      [0.28, horizonY - 0.01],
      [0.35, horizonY - 0.05],
      [0.38, horizonY - 0.055],
      [0.42, horizonY - 0.04],
      [0.45, horizonY + 0.005],
      [0.52, horizonY + 0.008],
      [0.58, horizonY - 0.02],
      [0.65, horizonY - 0.06],
      [0.68, horizonY - 0.065],
      [0.72, horizonY - 0.055],
      [0.75, horizonY - 0.01],
      [0.8, horizonY + 0.005],
      [0.88, horizonY - 0.015],
      [0.92, horizonY - 0.025],
      [0.95, horizonY + 0.01],
      [1, horizonY + 0.015],
    ];

    for (const [px, py] of points) {
      ctx.lineTo(px * W, py * H);
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    /* Dark silhouette with subtle purple tint */
    const horizGrad = ctx.createLinearGradient(0, horizonY * H - 20, 0, H);
    horizGrad.addColorStop(0, 'rgba(25, 5, 30, 0.95)');
    horizGrad.addColorStop(0.3, 'rgba(15, 3, 20, 0.98)');
    horizGrad.addColorStop(1, '#0a0210');
    ctx.fillStyle = horizGrad;
    ctx.fill();

    /* Rim light on mesa edges */
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const [px, py] = points[i];
      if (i === 0) ctx.moveTo(px * W, py * H);
      else ctx.lineTo(px * W, py * H);
    }
    const rimAlpha = 0.15 + 0.05 * Math.sin(t * 0.2);
    ctx.strokeStyle = `rgba(255, 120, 40, ${rimAlpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* --- Main loop --- */
  function frame(now) {
    const t = now * 0.001;
    ctx.clearRect(0, 0, W, H);
    drawSkyGradient(t);
    drawSun(t);
    drawHeatShimmer(t);
    drawWisps(t);
    drawMotes(t);
    drawHorizon(t);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
<script defer src="../../../prompt-viewer.js"></script>
</body>
</html>
