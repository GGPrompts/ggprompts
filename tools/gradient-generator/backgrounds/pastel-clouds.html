<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel Clouds</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f0ece4;
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(120,110,100,0.5);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="hint">ESC to exit</div>
<script>
(function() {
  const bg = document.getElementById('bg');
  const hint = document.getElementById('hint');
  const startTime = performance.now();

  setTimeout(() => hint.classList.add('hidden'), 3000);

  function exitBg() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.href = url.toString();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitBg(); });
  document.addEventListener('click', exitBg);

  // Cloud definitions: each has a color, size, and movement pattern
  const clouds = [
    { color: [168, 216, 234], size: 38, cx: 15, cy: 20, dx: 0.008, dy: 0.005, phaseX: 0, phaseY: 0.3 },
    { color: [200, 182, 226], size: 42, cx: 70, cy: 15, dx: 0.006, dy: 0.007, phaseX: 1.2, phaseY: 0.8 },
    { color: [168, 230, 207], size: 35, cx: 40, cy: 60, dx: 0.009, dy: 0.004, phaseX: 2.5, phaseY: 1.5 },
    { color: [255, 211, 181], size: 40, cx: 80, cy: 55, dx: 0.005, dy: 0.008, phaseX: 0.7, phaseY: 3.0 },
    { color: [255, 170, 165], size: 32, cx: 25, cy: 75, dx: 0.007, dy: 0.006, phaseX: 3.8, phaseY: 2.1 },
    { color: [190, 210, 240], size: 45, cx: 55, cy: 35, dx: 0.004, dy: 0.006, phaseX: 1.9, phaseY: 4.2 },
    { color: [220, 195, 235], size: 36, cx: 10, cy: 45, dx: 0.007, dy: 0.005, phaseX: 4.5, phaseY: 0.6 },
    { color: [180, 230, 210], size: 30, cx: 90, cy: 80, dx: 0.006, dy: 0.009, phaseX: 2.0, phaseY: 3.5 },
  ];

  function render(now) {
    const t = (now - startTime) / 1000;

    const gradients = clouds.map(c => {
      // Slow drifting motion using sine waves
      const x = c.cx + Math.sin(t * c.dx * Math.PI * 2 + c.phaseX) * 18;
      const y = c.cy + Math.sin(t * c.dy * Math.PI * 2 + c.phaseY) * 14;

      // Gentle size breathing
      const sizeBreath = c.size + Math.sin(t * 0.15 + c.phaseX) * 4;

      const [r, g, b] = c.color;
      // Soft opacity pulsing
      const alpha = 0.45 + Math.sin(t * 0.1 + c.phaseY) * 0.1;

      return `radial-gradient(ellipse ${sizeBreath}% ${sizeBreath * 0.8}% at ${x}% ${y}%, rgba(${r},${g},${b},${alpha}) 0%, rgba(${r},${g},${b},${alpha * 0.3}) 40%, rgba(${r},${g},${b},0) 70%)`;
    });

    bg.style.background = `${gradients.join(', ')}, linear-gradient(180deg, #f2efe8 0%, #f0ece4 40%, #ede8df 100%)`;

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
<script defer src="../../../prompt-viewer.js"></script>
</body>
</html>
