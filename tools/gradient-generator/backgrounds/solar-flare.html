<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Flare</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; width: 100%; height: 100%; background: #000; }

  #sun {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  /* Corona shimmer ring — animated via JS opacity */
  #corona {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* Conic flare streamers layer */
  #flares {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="sun"></div>
<div id="flares"></div>
<div id="corona"></div>
<div id="hint">ESC to exit</div>
<script>
(function() {
  const sun = document.getElementById('sun');
  const flares = document.getElementById('flares');
  const corona = document.getElementById('corona');
  const hint = document.getElementById('hint');

  setTimeout(() => hint.classList.add('hidden'), 3000);

  function exit() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.href = url.toString();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exit(); });
  document.addEventListener('click', exit);

  const startTime = performance.now();

  // Flare tendril parameters
  const tendrilCount = 8;
  const tendrils = [];
  for (let i = 0; i < tendrilCount; i++) {
    tendrils.push({
      baseAngle: (i / tendrilCount) * 360,
      speed: 0.003 + Math.random() * 0.005,
      width: 3 + Math.random() * 6,       // degrees of arc
      length: 15 + Math.random() * 20,     // % reach
      phase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.001 + Math.random() * 0.002,
    });
  }

  function render(now) {
    const t = now - startTime;

    // Core pulse — breathes slowly
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.0008);
    const pulse2 = 0.9 + 0.1 * Math.sin(t * 0.0012 + 1.5);
    const coreSize = 18 * pulse;
    const glowSize = 35 * pulse2;
    const outerGlow = 55 * pulse;

    // Main sun body — layered radial gradients from center
    const sunGradients = [
      // Bright white-yellow core
      `radial-gradient(circle at 50% 50%, rgba(255,255,240,${0.95 * pulse}) 0%, rgba(255,240,200,${0.8 * pulse}) ${coreSize * 0.4}%, transparent ${coreSize}%)`,
      // Orange mid-layer
      `radial-gradient(circle at 50% 50%, rgba(255,136,0,${0.7 * pulse}) 0%, rgba(255,100,0,${0.5 * pulse}) ${glowSize * 0.5}%, transparent ${glowSize}%)`,
      // Deep red outer
      `radial-gradient(circle at 50% 50%, rgba(204,34,0,${0.5 * pulse2}) 0%, rgba(180,20,0,${0.3 * pulse2}) ${outerGlow * 0.6}%, transparent ${outerGlow}%)`,
      // Very faint far halo
      `radial-gradient(circle at 50% 50%, rgba(120,30,0,${0.15 * pulse}) 0%, transparent ${outerGlow * 1.4}%)`,
    ];
    sun.style.backgroundImage = sunGradients.join(',');
    sun.style.backgroundColor = '#000';

    // Conic gradient flare streamers
    const conicAngle = (t * 0.008) % 360;
    const flareParts = [];

    for (const tr of tendrils) {
      const angle = tr.baseAngle + Math.sin(t * tr.speed + tr.phase) * 15 + conicAngle * 0.3;
      const intensity = 0.3 + 0.4 * (0.5 + 0.5 * Math.sin(t * tr.pulseSpeed + tr.phase));
      const reach = tr.length * pulse;

      // Each tendril as a narrow conic slice + radial fade
      const a1 = angle - tr.width;
      const a2 = angle + tr.width;
      flareParts.push(
        `conic-gradient(from ${angle - 90}deg at 50% 50%, transparent ${0}deg, rgba(255,160,40,${intensity * 0.4}) ${tr.width * 0.3}deg, rgba(255,200,80,${intensity}) ${tr.width}deg, rgba(255,160,40,${intensity * 0.4}) ${tr.width * 1.7}deg, transparent ${tr.width * 2}deg)`
      );
    }

    // Radial mask so streamers fade outward from center
    const streamerMask = `radial-gradient(circle at 50% 50%, transparent ${coreSize * 0.8}%, rgba(255,255,255,0.6) ${coreSize * 1.5}%, rgba(255,255,255,0.3) ${outerGlow}%, transparent ${outerGlow * 1.8}%)`;

    flares.style.backgroundImage = flareParts.join(',');
    flares.style.maskImage = streamerMask;
    flares.style.webkitMaskImage = streamerMask;
    flares.style.opacity = 0.6;

    // Corona ring — thin bright ring
    const coronaPulse = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.002));
    const coronaShimmer = 0.5 + 0.5 * Math.sin(t * 0.005);
    const ringInner = coreSize * 0.95;
    const ringOuter = coreSize * 1.15;
    const ringGlow = coreSize * 1.6;

    corona.style.backgroundImage = [
      // Thin bright ring
      `radial-gradient(circle at 50% 50%, transparent ${ringInner}%, rgba(255,240,200,${0.7 * coronaPulse}) ${ringInner + 1}%, rgba(255,200,100,${0.9 * coronaPulse}) ${(ringInner + ringOuter) / 2}%, rgba(255,240,200,${0.5 * coronaPulse}) ${ringOuter}%, transparent ${ringGlow}%)`,
      // Shimmer highlight — rotates around the ring
      `conic-gradient(from ${(t * 0.02) % 360}deg at 50% 50%, transparent 0deg, rgba(255,255,220,${0.3 * coronaShimmer}) 30deg, transparent 60deg, transparent 160deg, rgba(255,255,220,${0.2 * coronaShimmer}) 200deg, transparent 240deg)`,
    ].join(',');
    // Mask the shimmer to ring area
    const coronaMask = `radial-gradient(circle at 50% 50%, transparent ${ringInner * 0.8}%, white ${ringInner}%, white ${ringGlow}%, transparent ${ringGlow * 1.2}%)`;
    corona.style.maskImage = coronaMask;
    corona.style.webkitMaskImage = coronaMask;

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
