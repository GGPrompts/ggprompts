<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Ocean</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #001133; }

  #ocean {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="ocean"></canvas>
<div id="hint">ESC to exit</div>

<script>
(function() {
  'use strict';

  /* --- Exit logic --- */
  function exitBg() {
    const url = new URL(window.location);
    url.searchParams.set('exit', '1');
    window.location.replace(url);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitBg(); });
  document.addEventListener('click', exitBg);

  /* --- Hint fade --- */
  setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 3000);

  /* --- Canvas --- */
  const canvas = document.getElementById('ocean');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  /* --- Color palette --- */
  const deepNavy   = { r: 0,  g: 17, b: 51  };  // #001133
  const midnight   = { r: 10, g: 22, b: 40  };  // #0a1628
  const darkTeal   = { r: 0,  g: 50, b: 70  };
  const biolum     = { r: 0,  g: 238, b: 255 }; // #00eeff

  /* --- Current layers (large moving gradient blobs) --- */
  const currents = [];
  for (let i = 0; i < 6; i++) {
    currents.push({
      cx: Math.random(),
      cy: Math.random(),
      rx: 0.2 + Math.random() * 0.3,
      ry: 0.15 + Math.random() * 0.25,
      driftX: (Math.random() - 0.5) * 0.02,
      driftY: (Math.random() - 0.5) * 0.015,
      wobbleSpeed: 0.1 + Math.random() * 0.15,
      wobbleAmp: 0.03 + Math.random() * 0.05,
      phase: Math.random() * Math.PI * 2,
      hue: 180 + Math.random() * 40, // teal-blue range
      sat: 60 + Math.random() * 30,
      lightBase: 8 + Math.random() * 8,
      lightAmp: 3 + Math.random() * 4,
    });
  }

  /* --- Caustic light nodes --- */
  const causticNodes = [];
  for (let i = 0; i < 30; i++) {
    causticNodes.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.008,
      vy: (Math.random() - 0.5) * 0.006,
      radius: 0.04 + Math.random() * 0.08,
      pulseSpeed: 0.3 + Math.random() * 0.5,
      pulsePhase: Math.random() * Math.PI * 2,
      brightness: 0.02 + Math.random() * 0.04,
    });
  }

  /* --- Bioluminescent particles --- */
  const particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0004,
      vy: -0.0001 - Math.random() * 0.0003,
      size: 0.5 + Math.random() * 2,
      pulseSpeed: 0.5 + Math.random() * 1.5,
      pulsePhase: Math.random() * Math.PI * 2,
      maxAlpha: 0.3 + Math.random() * 0.5,
    });
  }

  /* --- Wave distortion curves --- */
  const waves = [];
  for (let i = 0; i < 4; i++) {
    waves.push({
      yBase: 0.15 + i * 0.22,
      amplitude: 0.01 + Math.random() * 0.02,
      freq: 1.5 + Math.random() * 1,
      speed: 0.12 + Math.random() * 0.1,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.03 + Math.random() * 0.03,
    });
  }

  function drawBase(t) {
    /* Deep background gradient */
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    const shift = Math.sin(t * 0.08) * 0.02;
    bg.addColorStop(0, '#0a1628');
    bg.addColorStop(0.3 + shift, '#001133');
    bg.addColorStop(0.7 - shift, '#002244');
    bg.addColorStop(1, '#001122');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawCurrents(t) {
    for (const c of currents) {
      const wobX = Math.sin(t * c.wobbleSpeed + c.phase) * c.wobbleAmp;
      const wobY = Math.cos(t * c.wobbleSpeed * 0.7 + c.phase) * c.wobbleAmp * 0.6;
      const cx = (c.cx + wobX + Math.sin(t * c.driftX) * 0.1) * W;
      const cy = (c.cy + wobY + Math.cos(t * c.driftY) * 0.08) * H;
      const rx = c.rx * W;
      const ry = c.ry * H;

      const lightness = c.lightBase + Math.sin(t * 0.2 + c.phase) * c.lightAmp;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
      grad.addColorStop(0, `hsla(${c.hue}, ${c.sat}%, ${lightness}%, 0.15)`);
      grad.addColorStop(0.5, `hsla(${c.hue}, ${c.sat}%, ${lightness * 0.7}%, 0.06)`);
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCaustics(t) {
    ctx.globalCompositeOperation = 'screen';

    for (const n of causticNodes) {
      /* Drift */
      n.x += n.vx * 0.016;
      n.y += n.vy * 0.016;
      if (n.x < -0.1) n.x = 1.1;
      if (n.x > 1.1) n.x = -0.1;
      if (n.y < -0.1) n.y = 1.1;
      if (n.y > 1.1) n.y = -0.1;

      const pulse = 0.5 + 0.5 * Math.sin(t * n.pulseSpeed + n.pulsePhase);
      const r = n.radius * (0.8 + 0.4 * pulse) * Math.min(W, H);
      const alpha = n.brightness * pulse;

      const grad = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, r);
      grad.addColorStop(0, `rgba(0, 200, 220, ${alpha})`);
      grad.addColorStop(0.4, `rgba(0, 150, 180, ${alpha * 0.4})`);
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.fillRect(n.x * W - r, n.y * H - r, r * 2, r * 2);
    }

    /* Caustic network lines (connect nearby nodes) */
    ctx.lineWidth = 0.5;
    for (let i = 0; i < causticNodes.length; i++) {
      for (let j = i + 1; j < causticNodes.length; j++) {
        const a = causticNodes[i], b = causticNodes[j];
        const dx = (a.x - b.x) * W;
        const dy = (a.y - b.y) * H;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 0.2 * Math.min(W, H);
        if (dist < maxDist) {
          const fade = 1 - dist / maxDist;
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.4 + i + j);
          ctx.strokeStyle = `rgba(0, 180, 200, ${fade * pulse * 0.04})`;
          ctx.beginPath();
          ctx.moveTo(a.x * W, a.y * H);
          ctx.lineTo(b.x * W, b.y * H);
          ctx.stroke();
        }
      }
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWaves(t) {
    for (const w of waves) {
      ctx.beginPath();
      const segments = 60;
      for (let i = 0; i <= segments; i++) {
        const pct = i / segments;
        const x = pct * W;
        const y = (w.yBase + Math.sin(pct * w.freq * Math.PI * 2 + t * w.speed + w.phase) * w.amplitude +
                   Math.sin(pct * w.freq * 2.3 * Math.PI * 2 - t * w.speed * 0.6) * w.amplitude * 0.4) * H;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, w.yBase * H, 0, w.yBase * H + H * 0.15);
      grad.addColorStop(0, `rgba(0, 60, 90, ${w.alpha})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  function drawParticles(t) {
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      if (p.x < -0.02) p.x = 1.02;
      if (p.x > 1.02) p.x = -0.02;

      const pulse = 0.5 + 0.5 * Math.sin(t * p.pulseSpeed + p.pulsePhase);
      const alpha = p.maxAlpha * pulse;
      const glow = p.size * 4;

      /* Glow */
      const grad = ctx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, glow);
      grad.addColorStop(0, `rgba(0, 238, 255, ${alpha * 0.3})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(p.x * W - glow, p.y * H - glow, glow * 2, glow * 2);

      /* Core */
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180, 255, 255, ${alpha})`;
      ctx.fill();
    }
  }

  /* --- Volumetric light rays from above --- */
  function drawLightRays(t) {
    ctx.globalCompositeOperation = 'screen';
    const rayCount = 5;
    for (let i = 0; i < rayCount; i++) {
      const baseX = (i + 0.5) / rayCount;
      const sway = Math.sin(t * 0.1 + i * 1.7) * 0.05;
      const x = (baseX + sway) * W;
      const spread = 0.08 * W;
      const alpha = 0.015 + 0.01 * Math.sin(t * 0.15 + i * 2.3);

      const grad = ctx.createLinearGradient(x, 0, x, H * 0.7);
      grad.addColorStop(0, `rgba(0, 180, 220, ${alpha})`);
      grad.addColorStop(0.5, `rgba(0, 120, 160, ${alpha * 0.4})`);
      grad.addColorStop(1, 'transparent');

      ctx.beginPath();
      ctx.moveTo(x - spread * 0.3, 0);
      ctx.lineTo(x + spread * 0.3, 0);
      ctx.lineTo(x + spread, H * 0.7);
      ctx.lineTo(x - spread, H * 0.7);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- Main loop --- */
  function frame(now) {
    const t = now * 0.001;
    drawBase(t);
    drawCurrents(t);
    drawLightRays(t);
    drawWaves(t);
    drawCaustics(t);
    drawParticles(t);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
