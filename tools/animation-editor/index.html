<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Animation Keyframe Editor — a creative tool built with vanilla HTML/CSS/JS.">
    <title>CSS Animation Keyframe Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #111116;
            --bg-panel: #1a1a22;
            --bg-input: #22222e;
            --bg-hover: #2a2a38;
            --bg-active: #33334a;
            --border: #2e2e3e;
            --border-focus: #6366f1;
            --text: #e8e8ee;
            --text-secondary: #9898a8;
            --text-muted: #66667a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-dim: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --danger-hover: #f87171;
            --success: #22c55e;
            --warning: #f59e0b;

            --radius: 8px;
            --radius-sm: 4px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 150ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ───────────────────────────────────── */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            height: 48px;
        }

        .header-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .header-back:hover { color: var(--text); }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        /* ── Layout ───────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr auto auto;
            height: calc(100vh - 48px);
        }

        /* ── Left Panel ──────────────────────────────── */
        .panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            grid-row: 1 / 4;
        }

        .panel-section {
            border-bottom: 1px solid var(--border);
        }

        .panel-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
        }

        .panel-section-body {
            padding: 0 14px 14px;
        }

        /* ── Buttons ──────────────────────────────────── */
        .btn {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .btn-danger {
            color: var(--danger);
            border-color: transparent;
            background: transparent;
        }
        .btn-danger:hover { background: rgba(239,68,68,0.12); }

        .btn-icon {
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }
        .btn-icon:hover { color: var(--text); background: var(--bg-hover); }

        /* ── Controls ─────────────────────────────────── */
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .control-row label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            width: 72px;
            flex-shrink: 0;
        }

        .control-row input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-active);
            border-radius: 2px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-panel);
            cursor: pointer;
        }

        .control-row input[type="number"],
        .control-row input[type="text"] {
            width: 52px;
            padding: 4px 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            text-align: center;
            outline: none;
        }
        .control-row input[type="number"]:focus,
        .control-row input[type="text"]:focus { border-color: var(--border-focus); }

        .control-row input[type="color"] {
            -webkit-appearance: none;
            width: 32px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            padding: 2px;
        }
        .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

        .control-row select {
            flex: 1;
            padding: 4px 6px;
            font-family: var(--font-sans);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .control-row select:focus { border-color: var(--border-focus); }

        /* ── Keyframe List ────────────────────────────── */
        .kf-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .kf-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 2px;
        }
        .kf-item:hover { background: var(--bg-hover); }
        .kf-item.active {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .kf-diamond {
            width: 10px;
            height: 10px;
            background: var(--accent);
            transform: rotate(45deg);
            flex-shrink: 0;
            border-radius: 1px;
        }

        .kf-info {
            flex: 1;
            min-width: 0;
        }

        .kf-pct {
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .kf-preview-text {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kf-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        /* ── Shape Selector ───────────────────────────── */
        .shape-btns {
            display: flex;
            gap: 6px;
        }

        .shape-btn {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .shape-btn.on {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-hover);
        }
        .shape-btn:hover { border-color: var(--text-muted); }

        /* ── Preview Area ─────────────────────────────── */
        .preview-area {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(99,102,241,0.03) 0%, transparent 70%);
            position: relative;
        }

        .preview-checkerboard {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        .preview-element {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            user-select: none;
        }

        /* ── Playback Bar ─────────────────────────────── */
        .playback-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .play-btn:hover { background: var(--accent-hover); }

        .playback-time {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            width: 48px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ── Timeline ─────────────────────────────────── */
        .timeline-area {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            height: 80px;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .timeline-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Code Output ──────────────────────────────── */
        .code-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .code-output {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 180px;
            overflow-y: auto;
            min-height: 44px;
        }

        .code-output .kw { color: #c084fc; }
        .code-output .val { color: #67e8f9; }
        .code-output .fn { color: #fbbf24; }
        .code-output .num { color: #4ade80; }
        .code-output .punc { color: var(--text-muted); }
        .code-output .cm { color: var(--text-muted); font-style: italic; }

        .copy-btn {
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 2px;
        }

        .copy-btn.copied {
            color: var(--success);
            border-color: var(--success);
        }

        /* ── Presets ──────────────────────────────────── */
        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
        }

        .preset-btn {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }
        .preset-btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            color: var(--text);
        }

        /* ── Element Controls Grid ────────────────────── */
        .element-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .element-controls .ctrl {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .element-controls .ctrl label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .element-controls .ctrl input,
        .element-controls .ctrl select {
            padding: 5px 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            outline: none;
            width: 100%;
        }
        .element-controls .ctrl input:focus,
        .element-controls .ctrl select:focus { border-color: var(--border-focus); }

        /* ── Scrollbar ────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
            }

            .panel {
                grid-row: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 45vh;
                overflow-y: auto;
            }

            .preview-canvas {
                min-height: 250px;
            }

            .timeline-area {
                height: 70px;
            }

            .code-bar {
                grid-column: 1 !important;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="../index.html" class="header-back">&#9664; Tools</a>
    <div class="header-sep"></div>
    <div class="header-title">CSS Animation Keyframe Editor</div>
</div>

<div class="app">

    <!-- Left Panel -->
    <div class="panel">

        <!-- Animation Settings -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Animation Settings</span></div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Name</label>
                    <input type="text" id="animName" value="myAnimation" style="flex:1;width:auto;text-align:left;">
                </div>
                <div class="control-row">
                    <label>Duration</label>
                    <input type="range" id="animDuration" min="0.1" max="10" step="0.1" value="1">
                    <input type="number" id="animDurationNum" min="0.1" max="30" step="0.1" value="1" style="width:58px;">
                    <span style="font-size:10px;color:var(--text-muted);">s</span>
                </div>
                <div class="control-row">
                    <label>Easing</label>
                    <select id="animEasing">
                        <option value="linear">linear</option>
                        <option value="ease" selected>ease</option>
                        <option value="ease-in">ease-in</option>
                        <option value="ease-out">ease-out</option>
                        <option value="ease-in-out">ease-in-out</option>
                        <option value="cubic-bezier">cubic-bezier</option>
                    </select>
                </div>
                <div class="control-row" id="bezierRow" style="display:none;">
                    <label>Bezier</label>
                    <input type="text" id="bezierValues" value="0.42, 0, 0.58, 1" style="flex:1;width:auto;text-align:left;">
                </div>
                <div class="control-row">
                    <label>Iterations</label>
                    <select id="animIterations">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="5">5</option>
                        <option value="infinite" selected>infinite</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Direction</label>
                    <select id="animDirection">
                        <option value="normal" selected>normal</option>
                        <option value="reverse">reverse</option>
                        <option value="alternate">alternate</option>
                        <option value="alternate-reverse">alternate-reverse</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Fill Mode</label>
                    <select id="animFillMode">
                        <option value="none">none</option>
                        <option value="forwards" selected>forwards</option>
                        <option value="backwards">backwards</option>
                        <option value="both">both</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Keyframes -->
        <div class="panel-section">
            <div class="panel-section-header">
                <span>Keyframes</span>
                <button class="btn btn-sm btn-accent" id="addKfBtn">+ Add</button>
            </div>
            <div class="panel-section-body">
                <div class="kf-list" id="kfList"></div>
            </div>
        </div>

        <!-- Keyframe Properties (shown when a keyframe is selected) -->
        <div class="panel-section" id="kfEditorSection" style="display:none;">
            <div class="panel-section-header"><span>Keyframe Properties</span></div>
            <div class="panel-section-body" id="kfEditor">
                <div class="control-row">
                    <label>Percentage</label>
                    <input type="range" id="kfPct" min="0" max="100" step="1" value="0">
                    <input type="number" id="kfPctNum" min="0" max="100" step="1" value="0" style="width:50px;">
                    <span style="font-size:10px;color:var(--text-muted);">%</span>
                </div>

                <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin:12px 0 8px;">Transform</div>
                <div class="control-row">
                    <label>Translate X</label>
                    <input type="range" id="kfTx" min="-300" max="300" value="0">
                    <input type="number" id="kfTxNum" min="-500" max="500" value="0">
                    <span style="font-size:10px;color:var(--text-muted);">px</span>
                </div>
                <div class="control-row">
                    <label>Translate Y</label>
                    <input type="range" id="kfTy" min="-300" max="300" value="0">
                    <input type="number" id="kfTyNum" min="-500" max="500" value="0">
                    <span style="font-size:10px;color:var(--text-muted);">px</span>
                </div>
                <div class="control-row">
                    <label>Rotate</label>
                    <input type="range" id="kfRotate" min="-360" max="360" value="0">
                    <input type="number" id="kfRotateNum" min="-3600" max="3600" value="0" style="width:58px;">
                    <span style="font-size:10px;color:var(--text-muted);">deg</span>
                </div>
                <div class="control-row">
                    <label>Scale</label>
                    <input type="range" id="kfScale" min="0" max="300" value="100">
                    <input type="number" id="kfScaleNum" min="0" max="500" value="100">
                    <span style="font-size:10px;color:var(--text-muted);">%</span>
                </div>
                <div class="control-row">
                    <label>Skew X</label>
                    <input type="range" id="kfSkewX" min="-90" max="90" value="0">
                    <input type="number" id="kfSkewXNum" min="-90" max="90" value="0">
                    <span style="font-size:10px;color:var(--text-muted);">deg</span>
                </div>
                <div class="control-row">
                    <label>Skew Y</label>
                    <input type="range" id="kfSkewY" min="-90" max="90" value="0">
                    <input type="number" id="kfSkewYNum" min="-90" max="90" value="0">
                    <span style="font-size:10px;color:var(--text-muted);">deg</span>
                </div>

                <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin:12px 0 8px;">Appearance</div>
                <div class="control-row">
                    <label>Opacity</label>
                    <input type="range" id="kfOpacity" min="0" max="100" value="100">
                    <input type="number" id="kfOpacityNum" min="0" max="100" value="100">
                    <span style="font-size:10px;color:var(--text-muted);">%</span>
                </div>
                <div class="control-row">
                    <label>Color</label>
                    <input type="color" id="kfColor" value="#6366f1">
                </div>
                <div class="control-row">
                    <label>Radius</label>
                    <input type="range" id="kfRadius" min="0" max="50" value="8">
                    <input type="number" id="kfRadiusNum" min="0" max="50" value="8">
                    <span style="font-size:10px;color:var(--text-muted);">%</span>
                </div>
                <div class="control-row">
                    <label>Shadow</label>
                    <input type="text" id="kfShadow" value="none" style="flex:1;width:auto;text-align:left;font-size:10px;">
                </div>
            </div>
        </div>

        <!-- Target Element -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Target Element</span></div>
            <div class="panel-section-body">
                <div class="control-row">
                    <label>Shape</label>
                    <div class="shape-btns">
                        <button class="shape-btn on" data-shape="box">Box</button>
                        <button class="shape-btn" data-shape="circle">Circle</button>
                        <button class="shape-btn" data-shape="text">Text</button>
                    </div>
                </div>
                <div class="element-controls">
                    <div class="ctrl">
                        <label>Width</label>
                        <input type="number" id="elWidth" value="120" min="20" max="400">
                    </div>
                    <div class="ctrl">
                        <label>Height</label>
                        <input type="number" id="elHeight" value="120" min="20" max="400">
                    </div>
                    <div class="ctrl">
                        <label>Background</label>
                        <input type="color" id="elBg" value="#6366f1">
                    </div>
                    <div class="ctrl" id="textCtrl" style="display:none;">
                        <label>Text</label>
                        <input type="text" id="elText" value="Hello">
                    </div>
                </div>
            </div>
        </div>

        <!-- Presets -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Presets</span></div>
            <div class="panel-section-body">
                <div class="presets-grid" id="presetsGrid"></div>
            </div>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview-area">
        <div class="preview-canvas">
            <div class="preview-checkerboard"></div>
            <div class="preview-element" id="previewEl"></div>
        </div>

        <!-- Playback controls -->
        <div class="playback-bar">
            <button class="play-btn" id="playBtn" title="Play / Pause">&#9654;</button>
            <span class="playback-time" id="playbackTime">0%</span>
            <input type="range" id="scrubber" min="0" max="100" step="0.5" value="0" style="flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--bg-active);border-radius:2px;outline:none;cursor:pointer;">
        </div>
    </div>

    <!-- Timeline -->
    <div class="timeline-area" id="timelineArea">
        <canvas class="timeline-canvas" id="timelineCanvas"></canvas>
    </div>

    <!-- Code Output -->
    <div class="code-bar" style="grid-column:2;">
        <div class="code-output" id="codeOutput"></div>
        <button class="btn copy-btn" id="copyBtn">Copy</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ── State ─────────────────────────────────
    var nextKfId = 1;

    function createKeyframe(pct, overrides) {
        var kf = {
            id: nextKfId++,
            pct: pct,
            translateX: 0,
            translateY: 0,
            rotate: 0,
            scale: 100,
            skewX: 0,
            skewY: 0,
            opacity: 100,
            color: '#6366f1',
            borderRadius: 8,
            boxShadow: 'none'
        };
        if (overrides) {
            for (var k in overrides) {
                if (overrides.hasOwnProperty(k)) kf[k] = overrides[k];
            }
        }
        return kf;
    }

    var state = {
        keyframes: [
            createKeyframe(0),
            createKeyframe(100)
        ],
        activeKfId: null,
        shape: 'box',
        playing: false,
        playStart: 0,
        playOffset: 0
    };
    state.activeKfId = state.keyframes[0].id;

    function sortKeyframes() {
        state.keyframes.sort(function(a, b) { return a.pct - b.pct; });
    }

    function getActiveKf() {
        return state.keyframes.find(function(kf) { return kf.id === state.activeKfId; }) || null;
    }

    // ── DOM refs ───────────────────────────────
    var animName = document.getElementById('animName');
    var animDuration = document.getElementById('animDuration');
    var animDurationNum = document.getElementById('animDurationNum');
    var animEasing = document.getElementById('animEasing');
    var bezierRow = document.getElementById('bezierRow');
    var bezierValues = document.getElementById('bezierValues');
    var animIterations = document.getElementById('animIterations');
    var animDirection = document.getElementById('animDirection');
    var animFillMode = document.getElementById('animFillMode');

    var kfList = document.getElementById('kfList');
    var kfEditorSection = document.getElementById('kfEditorSection');
    var addKfBtn = document.getElementById('addKfBtn');

    var previewEl = document.getElementById('previewEl');
    var playBtn = document.getElementById('playBtn');
    var playbackTime = document.getElementById('playbackTime');
    var scrubber = document.getElementById('scrubber');

    var timelineArea = document.getElementById('timelineArea');
    var timelineCanvas = document.getElementById('timelineCanvas');
    var timelineCtx = timelineCanvas.getContext('2d');

    var codeOutput = document.getElementById('codeOutput');
    var copyBtn = document.getElementById('copyBtn');

    var elWidth = document.getElementById('elWidth');
    var elHeight = document.getElementById('elHeight');
    var elBg = document.getElementById('elBg');
    var elText = document.getElementById('elText');
    var textCtrl = document.getElementById('textCtrl');

    // Keyframe property controls
    var kfCtrl = {
        pct: document.getElementById('kfPct'),
        pctNum: document.getElementById('kfPctNum'),
        tx: document.getElementById('kfTx'),
        txNum: document.getElementById('kfTxNum'),
        ty: document.getElementById('kfTy'),
        tyNum: document.getElementById('kfTyNum'),
        rotate: document.getElementById('kfRotate'),
        rotateNum: document.getElementById('kfRotateNum'),
        scale: document.getElementById('kfScale'),
        scaleNum: document.getElementById('kfScaleNum'),
        skewX: document.getElementById('kfSkewX'),
        skewXNum: document.getElementById('kfSkewXNum'),
        skewY: document.getElementById('kfSkewY'),
        skewYNum: document.getElementById('kfSkewYNum'),
        opacity: document.getElementById('kfOpacity'),
        opacityNum: document.getElementById('kfOpacityNum'),
        color: document.getElementById('kfColor'),
        radius: document.getElementById('kfRadius'),
        radiusNum: document.getElementById('kfRadiusNum'),
        shadow: document.getElementById('kfShadow')
    };

    // ── Style element for live animation ──────
    var styleEl = document.createElement('style');
    document.head.appendChild(styleEl);

    // ── Helpers ────────────────────────────────
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function getEasingCSS() {
        if (animEasing.value === 'cubic-bezier') {
            return 'cubic-bezier(' + bezierValues.value.trim() + ')';
        }
        return animEasing.value;
    }

    function kfToTransform(kf) {
        var parts = [];
        if (kf.translateX !== 0 || kf.translateY !== 0) {
            parts.push('translate(' + kf.translateX + 'px, ' + kf.translateY + 'px)');
        }
        if (kf.rotate !== 0) parts.push('rotate(' + kf.rotate + 'deg)');
        if (kf.scale !== 100) parts.push('scale(' + (kf.scale / 100) + ')');
        if (kf.skewX !== 0) parts.push('skewX(' + kf.skewX + 'deg)');
        if (kf.skewY !== 0) parts.push('skewY(' + kf.skewY + 'deg)');
        return parts.length ? parts.join(' ') : 'none';
    }

    function hasPropertyVariation(prop) {
        if (state.keyframes.length < 2) return false;
        var first = state.keyframes[0][prop];
        return state.keyframes.some(function(kf) { return kf[prop] !== first; });
    }

    function hasTransformVariation() {
        return state.keyframes.some(function(kf) { return kfToTransform(kf) !== 'none'; });
    }

    function kfToCSS(kf) {
        var lines = [];
        var transform = kfToTransform(kf);
        if (transform !== 'none' || hasTransformVariation()) lines.push('transform: ' + transform);
        if (kf.opacity !== 100 || hasPropertyVariation('opacity')) lines.push('opacity: ' + (kf.opacity / 100));
        if (hasPropertyVariation('color')) lines.push('background-color: ' + kf.color);
        if (kf.borderRadius !== 8 || hasPropertyVariation('borderRadius')) lines.push('border-radius: ' + kf.borderRadius + '%');
        if (kf.boxShadow !== 'none' || hasPropertyVariation('boxShadow')) lines.push('box-shadow: ' + kf.boxShadow);
        return lines;
    }

    function generateKeyframesCSS() {
        sortKeyframes();
        var name = animName.value.trim() || 'myAnimation';
        var lines = ['@keyframes ' + name + ' {'];
        state.keyframes.forEach(function(kf) {
            var props = kfToCSS(kf);
            lines.push('  ' + kf.pct + '% {');
            if (props.length === 0) {
                // empty frame - include a comment
            } else {
                props.forEach(function(p) { lines.push('    ' + p + ';'); });
            }
            lines.push('  }');
        });
        lines.push('}');
        return lines.join('\n');
    }

    function generateAnimationCSS() {
        var name = animName.value.trim() || 'myAnimation';
        var dur = parseFloat(animDurationNum.value) || 1;
        var easing = getEasingCSS();
        var iter = animIterations.value;
        var dir = animDirection.value;
        var fill = animFillMode.value;
        return 'animation: ' + name + ' ' + dur + 's ' + easing + ' ' + iter + ' ' + dir + ' ' + fill + ';';
    }

    function generateFullCSS() {
        return generateKeyframesCSS() + '\n\n' + '/* Apply to element */\n' + generateAnimationCSS();
    }

    // ── Interpolation for scrub preview ───────
    function lerp(a, b, t) { return a + (b - a) * t; }

    function lerpColor(c1, c2, t) {
        var r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
        var r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
        var r = Math.round(lerp(r1, r2, t));
        var g = Math.round(lerp(g1, g2, t));
        var b = Math.round(lerp(b1, b2, t));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function interpolateAtPct(pct) {
        sortKeyframes();
        var kfs = state.keyframes;
        if (kfs.length === 0) return createKeyframe(pct);
        if (kfs.length === 1) return Object.assign({}, kfs[0], { pct: pct });
        if (pct <= kfs[0].pct) return Object.assign({}, kfs[0], { pct: pct });
        if (pct >= kfs[kfs.length - 1].pct) return Object.assign({}, kfs[kfs.length - 1], { pct: pct });

        var before = kfs[0], after = kfs[kfs.length - 1];
        for (var i = 0; i < kfs.length - 1; i++) {
            if (pct >= kfs[i].pct && pct <= kfs[i + 1].pct) {
                before = kfs[i];
                after = kfs[i + 1];
                break;
            }
        }

        var range = after.pct - before.pct;
        var t = range === 0 ? 0 : (pct - before.pct) / range;

        return {
            pct: pct,
            translateX: lerp(before.translateX, after.translateX, t),
            translateY: lerp(before.translateY, after.translateY, t),
            rotate: lerp(before.rotate, after.rotate, t),
            scale: lerp(before.scale, after.scale, t),
            skewX: lerp(before.skewX, after.skewX, t),
            skewY: lerp(before.skewY, after.skewY, t),
            opacity: lerp(before.opacity, after.opacity, t),
            color: lerpColor(before.color, after.color, t),
            borderRadius: lerp(before.borderRadius, after.borderRadius, t),
            boxShadow: t < 0.5 ? before.boxShadow : after.boxShadow
        };
    }

    // ── Render ─────────────────────────────────
    function render() {
        renderKfList();
        renderKfEditor();
        renderPreview();
        renderTimeline();
        renderCode();
    }

    function renderKfList() {
        kfList.innerHTML = '';
        sortKeyframes();
        state.keyframes.forEach(function(kf) {
            var div = document.createElement('div');
            div.className = 'kf-item' + (kf.id === state.activeKfId ? ' active' : '');

            var props = kfToCSS(kf);
            var preview = props.length > 0 ? props[0] : 'no changes';

            div.innerHTML =
                '<span class="kf-diamond"></span>' +
                '<div class="kf-info">' +
                    '<div class="kf-pct">' + kf.pct + '%</div>' +
                    '<div class="kf-preview-text">' + preview + '</div>' +
                '</div>' +
                '<div class="kf-actions">' +
                    '<button class="btn-icon kf-dup" title="Duplicate">&#10697;</button>' +
                    '<button class="btn-icon btn-danger kf-del" title="Delete">&#10005;</button>' +
                '</div>';

            div.addEventListener('click', function(e) {
                if (e.target.closest('.kf-del')) {
                    if (state.keyframes.length <= 1) return;
                    state.keyframes = state.keyframes.filter(function(k) { return k.id !== kf.id; });
                    if (state.activeKfId === kf.id) {
                        state.activeKfId = state.keyframes[0] ? state.keyframes[0].id : null;
                    }
                    render();
                    return;
                }
                if (e.target.closest('.kf-dup')) {
                    var newPct = clamp(kf.pct + 5, 0, 100);
                    var dup = createKeyframe(newPct, kf);
                    dup.pct = newPct;
                    state.keyframes.push(dup);
                    state.activeKfId = dup.id;
                    render();
                    return;
                }
                state.activeKfId = kf.id;
                render();
            });

            kfList.appendChild(div);
        });
    }

    function renderKfEditor() {
        var kf = getActiveKf();
        if (!kf) {
            kfEditorSection.style.display = 'none';
            return;
        }
        kfEditorSection.style.display = '';

        kfCtrl.pct.value = kf.pct;
        kfCtrl.pctNum.value = kf.pct;
        kfCtrl.tx.value = kf.translateX;
        kfCtrl.txNum.value = kf.translateX;
        kfCtrl.ty.value = kf.translateY;
        kfCtrl.tyNum.value = kf.translateY;
        kfCtrl.rotate.value = clamp(kf.rotate, -360, 360);
        kfCtrl.rotateNum.value = kf.rotate;
        kfCtrl.scale.value = kf.scale;
        kfCtrl.scaleNum.value = kf.scale;
        kfCtrl.skewX.value = kf.skewX;
        kfCtrl.skewXNum.value = kf.skewX;
        kfCtrl.skewY.value = kf.skewY;
        kfCtrl.skewYNum.value = kf.skewY;
        kfCtrl.opacity.value = kf.opacity;
        kfCtrl.opacityNum.value = kf.opacity;
        kfCtrl.color.value = kf.color;
        kfCtrl.radius.value = kf.borderRadius;
        kfCtrl.radiusNum.value = kf.borderRadius;
        kfCtrl.shadow.value = kf.boxShadow;
    }

    function applyShapeStyle() {
        var w = parseInt(elWidth.value) || 120;
        var h = parseInt(elHeight.value) || 120;
        var bg = elBg.value;

        previewEl.style.width = w + 'px';
        previewEl.style.height = h + 'px';
        previewEl.style.background = bg;
        previewEl.textContent = '';

        if (state.shape === 'circle') {
            previewEl.style.borderRadius = '50%';
        } else if (state.shape === 'text') {
            previewEl.style.borderRadius = '8px';
            previewEl.textContent = elText.value || 'Hello';
        } else {
            previewEl.style.borderRadius = '8px';
        }
    }

    function renderPreview() {
        applyShapeStyle();

        if (state.playing) return; // Animation CSS handles it

        // Apply scrubber position
        var pct = parseFloat(scrubber.value);
        var interp = interpolateAtPct(pct);

        var transform = [];
        if (interp.translateX !== 0 || interp.translateY !== 0) {
            transform.push('translate(' + interp.translateX + 'px, ' + interp.translateY + 'px)');
        }
        if (interp.rotate !== 0) transform.push('rotate(' + interp.rotate + 'deg)');
        if (interp.scale !== 100) transform.push('scale(' + (interp.scale / 100) + ')');
        if (interp.skewX !== 0) transform.push('skewX(' + interp.skewX + 'deg)');
        if (interp.skewY !== 0) transform.push('skewY(' + interp.skewY + 'deg)');

        previewEl.style.transform = transform.length ? transform.join(' ') : '';
        previewEl.style.opacity = interp.opacity / 100;
        previewEl.style.backgroundColor = interp.color;
        if (state.shape !== 'circle') {
            previewEl.style.borderRadius = interp.borderRadius + '%';
        }
        if (interp.boxShadow !== 'none') {
            previewEl.style.boxShadow = interp.boxShadow;
        } else {
            previewEl.style.boxShadow = '';
        }

        previewEl.style.animation = '';
        styleEl.textContent = '';
    }

    function renderTimeline() {
        var dpr = window.devicePixelRatio || 1;
        var rect = timelineArea.getBoundingClientRect();
        var w = rect.width;
        var h = rect.height;

        timelineCanvas.width = w * dpr;
        timelineCanvas.height = h * dpr;
        timelineCanvas.style.width = w + 'px';
        timelineCanvas.style.height = h + 'px';
        timelineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var ctx = timelineCtx;
        var pad = 30;
        var trackW = w - pad * 2;
        var trackY = h / 2;

        // Background
        ctx.fillStyle = '#1a1a22';
        ctx.fillRect(0, 0, w, h);

        // Track line
        ctx.fillStyle = '#2e2e3e';
        ctx.fillRect(pad, trackY - 1, trackW, 2);

        // Percentage markers
        ctx.fillStyle = '#66667a';
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'center';
        for (var p = 0; p <= 100; p += 10) {
            var x = pad + (p / 100) * trackW;
            ctx.fillStyle = '#2e2e3e';
            ctx.fillRect(x, trackY - 6, 1, 12);
            ctx.fillStyle = '#66667a';
            ctx.fillText(p + '%', x, trackY + 20);
        }

        // Scrubber position
        var scrubPct = parseFloat(scrubber.value);
        var scrubX = pad + (scrubPct / 100) * trackW;
        ctx.fillStyle = 'rgba(99, 102, 241, 0.2)';
        ctx.fillRect(scrubX - 1, 0, 2, h);
        ctx.fillStyle = '#6366f1';
        ctx.beginPath();
        ctx.arc(scrubX, 8, 5, 0, Math.PI * 2);
        ctx.fill();

        // Keyframe diamonds
        sortKeyframes();
        state.keyframes.forEach(function(kf) {
            var kx = pad + (kf.pct / 100) * trackW;
            var isActive = kf.id === state.activeKfId;

            ctx.save();
            ctx.translate(kx, trackY);
            ctx.rotate(Math.PI / 4);

            if (isActive) {
                ctx.shadowColor = '#6366f1';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#818cf8';
            } else {
                ctx.fillStyle = '#6366f1';
            }

            ctx.fillRect(-6, -6, 12, 12);
            ctx.restore();
        });
    }

    function renderCode() {
        sortKeyframes();
        var name = animName.value.trim() || 'myAnimation';
        var dur = parseFloat(animDurationNum.value) || 1;
        var easing = getEasingCSS();
        var iter = animIterations.value;
        var dir = animDirection.value;
        var fill = animFillMode.value;

        var html = '<span class="kw">@keyframes</span> <span class="val">' + name + '</span> <span class="punc">{</span>\n';

        state.keyframes.forEach(function(kf) {
            html += '  <span class="num">' + kf.pct + '%</span> <span class="punc">{</span>\n';
            var props = kfToCSS(kf);
            props.forEach(function(p) {
                var parts = p.split(': ');
                html += '    <span class="kw">' + parts[0] + '</span><span class="punc">:</span> <span class="val">' + escHtml(parts[1]) + '</span><span class="punc">;</span>\n';
            });
            html += '  <span class="punc">}</span>\n';
        });

        html += '<span class="punc">}</span>\n\n';
        html += '<span class="cm">/* Apply to element */</span>\n';
        html += '<span class="kw">animation</span><span class="punc">:</span> <span class="val">' + name + '</span> <span class="num">' + dur + 's</span> <span class="val">' + escHtml(easing) + '</span> <span class="val">' + iter + '</span> <span class="val">' + dir + '</span> <span class="val">' + fill + '</span><span class="punc">;</span>';

        codeOutput.innerHTML = html;
    }

    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Control bindings ──────────────────────
    function bindSliderPair(slider, num, prop) {
        function update(val) {
            var kf = getActiveKf();
            if (!kf) return;
            var v = prop === 'pct' ? parseInt(val) : parseFloat(val);
            if (isNaN(v)) return;
            kf[prop] = v;
            slider.value = clamp(v, parseFloat(slider.min), parseFloat(slider.max));
            num.value = v;
            if (!state.playing) {
                renderPreview();
            }
            renderTimeline();
            renderCode();
            if (prop === 'pct') renderKfList();
        }
        slider.addEventListener('input', function() { update(this.value); });
        num.addEventListener('input', function() { update(this.value); });
    }

    // Map control pairs to keyframe properties
    bindSliderPair(kfCtrl.pct, kfCtrl.pctNum, 'pct');
    bindSliderPair(kfCtrl.tx, kfCtrl.txNum, 'translateX');
    bindSliderPair(kfCtrl.ty, kfCtrl.tyNum, 'translateY');
    bindSliderPair(kfCtrl.rotate, kfCtrl.rotateNum, 'rotate');
    bindSliderPair(kfCtrl.scale, kfCtrl.scaleNum, 'scale');
    bindSliderPair(kfCtrl.skewX, kfCtrl.skewXNum, 'skewX');
    bindSliderPair(kfCtrl.skewY, kfCtrl.skewYNum, 'skewY');
    bindSliderPair(kfCtrl.opacity, kfCtrl.opacityNum, 'opacity');
    bindSliderPair(kfCtrl.radius, kfCtrl.radiusNum, 'borderRadius');

    kfCtrl.color.addEventListener('input', function() {
        var kf = getActiveKf();
        if (!kf) return;
        kf.color = this.value;
        if (!state.playing) renderPreview();
        renderCode();
        renderKfList();
    });

    kfCtrl.shadow.addEventListener('change', function() {
        var kf = getActiveKf();
        if (!kf) return;
        kf.boxShadow = this.value.trim() || 'none';
        if (!state.playing) renderPreview();
        renderCode();
    });

    // ── Animation settings bindings ──────────
    animDuration.addEventListener('input', function() {
        animDurationNum.value = this.value;
        renderCode();
    });
    animDurationNum.addEventListener('input', function() {
        animDuration.value = clamp(parseFloat(this.value) || 1, 0.1, 10);
        renderCode();
    });

    animEasing.addEventListener('change', function() {
        bezierRow.style.display = this.value === 'cubic-bezier' ? '' : 'none';
        renderCode();
    });
    bezierValues.addEventListener('input', function() { renderCode(); });
    animName.addEventListener('input', function() { renderCode(); });
    animIterations.addEventListener('change', function() { renderCode(); });
    animDirection.addEventListener('change', function() { renderCode(); });
    animFillMode.addEventListener('change', function() { renderCode(); });

    // ── Element settings ─────────────────────
    [elWidth, elHeight].forEach(function(input) {
        input.addEventListener('input', function() { if (!state.playing) renderPreview(); });
    });
    elBg.addEventListener('input', function() { if (!state.playing) renderPreview(); });
    elText.addEventListener('input', function() { if (!state.playing) renderPreview(); });

    // Shape buttons
    document.querySelectorAll('.shape-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.shape-btn').forEach(function(b) { b.classList.remove('on'); });
            btn.classList.add('on');
            state.shape = btn.dataset.shape;
            textCtrl.style.display = state.shape === 'text' ? '' : 'none';
            if (!state.playing) renderPreview();
        });
    });

    // ── Add keyframe ─────────────────────────
    addKfBtn.addEventListener('click', function() {
        // Find a gap to place the new keyframe
        sortKeyframes();
        var pcts = state.keyframes.map(function(k) { return k.pct; });
        var newPct = 50;
        // Try common stops first
        var stops = [50, 25, 75, 10, 30, 40, 60, 70, 80, 90];
        for (var i = 0; i < stops.length; i++) {
            if (pcts.indexOf(stops[i]) === -1) { newPct = stops[i]; break; }
        }
        // If all common stops taken, find any gap
        if (pcts.indexOf(newPct) !== -1) {
            for (var p = 1; p < 100; p++) {
                if (pcts.indexOf(p) === -1) { newPct = p; break; }
            }
        }

        var interp = interpolateAtPct(newPct);
        var kf = createKeyframe(newPct, interp);
        kf.pct = newPct;
        state.keyframes.push(kf);
        state.activeKfId = kf.id;
        render();
    });

    // ── Scrubber ─────────────────────────────
    scrubber.addEventListener('input', function() {
        if (state.playing) stopPlaying();
        playbackTime.textContent = Math.round(parseFloat(this.value)) + '%';
        renderPreview();
        renderTimeline();
    });

    // Style the scrubber thumb
    var scrubStyle = document.createElement('style');
    scrubStyle.textContent =
        '#scrubber::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#6366f1; border:2px solid #1a1a22; cursor:pointer; }' +
        '#scrubber::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#6366f1; border:2px solid #1a1a22; cursor:pointer; }';
    document.head.appendChild(scrubStyle);

    // ── Timeline click & drag ─────────────────
    function timelineScrubAt(e) {
        var rect = timelineArea.getBoundingClientRect();
        var pad = 30;
        var trackW = rect.width - pad * 2;
        var x = e.clientX - rect.left;
        var pct = clamp(((x - pad) / trackW) * 100, 0, 100);

        // Check if clicking near an existing keyframe diamond
        var hitKf = null;
        state.keyframes.forEach(function(kf) {
            var kx = pad + (kf.pct / 100) * trackW;
            if (Math.abs(x - kx) < 10) hitKf = kf;
        });

        if (hitKf) {
            state.activeKfId = hitKf.id;
            scrubber.value = hitKf.pct;
            playbackTime.textContent = Math.round(hitKf.pct) + '%';
        } else {
            scrubber.value = Math.round(pct);
            playbackTime.textContent = Math.round(pct) + '%';
        }

        if (state.playing) stopPlaying();
        renderPreview();
        renderTimeline();
        renderKfList();
        renderKfEditor();
    }

    timelineArea.addEventListener('mousedown', function(e) {
        timelineScrubAt(e);
        function onMove(ev) { timelineScrubAt(ev); }
        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    // ── Playback ─────────────────────────────
    var animFrameId = null;

    function startPlaying() {
        state.playing = true;
        playBtn.innerHTML = '&#9646;&#9646;';
        state.playOffset = parseFloat(scrubber.value) || 0;
        state.playStart = performance.now();

        // Build and inject the CSS animation
        var css = generateKeyframesCSS();
        var name = animName.value.trim() || 'myAnimation';
        var dur = parseFloat(animDurationNum.value) || 1;
        var easing = getEasingCSS();
        var iter = animIterations.value;
        var dir = animDirection.value;
        var fill = animFillMode.value;

        css += '\n#previewEl {';
        css += ' animation: ' + name + ' ' + dur + 's ' + easing + ' ' + iter + ' ' + dir + ' ' + fill + ' running;';
        css += '}';
        styleEl.textContent = css;

        applyShapeStyle();
        previewEl.style.transform = '';
        previewEl.style.opacity = '';
        previewEl.style.backgroundColor = '';
        previewEl.style.boxShadow = '';
        // Don't reset borderRadius here since shape may need it (circle = 50%)
        if (state.shape !== 'circle') {
            previewEl.style.borderRadius = '';
        }

        // Animate scrubber
        animFrameId = requestAnimationFrame(animateScrubber);
    }

    function stopPlaying() {
        state.playing = false;
        playBtn.innerHTML = '&#9654;';
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = null;
        styleEl.textContent = '';
        renderPreview();
    }

    function animateScrubber() {
        if (!state.playing) return;
        var dur = (parseFloat(animDurationNum.value) || 1) * 1000;
        var elapsed = performance.now() - state.playStart;
        var pct = (elapsed % dur) / dur * 100;

        var dir = animDirection.value;
        if (dir === 'reverse') {
            pct = 100 - pct;
        } else if (dir === 'alternate' || dir === 'alternate-reverse') {
            var cycle = Math.floor(elapsed / dur);
            var isReverse = dir === 'alternate' ? (cycle % 2 === 1) : (cycle % 2 === 0);
            if (isReverse) pct = 100 - pct;
        }

        scrubber.value = pct;
        playbackTime.textContent = Math.round(pct) + '%';
        renderTimeline();

        var iter = animIterations.value;
        if (iter !== 'infinite' && elapsed >= dur * parseInt(iter)) {
            stopPlaying();
            scrubber.value = 100;
            playbackTime.textContent = '100%';
            renderPreview();
            renderTimeline();
            return;
        }

        animFrameId = requestAnimationFrame(animateScrubber);
    }

    playBtn.addEventListener('click', function() {
        if (state.playing) {
            stopPlaying();
        } else {
            startPlaying();
        }
    });

    // ── Copy ──────────────────────────────────
    copyBtn.addEventListener('click', function() {
        var css = generateFullCSS();
        navigator.clipboard.writeText(css).then(function() {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
                copyBtn.textContent = 'Copy';
                copyBtn.classList.remove('copied');
            }, 1500);
        });
    });

    // ── Presets ────────────────────────────────
    var PRESETS = [
        {
            name: 'Fade In',
            keyframes: [
                { pct: 0, opacity: 0 },
                { pct: 100, opacity: 100 }
            ]
        },
        {
            name: 'Slide Right',
            keyframes: [
                { pct: 0, translateX: -200 },
                { pct: 100, translateX: 0 }
            ]
        },
        {
            name: 'Bounce',
            keyframes: [
                { pct: 0, translateY: 0 },
                { pct: 25, translateY: -80 },
                { pct: 50, translateY: 0 },
                { pct: 75, translateY: -30 },
                { pct: 100, translateY: 0 }
            ],
            easing: 'ease-out'
        },
        {
            name: 'Spin',
            keyframes: [
                { pct: 0, rotate: 0 },
                { pct: 100, rotate: 360 }
            ],
            easing: 'linear',
            iterations: 'infinite'
        },
        {
            name: 'Pulse',
            keyframes: [
                { pct: 0, scale: 100 },
                { pct: 50, scale: 115 },
                { pct: 100, scale: 100 }
            ],
            iterations: 'infinite'
        },
        {
            name: 'Shake',
            keyframes: [
                { pct: 0, translateX: 0 },
                { pct: 10, translateX: -10 },
                { pct: 20, translateX: 10 },
                { pct: 30, translateX: -10 },
                { pct: 40, translateX: 10 },
                { pct: 50, translateX: -5 },
                { pct: 60, translateX: 5 },
                { pct: 70, translateX: -2 },
                { pct: 80, translateX: 2 },
                { pct: 100, translateX: 0 }
            ],
            duration: 0.5
        },
        {
            name: 'Flip',
            keyframes: [
                { pct: 0, rotate: 0, scale: 100 },
                { pct: 40, rotate: -10, scale: 110 },
                { pct: 100, rotate: 360, scale: 100 }
            ],
            duration: 0.8
        },
        {
            name: 'Glow',
            keyframes: [
                { pct: 0, boxShadow: '0 0 5px rgba(99,102,241,0.3)' },
                { pct: 50, boxShadow: '0 0 30px rgba(99,102,241,0.8)' },
                { pct: 100, boxShadow: '0 0 5px rgba(99,102,241,0.3)' }
            ],
            iterations: 'infinite'
        },
        {
            name: 'Morph',
            keyframes: [
                { pct: 0, borderRadius: 8 },
                { pct: 50, borderRadius: 50 },
                { pct: 100, borderRadius: 8 }
            ],
            iterations: 'infinite',
            direction: 'alternate'
        },
        {
            name: 'Swing',
            keyframes: [
                { pct: 0, rotate: 0 },
                { pct: 20, rotate: 15 },
                { pct: 40, rotate: -10 },
                { pct: 60, rotate: 5 },
                { pct: 80, rotate: -5 },
                { pct: 100, rotate: 0 }
            ]
        },
        {
            name: 'Zoom In',
            keyframes: [
                { pct: 0, scale: 0, opacity: 0 },
                { pct: 100, scale: 100, opacity: 100 }
            ]
        },
        {
            name: 'Float',
            keyframes: [
                { pct: 0, translateY: 0 },
                { pct: 50, translateY: -20 },
                { pct: 100, translateY: 0 }
            ],
            easing: 'ease-in-out',
            iterations: 'infinite'
        }
    ];

    var presetsGrid = document.getElementById('presetsGrid');
    PRESETS.forEach(function(preset) {
        var btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = preset.name;
        btn.addEventListener('click', function() {
            if (state.playing) stopPlaying();
            state.keyframes = preset.keyframes.map(function(kfData) {
                return createKeyframe(kfData.pct, kfData);
            });
            state.activeKfId = state.keyframes[0].id;
            animEasing.value = preset.easing || 'ease';
            animIterations.value = preset.iterations || '1';
            animDirection.value = preset.direction || 'normal';
            animFillMode.value = preset.fillMode || 'forwards';
            var dur = preset.duration || 1;
            animDuration.value = dur;
            animDurationNum.value = dur;
            bezierRow.style.display = animEasing.value === 'cubic-bezier' ? '' : 'none';
            scrubber.value = 0;
            playbackTime.textContent = '0%';
            render();
        });
        presetsGrid.appendChild(btn);
    });

    // ── Resize handling ──────────────────────
    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() { renderTimeline(); }, 100);
    });

    // ── Keyboard shortcuts ───────────────────
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
            e.preventDefault();
            if (state.playing) stopPlaying(); else startPlaying();
        }
    });

    // ── Init ─────────────────────────────────
    render();

})();
</script>

<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
