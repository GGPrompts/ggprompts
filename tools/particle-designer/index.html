<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Designer - Visual Particle System Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;

  --bg: #0a0a0f;
  --bg-panel: rgba(12, 12, 20, 0.95);
  --bg-input: rgba(20, 20, 35, 0.8);
  --border: rgba(80, 80, 120, 0.3);
  --border-focus: rgba(255, 140, 50, 0.6);
  --accent: #ff8c32;
  --accent-dim: rgba(255, 140, 50, 0.3);
  --accent2: #32ccff;
  --accent2-dim: rgba(50, 204, 255, 0.2);
  --text: #c8c8d8;
  --text-dim: #707088;
  --text-bright: #eeeef8;
  --success: #50e080;
  --danger: #ff4060;

  --panel-w: 300px;
  --header-h: 48px;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
}

/* Layout */
#app {
  display: grid;
  grid-template-columns: var(--panel-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
  width: 100vw;
}

/* Header */
#header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  z-index: 10;
}

#header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  white-space: nowrap;
}

.header-sep {
  width: 1px;
  height: 24px;
  background: var(--border);
}

.header-actions {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

/* Buttons */
.btn {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-input);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--text-bright); }
.btn-accent {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}
.btn-accent:hover { background: var(--accent); color: #000; }
.btn-sm { padding: 3px 8px; font-size: 12px; }

/* Preset bar */
#preset-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  flex: 1;
  padding: 0 4px;
}
#preset-bar::-webkit-scrollbar { height: 3px; }
#preset-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.preset-chip {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.preset-chip:hover { border-color: var(--accent); color: var(--text); }
.preset-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* Panel */
#panel {
  grid-row: 2;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#panel::-webkit-scrollbar { width: 5px; }
#panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Sections */
.section {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  padding: 7px 10px;
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.5px;
}

.section-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
  color: var(--text-dim);
}

.section.collapsed .section-body { display: none; }
.section.collapsed .arrow { transform: rotate(-90deg); }

.section-body {
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* Form controls */
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctrl-row label {
  font-size: 12px;
  color: var(--text);
  min-width: 70px;
  flex-shrink: 0;
}

.ctrl-row input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--bg-input);
  border-radius: 2px;
  outline: none;
}
.ctrl-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
}

.ctrl-row input[type="number"] {
  width: 52px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 4px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  text-align: right;
}
.ctrl-row input[type="number"]:focus { border-color: var(--border-focus); outline: none; }

.ctrl-row input[type="color"] {
  width: 28px;
  height: 22px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: none;
  cursor: pointer;
  padding: 1px;
}

.ctrl-row select {
  flex: 1;
  font-family: var(--font-display);
  font-size: 12px;
  padding: 3px 6px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
}
.ctrl-row select:focus { border-color: var(--border-focus); outline: none; }

.ctrl-row .val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  min-width: 36px;
  text-align: right;
}

/* Gradient editor */
.gradient-bar {
  position: relative;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: crosshair;
  margin-top: 2px;
}

.gradient-stop {
  position: absolute;
  top: -3px;
  width: 10px;
  height: 28px;
  border: 2px solid #fff;
  border-radius: 3px;
  cursor: grab;
  transform: translateX(-5px);
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}
.gradient-stop.active { border-color: var(--accent); z-index: 1; }
.gradient-stop-info {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-top: 4px;
}

/* Checkbox toggle */
.toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.toggle-row label {
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
}
.toggle {
  position: relative;
  width: 32px;
  height: 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle.on { background: var(--accent-dim); border-color: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: all 0.2s;
}
.toggle.on::after { left: 18px; background: var(--accent); }

/* Canvas area */
#canvas-wrap {
  grid-row: 2;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

#canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* Stats overlay */
#stats {
  position: absolute;
  top: 8px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.5);
  padding: 4px 8px;
  border-radius: 4px;
  pointer-events: none;
  line-height: 1.5;
}

/* Emitter crosshair */
#crosshair-info {
  position: absolute;
  bottom: 8px;
  left: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.5);
  padding: 4px 8px;
  border-radius: 4px;
  pointer-events: none;
}

/* Modal (import) */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  width: 480px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal h2 {
  font-size: 16px;
  color: var(--accent);
}
.modal textarea {
  width: 100%;
  height: 200px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 8px;
  resize: vertical;
}
.modal textarea:focus { border-color: var(--border-focus); outline: none; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Blend Presets */
#blend-panel {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
#blend-panel .section-header {
  display: flex;
  align-items: center;
  padding: 7px 10px;
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.5px;
}
#blend-panel .section-header .arrow {
  font-size: 10px;
  transition: transform 0.2s;
  color: var(--text-dim);
}
#blend-panel.collapsed .blend-body { display: none; }
#blend-panel.collapsed .arrow { transform: rotate(-90deg); }
.blend-body {
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.blend-body select {
  flex: 1;
  font-family: var(--font-display);
  font-size: 12px;
  padding: 3px 6px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
}
.blend-body select:focus { border-color: var(--border-focus); outline: none; }
.blend-slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.blend-slider-row label {
  font-size: 12px;
  color: var(--text);
  min-width: 40px;
  flex-shrink: 0;
}
.blend-slider-row input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--bg-input);
  border-radius: 2px;
  outline: none;
}
.blend-slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent2);
  cursor: pointer;
  border: 2px solid var(--bg);
}
.blend-slider-row .val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent2);
  min-width: 36px;
  text-align: right;
}

/* Fullscreen screensaver mode */
#app.screensaver #header,
#app.screensaver #panel {
  display: none;
}
#app.screensaver {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}
#app.screensaver #canvas-wrap {
  grid-column: 1;
  grid-row: 1;
  cursor: none;
}
#app.screensaver #stats { display: none; }
#app.screensaver #crosshair-info { display: none; }

#screensaver-hint {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  z-index: 50;
  pointer-events: none;
  transition: opacity 0.5s;
}
#app.screensaver ~ #screensaver-hint { display: block; }

/* Responsive */
@media (max-width: 768px) {
  :root { --panel-w: 100vw; --header-h: 40px; }
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: var(--header-h) auto 1fr;
  }
  #panel {
    grid-row: 2;
    max-height: 45vh;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  #canvas-wrap { grid-row: 3; }
  #header h1 { font-size: 14px; }
  .preset-chip { font-size: 11px; padding: 3px 8px; }
}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>PARTICLE DESIGNER</h1>
    <div class="header-sep"></div>
    <div id="preset-bar"></div>
    <div class="header-sep"></div>
    <div class="header-actions">
      <button class="btn btn-sm" id="btn-randomize" title="Randomize settings (R)">Randomize</button>
      <button class="btn btn-sm" id="btn-fullscreen" title="Fullscreen screensaver (F)">Fullscreen</button>
      <div class="header-sep"></div>
      <button class="btn btn-sm" id="btn-import" title="Import JSON">Import</button>
      <button class="btn btn-sm btn-accent" id="btn-export" title="Export JSON">Export</button>
    </div>
  </div>

  <div id="panel"></div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="stats"></div>
    <div id="crosshair-info">Click canvas to move emitter</div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h2>Import Particle Settings</h2>
    <textarea id="import-text" placeholder="Paste JSON here..."></textarea>
    <div class="modal-actions">
      <button class="btn" id="import-cancel">Cancel</button>
      <button class="btn btn-accent" id="import-apply">Apply</button>
    </div>
  </div>
</div>

<div id="screensaver-hint">ESC or click to exit &bull; Space to pause</div>

<script>
// ===== PARTICLE SYSTEM ENGINE =====

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const crosshairEl = document.getElementById('crosshair-info');

let W = 0, H = 0;
let particles = [];
let emitAccum = 0;
let lastTime = 0;
let paused = false;
let frameCount = 0;
let fpsSmooth = 60;

// Default settings
const defaults = {
  emitter: {
    x: 0.5,
    y: 0.6,
    rate: 120,
    burst: false,
    burstCount: 50,
    burstInterval: 1.0,
    angle: -90,
    spread: 30,
    emitterRadius: 0
  },
  particle: {
    lifetimeMin: 0.8,
    lifetimeMax: 2.0,
    speedMin: 80,
    speedMax: 200,
    gravity: 100,
    wind: 0,
    drag: 0.98,
    rotationSpeed: 0
  },
  visual: {
    colorStops: [
      { pos: 0, color: '#ff6600' },
      { pos: 0.5, color: '#ff2200' },
      { pos: 1, color: '#220000' }
    ],
    sizeStart: 8,
    sizeEnd: 1,
    sizeCurve: 1.0,
    opacityStart: 1.0,
    opacityEnd: 0.0,
    opacityCurve: 1.5,
    blendMode: 'lighter',
    shape: 'circle'
  }
};

let settings = JSON.parse(JSON.stringify(defaults));
let burstTimer = 0;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const r = wrap.getBoundingClientRect();
  W = canvas.width = Math.floor(r.width * devicePixelRatio);
  H = canvas.height = Math.floor(r.height * devicePixelRatio);
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
}

function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function deg2rad(d) { return d * Math.PI / 180; }

function sampleGradient(stops, t) {
  if (stops.length === 0) return { r: 255, g: 255, b: 255 };
  if (stops.length === 1) return hexToRgb(stops[0].color);
  t = Math.max(0, Math.min(1, t));
  let i = 0;
  while (i < stops.length - 1 && stops[i + 1].pos <= t) i++;
  if (i >= stops.length - 1) return hexToRgb(stops[stops.length - 1].color);
  const a = stops[i], b = stops[i + 1];
  const f = (t - a.pos) / (b.pos - a.pos || 1);
  const ca = hexToRgb(a.color), cb = hexToRgb(b.color);
  return {
    r: Math.round(lerp(ca.r, cb.r, f)),
    g: Math.round(lerp(ca.g, cb.g, f)),
    b: Math.round(lerp(ca.b, cb.b, f))
  };
}

function hexToRgb(hex) {
  const v = parseInt(hex.replace('#', ''), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

function rgbToHex(r, g, b) {
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function spawnParticle() {
  const e = settings.emitter;
  const p = settings.particle;
  const ex = e.x * W;
  const ey = e.y * H;

  const angleRad = deg2rad(e.angle + rand(-e.spread, e.spread));
  const speed = rand(p.speedMin, p.speedMax);

  // Offset within emitter radius
  const rAngle = Math.random() * Math.PI * 2;
  const rDist = Math.random() * e.emitterRadius * (W / 800);

  return {
    x: ex + Math.cos(rAngle) * rDist,
    y: ey + Math.sin(rAngle) * rDist,
    vx: Math.cos(angleRad) * speed,
    vy: Math.sin(angleRad) * speed,
    life: rand(p.lifetimeMin, p.lifetimeMax),
    age: 0,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * p.rotationSpeed
  };
}

function emitParticles(dt) {
  const e = settings.emitter;
  if (e.burst) {
    burstTimer += dt;
    if (burstTimer >= e.burstInterval) {
      burstTimer -= e.burstInterval;
      for (let i = 0; i < e.burstCount; i++) {
        particles.push(spawnParticle());
      }
    }
  } else {
    emitAccum += e.rate * dt;
    while (emitAccum >= 1) {
      emitAccum -= 1;
      particles.push(spawnParticle());
    }
  }
}

function updateParticles(dt) {
  const p = settings.particle;
  const grav = p.gravity * (H / 600);
  const wind = p.wind * (W / 800);
  const dragFactor = Math.pow(p.drag, dt * 60);
  let alive = 0;
  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    pt.age += dt;
    if (pt.age >= pt.life) continue;
    pt.vy += grav * dt;
    pt.vx += wind * dt;
    pt.vx *= dragFactor;
    pt.vy *= dragFactor;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.rotation += pt.rotSpeed * dt;
    if (alive !== i) particles[alive] = pt;
    alive++;
  }
  particles.length = alive;
}

function drawParticles() {
  const v = settings.visual;
  const blendMap = { lighter: 'lighter', normal: 'source-over', screen: 'screen', multiply: 'multiply' };
  ctx.globalCompositeOperation = blendMap[v.blendMode] || 'source-over';

  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    const t = pt.age / pt.life;
    const col = sampleGradient(v.colorStops, t);
    const size = lerp(v.sizeStart, v.sizeEnd, Math.pow(t, v.sizeCurve)) * (W / 800);
    const alpha = lerp(v.opacityStart, v.opacityEnd, Math.pow(t, v.opacityCurve));

    if (size <= 0 || alpha <= 0) continue;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgb(${col.r},${col.g},${col.b})`;

    if (v.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
      ctx.fill();
    } else if (v.shape === 'square') {
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rotation);
      ctx.fillRect(-size, -size, size * 2, size * 2);
      ctx.restore();
    } else if (v.shape === 'star') {
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rotation);
      drawStar(ctx, 0, 0, 5, size, size * 0.4);
      ctx.fill();
      ctx.restore();
    } else if (v.shape === 'line') {
      ctx.save();
      ctx.translate(pt.x, pt.y);
      const angle = Math.atan2(pt.vy, pt.vx);
      ctx.rotate(angle);
      ctx.fillRect(-size * 1.5, -size * 0.2, size * 3, size * 0.4);
      ctx.restore();
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.closePath();
}

function drawEmitterCrosshair() {
  if (screensaverMode) return;
  const ex = settings.emitter.x * W;
  const ey = settings.emitter.y * H;
  ctx.strokeStyle = 'rgba(255,140,50,0.4)';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(ex - 12, ey);
  ctx.lineTo(ex + 12, ey);
  ctx.moveTo(ex, ey - 12);
  ctx.lineTo(ex, ey + 12);
  ctx.stroke();

  // Direction indicator
  const aRad = deg2rad(settings.emitter.angle);
  const sRad = deg2rad(settings.emitter.spread);
  const len = 30;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + Math.cos(aRad - sRad) * len, ey + Math.sin(aRad - sRad) * len);
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + Math.cos(aRad + sRad) * len, ey + Math.sin(aRad + sRad) * len);
  ctx.strokeStyle = 'rgba(255,140,50,0.25)';
  ctx.stroke();

  // Emitter radius
  if (settings.emitter.emitterRadius > 0) {
    ctx.beginPath();
    ctx.arc(ex, ey, settings.emitter.emitterRadius * (W / 800), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,140,50,0.15)';
    ctx.stroke();
  }
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!lastTime) { lastTime = now; return; }
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  frameCount++;
  const instantFps = 1 / (dt || 1/60);
  fpsSmooth += (instantFps - fpsSmooth) * 0.1;

  if (!paused) {
    emitParticles(dt);
    updateParticles(dt);
  }

  ctx.clearRect(0, 0, W, H);
  drawParticles();
  drawEmitterCrosshair();

  if (frameCount % 6 === 0) {
    statsEl.textContent = `${particles.length} particles | ${Math.round(fpsSmooth)} fps`;
  }
}

// ===== CANVAS INTERACTION =====

let draggingEmitter = false;

canvas.addEventListener('pointerdown', (ev) => {
  if (screensaverMode) return;
  draggingEmitter = true;
  moveEmitter(ev);
  canvas.setPointerCapture(ev.pointerId);
});

canvas.addEventListener('pointermove', (ev) => {
  if (draggingEmitter) moveEmitter(ev);
});

canvas.addEventListener('pointerup', () => { draggingEmitter = false; });

function moveEmitter(ev) {
  const rect = canvas.getBoundingClientRect();
  settings.emitter.x = (ev.clientX - rect.left) / rect.width;
  settings.emitter.y = (ev.clientY - rect.top) / rect.height;
  crosshairEl.textContent = `Emitter: ${Math.round(settings.emitter.x * 100)}%, ${Math.round(settings.emitter.y * 100)}%`;
  updateSliderDisplay('emitterX');
  updateSliderDisplay('emitterY');
}

function makeSection(title, children) {
  const sec = document.createElement('div');
  sec.className = 'section';
  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `<span class="arrow">&#9660;</span>${title}`;

  const body = document.createElement('div');
  body.className = 'section-body';
  children.forEach(c => body.appendChild(c));
  sec.append(hdr, body);
  return sec;
}

function slider(id, label, min, max, value, step, onChange) {
  const row = document.createElement('div');
  row.className = 'ctrl-row';

  const lbl = document.createElement('label');
  lbl.textContent = label;

  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min;
  inp.max = max;
  inp.step = step;
  inp.value = value;

  const val = document.createElement('span');
  val.className = 'val';
  val.textContent = formatVal(value, step);

  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    val.textContent = formatVal(v, step);
    onChange(v);
    clearActivePreset();
  });

  sliderMap[id] = { input: inp, display: val, step };

  row.append(lbl, inp, val);
  return row;
}

function formatVal(v, step) {
  if (step >= 1) return Math.round(v).toString();
  const d = Math.max(0, -Math.floor(Math.log10(step)));
  return v.toFixed(d);
}

function updateSliderDisplay(id) {
  const s = sliderMap[id];
  if (!s) return;
  let v;
  if (id === 'emitterX') v = settings.emitter.x;
  else if (id === 'emitterY') v = settings.emitter.y;
  if (v !== undefined) {
    s.input.value = v;
    s.display.textContent = formatVal(v, s.step);
  }
}

function selectRow(id, label, options, value, onChange) {
  const row = document.createElement('div');
  row.className = 'ctrl-row';

  const lbl = document.createElement('label');
  lbl.textContent = label;

  const sel = document.createElement('select');
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o;
    if (o === value) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { onChange(sel.value); clearActivePreset(); });

  sliderMap[id] = { select: sel };

  row.append(lbl, sel);
  return row;
}

function toggleRow(id, label, value, onChange) {
  const row = document.createElement('div');
  row.className = 'toggle-row';

  const tog = document.createElement('div');
  tog.className = 'toggle' + (value ? ' on' : '');
  tog.onclick = () => {
    const on = !tog.classList.contains('on');
    tog.classList.toggle('on', on);
    onChange(on);
    clearActivePreset();
  };

  const lbl = document.createElement('label');
  lbl.textContent = label;
  lbl.onclick = () => tog.click();

  sliderMap[id] = { toggle: tog };

  row.append(tog, lbl);
  return row;
}

// ===== GRADIENT EDITOR =====

let activeStopIndex = 0;

function buildGradientEditor() {
  const wrap = document.createElement('div');
  wrap.id = 'gradient-editor';

  const bar = document.createElement('div');
  bar.className = 'gradient-bar';
  bar.id = 'gradient-bar';

  const info = document.createElement('div');
  info.className = 'gradient-stop-info';
  info.id = 'gradient-stop-info';

  wrap.append(bar, info);

  setTimeout(() => renderGradient(), 0);

  bar.addEventListener('dblclick', (ev) => {
    const rect = bar.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    const col = sampleGradient(settings.visual.colorStops, pos);
    settings.visual.colorStops.push({ pos, color: rgbToHex(col.r, col.g, col.b) });
    settings.visual.colorStops.sort((a, b) => a.pos - b.pos);
    activeStopIndex = settings.visual.colorStops.findIndex(s => s.pos === pos);
    renderGradient();
    clearActivePreset();
  });

  return wrap;
}

function renderGradient() {
  const bar = document.getElementById('gradient-bar');
  const info = document.getElementById('gradient-stop-info');
  if (!bar || !info) return;

  const stops = settings.visual.colorStops;

  // Background gradient
  const gradStr = stops.map(s => `${s.color} ${s.pos * 100}%`).join(', ');
  bar.style.background = `linear-gradient(to right, ${gradStr})`;

  // Remove old stop handles
  bar.querySelectorAll('.gradient-stop').forEach(s => s.remove());

  stops.forEach((s, i) => {
    const handle = document.createElement('div');
    handle.className = 'gradient-stop' + (i === activeStopIndex ? ' active' : '');
    handle.style.left = (s.pos * 100) + '%';
    handle.style.background = s.color;

    handle.addEventListener('pointerdown', (ev) => {
      ev.stopPropagation();
      activeStopIndex = i;
      renderGradient();

      const rect = bar.getBoundingClientRect();
      const onMove = (me) => {
        const pos = Math.max(0, Math.min(1, (me.clientX - rect.left) / rect.width));
        stops[i].pos = Math.round(pos * 100) / 100;
        stops.sort((a, b) => a.pos - b.pos);
        activeStopIndex = stops.indexOf(s);
        renderGradient();
        clearActivePreset();
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });

    bar.appendChild(handle);
  });

  // Info row
  info.innerHTML = '';
  if (stops.length > 0 && activeStopIndex < stops.length) {
    const s = stops[activeStopIndex];

    const colorInp = document.createElement('input');
    colorInp.type = 'color';
    colorInp.value = s.color;
    colorInp.addEventListener('input', () => {
      s.color = colorInp.value;
      renderGradient();
      clearActivePreset();
    });

    const posLabel = document.createElement('span');
    posLabel.style.cssText = 'font-size:11px;color:var(--text-dim)';
    posLabel.textContent = `pos: ${Math.round(s.pos * 100)}%`;

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-sm';
    delBtn.textContent = 'Del';
    delBtn.style.marginLeft = 'auto';
    delBtn.disabled = stops.length <= 2;
    delBtn.onclick = () => {
      if (stops.length <= 2) return;
      stops.splice(activeStopIndex, 1);
      activeStopIndex = Math.min(activeStopIndex, stops.length - 1);
      renderGradient();
      clearActivePreset();
    };

    info.append(colorInp, posLabel, delBtn);
  }
}

  const p = presets[name];
  if (!p) return;
  settings = JSON.parse(JSON.stringify(p));
  activePreset = name;
  particles = [];
  emitAccum = 0;
  burstTimer = 0;
  buildPanel();
  buildPresets();
}

  if (!activePreset) return;
  activePreset = null;

}

        <label>Mix</label>

    </div>
  `;

  sec.querySelector('.section-header').addEventListener('click', () => sec.classList.toggle('collapsed'));

  // Default select B to second preset
  const selB = sec.querySelector('#blendB');
  if (presetNames.length > 1) selB.value = presetNames[1];

  panel.insertBefore(sec, panel.firstChild);

  const slider = sec.querySelector('#blendSlider');
  const valEl = sec.querySelector('#blendVal');

    valEl.textContent = slider.value + '%';
  });

    const a = presets[sec.querySelector('#blendA').value];
    const b = presets[sec.querySelector('#blendB').value];

}

function blendSettings(a, b, t) {
  const result = JSON.parse(JSON.stringify(a));

  // Lerp all numeric emitter params
  for (const key of Object.keys(a.emitter)) {
    if (typeof a.emitter[key] === 'number' && typeof b.emitter[key] === 'number') {
      result.emitter[key] = a.emitter[key] + (b.emitter[key] - a.emitter[key]) * t;
    }
  }
  // Lerp all numeric particle params
  for (const key of Object.keys(a.particle)) {
    if (typeof a.particle[key] === 'number' && typeof b.particle[key] === 'number') {
      result.particle[key] = a.particle[key] + (b.particle[key] - a.particle[key]) * t;
    }
  }
  // Lerp numeric visual params
  for (const key of ['sizeStart', 'sizeEnd', 'sizeCurve', 'opacityStart', 'opacityEnd', 'opacityCurve']) {
    if (typeof a.visual[key] === 'number' && typeof b.visual[key] === 'number') {
      result.visual[key] = a.visual[key] + (b.visual[key] - a.visual[key]) * t;
    }
  }
  // Use A's non-numeric values when t < 0.5, B's when t >= 0.5
  result.emitter.burst = t < 0.5 ? a.emitter.burst : b.emitter.burst;
  result.visual.blendMode = t < 0.5 ? a.visual.blendMode : b.visual.blendMode;
  result.visual.shape = t < 0.5 ? a.visual.shape : b.visual.shape;

  // Blend color stops: sample both gradients at uniform positions
  const numStops = Math.max(a.visual.colorStops.length, b.visual.colorStops.length);
  const blendedStops = [];
  for (let i = 0; i < numStops; i++) {
    const pos = numStops === 1 ? 0 : i / (numStops - 1);
    const colA = sampleGradient(a.visual.colorStops, pos);
    const colB = sampleGradient(b.visual.colorStops, pos);
    blendedStops.push({
      pos,
      color: rgbToHex(
        Math.round(colA.r + (colB.r - colA.r) * t),
        Math.round(colA.g + (colB.g - colA.g) * t),
        Math.round(colA.b + (colB.b - colA.b) * t)
      )
    });
  }
  result.visual.colorStops = blendedStops;

  return result;
}

// ===== IMPORT / EXPORT =====

document.getElementById('btn-export').addEventListener('click', () => {
  const json = JSON.stringify(settings, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'particle-settings.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-modal').classList.add('show');
  document.getElementById('import-text').value = '';
  document.getElementById('import-text').focus();
});

document.getElementById('import-cancel').addEventListener('click', () => {
  document.getElementById('import-modal').classList.remove('show');
});

document.getElementById('import-apply').addEventListener('click', () => {
  const text = document.getElementById('import-text').value.trim();
  try {
    const data = JSON.parse(text);
    if (data.emitter && data.particle && data.visual) {
      // Deep-merge with defaults so partial imports don't leave missing keys
      const base = JSON.parse(JSON.stringify(defaults));
      Object.assign(base.emitter, data.emitter);
      Object.assign(base.particle, data.particle);
      Object.assign(base.visual, data.visual);
      if (Array.isArray(data.visual.colorStops)) base.visual.colorStops = data.visual.colorStops;
      settings = base;
      particles = [];
      emitAccum = 0;
      burstTimer = 0;
      clearActivePreset();
      buildPanel();
      document.getElementById('import-modal').classList.remove('show');
    } else {
      alert('Invalid format: missing emitter, particle, or visual keys.');
    }
  } catch (e) {
    alert('Invalid JSON: ' + e.message);
  }
});

// Close modal on overlay click
document.getElementById('import-modal').addEventListener('click', (ev) => {
  if (ev.target === ev.currentTarget) {
    document.getElementById('import-modal').classList.remove('show');
  }
});

// ===== RANDOMIZE =====

const palettes = [
  // warm: fire/lava
  ['#ffffff', '#ffee66', '#ff8800', '#cc2200', '#220000'],
  // cool: ice/water
  ['#ffffff', '#aaeeff', '#4488ff', '#2244aa', '#001133'],
  // neon: cyberpunk
  ['#ff00ff', '#ff44aa', '#8844ff', '#4400cc', '#110022'],
  // nature: green/gold
  ['#ffffaa', '#88ff44', '#22aa44', '#006633', '#001a0a'],
  // sunset
  ['#ffee88', '#ff8844', '#ff3366', '#881166', '#220022'],
  // electric: cyan/white
  ['#ffffff', '#88ffff', '#00ccff', '#0066cc', '#001133'],
  // blood moon
  ['#ffddaa', '#ff6644', '#cc1122', '#440011', '#0a0000'],
  // galaxy
  ['#eeddff', '#aa66ff', '#6622cc', '#220066', '#080016'],
  // toxic
  ['#eeff44', '#88ff00', '#44aa00', '#226600', '#0a1a00'],
  // rose gold
  ['#ffffff', '#ffcccc', '#ff8899', '#cc4466', '#331122'],
];

function randomizeSettings() {
  const pal = palettes[Math.floor(Math.random() * palettes.length)];
  const useBurst = Math.random() < 0.3;
  const shapes = ['circle', 'square', 'star', 'line'];
  const blends = ['lighter', 'normal', 'screen'];
  const shape = shapes[Math.floor(Math.random() * shapes.length)];
  const blend = blends[Math.floor(Math.random() * blends.length)];

  // Randomize with coherent ranges
  const gravDir = Math.random() < 0.4 ? -1 : 1;
  const speedScale = 50 + Math.random() * 450;
  const lifeBase = 0.3 + Math.random() * 3;

  // Pick 2-5 color stops from the palette
  const stopCount = 2 + Math.floor(Math.random() * (pal.length - 1));
  const colorStops = [];
  for (let i = 0; i < stopCount; i++) {
    colorStops.push({
      pos: i / (stopCount - 1),
      color: pal[Math.floor(i / (stopCount - 1) * (pal.length - 1))]
    });
  }

  settings = {
    emitter: {
      x: 0.2 + Math.random() * 0.6,
      y: 0.2 + Math.random() * 0.6,
      rate: useBurst ? 0 : 30 + Math.floor(Math.random() * 270),
      burst: useBurst,
      burstCount: 30 + Math.floor(Math.random() * 170),
      burstInterval: 0.5 + Math.random() * 2.5,
      angle: -180 + Math.floor(Math.random() * 360),
      spread: 5 + Math.floor(Math.random() * 175),
      emitterRadius: Math.floor(Math.random() * 120)
    },
    particle: {
      lifetimeMin: Math.round(lifeBase * 10) / 10,
      lifetimeMax: Math.round((lifeBase + 0.5 + Math.random() * 2) * 10) / 10,
      speedMin: Math.floor(speedScale * 0.3),
      speedMax: Math.floor(speedScale),
      gravity: gravDir * Math.floor(Math.random() * 350),
      wind: Math.floor((Math.random() - 0.5) * 100),
      drag: Math.round((0.93 + Math.random() * 0.07) * 1000) / 1000,
      rotationSpeed: Math.round(Math.random() * 6 * 10) / 10
    },
    visual: {
      colorStops,
      sizeStart: 2 + Math.round(Math.random() * 30),
      sizeEnd: Math.round(Math.random() * 10),
      sizeCurve: Math.round((0.3 + Math.random() * 2) * 10) / 10,
      opacityStart: 0.6 + Math.random() * 0.4,
      opacityEnd: 0,
      opacityCurve: Math.round((0.5 + Math.random() * 2) * 10) / 10,
      blendMode: blend,
      shape: shape
    }
  };

  particles = [];
  emitAccum = 0;
  burstTimer = 0;
  clearActivePreset();
  buildPanel();
}

document.getElementById('btn-randomize').addEventListener('click', randomizeSettings);

// ===== FULLSCREEN SCREENSAVER =====

let screensaverMode = false;
let screensaverInterval = null;
const SCREENSAVER_CYCLE = 8000; // ms between randomizations

function enterScreensaver() {
  screensaverMode = true;
  const app = document.getElementById('app');
  app.classList.add('screensaver');

  // Request browser fullscreen
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

  // Fade in hint, then fade out after 3s
  const hint = document.getElementById('screensaver-hint');
  hint.style.opacity = '1';
  setTimeout(() => { hint.style.opacity = '0'; }, 3000);

  // Initial randomize + resize
  randomizeSettings();
  setTimeout(resizeCanvas, 50);

  // Auto-randomize with smooth transition
  screensaverInterval = setInterval(() => {
    // Fade: briefly clear particles then randomize
    randomizeSettings();
  }, SCREENSAVER_CYCLE);
}

function exitScreensaver() {
  if (!screensaverMode) return;
  screensaverMode = false;
  const app = document.getElementById('app');
  app.classList.remove('screensaver');

  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  if (screensaverInterval) {
    clearInterval(screensaverInterval);
    screensaverInterval = null;
  }

  setTimeout(resizeCanvas, 50);
}

document.getElementById('btn-fullscreen').addEventListener('click', enterScreensaver);

// Exit screensaver on fullscreen change (e.g. user presses Esc natively)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && screensaverMode) exitScreensaver();
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement && screensaverMode) exitScreensaver();
});

// Exit on click in screensaver mode
canvas.addEventListener('click', () => {
  if (screensaverMode) exitScreensaver();
});

// ===== KEYBOARD =====

document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'INPUT') return;

  if (ev.code === 'Escape' && screensaverMode) {
    exitScreensaver();
    return;
  }
  if (ev.code === 'Space') {
    ev.preventDefault();
    paused = !paused;
  }
  if (ev.code === 'KeyC') {
    particles = [];
  }
  if (ev.code === 'KeyR') {
    randomizeSettings();
  }
  if (ev.code === 'KeyF') {
    if (screensaverMode) exitScreensaver();
    else enterScreensaver();
  }
});

// ===== INIT =====

function init() {
  resizeCanvas();
  buildPresets();
  applyPreset('fire');
  buildBlendPanel();
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resizeCanvas);
init();
