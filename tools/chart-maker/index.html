<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #f8f9fb;
            --bg-panel: #ffffff;
            --bg-hover: #f0f2f5;
            --bg-input: #f5f6f8;
            --border: #e2e5ea;
            --border-focus: #7c8db5;
            --text: #1a1d23;
            --text-secondary: #5a6270;
            --text-muted: #8d95a3;
            --accent: #4f6df5;
            --accent-hover: #3b57d9;
            --accent-light: #eef1fe;
            --danger: #e5484d;
            --success: #30a46c;
            --warning: #f5a623;

            --radius: 8px;
            --radius-sm: 4px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --transition: 150ms ease;

            /* Chart palette */
            --c1: #4f6df5;
            --c2: #f59e42;
            --c3: #30a46c;
            --c4: #e5484d;
            --c5: #9b59b6;
            --c6: #1abc9c;
            --c7: #e67e22;
            --c8: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-back {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-back:hover { color: var(--text); }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ── Buttons ────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-panel);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-focus); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-icon { padding: 6px 8px; }

        /* ── Layout ─────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 1fr;
            min-height: calc(100vh - 49px);
        }

        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .main {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow: auto;
        }

        /* ── Tabs ───────────────────────────────────────── */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .tab {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font-sans);
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ── Chart Type Selector ────────────────────────── */
        .chart-type-bar {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .chart-type-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg);
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }
        .chart-type-btn:hover { border-color: var(--accent); color: var(--accent); }
        .chart-type-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── Sidebar Sections ───────────────────────────── */
        .section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .field {
            margin-bottom: 10px;
        }
        .field:last-child { margin-bottom: 0; }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .field input[type="text"],
        .field input[type="number"],
        .field select,
        .field textarea {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13px;
            transition: border-color var(--transition);
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .field input[type="color"] {
            width: 32px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 2px;
            cursor: pointer;
            background: var(--bg-input);
        }

        .field-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .field-row > .field { flex: 1; margin-bottom: 0; }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .checkbox-field input[type="checkbox"] {
            accent-color: var(--accent);
        }
        .checkbox-field label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 0;
            cursor: pointer;
        }

        /* ── Data Table ─────────────────────────────────── */
        .data-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .data-panel.active { display: flex; }

        .data-actions {
            display: flex;
            gap: 6px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .table-wrap {
            flex: 1;
            overflow: auto;
            padding: 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th,
        .data-table td {
            padding: 6px 10px;
            border: 1px solid var(--border);
            text-align: left;
            min-width: 80px;
        }
        .data-table th {
            background: var(--bg-hover);
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .data-table td {
            background: var(--bg-panel);
        }
        .data-table td:focus-within {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }
        .data-table input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            padding: 2px 0;
        }
        .data-table input:focus { outline: none; }

        .data-table .header-input {
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 12px;
        }

        .series-color {
            width: 18px;
            height: 18px;
            border: 1px solid var(--border);
            border-radius: 3px;
            cursor: pointer;
            padding: 0;
            vertical-align: middle;
        }

        .row-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .row-delete:hover { color: var(--danger); background: #fef2f2; }

        /* ── Style Panel ────────────────────────────────── */
        .style-panel {
            display: none;
            flex-direction: column;
            overflow-y: auto;
            flex: 1;
        }
        .style-panel.active { display: flex; }

        /* ── Chart Area ─────────────────────────────────── */
        .chart-container {
            flex: 1;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 400px;
            overflow: hidden;
        }

        #chartCanvas {
            max-width: 100%;
            max-height: 100%;
        }

        .chart-container svg {
            max-width: 100%;
            max-height: 100%;
        }

        .render-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            background: var(--bg);
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* ── CSV Paste Modal ────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            width: 90%;
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .modal textarea {
            width: 100%;
            height: 200px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            background: var(--bg-input);
            resize: vertical;
        }
        .modal textarea:focus { outline: none; border-color: var(--accent); }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal .hint {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 50vh;
            }
        }

        @media (max-width: 600px) {
            .header { padding: 10px 14px; }
            .main { padding: 12px; }
            .chart-type-bar { padding: 10px 12px; }
            .section { padding: 12px; }
            .chart-container { min-height: 300px; }
        }
    </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────── -->
<div class="header">
    <a href="../index.html" class="header-back">&larr; Tools</a>
    <span class="header-title">Chart Maker</span>
    <div class="header-actions">
        <button class="btn btn-sm" id="btnExportPNG" title="Export as PNG">Export PNG</button>
        <button class="btn btn-sm" id="btnToggleRender">SVG Mode</button>
    </div>
</div>

<!-- ── Chart Type Selector ───────────────────────────── -->
<div class="chart-type-bar">
    <button class="chart-type-btn active" data-type="bar">Bar</button>
    <button class="chart-type-btn" data-type="line">Line</button>
    <button class="chart-type-btn" data-type="area">Area</button>
    <button class="chart-type-btn" data-type="pie">Pie</button>
    <button class="chart-type-btn" data-type="scatter">Scatter</button>
</div>

<!-- ── Main Layout ───────────────────────────────────── -->
<div class="app">
    <div class="sidebar">
        <!-- Sidebar tabs -->
        <div class="tab-bar">
            <button class="tab active" data-panel="data">Data</button>
            <button class="tab" data-panel="style">Style</button>
        </div>

        <!-- Data Panel -->
        <div class="data-panel active" id="panelData">
            <div class="data-actions">
                <button class="btn btn-sm" id="btnPasteCSV">Paste CSV</button>
                <button class="btn btn-sm" id="btnAddRow">+ Row</button>
                <button class="btn btn-sm" id="btnAddSeries">+ Series</button>
                <button class="btn btn-sm" id="btnClearData">Clear</button>
            </div>
            <div class="table-wrap">
                <table class="data-table" id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Style Panel -->
        <div class="style-panel" id="panelStyle">
            <div class="section">
                <div class="section-title">Title &amp; Labels</div>
                <div class="field">
                    <label>Chart Title</label>
                    <input type="text" id="optTitle" placeholder="My Chart">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>X-Axis Label</label>
                        <input type="text" id="optXLabel" placeholder="X Axis">
                    </div>
                    <div class="field">
                        <label>Y-Axis Label</label>
                        <input type="text" id="optYLabel" placeholder="Y Axis">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Appearance</div>
                <div class="field-row">
                    <div class="field">
                        <label>Background</label>
                        <input type="color" id="optBgColor" value="#ffffff">
                    </div>
                    <div class="field">
                        <label>Text Color</label>
                        <input type="color" id="optTextColor" value="#1a1d23">
                    </div>
                    <div class="field">
                        <label>Grid Color</label>
                        <input type="color" id="optGridColor" value="#e2e5ea">
                    </div>
                </div>
                <div class="field">
                    <label>Font Size</label>
                    <input type="number" id="optFontSize" value="12" min="8" max="24">
                </div>
            </div>

            <div class="section">
                <div class="section-title">Options</div>
                <div class="checkbox-field">
                    <input type="checkbox" id="optShowGrid" checked>
                    <label for="optShowGrid">Show grid lines</label>
                </div>
                <div class="checkbox-field">
                    <input type="checkbox" id="optShowLegend" checked>
                    <label for="optShowLegend">Show legend</label>
                </div>
                <div class="checkbox-field">
                    <input type="checkbox" id="optShowValues">
                    <label for="optShowValues">Show values on chart</label>
                </div>
                <div class="checkbox-field">
                    <input type="checkbox" id="optSmooth">
                    <label for="optSmooth">Smooth lines (line/area)</label>
                </div>
                <div class="field">
                    <label>Bar Width (%)</label>
                    <input type="number" id="optBarWidth" value="70" min="20" max="100">
                </div>
                <div class="field">
                    <label>Point Radius (scatter/line)</label>
                    <input type="number" id="optPointRadius" value="4" min="1" max="12">
                </div>
                <div class="field">
                    <label>Line Width</label>
                    <input type="number" id="optLineWidth" value="2" min="1" max="8">
                </div>
            </div>

            <div class="section" id="seriesColorsSection">
                <div class="section-title">Series Colors</div>
                <div id="seriesColorList"></div>
            </div>
        </div>
    </div>

    <!-- Chart Area -->
    <div class="main">
        <div class="chart-container" id="chartContainer">
            <canvas id="chartCanvas"></canvas>
            <div class="render-badge" id="renderBadge">Canvas</div>
        </div>
    </div>
</div>

<!-- ── CSV Paste Modal ───────────────────────────────── -->
<div class="modal-overlay" id="csvModal">
    <div class="modal">
        <h3>Paste CSV Data</h3>
        <p class="hint">
            Paste comma-separated or tab-separated data. The first row is treated as headers.
            The first column is labels; remaining columns are numeric series.
        </p>
        <textarea id="csvInput" placeholder="Label,Series A,Series B
Jan,10,20
Feb,15,25
Mar,12,30"></textarea>
        <div class="modal-actions">
            <button class="btn" id="btnCsvCancel">Cancel</button>
            <button class="btn btn-primary" id="btnCsvImport">Import</button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ── State ──────────────────────────────────────────
    const DEFAULT_COLORS = ['#4f6df5','#f59e42','#30a46c','#e5484d','#9b59b6','#1abc9c','#e67e22','#3498db'];

    let chartType = 'bar';
    let renderMode = 'canvas'; // 'canvas' or 'svg'
    let seriesHeaders = ['Series A', 'Series B'];
    let seriesColors = [DEFAULT_COLORS[0], DEFAULT_COLORS[1]];
    let labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
    let data = [
        [28, 45],
        [35, 52],
        [42, 38],
        [30, 60],
        [50, 44]
    ];

    // DOM refs
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('chartContainer');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const renderBadge = document.getElementById('renderBadge');

    // ── Sidebar Tab Switching ──────────────────────────
    document.querySelectorAll('.tab-bar .tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const panel = tab.dataset.panel;
            document.getElementById('panelData').classList.toggle('active', panel === 'data');
            document.getElementById('panelStyle').classList.toggle('active', panel === 'style');
            if (panel === 'style') updateSeriesColorList();
        });
    });

    // ── Chart Type Switching ───────────────────────────
    document.querySelectorAll('.chart-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            chartType = btn.dataset.type;
            render();
        });
    });

    // ── Render Mode Toggle ─────────────────────────────
    document.getElementById('btnToggleRender').addEventListener('click', () => {
        renderMode = renderMode === 'canvas' ? 'svg' : 'canvas';
        document.getElementById('btnToggleRender').textContent = renderMode === 'canvas' ? 'SVG Mode' : 'Canvas Mode';
        renderBadge.textContent = renderMode === 'canvas' ? 'Canvas' : 'SVG';
        render();
    });

    // ── Export PNG ─────────────────────────────────────
    document.getElementById('btnExportPNG').addEventListener('click', () => {
        // Always render to canvas for export
        const prevMode = renderMode;
        renderMode = 'canvas';
        render();
        renderMode = prevMode;

        const link = document.createElement('a');
        link.download = 'chart.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        if (prevMode === 'svg') render();
    });

    // ── CSV Modal ──────────────────────────────────────
    const csvModal = document.getElementById('csvModal');
    document.getElementById('btnPasteCSV').addEventListener('click', () => csvModal.classList.add('active'));
    document.getElementById('btnCsvCancel').addEventListener('click', () => csvModal.classList.remove('active'));
    csvModal.addEventListener('click', e => { if (e.target === csvModal) csvModal.classList.remove('active'); });

    document.getElementById('btnCsvImport').addEventListener('click', () => {
        const raw = document.getElementById('csvInput').value.trim();
        if (!raw) return;
        parseCSV(raw);
        csvModal.classList.remove('active');
        document.getElementById('csvInput').value = '';
        buildTable();
        render();
    });

    function parseCSV(text) {
        const sep = text.includes('\t') ? '\t' : ',';
        const rows = text.split('\n').map(r => r.split(sep).map(c => c.trim()));
        if (rows.length < 2) return;

        const headerRow = rows[0];
        seriesHeaders = headerRow.slice(1);
        seriesColors = seriesHeaders.map((_, i) => DEFAULT_COLORS[i % DEFAULT_COLORS.length]);
        labels = [];
        data = [];
        for (let r = 1; r < rows.length; r++) {
            if (!rows[r][0] && rows[r].length <= 1) continue;
            labels.push(rows[r][0] || '');
            const vals = [];
            for (let c = 1; c < seriesHeaders.length + 1; c++) {
                const v = parseFloat(rows[r][c]);
                vals.push(isNaN(v) ? 0 : v);
            }
            data.push(vals);
        }
    }

    // ── Data Table ─────────────────────────────────────
    function buildTable() {
        // Header
        let hhtml = '<tr><th style="min-width:40px">#</th><th>Label</th>';
        for (let s = 0; s < seriesHeaders.length; s++) {
            hhtml += `<th>
                <div style="display:flex;align-items:center;gap:6px">
                    <input type="color" class="series-color" value="${seriesColors[s]}" data-si="${s}">
                    <input class="header-input" value="${esc(seriesHeaders[s])}" data-si="${s}" style="flex:1">
                    ${seriesHeaders.length > 1 ? `<button class="row-delete" data-del-series="${s}" title="Remove series">&times;</button>` : ''}
                </div>
            </th>`;
        }
        hhtml += '<th style="width:30px"></th></tr>';
        tableHead.innerHTML = hhtml;

        // Body
        let bhtml = '';
        for (let r = 0; r < labels.length; r++) {
            bhtml += `<tr><td style="color:var(--text-muted);font-size:11px;text-align:center">${r + 1}</td>`;
            bhtml += `<td><input value="${esc(labels[r])}" data-r="${r}" data-c="-1"></td>`;
            for (let s = 0; s < seriesHeaders.length; s++) {
                const v = (data[r] && data[r][s] !== undefined) ? data[r][s] : '';
                bhtml += `<td><input type="text" inputmode="decimal" value="${v}" data-r="${r}" data-c="${s}"></td>`;
            }
            bhtml += `<td><button class="row-delete" data-del-row="${r}">&times;</button></td></tr>`;
        }
        tableBody.innerHTML = bhtml;

        // Bind events
        tableBody.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', () => {
                const r = parseInt(inp.dataset.r);
                const c = parseInt(inp.dataset.c);
                if (c === -1) {
                    labels[r] = inp.value;
                } else {
                    if (!data[r]) data[r] = [];
                    const v = parseFloat(inp.value);
                    data[r][c] = isNaN(v) ? 0 : v;
                }
                render();
            });
        });

        tableHead.querySelectorAll('.header-input').forEach(inp => {
            inp.addEventListener('input', () => {
                seriesHeaders[parseInt(inp.dataset.si)] = inp.value;
                render();
            });
        });

        tableHead.querySelectorAll('.series-color').forEach(inp => {
            inp.addEventListener('input', () => {
                seriesColors[parseInt(inp.dataset.si)] = inp.value;
                render();
            });
        });

        tableHead.querySelectorAll('[data-del-series]').forEach(btn => {
            btn.addEventListener('click', () => {
                const si = parseInt(btn.dataset.delSeries);
                seriesHeaders.splice(si, 1);
                seriesColors.splice(si, 1);
                data.forEach(row => row.splice(si, 1));
                buildTable();
                render();
            });
        });

        tableBody.querySelectorAll('[data-del-row]').forEach(btn => {
            btn.addEventListener('click', () => {
                const ri = parseInt(btn.dataset.delRow);
                labels.splice(ri, 1);
                data.splice(ri, 1);
                buildTable();
                render();
            });
        });
    }

    document.getElementById('btnAddRow').addEventListener('click', () => {
        labels.push('');
        data.push(new Array(seriesHeaders.length).fill(0));
        buildTable();
        // Focus the new label cell
        const inputs = tableBody.querySelectorAll('input[data-c="-1"]');
        if (inputs.length) inputs[inputs.length - 1].focus();
    });

    document.getElementById('btnAddSeries').addEventListener('click', () => {
        seriesHeaders.push('Series ' + String.fromCharCode(65 + seriesHeaders.length));
        seriesColors.push(DEFAULT_COLORS[seriesHeaders.length - 1 % DEFAULT_COLORS.length] || '#888888');
        data.forEach(row => row.push(0));
        buildTable();
        render();
    });

    document.getElementById('btnClearData').addEventListener('click', () => {
        seriesHeaders = ['Series A'];
        seriesColors = [DEFAULT_COLORS[0]];
        labels = [''];
        data = [[0]];
        buildTable();
        render();
    });

    // ── Series Color List (style panel) ────────────────
    function updateSeriesColorList() {
        const el = document.getElementById('seriesColorList');
        el.innerHTML = seriesHeaders.map((h, i) => `
            <div class="field-row" style="margin-bottom:8px">
                <input type="color" value="${seriesColors[i]}" data-sci="${i}" style="width:32px;height:28px;border:1px solid var(--border);border-radius:4px;padding:2px;cursor:pointer">
                <span style="font-size:12px;color:var(--text-secondary)">${esc(h)}</span>
            </div>
        `).join('');
        el.querySelectorAll('input[type="color"]').forEach(inp => {
            inp.addEventListener('input', () => {
                seriesColors[parseInt(inp.dataset.sci)] = inp.value;
                buildTable();
                render();
            });
        });
    }

    // ── Style option change handlers ───────────────────
    ['optTitle','optXLabel','optYLabel','optBgColor','optTextColor','optGridColor',
     'optFontSize','optShowGrid','optShowLegend','optShowValues','optSmooth',
     'optBarWidth','optPointRadius','optLineWidth'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => render());
        document.getElementById(id).addEventListener('change', () => render());
    });

    function getOpts() {
        return {
            title: document.getElementById('optTitle').value,
            xLabel: document.getElementById('optXLabel').value,
            yLabel: document.getElementById('optYLabel').value,
            bgColor: document.getElementById('optBgColor').value,
            textColor: document.getElementById('optTextColor').value,
            gridColor: document.getElementById('optGridColor').value,
            fontSize: parseInt(document.getElementById('optFontSize').value) || 12,
            showGrid: document.getElementById('optShowGrid').checked,
            showLegend: document.getElementById('optShowLegend').checked,
            showValues: document.getElementById('optShowValues').checked,
            smooth: document.getElementById('optSmooth').checked,
            barWidth: parseInt(document.getElementById('optBarWidth').value) || 70,
            pointRadius: parseInt(document.getElementById('optPointRadius').value) || 4,
            lineWidth: parseInt(document.getElementById('optLineWidth').value) || 2
        };
    }

    // ── Utility ────────────────────────────────────────
    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getNumericData() {
        return data.map(row => row.map(v => (typeof v === 'number' && !isNaN(v)) ? v : 0));
    }

    // ── Rendering ──────────────────────────────────────
    function render() {
        if (renderMode === 'svg') {
            renderSVG();
        } else {
            renderCanvas();
        }
    }

    function getChartDimensions() {
        const rect = container.getBoundingClientRect();
        const w = Math.max(400, Math.floor(rect.width - 40));
        const h = Math.max(300, Math.floor(rect.height - 40));
        const dpr = window.devicePixelRatio || 1;
        return { w, h, dpr };
    }

    // ── Canvas Rendering ───────────────────────────────
    function renderCanvas() {
        // Remove SVG if present
        const oldSvg = container.querySelector('svg');
        if (oldSvg) oldSvg.remove();
        canvas.style.display = 'block';

        const { w, h, dpr } = getChartDimensions();
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.scale(dpr, dpr);

        const opts = getOpts();
        const nd = getNumericData();

        // Background
        ctx.fillStyle = opts.bgColor;
        ctx.fillRect(0, 0, w, h);

        if (chartType === 'pie') {
            drawPieCanvas(ctx, w, h, nd, opts);
        } else {
            drawCartesianCanvas(ctx, w, h, nd, opts);
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function drawCartesianCanvas(ctx, W, H, nd, opts) {
        const fs = opts.fontSize;
        const pad = { top: 30, right: 30, bottom: 50, left: 60 };

        if (opts.title) pad.top += fs + 8;
        if (opts.xLabel) pad.bottom += fs + 4;
        if (opts.yLabel) pad.left += fs + 4;
        if (opts.showLegend) pad.top += 24;

        const plotW = W - pad.left - pad.right;
        const plotH = H - pad.top - pad.bottom;

        // Compute Y range
        let yMin = 0, yMax = 1;
        nd.forEach(row => row.forEach(v => {
            if (v < yMin) yMin = v;
            if (v > yMax) yMax = v;
        }));
        if (yMin > 0) yMin = 0;
        const yRange = niceRange(yMin, yMax);
        yMin = yRange.min;
        yMax = yRange.max;
        const yTicks = yRange.ticks;

        function yToPixel(v) {
            return pad.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH;
        }
        function xToPixel(i) {
            if (chartType === 'scatter') {
                return pad.left + (i / Math.max(1, nd.length - 1)) * plotW;
            }
            return pad.left + (i + 0.5) / nd.length * plotW;
        }

        // Title
        if (opts.title) {
            ctx.fillStyle = opts.textColor;
            ctx.font = `600 ${fs + 4}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText(opts.title, W / 2, opts.showLegend ? 22 : 22);
        }

        // Legend
        if (opts.showLegend && seriesHeaders.length > 0) {
            const ly = opts.title ? fs + 32 : 18;
            ctx.font = `500 ${fs - 1}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'left';
            let lx = pad.left;
            seriesHeaders.forEach((h, i) => {
                ctx.fillStyle = seriesColors[i] || '#888';
                ctx.fillRect(lx, ly - 8, 12, 12);
                ctx.fillStyle = opts.textColor;
                ctx.fillText(h, lx + 16, ly + 2);
                lx += ctx.measureText(h).width + 34;
            });
        }

        // Grid & Y axis
        ctx.strokeStyle = opts.gridColor;
        ctx.lineWidth = 1;
        ctx.font = `${fs - 1}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.fillStyle = opts.textColor;
        ctx.textAlign = 'right';

        yTicks.forEach(v => {
            const y = yToPixel(v);
            if (opts.showGrid) {
                ctx.beginPath();
                ctx.setLineDash([3, 3]);
                ctx.moveTo(pad.left, y);
                ctx.lineTo(pad.left + plotW, y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            ctx.fillText(formatNum(v), pad.left - 8, y + 4);
        });

        // X axis labels
        ctx.textAlign = 'center';
        ctx.fillStyle = opts.textColor;
        labels.forEach((lbl, i) => {
            if (i < nd.length) {
                const x = xToPixel(i);
                ctx.fillText(lbl, x, H - pad.bottom + fs + 6);
            }
        });

        // Axis labels
        if (opts.xLabel) {
            ctx.fillStyle = opts.textColor;
            ctx.font = `500 ${fs}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText(opts.xLabel, pad.left + plotW / 2, H - 8);
        }
        if (opts.yLabel) {
            ctx.save();
            ctx.translate(14, pad.top + plotH / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = opts.textColor;
            ctx.font = `500 ${fs}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText(opts.yLabel, 0, 0);
            ctx.restore();
        }

        // Axes lines
        ctx.strokeStyle = opts.gridColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(pad.left, pad.top);
        ctx.lineTo(pad.left, pad.top + plotH);
        ctx.lineTo(pad.left + plotW, pad.top + plotH);
        ctx.stroke();

        // Draw data
        if (chartType === 'bar') {
            drawBarsCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel);
        } else if (chartType === 'line') {
            drawLinesCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel, false);
        } else if (chartType === 'area') {
            drawLinesCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel, true);
        } else if (chartType === 'scatter') {
            drawScatterCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel);
        }
    }

    function drawBarsCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel) {
        const nSeries = seriesHeaders.length;
        const nBars = nd.length;
        if (!nBars) return;

        const groupWidth = plotW / nBars;
        const barGroupWidth = groupWidth * (opts.barWidth / 100);
        const barW = barGroupWidth / nSeries;
        const y0 = yToPixel(0);

        nd.forEach((row, i) => {
            const groupX = pad.left + i * groupWidth + (groupWidth - barGroupWidth) / 2;
            row.forEach((v, s) => {
                const x = groupX + s * barW;
                const y = yToPixel(v);
                const h = y0 - y;

                ctx.fillStyle = seriesColors[s] || '#888';
                roundRect(ctx, x, Math.min(y, y0), barW - 1, Math.abs(h), 3);
                ctx.fill();

                if (opts.showValues) {
                    ctx.fillStyle = opts.textColor;
                    ctx.font = `500 ${opts.fontSize - 2}px ${getComputedStyle(document.body).fontFamily}`;
                    ctx.textAlign = 'center';
                    ctx.fillText(formatNum(v), x + barW / 2, y - 4);
                }
            });
        });
    }

    function drawLinesCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel, isArea) {
        const nSeries = seriesHeaders.length;
        const y0 = yToPixel(0);

        for (let s = 0; s < nSeries; s++) {
            const points = nd.map((row, i) => ({ x: xToPixel(i), y: yToPixel(row[s] || 0) }));
            if (!points.length) continue;

            const color = seriesColors[s] || '#888';

            if (isArea) {
                ctx.beginPath();
                if (opts.smooth && points.length > 2) {
                    smoothPath(ctx, points);
                } else {
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let p = 1; p < points.length; p++) ctx.lineTo(points[p].x, points[p].y);
                }
                ctx.lineTo(points[points.length - 1].x, y0);
                ctx.lineTo(points[0].x, y0);
                ctx.closePath();
                ctx.fillStyle = hexToRgba(color, 0.18);
                ctx.fill();
            }

            // Line
            ctx.beginPath();
            if (opts.smooth && points.length > 2) {
                smoothPath(ctx, points);
            } else {
                ctx.moveTo(points[0].x, points[0].y);
                for (let p = 1; p < points.length; p++) ctx.lineTo(points[p].x, points[p].y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = opts.lineWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Points
            points.forEach((pt, i) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, opts.pointRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                if (opts.showValues) {
                    ctx.fillStyle = opts.textColor;
                    ctx.font = `500 ${opts.fontSize - 2}px ${getComputedStyle(document.body).fontFamily}`;
                    ctx.textAlign = 'center';
                    ctx.fillText(formatNum(nd[i][s] || 0), pt.x, pt.y - opts.pointRadius - 6);
                }
            });
        }
    }

    function drawScatterCanvas(ctx, nd, opts, pad, plotW, plotH, xToPixel, yToPixel) {
        const nSeries = seriesHeaders.length;
        for (let s = 0; s < nSeries; s++) {
            const color = seriesColors[s] || '#888';
            nd.forEach((row, i) => {
                const x = xToPixel(i);
                const y = yToPixel(row[s] || 0);

                ctx.beginPath();
                ctx.arc(x, y, opts.pointRadius + 1, 0, Math.PI * 2);
                ctx.fillStyle = hexToRgba(color, 0.7);
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                if (opts.showValues) {
                    ctx.fillStyle = opts.textColor;
                    ctx.font = `500 ${opts.fontSize - 2}px ${getComputedStyle(document.body).fontFamily}`;
                    ctx.textAlign = 'center';
                    ctx.fillText(formatNum(row[s] || 0), x, y - opts.pointRadius - 6);
                }
            });
        }
    }

    function drawPieCanvas(ctx, W, H, nd, opts) {
        const fs = opts.fontSize;
        const cx = W / 2;
        const titleOffset = opts.title ? fs + 16 : 0;
        const legendOffset = opts.showLegend ? 28 : 0;
        const cy = (H + titleOffset + legendOffset) / 2;
        const radius = Math.min(W, H - titleOffset - legendOffset) / 2 - 40;

        // Title
        if (opts.title) {
            ctx.fillStyle = opts.textColor;
            ctx.font = `600 ${fs + 4}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText(opts.title, W / 2, 22);
        }

        // Aggregate: first series only, or sum all series per label
        const values = nd.map(row => row.reduce((a, b) => a + b, 0));
        const total = values.reduce((a, b) => a + b, 0);
        if (total === 0) {
            ctx.fillStyle = opts.textColor;
            ctx.font = `${fs}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText('No data', cx, cy);
            return;
        }

        let angle = -Math.PI / 2;
        const slices = values.map((v, i) => {
            const sweep = (v / total) * Math.PI * 2;
            const slice = { value: v, label: labels[i] || '', startAngle: angle, endAngle: angle + sweep, color: seriesColors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length] };
            angle += sweep;
            return slice;
        });

        slices.forEach(s => {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, s.startAngle, s.endAngle);
            ctx.closePath();
            ctx.fillStyle = s.color;
            ctx.fill();
            ctx.strokeStyle = opts.bgColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Label
            if (opts.showValues || true) {
                const midAngle = (s.startAngle + s.endAngle) / 2;
                const pct = total > 0 ? ((s.value / total) * 100).toFixed(1) + '%' : '';
                const lx = cx + Math.cos(midAngle) * radius * 0.65;
                const ly = cy + Math.sin(midAngle) * radius * 0.65;

                ctx.fillStyle = '#fff';
                ctx.font = `600 ${fs - 1}px ${getComputedStyle(document.body).fontFamily}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if ((s.endAngle - s.startAngle) > 0.25) {
                    ctx.fillText(pct, lx, ly);
                }
                ctx.textBaseline = 'alphabetic';
            }
        });

        // Legend
        if (opts.showLegend) {
            ctx.font = `500 ${fs - 1}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = 'left';
            let lx = 20;
            let ly = H - 16;
            slices.forEach((s, i) => {
                ctx.fillStyle = s.color;
                ctx.fillRect(lx, ly - 9, 10, 10);
                ctx.fillStyle = opts.textColor;
                const txt = s.label || ('Slice ' + (i + 1));
                ctx.fillText(txt, lx + 14, ly);
                lx += ctx.measureText(txt).width + 30;
                if (lx > W - 50) { lx = 20; ly -= 18; }
            });
        }
    }

    // ── SVG Rendering ──────────────────────────────────
    function renderSVG() {
        canvas.style.display = 'none';
        let oldSvg = container.querySelector('svg');
        if (oldSvg) oldSvg.remove();

        const { w: W, h: H } = getChartDimensions();
        const opts = getOpts();
        const nd = getNumericData();

        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        svg.setAttribute('width', W);
        svg.setAttribute('height', H);
        svg.style.maxWidth = '100%';
        svg.style.maxHeight = '100%';

        // Background
        const bgRect = document.createElementNS(ns, 'rect');
        bgRect.setAttribute('width', W);
        bgRect.setAttribute('height', H);
        bgRect.setAttribute('fill', opts.bgColor);
        svg.appendChild(bgRect);

        if (chartType === 'pie') {
            buildPieSVG(svg, ns, W, H, nd, opts);
        } else {
            buildCartesianSVG(svg, ns, W, H, nd, opts);
        }

        container.appendChild(svg);
    }

    function svgEl(ns, tag, attrs) {
        const el = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    }

    function svgText(ns, x, y, text, attrs = {}) {
        const el = svgEl(ns, 'text', { x, y, ...attrs });
        el.textContent = text;
        return el;
    }

    function buildCartesianSVG(svg, ns, W, H, nd, opts) {
        const fs = opts.fontSize;
        const fontFam = 'Inter, sans-serif';
        const pad = { top: 30, right: 30, bottom: 50, left: 60 };

        if (opts.title) pad.top += fs + 8;
        if (opts.xLabel) pad.bottom += fs + 4;
        if (opts.yLabel) pad.left += fs + 4;
        if (opts.showLegend) pad.top += 24;

        const plotW = W - pad.left - pad.right;
        const plotH = H - pad.top - pad.bottom;

        let yMin = 0, yMax = 1;
        nd.forEach(row => row.forEach(v => { if (v < yMin) yMin = v; if (v > yMax) yMax = v; }));
        if (yMin > 0) yMin = 0;
        const yRange = niceRange(yMin, yMax);
        yMin = yRange.min; yMax = yRange.max;
        const yTicks = yRange.ticks;

        function yToP(v) { return pad.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH; }
        function xToP(i) {
            if (chartType === 'scatter') return pad.left + (i / Math.max(1, nd.length - 1)) * plotW;
            return pad.left + (i + 0.5) / nd.length * plotW;
        }

        // Title
        if (opts.title) {
            svg.appendChild(svgText(ns, W / 2, opts.showLegend ? 20 : 20, opts.title, {
                'text-anchor': 'middle', fill: opts.textColor,
                'font-family': fontFam, 'font-size': fs + 4, 'font-weight': 600
            }));
        }

        // Legend
        if (opts.showLegend) {
            const ly = opts.title ? fs + 30 : 16;
            let lx = pad.left;
            seriesHeaders.forEach((h, i) => {
                svg.appendChild(svgEl(ns, 'rect', { x: lx, y: ly - 8, width: 12, height: 12, fill: seriesColors[i] || '#888', rx: 2 }));
                const t = svgText(ns, lx + 16, ly + 2, h, { fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 1, 'font-weight': 500 });
                svg.appendChild(t);
                lx += h.length * (fs * 0.55) + 34;
            });
        }

        // Grid
        yTicks.forEach(v => {
            const y = yToP(v);
            if (opts.showGrid) {
                svg.appendChild(svgEl(ns, 'line', { x1: pad.left, y1: y, x2: pad.left + plotW, y2: y, stroke: opts.gridColor, 'stroke-dasharray': '3,3' }));
            }
            svg.appendChild(svgText(ns, pad.left - 8, y + 4, formatNum(v), { 'text-anchor': 'end', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 1 }));
        });

        // X labels
        labels.forEach((lbl, i) => {
            if (i < nd.length) {
                svg.appendChild(svgText(ns, xToP(i), H - pad.bottom + fs + 6, lbl, { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 1 }));
            }
        });

        // Axis labels
        if (opts.xLabel) {
            svg.appendChild(svgText(ns, pad.left + plotW / 2, H - 8, opts.xLabel, { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs, 'font-weight': 500 }));
        }
        if (opts.yLabel) {
            const t = svgText(ns, 14, pad.top + plotH / 2, opts.yLabel, { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs, 'font-weight': 500, transform: `rotate(-90 14 ${pad.top + plotH / 2})` });
            svg.appendChild(t);
        }

        // Axes
        svg.appendChild(svgEl(ns, 'line', { x1: pad.left, y1: pad.top, x2: pad.left, y2: pad.top + plotH, stroke: opts.gridColor }));
        svg.appendChild(svgEl(ns, 'line', { x1: pad.left, y1: pad.top + plotH, x2: pad.left + plotW, y2: pad.top + plotH, stroke: opts.gridColor }));

        // Data
        const nSeries = seriesHeaders.length;
        const y0 = yToP(0);

        if (chartType === 'bar') {
            const groupW = plotW / nd.length;
            const barGroupW = groupW * (opts.barWidth / 100);
            const barW = barGroupW / nSeries;
            nd.forEach((row, i) => {
                const gx = pad.left + i * groupW + (groupW - barGroupW) / 2;
                row.forEach((v, s) => {
                    const bx = gx + s * barW;
                    const by = yToP(v);
                    const bh = Math.abs(y0 - by);
                    svg.appendChild(svgEl(ns, 'rect', { x: bx, y: Math.min(by, y0), width: Math.max(0, barW - 1), height: bh, fill: seriesColors[s] || '#888', rx: 3 }));
                    if (opts.showValues) {
                        svg.appendChild(svgText(ns, bx + barW / 2, by - 4, formatNum(v), { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 2, 'font-weight': 500 }));
                    }
                });
            });
        } else if (chartType === 'line' || chartType === 'area') {
            for (let s = 0; s < nSeries; s++) {
                const pts = nd.map((row, i) => ({ x: xToP(i), y: yToP(row[s] || 0) }));
                if (!pts.length) continue;
                const color = seriesColors[s] || '#888';
                const d = opts.smooth && pts.length > 2 ? smoothPathD(pts) : pts.map((p, j) => (j === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');

                if (chartType === 'area') {
                    const areaD = d + ` L${pts[pts.length-1].x},${y0} L${pts[0].x},${y0} Z`;
                    svg.appendChild(svgEl(ns, 'path', { d: areaD, fill: hexToRgba(color, 0.18), stroke: 'none' }));
                }

                svg.appendChild(svgEl(ns, 'path', { d, fill: 'none', stroke: color, 'stroke-width': opts.lineWidth, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

                pts.forEach((pt, i) => {
                    svg.appendChild(svgEl(ns, 'circle', { cx: pt.x, cy: pt.y, r: opts.pointRadius, fill: '#fff', stroke: color, 'stroke-width': 2 }));
                    if (opts.showValues) {
                        svg.appendChild(svgText(ns, pt.x, pt.y - opts.pointRadius - 6, formatNum(nd[i][s] || 0), { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 2, 'font-weight': 500 }));
                    }
                });
            }
        } else if (chartType === 'scatter') {
            for (let s = 0; s < nSeries; s++) {
                const color = seriesColors[s] || '#888';
                nd.forEach((row, i) => {
                    const x = xToP(i), y = yToP(row[s] || 0);
                    svg.appendChild(svgEl(ns, 'circle', { cx: x, cy: y, r: opts.pointRadius + 1, fill: hexToRgba(color, 0.7), stroke: color, 'stroke-width': 1.5 }));
                    if (opts.showValues) {
                        svg.appendChild(svgText(ns, x, y - opts.pointRadius - 6, formatNum(row[s] || 0), { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 2, 'font-weight': 500 }));
                    }
                });
            }
        }
    }

    function buildPieSVG(svg, ns, W, H, nd, opts) {
        const fs = opts.fontSize;
        const fontFam = 'Inter, sans-serif';
        const cx = W / 2;
        const titleOffset = opts.title ? fs + 16 : 0;
        const legendOffset = opts.showLegend ? 28 : 0;
        const cy = (H + titleOffset + legendOffset) / 2;
        const radius = Math.min(W, H - titleOffset - legendOffset) / 2 - 40;

        if (opts.title) {
            svg.appendChild(svgText(ns, W / 2, 22, opts.title, { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs + 4, 'font-weight': 600 }));
        }

        const values = nd.map(row => row.reduce((a, b) => a + b, 0));
        const total = values.reduce((a, b) => a + b, 0);
        if (total === 0) {
            svg.appendChild(svgText(ns, cx, cy, 'No data', { 'text-anchor': 'middle', fill: opts.textColor, 'font-family': fontFam, 'font-size': fs }));
            return;
        }

        let angle = -Math.PI / 2;
        values.forEach((v, i) => {
            const sweep = (v / total) * Math.PI * 2;
            const startAngle = angle;
            const endAngle = angle + sweep;
            angle = endAngle;

            const x1 = cx + Math.cos(startAngle) * radius;
            const y1 = cy + Math.sin(startAngle) * radius;
            const x2 = cx + Math.cos(endAngle) * radius;
            const y2 = cy + Math.sin(endAngle) * radius;
            const largeArc = sweep > Math.PI ? 1 : 0;
            const color = seriesColors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length];

            const d = `M${cx},${cy} L${x1},${y1} A${radius},${radius} 0 ${largeArc} 1 ${x2},${y2} Z`;
            svg.appendChild(svgEl(ns, 'path', { d, fill: color, stroke: opts.bgColor, 'stroke-width': 2 }));

            if (sweep > 0.25) {
                const midAngle = (startAngle + endAngle) / 2;
                const lx = cx + Math.cos(midAngle) * radius * 0.65;
                const ly = cy + Math.sin(midAngle) * radius * 0.65;
                const pct = ((v / total) * 100).toFixed(1) + '%';
                svg.appendChild(svgText(ns, lx, ly + 4, pct, { 'text-anchor': 'middle', fill: '#fff', 'font-family': fontFam, 'font-size': fs - 1, 'font-weight': 600 }));
            }
        });

        if (opts.showLegend) {
            let lx = 20, ly = H - 16;
            values.forEach((v, i) => {
                const color = seriesColors[i] || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
                svg.appendChild(svgEl(ns, 'rect', { x: lx, y: ly - 9, width: 10, height: 10, fill: color, rx: 2 }));
                const txt = labels[i] || ('Slice ' + (i + 1));
                svg.appendChild(svgText(ns, lx + 14, ly, txt, { fill: opts.textColor, 'font-family': fontFam, 'font-size': fs - 1, 'font-weight': 500 }));
                lx += txt.length * (fs * 0.55) + 30;
                if (lx > W - 50) { lx = 20; ly -= 18; }
            });
        }
    }

    // ── Helpers ─────────────────────────────────────────
    function niceRange(min, max) {
        if (max <= min) max = min + 1;
        const range = max - min;
        const roughStep = range / 6;
        const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
        const residual = roughStep / mag;
        let step;
        if (residual <= 1.5) step = 1 * mag;
        else if (residual <= 3) step = 2 * mag;
        else if (residual <= 7) step = 5 * mag;
        else step = 10 * mag;

        const nMin = Math.floor(min / step) * step;
        const nMax = Math.ceil(max / step) * step;
        const ticks = [];
        for (let v = nMin; v <= nMax + step * 0.01; v += step) {
            ticks.push(Math.round(v * 1e10) / 1e10);
        }
        return { min: nMin, max: nMax, ticks };
    }

    function formatNum(v) {
        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'k';
        if (Number.isInteger(v)) return String(v);
        return v.toFixed(1);
    }

    function roundRect(ctx, x, y, w, h, r) {
        if (h < r * 2) r = h / 2;
        if (w < r * 2) r = w / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function smoothPath(ctx, pts) {
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 0; i < pts.length - 1; i++) {
            const xc = (pts[i].x + pts[i + 1].x) / 2;
            const yc = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
        }
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    }

    function smoothPathD(pts) {
        let d = `M${pts[0].x},${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
            const xc = (pts[i].x + pts[i + 1].x) / 2;
            const yc = (pts[i].y + pts[i + 1].y) / 2;
            d += ` Q${pts[i].x},${pts[i].y} ${xc},${yc}`;
        }
        d += ` L${pts[pts.length - 1].x},${pts[pts.length - 1].y}`;
        return d;
    }

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    // ── Resize handling ────────────────────────────────
    let resizeTimer;
    const ro = new ResizeObserver(() => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => render(), 100);
    });
    ro.observe(container);

    // ── Init ───────────────────────────────────────────
    buildTable();
    render();

})();
</script>
</body>
</html>
