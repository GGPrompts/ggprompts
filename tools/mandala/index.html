<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mandala Creator - Radial Symmetry Drawing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Josefin+Sans:wght@100;300;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ruby: #C0392B;
    --topaz: #E67E22;
    --citrine: #F1C40F;
    --emerald: #1A9E6F;
    --sapphire: #1A4FA0;
    --tanzanite: #4B3F8C;
    --amethyst: #8B44AC;
    --prism-edge: #E8D5F5;
    --tube-black: #0D0B14;
    --depth-dark: #1A1530;
    --glass-surface: rgba(232, 213, 245, 0.08);
    --text-primary: #E8E0F0;
    --text-secondary: rgba(232, 224, 240, 0.7);
    --text-muted: rgba(232, 224, 240, 0.5);
    --font-display: 'Orbitron', sans-serif;
    --font-heading: 'Josefin Sans', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --btn-size: 44px;
    --swatch-size: 34px;
    --panel-radius: 12px;
  }

  html, body {
    height: 100%; overflow: hidden;
    font-family: var(--font-body);
    background: var(--tube-black);
    color: var(--text-primary);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- Layout ---- */
  #app {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr;
    height: 100vh; width: 100vw;
  }

  /* ---- Side panel ---- */
  #sidebar {
    background: var(--depth-dark);
    border-right: 1px solid rgba(232, 213, 245, 0.1);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    z-index: 10;
  }

  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(232, 213, 245, 0.15); border-radius: 2px; }

  .panel-title {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--ruby), var(--topaz), var(--citrine), var(--emerald), var(--sapphire), var(--amethyst));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin-bottom: 4px;
  }

  .panel-subtitle {
    font-family: var(--font-heading);
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .section-label {
    font-family: var(--font-heading);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .panel-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232, 213, 245, 0.15), transparent);
    margin: 2px 0;
  }

  /* ---- Tool buttons ---- */
  .tool-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tool-btn {
    width: var(--btn-size); height: var(--btn-size);
    border: 1px solid rgba(232, 213, 245, 0.15);
    border-radius: 8px;
    background: var(--glass-surface);
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .tool-btn:hover {
    background: rgba(232, 213, 245, 0.12);
    border-color: rgba(232, 213, 245, 0.3);
  }
  .tool-btn:active { transform: scale(0.93); }
  .tool-btn.active {
    background: rgba(139, 68, 172, 0.25);
    border-color: var(--amethyst);
    box-shadow: 0 0 12px rgba(139, 68, 172, 0.3);
  }

  /* ---- Symmetry selector ---- */
  .sym-row {
    display: flex;
    gap: 4px;
  }

  .sym-btn {
    flex: 1;
    height: 32px;
    border: 1px solid rgba(232, 213, 245, 0.12);
    border-radius: 6px;
    background: var(--glass-surface);
    color: var(--text-secondary);
    font-family: var(--font-display);
    font-size: 0.65rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  .sym-btn:hover {
    background: rgba(232, 213, 245, 0.1);
    color: var(--text-primary);
  }
  .sym-btn.active {
    background: rgba(26, 79, 160, 0.3);
    border-color: var(--sapphire);
    color: var(--text-primary);
    box-shadow: 0 0 8px rgba(26, 79, 160, 0.25);
  }

  /* ---- Size buttons ---- */
  .size-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .size-btn {
    border: 1px solid rgba(232, 213, 245, 0.12);
    border-radius: 50%;
    background: var(--glass-surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .size-btn:hover { background: rgba(232, 213, 245, 0.12); }
  .size-btn.active {
    background: rgba(26, 158, 111, 0.25);
    border-color: var(--emerald);
    box-shadow: 0 0 8px rgba(26, 158, 111, 0.2);
  }
  .size-btn .dot {
    background: var(--text-primary);
    border-radius: 50%;
  }

  /* ---- Color palette ---- */
  .palette-grid {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .swatch {
    width: var(--swatch-size); height: var(--swatch-size);
    border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(232, 213, 245, 0.15);
    transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active {
    border-color: var(--prism-edge);
    box-shadow: 0 0 0 2px var(--tube-black), 0 0 12px rgba(232, 213, 245, 0.4);
    transform: scale(1.08);
  }
  .swatch.rainbow-swatch {
    background: conic-gradient(var(--ruby), var(--topaz), var(--citrine), var(--emerald), var(--sapphire), var(--tanzanite), var(--amethyst), var(--ruby));
  }

  /* ---- Action buttons ---- */
  .action-btn {
    width: 100%;
    height: 36px;
    border: 1px solid rgba(232, 213, 245, 0.12);
    border-radius: 8px;
    background: var(--glass-surface);
    color: var(--text-secondary);
    font-family: var(--font-heading);
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s;
  }
  .action-btn:hover {
    background: rgba(232, 213, 245, 0.1);
    color: var(--text-primary);
    border-color: rgba(232, 213, 245, 0.25);
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.danger:hover {
    background: rgba(192, 57, 43, 0.2);
    border-color: var(--ruby);
    color: var(--ruby);
  }

  .action-row {
    display: flex;
    gap: 6px;
  }
  .action-row .action-btn { flex: 1; }

  /* ---- Toggle button (guidelines, rotate) ---- */
  .toggle-btn {
    width: 100%;
    height: 32px;
    border: 1px solid rgba(232, 213, 245, 0.12);
    border-radius: 6px;
    background: var(--glass-surface);
    color: var(--text-muted);
    font-family: var(--font-heading);
    font-size: 0.75rem;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s;
  }
  .toggle-btn:hover {
    background: rgba(232, 213, 245, 0.08);
    color: var(--text-secondary);
  }
  .toggle-btn.active {
    background: rgba(75, 63, 140, 0.25);
    border-color: var(--tanzanite);
    color: var(--text-primary);
  }

  /* ---- Canvas area ---- */
  #canvas-wrap {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--tube-black);
  }

  #draw-canvas {
    border-radius: 50%;
    box-shadow:
      0 0 40px rgba(139, 68, 172, 0.15),
      0 0 80px rgba(75, 63, 140, 0.1),
      inset 0 0 60px rgba(0, 0, 0, 0.3);
    cursor: crosshair;
    touch-action: none;
  }

  #guide-canvas {
    position: absolute;
    pointer-events: none;
    z-index: 5;
    border-radius: 50%;
  }

  /* ---- Cursor ring ---- */
  #cursor-ring {
    position: fixed; pointer-events: none; z-index: 100;
    border: 1.5px solid rgba(232, 213, 245, 0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: none;
    mix-blend-mode: screen;
  }

  /* ---- Confirm dialog ---- */
  #confirm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(13, 11, 20, 0.8);
    backdrop-filter: blur(4px);
    z-index: 50;
    align-items: center; justify-content: center;
  }
  #confirm-overlay.open { display: flex; }
  #confirm-box {
    background: var(--depth-dark);
    border: 1px solid rgba(232, 213, 245, 0.15);
    border-radius: 16px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 68, 172, 0.1);
  }
  #confirm-box h2 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--ruby);
    margin-bottom: 8px;
  }
  #confirm-box p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  #confirm-box .btn-row { display: flex; gap: 12px; justify-content: center; }
  #confirm-box button {
    padding: 10px 28px; border: 1px solid rgba(232, 213, 245, 0.15);
    border-radius: 8px;
    font-family: var(--font-heading);
    font-size: 0.85rem;
    cursor: pointer; transition: all 0.15s;
    letter-spacing: 1px;
    background: var(--glass-surface);
    color: var(--text-primary);
  }
  #confirm-box button:hover { transform: scale(1.05); }
  #confirm-yes {
    background: rgba(192, 57, 43, 0.3);
    border-color: var(--ruby);
    color: var(--ruby);
  }
  #confirm-yes:hover { background: rgba(192, 57, 43, 0.45); }
  #confirm-no:hover {
    background: rgba(26, 79, 160, 0.25);
    border-color: var(--sapphire);
  }

  /* ---- Back link ---- */
  #back-link {
    position: fixed; bottom: 12px; right: 16px; z-index: 20;
    font-family: var(--font-heading);
    font-size: 0.75rem;
    color: var(--text-muted);
    text-decoration: none;
    background: rgba(26, 21, 48, 0.85);
    padding: 4px 14px;
    border-radius: 8px;
    border: 1px solid rgba(232, 213, 245, 0.1);
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  #back-link:hover {
    color: var(--text-primary);
    border-color: rgba(232, 213, 245, 0.25);
  }

  /* ---- Mobile sidebar toggle ---- */
  #sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px; left: 12px; z-index: 30;
    width: 40px; height: 40px;
    border: 1px solid rgba(232, 213, 245, 0.2);
    border-radius: 8px;
    background: rgba(26, 21, 48, 0.9);
    color: var(--text-primary);
    font-size: 20px;
    cursor: pointer;
    align-items: center; justify-content: center;
  }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    #app {
      grid-template-columns: 1fr;
    }
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 240px;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 25;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-toggle { display: flex; }
    :root {
      --btn-size: 38px;
      --swatch-size: 30px;
    }
  }
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="panel-section">
      <div class="panel-title">Mandala</div>
      <div class="panel-subtitle">Radial Symmetry</div>
    </div>

    <div class="panel-divider"></div>

    <!-- Brush tools -->
    <div class="panel-section">
      <div class="section-label">Brush</div>
      <div class="tool-row">
        <button class="tool-btn active" data-tool="pencil" title="Pencil">&#9998;</button>
        <button class="tool-btn" data-tool="glitter" title="Glitter">&#10024;</button>
        <button class="tool-btn" data-tool="spray" title="Spray">&#128167;</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">&#128473;</button>
      </div>
    </div>

    <!-- Size -->
    <div class="panel-section">
      <div class="section-label">Size</div>
      <div class="size-row">
        <button class="size-btn" data-size="2" style="width:28px;height:28px;" title="Thin"><span class="dot" style="width:3px;height:3px;"></span></button>
        <button class="size-btn active" data-size="5" style="width:34px;height:34px;" title="Medium"><span class="dot" style="width:7px;height:7px;"></span></button>
        <button class="size-btn" data-size="12" style="width:40px;height:40px;" title="Thick"><span class="dot" style="width:13px;height:13px;"></span></button>
      </div>
    </div>

    <!-- Symmetry -->
    <div class="panel-section">
      <div class="section-label">Symmetry</div>
      <div class="sym-row">
        <button class="sym-btn" data-sym="4">4x</button>
        <button class="sym-btn" data-sym="6">6x</button>
        <button class="sym-btn active" data-sym="8">8x</button>
        <button class="sym-btn" data-sym="12">12x</button>
        <button class="sym-btn" data-sym="16">16x</button>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- Colors -->
    <div class="panel-section">
      <div class="section-label">Gem Tones</div>
      <div class="palette-grid">
        <div class="swatch rainbow-swatch" data-color="rainbow" title="Rainbow"></div>
        <div class="swatch active" data-color="#C0392B" style="background:#C0392B;" title="Ruby"></div>
        <div class="swatch" data-color="#E67E22" style="background:#E67E22;" title="Topaz"></div>
        <div class="swatch" data-color="#F1C40F" style="background:#F1C40F;" title="Citrine"></div>
        <div class="swatch" data-color="#1A9E6F" style="background:#1A9E6F;" title="Emerald"></div>
        <div class="swatch" data-color="#1A4FA0" style="background:#1A4FA0;" title="Sapphire"></div>
        <div class="swatch" data-color="#4B3F8C" style="background:#4B3F8C;" title="Tanzanite"></div>
        <div class="swatch" data-color="#8B44AC" style="background:#8B44AC;" title="Amethyst"></div>
        <div class="swatch" data-color="#FFFFFF" style="background:#FFFFFF;" title="White"></div>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- Toggles -->
    <div class="panel-section">
      <button class="toggle-btn active" id="btn-guides" title="Show/hide radial guidelines">&#9674; Guidelines</button>
      <button class="toggle-btn" id="btn-mirror" title="Mirror each sector for reflection symmetry">&#8644; Reflect</button>
      <button class="toggle-btn" id="btn-rotate" title="Slowly rotate the finished mandala">&#10227; Auto-Rotate</button>
    </div>

    <div class="panel-divider"></div>

    <!-- Actions -->
    <div class="panel-section">
      <div class="action-row">
        <button class="action-btn" id="btn-undo" title="Undo (Ctrl+Z)">&#8630; Undo</button>
        <button class="action-btn" id="btn-redo" title="Redo (Ctrl+Y)">&#8631; Redo</button>
      </div>
      <button class="action-btn" id="btn-save" title="Save as PNG">&#128190; Save PNG</button>
      <button class="action-btn danger" id="btn-clear" title="Clear Canvas">&#128465; Clear</button>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="draw-canvas"></canvas>
    <canvas id="guide-canvas"></canvas>
  </div>
</div>

<!-- Sidebar toggle (mobile) -->
<button id="sidebar-toggle">&#9776;</button>

<!-- Cursor ring -->
<div id="cursor-ring"></div>

<!-- Confirm dialog -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <h2>CLEAR MANDALA?</h2>
    <p>This will erase your entire creation.</p>
    <div class="btn-row">
      <button id="confirm-yes">Clear It</button>
      <button id="confirm-no">Keep It</button>
    </div>
  </div>
</div>

<!-- Back link -->
<a id="back-link" href="../index.html">&larr; Tools</a>

<script>
(function() {
  'use strict';

  /* ================================================================
     Audio (lazy init)
     ================================================================ */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  const SFX = {
    swoosh() {
      const ctx = ensureAudio();
      const bufSize = ctx.sampleRate * 0.15;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
      const src = ctx.createBufferSource();
      const flt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer = buf;
      flt.type = 'bandpass'; flt.frequency.value = 2000; flt.Q.value = 0.5;
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      src.connect(flt).connect(g).connect(ctx.destination);
      src.start(); src.stop(ctx.currentTime + 0.16);
    },
    sprinkle() {
      const ctx = ensureAudio();
      for (let i = 0; i < 3; i++) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        const t = ctx.currentTime + i * 0.04;
        o.frequency.setValueAtTime(1200 + Math.random() * 1600, t);
        o.frequency.exponentialRampToValueAtTime(800 + Math.random() * 400, t + 0.06);
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.08);
      }
    },
    spray() {
      const ctx = ensureAudio();
      const bufSize = ctx.sampleRate * 0.08;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * 0.3 * (1 - i / bufSize);
      const src = ctx.createBufferSource();
      const flt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer = buf;
      flt.type = 'highpass'; flt.frequency.value = 3000;
      g.gain.setValueAtTime(0.08, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      src.connect(flt).connect(g).connect(ctx.destination);
      src.start();
    },
    clear() {
      const ctx = ensureAudio();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(800, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.42);
    },
    pop() {
      const ctx = ensureAudio();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(600, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.13);
    }
  };

  /* ================================================================
     Rainbow color cycling
     ================================================================ */
  const RAINBOW = ['#C0392B', '#E67E22', '#F1C40F', '#1A9E6F', '#1A4FA0',
    '#4B3F8C', '#8B44AC', '#E8D5F5', '#C0392B'];
  let rainbowIdx = 0;
  function nextRainbowColor() {
    const c = RAINBOW[rainbowIdx % RAINBOW.length];
    rainbowIdx++;
    return c;
  }

  /* ================================================================
     Glitter particles (from Kid Paint)
     ================================================================ */
  function drawGlitter(ctx, x, y, size, color) {
    const count = 6 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * size * 2;
      const px = x + Math.cos(angle) * dist;
      const py = y + Math.sin(angle) * dist;
      const r = 1 + Math.random() * 2.5;
      const sparkleColor = Math.random() > 0.4 ? color :
        (Math.random() > 0.5 ? '#FFFFFF' : '#F1C40F');
      ctx.fillStyle = sparkleColor;
      ctx.globalAlpha = 0.5 + Math.random() * 0.5;
      if (Math.random() > 0.5) {
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath();
        for (let j = 0; j < 8; j++) {
          const sr = j % 2 === 0 ? r * 1.5 : r * 0.4;
          const sa = (Math.PI * 2 * j) / 8;
          ctx[j === 0 ? 'moveTo' : 'lineTo'](px + Math.cos(sa) * sr, py + Math.sin(sa) * sr);
        }
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ================================================================
     Spray can (from Kid Paint)
     ================================================================ */
  function drawSpray(ctx, x, y, size, color) {
    const density = Math.floor(size * 2.5);
    ctx.fillStyle = color;
    for (let i = 0; i < density; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * size;
      ctx.globalAlpha = 0.2 + Math.random() * 0.5;
      ctx.fillRect(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  /* ================================================================
     Undo / redo stack (canvas snapshots)
     ================================================================ */
  const undoStack = [];
  const redoStack = [];
  const MAX_UNDO = 30;

  function pushUndo() {
    undoStack.push(canvas.toDataURL());
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
  }

  function doUndo() {
    if (undoStack.length === 0) return;
    redoStack.push(canvas.toDataURL());
    const data = undoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = data;
  }

  function doRedo() {
    if (redoStack.length === 0) return;
    undoStack.push(canvas.toDataURL());
    const data = redoStack.pop();
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = data;
  }

  /* ================================================================
     State
     ================================================================ */
  const BG_COLOR = '#0D0B14';
  let currentTool = 'pencil';
  let currentColor = '#C0392B';
  let isRainbowColor = false;
  let brushSize = 5;
  let symmetryCount = 8;
  let showGuides = true;
  let mirrorReflect = false;
  let autoRotate = false;
  let rotationAngle = 0;
  let rotationAnim = null;
  let drawing = false;
  let lastX = 0, lastY = 0;
  let sfxThrottle = 0;

  /* ================================================================
     Canvas setup
     ================================================================ */
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  const guideCanvas = document.getElementById('guide-canvas');
  const guideCtx = guideCanvas.getContext('2d');
  const wrap = document.getElementById('canvas-wrap');

  function getCanvasSize() {
    const rect = wrap.getBoundingClientRect();
    const maxDim = Math.min(rect.width - 40, rect.height - 40);
    return Math.max(300, Math.floor(maxDim));
  }

  function resizeCanvas() {
    const size = getCanvasSize();

    // Preserve existing drawing
    let imgData = null;
    if (canvas.width > 0 && canvas.height > 0) {
      imgData = canvas.toDataURL();
    }

    canvas.width = size;
    canvas.height = size;
    guideCanvas.width = size;
    guideCanvas.height = size;

    // Position guide canvas over draw canvas
    const canvasRect = canvas.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    guideCanvas.style.left = (canvasRect.left - wrapRect.left) + 'px';
    guideCanvas.style.top = (canvasRect.top - wrapRect.top) + 'px';
    guideCanvas.style.width = canvasRect.width + 'px';
    guideCanvas.style.height = canvasRect.height + 'px';

    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, size, size);

    if (imgData) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
      };
      img.src = imgData;
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    drawGuides();
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  setTimeout(() => pushUndo(), 100);

  /* ================================================================
     Guideline overlay
     ================================================================ */
  function drawGuides() {
    guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
    if (!showGuides) return;

    const cx = guideCanvas.width / 2;
    const cy = guideCanvas.height / 2;
    const r = cx - 2;
    const totalLines = mirrorReflect ? symmetryCount * 2 : symmetryCount;
    const step = (2 * Math.PI) / totalLines;

    guideCtx.strokeStyle = 'rgba(232, 213, 245, 0.08)';
    guideCtx.lineWidth = 1;

    for (let i = 0; i < totalLines; i++) {
      const angle = step * i;
      guideCtx.beginPath();
      guideCtx.moveTo(cx, cy);
      guideCtx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
      guideCtx.stroke();
    }

    // Concentric circles
    guideCtx.strokeStyle = 'rgba(232, 213, 245, 0.04)';
    const rings = 4;
    for (let i = 1; i <= rings; i++) {
      guideCtx.beginPath();
      guideCtx.arc(cx, cy, (r / (rings + 1)) * i, 0, Math.PI * 2);
      guideCtx.stroke();
    }

    // Center dot
    guideCtx.fillStyle = 'rgba(232, 213, 245, 0.12)';
    guideCtx.beginPath();
    guideCtx.arc(cx, cy, 3, 0, Math.PI * 2);
    guideCtx.fill();
  }

  /* ================================================================
     Tool buttons
     ================================================================ */
  const toolBtns = document.querySelectorAll('.tool-btn');
  toolBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentTool = btn.dataset.tool;
      toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === currentTool));
    });
  });

  /* ---- Size buttons ---- */
  const sizeBtns = document.querySelectorAll('.size-btn');
  sizeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      brushSize = parseInt(btn.dataset.size);
      sizeBtns.forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  /* ---- Symmetry buttons ---- */
  const symBtns = document.querySelectorAll('.sym-btn');
  symBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      symmetryCount = parseInt(btn.dataset.sym);
      symBtns.forEach(b => b.classList.toggle('active', b === btn));
      drawGuides();
    });
  });

  /* ---- Color palette ---- */
  const swatches = document.querySelectorAll('.swatch');
  swatches.forEach(sw => {
    sw.addEventListener('click', () => {
      if (sw.dataset.color === 'rainbow') {
        isRainbowColor = true;
        currentColor = '#C0392B';
      } else {
        isRainbowColor = false;
        currentColor = sw.dataset.color;
      }
      swatches.forEach(s => s.classList.toggle('active', s === sw));
    });
  });

  function getColor() {
    return isRainbowColor ? nextRainbowColor() : currentColor;
  }

  /* ---- Toggle buttons ---- */
  document.getElementById('btn-guides').addEventListener('click', function() {
    showGuides = !showGuides;
    this.classList.toggle('active', showGuides);
    drawGuides();
  });

  document.getElementById('btn-mirror').addEventListener('click', function() {
    mirrorReflect = !mirrorReflect;
    this.classList.toggle('active', mirrorReflect);
    drawGuides();
  });

  document.getElementById('btn-rotate').addEventListener('click', function() {
    autoRotate = !autoRotate;
    this.classList.toggle('active', autoRotate);
    if (autoRotate) {
      startAutoRotate();
    } else {
      stopAutoRotate();
    }
  });

  /* ================================================================
     Auto-rotate
     ================================================================ */
  function startAutoRotate() {
    if (rotationAnim) return;
    function tick() {
      rotationAngle += 0.15;
      wrap.style.transform = 'rotate(' + rotationAngle + 'deg)';
      rotationAnim = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopAutoRotate() {
    if (rotationAnim) {
      cancelAnimationFrame(rotationAnim);
      rotationAnim = null;
    }
    // Snap back to 0
    wrap.style.transform = '';
    rotationAngle = 0;
  }

  /* ================================================================
     Coordinate helpers
     ================================================================ */
  function canvasCoords(e) {
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    // When auto-rotate is on, the wrapper is CSS-rotated.
    // getBoundingClientRect() returns the axis-aligned bounding box of the
    // rotated element, which is larger than the actual canvas and offset.
    // We must inverse-rotate the mouse position around the canvas center.
    const rect = canvas.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    if (autoRotate && rotationAngle !== 0) {
      const rad = -rotationAngle * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const rx = dx * cos - dy * sin;
      const ry = dx * sin + dy * cos;
      dx = rx;
      dy = ry;
    }

    // Canvas pixel size === CSS display size (no CSS scaling), so
    // the offset from center in screen pixels maps 1:1 to canvas pixels.
    return {
      x: dx + canvas.width / 2,
      y: dy + canvas.height / 2
    };
  }

  /* ================================================================
     Radial symmetry drawing
     ================================================================ */
  const centerX = () => canvas.width / 2;
  const centerY = () => canvas.height / 2;

  function drawSymmetric(drawFn) {
    const cx = centerX();
    const cy = centerY();
    const slices = symmetryCount;
    const angleStep = (2 * Math.PI) / slices;

    for (let i = 0; i < slices; i++) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angleStep * i);
      drawFn(ctx);
      ctx.restore();

      // Mirror reflection
      if (mirrorReflect) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angleStep * i);
        ctx.scale(-1, 1); // flip horizontally
        drawFn(ctx);
        ctx.restore();
      }
    }
  }

  /* Draw a line segment relative to center */
  function drawRadialLine(x1, y1, x2, y2, color, size) {
    const cx = centerX();
    const cy = centerY();
    // Convert to relative coords
    const rx1 = x1 - cx, ry1 = y1 - cy;
    const rx2 = x2 - cx, ry2 = y2 - cy;

    drawSymmetric(function(c) {
      c.strokeStyle = color;
      c.lineWidth = size;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(rx1, ry1);
      c.lineTo(rx2, ry2);
      c.stroke();
    });
  }

  function drawRadialDot(x, y, color, size) {
    const cx = centerX();
    const cy = centerY();
    const rx = x - cx, ry = y - cy;

    drawSymmetric(function(c) {
      c.fillStyle = color;
      c.beginPath();
      c.arc(rx, ry, size / 2, 0, Math.PI * 2);
      c.fill();
    });
  }

  function drawRadialGlitter(x, y, color, size) {
    const cx = centerX();
    const cy = centerY();
    const rx = x - cx, ry = y - cy;

    drawSymmetric(function(c) {
      drawGlitter(c, rx, ry, size, color);
    });
  }

  function drawRadialSpray(x, y, color, size) {
    const cx = centerX();
    const cy = centerY();
    const rx = x - cx, ry = y - cy;

    drawSymmetric(function(c) {
      drawSpray(c, rx, ry, size, color);
    });
  }

  function drawRadialEraser(x1, y1, x2, y2, size) {
    const cx = centerX();
    const cy = centerY();
    const rx1 = x1 - cx, ry1 = y1 - cy;
    const rx2 = x2 - cx, ry2 = y2 - cy;

    drawSymmetric(function(c) {
      c.save();
      c.globalCompositeOperation = 'destination-out';
      c.lineWidth = size * 3;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(rx1, ry1);
      c.lineTo(rx2, ry2);
      c.stroke();
      c.restore();
    });

    // Redraw background underneath
    ctx.save();
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  /* ================================================================
     Drawing handlers
     ================================================================ */
  function startDraw(e) {
    e.preventDefault();
    const pos = canvasCoords(e);
    drawing = true;
    lastX = pos.x;
    lastY = pos.y;

    pushUndo();

    if (currentTool === 'pencil') {
      drawRadialDot(pos.x, pos.y, getColor(), brushSize);
    } else if (currentTool === 'glitter') {
      drawRadialGlitter(pos.x, pos.y, getColor(), brushSize * 1.5);
      SFX.sprinkle();
    } else if (currentTool === 'spray') {
      drawRadialSpray(pos.x, pos.y, getColor(), brushSize * 3);
      SFX.spray();
    } else if (currentTool === 'eraser') {
      drawRadialEraser(pos.x, pos.y, pos.x, pos.y, brushSize);
    }
  }

  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = canvasCoords(e);

    if (currentTool === 'pencil') {
      const color = getColor();
      drawRadialLine(lastX, lastY, pos.x, pos.y, color, brushSize);
      if (Date.now() - sfxThrottle > 200) { SFX.swoosh(); sfxThrottle = Date.now(); }
    } else if (currentTool === 'glitter') {
      drawRadialGlitter(pos.x, pos.y, getColor(), brushSize * 1.5);
      if (Date.now() - sfxThrottle > 150) { SFX.sprinkle(); sfxThrottle = Date.now(); }
    } else if (currentTool === 'spray') {
      drawRadialSpray(pos.x, pos.y, getColor(), brushSize * 3);
      if (Date.now() - sfxThrottle > 200) { SFX.spray(); sfxThrottle = Date.now(); }
    } else if (currentTool === 'eraser') {
      drawRadialEraser(lastX, lastY, pos.x, pos.y, brushSize);
    }

    lastX = pos.x;
    lastY = pos.y;
  }

  function endDraw(e) {
    if (!drawing) return;
    drawing = false;
  }

  /* ---- Event binding ---- */
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  /* ---- Cursor ring ---- */
  const cursorRing = document.getElementById('cursor-ring');
  canvas.addEventListener('mousemove', (e) => {
    if (['pencil', 'glitter', 'spray', 'eraser'].includes(currentTool)) {
      let sz = brushSize * 2 + 4;
      if (currentTool === 'spray') sz = brushSize * 6 + 4;
      else if (currentTool === 'glitter') sz = brushSize * 3 + 4;
      else if (currentTool === 'eraser') sz = brushSize * 6 + 4;
      cursorRing.style.display = 'block';
      cursorRing.style.width = cursorRing.style.height = sz + 'px';
      cursorRing.style.left = e.clientX + 'px';
      cursorRing.style.top = e.clientY + 'px';
    }
  });
  canvas.addEventListener('mouseleave', () => { cursorRing.style.display = 'none'; });

  /* ================================================================
     Action buttons
     ================================================================ */
  document.getElementById('btn-undo').addEventListener('click', () => { doUndo(); SFX.pop(); });
  document.getElementById('btn-redo').addEventListener('click', () => { doRedo(); SFX.pop(); });

  document.getElementById('btn-save').addEventListener('click', () => {
    // Create a clean export (no guidelines, with background filled)
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = canvas.width;
    exportCanvas.height = canvas.height;
    const ectx = exportCanvas.getContext('2d');
    ectx.fillStyle = BG_COLOR;
    ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
    ectx.drawImage(canvas, 0, 0);

    const link = document.createElement('a');
    link.download = 'mandala.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
    SFX.pop();
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    document.getElementById('confirm-overlay').classList.add('open');
  });
  document.getElementById('confirm-yes').addEventListener('click', () => {
    pushUndo();
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    document.getElementById('confirm-overlay').classList.remove('open');
    SFX.clear();
  });
  document.getElementById('confirm-no').addEventListener('click', () => {
    document.getElementById('confirm-overlay').classList.remove('open');
    SFX.pop();
  });

  /* ================================================================
     Keyboard shortcuts
     ================================================================ */
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'z' || e.key === 'Z') {
        e.preventDefault();
        if (e.shiftKey) doRedo(); else doUndo();
      }
      if (e.key === 'y' || e.key === 'Y') {
        e.preventDefault();
        doRedo();
      }
      if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        document.getElementById('btn-save').click();
      }
    }
  });

  /* ================================================================
     Mobile sidebar toggle
     ================================================================ */
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
  });
  // Close sidebar on canvas tap (mobile)
  wrap.addEventListener('click', () => {
    if (sidebar.classList.contains('open')) {
      sidebar.classList.remove('open');
    }
  });

})();
</script>
</body>
</html>
