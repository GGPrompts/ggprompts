<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundscape Mixer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

            --bg-deep: #0e0b0f;
            --bg-primary: #141018;
            --bg-panel: #1a1520;
            --bg-card: #1e1828;
            --bg-card-hover: #251e32;
            --bg-input: #120e18;

            --border-dim: #2a2235;
            --border-mid: #3a2f4a;
            --border-bright: #4a3d5f;

            --ember: #e8753a;
            --ember-glow: #ff9955;
            --amber: #d4a24e;
            --amber-dim: #8a6a2e;
            --teal: #4ec4a8;
            --teal-dim: #2a7a66;
            --violet: #9b7ad8;
            --violet-dim: #5a4080;
            --rose: #d47a8a;
            --sky: #6aace8;

            --text-primary: #d8d0e0;
            --text-secondary: #9a90a8;
            --text-muted: #5a5068;
            --text-bright: #f0eaf5;

            --glow-ember: 0 0 12px rgba(232, 117, 58, 0.4), 0 0 30px rgba(232, 117, 58, 0.12);
            --glow-amber: 0 0 10px rgba(212, 162, 78, 0.35), 0 0 25px rgba(212, 162, 78, 0.1);
            --glow-teal: 0 0 10px rgba(78, 196, 168, 0.35);

            --slider-track: #221c2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-mono);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ────────────────────────────────────────────── */
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-dim);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--ember-glow);
            text-shadow: var(--glow-ember);
            letter-spacing: 1px;
        }

        .header-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .header-nav {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 5px 12px;
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            transition: all 0.2s;
        }
        .back-link:hover {
            color: var(--ember);
            border-color: var(--ember);
        }

        /* ── Master Controls ───────────────────────────────────── */
        .master-bar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-dim);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .master-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .master-label {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            color: var(--amber);
            letter-spacing: 1px;
        }

        .master-slider {
            width: 140px;
        }

        .master-value {
            font-size: 11px;
            color: var(--ember-glow);
            min-width: 36px;
            text-align: right;
        }

        .play-all-btn {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid var(--ember);
            background: rgba(232, 117, 58, 0.12);
            color: var(--ember-glow);
            letter-spacing: 1px;
        }
        .play-all-btn:hover {
            background: rgba(232, 117, 58, 0.22);
            box-shadow: var(--glow-ember);
        }
        .play-all-btn.active {
            background: rgba(232, 117, 58, 0.3);
            box-shadow: var(--glow-ember);
            border-color: var(--ember-glow);
        }

        .timer-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .timer-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .timer-select {
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            outline: none;
        }
        .timer-select:focus {
            border-color: var(--amber);
        }

        .timer-display {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--amber);
            min-width: 52px;
            text-align: center;
            letter-spacing: 1px;
        }

        .timer-display.urgent {
            color: var(--rose);
            animation: pulse-text 1s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Channel Grid ──────────────────────────────────────── */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--channel-color, var(--ember));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .channel-card.active {
            border-color: var(--channel-color, var(--ember));
            background: var(--bg-card-hover);
        }
        .channel-card.active::before {
            opacity: 1;
        }

        .channel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .channel-icon {
            font-size: 28px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid var(--border-dim);
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .channel-card.active .channel-icon {
            border-color: var(--channel-color, var(--ember));
            box-shadow: 0 0 12px rgba(var(--channel-rgb, 232, 117, 58), 0.2);
        }

        .channel-name {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-bright);
            letter-spacing: 0.5px;
        }

        .channel-desc {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .channel-toggle {
            margin-left: auto;
            width: 44px;
            height: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-mid);
            background: var(--bg-input);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .channel-toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s;
        }
        .channel-toggle.on {
            background: rgba(var(--channel-rgb, 232, 117, 58), 0.25);
            border-color: var(--channel-color, var(--ember));
        }
        .channel-toggle.on::after {
            left: 23px;
            background: var(--channel-color, var(--ember));
            box-shadow: 0 0 8px rgba(var(--channel-rgb, 232, 117, 58), 0.5);
        }

        .channel-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-label {
            font-size: 10px;
            color: var(--text-muted);
            min-width: 32px;
            letter-spacing: 0.5px;
        }

        .volume-value {
            font-size: 10px;
            color: var(--channel-color, var(--ember));
            min-width: 28px;
            text-align: right;
        }

        /* ── Visualizer bar per channel ────────────────────────── */
        .channel-viz {
            height: 3px;
            background: var(--bg-input);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .channel-viz-fill {
            height: 100%;
            width: 0%;
            background: var(--channel-color, var(--ember));
            border-radius: 2px;
            transition: width 0.15s;
            opacity: 0.6;
        }
        .channel-card.active .channel-viz-fill {
            opacity: 1;
        }

        /* ── Presets row ───────────────────────────────────────── */
        .presets-bar {
            padding: 0 24px 8px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .presets-label {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            color: var(--violet);
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .preset-btn {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 14px;
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .preset-btn:hover {
            border-color: var(--violet);
            color: var(--violet);
            background: rgba(155, 122, 216, 0.08);
        }
        .preset-btn:active {
            transform: scale(0.96);
        }

        /* ── Range input styling ───────────────────────────────── */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--slider-track);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--thumb-color, var(--ember));
            box-shadow: 0 0 8px rgba(var(--channel-rgb, 232, 117, 58), 0.45);
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 14px rgba(var(--channel-rgb, 232, 117, 58), 0.7);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: var(--thumb-color, var(--ember));
            box-shadow: 0 0 8px rgba(var(--channel-rgb, 232, 117, 58), 0.45);
            cursor: pointer;
        }

        .master-slider input[type="range"] {
            --thumb-color: var(--amber);
        }
        .master-slider input[type="range"]::-webkit-slider-thumb {
            background: var(--amber);
            box-shadow: 0 0 8px rgba(212, 162, 78, 0.5);
        }
        .master-slider input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 14px rgba(212, 162, 78, 0.75);
        }
        .master-slider input[type="range"]::-moz-range-thumb {
            background: var(--amber);
            box-shadow: 0 0 8px rgba(212, 162, 78, 0.5);
        }

        /* ── Toast ─────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-panel);
            border: 1px solid var(--teal);
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 12px;
            color: var(--teal);
            box-shadow: var(--glow-teal);
            z-index: 999;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Background particles ──────────────────────────────── */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .header, .master-bar, .channel-grid, .presets-bar {
            position: relative;
            z-index: 1;
        }

        /* ── Responsive ────────────────────────────────────────── */
        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
                gap: 10px;
            }
            .header-title { font-size: 20px; }
            .header-sub { display: none; }

            .master-bar {
                padding: 12px 16px;
                gap: 12px;
            }
            .master-slider { width: 100px; }

            .timer-section {
                margin-left: 0;
                width: 100%;
            }

            .channel-grid {
                grid-template-columns: 1fr;
                padding: 16px;
                gap: 12px;
            }

            .presets-bar {
                padding: 0 16px 8px;
            }
        }

        @media (max-width: 480px) {
            .master-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .master-section { width: 100%; }
            .master-slider { flex: 1; }
            .channel-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<canvas class="bg-canvas" id="bgCanvas"></canvas>

<div class="header">
    <div>
        <div class="header-title">Soundscape Mixer</div>
        <div class="header-sub">ambient procedural audio for focus and rest</div>
    </div>
    <div class="header-nav">
        <a href="../index.html" class="back-link">Tools</a>
    </div>
</div>

<div class="master-bar">
    <button class="play-all-btn" id="playAllBtn">Start</button>
    <div class="master-section">
        <span class="master-label">Master</span>
        <div class="master-slider">
            <input type="range" id="masterVolume" min="0" max="100" value="75">
        </div>
        <span class="master-value" id="masterValue">75%</span>
    </div>
    <div class="timer-section">
        <span class="timer-label">Timer</span>
        <select class="timer-select" id="timerSelect">
            <option value="0">Off</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">60 min</option>
            <option value="90">90 min</option>
            <option value="120">2 hr</option>
        </select>
        <span class="timer-display" id="timerDisplay">--:--</span>
    </div>
</div>

<div class="presets-bar" id="presetsBar">
    <span class="presets-label">Scenes</span>
</div>

<div class="channel-grid" id="channelGrid"></div>

<div class="toast" id="toast"></div>

<script>
(function () {
    "use strict";

    // ── AudioContext ──────────────────────────────────────────
    var audioCtx = null;
    var masterGain = null;
    var isPlaying = false;
    var STORAGE_KEY = "soundscape-mixer-state";

    function ensureAudio() {
        if (audioCtx) {
            if (audioCtx.state === "suspended") audioCtx.resume();
            return;
        }
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = masterVol / 100;
        masterGain.connect(audioCtx.destination);
        if (audioCtx.state === "suspended") audioCtx.resume();
    }

    // ── Noise buffer utility ─────────────────────────────────
    var noiseBuffers = {};
    function getNoiseBuffer(type) {
        if (noiseBuffers[type]) return noiseBuffers[type];
        ensureAudio();
        var sr = audioCtx.sampleRate;
        var len = sr * 4; // 4 seconds of noise, looped
        var buf = audioCtx.createBuffer(1, len, sr);
        var data = buf.getChannelData(0);

        if (type === "white") {
            for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        } else if (type === "pink") {
            // Voss-McCartney algorithm approximation
            var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (var i = 0; i < len; i++) {
                var w = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + w * 0.0555179;
                b1 = 0.99332 * b1 + w * 0.0750759;
                b2 = 0.96900 * b2 + w * 0.1538520;
                b3 = 0.86650 * b3 + w * 0.3104856;
                b4 = 0.55000 * b4 + w * 0.5329522;
                b5 = -0.7616 * b5 - w * 0.0168980;
                data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
                b6 = w * 0.115926;
            }
        } else if (type === "brown") {
            var last = 0;
            for (var i = 0; i < len; i++) {
                var w = Math.random() * 2 - 1;
                last = (last + (0.02 * w)) / 1.02;
                data[i] = last * 3.5;
            }
        }

        noiseBuffers[type] = buf;
        return buf;
    }

    // ── Channel definitions ──────────────────────────────────
    var channels = [
        {
            id: "rain",
            name: "Rain",
            icon: "\u{1F327}",
            desc: "Steady rainfall on leaves",
            color: "#6aace8",
            rgb: "106, 172, 232",
            defaultVol: 60,
            create: function(dest) {
                // Rain: filtered pink noise + occasional drip oscillators
                var src = audioCtx.createBufferSource();
                src.buffer = getNoiseBuffer("pink");
                src.loop = true;

                var bp = audioCtx.createBiquadFilter();
                bp.type = "bandpass";
                bp.frequency.value = 2800;
                bp.Q.value = 0.5;

                var hp = audioCtx.createBiquadFilter();
                hp.type = "highpass";
                hp.frequency.value = 800;
                hp.Q.value = 0.3;

                var gain = audioCtx.createGain();
                gain.gain.value = 0.7;

                src.connect(bp);
                bp.connect(hp);
                hp.connect(gain);
                gain.connect(dest);
                src.start();

                // Add a second layer: brighter rain texture
                var src2 = audioCtx.createBufferSource();
                src2.buffer = getNoiseBuffer("white");
                src2.loop = true;

                var hp2 = audioCtx.createBiquadFilter();
                hp2.type = "highpass";
                hp2.frequency.value = 5000;
                hp2.Q.value = 0.2;

                var gain2 = audioCtx.createGain();
                gain2.gain.value = 0.15;

                src2.connect(hp2);
                hp2.connect(gain2);
                gain2.connect(dest);
                src2.start();

                return { sources: [src, src2], nodes: [bp, hp, gain, hp2, gain2] };
            }
        },
        {
            id: "wind",
            name: "Wind",
            icon: "\u{1F32C}",
            desc: "Gusting breeze through trees",
            color: "#8aa8c8",
            rgb: "138, 168, 200",
            defaultVol: 45,
            create: function(dest) {
                // Wind: brown noise through slowly modulated bandpass
                var src = audioCtx.createBufferSource();
                src.buffer = getNoiseBuffer("brown");
                src.loop = true;

                var bp = audioCtx.createBiquadFilter();
                bp.type = "bandpass";
                bp.frequency.value = 400;
                bp.Q.value = 1.2;

                // LFO to modulate the bandpass center frequency
                var lfo = audioCtx.createOscillator();
                lfo.type = "sine";
                lfo.frequency.value = 0.08;
                var lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 300;
                lfo.connect(lfoGain);
                lfoGain.connect(bp.frequency);
                lfo.start();

                // Second LFO for volume swells
                var lfo2 = audioCtx.createOscillator();
                lfo2.type = "sine";
                lfo2.frequency.value = 0.05;
                var lfo2Gain = audioCtx.createGain();
                lfo2Gain.gain.value = 0.25;
                lfo2.connect(lfo2Gain);

                var gain = audioCtx.createGain();
                gain.gain.value = 0.55;
                lfo2Gain.connect(gain.gain);

                src.connect(bp);
                bp.connect(gain);
                gain.connect(dest);
                src.start();
                lfo2.start();

                return { sources: [src], nodes: [bp, lfo, lfoGain, lfo2, lfo2Gain, gain] };
            }
        },
        {
            id: "fire",
            name: "Fire",
            icon: "\u{1F525}",
            desc: "Crackling campfire warmth",
            color: "#e8753a",
            rgb: "232, 117, 58",
            defaultVol: 50,
            create: function(dest) {
                // Fire: filtered noise + crackle oscillator bursts
                var src = audioCtx.createBufferSource();
                src.buffer = getNoiseBuffer("brown");
                src.loop = true;

                var lp = audioCtx.createBiquadFilter();
                lp.type = "lowpass";
                lp.frequency.value = 600;
                lp.Q.value = 0.8;

                var gain = audioCtx.createGain();
                gain.gain.value = 0.5;

                src.connect(lp);
                lp.connect(gain);
                gain.connect(dest);
                src.start();

                // Crackle layer: white noise, aggressively filtered and amplitude modulated
                var crackle = audioCtx.createBufferSource();
                crackle.buffer = getNoiseBuffer("white");
                crackle.loop = true;

                var bp = audioCtx.createBiquadFilter();
                bp.type = "bandpass";
                bp.frequency.value = 3000;
                bp.Q.value = 2;

                // Square wave LFO for random-ish crackling
                var lfo = audioCtx.createOscillator();
                lfo.type = "square";
                lfo.frequency.value = 8;
                var lfoG = audioCtx.createGain();
                lfoG.gain.value = 0.12;
                lfo.connect(lfoG);

                // Modulate crackle amplitude
                var crackleGain = audioCtx.createGain();
                crackleGain.gain.value = 0.08;
                lfoG.connect(crackleGain.gain);

                crackle.connect(bp);
                bp.connect(crackleGain);
                crackleGain.connect(dest);
                crackle.start();
                lfo.start();

                // Second crackle layer at different rate
                var crackle2 = audioCtx.createBufferSource();
                crackle2.buffer = getNoiseBuffer("white");
                crackle2.loop = true;

                var bp2 = audioCtx.createBiquadFilter();
                bp2.type = "bandpass";

    // ── Channel audio control ────────────────────────────────
    function toggleChannel(id) {
        var state = channelStates[id];
        if (state.active) {
            stopChannel(id);
        } else {
            startChannel(id);
        }
        autosave();
    }

    function startChannel(id) {
        ensureAudio();

        var state = channelStates[id];
        if (state.active || state._starting) return;
        state._starting = true;

        var ch = channels.find(function(c) { return c.id === id; });
        if (!ch) return;

        // Create a gain node for this channel
        var gainNode = audioCtx.createGain();
        gainNode.gain.value = (state.volume / 100);
        gainNode.connect(masterGain);

        var audioData = ch.create(gainNode);

        state.active = true;
        state.gainNode = gainNode;
        state.audioData = audioData;
        state._starting = false;

        updateChannelUI(id);
        updatePlayButton();
    }

    function stopChannel(id) {
        var state = channelStates[id];
        state._starting = false;
        if (!state.active) return;

        // Cleanup custom timers
        if (state.audioData && state.audioData.cleanup) {
            state.audioData.cleanup();
        }

        // Stop all sources
        if (state.audioData && state.audioData.sources) {
            state.audioData.sources.forEach(function(s) {
                try { s.stop(); } catch(e) {}
                try { s.disconnect(); } catch(e) {}
            });
        }

        // Disconnect all intermediate nodes
        if (state.audioData && state.audioData.nodes) {
            state.audioData.nodes.forEach(function(n) {
                try { n.disconnect(); } catch(e) {}
            });
        }

        // Disconnect channel gain
        if (state.gainNode) {
            try { state.gainNode.disconnect(); } catch(e) {}
        }

        state.active = false;
        state.gainNode = null;
        state.audioData = null;

        updateChannelUI(id);
        updatePlayButton();
    }

    function updateChannelGain(id) {
        var state = channelStates[id];
        if (state.gainNode && audioCtx) {
            state.gainNode.gain.setTargetAtTime(state.volume / 100, audioCtx.currentTime, 0.05);
        }
    }

    function updateChannelUI(id) {
        var state = channelStates[id];
        var els = channelElements[id];
        els.card.classList.toggle("active", state.active);
        els.toggle.classList.toggle("on", state.active);
    }

    function updatePlayButton() {
        var anyActive = false;
        for (var id in channelStates) {
            if (channelStates[id].active) { anyActive = true; break; }
        }
        isPlaying = anyActive;
        $playAllBtn.textContent = anyActive ? "Stop All" : "Start";
        $playAllBtn.classList.toggle("active", anyActive);
    }

                stopChannel(ch.id);
            });
            clearTimer();
        } else {
            // Start all channels that have volume > 0
            var anyStarted = false;
            channels.forEach(function(ch) {
                if (channelStates[ch.id].volume > 0) {
                    startChannel(ch.id);
                    anyStarted = true;
                }
            });
            if (!anyStarted) {
                // Start with defaults
                startChannel("rain");
                startChannel("fire");
            }
            startTimer();
        }
    });

    // ── Master volume ────────────────────────────────────────
    $masterVolume.addEventListener("input", function() {
        masterVol = parseInt($masterVolume.value);
        $masterValue.textContent = masterVol + "%";
        if (masterGain && audioCtx) {
            masterGain.gain.setTargetAtTime(masterVol / 100, audioCtx.currentTime, 0.05);
        }
        autosave();
    });

    // ── Timer ────────────────────────────────────────────────
    function startTimer() {
        var mins = parseInt($timerSelect.value);
        if (mins <= 0) {
            $timerDisplay.textContent = "--:--";
            $timerDisplay.classList.remove("urgent");
            return;
        }

        timerRemaining = mins * 60;
        clearInterval(timerInterval);
        updateTimerDisplay();

        timerInterval = setInterval(function() {
            timerRemaining--;
            if (timerRemaining <= 0) {
                // Fade out and stop
                fadeOutAll();
                clearTimer();
                showToast("Timer ended -- fading out");
            } else {
                updateTimerDisplay();
            }
        }, 1000);
    }

    function clearTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRemaining = 0;
        $timerDisplay.textContent = "--:--";
        $timerDisplay.classList.remove("urgent");
    }

    function updateTimerDisplay() {
        var m = Math.floor(timerRemaining / 60);
        var s = timerRemaining % 60;
        $timerDisplay.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        $timerDisplay.classList.toggle("urgent", timerRemaining <= 60 && timerRemaining > 0);
    }

    $timerSelect.addEventListener("change", function() {
        if (isPlaying) startTimer();
    });

    function fadeOutAll() {
        if (!masterGain) return;
        var now = audioCtx.currentTime;
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0, now + 5);

        setTimeout(function() {
            channels.forEach(function(ch) {
                stopChannel(ch.id);
            });
            // Restore master volume
            if (masterGain) {
                masterGain.gain.value = masterVol / 100;
            }
        }, 5500);
    }

    // ── Scene presets ────────────────────────────────────────
    function applyScene(scene) {
        ensureAudio();

        // Stop all first
        channels.forEach(function(ch) {
            stopChannel(ch.id);
        });

        // Apply scene volumes and start channels
        channels.forEach(function(ch) {
            var vol = scene.channels[ch.id] || 0;
            channelStates[ch.id].volume = vol;

            var els = channelElements[ch.id];
            els.slider.value = vol;
            els.value.textContent = vol + "%";

            if (vol > 0) {
                startChannel(ch.id);
            }
        });

        startTimer();
        showToast("Scene: " + scene.name);
        autosave();
    }

    // ── Visualization ────────────────────────────────────────
    var vizFrame = null;
    function animateViz() {
        channels.forEach(function(ch) {
            var state = channelStates[ch.id];
            var els = channelElements[ch.id];
            if (state.active) {
                // Simulate audio activity with randomized width
                var base = state.volume;
                var jitter = Math.sin(Date.now() * 0.003 + ch.id.charCodeAt(0)) * 15 + Math.random() * 10;
                var width = Math.max(5, Math.min(100, base + jitter));
                els.vizFill.style.width = width + "%";
            } else {
                els.vizFill.style.width = "0%";
            }
        });
        vizFrame = requestAnimationFrame(animateViz);
    }
    vizFrame = requestAnimationFrame(animateViz);

    // ── Background particles ─────────────────────────────────
    var bgCtx = $bgCanvas.getContext("2d");
    var particles = [];
    var PARTICLE_COUNT = 40;

    function initParticles() {
        var dpr = window.devicePixelRatio || 1;
        $bgCanvas.width = window.innerWidth * dpr;
        $bgCanvas.height = window.innerHeight * dpr;
        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        $bgCanvas.style.width = window.innerWidth + "px";
        $bgCanvas.style.height = window.innerHeight + "px";

        particles = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.2,
                r: 1 + Math.random() * 2,
                alpha: 0.1 + Math.random() * 0.2
            });
        }
    }

    function drawParticles() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        bgCtx.clearRect(0, 0, w, h);

        particles.forEach(function(p) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            if (p.y < -10) p.y = h + 10;
            if (p.y > h + 10) p.y = -10;

            // Pulse alpha when playing
            var a = p.alpha;
            if (isPlaying) {
                a += Math.sin(Date.now() * 0.001 + p.x * 0.01) * 0.08;
            }

            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            bgCtx.fillStyle = "rgba(212, 162, 78, " + Math.max(0, a) + ")";
            bgCtx.fill();
        });

        requestAnimationFrame(drawParticles);
    }

    initParticles();
    drawParticles();

    var resizeTimer = null;
    window.addEventListener("resize", function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(initParticles, 150);
    });

    // ── Autosave / Restore ───────────────────────────────────
    function autosave() {
        try {
            var state = {
                masterVol: masterVol,
                channels: {}
            };
            channels.forEach(function(ch) {
                state.channels[ch.id] = {
                    volume: channelStates[ch.id].volume,
                    active: channelStates[ch.id].active
                };
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch(e) {}
    }

    function loadAutosave() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            var state = JSON.parse(raw);

            if (state.masterVol !== undefined) {
                masterVol = state.masterVol;
                $masterVolume.value = masterVol;
                $masterValue.textContent = masterVol + "%";
            }

            if (state.channels) {
                channels.forEach(function(ch) {
                    var saved = state.channels[ch.id];
                    if (saved) {
                        channelStates[ch.id].volume = saved.volume || 0;
                        var els = channelElements[ch.id];
                        els.slider.value = saved.volume || 0;
                        els.value.textContent = (saved.volume || 0) + "%";
                    }
                });
            }
            return true;
        } catch(e) {}
        return false;
    }

    // ── Init ─────────────────────────────────────────────────
    loadAutosave();

})();
</script>
