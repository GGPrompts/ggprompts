<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Map Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           TILE MAP EDITOR — NES/8-bit CRT aesthetic
           Press Start 2P (headings), VT323 (body/UI)
        ================================================================ */
        :root {
            --pixel-black: #0f0f0f;
            --pixel-dark: #1a1a2e;
            --pixel-navy: #16213e;
            --pixel-blue: #0077c0;
            --pixel-cyan: #00d4ff;
            --pixel-green: #00a854;
            --pixel-lime: #7cfc00;
            --pixel-yellow: #fcbf00;
            --pixel-orange: #ff7700;
            --pixel-red: #e4002b;
            --pixel-pink: #ff6b9d;
            --pixel-magenta: #c800c8;
            --pixel-purple: #6b2d9e;
            --pixel-white: #fcfcfc;
            --pixel-gray-light: #bcbcbc;
            --pixel-gray: #7c7c7c;
            --pixel-gray-dark: #3c3c3c;

            --bg-primary: var(--pixel-dark);
            --bg-surface: #0d0d1a;
            --bg-panel: #111128;
            --text-primary: var(--pixel-white);
            --text-secondary: var(--pixel-gray-light);
            --text-muted: var(--pixel-gray);
            --accent: var(--pixel-cyan);
            --accent-secondary: var(--pixel-yellow);
            --border-color: var(--pixel-gray-dark);

            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;

            --scanline-opacity: 0.03;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; }

        body {
            font-family: var(--font-body);
            font-size: 18px;
            color: var(--text-primary);
            background: var(--bg-surface);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,var(--scanline-opacity)) 2px,
                rgba(0,0,0,var(--scanline-opacity)) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── App Layout ─────────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 48px 220px 1fr 220px;
            grid-template-rows: 40px 1fr;
            height: 100vh;
            gap: 1px;
            background: #000;
        }

        .toolbar      { grid-column: 1 / -1; grid-row: 1; }
        .tool-panel   { grid-column: 1; grid-row: 2; }
        .left-panel   { grid-column: 2; grid-row: 2; }
        .canvas-area  { grid-column: 3; grid-row: 2; }
        .right-panel  { grid-column: 4; grid-row: 2; }

        /* ── Toolbar ────────────────────────────────────────────── */
        .toolbar {
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            border-bottom: 2px solid var(--border-color);
            overflow-x: auto;
        }

        .toolbar-title {
            font-family: var(--font-display);
            font-size: 8px;
            color: var(--accent);
            margin-right: 12px;
            text-shadow: 0 0 8px rgba(0,212,255,0.5);
            white-space: nowrap;
        }

        .toolbar-sep {
            width: 1px; height: 24px;
            background: var(--border-color);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text-primary);
            background: var(--pixel-gray-dark);
            border: 2px solid var(--border-color);
            padding: 3px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { background: #4a4a4a; border-color: var(--pixel-gray); }
        .btn:active { background: var(--pixel-gray); }
        .btn.accent { background: #0a2a3a; border-color: var(--pixel-blue); color: var(--accent); }
        .btn.accent:hover { background: #0d3a4a; }
        .btn:disabled { opacity: 0.35; cursor: default; }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .toolbar-label {
            font-family: var(--font-display);
            font-size: 7px;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .toolbar select, .toolbar input[type="number"] {
            font-family: var(--font-body);
            font-size: 16px;
            background: var(--pixel-black);
            color: var(--pixel-lime);
            border: 2px solid var(--border-color);
            padding: 2px 4px;
            cursor: pointer;
        }
        .toolbar input[type="number"] { width: 50px; text-align: center; }
        .toolbar select:focus, .toolbar input[type="number"]:focus { outline: none; border-color: var(--accent); }

        /* ── Tool Panel (left icons) ───────────────────────────── */
        .tool-panel {
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            gap: 2px;
            border-right: 2px solid var(--border-color);
        }

        .tool-btn {
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            position: relative;
        }
        .tool-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
        .tool-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(0,212,255,0.1);
            text-shadow: 0 0 6px rgba(0,212,255,0.4);
        }
        .tool-btn[title]::after {
            content: attr(title);
            position: absolute;
            left: 110%; top: 50%; transform: translateY(-50%);
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--accent);
            background: var(--pixel-black);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
        }
        .tool-btn:hover[title]::after { opacity: 1; }

        .tool-sep {
            width: 28px; height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        /* ── Left Panel (Layers) ──────────────────────────────── */
        .left-panel {
            background: var(--bg-panel);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            font-family: var(--font-display);
            font-size: 8px;
            color: var(--accent);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            text-shadow: 0 0 6px rgba(0,212,255,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header .btn { font-size: 13px; padding: 1px 6px; }

        .layer-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 16px;
        }
        .layer-item:hover { background: rgba(255,255,255,0.03); }
        .layer-item.active {
            border-color: var(--accent);
            background: rgba(0,212,255,0.08);
        }

        .layer-vis {
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--pixel-lime);
        }
        .layer-vis.hidden { color: var(--pixel-gray-dark); }

        .layer-name {
            flex: 1;
            font-family: var(--font-body);
            font-size: 16px;
        }

        .layer-opacity {
            width: 40px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
        }

        /* ── Canvas Area ──────────────────────────────────────── */
        .canvas-area {
            background: #080810;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
        }

        #mapCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        .canvas-info {
            position: absolute;
            bottom: 6px; left: 6px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            pointer-events: none;
            z-index: 10;
        }

        /* ── Right Panel (Tileset Palette) ────────────────────── */
        .right-panel {
            background: var(--bg-panel);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tileset-controls {
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .tileset-controls .btn { font-size: 14px; width: 100%; text-align: center; }

        .palette-grid {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px;
        }

        .palette-tile {
            border: 2px solid transparent;
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .palette-tile:hover { border-color: var(--pixel-gray); }
        .palette-tile.selected {
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(0,212,255,0.5);
        }

        /* ── Dialogs / Modals ─────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-panel);
            border: 2px solid var(--accent);
            padding: 20px;
            min-width: 320px;
            max-width: 90vw;
            box-shadow: 0 0 30px rgba(0,212,255,0.2);
        }

        .modal h3 {
            font-family: var(--font-display);
            font-size: 10px;
            color: var(--accent);
            margin-bottom: 16px;
            text-shadow: 0 0 8px rgba(0,212,255,0.4);
        }

        .modal label {
            display: block;
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal input[type="number"], .modal input[type="text"] {
            font-family: var(--font-body);
            font-size: 18px;
            background: var(--pixel-black);
            color: var(--pixel-lime);
            border: 2px solid var(--border-color);
            padding: 4px 8px;
            width: 100%;
            margin-bottom: 12px;
        }
        .modal input:focus { outline: none; border-color: var(--accent); }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        /* ── Selection marquee ────────────────────────────────── */
        .selection-overlay {
            position: absolute;
            pointer-events: none;
            border: 2px dashed var(--pixel-yellow);
            background: rgba(252,191,0,0.08);
            z-index: 5;
        }

        /* ── Scrollbar ────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-surface); }
        ::-webkit-scrollbar-thumb { background: var(--pixel-gray-dark); border: 1px solid var(--bg-surface); }
        ::-webkit-scrollbar-thumb:hover { background: var(--pixel-gray); }

        /* ── Responsive ───────────────────────────────────────── */
        @media (max-width: 900px) {
            .app {
                grid-template-columns: 40px 1fr 180px;
                grid-template-rows: 36px auto 1fr;
            }
            .toolbar { grid-column: 1 / -1; grid-row: 1; }
            .tool-panel { grid-column: 1; grid-row: 3; }
            .left-panel { grid-column: 1 / -1; grid-row: 2; flex-direction: row; border-right: none; border-bottom: 2px solid var(--border-color); max-height: 100px; }
            .layer-list { display: flex; overflow-x: auto; overflow-y: hidden; }
            .layer-item { white-space: nowrap; }
            .canvas-area { grid-column: 2; grid-row: 3; }
            .right-panel { grid-column: 3; grid-row: 3; }
        }

        @media (max-width: 600px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 36px auto 40px 1fr auto;
            }
            .toolbar { grid-column: 1; grid-row: 1; }
            .left-panel { grid-column: 1; grid-row: 2; flex-direction: row; border-right: none; border-bottom: 2px solid var(--border-color); max-height: 60px; }
            .tool-panel { grid-column: 1; grid-row: 3; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 2px solid var(--border-color); }
            .tool-sep { width: 1px; height: 28px; margin: 0 4px; }
            .canvas-area { grid-column: 1; grid-row: 4; }
            .right-panel { grid-column: 1; grid-row: 5; max-height: 160px; border-left: none; border-top: 2px solid var(--border-color); }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- ── Toolbar ─────────────────────────────────────────────── -->
    <div class="toolbar">
        <span class="toolbar-title">TILE MAP EDITOR</span>
        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn" id="btnNew" title="New Map">New</button>
            <button class="btn" id="btnResize" title="Resize Map">Resize</button>
        </div>
        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn accent" id="btnExportJSON" title="Export JSON">JSON</button>
            <button class="btn accent" id="btnExportPNG" title="Export PNG">PNG</button>
            <button class="btn" id="btnImportJSON" title="Import JSON">Import</button>
        </div>
        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
            <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
        </div>
        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
            <span class="toolbar-label">ZOOM</span>
            <button class="btn" id="btnZoomOut">-</button>
            <span id="zoomLevel" style="font-size:14px;color:var(--pixel-lime);min-width:36px;text-align:center;">100%</span>
            <button class="btn" id="btnZoomIn">+</button>
        </div>

        <div class="toolbar-group" style="margin-left:auto;">
            <input type="checkbox" id="showGrid" checked style="cursor:pointer;">
            <span class="toolbar-label" style="margin-right:0;">GRID</span>
        </div>
    </div>

    <!-- ── Tool Panel ──────────────────────────────────────────── -->
    <div class="tool-panel">
        <button class="tool-btn active" data-tool="paint" title="Paint (B)">&#9998;</button>
        <button class="tool-btn" data-tool="erase" title="Erase (E)">&#10006;</button>
        <button class="tool-btn" data-tool="fill" title="Flood Fill (G)">&#9687;</button>
        <button class="tool-btn" data-tool="rect" title="Rectangle Select (R)">&#9633;</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" data-tool="eyedrop" title="Eyedropper (I)">&#128270;</button>
        <button class="tool-btn" data-tool="pan" title="Pan (Space+Drag)">&#9995;</button>
    </div>

    <!-- ── Left Panel: Layers ──────────────────────────────────── -->
    <div class="left-panel">
        <div class="panel-header">
            <span>LAYERS</span>
            <span>
                <button class="btn" id="btnAddLayer" style="font-size:13px;padding:1px 6px;">+</button>
                <button class="btn" id="btnDelLayer" style="font-size:13px;padding:1px 6px;">-</button>
            </span>
        </div>
        <div class="layer-list" id="layerList"></div>
    </div>

    <!-- ── Canvas Area ─────────────────────────────────────────── -->
    <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mapCanvas"></canvas>
            <div class="canvas-info" id="canvasInfo">0, 0</div>
        </div>
    </div>

    <!-- ── Right Panel: Tileset Palette ────────────────────────── -->
    <div class="right-panel">
        <div class="panel-header">
            <span>TILESET</span>
        </div>
        <div class="tileset-controls">
            <button class="btn" id="btnLoadTileset">Upload Tileset PNG</button>
            <button class="btn" id="btnBuiltinTileset">Built-in Tileset</button>
            <input type="file" id="tilesetFileInput" accept="image/png,image/jpeg,image/gif" style="display:none;">
        </div>
        <div class="palette-grid" id="paletteGrid"></div>
    </div>
</div>

<!-- ── New Map Modal ───────────────────────────────────────────── -->
<div class="modal-overlay" id="newMapModal">
    <div class="modal">
        <h3>NEW MAP</h3>
        <label>Map Width (tiles)</label>
        <input type="number" id="inputMapW" value="20" min="1" max="256">
        <label>Map Height (tiles)</label>
        <input type="number" id="inputMapH" value="15" min="1" max="256">
        <label>Tile Size (px)</label>
        <input type="number" id="inputTileSize" value="16" min="4" max="128" step="1">
        <div class="modal-buttons">
            <button class="btn" id="btnNewCancel">Cancel</button>
            <button class="btn accent" id="btnNewOk">Create</button>
        </div>
    </div>
</div>

<!-- ── Resize Modal ────────────────────────────────────────────── -->
<div class="modal-overlay" id="resizeModal">
    <div class="modal">
        <h3>RESIZE MAP</h3>
        <label>New Width (tiles)</label>
        <input type="number" id="inputResizeW" min="1" max="256">
        <label>New Height (tiles)</label>
        <input type="number" id="inputResizeH" min="1" max="256">
        <div class="modal-buttons">
            <button class="btn" id="btnResizeCancel">Cancel</button>
            <button class="btn accent" id="btnResizeOk">Resize</button>
        </div>
    </div>
</div>

<script>
/* ==================================================================
   TILE MAP EDITOR — Self-contained vanilla JS
================================================================== */
(function() {
'use strict';

// ── State ────────────────────────────────────────────────────────
const state = {
    mapW: 20,
    mapH: 15,
    tileSize: 16,
    zoom: 2,
    panX: 0,
    panY: 0,
    tool: 'paint',
    showGrid: true,
    selectedTile: 1,
    activeLayer: 0,
    layers: [],
    tilesetImg: null,
    tilesetCols: 0,
    tilesetRows: 0,
    tilesetTileW: 16,
    tilesetTileH: 16,
    clipboard: null,
    selection: null,
    undoStack: [],
    redoStack: [],
    isPainting: false,
    lastPaintX: -1,
    lastPaintY: -1,
    isPanning: false,
    panStartX: 0,
    panStartY: 0,
    panStartPanX: 0,
    panStartPanY: 0,
    spaceDown: false,
    selStartX: -1,
    selStartY: -1,
};

const MAX_UNDO = 60;
let layerCacheDirty = true; // flag for render optimization
let layerCacheCanvas = null;
let layerCacheCtx = null;
let tilesetIsCustom = false; // track whether tileset is user-uploaded
let tilesetDataURI = null;   // store custom tileset as data URI

// ── DOM refs ─────────────────────────────────────────────────────
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const canvasArea = document.getElementById('canvasArea');
const canvasWrapper = document.getElementById('canvasWrapper');
const canvasInfo = document.getElementById('canvasInfo');
const layerListEl = document.getElementById('layerList');
const paletteGrid = document.getElementById('paletteGrid');

// ── Layer Definitions ────────────────────────────────────────────
const LAYER_DEFS = [
    { name: 'Ground',    color: '#4a9' },
    { name: 'Objects',   color: '#c84' },
    { name: 'Collision', color: '#e44' },
];

// ── Built-in Tileset Generation ──────────────────────────────────
function generateBuiltinTileset() {
    const ts = 16;
    const cols = 16;
    const rows = 8;
    const c = document.createElement('canvas');
    c.width = cols * ts;
    c.height = rows * ts;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;

    // Tile 0 = empty/transparent
    // We draw a small grid pattern for tiles in a retro style

    const tiles = [
        // 0: empty
        () => {},
        // 1: grass
        (x,y) => { g.fillStyle='#3a7a3a'; g.fillRect(x,y,ts,ts); g.fillStyle='#2d6b2d'; for(let i=0;i<6;i++){g.fillRect(x+Math.floor(Math.random()*14),y+Math.floor(Math.random()*14),2,2);} },
        // 2: dirt
        (x,y) => { g.fillStyle='#8b6914'; g.fillRect(x,y,ts,ts); g.fillStyle='#7a5c12'; g.fillRect(x+2,y+3,3,2); g.fillRect(x+9,y+10,4,2); g.fillRect(x+5,y+7,2,3); },
        // 3: stone
        (x,y) => { g.fillStyle='#888'; g.fillRect(x,y,ts,ts); g.fillStyle='#777'; g.fillRect(x,y,ts,ts/2); g.fillStyle='#999'; g.fillRect(x+1,y+1,6,6); g.fillRect(x+9,y+1,6,6); g.fillRect(x+4,y+9,8,6); },
        // 4: water
        (x,y) => { g.fillStyle='#2244aa'; g.fillRect(x,y,ts,ts); g.fillStyle='#3355bb'; g.fillRect(x+2,y+4,4,2); g.fillRect(x+8,y+10,5,2); },
        // 5: sand
        (x,y) => { g.fillStyle='#dbc07c'; g.fillRect(x,y,ts,ts); g.fillStyle='#c9af6a'; g.fillRect(x+3,y+5,2,1); g.fillRect(x+10,y+2,2,1); g.fillRect(x+7,y+12,3,1); },
        // 6: brick
        (x,y) => { g.fillStyle='#aa4422'; g.fillRect(x,y,ts,ts); g.fillStyle='#883311'; g.fillRect(x,y+7,ts,2); g.fillRect(x+7,y,2,7); g.fillRect(x+3,y+9,2,7); g.fillRect(x+11,y+9,2,7); },
        // 7: wood planks

        // 29: spike/hazard
        (x,y) => { g.fillStyle='#0000'; g.fillRect(x,y,ts,ts); g.fillStyle='#888'; g.fillRect(x,y+12,ts,4); g.fillStyle='#aaa'; for(let i=0;i<4;i++){g.fillRect(x+i*4+1,y+8,2,4);g.fillRect(x+i*4+2,y+6,1,2);} },
        // 30: ladder
        (x,y) => { g.fillStyle='#0000'; g.fillRect(x,y,ts,ts); g.fillStyle='#8a6a3a'; g.fillRect(x+4,y,2,ts); g.fillRect(x+10,y,2,ts); g.fillRect(x+4,y+3,8,2); g.fillRect(x+4,y+8,8,2); g.fillRect(x+4,y+13,8,2); },
        // 31: fence
        (x,y) => { g.fillStyle='#0000'; g.fillRect(x,y,ts,ts); g.fillStyle='#9a7a4a'; g.fillRect(x+1,y+4,2,12); g.fillRect(x+7,y+4,2,12); g.fillRect(x+13,y+4,2,12); g.fillRect(x,y+6,ts,2); g.fillRect(x,y+11,ts,2); g.fillStyle='#8a6a3a'; g.fillRect(x+1,y+3,2,2); g.fillRect(x+7,y+3,2,2); g.fillRect(x+13,y+3,2,2); },
        // 32-47: collision tiles (semi-transparent colored)
    ];

    // Draw collision markers: 32=solid, 33=top-only, 34=trigger, 35=damage
    const collisionTiles = [
        { label: 'WALL', color: 'rgba(255,50,50,0.6)' },
        { label: 'TOP',  color: 'rgba(255,200,50,0.6)' },
        { label: 'TRIG', color: 'rgba(50,150,255,0.6)' },
        { label: 'DMG',  color: 'rgba(255,100,200,0.6)' },
    ];

    // Reset random seed for consistent tiles
    const rng = (() => { let s=42; return ()=>{s=(s*16807+0)%2147483647; return(s-1)/2147483646;}; })();

    // Draw standard tiles
    for (let i = 0; i < tiles.length && i < cols * rows; i++) {
        const tx = (i % cols) * ts;
        const ty = Math.floor(i / cols) * ts;
        // Clear to transparency for object tiles
        g.clearRect(tx, ty, ts, ts);
        // Save random state and draw
        const oldRandom = Math.random;
        Math.random = rng;
        tiles[i](tx, ty);
        Math.random = oldRandom;
    }

    // Draw collision tiles
    for (let i = 0; i < collisionTiles.length; i++) {
        const idx = 32 + i;
        const tx = (idx % cols) * ts;
        const ty = Math.floor(idx / cols) * ts;
        g.clearRect(tx, ty, ts, ts);
        g.fillStyle = collisionTiles[i].color;
        g.fillRect(tx, ty, ts, ts);
        g.fillStyle = '#fff';
        g.font = '5px monospace';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText(collisionTiles[i].label, tx + ts/2, ty + ts/2);
    }

    return c;
}

// ── Initialize ───────────────────────────────────────────────────
function init() {
    loadBuiltinTileset();
    createNewMap(state.mapW, state.mapH, state.tileSize);
    bindEvents();
    render();
}

function loadBuiltinTileset() {
    const c = generateBuiltinTileset();
    tilesetIsCustom = false;
    tilesetDataURI = null;
    setTileset(c, 16, 16);
}

function setTileset(sourceCanvas, tw, th) {
    state.tilesetImg = sourceCanvas;
    state.tilesetTileW = tw;
    state.tilesetTileH = th;
    state.tilesetCols = Math.floor(sourceCanvas.width / tw);
    state.tilesetRows = Math.floor(sourceCanvas.height / th);
    state.selectedTile = 1;
    layerCacheDirty = true;
    buildPalette();
}

function createNewMap(w, h, ts) {
    state.mapW = w;
    state.mapH = h;
    state.tileSize = ts;
    state.layers = LAYER_DEFS.map((def, i) => ({
        name: def.name,
        color: def.color,
        visible: true,
        data: new Array(w * h).fill(0),
    }));
    state.activeLayer = 0;
    state.undoStack = [];
    state.redoStack = [];
    state.selection = null;
    state.clipboard = null;
    state.panX = 0;
    state.panY = 0;
    layerCacheDirty = true;
    buildLayerList();
    resizeCanvas();
    render();
}

function addLayer() {
    pushUndo();
    const idx = state.layers.length;
    const defaultColors = ['#4a9','#c84','#e44','#88f','#f8a','#8f8','#ff8'];
    state.layers.push({
        name: 'Layer ' + (idx + 1),
        color: defaultColors[idx % defaultColors.length],
        visible: true,
        data: new Array(state.mapW * state.mapH).fill(0),
    });
    state.activeLayer = state.layers.length - 1;
    layerCacheDirty = true;
    buildLayerList();
    render();
}

function deleteLayer() {
    if (state.layers.length <= 1) return;
    pushUndo();
    state.layers.splice(state.activeLayer, 1);
    if (state.activeLayer >= state.layers.length) {
        state.activeLayer = state.layers.length - 1;
    }
    layerCacheDirty = true;
    buildLayerList();
    render();
}

function resizeMap(newW, newH) {
    pushUndo();
    const oldW = state.mapW;
    const oldH = state.mapH;
    state.layers.forEach(layer => {
        const newData = new Array(newW * newH).fill(0);
        for (let y = 0; y < Math.min(oldH, newH); y++) {
            for (let x = 0; x < Math.min(oldW, newW); x++) {
                newData[y * newW + x] = layer.data[y * oldW + x];
            }
        }
        layer.data = newData;
    });
    state.mapW = newW;
    state.mapH = newH;
    state.selection = null;
    layerCacheDirty = true;
    resizeCanvas();
    render();
}

// ── Canvas setup ─────────────────────────────────────────────────
function resizeCanvas() {
    const pw = state.mapW * state.tileSize * state.zoom;
    const ph = state.mapH * state.tileSize * state.zoom;
    canvas.width = pw;
    canvas.height = ph;
    canvas.style.width = pw + 'px';
    canvas.style.height = ph + 'px';
    canvasWrapper.style.width = pw + 'px';
    canvasWrapper.style.height = ph + 'px';
    ctx.imageSmoothingEnabled = false;
}

// ── Undo / Redo ──────────────────────────────────────────────────
function pushUndo() {
    state.undoStack.push(state.layers.map(l => ({ ...l, data: l.data.slice() })));
    if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
    state.redoStack = [];
}

function undo() {
    if (!state.undoStack.length) return;
    state.redoStack.push(state.layers.map(l => ({ ...l, data: l.data.slice() })));
    state.layers = state.undoStack.pop();
    layerCacheDirty = true;
    buildLayerList();
    render();
}

function redo() {
    if (!state.redoStack.length) return;
    state.undoStack.push(state.layers.map(l => ({ ...l, data: l.data.slice() })));
    state.layers = state.redoStack.pop();
    layerCacheDirty = true;
    buildLayerList();
    render();
}

// ── Layer Panel ──────────────────────────────────────────────────
function buildLayerList() {
    layerListEl.innerHTML = '';
    // Render layers top-to-bottom (last = topmost)
    for (let i = state.layers.length - 1; i >= 0; i--) {
        const layer = state.layers[i];
        const el = document.createElement('div');
        el.className = 'layer-item' + (i === state.activeLayer ? ' active' : '');
        el.innerHTML = `
            <span class="layer-vis ${layer.visible ? '' : 'hidden'}" data-idx="${i}">${layer.visible ? '\u25C9' : '\u25CB'}</span>
            <span class="layer-name" style="color:${layer.color}">${layer.name}</span>
        `;
        el.addEventListener('click', (e) => {
            if (e.target.classList.contains('layer-vis')) {
                layer.visible = !layer.visible;
                layerCacheDirty = true;
                buildLayerList();
                render();
                return;
            }
            state.activeLayer = i;
            buildLayerList();
        });
        layerListEl.appendChild(el);
    }
}

// ── Palette ──────────────────────────────────────────────────────
function buildPalette() {
    paletteGrid.innerHTML = '';
    const total = state.tilesetCols * state.tilesetRows;
    const displaySize = 32;

    for (let i = 0; i < total; i++) {
        const tileCanvas = document.createElement('canvas');
        tileCanvas.width = displaySize;
        tileCanvas.height = displaySize;
        tileCanvas.className = 'palette-tile' + (i === state.selectedTile ? ' selected' : '');
        tileCanvas.style.width = displaySize + 'px';
        tileCanvas.style.height = displaySize + 'px';

        const tCtx = tileCanvas.getContext('2d');
        tCtx.imageSmoothingEnabled = false;

        // Draw checkerboard for transparency
        tCtx.fillStyle = '#222';
        tCtx.fillRect(0, 0, displaySize, displaySize);
        tCtx.fillStyle = '#333';
        for (let cy = 0; cy < displaySize; cy += 8) {
            for (let cx = 0; cx < displaySize; cx += 8) {
                if ((cx / 8 + cy / 8) % 2 === 0) tCtx.fillRect(cx, cy, 8, 8);
            }
        }

        if (i > 0 && state.tilesetImg) {
            const sx = (i % state.tilesetCols) * state.tilesetTileW;
            const sy = Math.floor(i / state.tilesetCols) * state.tilesetTileH;
            tCtx.drawImage(state.tilesetImg, sx, sy, state.tilesetTileW, state.tilesetTileH, 0, 0, displaySize, displaySize);
        }

        tileCanvas.addEventListener('click', () => {
            state.selectedTile = i;
            document.querySelectorAll('.palette-tile').forEach(t => t.classList.remove('selected'));
            tileCanvas.classList.add('selected');
        });

        paletteGrid.appendChild(tileCanvas);
    }
}

// ── Rendering ────────────────────────────────────────────────────
// Offscreen cache for layer tile data (rebuilt only when tiles change)
function rebuildLayerCache() {
    const ts = state.tileSize;
    const pw = state.mapW * ts;
    const ph = state.mapH * ts;

    if (!layerCacheCanvas || layerCacheCanvas.width !== pw || layerCacheCanvas.height !== ph) {
        layerCacheCanvas = document.createElement('canvas');
        layerCacheCanvas.width = pw;
        layerCacheCanvas.height = ph;
        layerCacheCtx = layerCacheCanvas.getContext('2d');
        layerCacheCtx.imageSmoothingEnabled = false;
    }

    const g = layerCacheCtx;
    g.clearRect(0, 0, pw, ph);

    // Checkerboard at 1x
    g.fillStyle = '#1a1a2e';
    g.fillRect(0, 0, pw, ph);
    g.fillStyle = '#151530';
    for (let y = 0; y < state.mapH; y++) {
        for (let x = 0; x < state.mapW; x++) {
            if ((x + y) % 2 === 0) g.fillRect(x * ts, y * ts, ts, ts);
        }
    }

    // Draw layers at 1x
    for (let li = 0; li < state.layers.length; li++) {
        const layer = state.layers[li];
        if (!layer.visible) continue;
        const alpha = li === state.layers.length - 1 && layer.name === 'Collision' ? 0.5 : 1;
        g.globalAlpha = alpha;
        for (let y = 0; y < state.mapH; y++) {
            for (let x = 0; x < state.mapW; x++) {
                const tile = layer.data[y * state.mapW + x];
                if (tile === 0 || !state.tilesetImg) continue;
                const sx = (tile % state.tilesetCols) * state.tilesetTileW;
                const sy = Math.floor(tile / state.tilesetCols) * state.tilesetTileH;
                g.drawImage(state.tilesetImg, sx, sy, state.tilesetTileW, state.tilesetTileH,
                    x * ts, y * ts, ts, ts);
            }
        }
        g.globalAlpha = 1;
    }
    layerCacheDirty = false;
}

function render() {
    const w = canvas.width;
    const h = canvas.height;
    const ts = state.tileSize * state.zoom;

    // Rebuild offscreen layer cache if tiles changed
    if (layerCacheDirty) rebuildLayerCache();

    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = false;

    // Blit cached layers scaled by zoom (single drawImage)
    if (layerCacheCanvas) {
        ctx.drawImage(layerCacheCanvas, 0, 0, w, h);
    }

    // Grid
    if (state.showGrid) {
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= state.mapW; x++) {
            ctx.moveTo(x * ts + 0.5, 0);
            ctx.lineTo(x * ts + 0.5, h);
        }
        for (let y = 0; y <= state.mapH; y++) {
            ctx.moveTo(0, y * ts + 0.5);
            ctx.lineTo(w, y * ts + 0.5);
        }
        ctx.stroke();

        // Active layer tinted grid
        if (state.activeLayer >= 0) {
            const lc = state.layers[state.activeLayer].color;
            ctx.strokeStyle = lc + '30';
            ctx.beginPath();
            for (let x = 0; x <= state.mapW; x++) {
                ctx.moveTo(x * ts + 0.5, 0);
                ctx.lineTo(x * ts + 0.5, h);
            }
            for (let y = 0; y <= state.mapH; y++) {
                ctx.moveTo(0, y * ts + 0.5);
                ctx.lineTo(w, y * ts + 0.5);
            }
            ctx.stroke();
        }
    }

    // Selection
    if (state.selection) {
        const s = state.selection;
        ctx.strokeStyle = '#fcbf00';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(s.x * ts, s.y * ts, s.w * ts, s.h * ts);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(252,191,0,0.08)';
        ctx.fillRect(s.x * ts, s.y * ts, s.w * ts, s.h * ts);
    }

    // Zoom indicator
    document.getElementById('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
}

// ── Tile coordinate from mouse event ─────────────────────────────
function getTileCoord(e) {
    const rect = canvas.getBoundingClientRect();
    const ts = state.tileSize * state.zoom;
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const tx = Math.floor(mx / ts);
    const ty = Math.floor(my / ts);
    return { tx: Math.max(0, Math.min(state.mapW - 1, tx)), ty: Math.max(0, Math.min(state.mapH - 1, ty)) };
}

// ── Tile operations ──────────────────────────────────────────────
function setTile(tx, ty, value) {
    if (tx < 0 || tx >= state.mapW || ty < 0 || ty >= state.mapH) return;
    const layer = state.layers[state.activeLayer];
    layer.data[ty * state.mapW + tx] = value;
    layerCacheDirty = true;
}

function getTile(tx, ty) {
    if (tx < 0 || tx >= state.mapW || ty < 0 || ty >= state.mapH) return -1;
    return state.layers[state.activeLayer].data[ty * state.mapW + tx];
}

function floodFill(tx, ty, newVal) {
    const layer = state.layers[state.activeLayer];
    const target = layer.data[ty * state.mapW + tx];
    if (target === newVal) return;

    // Scanline flood fill for better performance on large maps
    const w = state.mapW, h = state.mapH;
    const data = layer.data;
    const stack = [[tx, ty]];

    while (stack.length) {
        let [cx, cy] = stack.pop();
        if (cy < 0 || cy >= h) continue;
        // Move left to find span start
        while (cx > 0 && data[cy * w + cx - 1] === target) cx--;
        let spanAbove = false, spanBelow = false;
        while (cx < w && data[cy * w + cx] === target) {
            data[cy * w + cx] = newVal;
            if (!spanAbove && cy > 0 && data[(cy - 1) * w + cx] === target) {
                stack.push([cx, cy - 1]);
                spanAbove = true;
            } else if (spanAbove && cy > 0 && data[(cy - 1) * w + cx] !== target) {
                spanAbove = false;
            }
            if (!spanBelow && cy < h - 1 && data[(cy + 1) * w + cx] === target) {
                stack.push([cx, cy + 1]);
                spanBelow = true;
            } else if (spanBelow && cy < h - 1 && data[(cy + 1) * w + cx] !== target) {
                spanBelow = false;
            }
            cx++;
        }
    }
    layerCacheDirty = true;
}

// ── Mouse Handling ───────────────────────────────────────────────
function onCanvasMouseDown(e) {
    if (e.button === 1 || state.spaceDown) {
        // Middle click or space = pan
        state.isPanning = true;
        state.panStartX = e.clientX;
        state.panStartY = e.clientY;
        state.panStartScrollLeft = canvasArea.scrollLeft;
        state.panStartScrollTop = canvasArea.scrollTop;
        canvas.style.cursor = 'grabbing';
        e.preventDefault();
        return;
    }

    if (e.button !== 0) return;
    const { tx, ty } = getTileCoord(e);

    if (state.tool === 'pan') {
        state.isPanning = true;
        state.panStartX = e.clientX;
        state.panStartY = e.clientY;
        state.panStartScrollLeft = canvasArea.scrollLeft;
        state.panStartScrollTop = canvasArea.scrollTop;
        canvas.style.cursor = 'grabbing';
        return;
    }

    if (state.tool === 'paint') {
        pushUndo();
        state.isPainting = true;
        setTile(tx, ty, state.selectedTile);
        state.lastPaintX = tx;
        state.lastPaintY = ty;
        render();
    } else if (state.tool === 'erase') {
        pushUndo();
        state.isPainting = true;
        setTile(tx, ty, 0);
        state.lastPaintX = tx;
        state.lastPaintY = ty;
        render();
    } else if (state.tool === 'fill') {
        pushUndo();
        floodFill(tx, ty, state.selectedTile);
        render();
    } else if (state.tool === 'eyedrop') {
        const val = getTile(tx, ty);
        if (val >= 0) {
            state.selectedTile = val;
            document.querySelectorAll('.palette-tile').forEach(t => t.classList.remove('selected'));
            const tiles = document.querySelectorAll('.palette-tile');
            if (tiles[val]) tiles[val].classList.add('selected');
            // Switch back to paint
            state.tool = 'paint';
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-tool="paint"]').classList.add('active');
        }
    } else if (state.tool === 'rect') {
        state.selStartX = tx;
        state.selStartY = ty;
        state.selection = { x: tx, y: ty, w: 1, h: 1 };
        state.isPainting = true;
        render();
    }
}

function onCanvasMouseMove(e) {
    const { tx, ty } = getTileCoord(e);
    canvasInfo.textContent = `${tx}, ${ty}  [${state.layers[state.activeLayer].name}]`;

    if (state.isPanning) {
        const dx = e.clientX - state.panStartX;
        const dy = e.clientY - state.panStartY;
        canvasArea.scrollLeft = state.panStartScrollLeft - dx;
        canvasArea.scrollTop = state.panStartScrollTop - dy;
        return;
    }

    if (!state.isPainting) return;

    if (state.tool === 'paint') {
        // Bresenham line from last to current
        paintLine(state.lastPaintX, state.lastPaintY, tx, ty, state.selectedTile);
        state.lastPaintX = tx;
        state.lastPaintY = ty;
        render();
    } else if (state.tool === 'erase') {
        paintLine(state.lastPaintX, state.lastPaintY, tx, ty, 0);
        state.lastPaintX = tx;
        state.lastPaintY = ty;
        render();
    } else if (state.tool === 'rect') {
        const sx = Math.min(state.selStartX, tx);
        const sy = Math.min(state.selStartY, ty);
        const ex = Math.max(state.selStartX, tx);
        const ey = Math.max(state.selStartY, ty);
        state.selection = { x: sx, y: sy, w: ex - sx + 1, h: ey - sy + 1 };
        render();
    }
}

function onCanvasMouseUp(e) {
    if (state.isPanning) {
        state.isPanning = false;
        canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair';
        return;
    }
    state.isPainting = false;
    state.lastPaintX = -1;
    state.lastPaintY = -1;
}

function paintLine(x0, y0, x1, y1, value) {
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;

    while (true) {
        setTile(x0, y0, value);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
    }
}

// ── Zoom ─────────────────────────────────────────────────────────
function setZoom(z) {
    state.zoom = Math.max(0.5, Math.min(8, z));
    resizeCanvas();
    render();
}

// ── Export JSON ──────────────────────────────────────────────────
function exportJSON() {
    const tilesetInfo = {
        tileWidth: state.tilesetTileW,
        tileHeight: state.tilesetTileH,
        columns: state.tilesetCols,
        rows: state.tilesetRows,
        source: tilesetIsCustom ? 'custom' : 'builtin',
    };
    // Embed custom tileset as data URI for round-trip fidelity
    if (tilesetIsCustom && state.tilesetImg) {
        tilesetInfo.imageDataURI = state.tilesetImg.toDataURL('image/png');
    }

    const data = {
        version: 1,
        mapWidth: state.mapW,
        mapHeight: state.mapH,
        tileSize: state.tileSize,
        layers: state.layers.map(l => ({
            name: l.name,
            visible: l.visible,
            data: Array.from(l.data),
        })),
        tileset: tilesetInfo,
    };

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    downloadBlob(blob, 'tilemap.json');
}

// ── Import JSON ──────────────────────────────────────────────────
function importJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data.mapWidth || !data.mapHeight || !data.layers) {
                    alert('Invalid tilemap JSON');
                    return;
                }
                state.mapW = data.mapWidth;
                state.mapH = data.mapHeight;
                state.tileSize = data.tileSize || 16;
                const defaultColors = ['#4a9','#c84','#e44','#88f','#f8a','#8f8','#ff8'];
                state.layers = data.layers.map((l, i) => ({
                    name: l.name,
                    color: LAYER_DEFS[i] ? LAYER_DEFS[i].color : defaultColors[i % defaultColors.length],
                    visible: l.visible !== undefined ? l.visible : true,
                    data: l.data.slice(),
                }));
                state.activeLayer = 0;
                state.undoStack = [];
                state.redoStack = [];
                state.selection = null;
                layerCacheDirty = true;

                // Restore tileset from JSON
                if (data.tileset) {
                    if (data.tileset.source === 'custom' && data.tileset.imageDataURI) {
                        const img = new Image();
                        img.onload = () => {
                            const c = document.createElement('canvas');
                            c.width = img.width;
                            c.height = img.height;
                            const g = c.getContext('2d');
                            g.imageSmoothingEnabled = false;
                            g.drawImage(img, 0, 0);
                            tilesetIsCustom = true;
                            tilesetDataURI = data.tileset.imageDataURI;
                            setTileset(c, data.tileset.tileWidth || state.tileSize, data.tileset.tileHeight || state.tileSize);
                            resizeCanvas();
                            render();
                        };
                        img.src = data.tileset.imageDataURI;
                    } else {
                        // Rebuild built-in tileset with imported tile size
                        loadBuiltinTileset();
                    }
                }

                buildLayerList();
                resizeCanvas();
                render();
            } catch (err) {
                alert('Error parsing JSON: ' + err.message);
            }
        };
        reader.readAsText(file);
    });
    input.click();
}

// ── Export PNG ────────────────────────────────────────────────────
function exportPNG() {
    const ts = state.tileSize;
    const c = document.createElement('canvas');
    c.width = state.mapW * ts;
    c.height = state.mapH * ts;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;

    for (let li = 0; li < state.layers.length; li++) {
        const layer = state.layers[li];
        if (!layer.visible) continue;
        // skip collision layer in PNG export
        if (layer.name === 'Collision') continue;

        for (let y = 0; y < state.mapH; y++) {
            for (let x = 0; x < state.mapW; x++) {
                const tile = layer.data[y * state.mapW + x];
                if (tile === 0 || !state.tilesetImg) continue;

                const sx = (tile % state.tilesetCols) * state.tilesetTileW;
                const sy = Math.floor(tile / state.tilesetCols) * state.tilesetTileH;
                g.drawImage(state.tilesetImg, sx, sy, state.tilesetTileW, state.tilesetTileH,
                    x * ts, y * ts, ts, ts);
            }
        }
    }

    c.toBlob(blob => {
        downloadBlob(blob, 'tilemap.png');
    });
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ── Copy / Paste Selection ───────────────────────────────────────
function copySelection() {
    if (!state.selection) return;
    const s = state.selection;
    const layer = state.layers[state.activeLayer];
    const data = [];
    for (let y = 0; y < s.h; y++) {
        for (let x = 0; x < s.w; x++) {
            data.push(layer.data[(s.y + y) * state.mapW + (s.x + x)]);
        }
    }
    state.clipboard = { w: s.w, h: s.h, data };
}

function pasteSelection() {
    if (!state.clipboard || !state.selection) return;
    pushUndo();
    const c = state.clipboard;
    const s = state.selection;
    const layer = state.layers[state.activeLayer];
    for (let y = 0; y < c.h && (s.y + y) < state.mapH; y++) {
        for (let x = 0; x < c.w && (s.x + x) < state.mapW; x++) {
            layer.data[(s.y + y) * state.mapW + (s.x + x)] = c.data[y * c.w + x];
        }
    }
    layerCacheDirty = true;
    render();
}

function deleteSelection() {
    if (!state.selection) return;
    pushUndo();
    const s = state.selection;
    const layer = state.layers[state.activeLayer];
    for (let y = 0; y < s.h; y++) {
        for (let x = 0; x < s.w; x++) {
            if ((s.y + y) < state.mapH && (s.x + x) < state.mapW) {
                layer.data[(s.y + y) * state.mapW + (s.x + x)] = 0;
            }
        }
    }
    layerCacheDirty = true;
    render();
}

// ── Custom Tileset Upload ────────────────────────────────────────
function loadCustomTileset(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const dataURI = e.target.result;
        const img = new Image();
        img.onload = () => {
            const tw = state.tileSize;
            const th = state.tileSize;
            const c = document.createElement('canvas');
            c.width = img.width;
            c.height = img.height;
            const g = c.getContext('2d');
            g.imageSmoothingEnabled = false;
            g.drawImage(img, 0, 0);
            tilesetIsCustom = true;
            tilesetDataURI = dataURI;
            layerCacheDirty = true;
            setTileset(c, tw, th);
        };
        img.src = dataURI;
    };
    reader.readAsDataURL(file);
}

// ── Events ───────────────────────────────────────────────────────
function bindEvents() {
    // Tools
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.tool = btn.dataset.tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair';
        });
    });

    // Canvas
    canvas.addEventListener('mousedown', onCanvasMouseDown);
    canvas.addEventListener('mousemove', onCanvasMouseMove);
    window.addEventListener('mouseup', onCanvasMouseUp);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        onCanvasMouseDown({ clientX: t.clientX, clientY: t.clientY, button: 0, preventDefault(){} });
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        onCanvasMouseMove({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
        onCanvasMouseUp({});
    });

    // Wheel zoom
    canvasArea.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.5 : 0.5;
            setZoom(state.zoom + delta);
        }
    }, { passive: false });

    // Toolbar buttons
    document.getElementById('btnNew').addEventListener('click', () => {
        document.getElementById('inputMapW').value = state.mapW;
        document.getElementById('inputMapH').value = state.mapH;
        document.getElementById('inputTileSize').value = state.tileSize;
        document.getElementById('newMapModal').classList.add('open');
    });

    document.getElementById('btnNewCancel').addEventListener('click', () => {
        document.getElementById('newMapModal').classList.remove('open');
    });

    document.getElementById('btnNewOk').addEventListener('click', () => {
        const w = parseInt(document.getElementById('inputMapW').value) || 20;
        const h = parseInt(document.getElementById('inputMapH').value) || 15;
        const ts = parseInt(document.getElementById('inputTileSize').value) || 16;
        createNewMap(w, h, ts);
        document.getElementById('newMapModal').classList.remove('open');
    });

    document.getElementById('btnResize').addEventListener('click', () => {
        document.getElementById('inputResizeW').value = state.mapW;
        document.getElementById('inputResizeH').value = state.mapH;
        document.getElementById('resizeModal').classList.add('open');
    });

    document.getElementById('btnResizeCancel').addEventListener('click', () => {
        document.getElementById('resizeModal').classList.remove('open');
    });

    document.getElementById('btnResizeOk').addEventListener('click', () => {
        const w = parseInt(document.getElementById('inputResizeW').value) || state.mapW;
        const h = parseInt(document.getElementById('inputResizeH').value) || state.mapH;
        resizeMap(w, h);
        document.getElementById('resizeModal').classList.remove('open');
    });

    document.getElementById('btnExportJSON').addEventListener('click', exportJSON);
    document.getElementById('btnExportPNG').addEventListener('click', exportPNG);
    document.getElementById('btnImportJSON').addEventListener('click', importJSON);
    document.getElementById('btnUndo').addEventListener('click', undo);
    document.getElementById('btnRedo').addEventListener('click', redo);

    document.getElementById('btnZoomIn').addEventListener('click', () => setZoom(state.zoom + 0.5));
    document.getElementById('btnZoomOut').addEventListener('click', () => setZoom(state.zoom - 0.5));

    document.getElementById('showGrid').addEventListener('change', (e) => {
        state.showGrid = e.target.checked;
        render();
    });

    // Tileset
    document.getElementById('btnLoadTileset').addEventListener('click', () => {
        document.getElementById('tilesetFileInput').click();
    });

    document.getElementById('tilesetFileInput').addEventListener('change', (e) => {
        if (e.target.files[0]) loadCustomTileset(e.target.files[0]);
    });

    document.getElementById('btnBuiltinTileset').addEventListener('click', () => {
        loadBuiltinTileset();
    });

    // Layer add/delete
    document.getElementById('btnAddLayer').addEventListener('click', addLayer);
    document.getElementById('btnDelLayer').addEventListener('click', deleteLayer);

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
        // Don't capture if a modal input is focused
        if (e.target.tagName === 'INPUT') return;

        if (e.key === ' ') { state.spaceDown = true; canvas.style.cursor = 'grab'; e.preventDefault(); }
        if (e.key === 'b' || e.key === 'B') selectTool('paint');
        if (e.key === 'e' || e.key === 'E') selectTool('erase');
        if (e.key === 'g' || e.key === 'G') selectTool('fill');
        if (e.key === 'r' || e.key === 'R') selectTool('rect');
        if (e.key === 'i' || e.key === 'I') selectTool('eyedrop');

        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); copySelection(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'v') { e.preventDefault(); pasteSelection(); }
        if (e.key === 'Delete' || e.key === 'Backspace') { if (state.selection) { e.preventDefault(); deleteSelection(); } }
        if (e.key === 'Escape') { state.selection = null; render(); }

        if (e.key === '+' || e.key === '=') setZoom(state.zoom + 0.5);
        if (e.key === '-') setZoom(state.zoom - 0.5);
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === ' ') {
            state.spaceDown = false;
            canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair';
        }
    });

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

}

function selectTool(tool) {
    state.tool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`[data-tool="${tool}"]`);
    if (btn) btn.classList.add('active');
    canvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
}

// ── Boot ─────────────────────────────────────────────────────────
init();

})();
</script>
</body>
</html>
