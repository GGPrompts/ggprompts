<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette from Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1a20;
            --bg-secondary: #22222a;
            --bg-tertiary: #2a2a34;
            --bg-elevated: #32323e;
            --border: #3a3a48;
            --border-hover: #5a5a6e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b4;
            --text-muted: #6e6e82;
            --accent: #7c6df0;
            --accent-light: #9b8cf8;
            --accent-dim: #5a4ec0;
            --success: #4ecdc4;
            --warning: #fbbf24;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            --transition: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Layout ─────────────────────────────────────── */
        .app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color var(--transition);
        }
        .back-link:hover { color: var(--accent-light); }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, var(--accent-light), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        /* ── Drop Zone ──────────────────────────────────── */
        .upload-section {
            margin-bottom: 2rem;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
            background: var(--bg-secondary);
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(124, 109, 240, 0.06);
        }

        .drop-zone-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: block;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .drop-zone:hover .drop-zone-icon,
        .drop-zone.dragover .drop-zone-icon {
            color: var(--accent-light);
        }

        .drop-zone-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .drop-zone-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ── Image Preview ──────────────────────────────── */
        .preview-area {
            display: none;
            margin-bottom: 2rem;
        }

        .preview-area.visible { display: block; }

        .preview-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .preview-header h3 {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .btn-change {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: var(--accent-light);
            background: none;
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius-sm);
            padding: 0.3rem 0.75rem;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-change:hover {
            background: rgba(124, 109, 240, 0.15);
            border-color: var(--accent-light);
        }

        .preview-img {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: var(--radius-md);
            background: repeating-conic-gradient(#2a2a34 0% 25%, #22222a 0% 50%) 50% / 16px 16px;
        }

        /* ── Controls ───────────────────────────────────── */
        .controls {
            display: none;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem 1.5rem;
        }

        .controls.visible {
            display: flex;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-tertiary);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .slider-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-light);
            min-width: 1.8em;
            text-align: center;
        }

        .btn {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--accent-dim);
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn:hover { background: var(--accent); }

        /* ── Palette Display ────────────────────────────── */
        .palette-section {
            display: none;
            margin-bottom: 2rem;
        }

        .palette-section.visible { display: block; }

        .palette-heading {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }

        .palette-strip {
            display: flex;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 1.5rem;
            height: 80px;
            box-shadow: var(--shadow-card);
        }

        .strip-swatch {
            flex: 1;
            cursor: pointer;
            position: relative;
            transition: flex var(--transition);
        }

        .strip-swatch:hover {
            flex: 1.8;
        }

        .strip-swatch::after {
            content: attr(data-hex);
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity var(--transition);
            white-space: nowrap;
            pointer-events: none;
        }

        .strip-swatch:hover::after {
            opacity: 1;
        }

        .strip-swatch.light-bg::after {
            color: rgba(0,0,0,0.7);
            background: rgba(255,255,255,0.6);
        }

        .strip-swatch.dark-bg::after {
            color: rgba(255,255,255,0.9);
            background: rgba(0,0,0,0.4);
        }

        /* ── Swatch Cards ───────────────────────────────── */
        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .swatch-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
        }

        .swatch-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-hover);
        }

        .swatch-color {
            height: 100px;
            position: relative;
        }

        .swatch-color .copy-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .swatch-color .copy-hint.light-text {
            color: rgba(255,255,255,0.9);
            background: rgba(0,0,0,0.2);
        }

        .swatch-color .copy-hint.dark-text {
            color: rgba(0,0,0,0.7);
            background: rgba(255,255,255,0.2);
        }

        .swatch-card:hover .copy-hint {
            opacity: 1;
        }

        .swatch-info {
            padding: 0.75rem;
        }

        .swatch-hex {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }

        .swatch-detail {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ── CSS Export ─────────────────────────────────── */
        .export-section {
            display: none;
            margin-bottom: 2rem;
        }

        .export-section.visible { display: block; }

        .export-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .export-header span {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .btn-copy {
            font-family: var(--font-ui);
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--success);
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.25);
            border-radius: var(--radius-sm);
            padding: 0.35rem 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-copy:hover {
            background: rgba(78, 205, 196, 0.2);
            border-color: var(--success);
        }
        .btn-copy.copied {
            color: var(--warning);
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.1);
        }

        .export-code {
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.7;
            color: var(--text-secondary);
            white-space: pre;
            overflow-x: auto;
        }

        .export-code .prop-name { color: var(--accent-light); }
        .export-code .prop-value { color: var(--success); }
        .export-code .bracket { color: var(--text-muted); }

        /* ── Toast ──────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Hidden Canvas ──────────────────────────────── */
        #hidden-canvas { display: none; }

        /* ── Loading ────────────────────────────────────── */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 32, 0.7);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 768px) {
            .app { padding: 1.5rem 1rem 3rem; }
            header h1 { font-size: 1.5rem; }
            .drop-zone { padding: 2rem 1rem; }
            .preview-img { max-height: 240px; }
            .palette-strip { height: 60px; }
            .swatch-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .swatch-color { height: 72px; }
            input[type="range"] { width: 100px; }
            .controls { gap: 1rem; padding: 0.75rem 1rem; }
            .export-code { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="app">
        <a href="../index.html" class="back-link">&larr; Creative Tools</a>

        <header>
            <h1>Color Palette from Image</h1>
            <p>Extract dominant colors from any image using median-cut quantization</p>
        </header>

        <!-- Drop Zone -->
        <div class="upload-section">
            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-icon">&#127912;</span>
                <div class="drop-zone-text">Drop an image here or click to browse</div>
                <div class="drop-zone-hint">JPG, PNG, GIF, WebP</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp">
            </div>
        </div>

        <!-- Image Preview -->
        <div class="preview-area" id="previewArea">
            <div class="preview-container">
                <div class="preview-header">
                    <h3>Source Image</h3>
                    <button class="btn-change" id="btnChangeImage">Change Image</button>
                </div>
                <img class="preview-img" id="previewImg" alt="Uploaded image preview">
            </div>
        </div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <div class="control-group">
                <label for="paletteSize">Palette size</label>
                <div class="slider-wrap">
                    <input type="range" id="paletteSize" min="3" max="12" value="6">
                    <span class="slider-value" id="paletteSizeValue">6</span>
                </div>
            </div>
            <button class="btn" id="btnExtract">Re-extract Colors</button>
        </div>

        <!-- Palette Strip -->
        <div class="palette-section" id="paletteSection">
            <h3 class="palette-heading">Extracted Palette</h3>
            <div class="palette-strip" id="paletteStrip"></div>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>

        <!-- CSS Export -->
        <div class="export-section" id="exportSection">
            <div class="export-box">
                <div class="export-header">
                    <span>CSS Custom Properties</span>
                    <button class="btn-copy" id="btnCopyCSS">Copy CSS</button>
                </div>
                <div class="export-code" id="exportCode"></div>
            </div>
        </div>
    </div>

    <canvas id="hidden-canvas"></canvas>
    <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        /* ── DOM refs ───────────────────────────────────── */
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        const btnChangeImage = document.getElementById('btnChangeImage');
        const controls = document.getElementById('controls');
        const paletteSizeSlider = document.getElementById('paletteSize');
        const paletteSizeValue = document.getElementById('paletteSizeValue');
        const btnExtract = document.getElementById('btnExtract');
        const paletteSection = document.getElementById('paletteSection');
        const paletteStrip = document.getElementById('paletteStrip');
        const swatchGrid = document.getElementById('swatchGrid');
        const exportSection = document.getElementById('exportSection');
        const exportCode = document.getElementById('exportCode');
        const btnCopyCSS = document.getElementById('btnCopyCSS');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const toast = document.getElementById('toast');
        const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

        let currentPixels = null;
        let currentPalette = [];

        /* ── Toast ──────────────────────────────────────── */
        let toastTimeout = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        /* ── Drop zone events ───────────────────────────── */
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleFile(file);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) handleFile(fileInput.files[0]);
        });
        btnChangeImage.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        /* ── Controls ───────────────────────────────────── */
        paletteSizeSlider.addEventListener('input', () => {
            paletteSizeValue.textContent = paletteSizeSlider.value;
        });
        btnExtract.addEventListener('click', () => {
            if (currentPixels) extractAndRender();
        });
        btnCopyCSS.addEventListener('click', copyCSS);

        /* ── File handling ──────────────────────────────── */
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    previewImg.src = e.target.result;
                    previewArea.classList.add('visible');
                    dropZone.parentElement.style.display = 'none';
                    controls.classList.add('visible');
                    loadImagePixels(img);
                    extractAndRender();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        /* ── Load pixels from image ─────────────────────── */
        function loadImagePixels(img) {
            // Scale down for performance: max 300px on longest side
            const maxDim = 300;
            let w = img.naturalWidth;
            let h = img.naturalHeight;
            if (w > maxDim || h > maxDim) {
                const scale = maxDim / Math.max(w, h);
                w = Math.round(w * scale);
                h = Math.round(h * scale);
            }
            hiddenCanvas.width = w;
            hiddenCanvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);

            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            const pixels = [];
            // Sample every 4th pixel for extra speed
            const step = 4;
            for (let i = 0; i < data.length; i += 4 * step) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];
                // Skip fully transparent pixels
                if (a < 128) continue;
                pixels.push([r, g, b]);
            }
            currentPixels = pixels;
        }

        /* ── Median-Cut Quantization ────────────────────── */
        function medianCut(pixels, numColors) {
            if (pixels.length === 0) return [];

            // A bucket holds a list of [r,g,b] pixels
            function makeBox(pxls) {
                let rMin = 255, rMax = 0;
                let gMin = 255, gMax = 0;
                let bMin = 255, bMax = 0;
                for (let i = 0; i < pxls.length; i++) {
                    const p = pxls[i];
                    if (p[0] < rMin) rMin = p[0];
                    if (p[0] > rMax) rMax = p[0];
                    if (p[1] < gMin) gMin = p[1];
                    if (p[1] > gMax) gMax = p[1];
                    if (p[2] < bMin) bMin = p[2];
                    if (p[2] > bMax) bMax = p[2];
                }
                return {
                    pixels: pxls,
                    rMin, rMax, gMin, gMax, bMin, bMax,
                    rRange: rMax - rMin,
                    gRange: gMax - gMin,
                    bRange: bMax - bMin
                };
            }

            function splitBox(box) {
                const { rRange, gRange, bRange } = box;
                let channel;
                if (rRange >= gRange && rRange >= bRange) channel = 0;
                else if (gRange >= rRange && gRange >= bRange) channel = 1;
                else channel = 2;

                // Sort pixels along the channel with the widest range
                box.pixels.sort((a, b) => a[channel] - b[channel]);

                const mid = Math.floor(box.pixels.length / 2);
                return [
                    makeBox(box.pixels.slice(0, mid)),
                    makeBox(box.pixels.slice(mid))
                ];
            }

            function boxVolume(box) {
                return (box.rRange + 1) * (box.gRange + 1) * (box.bRange + 1);
            }

            // Start with one box containing all pixels
            let boxes = [makeBox(pixels)];

            // Iteratively split the box with the largest color range
            while (boxes.length < numColors) {
                // Find the box with the largest volume (most color variation)
                let bestIdx = 0;
                let bestVolume = 0;
                for (let i = 0; i < boxes.length; i++) {
                    // Only split boxes with more than 1 pixel
                    if (boxes[i].pixels.length < 2) continue;
                    const vol = boxVolume(boxes[i]);
                    if (vol > bestVolume) {
                        bestVolume = vol;
                        bestIdx = i;
                    }
                }
                if (boxes[bestIdx].pixels.length < 2) break;

                const toSplit = boxes.splice(bestIdx, 1)[0];
                const [a, b] = splitBox(toSplit);
                boxes.push(a, b);
            }

            // Average each box to get the palette color
            return boxes.map(box => {
                let rSum = 0, gSum = 0, bSum = 0;
                for (let i = 0; i < box.pixels.length; i++) {
                    rSum += box.pixels[i][0];
                    gSum += box.pixels[i][1];
                    bSum += box.pixels[i][2];
                }
                const n = box.pixels.length;
                return [
                    Math.round(rSum / n),
                    Math.round(gSum / n),
                    Math.round(bSum / n)
                ];
            });
        }

        /* ── Color helpers ──────────────────────────────── */
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s;
            const l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return [
                Math.round(h * 360),
                Math.round(s * 100),
                Math.round(l * 100)
            ];
        }

        function relativeLuminance(r, g, b) {
            const srgb = [r, g, b].map(c => {
                c /= 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
        }

        function isLight(r, g, b) {
            return relativeLuminance(r, g, b) > 0.4;
        }

        /* ── Sort palette for visual harmony ────────────── */
        function sortPaletteByHue(palette) {
            return palette.slice().sort((a, b) => {
                const hslA = rgbToHsl(a[0], a[1], a[2]);
                const hslB = rgbToHsl(b[0], b[1], b[2]);
                // Sort by hue, then lightness
                if (hslA[0] !== hslB[0]) return hslA[0] - hslB[0];
                return hslA[2] - hslB[2];
            });
        }

        /* ── Extract and render ─────────────────────────── */
        function extractAndRender() {
            if (!currentPixels || currentPixels.length === 0) return;

            loadingOverlay.classList.add('visible');

            // Use requestAnimationFrame so loading overlay shows before blocking
            requestAnimationFrame(() => {
                const numColors = parseInt(paletteSizeSlider.value, 10);
                let palette = medianCut(currentPixels, numColors);
                palette = sortPaletteByHue(palette);
                currentPalette = palette;

                renderPaletteStrip(palette);
                renderSwatchCards(palette);
                renderExportCSS(palette);

                paletteSection.classList.add('visible');
                exportSection.classList.add('visible');
                loadingOverlay.classList.remove('visible');
            });
        }

        /* ── Render palette strip ───────────────────────── */
        function renderPaletteStrip(palette) {
            paletteStrip.innerHTML = '';
            palette.forEach(([r, g, b]) => {
                const hex = rgbToHex(r, g, b);
                const div = document.createElement('div');
                div.className = 'strip-swatch ' + (isLight(r, g, b) ? 'light-bg' : 'dark-bg');
                div.style.backgroundColor = hex;
                div.setAttribute('data-hex', hex);
                div.addEventListener('click', () => {
                    copyToClipboard(hex);
                    showToast('Copied ' + hex);
                });
                paletteStrip.appendChild(div);
            });
        }

        /* ── Render swatch cards ────────────────────────── */
        function renderSwatchCards(palette) {
            swatchGrid.innerHTML = '';
            palette.forEach(([r, g, b], i) => {
                const hex = rgbToHex(r, g, b);
                const hsl = rgbToHsl(r, g, b);
                const light = isLight(r, g, b);

                const card = document.createElement('div');
                card.className = 'swatch-card';
                card.innerHTML = `
                    <div class="swatch-color" style="background-color: ${hex}">
                        <div class="copy-hint ${light ? 'dark-text' : 'light-text'}">Click to copy</div>
                    </div>
                    <div class="swatch-info">
                        <div class="swatch-hex">${hex.toUpperCase()}</div>
                        <div class="swatch-detail">
                            rgb(${r}, ${g}, ${b})<br>
                            hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    copyToClipboard(hex);
                    showToast('Copied ' + hex.toUpperCase());
                });
                swatchGrid.appendChild(card);
            });
        }

        /* ── Render CSS export ──────────────────────────── */
        function renderExportCSS(palette) {
            let lines = '<span class="bracket">:root {</span>\n';
            palette.forEach(([r, g, b], i) => {
                const hex = rgbToHex(r, g, b);
                lines += '  <span class="prop-name">--color-' + (i + 1) + '</span>: <span class="prop-value">' + hex + '</span>;\n';
            });
            lines += '<span class="bracket">}</span>';
            exportCode.innerHTML = lines;
        }

        function getCSSText() {
            let text = ':root {\n';
            currentPalette.forEach(([r, g, b], i) => {
                text += '  --color-' + (i + 1) + ': ' + rgbToHex(r, g, b) + ';\n';
            });
            text += '}';
            return text;
        }

        /* ── Copy helpers ───────────────────────────────── */
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        function copyCSS() {
            const text = getCSSText();
            copyToClipboard(text);
            btnCopyCSS.textContent = 'Copied!';
            btnCopyCSS.classList.add('copied');
            showToast('CSS copied to clipboard');
            setTimeout(() => {
                btnCopyCSS.textContent = 'Copy CSS';
                btnCopyCSS.classList.remove('copied');
            }, 2000);
        }
    })();
    </script>
    <script defer src="../../prompt-viewer.js"></script>
</body>
</html>
