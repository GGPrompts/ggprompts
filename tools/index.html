<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-display: 'Playfair Display', serif;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'EB Garamond', serif;

            --powder-pink: #f2c6d0;
            --baby-blue: #b5d4e8;
            --mint: #c2e0c6;
            --cream: #fdf8ef;
            --cream-warm: #faf3e3;
            --ivory: #fffef7;
            --gold: #c9a84c;
            --gold-light: #e3cf8a;
            --gold-dark: #a07d2e;
            --rose: #c96b7a;
            --lavender: #c8b8db;
            --champagne: #f7e7ce;

            --text-primary: #4a3728;
            --text-secondary: #7c6456;
            --text-muted: #a89484;
            --bg-primary: var(--cream);
            --bg-card: var(--ivory);

            --shadow-card: 0 6px 30px rgba(201, 168, 76, 0.15), 0 2px 8px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 40px rgba(201, 168, 76, 0.22), 0 4px 12px rgba(0,0,0,0.06);
            --gradient-gold: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* ── Header ──────────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .ornament {
            display: block;
            text-align: center;
            font-size: 1.5rem;
            color: var(--gold);
            margin: 1rem 0 2rem;
            letter-spacing: 8px;
        }

        .back-link {
            display: inline-block;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--gold); }

        /* ── Card Grid ───────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 20px;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-primary);
            display: block;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-gold);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .card h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .card .tag {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--gold-dark);
            background: rgba(201, 168, 76, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Animator card — darkroom accent */
        .card-animator {
            background: linear-gradient(135deg, #fffef7 0%, #faf3e3 50%, #f5ebe0 100%);
        }
        .card-animator::before {
            background: linear-gradient(135deg, #6b1515, #8b1e1e, #c43c3c, #d94545);
        }

        /* ── Footer ──────────────────────────────────────────── */
        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(201, 168, 76, 0.2);
        }

        footer p {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        @media (max-width: 768px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">&larr; HTML Style Guides</a>

        <header>
            <h1>Creative Tools</h1>
            <p class="subtitle">Interactive editors and creative instruments</p>
            <span class="ornament">&loz; &loz; &loz;</span>
        </header>

        <div class="grid">
            <a href="animator/index.html" class="card card-animator">
                <span class="card-icon">&#9876;</span>
                <h2>Stick Figure Animation Studio</h2>
                <p>Pose, keyframe, and animate stick figures with inverse kinematics. Export your creations as GIF. Powered by the StickFight engine.</p>
                <span class="tag">Darkroom theme</span>
            </a>
        </div>

        <footer>
            <p>More tools coming soon&hellip;</p>
        </footer>
    </div>
</body>
</html>
