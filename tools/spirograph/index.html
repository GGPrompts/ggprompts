<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Spirograph - Psychedelic Hypotrochoid Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Fredoka:wght@400;500;600;700&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-display: 'Righteous', cursive;
    --font-heading: 'Fredoka', sans-serif;
    --font-body: 'Josefin Sans', sans-serif;

    --acid-orange: #ff6b00;
    --electric-purple: #9b30ff;
    --lime-green: #39ff14;
    --hot-magenta: #ff1493;
    --sunshine-yellow: #ffed00;
    --cosmic-blue: #00bfff;
    --tangerine: #ff9966;
    --grape: #6b3fa0;
    --deep-violet: #1a0033;
    --cream: #fff8dc;

    --gradient-sunset: linear-gradient(135deg, var(--acid-orange), var(--hot-magenta), var(--electric-purple));
    --gradient-acid: linear-gradient(45deg, var(--lime-green), var(--sunshine-yellow), var(--acid-orange));
    --gradient-cosmic: linear-gradient(135deg, var(--cosmic-blue), var(--electric-purple), var(--hot-magenta));
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font-body);
    background: var(--deep-violet);
    color: var(--cream);
    -webkit-user-select: none;
    user-select: none;
  }

  /* Subtle animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(155, 48, 255, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(255, 20, 147, 0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(0, 191, 255, 0.08) 0%, transparent 60%);
  }

  /* ---- Layout ---- */
  #app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    background: rgba(26, 0, 51, 0.95);
    border-right: 2px solid rgba(155, 48, 255, 0.3);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #sidebar::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--grape); border-radius: 3px; }

  .sidebar-header {
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(155, 48, 255, 0.25);
  }

  .sidebar-header h1 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    background: var(--gradient-sunset);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .sidebar-header .tagline {
    font-family: var(--font-heading);
    font-size: 0.8rem;
    color: var(--cosmic-blue);
    opacity: 0.7;
    margin-top: 2px;
  }

  .back-link {
    font-size: 0.8rem;
    color: rgba(255, 248, 220, 0.5);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--cosmic-blue); }

  /* ---- Control Groups ---- */
  .ctrl-group {
    background: rgba(107, 63, 160, 0.15);
    border: 1px solid rgba(155, 48, 255, 0.2);
    border-radius: 12px;
    padding: 14px;
  }

  .ctrl-group h3 {
    font-family: var(--font-heading);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sunshine-yellow);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  /* ---- Sliders ---- */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .slider-row:last-child { margin-bottom: 0; }

  .slider-row label {
    font-size: 0.78rem;
    font-weight: 600;
    min-width: 68px;
    color: rgba(255, 248, 220, 0.8);
  }

  .slider-row input[type="range"] {
    flex: 1;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(155, 48, 255, 0.3);
    border-radius: 3px;
    outline: none;
  }

  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gradient-acid);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
  }

  .slider-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--lime-green);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
  }

  .slider-val {
    font-size: 0.75rem;
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--lime-green);
    min-width: 32px;
    text-align: right;
  }

  /* ---- Preset Buttons ---- */
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .preset-btn {
    font-family: var(--font-heading);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 6px 4px;
    border: 1px solid rgba(155, 48, 255, 0.4);
    border-radius: 8px;
    background: rgba(107, 63, 160, 0.25);
    color: var(--cream);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .preset-btn:hover {
    background: rgba(155, 48, 255, 0.4);
    border-color: var(--electric-purple);
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(155, 48, 255, 0.3);
  }

  .preset-btn:active { transform: scale(0.95); }

  /* ---- Color Mode ---- */
  .color-mode-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .color-mode-btn {
    flex: 1;
    font-family: var(--font-heading);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 6px 2px;
    border: 1px solid rgba(155, 48, 255, 0.3);
    border-radius: 8px;
    background: rgba(107, 63, 160, 0.15);
    color: rgba(255, 248, 220, 0.6);
    cursor: pointer;
    transition: all 0.15s;
  }

  .color-mode-btn.active {
    background: rgba(155, 48, 255, 0.4);
    border-color: var(--electric-purple);
    color: var(--cream);
    box-shadow: 0 0 8px rgba(155, 48, 255, 0.3);
  }

  .color-picker-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .color-picker-row label {
    font-size: 0.78rem;
    color: rgba(255, 248, 220, 0.8);
  }

  .color-picker-row input[type="color"] {
    width: 40px;
    height: 28px;
    border: 1px solid rgba(155, 48, 255, 0.4);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  /* ---- Action Buttons ---- */
  .action-row {
    display: flex;
    gap: 8px;
  }

  .action-btn {
    flex: 1;
    font-family: var(--font-heading);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .action-btn:hover { transform: translateY(-1px); }
  .action-btn:active { transform: translateY(1px); }

  .btn-draw {
    background: var(--gradient-acid);
    color: var(--deep-violet);
    box-shadow: 0 2px 12px rgba(57, 255, 20, 0.3);
  }
  .btn-draw:hover { box-shadow: 0 4px 20px rgba(57, 255, 20, 0.5); }

  .btn-clear {
    background: rgba(255, 20, 147, 0.2);
    color: var(--hot-magenta);
    border: 1px solid rgba(255, 20, 147, 0.4);
  }
  .btn-clear:hover { background: rgba(255, 20, 147, 0.35); }

  .btn-save {
    background: rgba(0, 191, 255, 0.2);
    color: var(--cosmic-blue);
    border: 1px solid rgba(0, 191, 255, 0.4);
  }
  .btn-save:hover { background: rgba(0, 191, 255, 0.35); }

  .btn-animate {
    background: var(--gradient-sunset);
    color: white;
    box-shadow: 0 2px 12px rgba(255, 20, 147, 0.3);
  }
  .btn-animate.active {
    box-shadow: 0 0 20px rgba(255, 20, 147, 0.6), 0 0 40px rgba(255, 107, 0, 0.3);
  }

  .btn-random {
    background: var(--gradient-cosmic);
    color: white;
    box-shadow: 0 2px 12px rgba(0, 191, 255, 0.3);
  }
  .btn-random:hover { box-shadow: 0 4px 20px rgba(0, 191, 255, 0.5); }

  /* ---- Canvas Area ---- */
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--deep-violet);
    overflow: hidden;
  }

  #canvas-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(107, 63, 160, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  canvas {
    border-radius: 8px;
    box-shadow:
      0 0 30px rgba(155, 48, 255, 0.15),
      0 0 60px rgba(155, 48, 255, 0.08);
  }

  /* ---- Toggle switch for animation ---- */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .toggle-row label {
    font-size: 0.78rem;
    color: rgba(255, 248, 220, 0.8);
    flex: 1;
  }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }

    #sidebar {
      border-right: none;
      border-bottom: 2px solid rgba(155, 48, 255, 0.3);
      max-height: 45vh;
      padding: 12px;
      gap: 10px;
    }

    .sidebar-header h1 { font-size: 1.2rem; }

    .ctrl-group { padding: 10px; }

    .preset-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <a href="../index.html" class="back-link">&larr; Creative Tools</a>

    <div class="sidebar-header">
      <h1>Digital Spirograph</h1>
      <div class="tagline">Hypotrochoid Curve Generator</div>
    </div>

    <!-- Gear Parameters -->
    <div class="ctrl-group">
      <h3>Gear Ratios</h3>
      <div class="slider-row">
        <label>Outer R</label>
        <input type="range" id="sl-R" min="20" max="200" value="100">
        <span class="slider-val" id="val-R">100</span>
      </div>
      <div class="slider-row">
        <label>Inner r</label>
        <input type="range" id="sl-r" min="5" max="150" value="33">
        <span class="slider-val" id="val-r">33</span>
      </div>
      <div class="slider-row">
        <label>Pen dist d</label>
        <input type="range" id="sl-d" min="1" max="150" value="28">
        <span class="slider-val" id="val-d">28</span>
      </div>
    </div>

    <!-- Presets -->
    <div class="ctrl-group">
      <h3>Presets</h3>
      <div class="preset-grid">
        <button class="preset-btn" data-r="100" data-ri="33" data-d="28">3:1</button>
        <button class="preset-btn" data-r="100" data-ri="60" data-d="50">5:3</button>
        <button class="preset-btn" data-r="105" data-ri="60" data-d="42">7:4</button>
        <button class="preset-btn" data-r="120" data-ri="45" data-d="38">8:3</button>
        <button class="preset-btn" data-r="100" data-ri="37" data-d="30">Star</button>
        <button class="preset-btn" data-r="100" data-ri="70" data-d="60">Bloom</button>
        <button class="preset-btn" data-r="144" data-ri="39" data-d="35">Atom</button>
        <button class="preset-btn" data-r="100" data-ri="23" data-d="20">Web</button>
        <button class="preset-btn" data-r="100" data-ri="47" data-d="40">Lotus</button>
        <button class="preset-btn" data-r="96" data-ri="36" data-d="60">Spiral</button>
        <button class="preset-btn" data-r="120" data-ri="72" data-d="55">Petals</button>
        <button class="preset-btn" data-r="100" data-ri="80" data-d="70">Eye</button>
      </div>
    </div>

    <!-- Drawing Mode -->
    <div class="ctrl-group">
      <h3>Drawing</h3>
      <div class="action-row" style="margin-bottom: 10px;">
        <button class="action-btn btn-animate" id="btn-animate">Animate</button>
        <button class="action-btn btn-draw" id="btn-instant">Instant</button>
        <button class="action-btn btn-random" id="btn-random" title="Randomize settings and animate">&#127922; Random</button>
      </div>
      <div class="slider-row" id="speed-row">
        <label>Speed</label>
        <input type="range" id="sl-speed" min="1" max="60" value="20">
        <span class="slider-val" id="val-speed">20</span>
      </div>
      <div class="slider-row">
        <label>Thickness</label>
        <input type="range" id="sl-thick" min="1" max="10" value="2" step="0.5">
        <span class="slider-val" id="val-thick">2</span>
      </div>
    </div>

    <!-- Color -->
    <div class="ctrl-group">
      <h3>Color</h3>
      <div class="color-mode-row">
        <button class="color-mode-btn active" data-mode="rainbow">Rainbow</button>
        <button class="color-mode-btn" data-mode="gradient">Gradient</button>
        <button class="color-mode-btn" data-mode="solid">Solid</button>
      </div>
      <div class="color-picker-row" id="color-solid-row" style="display:none;">
        <label>Color</label>
        <input type="color" id="pick-color" value="#39ff14">
      </div>
      <div class="color-picker-row" id="color-gradient-row" style="display:none;">
        <label>Start</label>
        <input type="color" id="pick-grad-start" value="#ff1493">
        <label>End</label>
        <input type="color" id="pick-grad-end" value="#00bfff">
      </div>
    </div>

    <!-- Actions -->
    <div class="ctrl-group">
      <h3>Actions</h3>
      <div class="action-row">
        <button class="action-btn btn-clear" id="btn-clear">Clear</button>
        <button class="action-btn btn-save" id="btn-save">Save PNG</button>
      </div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- DOM refs ----
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvas-wrap');

  const slR = document.getElementById('sl-R');
  const slr = document.getElementById('sl-r');
  const sld = document.getElementById('sl-d');
  const slSpeed = document.getElementById('sl-speed');
  const slThick = document.getElementById('sl-thick');
  const valR = document.getElementById('val-R');
  const valr = document.getElementById('val-r');
  const vald = document.getElementById('val-d');
  const valSpeed = document.getElementById('val-speed');
  const valThick = document.getElementById('val-thick');

  const btnAnimate = document.getElementById('btn-animate');
  const btnInstant = document.getElementById('btn-instant');
  const btnRandom = document.getElementById('btn-random');
  const btnClear = document.getElementById('btn-clear');
  const btnSave = document.getElementById('btn-save');

  const pickColor = document.getElementById('pick-color');
  const pickGradStart = document.getElementById('pick-grad-start');
  const pickGradEnd = document.getElementById('pick-grad-end');
  const solidRow = document.getElementById('color-solid-row');
  const gradientRow = document.getElementById('color-gradient-row');

  // ---- State ----
  let R = 100, r = 33, d = 28;
  let lineWidth = 2;
  let speed = 20;
  let colorMode = 'rainbow';
  let solidColor = '#39ff14';
  let gradStart = '#ff1493';
  let gradEnd = '#00bfff';
  let animating = false;
  let animRAF = null;
  let t = 0;
  let tMax = 0;

  // ---- Math helpers ----
  function gcd(a, b) {
    a = Math.abs(Math.round(a));
    b = Math.abs(Math.round(b));
    while (b) { [a, b] = [b, a % b]; }
    return a;
  }

  function lcm(a, b) {
    return Math.abs(Math.round(a)) * Math.abs(Math.round(b)) / gcd(a, b);
  }

  function calcTMax(R, r) {
    const ri = Math.round(r);
    const Ri = Math.round(R);
    return 2 * Math.PI * lcm(Ri, ri) / Ri;
  }

  function hypoX(t, R, r, d) {
    return (R - r) * Math.cos(t) + d * Math.cos((R - r) / r * t);
  }

  function hypoY(t, R, r, d) {
    return (R - r) * Math.sin(t) - d * Math.sin((R - r) / r * t);
  }

  // ---- Color helpers ----
  function hslString(h, s, l) {
    return 'hsl(' + (h % 360) + ',' + s + '%,' + l + '%)';
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function lerpColor(c1, c2, t) {
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function getColor(progress) {
    if (colorMode === 'solid') return solidColor;
    if (colorMode === 'gradient') return lerpColor(gradStart, gradEnd, progress);
    // rainbow
    return hslString(progress * 360 * 3, 100, 60);
  }

  // ---- Canvas sizing ----
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const size = Math.min(rect.width - 40, rect.height - 40, 800);
    canvas.width = size;
    canvas.height = size;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }

  // ---- Drawing ----
  function clearCanvas() {
    ctx.fillStyle = '#1a0033';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawInstant() {
    stopAnimation();
    clearCanvas();

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = R - r + d;
    const scale = (canvas.width * 0.42) / Math.max(maxR, 1);
    const tm = calcTMax(R, r);
    const steps = Math.max(2000, Math.round(tm * 200));
    const dt = tm / steps;

    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < steps; i++) {
      const t0 = i * dt;
      const t1 = (i + 1) * dt;
      const progress = i / steps;

      ctx.strokeStyle = getColor(progress);
      ctx.beginPath();
      ctx.moveTo(cx + hypoX(t0, R, r, d) * scale, cy + hypoY(t0, R, r, d) * scale);
      ctx.lineTo(cx + hypoX(t1, R, r, d) * scale, cy + hypoY(t1, R, r, d) * scale);
      ctx.stroke();
    }
  }

  function startAnimation() {
    stopAnimation();
    clearCanvas();

    animating = true;
    btnAnimate.classList.add('active');
    t = 0;
    tMax = calcTMax(R, r);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = R - r + d;
    const scale = (canvas.width * 0.42) / Math.max(maxR, 1);

    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let prevX = cx + hypoX(0, R, r, d) * scale;
    let prevY = cy + hypoY(0, R, r, d) * scale;

    function frame() {
      if (!animating) return;

      const stepsPerFrame = speed * 8;
      const dt = tMax / Math.max(4000, tMax * 200);

      for (let i = 0; i < stepsPerFrame; i++) {
        if (t >= tMax) {
          animating = false;
          btnAnimate.classList.remove('active');
          return;
        }

        t += dt;
        const progress = t / tMax;
        const nx = cx + hypoX(t, R, r, d) * scale;
        const ny = cy + hypoY(t, R, r, d) * scale;

        ctx.strokeStyle = getColor(progress);
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        prevX = nx;
        prevY = ny;
      }

      animRAF = requestAnimationFrame(frame);
    }

    animRAF = requestAnimationFrame(frame);
  }

  function stopAnimation() {
    animating = false;
    btnAnimate.classList.remove('active');
    if (animRAF) {
      cancelAnimationFrame(animRAF);
      animRAF = null;
    }
  }

  // ---- Slider updates ----
  function syncSliders() {
    R = parseInt(slR.value, 10);
    r = parseInt(slr.value, 10);
    d = parseInt(sld.value, 10);
    speed = parseInt(slSpeed.value, 10);
    lineWidth = parseFloat(slThick.value);

    valR.textContent = R;
    valr.textContent = r;
    vald.textContent = d;
    valSpeed.textContent = speed;
    valThick.textContent = lineWidth;
  }

  [slR, slr, sld, slSpeed, slThick].forEach(function(el) {
    el.addEventListener('input', syncSliders);
  });

  // ---- Preset buttons ----
  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      slR.value = btn.dataset.r;
      slr.value = btn.dataset.ri;
      sld.value = btn.dataset.d;
      syncSliders();
    });
  });

  // ---- Color mode ----
  document.querySelectorAll('.color-mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.color-mode-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      colorMode = btn.dataset.mode;

      solidRow.style.display = colorMode === 'solid' ? 'flex' : 'none';
      gradientRow.style.display = colorMode === 'gradient' ? 'flex' : 'none';
    });
  });

  pickColor.addEventListener('input', function() { solidColor = pickColor.value; });
  pickGradStart.addEventListener('input', function() { gradStart = pickGradStart.value; });
  pickGradEnd.addEventListener('input', function() { gradEnd = pickGradEnd.value; });

  // ---- Action buttons ----
  btnAnimate.addEventListener('click', function() {
    syncSliders();
    startAnimation();
  });

  btnInstant.addEventListener('click', function() {
    syncSliders();
    drawInstant();
  });

  btnRandom.addEventListener('click', function() {
    // Pick random gear ratios that produce interesting patterns
    var randR = 60 + Math.floor(Math.random() * 141);   // 60-200
    var randRi = 5 + Math.floor(Math.random() * Math.min(randR - 1, 146)); // 5 to R-1 (max 150)
    var randD = 1 + Math.floor(Math.random() * Math.min(randRi + 40, 150)); // 1 to r+40 (max 150)

    slR.value = randR;
    slr.value = randRi;
    sld.value = randD;

    // Randomize color mode
    var modes = ['rainbow', 'gradient', 'solid'];
    var mode = modes[Math.floor(Math.random() * modes.length)];
    document.querySelectorAll('.color-mode-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    colorMode = mode;
    solidRow.style.display = mode === 'solid' ? 'flex' : 'none';
    gradientRow.style.display = mode === 'gradient' ? 'flex' : 'none';

    if (mode === 'solid') {
      solidColor = hslString(Math.floor(Math.random() * 360), 90, 60);
    } else if (mode === 'gradient') {
      var h1 = Math.floor(Math.random() * 360);
      var h2 = (h1 + 90 + Math.floor(Math.random() * 180)) % 360;
      // Update pickers visually (approximate - pickers only accept hex)
      gradStart = hslToHex(h1, 90, 55);
      gradEnd = hslToHex(h2, 90, 55);
      pickGradStart.value = gradStart;
      pickGradEnd.value = gradEnd;
    }

    // Randomize thickness slightly
    var randThick = (1 + Math.random() * 3).toFixed(1);
    slThick.value = randThick;

    syncSliders();
    startAnimation();
  });

  // Helper to convert HSL to hex for color pickers
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var a = s * Math.min(l, 1 - l);
    function f(n) {
      var k = (n + h / 30) % 12;
      var color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * color).toString(16).padStart(2, '0');
    }
    return '#' + f(0) + f(8) + f(4);
  }

  btnClear.addEventListener('click', function() {
    stopAnimation();
    clearCanvas();
  });

  btnSave.addEventListener('click', function() {
    // Create a temporary canvas with black-free background for export
    const link = document.createElement('a');
    link.download = 'spirograph.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---- Init ----
  function init() {
    resizeCanvas();
    syncSliders();
    clearCanvas();
    // Draw the default preset on load
    drawInstant();
  }

  window.addEventListener('resize', function() {
    resizeCanvas();
    // Redraw after resize
    drawInstant();
  });

  init();
})();
</script>
</body>
</html>
