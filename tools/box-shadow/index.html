<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Box Shadow Designer — a creative tool built with vanilla HTML/CSS/JS.">
    <title>CSS Box Shadow Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #111116;
            --bg-panel: #1a1a22;
            --bg-input: #22222e;
            --bg-hover: #2a2a38;
            --bg-active: #33334a;
            --border: #2e2e3e;
            --border-focus: #6366f1;
            --text: #e8e8ee;
            --text-secondary: #9898a8;
            --text-muted: #66667a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-dim: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --danger-hover: #f87171;
            --success: #22c55e;
            --warning: #f59e0b;

            --radius: 8px;
            --radius-sm: 4px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 150ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ───────────────────────────────────── */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            height: 48px;
        }

        .header-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .header-back:hover { color: var(--text); }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        /* ── Layout ───────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 340px 1fr;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 48px);
        }

        /* ── Left Panel (Layers + Element) ────────────── */
        .panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            grid-row: 1 / 3;
        }

        .panel-section {
            border-bottom: 1px solid var(--border);
        }

        .panel-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
        }

        .panel-section-body {
            padding: 0 14px 14px;
        }

        /* ── Buttons ──────────────────────────────────── */
        .btn {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--text-muted); }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .btn-danger {
            color: var(--danger);
            border-color: transparent;
            background: transparent;
        }
        .btn-danger:hover { background: rgba(239,68,68,0.12); }

        .btn-icon {
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }
        .btn-icon:hover { color: var(--text); background: var(--bg-hover); }

        /* ── Layer List ───────────────────────────────── */
        .layers-list {
            max-height: 340px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 2px;
        }
        .layer-item:hover { background: var(--bg-hover); }
        .layer-item.active {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .layer-swatch {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .layer-info {
            flex: 1;
            min-width: 0;
        }

        .layer-name {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .layer-preview {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .layer-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .layer-drag {
            cursor: grab;
            color: var(--text-muted);
            font-size: 12px;
            padding: 2px;
        }
        .layer-drag:active { cursor: grabbing; }

        /* ── Layer Editor Controls ────────────────────── */
        .layer-editor {
            padding: 0 14px 14px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .control-row label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            width: 56px;
            flex-shrink: 0;
        }

        .control-row input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-active);
            border-radius: 2px;
            outline: none;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-panel);
            cursor: pointer;
        }

        .control-row input[type="number"] {
            width: 52px;
            padding: 4px 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            text-align: center;
            outline: none;
        }
        .control-row input[type="number"]:focus { border-color: var(--border-focus); }

        .control-row input[type="color"] {
            -webkit-appearance: none;
            width: 32px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            cursor: pointer;
            padding: 2px;
        }
        .control-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .control-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

        .toggle-btn {
            font-family: var(--font-sans);
            font-size: 11px;
            font-weight: 500;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .toggle-btn.on {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent-hover);
        }
        .toggle-btn:hover { border-color: var(--text-muted); }

        /* ── Element Controls ─────────────────────────── */
        .element-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .element-controls .ctrl {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .element-controls .ctrl label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .element-controls .ctrl input {
            padding: 5px 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            outline: none;
            width: 100%;
        }
        .element-controls .ctrl input:focus { border-color: var(--border-focus); }

        /* ── Presets ──────────────────────────────────── */
        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }

        .preset-btn {
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 500;
            padding: 8px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }
        .preset-btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            color: var(--text);
        }

        /* ── Preview Area ─────────────────────────────── */
        .preview-area {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .preview-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(99,102,241,0.03) 0%, transparent 70%);
            position: relative;
        }

        .preview-checkerboard {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        .preview-element {
            position: relative;
            z-index: 1;
            transition: border-radius 0.2s ease, width 0.2s ease, height 0.2s ease;
        }

        /* ── Code Output ──────────────────────────────── */
        .code-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .code-output {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            min-height: 44px;
        }

        .code-output .kw { color: #c084fc; }
        .code-output .val { color: #67e8f9; }
        .code-output .fn { color: #fbbf24; }
        .code-output .num { color: #4ade80; }
        .code-output .punc { color: var(--text-muted); }

        .copy-btn {
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 2px;
        }

        .copy-btn.copied {
            color: var(--success);
            border-color: var(--success);
        }

        /* ── Scrollbar ────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }

            .panel {
                grid-row: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
                max-height: 50vh;
                overflow-y: auto;
            }

            .layers-list {
                max-height: 160px;
            }

            .preview-canvas {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="../index.html" class="header-back">&#9664; Tools</a>
    <div class="header-sep"></div>
    <div class="header-title">CSS Box Shadow Designer</div>
</div>

<div class="app">

    <!-- Left Panel -->
    <div class="panel">

        <!-- Shadow Layers -->
        <div class="panel-section">
            <div class="panel-section-header">
                <span>Shadow Layers</span>
                <button class="btn btn-sm btn-accent" id="addLayer">+ Add Layer</button>
            </div>
            <div class="panel-section-body">
                <div class="layers-list" id="layersList"></div>
            </div>
        </div>

        <!-- Layer Editor (shown when a layer is selected) -->
        <div class="panel-section" id="layerEditorSection" style="display:none;">
            <div class="panel-section-header">
                <span>Layer Settings</span>
            </div>
            <div class="layer-editor" id="layerEditor">
                <div class="control-row">
                    <label>X Offset</label>
                    <input type="range" id="ctrlX" min="-100" max="100" value="0">
                    <input type="number" id="ctrlXNum" min="-200" max="200" value="0">
                </div>
                <div class="control-row">
                    <label>Y Offset</label>
                    <input type="range" id="ctrlY" min="-100" max="100" value="0">
                    <input type="number" id="ctrlYNum" min="-200" max="200" value="0">
                </div>
                <div class="control-row">
                    <label>Blur</label>
                    <input type="range" id="ctrlBlur" min="0" max="150" value="10">
                    <input type="number" id="ctrlBlurNum" min="0" max="300" value="10">
                </div>
                <div class="control-row">
                    <label>Spread</label>
                    <input type="range" id="ctrlSpread" min="-50" max="80" value="0">
                    <input type="number" id="ctrlSpreadNum" min="-100" max="200" value="0">
                </div>
                <div class="control-row">
                    <label>Color</label>
                    <input type="color" id="ctrlColor" value="#000000">
                </div>
                <div class="control-row">
                    <label>Opacity</label>
                    <input type="range" id="ctrlAlpha" min="0" max="100" value="25">
                    <input type="number" id="ctrlAlphaNum" min="0" max="100" value="25">
                </div>
                <div class="control-row">
                    <label>Inset</label>
                    <button class="toggle-btn" id="ctrlInset">Inset</button>
                </div>
            </div>
        </div>

        <!-- Presets -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Presets</span></div>
            <div class="panel-section-body">
                <div class="presets-grid" id="presetsGrid"></div>
            </div>
        </div>

        <!-- Element Settings -->
        <div class="panel-section">
            <div class="panel-section-header"><span>Target Element</span></div>
            <div class="panel-section-body">
                <div class="element-controls">
                    <div class="ctrl">
                        <label>Width</label>
                        <input type="number" id="elWidth" value="200" min="40" max="600">
                    </div>
                    <div class="ctrl">
                        <label>Height</label>
                        <input type="number" id="elHeight" value="200" min="40" max="600">
                    </div>
                    <div class="ctrl">
                        <label>Border Radius</label>
                        <input type="number" id="elRadius" value="12" min="0" max="300">
                    </div>
                    <div class="ctrl">
                        <label>Background</label>
                        <input type="color" id="elBg" value="#2a2a38">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview-area">
        <div class="preview-canvas">
            <div class="preview-checkerboard"></div>
            <div class="preview-element" id="previewEl"></div>
        </div>
        <div class="code-bar">
            <div class="code-output" id="codeOutput"></div>
            <button class="btn copy-btn" id="copyBtn">Copy</button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ── State ─────────────────────────────────
    let layers = [];
    let activeLayerId = null;
    let nextId = 1;
    let dragState = null;

    function createLayer(overrides) {
        return Object.assign({
            id: nextId++,
            x: 0,
            y: 4,
            blur: 12,
            spread: 0,
            color: '#000000',
            alpha: 25,
            inset: false
        }, overrides);
    }

    // ── Presets ────────────────────────────────
    const PRESETS = [
        {
            name: 'Subtle',
            layers: [
                { x: 0, y: 1, blur: 3, spread: 0, color: '#000000', alpha: 12, inset: false },
                { x: 0, y: 4, blur: 12, spread: 0, color: '#000000', alpha: 8, inset: false }
            ]
        },
        {
            name: 'Material',
            layers: [
                { x: 0, y: 2, blur: 4, spread: -1, color: '#000000', alpha: 20, inset: false },
                { x: 0, y: 4, blur: 6, spread: -1, color: '#000000', alpha: 14, inset: false }
            ]
        },
        {
            name: 'Neumorphic',
            layers: [
                { x: 8, y: 8, blur: 16, spread: 0, color: '#000000', alpha: 40, inset: false },
                { x: -8, y: -8, blur: 16, spread: 0, color: '#ffffff', alpha: 6, inset: false }
            ]
        },
        {
            name: 'Hard',
            layers: [
                { x: 6, y: 6, blur: 0, spread: 0, color: '#000000', alpha: 50, inset: false }
            ]
        },
        {
            name: 'Layered',
            layers: [
                { x: 0, y: 1, blur: 2, spread: 0, color: '#000000', alpha: 8, inset: false },
                { x: 0, y: 2, blur: 4, spread: 0, color: '#000000', alpha: 8, inset: false },
                { x: 0, y: 4, blur: 8, spread: 0, color: '#000000', alpha: 8, inset: false },
                { x: 0, y: 8, blur: 16, spread: 0, color: '#000000', alpha: 8, inset: false },
                { x: 0, y: 16, blur: 32, spread: 0, color: '#000000', alpha: 8, inset: false }
            ]
        },
        {
            name: 'Glow',
            layers: [
                { x: 0, y: 0, blur: 15, spread: 2, color: '#6366f1', alpha: 50, inset: false },
                { x: 0, y: 0, blur: 40, spread: 6, color: '#6366f1', alpha: 25, inset: false }
            ]
        },
        {
            name: 'Inset',
            layers: [
                { x: 0, y: 2, blur: 8, spread: 0, color: '#000000', alpha: 40, inset: true },
                { x: 0, y: -1, blur: 2, spread: 0, color: '#ffffff', alpha: 5, inset: true }
            ]
        },
        {
            name: 'Dreamy',
            layers: [
                { x: 0, y: 8, blur: 30, spread: -4, color: '#6366f1', alpha: 30, inset: false },
                { x: 0, y: 20, blur: 60, spread: -8, color: '#a855f7', alpha: 20, inset: false }
            ]
        },
        {
            name: 'Sharp Lift',
            layers: [
                { x: 0, y: 20, blur: 25, spread: -10, color: '#000000', alpha: 50, inset: false }
            ]
        }
    ];

    // ── DOM refs ───────────────────────────────
    const layersList = document.getElementById('layersList');
    const layerEditorSection = document.getElementById('layerEditorSection');
    const previewEl = document.getElementById('previewEl');
    const codeOutput = document.getElementById('codeOutput');
    const addLayerBtn = document.getElementById('addLayer');
    const copyBtn = document.getElementById('copyBtn');
    const presetsGrid = document.getElementById('presetsGrid');

    const ctrl = {
        x: document.getElementById('ctrlX'),
        xNum: document.getElementById('ctrlXNum'),
        y: document.getElementById('ctrlY'),
        yNum: document.getElementById('ctrlYNum'),
        blur: document.getElementById('ctrlBlur'),
        blurNum: document.getElementById('ctrlBlurNum'),
        spread: document.getElementById('ctrlSpread'),
        spreadNum: document.getElementById('ctrlSpreadNum'),
        color: document.getElementById('ctrlColor'),
        alpha: document.getElementById('ctrlAlpha'),
        alphaNum: document.getElementById('ctrlAlphaNum'),
        inset: document.getElementById('ctrlInset')
    };

    const elWidth = document.getElementById('elWidth');
    const elHeight = document.getElementById('elHeight');
    const elRadius = document.getElementById('elRadius');
    const elBg = document.getElementById('elBg');

    // ── Helpers ────────────────────────────────
    function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
    }

    function layerToCSS(l) {
        const [r, g, b] = hexToRgb(l.color);
        const a = (l.alpha / 100).toFixed(2).replace(/\.?0+$/, '') || '0';
        const parts = [];
        if (l.inset) parts.push('inset');
        parts.push(l.x + 'px', l.y + 'px', l.blur + 'px', l.spread + 'px');
        parts.push('rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')');
        return parts.join(' ');
    }

    function getFullCSS() {
        if (layers.length === 0) return 'none';
        return layers.map(layerToCSS).join(',\n    ');
    }

    function getActiveLayer() {
        return layers.find(l => l.id === activeLayerId) || null;
    }

    // ── Render ─────────────────────────────────
    function render() {
        renderLayersList();
        renderLayerEditor();
        renderPreview();
        renderCode();
    }

    function renderLayersList() {
        layersList.innerHTML = '';
        layers.forEach((layer, i) => {
            const div = document.createElement('div');
            div.className = 'layer-item' + (layer.id === activeLayerId ? ' active' : '');
            div.dataset.id = layer.id;

            const [r, g, b] = hexToRgb(layer.color);
            const a = layer.alpha / 100;

            div.innerHTML =
                '<span class="layer-drag" title="Drag to reorder">&#9776;</span>' +
                '<span class="layer-swatch" style="background:rgba(' + r + ',' + g + ',' + b + ',' + a + ')"></span>' +
                '<div class="layer-info">' +
                    '<div class="layer-name">' + (layer.inset ? 'Inset ' : '') + 'Shadow ' + (i + 1) + '</div>' +
                    '<div class="layer-preview">' + layer.x + ' ' + layer.y + ' ' + layer.blur + ' ' + layer.spread + '</div>' +
                '</div>' +
                '<div class="layer-actions">' +
                    '<button class="btn-icon layer-dup" title="Duplicate">&#10697;</button>' +
                    '<button class="btn-icon btn-danger layer-del" title="Delete">&#10005;</button>' +
                '</div>';

            div.addEventListener('click', function(e) {
                if (e.target.closest('.layer-del')) {
                    layers = layers.filter(function(l) { return l.id !== layer.id; });
                    if (activeLayerId === layer.id) {
                        activeLayerId = layers.length ? layers[0].id : null;
                    }
                    render();
                    return;
                }
                if (e.target.closest('.layer-dup')) {
                    var dup = createLayer(layer);
                    dup.id = nextId++;
                    var idx = layers.indexOf(layer);
                    layers.splice(idx + 1, 0, dup);
                    activeLayerId = dup.id;
                    render();
                    return;
                }
                if (e.target.closest('.layer-drag')) return;
                activeLayerId = layer.id;
                render();
            });

            // Drag reorder
            const grip = div.querySelector('.layer-drag');
            grip.addEventListener('mousedown', function(e) {
                e.preventDefault();
                dragState = { id: layer.id, startY: e.clientY, startIndex: i };
                div.style.opacity = '0.5';
                document.addEventListener('mousemove', onDragMove);
                document.addEventListener('mouseup', onDragEnd);
            });

            layersList.appendChild(div);
        });
    }

    function onDragMove(e) {
        if (!dragState) return;
        const items = layersList.querySelectorAll('.layer-item');
        const dy = e.clientY - dragState.startY;
        const itemH = items[0] ? items[0].offsetHeight + 2 : 38;
        let newIndex = dragState.startIndex + Math.round(dy / itemH);
        newIndex = Math.max(0, Math.min(layers.length - 1, newIndex));

        if (newIndex !== layers.indexOf(layers.find(l => l.id === dragState.id))) {
            const layer = layers.find(l => l.id === dragState.id);
            const oldIdx = layers.indexOf(layer);
            layers.splice(oldIdx, 1);
            layers.splice(newIndex, 0, layer);
            renderLayersList();
            renderPreview();
            renderCode();
        }
    }

    function onDragEnd() {
        dragState = null;
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        renderLayersList();
    }

    function renderLayerEditor() {
        const layer = getActiveLayer();
        if (!layer) {
            layerEditorSection.style.display = 'none';
            return;
        }
        layerEditorSection.style.display = '';

        ctrl.x.value = layer.x;
        ctrl.xNum.value = layer.x;
        ctrl.y.value = layer.y;
        ctrl.yNum.value = layer.y;
        ctrl.blur.value = layer.blur;
        ctrl.blurNum.value = layer.blur;
        ctrl.spread.value = layer.spread;
        ctrl.spreadNum.value = layer.spread;
        ctrl.color.value = layer.color;
        ctrl.alpha.value = layer.alpha;
        ctrl.alphaNum.value = layer.alpha;
        ctrl.inset.classList.toggle('on', layer.inset);
    }

    function renderPreview() {
        const w = parseInt(elWidth.value) || 200;
        const h = parseInt(elHeight.value) || 200;
        const r = parseInt(elRadius.value) || 0;
        const bg = elBg.value;

        previewEl.style.width = w + 'px';
        previewEl.style.height = h + 'px';
        previewEl.style.borderRadius = r + 'px';
        previewEl.style.background = bg;

        if (layers.length === 0) {
            previewEl.style.boxShadow = 'none';
        } else {
            previewEl.style.boxShadow = layers.map(layerToCSS).join(', ');
        }
    }

    function renderCode() {
        if (layers.length === 0) {
            codeOutput.innerHTML = '<span class="kw">box-shadow</span><span class="punc">:</span> <span class="val">none</span><span class="punc">;</span>';
            return;
        }

        const parts = layers.map(function(l) {
            const [r, g, b] = hexToRgb(l.color);
            const a = (l.alpha / 100).toFixed(2).replace(/\.?0+$/, '') || '0';
            const tokens = [];
            if (l.inset) tokens.push('<span class="kw">inset</span>');
            tokens.push('<span class="num">' + l.x + 'px</span>');
            tokens.push('<span class="num">' + l.y + 'px</span>');
            tokens.push('<span class="num">' + l.blur + 'px</span>');
            tokens.push('<span class="num">' + l.spread + 'px</span>');
            tokens.push('<span class="fn">rgba</span><span class="punc">(</span><span class="num">' + r + '</span><span class="punc">,</span> <span class="num">' + g + '</span><span class="punc">,</span> <span class="num">' + b + '</span><span class="punc">,</span> <span class="num">' + a + '</span><span class="punc">)</span>');
            return tokens.join(' ');
        });

        let html = '<span class="kw">box-shadow</span><span class="punc">:</span>\n';
        html += parts.map(function(p, i) {
            return '    ' + p + (i < parts.length - 1 ? '<span class="punc">,</span>' : '<span class="punc">;</span>');
        }).join('\n');

        codeOutput.innerHTML = html;
    }

    // ── Control bindings ──────────────────────
    function bindSliderPair(slider, num, prop, isInt) {
        function update(val) {
            const layer = getActiveLayer();
            if (!layer) return;
            const v = isInt !== false ? parseInt(val) : parseFloat(val);
            if (isNaN(v)) return;
            layer[prop] = v;
            slider.value = v;
            num.value = v;
            renderPreview();
            renderCode();
            renderLayersList();
        }
        slider.addEventListener('input', function() { update(this.value); });
        num.addEventListener('input', function() { update(this.value); });
    }

    bindSliderPair(ctrl.x, ctrl.xNum, 'x');
    bindSliderPair(ctrl.y, ctrl.yNum, 'y');
    bindSliderPair(ctrl.blur, ctrl.blurNum, 'blur');
    bindSliderPair(ctrl.spread, ctrl.spreadNum, 'spread');
    bindSliderPair(ctrl.alpha, ctrl.alphaNum, 'alpha');

    ctrl.color.addEventListener('input', function() {
        const layer = getActiveLayer();
        if (!layer) return;
        layer.color = this.value;
        renderPreview();
        renderCode();
        renderLayersList();
    });

    ctrl.inset.addEventListener('click', function() {
        const layer = getActiveLayer();
        if (!layer) return;
        layer.inset = !layer.inset;
        this.classList.toggle('on', layer.inset);
        renderPreview();
        renderCode();
        renderLayersList();
    });

    // ── Element controls ──────────────────────
    [elWidth, elHeight, elRadius].forEach(function(input) {
        input.addEventListener('input', renderPreview);
    });
    elBg.addEventListener('input', renderPreview);

    // ── Add Layer ─────────────────────────────
    addLayerBtn.addEventListener('click', function() {
        const layer = createLayer();
        layers.push(layer);
        activeLayerId = layer.id;
        render();
    });

    // ── Copy ──────────────────────────────────
    copyBtn.addEventListener('click', function() {
        const css = 'box-shadow: ' + getFullCSS() + ';';
        navigator.clipboard.writeText(css).then(function() {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function() {
                copyBtn.textContent = 'Copy';
                copyBtn.classList.remove('copied');
            }, 1500);
        });
    });

    // ── Presets ────────────────────────────────
    PRESETS.forEach(function(preset) {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = preset.name;
        btn.addEventListener('click', function() {
            layers = preset.layers.map(function(l) { return createLayer(l); });
            activeLayerId = layers.length ? layers[0].id : null;
            render();
        });
        presetsGrid.appendChild(btn);
    });

    // ── Init with subtle preset ───────────────
    layers = PRESETS[0].layers.map(function(l) { return createLayer(l); });
    activeLayerId = layers[0].id;
    render();

})();
</script>

<script defer src="../../prompt-viewer.js"></script>
</body>
