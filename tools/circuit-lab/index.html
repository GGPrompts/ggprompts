<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Circuit Lab - Electronic Project Kit — a creative tool built with vanilla HTML/CSS/JS.">
<title>Circuit Lab - Electronic Project Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --board-bg: #c4a86b;
  --board-border: #8b7240;
  --board-dark: #a08050;
  --terminal-silver: #b8bcc0;
  --terminal-ring: #888;
  --terminal-hover: #ffd700;
  --terminal-selected: #ff6600;
  --wire-red: #cc2222;
  --wire-black: #222;
  --wire-blue: #2255cc;
  --wire-green: #22aa44;
  --led-red: #ff0000;
  --led-green: #00cc44;
  --led-yellow: #ffcc00;
  --panel-bg: #faf5e8;
  --panel-border: #d4c9a8;
  --text-dark: #2a2420;
  --text-mid: #5a5040;
  --accent: #cc4400;
  --bg: #e8e0d0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
.header {
  background: linear-gradient(135deg, #2a2420, #3a3430);
  color: #faf5e8;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--accent);
}
.header h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.header h1 span { color: var(--terminal-hover); }
.header-sub {
  font-size: 0.8rem;
  opacity: 0.7;
  font-family: 'Courier Prime', monospace;
}
.header-actions { display: flex; gap: 8px; }
.header-actions button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #faf5e8;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: 'Inter', sans-serif;
  transition: background 0.2s;
}
.header-actions button:hover { background: rgba(255,255,255,0.2); }
.header-actions button.active { background: var(--accent); border-color: var(--accent); }

/* Layout */
.app {
  display: flex;
  height: calc(100vh - 52px);
}

/* Project Panel */
.panel {
  width: 340px;
  min-width: 340px;
  background: var(--panel-bg);
  border-right: 2px solid var(--panel-border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.panel.hidden { display: none; }
.panel-header {
  padding: 16px;
  border-bottom: 1px solid var(--panel-border);
  font-family: 'Fredoka', sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-dark);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.project-card {
  padding: 10px 12px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
}
.project-card:hover { border-color: var(--accent); transform: translateX(2px); }
.project-card.active { border-color: var(--accent); background: #fff5ee; box-shadow: 0 0 0 2px rgba(204,68,0,0.2); }
.project-card .p-num {
  display: inline-block;
  width: 24px; height: 24px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  text-align: center;
  line-height: 24px;
  font-size: 0.75rem;
  font-weight: 600;
  margin-right: 8px;
  vertical-align: middle;
}
.project-card .p-name {
  font-weight: 600;
  font-size: 0.9rem;
  vertical-align: middle;
}
.project-card .p-diff {
  float: right;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: #eee;
  color: var(--text-mid);
}
.project-card .p-diff.Intermediate { background: #fff3cd; color: #856404; }
.project-card .p-diff.Advanced { background: #f8d7da; color: #721c24; }
.project-card .p-desc {
  font-size: 0.78rem;
  color: var(--text-mid);
  margin-top: 6px;
  line-height: 1.4;
}

/* Project Detail View */
.project-detail { padding: 16px; display: none; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
.project-detail.visible { display: flex; }
.project-detail h2 {
  font-family: 'Fredoka', sans-serif;
  font-size: 1.2rem;
  color: var(--accent);
}
.project-detail .parts-list {
  font-size: 0.8rem;
  color: var(--text-mid);
  padding: 8px 12px;
  background: #f5f0e5;
  border-radius: 6px;
  line-height: 1.6;
}
.project-detail .parts-list strong { color: var(--text-dark); }
.step-list { list-style: none; counter-reset: step; }
.step-list li {
  counter-increment: step;
  padding: 8px 8px 8px 36px;
  position: relative;
  font-size: 0.82rem;
  line-height: 1.5;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: background 0.2s;
}
.step-list li:hover { background: #f9f5ee; }
.step-list li::before {
  content: counter(step);
  position: absolute;
  left: 8px;
  top: 8px;
  width: 20px; height: 20px;
  background: var(--panel-border);
  color: white;
  border-radius: 50%;
  text-align: center;
  line-height: 20px;
  font-size: 0.7rem;
  font-weight: 600;
}
.step-list li.done::before { background: #22aa44; }
.step-list li.done { color: #888; text-decoration: line-through; }
.step-list li.current { background: #fff8ee; }
.step-list li.current::before { background: var(--accent); }
.explanation-box {
  background: #f0ebe0;
  border-left: 3px solid var(--accent);
  padding: 12px;
  font-size: 0.82rem;
  line-height: 1.6;
  border-radius: 0 6px 6px 0;
}
.explanation-box h3 {
  font-family: 'Fredoka', sans-serif;
  font-size: 0.9rem;
  margin-bottom: 6px;
  color: var(--accent);
}
.challenge-box {
  background: #eef5ee;
  border-left: 3px solid #22aa44;
  padding: 12px;
  font-size: 0.82rem;
  line-height: 1.6;
  border-radius: 0 6px 6px 0;
}
.challenge-box h3 { color: #22aa44; font-family: 'Fredoka', sans-serif; font-size: 0.9rem; margin-bottom: 6px; }
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  padding: 0;
}
.back-btn:hover { text-decoration: underline; }
.btn-clear {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
}
.btn-clear:hover { background: #aa3300; }

/* Board Area */
.board-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: auto;
  position: relative;
}

.board {
  position: relative;
  width: 880px;
  height: 580px;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0,0,0,0.03) 19px, rgba(0,0,0,0.03) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,0,0,0.03) 19px, rgba(0,0,0,0.03) 20px),
    linear-gradient(135deg, #c8ad70, #bfa060, #c4a86b);
  border: 3px solid var(--board-border);
  border-radius: 8px;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2),
    inset 0 -1px 0 rgba(0,0,0,0.1);
  flex-shrink: 0;
}

/* Board title label */
.board::before {
  content: 'ELECTRONIC PROJECT LAB';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier Prime', monospace;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--board-border);
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.7;
}
.board::after {
  content: '150-IN-1';
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier Prime', monospace;
  font-weight: 700;
  font-size: 0.65rem;
  color: var(--board-border);
  letter-spacing: 5px;
  opacity: 0.5;
}

/* Component areas on the board */
.comp-area {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.comp-label {
  font-family: 'Courier Prime', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--board-border);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
  white-space: nowrap;
  user-select: none;
}
.comp-body {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Terminals */
.terminal {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle at 40% 35%, #ddd, var(--terminal-silver) 50%, #999);
  border: 2px solid var(--terminal-ring);
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
  z-index: 10;
  flex-shrink: 0;
}
.terminal:hover {
  border-color: var(--terminal-hover);
  box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
  transform: scale(1.15);
}
.terminal.selected {
  border-color: var(--terminal-selected);
  box-shadow: 0 0 12px rgba(255, 102, 0, 0.7);
  transform: scale(1.2);
}
.terminal.hint {
  animation: pulse-hint 1s ease-in-out infinite;
}
@keyframes pulse-hint {
  0%, 100% { box-shadow: 0 0 4px rgba(255,102,0,0.3); }
  50% { box-shadow: 0 0 14px rgba(255,102,0,0.8); border-color: var(--terminal-selected); }
}
.terminal .t-label {
  position: absolute;
  bottom: -14px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier Prime', monospace;
  font-size: 0.55rem;
  font-weight: 700;
  color: var(--board-border);
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
}

/* Component illustrations between terminals */
.comp-illustration {
  height: 18px;
  display: flex;
  align-items: center;
  user-select: none;
  pointer-events: none;
}

/* Resistor zigzag */
.resistor-body {
  width: 50px;
  height: 16px;
  position: relative;
}
.resistor-body svg { width: 100%; height: 100%; }

/* LED body */
.led-body {
  width: 18px;
  height: 18px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  border: 2px solid;
  position: relative;
  transition: box-shadow 0.3s, background 0.3s;
}
.led-body.red { border-color: #cc0000; background: rgba(255,0,0,0.15); }
.led-body.green { border-color: #008833; background: rgba(0,200,60,0.15); }
.led-body.yellow { border-color: #aa8800; background: rgba(255,200,0,0.15); }
.led-body.red.lit { background: #ff0000; box-shadow: 0 0 20px #ff0000, 0 0 40px rgba(255,0,0,0.5); }
.led-body.green.lit { background: #00dd44; box-shadow: 0 0 20px #00dd44, 0 0 40px rgba(0,220,60,0.5); }
.led-body.yellow.lit { background: #ffcc00; box-shadow: 0 0 20px #ffcc00, 0 0 40px rgba(255,200,0,0.5); }

/* Buzzer */
.buzzer-body {
  width: 32px;
  height: 32px;
  background: radial-gradient(circle, #222, #444);
  border-radius: 50%;
  border: 2px solid #555;
  position: relative;
}
.buzzer-body::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 10px; height: 10px;
  background: #666;
  border-radius: 50%;
}
.buzzer-body.active {
  animation: buzz 0.05s linear infinite alternate;
}
@keyframes buzz {
  from { transform: translateX(-1px); }
  to { transform: translateX(1px); }
}

/* Motor */
.motor-body {
  width: 36px;
  height: 36px;
  background: radial-gradient(circle, #ccc, #999);
  border-radius: 50%;
  border: 2px solid #888;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.motor-shaft {
  width: 16px;
  height: 3px;
  background: #555;
  transform-origin: center;
}
.motor-body.spinning .motor-shaft {
  animation: spin 0.3s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Switch */
.switch-body {
  width: 40px;
  height: 20px;
  background: #ddd;
  border: 2px solid #999;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  pointer-events: auto !important;
  transition: background 0.2s;
}
.switch-body::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 12px;
  background: #888;
  border-radius: 2px;
  transition: left 0.2s, background 0.2s;
}
.switch-body.closed { background: #cde8cd; }
.switch-body.closed::after { left: 18px; background: #22aa44; }

/* Battery */
.battery-body {
  width: 44px;
  height: 28px;
  background: linear-gradient(180deg, #333, #555);
  border-radius: 3px;
  position: relative;
  border: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
}
.battery-body::before {
  content: '9V';
  font-family: 'Courier Prime', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  color: #ffd700;
}
.battery-body::after {
  content: '';
  position: absolute;
  top: 6px; right: -6px;
  width: 6px; height: 14px;
  background: #888;
  border-radius: 0 2px 2px 0;
}

/* Capacitor */
.cap-body {
  width: 20px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.cap-plate {
  width: 3px;
  height: 18px;
  background: #666;
  border-radius: 1px;
}

/* Transistor */
.transistor-body {
  width: 28px;
  height: 28px;
  background: #222;
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  border: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Courier Prime', monospace;
  font-size: 0.5rem;
  color: #aaa;
  font-weight: 700;
}

/* Photoresistor */
.ldr-body {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle, #cc8844, #aa6622);
  border-radius: 50%;
  border: 2px solid #885522;
}

/* Potentiometer */
.pot-body {
  width: 30px;
  height: 30px;
  background: radial-gradient(circle, #ddd, #bbb);
  border-radius: 50%;
  border: 2px solid #999;
  position: relative;
}
.pot-knob {
  position: absolute;
  top: 50%; left: 50%;
  width: 4px; height: 12px;
  background: #555;
  transform-origin: bottom center;
  transform: translate(-50%, -100%) rotate(var(--pot-angle, 0deg));
  border-radius: 2px;
  transition: transform 0.1s;
}

/* Sliders for LDR and Pot */
.slider-control {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 20;
}
.slider-control label {
  font-family: 'Courier Prime', monospace;
  font-size: 0.6rem;
  color: var(--board-border);
  font-weight: 700;
}
.slider-control input[type="range"] {
  width: 70px;
  height: 4px;
  accent-color: var(--accent);
}

/* Wire SVG overlay */
.wire-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}
.wire-layer path {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  pointer-events: stroke;
  cursor: pointer;
}
.wire-layer path:hover {
  stroke-width: 5;
  filter: brightness(1.3);
}

/* Status bar */
.status-bar {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  padding: 6px 16px;
  background: rgba(42,36,32,0.85);
  color: #faf5e8;
  font-family: 'Courier Prime', monospace;
  font-size: 0.75rem;
  display: flex;
  justify-content: space-between;
  z-index: 20;
}
.status-bar .short-circuit {
  color: #ff4444;
  font-weight: 700;
  animation: blink 0.5s linear infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Junction terminals */
.junction {
  position: absolute;
}

/* Wire color indicator */
.wire-color-picker {
  display: flex;
  gap: 4px;
  align-items: center;
}
.wire-color-btn {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}
.wire-color-btn.active { border-color: white; box-shadow: 0 0 4px rgba(255,255,255,0.5); }

/* Responsive */
@media (max-width: 1100px) {
  .panel { width: 280px; min-width: 280px; }
  .board { transform: scale(0.85); transform-origin: center; }
}
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .panel { width: 100%; min-width: 100%; max-height: 40vh; border-right: none; border-bottom: 2px solid var(--panel-border); }
  .board-area { padding: 10px; }
  .board { transform: scale(0.5); transform-origin: top center; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1><span>Circuit</span> Lab</h1>
    <div class="header-sub">Electronic Project Kit Simulator</div>
  </div>
  <div class="header-actions">
    <div class="wire-color-picker">
      <span style="font-size:0.75rem;opacity:0.7;margin-right:4px;">Wire:</span>
      <div class="wire-color-btn active" data-color="#cc2222" style="background:#cc2222;" title="Red"></div>
      <div class="wire-color-btn" data-color="#222222" style="background:#888;" title="Black"></div>
      <div class="wire-color-btn" data-color="#2255cc" style="background:#2255cc;" title="Blue"></div>
      <div class="wire-color-btn" data-color="#22aa44" style="background:#22aa44;" title="Green"></div>
      <div class="wire-color-btn" data-color="#ff8800" style="background:#ff8800;" title="Orange"></div>
    </div>
    <button id="btn-toggle-panel">Projects</button>
    <button id="btn-clear-wires">Clear Wires</button>
  </div>
</div>

<div class="app">
  <div class="panel" id="panel">
    <!-- Project List -->
    <div class="panel-header">
      Project Booklet
    </div>
    <div class="project-list" id="project-list"></div>
    <!-- Project Detail -->
    <div class="project-detail" id="project-detail">
      <button class="back-btn" id="btn-back">&larr; All Projects</button>
      <h2 id="detail-title"></h2>
      <div class="parts-list" id="detail-parts"></div>
      <ol class="step-list" id="detail-steps"></ol>
      <div class="explanation-box" id="detail-explanation" style="display:none;">
        <h3>How It Works</h3>
        <p id="detail-explanation-text"></p>
      </div>
      <div class="challenge-box" id="detail-challenge" style="display:none;">
        <h3>Challenge</h3>
        <p id="detail-challenge-text"></p>
      </div>
      <button class="btn-clear" id="btn-clear-project" style="align-self:flex-start;">Clear &amp; Reset Wires</button>
    </div>
  </div>

  <div class="board-area">
    <div class="board" id="board">
      <svg class="wire-layer" id="wire-layer"></svg>
      <!-- Components and terminals are created by JS -->
    </div>
    <div class="status-bar" id="status-bar">
      <span id="status-text">Click a terminal to start wiring. Right-click a wire to remove it.</span>
      <span id="status-circuit"></span>
    </div>
  </div>
</div>

<script src="simulation.js"></script>
<script src="projects.js"></script>
<script>
(function() {
  // ===== Audio Engine =====
  const Audio = {
    ctx: null,
    buzzerOsc: null,
    buzzerGain: null,
    init() {
      if (this.ctx) return;
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Buzzer oscillator (persistent, controlled by gain)
      this.buzzerOsc = this.ctx.createOscillator();
      this.buzzerGain = this.ctx.createGain();
      this.buzzerOsc.type = 'square';
      this.buzzerOsc.frequency.value = 440;
      this.buzzerGain.gain.value = 0;
      this.buzzerOsc.connect(this.buzzerGain);
      this.buzzerGain.connect(this.ctx.destination);
      this.buzzerOsc.start();
      // Motor noise (filtered noise)
      this.motorNoise = this.ctx.createBufferSource();
      const bufSize = this.ctx.sampleRate * 2;
      const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      this.motorNoise.buffer = buf;
      this.motorNoise.loop = true;
      this.motorFilter = this.ctx.createBiquadFilter();
      this.motorFilter.type = 'lowpass';
      this.motorFilter.frequency.value = 200;
      this.motorGain = this.ctx.createGain();
      this.motorGain.gain.value = 0;
      this.motorNoise.connect(this.motorFilter);
      this.motorFilter.connect(this.motorGain);
      this.motorGain.connect(this.ctx.destination);
      this.motorNoise.start();
    },
    setBuzzer(active, current) {
      if (!this.ctx) return;
      const vol = active ? Math.min(current * 3, 0.15) : 0;
      const freq = 300 + Math.min(current * 2000, 600);
      this.buzzerGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.02);
      this.buzzerOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.02);
    },
    setMotor(active, current) {
      if (!this.ctx) return;
      const vol = active ? Math.min(current * 2, 0.08) : 0;
      this.motorGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
      this.motorFilter.frequency.setTargetAtTime(100 + current * 500, this.ctx.currentTime, 0.05);
    },
    click() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.frequency.value = 1200;
      osc.type = 'sine';
      g.gain.setValueAtTime(0.08, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.06);
    },
    wireSnap() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.frequency.value = 800;
      osc.type = 'triangle';
      g.gain.setValueAtTime(0.1, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    }
  };

  function makeTerminal(tDef, comp) {
    const el = document.createElement('div');
    el.className = 'terminal';
    el.dataset.id = tDef.id;
    const label = document.createElement('span');
    label.className = 't-label';
    label.textContent = tDef.label;
    el.appendChild(label);
    terminalEls[tDef.id] = el;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      Audio.init();
      handleTerminalClick(tDef.id);
    });

    return el;
  }

  // ===== Wiring =====
  function handleTerminalClick(id) {
    if (selectedTerminal === null) {
      selectedTerminal = id;
      terminalEls[id].classList.add('selected');
      setStatus('Now click another terminal to connect a wire.');
      Audio.click();
    } else if (selectedTerminal === id) {
      terminalEls[id].classList.remove('selected');
      selectedTerminal = null;
      setStatus('Wire cancelled.');
    } else {
      // Create wire
      const added = circuit.addWire(selectedTerminal, id);
      if (added) {
        const key = wireKey(selectedTerminal, id);
        wireColors[key] = wireColor;
        Audio.wireSnap();
        drawWires();
        updateCircuit();
        checkProjectSteps();
      }
      terminalEls[selectedTerminal].classList.remove('selected');
      selectedTerminal = null;
      setStatus('Wire connected! Click terminals to add more, or right-click wires to remove.');
    }
  }

  function wireKey(a, b) {
    return [a, b].sort().join('|');
  }

  function drawWires() {
    // Recalculate positions
    const boardRect = board.getBoundingClientRect();
    for (const [id, el] of Object.entries(terminalEls)) {
      const rect = el.getBoundingClientRect();
      terminalPos[id] = {
        x: rect.left - boardRect.left + rect.width / 2,
        y: rect.top - boardRect.top + rect.height / 2
      };
    }

    wireSvg.innerHTML = '';
    for (const [a, b] of circuit.wires) {
      const posA = terminalPos[a];
      const posB = terminalPos[b];
      if (!posA || !posB) continue;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      // Slight curve for aesthetics
      const dx = posB.x - posA.x;
      const dy = posB.y - posA.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const sag = Math.min(dist * 0.15, 30);
      const midX = (posA.x + posB.x) / 2;
      const midY = (posA.y + posB.y) / 2 + sag;
      path.setAttribute('d', `M${posA.x},${posA.y} Q${midX},${midY} ${posB.x},${posB.y}`);
      const key = wireKey(a, b);
      path.setAttribute('stroke', wireColors[key] || '#cc2222');
      path.dataset.termA = a;
      path.dataset.termB = b;
      path.style.pointerEvents = 'stroke';

      path.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        circuit.removeWire(a, b);
        delete wireColors[key];
        drawWires();
        updateCircuit();
        checkProjectSteps();
        Audio.click();
      });

      wireSvg.appendChild(path);
    }
  }

  // ===== Circuit Update =====
  function updateCircuit() {
    const results = circuit.solve();

    // Update component visuals
    for (const comp of circuit.components) {
      const r = results.get(comp.id);
      if (!r) continue;

      if (comp.type === CircuitSim.Types.LED) {
        const el = componentEls[comp.id];
        if (el) {
          el.classList.toggle('lit', r.active && r.current > 0.005);
          if (r.active && r.current > 0.005) {
            const brightness = Math.min(r.current * 20, 1);
            el.style.opacity = 0.5 + brightness * 0.5;
          } else {
            el.style.opacity = '';
          }
        }
      }
      else if (comp.type === CircuitSim.Types.BUZZER) {
        const el = componentEls[comp.id];
        if (el) {
          el.classList.toggle('active', r.active && r.current > 0.005);
          Audio.setBuzzer(r.active && r.current > 0.005, r.current);
        }
      }
      else if (comp.type === CircuitSim.Types.MOTOR) {
        const el = componentEls[comp.id];
        if (el) {
          el.classList.toggle('spinning', r.active && r.current > 0.005);
          if (r.active && r.current > 0.005) {
            const speed = Math.max(0.1, 1 - r.current * 5);
            el.querySelector('.motor-shaft').style.animationDuration = speed + 's';
          }
          Audio.setMotor(r.active && r.current > 0.005, r.current);
        }
      }
    }

    // Check for short circuit
    const battResult = results.get('battery');
    const statusCircuit = document.getElementById('status-circuit');
    if (battResult && battResult.shortCircuit) {
      statusCircuit.innerHTML = '<span class="short-circuit">SHORT CIRCUIT!</span>';
    } else if (battResult && battResult.active) {
      statusCircuit.textContent = `${battResult.voltage}V | ${(battResult.current * 1000).toFixed(1)}mA`;
    } else {
      statusCircuit.textContent = 'No circuit';
    }
  }

      card.innerHTML = `
        <span class="p-num">${proj.icon}</span>
        <span class="p-name">${proj.name}</span>
        <span class="p-diff ${proj.difficulty}">${proj.difficulty}</span>
        <div class="p-desc">${proj.description}</div>
      `;
      card.addEventListener('click', () => openProject(proj));
      projectList.appendChild(card);
    }
  }

  function openProject(proj) {
    currentProject = proj;
    completedSteps = new Set();

    // Update active card
    document.querySelectorAll('.project-card').forEach((c, i) => {
      c.classList.toggle('active', window.CircuitProjects[i] === proj);
    });

    // Show detail view
    projectList.style.display = 'none';
    projectDetail.classList.add('visible');

    document.getElementById('detail-title').textContent = `#${proj.id}: ${proj.name}`;
    document.getElementById('detail-parts').innerHTML = '<strong>Parts needed:</strong> ' + proj.parts.join(', ');

    const stepList = document.getElementById('detail-steps');
    stepList.innerHTML = '';
    for (let i = 0; i < proj.steps.length; i++) {
      const li = document.createElement('li');
      li.textContent = proj.steps[i].text;
      li.dataset.index = i;
      // Click step to highlight terminals
      li.addEventListener('click', () => highlightStep(proj.steps[i]));
      stepList.appendChild(li);
    }

    const explBox = document.getElementById('detail-explanation');
    const explText = document.getElementById('detail-explanation-text');
    explBox.style.display = 'block';
    explText.textContent = proj.explanation;

    const chalBox = document.getElementById('detail-challenge');
    const chalText = document.getElementById('detail-challenge-text');
    chalBox.style.display = 'block';
    chalText.textContent = proj.challenge;

    // Clear hint highlights
    clearHints();
    // Highlight first incomplete step
    highlightNextStep();
  }

  function highlightStep(step) {
    clearHints();
    if (terminalEls[step.from]) terminalEls[step.from].classList.add('hint');
    if (terminalEls[step.to]) terminalEls[step.to].classList.add('hint');
  }

  function clearHints() {
    document.querySelectorAll('.terminal.hint').forEach(t => t.classList.remove('hint'));
  }

  function highlightNextStep() {
    if (!currentProject) return;
    for (let i = 0; i < currentProject.steps.length; i++) {
      if (!completedSteps.has(i)) {
        highlightStep(currentProject.steps[i]);
        // Update step list
        const items = document.querySelectorAll('#detail-steps li');
        items.forEach((li, idx) => {
          li.classList.toggle('current', idx === i);
          li.classList.toggle('done', completedSteps.has(idx));
        });
        return;
      }
    }
    // All done!
    clearHints();
    const items = document.querySelectorAll('#detail-steps li');
    items.forEach((li, idx) => li.classList.add('done'));
    setStatus('Project complete! All wires connected correctly.');
  }

  function checkProjectSteps() {
    if (!currentProject) return;
    for (let i = 0; i < currentProject.steps.length; i++) {
      const step = currentProject.steps[i];
      const hasWire = circuit.wires.some(w =>
        (w[0] === step.from && w[1] === step.to) ||
        (w[0] === step.to && w[1] === step.from)
      );
      if (hasWire) completedSteps.add(i);
      else completedSteps.delete(i);
    }
    highlightNextStep();
  }

  document.getElementById('btn-back').addEventListener('click', () => {
    currentProject = null;
    completedSteps = new Set();
    projectList.style.display = '';
    projectDetail.classList.remove('visible');
    clearHints();
    document.querySelectorAll('.project-card').forEach(c => c.classList.remove('active'));
  });

  document.getElementById('btn-clear-project').addEventListener('click', () => {
    circuit.clearWires();
    wireColors = {};
    drawWires();
    updateCircuit();
    completedSteps = new Set();
    if (currentProject) highlightNextStep();
  });

  // ===== Header Buttons =====
  document.getElementById('btn-toggle-panel').addEventListener('click', () => {
    const panel = document.getElementById('panel');
    panel.classList.toggle('hidden');
    document.getElementById('btn-toggle-panel').classList.toggle('active', !panel.classList.contains('hidden'));
  });
  document.getElementById('btn-toggle-panel').classList.add('active');

  document.getElementById('btn-clear-wires').addEventListener('click', () => {
    circuit.clearWires();
    wireColors = {};
    drawWires();
    updateCircuit();
    completedSteps = new Set();
    if (currentProject) highlightNextStep();
    setStatus('All wires cleared.');
  });

  // Wire color picker
  document.querySelectorAll('.wire-color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.wire-color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wireColor = btn.dataset.color;
    });
  });

  // Click board to deselect
  board.addEventListener('click', () => {
    if (selectedTerminal) {
      terminalEls[selectedTerminal].classList.remove('selected');
      selectedTerminal = null;
      setStatus('Deselected.');
    }
  });

  // ===== Status =====
  function setStatus(text) {
    document.getElementById('status-text').textContent = text;
  }

  // ===== Init =====
  buildBoard();
  buildProjectList();
  setStatus('Click a terminal to start wiring. Right-click a wire to remove it.');

  // Recalculate positions on resize
  window.addEventListener('resize', () => {
    drawWires();
  });
})();
</script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
