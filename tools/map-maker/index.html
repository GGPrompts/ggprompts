<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           MAP MAKER — Cartographer's desk aesthetic
           Cinzel (headings), Lora (body), JetBrains Mono (data)
           Parchment + dark wood + brass accents
        ================================================================ */
        :root {
            --parchment: #f5ead6;
            --parchment-dark: #e8d5b4;
            --wood-dark: #1a1410;
            --wood: #2a2018;
            --wood-light: #3d3025;
            --wood-mid: #4a3c2e;
            --brass: #c49b3c;
            --brass-light: #dbb860;
            --brass-dark: #8a6c22;
            --ink: #1a1a1a;
            --ink-light: #3a3530;
            --sea-blue: #2c4a6e;
            --sea-light: #4a7aa8;
            --compass-red: #b33a3a;
            --green-land: #3a6b4a;
            --text-light: #e8dcc8;
            --text-muted: #9a8a72;
            --border: #5a4a38;
            --highlight: #00e5ff;

            --font-display: 'Cinzel', serif;
            --font-body: 'Lora', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-light);
            background: var(--wood-dark);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ── App Layout ─────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 48px 1fr 36px;
            height: 100vh;
        }

        /* ── Toolbar ────────────────────────────────────────── */
        .toolbar {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, var(--wood-light), var(--wood));
            border-bottom: 2px solid var(--brass-dark);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 4px;
        }

        .toolbar-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--brass-light);
            margin-right: 16px;
            letter-spacing: 1px;
        }

        .toolbar-sep {
            width: 1px;
            height: 28px;
            background: var(--border);
            margin: 0 6px;
        }

        .tb-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .tb-btn:hover {
            background: var(--wood-mid);
            border-color: var(--border);
        }
        .tb-btn.active {
            background: var(--brass-dark);
            border-color: var(--brass);
            color: var(--parchment);
        }
        .tb-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .tool-group {
            display: flex;
            gap: 2px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 2px;
        }

        /* ── Sidebar ────────────────────────────────────────── */
        .sidebar {
            background: var(--wood);
            border-right: 2px solid var(--brass-dark);
            overflow-y: auto;
            padding: 0;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .panel {
            border-bottom: 1px solid var(--border);
        }

        .panel-header {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            color: var(--brass-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 12px;
            background: rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header:hover { background: rgba(0,0,0,0.25); }
        .panel-header .arrow { font-size: 10px; transition: transform 0.2s; }
        .panel-header.collapsed .arrow { transform: rotate(-90deg); }

        .panel-body {
            padding: 10px 12px;
        }
        .panel-body.collapsed { display: none; }

        /* ── Form controls ──────────────────────────────────── */
        .field {
            margin-bottom: 8px;
        }
        .field label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-family: var(--font-mono);
        }
        .field input[type="text"],
        .field input[type="number"],
        .field select,
        .field textarea {
            width: 100%;
            background: var(--wood-dark);
            border: 1px solid var(--border);
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 13px;
            padding: 5px 8px;
            border-radius: 3px;
            outline: none;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: var(--brass);
        }
        .field input[type="color"] {
            width: 32px;
            height: 24px;
            border: 1px solid var(--border);
            background: none;
            padding: 0;
            cursor: pointer;
            border-radius: 3px;
        }
        .field-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .field-row label { margin-bottom: 0; white-space: nowrap; }

        .field input[type="range"] {
            width: 100%;
            accent-color: var(--brass);
        }

        .field input[type="checkbox"] {
            accent-color: var(--brass);
        }

        /* ── Layer list ─────────────────────────────────────── */
        .layer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 4px;
            border-radius: 3px;
            font-size: 12px;
            cursor: default;
        }
        .layer-item:hover { background: rgba(255,255,255,0.04); }
        .layer-icon {
            width: 18px;
            height: 18px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .layer-name { flex: 1; text-transform: capitalize; }
        .layer-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
        }
        .layer-toggle:hover { color: var(--text-light); }
        .layer-toggle.off { color: var(--wood-mid); }

        /* ── Color palette ──────────────────────────────────── */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
        }
        .palette-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .palette-swatch:hover { transform: scale(1.15); }
        .palette-swatch.selected {
            outline: 2px solid var(--highlight);
            outline-offset: 1px;
        }

        .palette-tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 8px;
        }
        .palette-tab {
            flex: 1;
            background: var(--wood-dark);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 4px;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
        }
        .palette-tab.active {
            background: var(--brass-dark);
            color: var(--parchment);
            border-color: var(--brass);
        }

        /* ── Marker icon picker ─────────────────────────────── */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .icon-btn {
            background: var(--wood-dark);
            border: 1px solid var(--border);
            color: var(--text-light);
            border-radius: 4px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            font-family: var(--font-mono);
        }
        .icon-btn:hover { border-color: var(--brass); }
        .icon-btn.active { background: var(--brass-dark); border-color: var(--brass); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ── Object list ────────────────────────────────────── */
        .obj-list-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }
        .obj-list-item:hover { background: rgba(255,255,255,0.05); }
        .obj-list-item.selected { background: var(--brass-dark); }
        .obj-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }
        .obj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .obj-delete {
            background: none;
            border: none;
            color: var(--compass-red);
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
            opacity: 0;
        }
        .obj-list-item:hover .obj-delete { opacity: 1; }

        /* ── Canvas area ────────────────────────────────────── */
        .canvas-area {
            position: relative;
            overflow: hidden;
            background: var(--wood-dark);
            cursor: crosshair;
        }

        .canvas-area canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ── Status bar ─────────────────────────────────────── */
        .statusbar {
            grid-column: 1 / -1;
            background: var(--wood);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }
        .statusbar span { white-space: nowrap; }
        .status-coords { color: var(--brass-light); }

        /* ── Modal ──────────────────────────────────────────── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.hidden { display: none; }
        .modal {
            background: var(--wood);
            border: 2px solid var(--brass-dark);
            border-radius: 8px;
            padding: 24px;
            min-width: 340px;
            max-width: 480px;
        }
        .modal h3 {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--brass-light);
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        .btn {
            font-family: var(--font-body);
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--wood-light);
            color: var(--text-light);
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--brass); }
        .btn-primary {
            background: var(--brass-dark);
            border-color: var(--brass);
            color: var(--parchment);
        }
        .btn-primary:hover { background: var(--brass); color: var(--ink); }

        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 48px 1fr 200px 36px;
            }
            .sidebar {
                grid-row: 3;
                border-right: none;
                border-top: 2px solid var(--brass-dark);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ── Toolbar ────────────────────────────────────── -->
        <div class="toolbar">
            <span class="toolbar-title">Map Maker</span>
            <div class="toolbar-sep"></div>

            <div class="tool-group">
                <button class="tb-btn active" data-tool="select" title="Select / Move (V)">
                    <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51z"/></svg>
                </button>
                <button class="tb-btn" data-tool="pan" title="Pan (H)">
                    <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
                </button>
                <button class="tb-btn" data-tool="polygon" title="Draw Polygon (P)">
                    <svg viewBox="0 0 24 24"><path d="M2 22l4.5-4.5M22 2l-4.5 4.5M2 22l8-2-6-6-2 8zm16-16l2-8-8 2 6 6zM12.5 5.5l-1 1L18 13l1-1-6.5-6.5z"/></svg>
                </button>
                <button class="tb-btn" data-tool="marker" title="Place Marker (M)">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
                </button>
                <button class="tb-btn" data-tool="label" title="Add Label (T)">
                    <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
                </button>
            </div>

            <div class="toolbar-sep"></div>

            <button class="tb-btn" id="btnUndo" title="Undo (Ctrl+Z)">
                <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>
            <button class="tb-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">
                <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            </button>

            <div class="toolbar-sep"></div>

            <button class="tb-btn" id="btnNew" title="New Map">New</button>
            <button class="tb-btn" id="btnSave" title="Save JSON (Ctrl+S)">Save</button>
            <button class="tb-btn" id="btnLoad" title="Load JSON">Load</button>
            <button class="tb-btn" id="btnExport" title="Export PNG">Export PNG</button>
        </div>

        <!-- ── Sidebar ────────────────────────────────────── -->
        <div class="sidebar">
            <!-- Layers -->
            <div class="panel">
                <div class="panel-header" data-panel="layers">
                    Layers <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelLayers"></div>
            </div>

            <!-- Palette -->
            <div class="panel">
                <div class="panel-header" data-panel="palette">
                    Color Palette <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelPalette">
                    <div class="palette-tabs" id="paletteTabs"></div>
                    <div class="palette-grid" id="paletteGrid"></div>
                    <div class="field" style="margin-top: 8px;">
                        <div class="field-row">
                            <label>Custom:</label>
                            <input type="color" id="customColor" value="#2a9d8f">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Marker Icons -->
            <div class="panel">
                <div class="panel-header" data-panel="icons">
                    Marker Icon <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelIcons"></div>
            </div>

            <!-- Properties -->
            <div class="panel">
                <div class="panel-header" data-panel="properties">
                    Properties <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelProperties">
                    <p style="color: var(--text-muted); font-size: 12px; font-style: italic;">Select an object to edit its properties.</p>
                </div>
            </div>

            <!-- Objects -->
            <div class="panel">
                <div class="panel-header" data-panel="objects">
                    Objects <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelObjects">
                    <div id="objectList"></div>
                </div>
            </div>

            <!-- Map Settings -->
            <div class="panel">
                <div class="panel-header" data-panel="settings">
                    Map Settings <span class="arrow">&#9660;</span>
                </div>
                <div class="panel-body" id="panelSettings">
                    <div class="field">
                        <label>Map Name</label>
                        <input type="text" id="mapName" value="Untitled Map">
                    </div>
                    <div class="field">
                        <div class="field-row">
                            <label>Background:</label>
                            <input type="color" id="mapBgColor" value="#1a2332">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-row">
                            <input type="checkbox" id="mapGrid" checked>
                            <label>Show Grid</label>
                        </div>
                    </div>
                    <div class="field">
                        <label>Grid Size</label>
                        <input type="number" id="mapGridSize" value="40" min="10" max="200" step="10">
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Canvas ─────────────────────────────────────── -->
        <div class="canvas-area" id="canvasArea">
            <canvas id="mapCanvas"></canvas>
        </div>

        <!-- ── Status bar ─────────────────────────────────── -->
        <div class="statusbar">
            <span class="status-coords" id="statusCoords">0, 0</span>
            <span id="statusZoom">100%</span>
            <span id="statusTool">Select</span>
            <span id="statusInfo"></span>
        </div>
    </div>

    <!-- ── New Map modal ─────────────────────────────────── -->
    <div class="modal-overlay hidden" id="newMapModal">
        <div class="modal">
            <h3>New Map</h3>
            <div class="field">
                <label>Width (px)</label>
                <input type="number" id="newMapW" value="1200" min="200" max="8000" step="100">
            </div>
            <div class="field">
                <label>Height (px)</label>
                <input type="number" id="newMapH" value="800" min="200" max="8000" step="100">
            </div>
            <div class="modal-actions">
                <button class="btn" id="newMapCancel">Cancel</button>
                <button class="btn btn-primary" id="newMapCreate">Create</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".json" style="display:none">

    <script src="map-engine.js"></script>
    <script>
    (function () {
        'use strict';
        var ME = window.MapEngine;

        /* ── State ────────────────────────────────────────── */
        var map = ME.createMap(1200, 800);
        var view = { zoom: 1, offsetX: 0, offsetY: 0 };
        var currentTool = 'select';
        var selectedId = null;
        var selectedColor = '#2a9d8f';
        var selectedIcon = 'pin';
        var currentPalette = 'terrain';

        // Polygon drawing state
        var polyPoints = [];
        var isDrawingPoly = false;

        // Drag state
        var isDragging = false;
        var dragStart = { x: 0, y: 0 };
        var dragObjStart = { x: 0, y: 0 };
        var dragVertex = null; // {regionId, vertexIndex}
        var isPanning = false;
        var panStart = { x: 0, y: 0 };
        var viewStart = { ox: 0, oy: 0 };

        /* ── DOM refs ─────────────────────────────────────── */
        var canvas = document.getElementById('mapCanvas');
        var ctx = canvas.getContext('2d');
        var canvasArea = document.getElementById('canvasArea');
        var statusCoords = document.getElementById('statusCoords');
        var statusZoom = document.getElementById('statusZoom');
        var statusTool = document.getElementById('statusTool');
        var statusInfo = document.getElementById('statusInfo');

        /* ── Canvas sizing ────────────────────────────────── */
        function resizeCanvas() {
            var rect = canvasArea.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);

        function redraw() {
            // Draw the in-progress polygon preview
            ME.render(ctx, map, view, selectedId);
            if (isDrawingPoly && polyPoints.length > 0) {
                ctx.save();
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = selectedColor;
                ctx.lineWidth = 2;
                ctx.fillStyle = selectedColor;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                var p0 = ME.worldToScreen(polyPoints[0].x, polyPoints[0].y, view);
                ctx.moveTo(p0.x, p0.y);
                for (var i = 1; i < polyPoints.length; i++) {
                    var p = ME.worldToScreen(polyPoints[i].x, polyPoints[i].y, view);
                    ctx.lineTo(p.x, p.y);
                }
                if (polyPoints.length >= 3) {
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.stroke();
                ctx.restore();
                // Vertex dots
                ctx.fillStyle = '#fff';
                for (var i = 0; i < polyPoints.length; i++) {
                    var p = ME.worldToScreen(polyPoints[i].x, polyPoints[i].y, view);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        /* ── Tool selection ───────────────────────────────── */
        var toolBtns = document.querySelectorAll('[data-tool]');
        function setTool(tool) {
            currentTool = tool;
            toolBtns.forEach(function (b) { b.classList.toggle('active', b.dataset.tool === tool); });
            statusTool.textContent = tool.charAt(0).toUpperCase() + tool.slice(1);
            // Cancel in-progress polygon
            if (tool !== 'polygon' && isDrawingPoly) {
                isDrawingPoly = false;
                polyPoints = [];
                redraw();
            }
            // Cursor
            if (tool === 'pan') canvasArea.style.cursor = 'grab';
            else if (tool === 'select') canvasArea.style.cursor = 'default';
            else canvasArea.style.cursor = 'crosshair';
        }
        toolBtns.forEach(function (b) {
            b.addEventListener('click', function () { setTool(b.dataset.tool); });
        });

        /* ── Palette UI ───────────────────────────────────── */
        function buildPaletteTabs() {
            var tabs = document.getElementById('paletteTabs');
            tabs.innerHTML = '';
            Object.keys(ME.PALETTES).forEach(function (key) {
                var tab = document.createElement('button');
                tab.className = 'palette-tab' + (key === currentPalette ? ' active' : '');
                tab.textContent = ME.PALETTES[key].name;
                tab.addEventListener('click', function () {
                    currentPalette = key;
                    buildPaletteTabs();
                    buildPaletteGrid();
                });
                tabs.appendChild(tab);
            });
        }

        function buildPaletteGrid() {
            var grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            var colors = ME.PALETTES[currentPalette].colors;
            colors.forEach(function (c) {
                var sw = document.createElement('div');
                sw.className = 'palette-swatch' + (c === selectedColor ? ' selected' : '');
                sw.style.background = c;
                sw.title = c;
                sw.addEventListener('click', function () {
                    selectedColor = c;
                    document.getElementById('customColor').value = c;
                    buildPaletteGrid();
                    // Update selected object color
                    if (selectedId) {
                        var obj = ME.findObject(map, selectedId);
                        if (obj) {
                            ME.pushHistory(map);
                            if (obj.type === 'region') obj.fill = c;
                            else if (obj.type === 'marker') obj.color = c;
                            else if (obj.type === 'label') obj.color = c;
                            updateProperties();
                            updateObjectList();
                            redraw();
                        }
                    }
                });
                grid.appendChild(sw);
            });
        }

        document.getElementById('customColor').addEventListener('input', function (e) {
            selectedColor = e.target.value;
            buildPaletteGrid();
        });

        /* ── Icon picker ──────────────────────────────────── */
        function buildIconPicker() {
            var panel = document.getElementById('panelIcons');
            panel.innerHTML = '';
            var grid = document.createElement('div');
            grid.className = 'icon-grid';
            Object.keys(ME.MARKER_ICONS).forEach(function (key) {
                var icon = ME.MARKER_ICONS[key];
                var btn = document.createElement('button');
                btn.className = 'icon-btn' + (key === selectedIcon ? ' active' : '');
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + icon.path + '"/></svg>' + icon.label;
                btn.addEventListener('click', function () {
                    selectedIcon = key;
                    buildIconPicker();
                    // Update selected marker
                    if (selectedId) {
                        var obj = ME.findObject(map, selectedId);
                        if (obj && obj.type === 'marker') {
                            ME.pushHistory(map);
                            obj.icon = key;
                            updateProperties();
                            redraw();
                        }
                    }
                });
                grid.appendChild(btn);
            });
            panel.appendChild(grid);
        }

        /* ── Layer panel ──────────────────────────────────── */
        function buildLayerPanel() {
            var panel = document.getElementById('panelLayers');
            panel.innerHTML = '';
            var icons = { background: '&#9638;', regions: '&#9650;', markers: '&#9899;', labels: 'T' };
            ME.LAYER_ORDER.forEach(function (key) {
                var layer = map.layers[key];
                var item = document.createElement('div');
                item.className = 'layer-item';
                item.innerHTML =
                    '<span class="layer-icon">' + icons[key] + '</span>' +
                    '<span class="layer-name">' + key + '</span>' +
                    '<button class="layer-toggle ' + (layer.visible ? '' : 'off') + '" data-layer="' + key + '" data-action="visibility">' +
                        (layer.visible ? '&#128065;' : '&#128064;') +
                    '</button>' +
                    '<button class="layer-toggle ' + (layer.locked ? '' : 'off') + '" data-layer="' + key + '" data-action="lock">' +
                        (layer.locked ? '&#128274;' : '&#128275;') +
                    '</button>';
                panel.appendChild(item);
            });
            panel.addEventListener('click', function (e) {
                var btn = e.target.closest('.layer-toggle');
                if (!btn) return;
                var key = btn.dataset.layer;
                var action = btn.dataset.action;
                if (action === 'visibility') {
                    map.layers[key].visible = !map.layers[key].visible;
                } else if (action === 'lock') {
                    map.layers[key].locked = !map.layers[key].locked;
                }
                buildLayerPanel();
                redraw();
            });
        }

        /* ── Object list ──────────────────────────────────── */
        function updateObjectList() {
            var list = document.getElementById('objectList');
            list.innerHTML = '';
            var all = map.regions.concat(map.markers).concat(map.labels);
            if (all.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; font-style: italic;">No objects yet.</p>';
                return;
            }
            all.forEach(function (obj) {
                var item = document.createElement('div');
                item.className = 'obj-list-item' + (obj.id === selectedId ? ' selected' : '');
                var color = obj.fill || obj.color || '#888';
                var name = obj.name || obj.label || obj.text || obj.type;
                item.innerHTML =
                    '<span class="obj-color" style="background:' + color + '"></span>' +
                    '<span class="obj-name">' + name + '</span>' +
                    '<button class="obj-delete" title="Delete">&times;</button>';
                item.addEventListener('click', function (e) {
                    if (e.target.closest('.obj-delete')) {
                        ME.pushHistory(map);
                        ME.removeObject(map, obj.id);
                        if (selectedId === obj.id) selectedId = null;
                        updateObjectList();
                        updateProperties();
                        redraw();
                        return;
                    }
                    selectedId = obj.id;
                    updateObjectList();
                    updateProperties();
                    redraw();
                });
                list.appendChild(item);
            });
        }

        /* ── Properties panel ─────────────────────────────── */
        function updateProperties() {
            var panel = document.getElementById('panelProperties');
            if (!selectedId) {
                panel.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; font-style: italic;">Select an object to edit its properties.</p>';
                return;
            }
            var obj = ME.findObject(map, selectedId);
            if (!obj) {
                panel.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; font-style: italic;">Object not found.</p>';
                selectedId = null;
                return;
            }
            var html = '';
            if (obj.type === 'region') {
                html +=
                    '<div class="field"><label>Name</label><input type="text" id="propName" value="' + esc(obj.name) + '"></div>' +
                    '<div class="field"><div class="field-row"><label>Fill:</label><input type="color" id="propFill" value="' + obj.fill + '"></div></div>' +
                    '<div class="field"><div class="field-row"><label>Stroke:</label><input type="color" id="propStroke" value="' + obj.stroke + '"></div></div>' +
                    '<div class="field"><label>Stroke Width</label><input type="range" id="propStrokeW" min="0" max="8" step="0.5" value="' + obj.strokeWidth + '"></div>' +
                    '<div class="field"><label>Opacity</label><input type="range" id="propOpacity" min="0.1" max="1" step="0.05" value="' + obj.opacity + '"></div>' +
                    '<div class="field"><label>Vertices: ' + obj.points.length + '</label></div>';
            } else if (obj.type === 'marker') {
                html +=
                    '<div class="field"><label>Label</label><input type="text" id="propLabel" value="' + esc(obj.label) + '"></div>' +
                    '<div class="field"><div class="field-row"><label>Color:</label><input type="color" id="propColor" value="' + obj.color + '"></div></div>' +
                    '<div class="field"><label>Size</label><input type="range" id="propSize" min="16" max="64" step="2" value="' + obj.size + '"></div>' +
                    '<div class="field"><label>X</label><input type="number" id="propX" value="' + Math.round(obj.x) + '"></div>' +
                    '<div class="field"><label>Y</label><input type="number" id="propY" value="' + Math.round(obj.y) + '"></div>';
            } else if (obj.type === 'label') {
                html +=
                    '<div class="field"><label>Text</label><input type="text" id="propText" value="' + esc(obj.text) + '"></div>' +
                    '<div class="field"><div class="field-row"><label>Color:</label><input type="color" id="propColor" value="' + obj.color + '"></div></div>' +
                    '<div class="field"><label>Font Size</label><input type="range" id="propFontSize" min="8" max="72" step="1" value="' + obj.fontSize + '"></div>' +
                    '<div class="field"><label>Rotation</label><input type="range" id="propRotation" min="-180" max="180" step="1" value="' + obj.rotation + '"></div>' +
                    '<div class="field"><div class="field-row"><input type="checkbox" id="propBold" ' + (obj.bold ? 'checked' : '') + '><label>Bold</label></div></div>' +
                    '<div class="field"><div class="field-row"><input type="checkbox" id="propItalic" ' + (obj.italic ? 'checked' : '') + '><label>Italic</label></div></div>' +
                    '<div class="field"><label>Font</label><select id="propFont">' +
                        '<option value="serif"' + (obj.fontFamily === 'serif' ? ' selected' : '') + '>Serif</option>' +
                        '<option value="sans-serif"' + (obj.fontFamily === 'sans-serif' ? ' selected' : '') + '>Sans-serif</option>' +
                        '<option value="Cinzel, serif"' + (obj.fontFamily === 'Cinzel, serif' ? ' selected' : '') + '>Cinzel</option>' +
                        '<option value="Lora, serif"' + (obj.fontFamily === 'Lora, serif' ? ' selected' : '') + '>Lora</option>' +
                        '<option value="monospace"' + (obj.fontFamily === 'monospace' ? ' selected' : '') + '>Monospace</option>' +
                    '</select></div>';
            }
            panel.innerHTML = html;
            // Bind change events
            bindProp('propName',    function (v) { obj.name = v; updateObjectList(); });
            bindProp('propLabel',   function (v) { obj.label = v; updateObjectList(); });
            bindProp('propText',    function (v) { obj.text = v; updateObjectList(); });
            bindProp('propFill',    function (v) { obj.fill = v; selectedColor = v; });
            bindProp('propStroke',  function (v) { obj.stroke = v; });
            bindProp('propColor',   function (v) { obj.color = v; selectedColor = v; });
            bindProp('propStrokeW', function (v) { obj.strokeWidth = parseFloat(v); });
            bindProp('propOpacity', function (v) { obj.opacity = parseFloat(v); });
            bindProp('propSize',    function (v) { obj.size = parseInt(v); });
            bindProp('propFontSize', function (v) { obj.fontSize = parseInt(v); });
            bindProp('propRotation', function (v) { obj.rotation = parseInt(v); });
            bindProp('propX',       function (v) { obj.x = parseInt(v); });
            bindProp('propY',       function (v) { obj.y = parseInt(v); });
            bindProp('propFont',    function (v) { obj.fontFamily = v; });
            bindCheck('propBold',   function (v) { obj.bold = v; });
            bindCheck('propItalic', function (v) { obj.italic = v; });
        }

        function bindProp(id, fn) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', function () { fn(el.value); redraw(); });
            el.addEventListener('change', function () { ME.pushHistory(map); fn(el.value); redraw(); });
        }
        function bindCheck(id, fn) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('change', function () { ME.pushHistory(map); fn(el.checked); redraw(); });
        }
        function esc(s) { return (s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

        /* ── Panel collapse ───────────────────────────────── */
        document.querySelectorAll('.panel-header').forEach(function (h) {
            h.addEventListener('click', function () {
                h.classList.toggle('collapsed');
                var body = h.nextElementSibling;
                body.classList.toggle('collapsed');
            });
        });

        /* ── Map settings bindings ────────────────────────── */
        document.getElementById('mapName').addEventListener('input', function (e) { map.name = e.target.value; });
        document.getElementById('mapBgColor').addEventListener('input', function (e) { map.backgroundColor = e.target.value; redraw(); });
        document.getElementById('mapGrid').addEventListener('change', function (e) { map.gridEnabled = e.target.checked; redraw(); });
        document.getElementById('mapGridSize').addEventListener('change', function (e) { map.gridSize = parseInt(e.target.value) || 40; redraw(); });

        /* ── Mouse events ─────────────────────────────────── */
        function getCanvasPos(e) {
            var rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        canvas.addEventListener('mousedown', function (e) {
            var pos = getCanvasPos(e);
            var wp = ME.screenToWorld(pos.x, pos.y, view);

            // Middle click or pan tool: start panning
            if (e.button === 1 || currentTool === 'pan') {
                isPanning = true;
                panStart = pos;
                viewStart = { ox: view.offsetX, oy: view.offsetY };
                canvasArea.style.cursor = 'grabbing';
                e.preventDefault();
                return;
            }

            if (e.button !== 0) return;

            if (currentTool === 'select') {
                // Check for vertex handle drag on selected region
                if (selectedId) {
                    var vtx = ME.hitTestVertex(map, wp.x, wp.y, view);
                    if (vtx) {
                        var region = ME.findObject(map, vtx.regionId);
                        if (region && region.id === selectedId) {
                            ME.pushHistory(map);
                            dragVertex = vtx;
                            isDragging = true;
                            return;
                        }
                    }
                }
                var hit = ME.hitTest(map, wp.x, wp.y, view);
                if (hit) {
                    selectedId = hit;
                    var obj = ME.findObject(map, hit);
                    isDragging = true;
                    dragStart = { x: wp.x, y: wp.y };
                    if (obj.type === 'marker' || obj.type === 'label') {
                        dragObjStart = { x: obj.x, y: obj.y };
                    } else if (obj.type === 'region') {
                        // Store all point positions for region drag
                        dragObjStart = obj.points.map(function (p) { return { x: p.x, y: p.y }; });
                    }
                    ME.pushHistory(map);
                } else {
                    selectedId = null;
                }
                updateObjectList();
                updateProperties();
                redraw();
            } else if (currentTool === 'polygon') {
                if (!isDrawingPoly) {
                    isDrawingPoly = true;
                    polyPoints = [{ x: wp.x, y: wp.y }];
                } else {
                    // Check if closing the polygon (click near first point)
                    var dx = wp.x - polyPoints[0].x;
                    var dy = wp.y - polyPoints[0].y;
                    var closeDist = 15 / view.zoom;
                    if (polyPoints.length >= 3 && Math.sqrt(dx * dx + dy * dy) < closeDist) {
                        ME.pushHistory(map);
                        var r = ME.createRegion(map, polyPoints, { fill: selectedColor });
                        selectedId = r.id;
                        isDrawingPoly = false;
                        polyPoints = [];
                        updateObjectList();
                        updateProperties();
                    } else {
                        polyPoints.push({ x: wp.x, y: wp.y });
                    }
                }
                redraw();
            } else if (currentTool === 'marker') {
                ME.pushHistory(map);
                var m = ME.createMarker(map, wp.x, wp.y, { icon: selectedIcon, color: selectedColor });
                selectedId = m.id;
                updateObjectList();
                updateProperties();
                redraw();
            } else if (currentTool === 'label') {
                ME.pushHistory(map);
                var text = prompt('Enter label text:', 'Label');
                if (text) {
                    var l = ME.createLabel(map, wp.x, wp.y, text, { color: selectedColor });
                    selectedId = l.id;
                    updateObjectList();
                    updateProperties();
                }
                redraw();
            }
        });

        canvas.addEventListener('mousemove', function (e) {
            var pos = getCanvasPos(e);
            var wp = ME.screenToWorld(pos.x, pos.y, view);
            statusCoords.textContent = Math.round(wp.x) + ', ' + Math.round(wp.y);

            if (isPanning) {
                view.offsetX = viewStart.ox + (pos.x - panStart.x);
                view.offsetY = viewStart.oy + (pos.y - panStart.y);
                redraw();
                return;
            }

            if (isDragging && selectedId) {
                if (dragVertex) {
                    var region = ME.findObject(map, dragVertex.regionId);
                    if (region) {
                        region.points[dragVertex.vertexIndex] = { x: wp.x, y: wp.y };
                        redraw();
                    }
                    return;
                }
                var obj = ME.findObject(map, selectedId);
                if (!obj) return;
                var dx = wp.x - dragStart.x;
                var dy = wp.y - dragStart.y;
                if (obj.type === 'marker' || obj.type === 'label') {
                    obj.x = dragObjStart.x + dx;
                    obj.y = dragObjStart.y + dy;
                } else if (obj.type === 'region') {
                    for (var i = 0; i < obj.points.length; i++) {
                        obj.points[i] = { x: dragObjStart[i].x + dx, y: dragObjStart[i].y + dy };
                    }
                }
                redraw();
            }
        });

        canvas.addEventListener('mouseup', function () {
            isDragging = false;
            dragVertex = null;
            if (isPanning) {
                isPanning = false;
                canvasArea.style.cursor = currentTool === 'pan' ? 'grab' : (currentTool === 'select' ? 'default' : 'crosshair');
            }
        });

        /* ── Zoom ─────────────────────────────────────────── */
        canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            var pos = getCanvasPos(e);
            var wp = ME.screenToWorld(pos.x, pos.y, view);
            var delta = e.deltaY > 0 ? 0.9 : 1.1;
            var newZoom = Math.max(0.1, Math.min(10, view.zoom * delta));
            // Zoom toward cursor
            view.offsetX = pos.x - wp.x * newZoom;
            view.offsetY = pos.y - wp.y * newZoom;
            view.zoom = newZoom;
            statusZoom.textContent = Math.round(view.zoom * 100) + '%';
            redraw();
        }, { passive: false });

        /* ── Double-click to finish polygon ───────────────── */
        canvas.addEventListener('dblclick', function () {
            if (currentTool === 'polygon' && isDrawingPoly && polyPoints.length >= 3) {
                ME.pushHistory(map);
                var r = ME.createRegion(map, polyPoints, { fill: selectedColor });
                selectedId = r.id;
                isDrawingPoly = false;
                polyPoints = [];
                updateObjectList();
                updateProperties();
                redraw();
            }
        });

        /* ── Keyboard shortcuts ───────────────────────────── */
        document.addEventListener('keydown', function (e) {
            // Don't intercept when typing in inputs
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

            if (e.key === 'v' || e.key === 'V') { setTool('select'); }
            else if (e.key === 'h' || e.key === 'H') { setTool('pan'); }
            else if (e.key === 'p' || e.key === 'P') { setTool('polygon'); }
            else if (e.key === 'm' || e.key === 'M') { setTool('marker'); }
            else if (e.key === 't' || e.key === 'T') { setTool('label'); }
            else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedId) {
                    ME.pushHistory(map);
                    ME.removeObject(map, selectedId);
                    selectedId = null;
                    updateObjectList();
                    updateProperties();
                    redraw();
                }
            }
            else if (e.key === 'Escape') {
                if (isDrawingPoly) {
                    isDrawingPoly = false;
                    polyPoints = [];
                    redraw();
                }
                selectedId = null;
                updateObjectList();
                updateProperties();
                redraw();
            }
            else if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    map = ME.redo(map);
                } else {
                    map = ME.undo(map);
                }
                syncSettingsUI();
                updateObjectList();
                updateProperties();
                redraw();
            }
            else if (e.ctrlKey && e.key === 'y') {
                e.preventDefault();
                map = ME.redo(map);
                syncSettingsUI();
                updateObjectList();
                updateProperties();
                redraw();
            }
            else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveMap();
            }
        });

        /* ── Toolbar buttons ──────────────────────────────── */
        document.getElementById('btnUndo').addEventListener('click', function () {
            map = ME.undo(map);
            syncSettingsUI();
            updateObjectList();
            updateProperties();
            redraw();
        });
        document.getElementById('btnRedo').addEventListener('click', function () {
            map = ME.redo(map);
            syncSettingsUI();
            updateObjectList();
            updateProperties();
            redraw();
        });

        document.getElementById('btnNew').addEventListener('click', function () {
            document.getElementById('newMapModal').classList.remove('hidden');
        });
        document.getElementById('newMapCancel').addEventListener('click', function () {
            document.getElementById('newMapModal').classList.add('hidden');
        });
        document.getElementById('newMapCreate').addEventListener('click', function () {
            var w = parseInt(document.getElementById('newMapW').value) || 1200;
            var h = parseInt(document.getElementById('newMapH').value) || 800;
            ME.clearHistory();
            map = ME.createMap(w, h);
            selectedId = null;
            view = { zoom: 1, offsetX: 0, offsetY: 0 };
            syncSettingsUI();
            updateObjectList();
            updateProperties();
            buildLayerPanel();
            redraw();
            document.getElementById('newMapModal').classList.add('hidden');
        });

        document.getElementById('btnExport').addEventListener('click', function () {
            statusInfo.textContent = 'Exporting...';
            ME.exportPNG(map, 2).then(function (blob) {
                ME.downloadBlob(blob, (map.name || 'map') + '.png');
                statusInfo.textContent = 'Exported!';
                setTimeout(function () { statusInfo.textContent = ''; }, 2000);
            });
        });

        function saveMap() {
            var json = ME.saveToJSON(map);
            var blob = new Blob([json], { type: 'application/json' });
            ME.downloadBlob(blob, (map.name || 'map') + '.json');
            statusInfo.textContent = 'Saved!';
            setTimeout(function () { statusInfo.textContent = ''; }, 2000);
        }
        document.getElementById('btnSave').addEventListener('click', saveMap);

        document.getElementById('btnLoad').addEventListener('click', function () {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    ME.clearHistory();
                    map = ME.loadFromJSON(ev.target.result);
                    selectedId = null;
                    view = { zoom: 1, offsetX: 0, offsetY: 0 };
                    syncSettingsUI();
                    updateObjectList();
                    updateProperties();
                    buildLayerPanel();
                    redraw();
                    statusInfo.textContent = 'Loaded: ' + map.name;
                    setTimeout(function () { statusInfo.textContent = ''; }, 2000);
                } catch (err) {
                    alert('Failed to load map: ' + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        function syncSettingsUI() {
            document.getElementById('mapName').value = map.name;
            document.getElementById('mapBgColor').value = map.backgroundColor;
            document.getElementById('mapGrid').checked = map.gridEnabled;
            document.getElementById('mapGridSize').value = map.gridSize;
        }

        /* ── Autosave ─────────────────────────────────────── */
        function autosave() {
            try {
                localStorage.setItem('mapmaker-autosave', ME.saveToJSON(map));
            } catch (e) { /* quota exceeded, silently fail */ }
        }
        function loadAutosave() {
            try {
                var data = localStorage.getItem('mapmaker-autosave');
                if (data) {
                    map = ME.loadFromJSON(data);
                    syncSettingsUI();
                }
            } catch (e) { /* corrupt data, use default */ }
        }
        setInterval(autosave, 15000);

        /* ── Init ─────────────────────────────────────────── */
        loadAutosave();
        buildPaletteTabs();
        buildPaletteGrid();
        buildIconPicker();
        buildLayerPanel();
        updateObjectList();
        resizeCanvas();

        // Center the map view
        setTimeout(function () {
            var rect = canvasArea.getBoundingClientRect();
            view.offsetX = (rect.width - map.canvas.width) / 2;
            view.offsetY = (rect.height - map.canvas.height) / 2;
            statusZoom.textContent = '100%';
            redraw();
        }, 50);
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
