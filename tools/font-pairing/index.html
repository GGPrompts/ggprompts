<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Pairing Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafaf8;
            --bg-panel: #ffffff;
            --bg-hover: #f5f5f3;
            --bg-input: #f7f7f5;
            --border: #e8e6e1;
            --border-focus: #999;
            --text: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #999;
            --accent: #1a1a1a;
            --accent-soft: #f0efed;
            --accent-hover: #333;
            --danger: #c44;
            --success: #2a7;
            --radius: 6px;
            --radius-sm: 3px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
            --transition: 150ms ease;
            --font-ui: 'Inter', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-back {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-back:hover { color: var(--text); }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ── Buttons ─────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-panel);
            color: var(--text);
            font: 13px/1 var(--font-ui);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-focus); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-icon { padding: 7px 8px; }

        /* ── Layout ─────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 49px);
        }

        /* ── Sidebar ─────────────────────────────────────── */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            max-height: calc(100vh - 49px);
            position: sticky;
            top: 49px;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section:last-child { border-bottom: none; }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .font-selector {
            margin-bottom: 16px;
        }

        .font-selector label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .font-search-wrap {
            position: relative;
            margin-bottom: 4px;
        }

        .font-search {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-input);
            font: 13px var(--font-ui);
            color: var(--text);
            outline: none;
            transition: border-color var(--transition);
        }
        .font-search:focus { border-color: var(--border-focus); }

        .font-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }
        .font-dropdown.open { display: block; }

        .font-option {
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background var(--transition);
        }
        .font-option:hover { background: var(--bg-hover); }
        .font-option.selected { background: var(--accent-soft); font-weight: 500; }

        .font-preview-name {
            font-size: 14px;
            font-weight: 500;
            margin-top: 6px;
            padding: 6px 0;
            color: var(--text);
        }

        /* ── Sliders ─────────────────────────────────────── */
        .control-row {
            margin-bottom: 12px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .control-row label span {
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            font-size: 11px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-input);
            font: 13px var(--font-ui);
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        select:focus { border-color: var(--border-focus); }

        /* ── Curated Pairings ─────────────────────────────── */
        .pairing-chip {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-panel);
            cursor: pointer;
            margin-bottom: 6px;
            transition: all var(--transition);
        }
        .pairing-chip:hover { border-color: var(--border-focus); background: var(--bg-hover); }
        .pairing-chip .chip-heading {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .pairing-chip .chip-body {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .pairing-chip .chip-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Favorites ─────────────────────────────────────── */
        .fav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 6px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .fav-item:hover { border-color: var(--border-focus); background: var(--bg-hover); }
        .fav-info { flex: 1; min-width: 0; }
        .fav-heading-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-body-name { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
            flex-shrink: 0;
        }
        .fav-remove:hover { color: var(--danger); }
        .fav-empty {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ── Preview Area ─────────────────────────────────── */
        .preview-area {
            padding: 40px;
            overflow-y: auto;
            max-height: calc(100vh - 49px);
        }

        .preview-layout-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
        }

        .layout-tab {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-panel);
            font: 12px var(--font-ui);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .layout-tab:hover { border-color: var(--border-focus); }
        .layout-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ── Preview: Article ─────────────────────────────── */
        .preview-article {
            max-width: 680px;
            margin: 0 auto;
        }

        .preview-article h1 {
            margin-bottom: 12px;
            line-height: 1.15;
        }

        .preview-article .article-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .preview-article p {
            margin-bottom: 20px;
        }

        .preview-article h2 {
            margin-top: 36px;
            margin-bottom: 12px;
        }

        .preview-article blockquote {
            border-left: 3px solid var(--border);
            padding-left: 20px;
            margin: 24px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        /* ── Preview: Cards ─────────────────────────────── */
        .preview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 960px;
            margin: 0 auto;
        }

        .preview-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .preview-card-img {
            height: 160px;
            background: linear-gradient(135deg, #e8e6e1 0%, #d5d2cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .preview-card-body {
            padding: 20px;
        }

        .preview-card-body h3 {
            margin-bottom: 8px;
        }

        .preview-card-body p {
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .preview-card-body .card-link {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
        }

        /* ── Preview: Hero ─────────────────────────────── */
        .preview-hero {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-section {
            text-align: center;
            padding: 80px 40px;
            background: linear-gradient(160deg, #f8f7f5 0%, #eceae5 100%);
            border-radius: var(--radius);
            margin-bottom: 32px;
        }

        .hero-section h1 {
            margin-bottom: 16px;
            line-height: 1.1;
        }

        .hero-section p {
            max-width: 540px;
            margin: 0 auto 28px;
            color: var(--text-secondary);
        }

        .hero-section .hero-btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-weight: 500;
            cursor: pointer;
        }

        .hero-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            text-align: center;
        }

        .hero-feature h3 { margin-bottom: 8px; }
        .hero-feature p { color: var(--text-secondary); }

        .hero-feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-soft);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* ── Code Output ─────────────────────────────────── */
        .code-output {
            max-width: 680px;
            margin: 40px auto 0;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .code-output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg-input);
            border-bottom: 1px solid var(--border);
        }

        .code-output-header span {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .code-output pre {
            padding: 16px;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Toast ─────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: all 300ms ease;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── Responsive ─────────────────────────────────── */
        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .preview-area {
                padding: 24px 16px;
                max-height: none;
            }
            .hero-features {
                grid-template-columns: 1fr;
            }
            .hero-section {
                padding: 48px 24px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="../index.html" class="header-back">&larr; Tools</a>
    <div class="header-title">Font Pairing Playground</div>
    <div class="header-actions">
        <button class="btn btn-sm" id="btnSaveFav">Save Pairing</button>
        <button class="btn btn-sm btn-primary" id="btnCopyCSS">Copy CSS</button>
    </div>
</div>

<div class="app">
    <div class="sidebar">

        <!-- Heading Font -->
        <div class="sidebar-section">
            <div class="section-label">Heading Font</div>
            <div class="font-selector" id="headingSelector">
                <div class="font-search-wrap">
                    <input type="text" class="font-search" placeholder="Search fonts..." data-target="heading" autocomplete="off">
                    <div class="font-dropdown" data-target="heading"></div>
                </div>
                <div class="font-preview-name" id="headingFontName">Playfair Display</div>
            </div>
            <div class="control-row">
                <label>Size <span id="headingSizeVal">36px</span></label>
                <input type="range" id="headingSize" min="20" max="80" value="36">
            </div>
            <div class="control-row">
                <label>Weight <span id="headingWeightVal">700</span></label>
                <select id="headingWeight">
                    <option value="300">300 Light</option>
                    <option value="400">400 Regular</option>
                    <option value="500">500 Medium</option>
                    <option value="600">600 Semi-Bold</option>
                    <option value="700" selected>700 Bold</option>
                    <option value="800">800 Extra-Bold</option>
                    <option value="900">900 Black</option>
                </select>
            </div>
            <div class="control-row">
                <label>Line Height <span id="headingLhVal">1.2</span></label>
                <input type="range" id="headingLh" min="0.8" max="2.0" step="0.05" value="1.2">
            </div>
            <div class="control-row">
                <label>Letter Spacing <span id="headingLsVal">0em</span></label>
                <input type="range" id="headingLs" min="-0.05" max="0.15" step="0.005" value="0">
            </div>
        </div>

        <!-- Body Font -->
        <div class="sidebar-section">
            <div class="section-label">Body Font</div>
            <div class="font-selector" id="bodySelector">
                <div class="font-search-wrap">
                    <input type="text" class="font-search" placeholder="Search fonts..." data-target="body" autocomplete="off">
                    <div class="font-dropdown" data-target="body"></div>
                </div>
                <div class="font-preview-name" id="bodyFontName">Source Sans 3</div>
            </div>
            <div class="control-row">
                <label>Size <span id="bodySizeVal">16px</span></label>
                <input type="range" id="bodySize" min="12" max="28" value="16">
            </div>
            <div class="control-row">
                <label>Weight <span id="bodyWeightVal">400</span></label>
                <select id="bodyWeight">
                    <option value="300">300 Light</option>
                    <option value="400" selected>400 Regular</option>
                    <option value="500">500 Medium</option>
                    <option value="600">600 Semi-Bold</option>
                    <option value="700">700 Bold</option>
                </select>
            </div>
            <div class="control-row">
                <label>Line Height <span id="bodyLhVal">1.6</span></label>
                <input type="range" id="bodyLh" min="1.0" max="2.4" step="0.05" value="1.6">
            </div>
            <div class="control-row">
                <label>Letter Spacing <span id="bodyLsVal">0em</span></label>
                <input type="range" id="bodyLs" min="-0.02" max="0.08" step="0.005" value="0">
            </div>
        </div>

        <!-- Curated Pairings -->
        <div class="sidebar-section">
            <div class="section-label">Curated Pairings</div>
            <div id="curatedList"></div>
        </div>

        <!-- Saved Favorites -->
        <div class="sidebar-section">
            <div class="section-label">Saved Favorites</div>
            <div id="favList"></div>
        </div>

    </div>

    <div class="preview-area">
        <div class="preview-layout-tabs">
            <button class="layout-tab active" data-layout="article">Article</button>
            <button class="layout-tab" data-layout="cards">Cards</button>
            <button class="layout-tab" data-layout="hero">Hero</button>
        </div>

        <div id="previewContent"></div>

        <div class="code-output" id="codeOutput">
            <div class="code-output-header">
                <span>Generated CSS</span>
                <button class="btn btn-sm" id="btnCopyLink">Copy Link Tag</button>
            </div>
            <pre id="codeBlock"></pre>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    'use strict';

    /* ── Popular Google Fonts ─────────────────────────── */
    const FONT_LIST = [
        'Alegreya', 'Alegreya Sans', 'Archivo', 'Archivo Narrow',
        'Barlow', 'Barlow Condensed', 'Be Vietnam Pro', 'Bitter',
        'Cabin', 'Cormorant Garamond', 'Crimson Pro', 'Crimson Text',
        'DM Sans', 'DM Serif Display', 'DM Serif Text',
        'EB Garamond', 'Exo 2',
        'Fira Sans', 'Fira Sans Condensed',
        'Gelasio', 'IBM Plex Mono', 'IBM Plex Sans', 'IBM Plex Serif',
        'Inter', 'Josefin Sans', 'Josefin Slab',
        'Karla', 'Lato', 'Libre Baskerville', 'Libre Franklin',
        'Literata', 'Lora',
        'Manrope', 'Merriweather', 'Merriweather Sans', 'Montserrat',
        'Mulish', 'Noto Sans', 'Noto Serif', 'Nunito', 'Nunito Sans',
        'Old Standard TT', 'Open Sans', 'Oswald', 'Outfit', 'Overpass',
        'PT Sans', 'PT Serif', 'Poppins', 'Playfair Display',
        'Public Sans', 'Quicksand', 'Raleway', 'Red Hat Display',
        'Roboto', 'Roboto Condensed', 'Roboto Mono', 'Roboto Slab', 'Roboto Serif',
        'Rubik', 'Sora', 'Source Code Pro', 'Source Sans 3', 'Source Serif 4',
        'Space Grotesk', 'Space Mono', 'Spectral',
        'Work Sans', 'Zilla Slab'
    ];

    const CURATED_PAIRINGS = [
        { heading: 'Playfair Display', body: 'Source Sans 3', label: 'Classic editorial' },
        { heading: 'DM Serif Display', body: 'DM Sans', label: 'Modern & balanced' },
        { heading: 'Cormorant Garamond', body: 'Fira Sans', label: 'Elegant contrast' },
        { heading: 'Montserrat', body: 'Merriweather', label: 'Strong geometric + serif' },
        { heading: 'Libre Baskerville', body: 'Open Sans', label: 'Warm readability' },
        { heading: 'Lora', body: 'Nunito Sans', label: 'Friendly literary' },
        { heading: 'Oswald', body: 'Lato', label: 'Bold condensed + clean' },
        { heading: 'Roboto Slab', body: 'Roboto', label: 'Material slab pairing' },
        { heading: 'Crimson Pro', body: 'Work Sans', label: 'Sharp editorial' },
        { heading: 'Space Grotesk', body: 'Source Serif 4', label: 'Tech-meets-type' },
        { heading: 'Bitter', body: 'Raleway', label: 'Sturdy slab + thin sans' },
        { heading: 'Alegreya', body: 'Alegreya Sans', label: 'Super-family harmony' },
        { heading: 'Old Standard TT', body: 'Nunito', label: 'Classical contrast' },
        { heading: 'Spectral', body: 'Karla', label: 'Minimal literary' },
        { heading: 'Red Hat Display', body: 'Inter', label: 'SaaS landing page' },
    ];

    /* ── State ─────────────────────────────────────── */
    let state = {
        headingFont: 'Playfair Display',
        bodyFont: 'Source Sans 3',
        headingSize: 36,
        headingWeight: '700',
        headingLh: 1.2,
        headingLs: 0,
        bodySize: 16,
        bodyWeight: '400',
        bodyLh: 1.6,
        bodyLs: 0,
        layout: 'article'
    };

    const loadedFonts = new Set();

    /* ── DOM refs ─────────────────────────────────── */
    const $preview = document.getElementById('previewContent');
    const $codeBlock = document.getElementById('codeBlock');
    const $toast = document.getElementById('toast');
    const $headingName = document.getElementById('headingFontName');
    const $bodyName = document.getElementById('bodyFontName');
    const $favList = document.getElementById('favList');

    /* ── Font loading ──────────────────────────────── */
    function loadFont(name, weights) {
        const key = name + ':' + (weights || '400;700');
        if (loadedFonts.has(key)) return;
        loadedFonts.add(key);

        const slug = name.replace(/ /g, '+');
        const w = weights || '300;400;500;600;700;800;900';
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${slug}:wght@${w}&display=swap`;
        document.head.appendChild(link);
    }

    function ensureFontsLoaded() {
        loadFont(state.headingFont);
        loadFont(state.bodyFont);
    }

    /* ── Font search dropdowns ─────────────────────── */
    function initFontSearch(containerEl) {
        const input = containerEl.querySelector('.font-search');
        const dropdown = containerEl.querySelector('.font-dropdown');
        const target = input.dataset.target; // 'heading' or 'body'
        let selectedIndex = -1;

        function renderOptions(filter) {
            const lf = (filter || '').toLowerCase();
            const matches = FONT_LIST.filter(f => f.toLowerCase().includes(lf));
            const current = target === 'heading' ? state.headingFont : state.bodyFont;

            dropdown.innerHTML = matches.map(f =>
                `<div class="font-option${f === current ? ' selected' : ''}" data-font="${f}" style="font-family:'${f}',sans-serif">${f}</div>`
            ).join('');

            // Preload visible fonts for preview in dropdown
            matches.slice(0, 15).forEach(f => loadFont(f));

            selectedIndex = -1;
        }

        function pickFont(name) {
            if (target === 'heading') {
                state.headingFont = name;
                $headingName.textContent = name;
                $headingName.style.fontFamily = `'${name}', sans-serif`;
            } else {
                state.bodyFont = name;
                $bodyName.textContent = name;
                $bodyName.style.fontFamily = `'${name}', sans-serif`;
            }
            loadFont(name);
            input.value = '';
            dropdown.classList.remove('open');
            update();
        }

        input.addEventListener('focus', () => {
            renderOptions(input.value);
            dropdown.classList.add('open');
        });

        input.addEventListener('input', () => {
            renderOptions(input.value);
            dropdown.classList.add('open');
        });

        input.addEventListener('keydown', (e) => {
            const items = dropdown.querySelectorAll('.font-option');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                items.forEach((el, i) => el.style.background = i === selectedIndex ? 'var(--bg-hover)' : '');
                if (items[selectedIndex]) items[selectedIndex].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, 0);
                items.forEach((el, i) => el.style.background = i === selectedIndex ? 'var(--bg-hover)' : '');
                if (items[selectedIndex]) items[selectedIndex].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && selectedIndex >= 0 && items[selectedIndex]) {
                e.preventDefault();
                pickFont(items[selectedIndex].dataset.font);
            } else if (e.key === 'Escape') {
                dropdown.classList.remove('open');
                input.blur();
            }
        });

        dropdown.addEventListener('click', (e) => {
            const opt = e.target.closest('.font-option');
            if (opt) pickFont(opt.dataset.font);
        });

        document.addEventListener('click', (e) => {
            if (!containerEl.contains(e.target)) dropdown.classList.remove('open');
        });
    }

    /* ── Slider/select wiring ──────────────────────── */
    function wireControl(id, stateKey, displayId, formatter) {
        const el = document.getElementById(id);
        const valEl = document.getElementById(displayId);
        el.addEventListener('input', () => {
            const v = el.tagName === 'SELECT' ? el.value : parseFloat(el.value);
            state[stateKey] = v;
            if (valEl) valEl.textContent = formatter ? formatter(v) : v;
            update();
        });
    }

    /* ── Preview layouts ────────────────────────────── */
    const ARTICLE_HTML = `
        <div class="preview-article">
            <h1 class="preview-heading">The Art of Typography in Modern Design</h1>
            <div class="article-meta preview-body">By Jane Doe &middot; 8 min read &middot; February 2026</div>
            <p class="preview-body">Typography is more than just choosing fonts. It is the art and technique of arranging type to make written language legible, readable, and visually appealing. Good typography establishes a strong visual hierarchy, provides a graphic balance to a website, and sets the overall tone of the product.</p>
            <h2 class="preview-heading" style="font-size:0.7em">Choosing the Right Pairing</h2>
            <p class="preview-body">The best font pairings create contrast without conflict. A classic approach is to combine a serif heading with a sans-serif body, creating visual interest while maintaining readability. The key is finding fonts that complement each other's personality.</p>
            <blockquote class="preview-body">Typography is two-dimensional architecture, based on experience and imagination, and guided by rules and readability.</blockquote>
            <p class="preview-body">Consider the x-height, stroke contrast, and overall rhythm of each typeface. Fonts with similar proportions but different structures tend to pair beautifully. Test your combinations at multiple sizes and line lengths to ensure they work across your entire design system.</p>
            <h2 class="preview-heading" style="font-size:0.7em">Hierarchy and Scale</h2>
            <p class="preview-body">A well-defined typographic scale creates rhythm and structure. Start with your body text size and work outward using consistent ratios. Popular scales include the classical (1.618), the perfect fourth (1.333), and the major third (1.250). Each creates a different feeling of progression and emphasis.</p>
        </div>`;

    const CARDS_HTML = `
        <div class="preview-cards">
            <div class="preview-card">
                <div class="preview-card-img">960 x 640</div>
                <div class="preview-card-body">
                    <h3 class="preview-heading" style="font-size:0.6em">Design Systems at Scale</h3>
                    <p class="preview-body">How leading teams maintain consistency across hundreds of components and dozens of products.</p>
                    <a class="card-link preview-body" href="#">Read more</a>
                </div>
            </div>
            <div class="preview-card">
                <div class="preview-card-img">960 x 640</div>
                <div class="preview-card-body">
                    <h3 class="preview-heading" style="font-size:0.6em">The Psychology of Fonts</h3>
                    <p class="preview-body">Why certain typefaces feel trustworthy, modern, or playful, and how to use that to your advantage.</p>
                    <a class="card-link preview-body" href="#">Read more</a>
                </div>
            </div>
            <div class="preview-card">
                <div class="preview-card-img">960 x 640</div>
                <div class="preview-card-body">
                    <h3 class="preview-heading" style="font-size:0.6em">Variable Fonts Explained</h3>
                    <p class="preview-body">A single font file that behaves like multiple fonts, opening new possibilities for responsive typography.</p>
                    <a class="card-link preview-body" href="#">Read more</a>
                </div>
            </div>
        </div>`;

    const HERO_HTML = `
        <div class="preview-hero">
            <div class="hero-section">
                <h1 class="preview-heading" style="font-size:1.4em">Build Beautiful Interfaces</h1>
                <p class="preview-body">A modern toolkit for designers and developers who care about typography, spacing, and the details that make great products.</p>
                <button class="hero-btn preview-body">Get Started</button>
            </div>
            <div class="hero-features">
                <div class="hero-feature">
                    <div class="hero-feature-icon">Aa</div>
                    <h3 class="preview-heading" style="font-size:0.55em">Type Scale</h3>
                    <p class="preview-body">Harmonious sizing from caption to display, built on proven mathematical ratios.</p>
                </div>
                <div class="hero-feature">
                    <div class="hero-feature-icon">{ }</div>
                    <h3 class="preview-heading" style="font-size:0.55em">Code Ready</h3>
                    <p class="preview-body">Copy-paste CSS and HTML link tags directly into your project. No build step needed.</p>
                </div>
                <div class="hero-feature">
                    <div class="hero-feature-icon">&hearts;</div>
                    <h3 class="preview-heading" style="font-size:0.55em">Curated Pairs</h3>
                    <p class="preview-body">Hand-picked combinations tested across real-world layouts and screen sizes.</p>
                </div>
            </div>
        </div>`;

    /* ── Render ─────────────────────────────────────── */
    function update() {
        ensureFontsLoaded();

        const layouts = { article: ARTICLE_HTML, cards: CARDS_HTML, hero: HERO_HTML };
        $preview.innerHTML = layouts[state.layout];

        // Apply heading styles
        $preview.querySelectorAll('.preview-heading').forEach(el => {
            const base = parseFloat(el.style.fontSize || '1');
            el.style.fontFamily = `'${state.headingFont}', serif`;
            el.style.fontSize = (state.headingSize * base) + 'px';
            el.style.fontWeight = state.headingWeight;
            el.style.lineHeight = state.headingLh;
            el.style.letterSpacing = state.headingLs + 'em';
        });

        // Apply body styles
        $preview.querySelectorAll('.preview-body').forEach(el => {
            el.style.fontFamily = `'${state.bodyFont}', sans-serif`;
            el.style.fontSize = state.bodySize + 'px';
            el.style.fontWeight = state.bodyWeight;
            el.style.lineHeight = state.bodyLh;
            el.style.letterSpacing = state.bodyLs + 'em';
        });

        updateCode();
    }

    function updateCode() {
        const hSlug = state.headingFont.replace(/ /g, '+');
        const bSlug = state.bodyFont.replace(/ /g, '+');
        const linkTag = `<link href="https://fonts.googleapis.com/css2?family=${hSlug}:wght@${state.headingWeight}&family=${bSlug}:wght@${state.bodyWeight}&display=swap" rel="stylesheet">`;

        const hLs = state.headingLs !== 0 ? `\n  letter-spacing: ${state.headingLs}em;` : '';
        const bLs = state.bodyLs !== 0 ? `\n  letter-spacing: ${state.bodyLs}em;` : '';

        const css = `/* Heading */
h1, h2, h3 {
  font-family: '${state.headingFont}', serif;
  font-weight: ${state.headingWeight};
  line-height: ${state.headingLh};${hLs}
}

/* Body */
body, p, li {
  font-family: '${state.bodyFont}', sans-serif;
  font-size: ${state.bodySize}px;
  font-weight: ${state.bodyWeight};
  line-height: ${state.bodyLh};${bLs}
}`;

        $codeBlock.textContent = linkTag + '\n\n' + css;
    }

    function getGoogleLinkTag() {
        const hSlug = state.headingFont.replace(/ /g, '+');
        const bSlug = state.bodyFont.replace(/ /g, '+');
        return `<link href="https://fonts.googleapis.com/css2?family=${hSlug}:wght@${state.headingWeight}&family=${bSlug}:wght@${state.bodyWeight}&display=swap" rel="stylesheet">`;
    }

    /* ── Toast ─────────────────────────────────────── */
    let toastTimeout;
    function showToast(msg) {
        clearTimeout(toastTimeout);
        $toast.textContent = msg;
        $toast.classList.add('show');
        toastTimeout = setTimeout(() => $toast.classList.remove('show'), 2000);
    }

    /* ── Copy ─────────────────────────────────────── */
    document.getElementById('btnCopyCSS').addEventListener('click', () => {
        navigator.clipboard.writeText($codeBlock.textContent).then(() => showToast('CSS copied to clipboard'));
    });

    document.getElementById('btnCopyLink').addEventListener('click', () => {
        navigator.clipboard.writeText(getGoogleLinkTag()).then(() => showToast('Link tag copied to clipboard'));
    });

    /* ── Favorites (localStorage) ──────────────────── */
    const STORAGE_KEY = 'fontPairing_favorites';

    function loadFavorites() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
    }

    function saveFavorites(favs) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
    }

    function renderFavorites() {
        const favs = loadFavorites();
        if (favs.length === 0) {
            $favList.innerHTML = '<div class="fav-empty">No saved pairings yet</div>';
            return;
        }
        $favList.innerHTML = favs.map((f, i) => `
            <div class="fav-item" data-index="${i}">
                <div class="fav-info">
                    <div class="fav-heading-name">${f.headingFont}</div>
                    <div class="fav-body-name">${f.bodyFont}</div>
                </div>
                <button class="fav-remove" data-index="${i}" title="Remove">&times;</button>
            </div>
        `).join('');
    }

    document.getElementById('btnSaveFav').addEventListener('click', () => {
        const favs = loadFavorites();
        const exists = favs.some(f => f.headingFont === state.headingFont && f.bodyFont === state.bodyFont);
        if (exists) {
            showToast('Pairing already saved');
            return;
        }
        favs.push({
            headingFont: state.headingFont,
            bodyFont: state.bodyFont,
            headingWeight: state.headingWeight,
            bodyWeight: state.bodyWeight,
            headingSize: state.headingSize,
            bodySize: state.bodySize,
            headingLh: state.headingLh,
            bodyLh: state.bodyLh,
            headingLs: state.headingLs,
            bodyLs: state.bodyLs
        });
        saveFavorites(favs);
        renderFavorites();
        showToast('Pairing saved');
    });

    $favList.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.fav-remove');
        if (removeBtn) {
            e.stopPropagation();
            const favs = loadFavorites();
            favs.splice(parseInt(removeBtn.dataset.index), 1);
            saveFavorites(favs);
            renderFavorites();
            showToast('Pairing removed');
            return;
        }
        const item = e.target.closest('.fav-item');
        if (item) {
            const favs = loadFavorites();
            const f = favs[parseInt(item.dataset.index)];
            if (f) applyPairing(f);
        }
    });

    function applyPairing(p) {
        state.headingFont = p.headingFont;
        state.bodyFont = p.bodyFont;
        if (p.headingWeight) state.headingWeight = p.headingWeight;
        if (p.bodyWeight) state.bodyWeight = p.bodyWeight;
        if (p.headingSize) state.headingSize = p.headingSize;
        if (p.bodySize) state.bodySize = p.bodySize;
        if (p.headingLh) state.headingLh = p.headingLh;
        if (p.bodyLh) state.bodyLh = p.bodyLh;
        if (p.headingLs !== undefined) state.headingLs = p.headingLs;
        if (p.bodyLs !== undefined) state.bodyLs = p.bodyLs;

        // Sync UI
        $headingName.textContent = state.headingFont;
        $headingName.style.fontFamily = `'${state.headingFont}', sans-serif`;
        $bodyName.textContent = state.bodyFont;
        $bodyName.style.fontFamily = `'${state.bodyFont}', sans-serif`;

        document.getElementById('headingSize').value = state.headingSize;
        document.getElementById('headingSizeVal').textContent = state.headingSize + 'px';
        document.getElementById('headingWeight').value = state.headingWeight;
        document.getElementById('headingWeightVal').textContent = state.headingWeight;
        document.getElementById('headingLh').value = state.headingLh;
        document.getElementById('headingLhVal').textContent = state.headingLh;
        document.getElementById('headingLs').value = state.headingLs;
        document.getElementById('headingLsVal').textContent = state.headingLs + 'em';

        document.getElementById('bodySize').value = state.bodySize;
        document.getElementById('bodySizeVal').textContent = state.bodySize + 'px';
        document.getElementById('bodyWeight').value = state.bodyWeight;
        document.getElementById('bodyWeightVal').textContent = state.bodyWeight;
        document.getElementById('bodyLh').value = state.bodyLh;
        document.getElementById('bodyLhVal').textContent = state.bodyLh;
        document.getElementById('bodyLs').value = state.bodyLs;
        document.getElementById('bodyLsVal').textContent = state.bodyLs + 'em';

        update();
    }

    /* ── Curated pairings ──────────────────────────── */
    function renderCurated() {
        const $list = document.getElementById('curatedList');
        $list.innerHTML = CURATED_PAIRINGS.map((p, i) => `
            <button class="pairing-chip" data-index="${i}">
                <div class="chip-heading" style="font-family:'${p.heading}',serif">${p.heading}</div>
                <div class="chip-body" style="font-family:'${p.body}',sans-serif">${p.body}</div>
                <div class="chip-label">${p.label}</div>
            </button>
        `).join('');

        // Preload curated fonts
        CURATED_PAIRINGS.forEach(p => { loadFont(p.heading); loadFont(p.body); });

        $list.addEventListener('click', (e) => {
            const chip = e.target.closest('.pairing-chip');
            if (chip) {
                const p = CURATED_PAIRINGS[parseInt(chip.dataset.index)];
                applyPairing({ headingFont: p.heading, bodyFont: p.body, headingWeight: '700', bodyWeight: '400', headingSize: 36, bodySize: 16, headingLh: 1.2, bodyLh: 1.6, headingLs: 0, bodyLs: 0 });
                showToast(`Applied: ${p.heading} + ${p.body}`);
            }
        });
    }

    /* ── Layout tabs ───────────────────────────────── */
    document.querySelectorAll('.layout-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.layout-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            state.layout = tab.dataset.layout;
            update();
        });
    });

    /* ── Wire controls ─────────────────────────────── */
    wireControl('headingSize', 'headingSize', 'headingSizeVal', v => v + 'px');
    wireControl('headingWeight', 'headingWeight', 'headingWeightVal');
    wireControl('headingLh', 'headingLh', 'headingLhVal');
    wireControl('headingLs', 'headingLs', 'headingLsVal', v => v + 'em');
    wireControl('bodySize', 'bodySize', 'bodySizeVal', v => v + 'px');
    wireControl('bodyWeight', 'bodyWeight', 'bodyWeightVal');
    wireControl('bodyLh', 'bodyLh', 'bodyLhVal');
    wireControl('bodyLs', 'bodyLs', 'bodyLsVal', v => v + 'em');

    /* ── Init ─────────────────────────────────────── */
    initFontSearch(document.getElementById('headingSelector'));
    initFontSearch(document.getElementById('bodySelector'));
    renderCurated();
    renderFavorites();

    // Load initial fonts and render
    loadFont('Playfair Display');
    loadFont('Source Sans 3');
    $headingName.style.fontFamily = "'Playfair Display', serif";
    $bodyName.style.fontFamily = "'Source Sans 3', sans-serif";
    update();

})();
</script>

<script defer src="../../prompt-viewer.js"></script>
