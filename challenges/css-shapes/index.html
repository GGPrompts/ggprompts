<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS Shapes Challenge — The Arena. Part of GG Prompts.">
    <title>CSS Shapes Challenge — The Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c14;
            --bg-panel: #0e1120;
            --bg-editor: #080a12;
            --border: #1a2040;
            --border-active: #3b82f6;
            --neon-blue: #3b82f6;
            --neon-cyan: #22d3ee;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --neon-red: #ef4444;
            --neon-purple: #a855f7;
            --text-bright: #f0f4ff;
            --text-mid: #94a3c0;
            --text-dim: #4a5578;
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-mid);
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--neon-blue); }
        .back-link::before { content: '\2190  '; }

        .topbar-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-bright);
            text-transform: uppercase;
        }

        .topbar-progress {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.04em;
        }
        .topbar-progress .done { color: var(--neon-green); }

        /* Level bar */
        .level-bar {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            overflow-x: auto;
        }

        .level-tab {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-dim);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .level-tab:hover { color: var(--text-mid); }
        .level-tab.active {
            color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
        }
        .level-tab .check {
            color: var(--neon-green);
            font-size: 0.7rem;
            display: none;
        }
        .level-tab.solved .check { display: inline; }

        /* Main layout */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 88px);
        }

        /* Shape display panels */
        .panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .panel:nth-child(2) { border-right: none; }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .panel-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .completion-badge {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--neon-green);
            background: rgba(34, 197, 94, 0.06);
            display: none;
        }
        .completion-badge.visible { display: inline-block; }

        .shape-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            position: relative;
        }

        /* Checkerboard background for shape area */
        .shape-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            pointer-events: none;
        }

        .shape-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* Target shapes — rendered by JS */
        .target-shape {
            position: relative;
        }

        /* User shape — styled by user CSS */
        .user-shape {
            position: relative;
        }

        /* Editor section */
        .editor-section {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            max-height: 50vh;
            min-height: 220px;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 8px;
        }

        .editor-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .editor-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .level-info {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-mid);
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border: 1px solid var(--border);
        }
        .level-info .shape-name { color: var(--neon-cyan); }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-mid);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: var(--text-dim);
            color: var(--text-bright);
        }
        .btn-primary {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-primary:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        .btn-hint {
            border-color: var(--neon-amber);
            color: var(--neon-amber);
        }
        .btn-hint:hover {
            background: rgba(245, 158, 11, 0.1);
        }
        .btn-next {
            border-color: var(--neon-green);
            color: var(--neon-green);
            display: none;
        }
        .btn-next.visible { display: inline-block; }
        .btn-next:hover {
            background: rgba(34, 197, 94, 0.1);
        }

        .editor-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .line-numbers {
            width: 40px;
            padding: 12px 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-dim);
            text-align: right;
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--border);
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
        }

        #cssEditor {
            flex: 1;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-bright);
            background: var(--bg-editor);
            border: none;
            outline: none;
            resize: none;
            tab-size: 2;
            white-space: pre;
            overflow: auto;
        }
        #cssEditor::placeholder { color: var(--text-dim); }

        /* Hints */
        .hints-panel {
            grid-column: 1 / -1;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            background: rgba(245, 158, 11, 0.04);
            border-top: 1px solid transparent;
            transition: max-height 0.3s, padding 0.3s;
        }
        .hints-panel.visible {
            max-height: 200px;
            padding: 10px 16px;
            border-top-color: rgba(245, 158, 11, 0.15);
        }

        .hint {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--neon-amber);
            padding: 3px 0;
            display: none;
        }
        .hint.revealed { display: block; }
        .hint::before {
            content: '\25B8 ';
            color: var(--text-dim);
        }

        /* Success flash */
        @keyframes successFlash {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 20px 4px rgba(34, 197, 94, 0.3); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .shape-area.success {
            animation: successFlash 0.8s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                height: auto;
                min-height: calc(100vh - 88px);
            }

            .panel { border-right: none; border-bottom: 1px solid var(--border); }
            .shape-area { min-height: 180px; padding: 16px; }

            .editor-section {
                min-height: 260px;
                max-height: none;
            }

            .topbar { flex-wrap: wrap; gap: 6px; }
            .topbar-title { order: -1; width: 100%; text-align: center; }
            .editor-toolbar { flex-wrap: wrap; }
            .level-info { display: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../index.html" class="back-link">Challenges</a>
        <span class="topbar-title">CSS Shapes Challenge</span>
        <span class="topbar-progress"><span class="done" id="solvedCount">0</span>/5 Completed</span>
    </div>

    <div class="level-bar" id="levelBar"></div>

    <div class="main">
        <!-- Target shape -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-label">Target Shape</span>
            </div>
            <div class="shape-area" id="targetArea">
                <div class="shape-container">
                    <div class="target-shape" id="targetShape"></div>
                </div>
            </div>
        </div>

        <!-- User shape -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-label">Your Shape</span>
                <span class="completion-badge" id="completionBadge">Matched</span>
            </div>
            <div class="shape-area" id="userArea">
                <div class="shape-container">
                    <div class="user-shape" id="userShape"></div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-section">
            <div class="editor-toolbar">
                <div class="editor-left">
                    <span class="editor-label">CSS Editor</span>
                    <span class="level-info">Shape: <span class="shape-name" id="shapeName">Circle</span> // Style the div + ::before + ::after</span>
                </div>
                <div class="editor-actions">
                    <button class="btn btn-hint" id="hintBtn">Hint</button>
                    <button class="btn" id="resetBtn">Reset</button>
                    <button class="btn btn-primary" id="checkBtn">Check</button>
                    <button class="btn btn-next" id="nextBtn">Next Level</button>
                </div>
            </div>
            <div class="editor-body">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea id="cssEditor" spellcheck="false" placeholder="/* Style the .shape div to match the target */"></textarea>
            </div>
        </div>

        <!-- Hints -->
        <div class="hints-panel" id="hintsPanel"></div>
    </div>

    <style id="userStyles"></style>

    <script>
    (function() {
        /* ================================================================
           LEVEL DEFINITIONS
           Each level defines a target shape and how to check completion.
           ================================================================ */
        var LEVELS = [
            {
                name: 'Circle',
                difficulty: 1,
                description: 'Create a circle using border-radius',
                targetStyle: {
                    width: '120px',
                    height: '120px',
                    background: '#3b82f6',
                    borderRadius: '50%'
                },
                targetBefore: null,
                targetAfter: null,
                starterCSS: '.shape {\n  /* Make a 120px blue circle */\n  width: 120px;\n  height: 120px;\n  background: #3b82f6;\n  \n}',
                hints: [
                    'A circle is a square with fully rounded corners',
                    'Set border-radius: 50% to make any square into a circle',
                    'The div should be 120px x 120px with background: #3b82f6'
                ],
                check: function(el) {
                    var s = window.getComputedStyle(el);
                    var w = parseInt(s.width);
                    var h = parseInt(s.height);
                    var br = s.borderRadius;
                    var bg = s.backgroundColor;
                    var isCircle = (w >= 100 && w <= 140) && (h >= 100 && h <= 140);
                    var isRound = br === '50%' || br === '60px' || parseInt(br) >= 50;
                    var hasColor = bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
                    return isCircle && isRound && hasColor;
                }
            },
            {
                name: 'Triangle',
                difficulty: 2,
                description: 'Create a triangle using the border trick',
                targetStyle: {
                    width: '0',
                    height: '0',
                    borderLeft: '60px solid transparent',
                    borderRight: '60px solid transparent',
                    borderBottom: '104px solid #ef4444',
                    background: 'transparent'
                },
                targetBefore: null,
                targetAfter: null,
                starterCSS: '.shape {\n  /* Create an upward-pointing triangle */\n  /* Hint: Use the border trick with width: 0; height: 0 */\n  \n}',
                hints: [
                    'Triangles in CSS use the border trick: set width and height to 0',
                    'Make one border colored and the adjacent ones transparent',
                    'For an upward triangle: border-bottom is colored, border-left and border-right are transparent',
                    'Try: border-left: 60px solid transparent; border-right: 60px solid transparent; border-bottom: 104px solid #ef4444'
                ],
                check: function(el) {
                    var s = window.getComputedStyle(el);
                    var w = parseInt(s.width);
                    var h = parseInt(s.height);
                    var bb = s.borderBottomColor || s.borderTopColor;
                    var bl = s.borderLeftColor;
                    var bbw = parseInt(s.borderBottomWidth) || parseInt(s.borderTopWidth);
                    var isZeroSize = (w === 0 && h === 0);
                    var hasBorder = bbw > 40;
                    var hasTransparent = bl === 'transparent' || bl === 'rgba(0, 0, 0, 0)';
                    return isZeroSize && hasBorder && hasTransparent;
                }
            },
            {
                name: 'Star',
                difficulty: 3,
                description: 'Create a 5-pointed star with CSS transforms',
                targetStyle: {
                    width: '0',
                    height: '0',
                    borderLeft: '50px solid transparent',
                    borderRight: '50px solid transparent',
                    borderBottom: '70px solid #f59e0b',
                    position: 'relative',
                    background: 'transparent'
                },
                targetBefore: {
                    content: '""',
                    position: 'absolute',
                    width: '0',
                    height: '0',
                    borderLeft: '50px solid transparent',
                    borderRight: '50px solid transparent',
                    borderBottom: '70px solid #f59e0b',
                    top: '23px',
                    left: '-50px',
                    transform: 'rotate(72deg)'
                },
                targetAfter: {
                    content: '""',
                    position: 'absolute',
                    width: '0',
                    height: '0',
                    borderLeft: '50px solid transparent',
                    borderRight: '50px solid transparent',
                    borderBottom: '70px solid #f59e0b',
                    top: '23px',
                    left: '-50px',
                    transform: 'rotate(-72deg)'
                },
                starterCSS: '.shape {\n  /* A star is built from 3 triangles rotated */\n  /* Start with a triangle, then use ::before and ::after */\n  width: 0;\n  height: 0;\n  position: relative;\n  \n}\n\n.shape::before {\n  content: "";\n  position: absolute;\n  \n}\n\n.shape::after {\n  content: "";\n  position: absolute;\n  \n}',
                hints: [
                    'A 5-pointed star is made from 3 triangles overlapping',
                    'The main .shape is one triangle. ::before and ::after are 2 more triangles rotated',
                    'Each triangle: border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 70px solid #f59e0b',
                    '::before and ::after should be positioned at top: 23px; left: -50px',
                    '::before rotate(72deg), ::after rotate(-72deg)'
                ],
                check: function(el) {
                    var s = window.getComputedStyle(el);
                    var before = window.getComputedStyle(el, '::before');
                    var after = window.getComputedStyle(el, '::after');
                    var hasBase = parseInt(s.borderBottomWidth) > 30 || parseInt(s.borderTopWidth) > 30;
                    var hasBefore = before.content !== 'none' && before.content !== '';
                    var hasAfter = after.content !== 'none' && after.content !== '';
                    var beforeRotated = before.transform !== 'none';
                    var afterRotated = after.transform !== 'none';
                    return hasBase && hasBefore && hasAfter && (beforeRotated || afterRotated);
                }
            },
            {
                name: 'Heart',
                difficulty: 4,
                description: 'Create a heart using rotated squares with rounded corners',
                targetStyle: {
                    width: '100px',
                    height: '100px',
                    position: 'relative',
                    transform: 'rotate(45deg)',
                    background: '#ef4444'
                },
                targetBefore: {
                    content: '""',
                    position: 'absolute',
                    width: '100px',
                    height: '100px',
                    borderRadius: '50%',
                    background: '#ef4444',
                    top: '-50px',
                    left: '0'
                },
                targetAfter: {
                    content: '""',
                    position: 'absolute',
                    width: '100px',
                    height: '100px',
                    borderRadius: '50%',
                    background: '#ef4444',
                    left: '-50px',
                    top: '0'
                },
                starterCSS: '.shape {\n  /* A heart = rotated square + 2 circles */\n  /* The square is rotated 45deg */\n  /* ::before is a circle on top */\n  /* ::after is a circle on the left */\n  width: 100px;\n  height: 100px;\n  position: relative;\n  \n}\n\n.shape::before {\n  content: "";\n  position: absolute;\n  \n}\n\n.shape::after {\n  content: "";\n  position: absolute;\n  \n}',
                hints: [
                    'A heart shape is a rotated square with two circles attached',
                    'The .shape div is a 100px square rotated 45 degrees (transform: rotate(45deg))',
                    '::before is a 100px circle (border-radius: 50%) positioned at top: -50px',
                    '::after is another 100px circle positioned at left: -50px',
                    'All three pieces use background: #ef4444'
                ],
                check: function(el) {
                    var s = window.getComputedStyle(el);
                    var before = window.getComputedStyle(el, '::before');
                    var after = window.getComputedStyle(el, '::after');
                    var isRotated = s.transform !== 'none';
                    var hasBefore = before.content !== 'none' && before.content !== '';
                    var hasAfter = after.content !== 'none' && after.content !== '';
                    var beforeRound = before.borderRadius === '50%' || parseInt(before.borderRadius) >= 40;
                    var afterRound = after.borderRadius === '50%' || parseInt(after.borderRadius) >= 40;
                    return isRotated && hasBefore && hasAfter && (beforeRound || afterRound);
                }
            },
            {
                name: 'Speech Bubble',
                difficulty: 5,
                description: 'Create a speech bubble with a triangular tail',
                targetStyle: {
                    width: '160px',
                    height: '80px',
                    background: '#22d3ee',
                    borderRadius: '16px',
                    position: 'relative'
                },
                targetBefore: null,
                targetAfter: {
                    content: '""',
                    position: 'absolute',
                    width: '0',
                    height: '0',
                    borderTop: '16px solid #22d3ee',
                    borderLeft: '8px solid transparent',
                    borderRight: '16px solid transparent',
                    bottom: '-16px',
                    left: '24px'
                },
                starterCSS: '.shape {\n  /* Rounded rectangle with a triangle tail at the bottom */\n  width: 160px;\n  height: 80px;\n  position: relative;\n  \n}\n\n.shape::after {\n  content: "";\n  position: absolute;\n  /* Triangle tail using the border trick */\n  \n}',
                hints: [
                    'The bubble body is a rounded rectangle: background: #22d3ee; border-radius: 16px',
                    'The tail is a ::after pseudo-element using the border triangle trick',
                    'Position the tail at bottom: -16px; left: 24px',
                    'Tail borders: border-top: 16px solid #22d3ee; border-left: 8px solid transparent; border-right: 16px solid transparent',
                    'Make sure the ::after has width: 0; height: 0'
                ],
                check: function(el) {
                    var s = window.getComputedStyle(el);
                    var after = window.getComputedStyle(el, '::after');
                    var w = parseInt(s.width);
                    var h = parseInt(s.height);
                    var hasSize = w >= 120 && h >= 50;
                    var hasRadius = parseInt(s.borderRadius) > 0 || s.borderRadius.indexOf('px') > -1;
                    var hasBg = s.backgroundColor !== 'rgba(0, 0, 0, 0)' && s.backgroundColor !== 'transparent';
                    var hasAfter = after.content !== 'none' && after.content !== '';
                    var afterBorder = parseInt(after.borderTopWidth) > 5 || parseInt(after.borderBottomWidth) > 5;
                    return hasSize && hasRadius && hasBg && hasAfter && afterBorder;
                }
            }
        ];

        /* ================================================================
           STATE
           ================================================================ */
        var currentLevel = 0;
        var solvedLevels = {};
        var hintIndex = 0;

        /* ================================================================
           DOM REFS
           ================================================================ */
        var $levelBar = document.getElementById('levelBar');
        var $solvedCount = document.getElementById('solvedCount');
        var $targetShape = document.getElementById('targetShape');
        var $userShape = document.getElementById('userShape');
        var $userArea = document.getElementById('userArea');
        var $shapeName = document.getElementById('shapeName');
        var $completionBadge = document.getElementById('completionBadge');
        var $editor = document.getElementById('cssEditor');
        var $lineNumbers = document.getElementById('lineNumbers');
        var $userStyles = document.getElementById('userStyles');
        var $hintsPanel = document.getElementById('hintsPanel');
        var $hintBtn = document.getElementById('hintBtn');
        var $resetBtn = document.getElementById('resetBtn');
        var $checkBtn = document.getElementById('checkBtn');
        var $nextBtn = document.getElementById('nextBtn');

        /* ================================================================
           LEVEL TABS
           ================================================================ */
        function renderLevelTabs() {
            $levelBar.innerHTML = '';
            LEVELS.forEach(function(level, i) {
                var btn = document.createElement('button');
                btn.className = 'level-tab';
                if (i === currentLevel) btn.classList.add('active');
                if (solvedLevels[i]) btn.classList.add('solved');

                var checkSpan = document.createElement('span');
                checkSpan.className = 'check';
                checkSpan.textContent = '\u2713';
                btn.appendChild(checkSpan);

                btn.appendChild(document.createTextNode((i + 1) + '. ' + level.name));

                btn.addEventListener('click', function() { loadLevel(i); });
                $levelBar.appendChild(btn);
            });

            var count = Object.keys(solvedLevels).length;
            $solvedCount.textContent = count;
        }

        /* ================================================================
           APPLY STYLE OBJECT TO ELEMENT
           ================================================================ */
        function applyStyleObj(el, obj) {
            if (!obj) return;
            for (var key in obj) {
                if (obj.hasOwnProperty(key)) {
                    el.style[key] = obj[key];
                }
            }
        }

        /* ================================================================
           BUILD TARGET SHAPE
           ================================================================ */
        function buildTarget(level) {
            $targetShape.style.cssText = '';
            $targetShape.className = 'target-shape';

            applyStyleObj($targetShape, level.targetStyle);

            // Build ::before and ::after via a scoped style tag
            var css = '';
            if (level.targetBefore) {
                css += '#targetShape::before {';
                for (var k in level.targetBefore) {
                    css += camelToDash(k) + ': ' + level.targetBefore[k] + ';';
                }
                css += '}';
            }
            if (level.targetAfter) {
                css += '#targetShape::after {';
                for (var k2 in level.targetAfter) {
                    css += camelToDash(k2) + ': ' + level.targetAfter[k2] + ';';
                }
                css += '}';
            }

            var existingTargetStyle = document.getElementById('targetStyles');
            if (existingTargetStyle) existingTargetStyle.remove();
            if (css) {
                var styleTag = document.createElement('style');
                styleTag.id = 'targetStyles';
                styleTag.textContent = css;
                document.head.appendChild(styleTag);
            }
        }

        function camelToDash(str) {
            return str.replace(/([A-Z])/g, '-$1').toLowerCase();
        }

        /* ================================================================
           LOAD LEVEL
           ================================================================ */
        function loadLevel(idx) {
            currentLevel = idx;
            hintIndex = 0;
            var level = LEVELS[idx];

            $shapeName.textContent = level.name;
            $completionBadge.classList.remove('visible');
            $nextBtn.classList.remove('visible');
            $hintBtn.disabled = false;
            $hintBtn.style.opacity = '1';

            buildTarget(level);

            // Reset user shape
            $userShape.style.cssText = '';
            $userShape.className = 'user-shape';

            // Set editor
            $editor.value = level.starterCSS;
            applyUserCSS();

            // Build hints
            $hintsPanel.classList.remove('visible');
            $hintsPanel.innerHTML = '';
            level.hints.forEach(function(h) {
                var div = document.createElement('div');
                div.className = 'hint';
                div.textContent = h;
                $hintsPanel.appendChild(div);
            });

            renderLevelTabs();
            updateLineNumbers();
        }

        /* ================================================================
           APPLY USER CSS
           ================================================================ */
        function applyUserCSS() {
            var css = $editor.value;
            // Scope to #userShape
            var scoped = css.replace(/\.shape/g, '#userShape');
            $userStyles.textContent = scoped;
        }

        /* ================================================================
           CHECK COMPLETION
           ================================================================ */
        function checkCompletion() {
            var level = LEVELS[currentLevel];
            var passed = level.check($userShape);

            if (passed) {
                solvedLevels[currentLevel] = true;
                $completionBadge.classList.add('visible');
                $userArea.classList.add('success');
                setTimeout(function() { $userArea.classList.remove('success'); }, 800);

                if (currentLevel < LEVELS.length - 1) {
                    $nextBtn.classList.add('visible');
                }

                renderLevelTabs();
            } else {
                // Flash the check button red briefly
                $checkBtn.style.borderColor = 'var(--neon-red)';
                $checkBtn.style.color = 'var(--neon-red)';
                setTimeout(function() {
                    $checkBtn.style.borderColor = '';
                    $checkBtn.style.color = '';
                }, 600);
            }
        }

        /* ================================================================
           LINE NUMBERS
           ================================================================ */
        function updateLineNumbers() {
            var lines = $editor.value.split('\n').length;
            var nums = [];
            for (var i = 1; i <= lines; i++) nums.push(i);
            $lineNumbers.textContent = nums.join('\n');
        }

        /* ================================================================
           HINTS
           ================================================================ */
        function revealHint() {
            var hints = $hintsPanel.querySelectorAll('.hint');
            if (hintIndex < hints.length) {
                $hintsPanel.classList.add('visible');
                hints[hintIndex].classList.add('revealed');
                hintIndex++;
            }
            if (hintIndex >= hints.length) {
                $hintBtn.disabled = true;
                $hintBtn.style.opacity = '0.4';
            }
        }

        /* ================================================================
           EVENTS
           ================================================================ */
        $editor.addEventListener('input', function() {
            applyUserCSS();
            updateLineNumbers();
        });

        $editor.addEventListener('scroll', function() {
            $lineNumbers.scrollTop = $editor.scrollTop;
        });

        $editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                applyUserCSS();
                updateLineNumbers();
            }
        });

        $hintBtn.addEventListener('click', revealHint);

        $resetBtn.addEventListener('click', function() {
            $editor.value = LEVELS[currentLevel].starterCSS;
            applyUserCSS();
            updateLineNumbers();
            $completionBadge.classList.remove('visible');
            $nextBtn.classList.remove('visible');
        });

        $checkBtn.addEventListener('click', checkCompletion);

        $nextBtn.addEventListener('click', function() {
            if (currentLevel < LEVELS.length - 1) {
                loadLevel(currentLevel + 1);
            }
        });

        /* ================================================================
           INIT
           ================================================================ */
        loadLevel(0);
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
