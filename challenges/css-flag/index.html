<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flag Challenge — The Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c14;
            --bg-panel: #0e1120;
            --bg-editor: #080a12;
            --border: #1a2040;
            --border-active: #3b82f6;
            --neon-blue: #3b82f6;
            --neon-cyan: #22d3ee;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --neon-red: #ef4444;
            --text-bright: #f0f4ff;
            --text-mid: #94a3c0;
            --text-dim: #4a5578;
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-mid);
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--neon-blue); }
        .back-link::before { content: '\2190  '; }

        .topbar-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-bright);
            text-transform: uppercase;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-toggle {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-dim);
            background: transparent;
            border: 1px solid var(--border);
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .timer-toggle:hover { border-color: var(--text-dim); color: var(--text-mid); }
        .timer-toggle.active { border-color: var(--neon-amber); color: var(--neon-amber); }

        .timer-display {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--neon-amber);
            min-width: 60px;
            text-align: right;
            display: none;
        }
        .timer-display.visible { display: block; }

        /* Level selector */
        .level-bar {
            display: flex;
            align-items: center;
            gap: 0;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            overflow-x: auto;
        }

        .level-tab {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-dim);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            position: relative;
        }
        .level-tab:hover { color: var(--text-mid); }
        .level-tab.active {
            color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
        }
        .level-tab.locked {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .level-tab.locked::after {
            content: ' \1F512';
            font-size: 0.6rem;
        }
        .level-tab.solved::before {
            content: '\2713 ';
            color: var(--neon-green);
        }

        /* Main layout */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 88px);
        }

        /* Panels */
        .panel {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .panel:last-child { border-right: none; }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .panel-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .score-display {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .score-display .value {
            color: var(--neon-green);
            font-size: 0.85rem;
        }

        /* Flag display areas */
        .flag-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            position: relative;
        }

        .flag-frame {
            width: 300px;
            height: 200px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .flag-frame .flag {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* The target flag uses inline styles per level */
        #targetFlag .flag {
            /* Styles set by JS per level */
        }

        /* The user flag applies user CSS via a <style> tag */
        #userFlag .flag * {
            /* User CSS applies here */
        }

        /* Editor */
        .editor-section {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            max-height: 50vh;
            min-height: 200px;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .editor-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .html-preview {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border: 1px solid var(--border);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-mid);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: var(--text-dim);
            color: var(--text-bright);
        }
        .btn-primary {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-primary:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-hint {
            border-color: var(--neon-amber);
            color: var(--neon-amber);
        }
        .btn-hint:hover {
            background: rgba(245, 158, 11, 0.1);
        }

        .editor-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .line-numbers {
            width: 40px;
            padding: 12px 8px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-dim);
            text-align: right;
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--border);
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
        }

        #cssEditor {
            flex: 1;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-bright);
            background: var(--bg-editor);
            border: none;
            outline: none;
            resize: none;
            tab-size: 2;
            white-space: pre;
            overflow: auto;
        }

        #cssEditor::placeholder {
            color: var(--text-dim);
        }

        /* Hints panel */
        .hints-panel {
            display: none;
            grid-column: 1 / -1;
            padding: 12px 16px;
            background: rgba(245, 158, 11, 0.04);
            border-top: 1px solid rgba(245, 158, 11, 0.15);
        }
        .hints-panel.visible { display: block; }

        .hint {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--neon-amber);
            padding: 4px 0;
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity 0.3s, height 0.3s;
        }
        .hint.revealed {
            opacity: 1;
            height: auto;
            padding: 4px 0;
        }
        .hint::before {
            content: '\25B8 ';
            color: var(--text-dim);
        }

        /* Score overlay */
        .score-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 8, 14, 0.9);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .score-overlay.visible { display: flex; }

        .score-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .score-card h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 8px;
            letter-spacing: 0.06em;
        }

        .score-big {
            font-family: var(--font-display);
            font-size: 3rem;
            font-weight: 700;
            margin: 16px 0;
            line-height: 1;
        }
        .score-big.excellent { color: var(--neon-green); }
        .score-big.good { color: var(--neon-cyan); }
        .score-big.needs-work { color: var(--neon-amber); }

        .score-msg {
            font-size: 0.85rem;
            color: var(--text-mid);
            margin-bottom: 24px;
        }

        .score-card .btn {
            margin: 0 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                height: auto;
                min-height: calc(100vh - 88px);
            }

            .flag-area {
                min-height: 180px;
                padding: 16px;
            }

            .flag-frame {
                width: 240px;
                height: 160px;
            }

            .editor-section {
                min-height: 250px;
                max-height: none;
            }

            .topbar { flex-wrap: wrap; gap: 8px; }
            .topbar-title { order: -1; width: 100%; text-align: center; }
            .html-preview { display: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../index.html" class="back-link">Challenges</a>
        <span class="topbar-title">CSS Flag Challenge</span>
        <div class="topbar-right">
            <button class="timer-toggle" id="timerToggle">Timer: Off</button>
            <span class="timer-display" id="timerDisplay">00:00</span>
        </div>
    </div>

    <div class="level-bar" id="levelBar">
        <!-- Populated by JS -->
    </div>

    <div class="main">
        <!-- Target flag -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-label">Target</span>
                <span class="panel-label" id="flagName">France</span>
            </div>
            <div class="flag-area">
                <div class="flag-frame" id="targetFlag">
                    <div class="flag" id="targetFlagInner"></div>
                </div>
            </div>
        </div>

        <!-- User flag -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-label">Your Attempt</span>
                <div class="score-display">Match: <span class="value" id="liveScore">0%</span></div>
            </div>
            <div class="flag-area">
                <div class="flag-frame" id="userFlag">
                    <div class="flag" id="userFlagInner"></div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-section">
            <div class="editor-toolbar">
                <span class="editor-label">CSS Editor</span>
                <span class="html-preview" id="htmlPreview">&lt;div class="flag"&gt;&lt;/div&gt;</span>
                <div class="editor-actions">
                    <button class="btn btn-hint" id="hintBtn">Hint</button>
                    <button class="btn" id="resetBtn">Reset</button>
                    <button class="btn btn-primary" id="checkBtn">Check Score</button>
                </div>
            </div>
            <div class="editor-body">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea id="cssEditor" spellcheck="false" placeholder="/* Write your CSS here to recreate the flag */&#10;.flag {&#10;  &#10;}"></textarea>
            </div>
        </div>

        <!-- Hints -->
        <div class="hints-panel" id="hintsPanel">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Score overlay -->
    <div class="score-overlay" id="scoreOverlay">
        <div class="score-card">
            <h2 id="scoreTitle">Score</h2>
            <div class="score-big" id="scoreBig">0%</div>
            <p class="score-msg" id="scoreMsg">Keep trying!</p>
            <button class="btn" id="scoreDismiss">Keep Editing</button>
            <button class="btn btn-primary" id="scoreNext" style="display:none">Next Flag</button>
        </div>
    </div>

    <style id="userStyles"></style>

    <script>
    (function() {
        /* ================================================================
           FLAG DEFINITIONS
           ================================================================ */
        var FLAGS = [
            {
                name: 'France',
                difficulty: 'Beginner',
                html: '<div class="flag"></div>',
                htmlDisplay: '<div class="flag"></div>',
                targetCSS: 'background: linear-gradient(90deg, #002395 0%, #002395 33.33%, #fff 33.33%, #fff 66.66%, #ed2939 66.66%, #ed2939 100%);',
                applyTarget: function(el) {
                    el.style.background = 'linear-gradient(90deg, #002395 0%, #002395 33.33%, #fff 33.33%, #fff 66.66%, #ed2939 66.66%, #ed2939 100%)';
                },
                starterCSS: '.flag {\n  /* Hint: The French flag has 3 vertical stripes */\n  /* Blue | White | Red */\n  \n}',
                hints: [
                    'The flag is three equal vertical stripes: blue, white, red (left to right)',
                    'Try using background: linear-gradient(90deg, ...)',
                    'Use color stops at 33.33% and 66.66% to create sharp edges',
                    'French blue is #002395, white is #fff, red is #ed2939'
                ],
                passThreshold: 85
            },
            {
                name: 'Japan',
                difficulty: 'Beginner',
                html: '<div class="flag"><div class="circle"></div></div>',
                htmlDisplay: '<div class="flag"><div class="circle"></div></div>',
                targetCSS: '',
                applyTarget: function(el) {
                    el.style.background = '#fff';
                    el.innerHTML = '<div class="circle" style="width:120px;height:120px;background:#bc002d;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></div>';
                },
                starterCSS: '.flag {\n  background: #fff;\n  position: relative;\n}\n\n.flag .circle {\n  /* Create a red circle centered in the flag */\n  \n}',
                hints: [
                    'The Japanese flag is a red circle on a white background',
                    'The circle should be roughly 60% of the flag height',
                    'Use border-radius: 50% to make a circle',
                    'Center it with position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)',
                    'The red is #bc002d, the circle is about 120px'
                ],
                passThreshold: 80
            },
            {
                name: 'Germany',
                difficulty: 'Beginner',
                html: '<div class="flag"></div>',
                htmlDisplay: '<div class="flag"></div>',
                targetCSS: '',
                applyTarget: function(el) {
                    el.style.background = 'linear-gradient(180deg, #000 0%, #000 33.33%, #dd0000 33.33%, #dd0000 66.66%, #ffcc00 66.66%, #ffcc00 100%)';
                },
                starterCSS: '.flag {\n  /* Three horizontal stripes: Black, Red, Gold */\n  \n}',
                hints: [
                    'Germany has 3 horizontal stripes: black, red, gold (top to bottom)',
                    'Use a linear-gradient with 180deg (top to bottom)',
                    'Sharp color stops at 33.33% and 66.66%',
                    'Black is #000, red is #dd0000, gold is #ffcc00'
                ],
                passThreshold: 85
            },
            {
                name: 'Sweden',
                difficulty: 'Intermediate',
                html: '<div class="flag"><div class="cross-h"></div><div class="cross-v"></div></div>',
                htmlDisplay: '<div class="flag"><div class="cross-h"></div><div class="cross-v"></div></div>',
                targetCSS: '',
                applyTarget: function(el) {
                    el.style.background = '#006aa7';
                    el.style.position = 'relative';
                    el.innerHTML = '<div style="position:absolute;top:50%;left:0;transform:translateY(-50%);width:100%;height:40px;background:#fecc00"></div><div style="position:absolute;top:0;left:35%;width:40px;height:100%;background:#fecc00"></div>';
                },
                starterCSS: '.flag {\n  background: #006aa7;\n  position: relative;\n}\n\n.flag .cross-h {\n  /* Horizontal bar of the cross */\n  \n}\n\n.flag .cross-v {\n  /* Vertical bar of the cross (offset left) */\n  \n}',
                hints: [
                    'Sweden has a yellow Nordic cross on a blue background',
                    'The cross is offset to the left (at about 35% from the left)',
                    'Use two absolutely positioned divs for the horizontal and vertical bars',
                    'The cross bars are about 40px wide. Horizontal: full width, centered vertically. Vertical: full height, at left: 35%',
                    'Blue is #006aa7, yellow is #fecc00'
                ],
                passThreshold: 75
            }
        ];

        /* ================================================================
           STATE
           ================================================================ */
        var currentLevel = 0;
        var solvedLevels = {};
        var hintIndex = 0;
        var timerOn = false;
        var timerSeconds = 0;
        var timerInterval = null;
        var scoreCheckTimeout = null;

        /* ================================================================
           DOM REFS
           ================================================================ */
        var $levelBar = document.getElementById('levelBar');
        var $flagName = document.getElementById('flagName');
        var $targetFlagInner = document.getElementById('targetFlagInner');
        var $userFlagInner = document.getElementById('userFlagInner');
        var $userFlag = document.getElementById('userFlag');
        var $htmlPreview = document.getElementById('htmlPreview');
        var $editor = document.getElementById('cssEditor');
        var $lineNumbers = document.getElementById('lineNumbers');
        var $userStyles = document.getElementById('userStyles');
        var $liveScore = document.getElementById('liveScore');
        var $hintsPanel = document.getElementById('hintsPanel');
        var $hintBtn = document.getElementById('hintBtn');
        var $resetBtn = document.getElementById('resetBtn');
        var $checkBtn = document.getElementById('checkBtn');
        var $timerToggle = document.getElementById('timerToggle');
        var $timerDisplay = document.getElementById('timerDisplay');
        var $scoreOverlay = document.getElementById('scoreOverlay');
        var $scoreTitle = document.getElementById('scoreTitle');
        var $scoreBig = document.getElementById('scoreBig');
        var $scoreMsg = document.getElementById('scoreMsg');
        var $scoreDismiss = document.getElementById('scoreDismiss');
        var $scoreNext = document.getElementById('scoreNext');

        /* ================================================================
           LEVEL TABS
           ================================================================ */
        function renderLevelTabs() {
            $levelBar.innerHTML = '';
            FLAGS.forEach(function(flag, i) {
                var btn = document.createElement('button');
                btn.className = 'level-tab';
                btn.textContent = (i + 1) + '. ' + flag.name;
                if (i === currentLevel) btn.classList.add('active');
                if (solvedLevels[i]) btn.classList.add('solved');
                if (i > 0 && !solvedLevels[i - 1] && !solvedLevels[i]) btn.classList.add('locked');
                btn.addEventListener('click', function() {
                    if (btn.classList.contains('locked')) return;
                    loadLevel(i);
                });
                $levelBar.appendChild(btn);
            });
        }

        /* ================================================================
           LOAD LEVEL
           ================================================================ */
        function loadLevel(idx) {
            currentLevel = idx;
            hintIndex = 0;
            var flag = FLAGS[idx];

            $flagName.textContent = flag.name;
            $htmlPreview.innerHTML = escapeHTML(flag.htmlDisplay);

            // Set up target
            $targetFlagInner.style.cssText = '';
            $targetFlagInner.innerHTML = '';
            flag.applyTarget($targetFlagInner);

            // Set up user area
            $userFlagInner.style.cssText = '';
            $userFlagInner.innerHTML = '';
            // Build user HTML structure from the flag's html
            var tmp = document.createElement('div');
            tmp.innerHTML = flag.html;
            var flagDiv = tmp.querySelector('.flag');
            if (flagDiv) {
                // Copy children
                while (flagDiv.firstChild) {
                    var child = flagDiv.firstChild;
                    $userFlagInner.appendChild(child);
                }
            }

            // Set editor
            $editor.value = flag.starterCSS;
            applyUserCSS();

            // Reset hints
            $hintsPanel.classList.remove('visible');
            $hintsPanel.innerHTML = '';
            flag.hints.forEach(function(h) {
                var div = document.createElement('div');
                div.className = 'hint';
                div.textContent = h;
                $hintsPanel.appendChild(div);
            });

            // Reset timer
            if (timerOn) {
                timerSeconds = 0;
                updateTimerDisplay();
                clearInterval(timerInterval);
                timerInterval = setInterval(tickTimer, 1000);
            }

            renderLevelTabs();
            updateLineNumbers();
            scheduleScoreCheck();
        }

        /* ================================================================
           CSS APPLICATION
           ================================================================ */
        function applyUserCSS() {
            var css = $editor.value;
            // Scope all user CSS to #userFlag
            var scoped = css.replace(/\.flag/g, '#userFlag .flag');
            // Also handle .circle, .cross-h, .cross-v
            scoped = scoped.replace(/#userFlag \.flag\s+\./g, '#userFlag .flag .');
            $userStyles.textContent = scoped;
        }

        /* ================================================================
           SCORING — PIXEL COMPARISON
           ================================================================ */
        function computeScore(callback) {
            var W = 300, H = 200, scale = 1;

            // Render target to canvas
            renderToCanvas($targetFlagInner.parentElement, W, H, scale, function(targetData) {
                // Render user to canvas
                renderToCanvas($userFlag, W, H, scale, function(userData) {
                    if (!targetData || !userData) {
                        callback(0);
                        return;
                    }
                    var match = comparePixels(targetData, userData, W * scale, H * scale);
                    callback(match);
                });
            });
        }

        function renderToCanvas(element, w, h, scale, callback) {
            // Use html2canvas-lite approach: clone element to an SVG foreignObject, draw to canvas
            var clone = element.cloneNode(true);
            clone.style.width = w + 'px';
            clone.style.height = h + 'px';
            clone.style.position = 'absolute';
            clone.style.left = '-9999px';
            clone.style.top = '-9999px';
            document.body.appendChild(clone);

            // Get computed styles and inline them
            inlineStyles(clone);

            var svgNS = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('width', w * scale);
            svg.setAttribute('height', h * scale);
            svg.setAttribute('xmlns', svgNS);

            var fo = document.createElementNS(svgNS, 'foreignObject');
            fo.setAttribute('width', w);
            fo.setAttribute('height', h);

            // We need a full XHTML doc inside
            var body = document.createElementNS('http://www.w3.org/1999/xhtml', 'body');
            body.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
            body.style.margin = '0';
            body.style.padding = '0';

            body.appendChild(clone.cloneNode(true));
            fo.appendChild(body);
            svg.appendChild(fo);

            document.body.removeChild(clone);

            var svgStr = new XMLSerializer().serializeToString(svg);
            var img = new Image();
            var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            var url = URL.createObjectURL(blob);

            img.onload = function() {
                var canvas = document.createElement('canvas');
                canvas.width = w * scale;
                canvas.height = h * scale;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w * scale, h * scale);
                URL.revokeObjectURL(url);
                try {
                    var data = ctx.getImageData(0, 0, w * scale, h * scale);
                    callback(data);
                } catch (e) {
                    callback(null);
                }
            };
            img.onerror = function() {
                URL.revokeObjectURL(url);
                callback(null);
            };
            img.src = url;
        }

        function inlineStyles(el) {
            var computed = window.getComputedStyle(el);
            var important = ['background', 'background-color', 'background-image', 'border', 'border-radius',
                'width', 'height', 'position', 'top', 'left', 'right', 'bottom', 'transform',
                'display', 'flex-direction', 'align-items', 'justify-content', 'overflow',
                'margin', 'padding', 'box-sizing', 'color', 'font-size', 'font-family'];
            important.forEach(function(prop) {
                try {
                    var val = computed.getPropertyValue(prop);
                    if (val) el.style.setProperty(prop, val);
                } catch(e) {}
            });
            for (var i = 0; i < el.children.length; i++) {
                inlineStyles(el.children[i]);
            }
        }

        function comparePixels(dataA, dataB, w, h) {
            var a = dataA.data;
            var b = dataB.data;
            var len = a.length;
            var totalDiff = 0;
            var pixelCount = len / 4;

            for (var i = 0; i < len; i += 4) {
                var dr = Math.abs(a[i] - b[i]);
                var dg = Math.abs(a[i + 1] - b[i + 1]);
                var db = Math.abs(a[i + 2] - b[i + 2]);
                totalDiff += (dr + dg + db) / (255 * 3);
            }

            var similarity = 1 - (totalDiff / pixelCount);
            return Math.round(similarity * 100);
        }

        /* ================================================================
           LIVE SCORE
           ================================================================ */
        function scheduleScoreCheck() {
            clearTimeout(scoreCheckTimeout);
            scoreCheckTimeout = setTimeout(function() {
                computeScore(function(score) {
                    $liveScore.textContent = score + '%';
                    if (score >= 90) {
                        $liveScore.style.color = 'var(--neon-green)';
                    } else if (score >= 70) {
                        $liveScore.style.color = 'var(--neon-cyan)';
                    } else {
                        $liveScore.style.color = 'var(--neon-amber)';
                    }
                });
            }, 500);
        }

        /* ================================================================
           LINE NUMBERS
           ================================================================ */
        function updateLineNumbers() {
            var lines = $editor.value.split('\n').length;
            var nums = [];
            for (var i = 1; i <= lines; i++) nums.push(i);
            $lineNumbers.textContent = nums.join('\n');
        }

        /* ================================================================
           TIMER
           ================================================================ */
        function tickTimer() {
            timerSeconds++;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            var m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            var s = String(timerSeconds % 60).padStart(2, '0');
            $timerDisplay.textContent = m + ':' + s;
        }

        /* ================================================================
           HINTS
           ================================================================ */
        function revealHint() {
            var hints = $hintsPanel.querySelectorAll('.hint');
            if (hintIndex < hints.length) {
                $hintsPanel.classList.add('visible');
                hints[hintIndex].classList.add('revealed');
                hintIndex++;
            }
            if (hintIndex >= hints.length) {
                $hintBtn.disabled = true;
                $hintBtn.style.opacity = '0.4';
            }
        }

        /* ================================================================
           CHECK SCORE
           ================================================================ */
        function showScoreOverlay() {
            computeScore(function(score) {
                var flag = FLAGS[currentLevel];
                $scoreBig.textContent = score + '%';
                $scoreBig.className = 'score-big';

                if (score >= 90) {
                    $scoreTitle.textContent = 'Excellent!';
                    $scoreBig.classList.add('excellent');
                    $scoreMsg.textContent = 'Outstanding match! You nailed the ' + flag.name + ' flag.';
                    solvedLevels[currentLevel] = true;
                    renderLevelTabs();
                } else if (score >= flag.passThreshold) {
                    $scoreTitle.textContent = 'Passed!';
                    $scoreBig.classList.add('good');
                    $scoreMsg.textContent = 'Good enough to unlock the next flag. Can you get it even closer?';
                    solvedLevels[currentLevel] = true;
                    renderLevelTabs();
                } else if (score >= 50) {
                    $scoreTitle.textContent = 'Getting There';
                    $scoreBig.classList.add('needs-work');
                    $scoreMsg.textContent = 'You need ' + flag.passThreshold + '% to pass. Try using the hints!';
                } else {
                    $scoreTitle.textContent = 'Keep Going';
                    $scoreBig.classList.add('needs-work');
                    $scoreMsg.textContent = 'Need ' + flag.passThreshold + '% to pass. Check the hints for guidance.';
                }

                // Show next button if solved and there's a next level
                if (solvedLevels[currentLevel] && currentLevel < FLAGS.length - 1) {
                    $scoreNext.style.display = '';
                } else {
                    $scoreNext.style.display = 'none';
                }

                $scoreOverlay.classList.add('visible');
            });
        }

        /* ================================================================
           UTILITIES
           ================================================================ */
        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        /* ================================================================
           EVENT LISTENERS
           ================================================================ */
        $editor.addEventListener('input', function() {
            applyUserCSS();
            updateLineNumbers();
            scheduleScoreCheck();
        });

        $editor.addEventListener('scroll', function() {
            $lineNumbers.scrollTop = $editor.scrollTop;
        });

        // Tab key support
        $editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                applyUserCSS();
                updateLineNumbers();
                scheduleScoreCheck();
            }
        });

        $hintBtn.addEventListener('click', revealHint);

        $resetBtn.addEventListener('click', function() {
            $editor.value = FLAGS[currentLevel].starterCSS;
            applyUserCSS();
            updateLineNumbers();
            scheduleScoreCheck();
        });

        $checkBtn.addEventListener('click', showScoreOverlay);

        $scoreDismiss.addEventListener('click', function() {
            $scoreOverlay.classList.remove('visible');
        });

        $scoreNext.addEventListener('click', function() {
            $scoreOverlay.classList.remove('visible');
            if (currentLevel < FLAGS.length - 1) {
                loadLevel(currentLevel + 1);
            }
        });

        $timerToggle.addEventListener('click', function() {
            timerOn = !timerOn;
            if (timerOn) {
                $timerToggle.classList.add('active');
                $timerToggle.textContent = 'Timer: On';
                $timerDisplay.classList.add('visible');
                timerSeconds = 0;
                updateTimerDisplay();
                timerInterval = setInterval(tickTimer, 1000);
            } else {
                $timerToggle.classList.remove('active');
                $timerToggle.textContent = 'Timer: Off';
                $timerDisplay.classList.remove('visible');
                clearInterval(timerInterval);
            }
        });

        // Close overlay on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && $scoreOverlay.classList.contains('visible')) {
                $scoreOverlay.classList.remove('visible');
            }
        });

        /* ================================================================
           INIT
           ================================================================ */
        loadLevel(0);
    })();
    </script>
<script defer src="../../prompt-viewer.js"></script>
</body>
</html>
